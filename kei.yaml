version: "1.0"
permissions:
  network:
    allow:
      - "localhost"
      - "127.0.0.1"
      # Allow some external APIs if needed
      # - "api.github.com"
  filesystem:
    allow_read:
      - "/"
    allow_write:
      - "/tmp"
      - "/Users/xiamingxing/Workspace"
      - "/Users/xiamingxing/.runtime"
      - "/Users/xiamingxing/runtime"
      - "/Users/xiamingxing/Library/Mobile Documents"
  execution:
    allow_subprocess: true
