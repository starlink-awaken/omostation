# L4 Kernel 定时任务
jobs:
  - name: "l4-domain-health-scan"
    schedule: "0 6 * * *"
    script: "l4-kernel health --json"
    deliver: "local"
    timeout: 60
    enabled: true

  - name: "l4-freshness-scan"
    schedule: "0 2 * * *"
    script: "l4-kernel domain check --freshness --json"
    deliver: "local"
    timeout: 60
    enabled: true

  - name: "l4-claude-validate"
    schedule: "0 7 * * *"
    script: "l4-kernel claude validate --all --json"
    deliver: "local"
    timeout: 30
    enabled: true

  - name: "l4-governance-report"
    schedule: "0 9 * * 1"
    script: "l4-kernel governance report --all"
    deliver: "local"
    timeout: 120
    enabled: true
