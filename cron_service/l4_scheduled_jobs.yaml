# =============================================================================
# L4 Scheduled Skills — Cron Job Definitions for runtime cron-service
# =============================================================================
# 来源: ecos/src/ecos/ssot/mof/m1/skill/SKILL-SCHEDULED-*.yaml (30 skills)
# layer: L4 · 用途: cockpit CLI 定时触发各域维护任务
# 执行器: cockpit workspace context → 读取对应 skill YAML → 执行指令
# =============================================================================

