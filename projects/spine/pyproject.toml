[project]
name = "spine"
version = "0.1.0"
description = "Spine — LECP Ingress Pipeline for email/calendar signal triage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "omostation Contributors" }]
dependencies = [
    "icalendar>=5.0",
    "structlog>=24.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
