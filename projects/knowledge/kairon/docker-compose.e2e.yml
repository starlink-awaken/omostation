# kairon E2E Test Environment
# Usage: docker compose -f docker-compose.e2e.yml up -d && make test-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairon
      POSTGRES_PASSWORD: kairon_test
      POSTGRES_DB: gbrain_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairon -d gbrain_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  kairon:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kairon:kairon_test@postgres:5432/gbrain_test
      KOS_VAULT_DIR: /tmp/kos-vault
      PYTHONUNBUFFERED: 1
    volumes:
      - ./packages:/app/packages:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    command: python3 -m pytest tests/ packages/*/tests/ -v --timeout=60 -q
