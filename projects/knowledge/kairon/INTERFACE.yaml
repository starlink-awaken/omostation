# Kairon Interface Registry
project: kairon
layer: L2
description: 知识工程与研究引擎 monorepo

cli:
  - name: eidos
    module: eidos.cli:main
  - name: iris
    module: iris.cli:main
  - name: kos
    module: kos.cli.__main__:main
  - name: kronos
    module: kronos.cli:main
  - name: minerva
    module: minerva.cli:main
  - name: ontoderive
    module: ontoderive.__main__:main
    validation_pipeline:
      module: ontoderive.validation_steps
      engines:
        - ontoderive.meta_validate:MetaValidateEngine
        - ontoderive.meta_evolve:MetaEvolveEngine
      batch_states: [pending, running, completed, failed, skipped]
  - name: forge
    module: forge.forge:main
  - name: codeanalyze
    module: codeanalyze.cli:cli
  - name: sot-bridge
    module: sot_bridge.cli:main
  - name: protocols-layer
    module: protocols_layer.cli:main
    status: broken
  - name: sophia
    module: sophia.cli:main
    status: shim

mcp:
  packages: [eidos, iris, kos, kronos, minerva, ontoderive, forge, codeanalyze, sot-bridge, protocols-layer, llm-gateway-kernel]
  proxy: via agora.ProxyManager

http:
  - port: 8766
    enforcement: active
    protocol: FastAPI (uvicorn)
    owner: kos
    note: "KOS REST API v1 — 9 endpoints. Cross-project integration via HTTP."

dependencies:
  runtime: [fastmcp, httpx, structlog, pydantic, pyyaml, rich, openai, ...]
  dev: [pytest, ruff, mypy]

tests:
  command: make test-diff
  ontoderive_validation:
    - packages/ontoderive/tests/test_validation_steps.py
    - packages/ontoderive/tests/test_governance_steps.py
