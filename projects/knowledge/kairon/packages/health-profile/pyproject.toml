[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-profile"
version = "0.1.0"
description = "Health profile data models for omostation Phase 28 north-star (FamilyShared health tracking)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Workspace Team"},
]
keywords = ["health", "family", "profile", "dataclass", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "core-models",
    "pydantic>=2.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_profile"]

[tool.uv.sources]
core-models = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
