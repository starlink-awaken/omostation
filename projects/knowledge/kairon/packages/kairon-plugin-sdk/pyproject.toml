[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon-plugin-sdk"
version = "0.4.0"
description = "Plugin SDK for kairon — BosPlugin base class, PluginContext, and CLI tools"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["plugin", "sdk", "kairon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
cli = ["click>=8.0", "pyyaml>=6.0.3", "requests>=2.34.2"]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_plugin_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
