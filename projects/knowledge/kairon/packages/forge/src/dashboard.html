<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge 数字资产查询</title>
<style>
/* ─── 主题 ─── */
:root { --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --accent2: #6366f1; --ok: #22c55e; --warn: #eab308; --err: #ef4444; --info: #06b6d4; --radius: 0.5rem; --shadow: 0 1px 3px rgba(0,0,0,.3); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; background: var(--bg); color: var(--text); padding: 0; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ─── Layout ─── */
.app { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
.header h1 { font-size: 1.25rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
.header h1 span { color: var(--accent); }
.badge { font-size: 0.65rem; background: var(--surface2); color: var(--muted); padding: 0.15rem 0.4rem; border-radius: 0.25rem; }
.api-status { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--muted); }
.api-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.api-dot.online { background: var(--ok); }
.api-dot.offline { background: var(--err); }

/* ─── Tabs ─── */
.tabs { display: flex; gap: 0.125rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
.tab { padding: 0.5rem 1rem; font-size: 0.8rem; cursor: pointer; color: var(--muted); border: 0; background: none; border-bottom: 2px solid transparent; font-family: inherit; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel { display: none; }
.panel.active { display: block; }

/* ─── Search Bar ─── */
.search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.search-bar input[type=text] { flex: 1; min-width: 200px; background: #020617; border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; border-radius: var(--radius); font-size: 0.85rem; font-family: inherit; }
.search-bar input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search-bar select { background: #020617; border: 1px solid var(--border); color: var(--text); padding: 0.45rem 0.6rem; border-radius: var(--radius); font-size: 0.8rem; font-family: inherit; cursor: pointer; }
.search-bar select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn { background: var(--accent); color: #fff; border: 0; padding: 0.5rem 1rem; border-radius: var(--radius); font-size: 0.8rem; cursor: pointer; font-family: inherit; }
.btn:hover { opacity: .85; }
.btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--surface); }
.btn-ok { background: var(--ok); color: #000; }
.btn-warn { background: var(--warn); color: #000; }
.btn-err { background: transparent; border: 1px solid var(--err); color: var(--err); }

/* ─── Asset Layout ─── */
.asset-layout { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; }
@media (max-width: 800px) { .asset-layout { grid-template-columns: 1fr; } }

/* ─── Filters ─── */
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
.filters h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.5rem; }
.filter-group { margin-bottom: 1rem; }
.filter-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
.filter-group select,
.filter-group input[type=text] { width: 100%; background: #020617; border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.5rem; border-radius: 0.3rem; font-size: 0.75rem; font-family: inherit; }
.filter-group select:focus,
.filter-group input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.filter-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
.filter-tag { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.7rem; background: rgba(59,130,246,.15); color: #93c5fd; padding: 0.15rem 0.4rem; border-radius: 0.2rem; cursor: pointer; }
.filter-tag:hover { background: rgba(59,130,246,.3); }
.filter-tag .x { cursor: pointer; font-weight: bold; margin-left: 0.15rem; }

/* ─── Results ─── */
.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
.results-count { font-size: 0.8rem; color: var(--muted); }
.results-actions { display: flex; gap: 0.35rem; }

table.asset-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
table.asset-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
table.asset-table th:hover { color: var(--text); }
table.asset-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid rgba(51,65,85,.4); }
table.asset-table tr { cursor: pointer; transition: background .1s; }
table.asset-table tr:hover td { background: rgba(59,130,246,.08); }
table.asset-table tr.active td { background: rgba(59,130,246,.15); }

.status-badge { display: inline-block; padding: 0.1rem 0.35rem; border-radius: 0.2rem; font-size: 0.65rem; font-weight: 600; }
.status-active { background: rgba(34,197,94,.15); color: var(--ok); }
.status-candidate { background: rgba(234,179,8,.15); color: var(--warn); }
.status-evaluating { background: rgba(6,182,212,.15); color: var(--info); }
.status-deprecated { background: rgba(239,68,68,.15); color: var(--err); }
.status-stale { background: rgba(148,163,184,.15); color: var(--muted); }

.tag { display: inline-block; padding: 0.08rem 0.3rem; border-radius: 0.2rem; font-size: 0.65rem; background: rgba(59,130,246,.12); color: #93c5fd; margin: 0.05rem; }
.type-tag { background: rgba(99,102,241,.12); color: #a5b4fc; }

/* ─── Pagination ─── */
.pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; font-size: 0.8rem; }
.pagination .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.7rem; border-radius: 0.3rem; cursor: pointer; font-family: inherit; font-size: 0.75rem; }
.pagination .page-btn:hover { background: var(--surface2); }
.pagination .page-btn:disabled { opacity: .3; cursor: default; }
.pagination .page-info { color: var(--muted); }

/* ─── Detail Panel ─── */
.detail-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 100; }
.detail-overlay.open { display: block; }
.detail-panel { position: fixed; top: 0; right: -500px; width: 480px; max-width: 100vw; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 101; overflow-y: auto; transition: right .25s ease; box-shadow: -4px 0 20px rgba(0,0,0,.4); }
.detail-panel.open { right: 0; }
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 1.25rem 1.25rem 0.75rem; border-bottom: 1px solid var(--border); }
.detail-header h2 { font-size: 1rem; }
.detail-close { background: none; border: 0; color: var(--muted); font-size: 1.25rem; cursor: pointer; padding: 0.25rem; }
.detail-close:hover { color: var(--text); }
.detail-body { padding: 1rem 1.25rem 2rem; }
.detail-section { margin-bottom: 1rem; }
.detail-section h4 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.35rem; }
.detail-section p, .detail-section .field-value { font-size: 0.8rem; line-height: 1.5; color: var(--text); }
.detail-section .field { display: flex; justify-content: space-between; padding: 0.25rem 0; font-size: 0.78rem; border-bottom: 1px solid rgba(51,65,85,.3); }
.detail-section .field-label { color: var(--muted); }
.detail-section .field-value { color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }

/* ─── Stats ─── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
.stat-card .stat-num { font-size: 1.75rem; font-weight: 700; color: var(--text); }
.stat-card .stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
.stat-card .stat-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }

.chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
.chart-section h3 { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
.chart-bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; font-size: 0.75rem; }
.chart-bar-label { width: 120px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart-bar-track { flex: 1; height: 18px; background: #020617; border-radius: 0.25rem; overflow: hidden; position: relative; }
.chart-bar-fill { height: 100%; border-radius: 0.25rem; transition: width .3s ease; min-width: 2px; }
.chart-bar-count { width: 40px; text-align: right; color: var(--muted); font-size: 0.7rem; }

/* ─── Categories ─── */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem 1rem; cursor: pointer; transition: border-color .15s; }
.cat-card:hover { border-color: var(--accent); }
.cat-card .cat-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; display: flex; justify-content: space-between; }
.cat-card .cat-count { font-size: 0.7rem; color: var(--muted); }
.cat-card .cat-tools { margin-top: 0.5rem; font-size: 0.7rem; color: var(--muted); display: none; }
.cat-card.expanded .cat-tools { display: block; }
.cat-card .cat-tools a { display: inline-block; margin: 0.1rem 0.2rem; padding: 0.1rem 0.3rem; border-radius: 0.2rem; background: rgba(59,130,246,.1); color: #93c5fd; font-size: 0.65rem; }
.cat-card .cat-tools a:hover { background: rgba(59,130,246,.25); text-decoration: none; }

/* ─── Loader ─── */
.loading { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.85rem; }
.error-msg { text-align: center; padding: 2rem; color: var(--err); font-size: 0.85rem; }
.empty-msg { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }

/* ─── Responsive ─── */
@media (max-width: 600px) {
  .app { padding: 0.75rem; }
  .header h1 { font-size: 1rem; }
  .asset-layout { grid-template-columns: 1fr; }
  .detail-panel { width: 100vw; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .cat-grid { grid-template-columns: 1fr; }
  .chart-bar-label { width: 80px; font-size: 0.7rem; }
}

/* ─── Animations ─── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.panel.active .stat-card,
.panel.active .cat-card,
.panel.active .chart-section { animation: fadeIn .25s ease both; }
.panel.active .stat-card:nth-child(2) { animation-delay: .03s; }
.panel.active .stat-card:nth-child(3) { animation-delay: .06s; }
.panel.active .stat-card:nth-child(4) { animation-delay: .09s; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>Forge <span>数字资产查询</span></h1>
    <div class="api-status">
      <span class="api-dot offline" id="api-dot"></span>
      <span id="api-status-text">检查连接...</span>
      <span class="badge" id="schema-badge">-</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="browse">资产浏览</button>
    <button class="tab" data-tab="stats">统计概览</button>
    <button class="tab" data-tab="categories">分类词典</button>
  </div>

  <!-- ═══ Panel: 资产浏览 ═══ -->
  <div class="panel active" id="panel-browse">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜索工具名称/ID/能力..." onkeydown="if(event.key==='Enter') doSearch()">
      <select id="filter-status" onchange="doSearch()">
        <option value="">全部状态</option>
        <option value="active">活跃</option>
        <option value="candidate">候选</option>
        <option value="evaluating">评估中</option>
        <option value="deprecated">已废弃</option>
      </select>
      <select id="filter-type" onchange="doSearch()">
        <option value="">全部类型</option>
      </select>
      <button class="btn" onclick="doSearch()">搜索</button>
    </div>

    <div class="asset-layout">
      <!-- Filters -->
      <div class="filters" id="filter-panel">
        <div class="filter-group">
          <h3>分类</h3>
          <select id="filter-category" onchange="doSearch()">
            <option value="">全部</option>
          </select>
        </div>
        <div class="filter-group">
          <h3>活跃标签</h3>
          <div class="filter-tags" id="active-filters"></div>
        </div>
        <div style="margin-top:0.75rem">
          <button class="btn btn-sm btn-outline" onclick="clearFilters()" style="width:100%">清除筛选</button>
        </div>
      </div>

      <!-- Results -->
      <div>
        <div class="results-header">
          <span class="results-count" id="result-count">加载中...</span>
          <div class="results-actions">
            <button class="btn btn-sm btn-outline" onclick="exportJSON()">JSON</button>
            <button class="btn btn-sm btn-outline" onclick="exportCSV()">CSV</button>
          </div>
        </div>
        <div id="result-table-wrapper">
          <div class="loading">加载中...</div>
        </div>
        <div class="pagination" id="pagination" style="display:none">
          <button class="page-btn" id="page-prev" onclick="goPage(-1)">← 上一页</button>
          <span class="page-info" id="page-info"></span>
          <button class="page-btn" id="page-next" onclick="goPage(1)">下一页 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Panel: 统计概览 ═══ -->
  <div class="panel" id="panel-stats">
    <div class="stats-grid" id="stats-cards"></div>
    <div id="stats-charts"><div class="loading">加载统计中...</div></div>
  </div>

  <!-- ═══ Panel: 分类词典 ═══ -->
  <div class="panel" id="panel-categories">
    <div class="search-bar">
      <input type="text" id="cat-search" placeholder="搜索分类..." onkeydown="if(event.key==='Enter') renderCategories()">
      <button class="btn" onclick="renderCategories()">搜索</button>
    </div>
    <div id="cat-grid-wrapper"><div class="loading">加载分类中...</div></div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <h2 id="detail-title">-</h2>
    <button class="detail-close" onclick="closeDetail()">&times;</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
// ─── State ───
const API = 'http://localhost:8766';
let state = {
  query: '',
  category: '',
  status: '',
  type: '',
  limit: 25,
  offset: 0,
  total: 0,
  currentPage: 1,
};
let allCategories = [];
let allTypes = [];
let selectedAsset = null;

// ─── Init ───
document.addEventListener('DOMContentLoaded', () => {
  checkConnection();
  loadFilterOptions();
  doSearch();
  tabSetup();
});

// ─── Tab Setup ───
function tabSetup() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
      // Load tab content on demand
      if (t.dataset.tab === 'stats') loadStats();
      if (t.dataset.tab === 'categories') renderCategories();
    });
  });
}

// ─── Connection Check ───
async function checkConnection() {
  const dot = document.getElementById('api-dot');
  const text = document.getElementById('api-status-text');
  const badge = document.getElementById('schema-badge');
  try {
    const r = await fetch(API + '/health');
    if (!r.ok) throw new Error('status ' + r.status);
    const d = await r.json();
    dot.className = 'api-dot online';
    text.textContent = '已连接  |  ' + d.tools + ' 工具';
    badge.textContent = 'v' + (d.schema || '?');
  } catch(e) {
    dot.className = 'api-dot offline';
    text.textContent = 'API 不可达 — forge serve-api';
    badge.textContent = '-';
  }
}

// ─── Load Filter Options ───
async function loadFilterOptions() {
  try {
    const [statsR, catR] = await Promise.all([
      fetch(API + '/assets/stats'),
      fetch(API + '/assets/categories'),
    ]);
    const stats = await statsR.json();
    const cats = await catR.json();

    // Category dropdown
    const catSel = document.getElementById('filter-category');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name + ' (' + c.count + ')';
      catSel.appendChild(opt);
    });

    // Type dropdown
    const typeSel = document.getElementById('filter-type');
    Object.keys(stats.by_type || {}).sort().forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t + ' (' + stats.by_type[t] + ')';
      typeSel.appendChild(opt);
    });

    allCategories = cats;
    allTypes = Object.keys(stats.by_type || {}).sort();
  } catch(e) {
    console.warn('加载筛选选项失败:', e);
  }
}

// ─── Search ───
function doSearch() {
  state.query = document.getElementById('search-input').value.trim();
  state.category = document.getElementById('filter-category').value;
  state.status = document.getElementById('filter-status').value;
  state.type = document.getElementById('filter-type').value;
  state.offset = 0;
  state.currentPage = 1;
  fetchAssets();
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-type').value = '';
  doSearch();
}

function goPage(dir) {
  state.offset = Math.max(0, state.offset + dir * state.limit);
  state.currentPage += dir;
  fetchAssets();
}

async function fetchAssets() {
  const wrapper = document.getElementById('result-table-wrapper');
  wrapper.innerHTML = '<div class="loading">搜索中...</div>';
  document.getElementById('pagination').style.display = 'none';

  try {
    const params = new URLSearchParams();
    if (state.query) params.set('q', state.query);
    if (state.category) params.set('category', state.category);
    if (state.status) params.set('status', state.status);
    if (state.type) params.set('type', state.type);
    params.set('limit', state.limit);
    params.set('offset', state.offset);

    const r = await fetch(API + '/assets?' + params.toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    state.total = d.total;
    renderResults(d.assets);
  } catch(e) {
    wrapper.innerHTML = '<div class="error-msg">搜索失败: ' + e.message + '</div>';
  }
}

function renderResults(assets) {
  const wrapper = document.getElementById('result-table-wrapper');
  const countEl = document.getElementById('result-count');

  countEl.textContent = '共 ' + state.total + ' 个结果' +
    (state.query ? ' (搜索: "' + state.query + '")' : '');

  if (!assets || !assets.length) {
    wrapper.innerHTML = '<div class="empty-msg">无匹配结果</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  let html = '<table class="asset-table"><thead><tr>' +
    '<th>名称</th><th>ID</th><th>类型</th><th>状态</th><th>分类</th>' +
    '</tr></thead><tbody>';
  assets.forEach(t => {
    const statusCls = 'status-badge status-' + (t.status || 'unknown');
    const cats = (t.category || []).map(c => '<span class="tag">' + esc(c) + '</span>').join('');
    const typeCls = 'tag type-tag';
    html += '<tr onclick="showDetail(\'' + esc(t.id) + '\')">' +
      '<td><strong>' + esc(t.name || t.id) + '</strong></td>' +
      '<td style="color:var(--muted);font-size:0.7rem">' + esc(t.id) + '</td>' +
      '<td>' + (t.type ? '<span class="' + typeCls + '">' + esc(t.type) + '</span>' : '-') + '</td>' +
      '<td><span class="' + statusCls + '">' + esc(t.status || '-') + '</span></td>' +
      '<td>' + cats + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrapper.innerHTML = html;

  // Pagination
  const totalPages = Math.ceil(state.total / state.limit);
  const pag = document.getElementById('pagination');
  if (totalPages > 1) {
    pag.style.display = 'flex';
    document.getElementById('page-prev').disabled = state.currentPage <= 1;
    document.getElementById('page-next').disabled = state.currentPage >= totalPages;
    document.getElementById('page-info').textContent =
      '第 ' + state.currentPage + '/' + totalPages + ' 页  (显示 ' + state.offset + '-' + Math.min(state.offset + state.limit, state.total) + ')';
  } else {
    pag.style.display = 'none';
  }
}

// ─── Detail Panel ───
async function showDetail(id) {
  selectedAsset = id;
  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-title').textContent = '加载中...';
  document.getElementById('detail-body').innerHTML = '<div class="loading">加载详情...</div>';

  try {
    const r = await fetch(API + '/assets/' + encodeURIComponent(id));
    if (!r.ok) throw new Error('not found');
    const t = await r.json();
    renderDetail(t);
  } catch(e) {
    document.getElementById('detail-body').innerHTML = '<div class="error-msg">加载失败</div>';
  }
}

function renderDetail(t) {
  document.getElementById('detail-title').textContent = t.name || t.id;
  const statusCls = 'status-badge status-' + (t.status || 'unknown');

  let html = '';

  // Status + Type
  html += '<div class="detail-section">' +
    '<span class="' + statusCls + '">' + esc(t.status || '-') + '</span>  ' +
    (t.type ? '<span class="tag type-tag">' + esc(t.type) + '</span>' : '') +
    (t.cost_model ? '  <span class="tag">' + esc(t.cost_model) + '</span>' : '') +
    '</div>';

  // Basic info
  html += '<div class="detail-section">';
  html += '<h4>基本信息</h4>';
  html += '<div class="field"><span class="field-label">ID</span><span class="field-value">' + esc(t.id) + '</span></div>';
  if (t.name) html += '<div class="field"><span class="field-label">名称</span><span class="field-value">' + esc(t.name) + '</span></div>';
  if (t.added) html += '<div class="field"><span class="field-label">添加时间</span><span class="field-value">' + esc(t.added) + '</span></div>';
  if (t.updated) html += '<div class="field"><span class="field-label">更新时间</span><span class="field-value">' + esc(t.updated) + '</span></div>';
  html += '</div>';

  // Categories
  if (t.category && t.category.length) {
    html += '<div class="detail-section">';
    html += '<h4>分类</h4>';
    html += '<p>' + t.category.map(c => '<span class="tag">' + esc(c) + '</span>').join(' ') + '</p>';
    html += '</div>';
  }

  // Capabilities
  if (t.capabilities && t.capabilities.length) {
    html += '<div class="detail-section">';
    html += '<h4>能力 (' + t.capabilities.length + ')</h4>';
    html += '<p>' + t.capabilities.map(c => '<span class="tag">' + esc(c) + '</span>').join(' ') + '</p>';
    html += '</div>';
  }

  // Notes
  if (t.notes) {
    html += '<div class="detail-section">';
    html += '<h4>描述</h4>';
    html += '<p>' + esc(t.notes) + '</p>';
    html += '</div>';
  }

  // Source
  const src = t.source || {};
  html += '<div class="detail-section">';
  html += '<h4>来源</h4>';
  if (src.provider) html += '<div class="field"><span class="field-label">提供商</span><span class="field-value">' + esc(src.provider) + '</span></div>';
  if (src.type) html += '<div class="field"><span class="field-label">类型</span><span class="field-value">' + esc(src.type) + '</span></div>';
  if (src.version) html += '<div class="field"><span class="field-label">版本</span><span class="field-value">' + esc(src.version) + '</span></div>';
  if (src.url) html += '<div class="field"><span class="field-label">URL</span><span class="field-value"><a href="' + esc(src.url) + '" target="_blank">' + esc(src.url) + '</a></span></div>';
  html += '</div>';

  // Discovery
  const disc = t._discovery || {};
  html += '<div class="detail-section">';
  html += '<h4>发现信息</h4>';
  if (disc.source) html += '<div class="field"><span class="field-label">发现方式</span><span class="field-value">' + esc(disc.source) + '</span></div>';
  if (disc.first_seen) html += '<div class="field"><span class="field-label">首次发现</span><span class="field-value">' + esc(disc.first_seen) + '</span></div>';
  if (disc.confidence) html += '<div class="field"><span class="field-label">置信度</span><span class="field-value">' + disc.confidence + '</span></div>';
  html += '</div>';

  // Telemetry
  const tel = t.telemetry || {};
  if (tel.use_count !== undefined) {
    html += '<div class="detail-section">';
    html += '<h4>使用统计</h4>';
    html += '<div class="field"><span class="field-label">使用次数</span><span class="field-value">' + (tel.use_count || 0) + '</span></div>';
    if (tel.last_used) html += '<div class="field"><span class="field-label">上次使用</span><span class="field-value">' + esc(tel.last_used) + '</span></div>';
    html += '</div>';
  }

  // Install
  const inst = t.install || {};
  html += '<div class="detail-section">';
  html += '<h4>安装</h4>';
  html += '<div class="field"><span class="field-label">方式</span><span class="field-value">' + esc(inst.method || '-') + '</span></div>';
  if (inst.command) html += '<div class="field"><span class="field-label">命令</span><span class="field-value" style="font-size:0.7rem">' + esc(inst.command) + '</span></div>';
  html += '</div>';

  document.getElementById('detail-body').innerHTML = html;
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  selectedAsset = null;
}

// ─── Export ───
async function exportJSON() {
  const params = new URLSearchParams();
  if (state.query) params.set('q', state.query);
  if (state.category) params.set('category', state.category);
  if (state.status) params.set('status', state.status);
  const url = API + '/assets/export?' + params.toString();
  downloadURL(url, 'forge-assets.json');
}

async function exportCSV() {
  const params = new URLSearchParams();
  if (state.query) params.set('q', state.query);
  if (state.category) params.set('category', state.category);
  if (state.status) params.set('status', state.status);
  params.set('format', 'csv');
  const url = API + '/assets/export?' + params.toString();
  downloadURL(url, 'forge-assets.csv');
}

function downloadURL(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
}

// ─── Stats ───
async function loadStats() {
  const cardsEl = document.getElementById('stats-cards');
  const chartsEl = document.getElementById('stats-charts');
  cardsEl.innerHTML = '<div class="loading">加载统计中...</div>';
  chartsEl.innerHTML = '';

  try {
    const [statsR, catsR] = await Promise.all([
      fetch(API + '/assets/stats'),
      fetch(API + '/assets/categories'),
    ]);
    const stats = await statsR.json();
    const cats = await catsR.json();

    // Summary cards
    cardsEl.innerHTML =
      '<div class="stat-card"><div class="stat-num">' + stats.total + '</div><div class="stat-label">总资产</div><div class="stat-sub">' + Object.keys(stats.by_type).length + ' 种类型</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + (stats.by_status.active || 0) + '</div><div class="stat-label">活跃工具</div><div class="stat-sub">' + (stats.by_status.deprecated || 0) + ' 已废弃 / ' + (stats.by_status.candidate || 0) + ' 候选</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + Object.keys(stats.by_category).length + '</div><div class="stat-label">分类</div><div class="stat-sub">' + stats.total_capabilities + ' 个能力标签</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + stats.avg_capabilities + '</div><div class="stat-label">平均能力/工具</div><div class="stat-sub">' + Object.keys(stats.top_sources).length + ' 个来源</div></div>';

    // Category distribution
    const catColors = ['#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#06b6d4', '#14b8a6', '#22c55e', '#eab308', '#f97316', '#ef4444'];
    let catHtml = '<div class="chart-section"><h3>分类分布 (Top 15)</h3>';
    const topCats = cats.slice(0, 15);
    const maxCount = topCats.length > 0 ? topCats[0].count : 1;
    topCats.forEach((c, i) => {
      const pct = (c.count / maxCount * 100).toFixed(0);
      catHtml += '<div class="chart-bar-row">' +
        '<span class="chart-bar-label" title="' + esc(c.name) + '">' + esc(c.name) + '</span>' +
        '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%;background:' + catColors[i % catColors.length] + '"></div></div>' +
        '<span class="chart-bar-count">' + c.count + '</span>' +
        '</div>';
    });
    catHtml += '</div>';

    // Status distribution
    const statusColors = { active: '#22c55e', candidate: '#eab308', evaluating: '#06b6d4', deprecated: '#ef4444', stale: '#94a3b8' };
    const statusNames = { active: '活跃', candidate: '候选', evaluating: '评估中', deprecated: '已废弃', stale: '过时' };
    let statusHtml = '<div class="chart-section"><h3>状态分布</h3>';
    const maxStatus = Math.max(...Object.values(stats.by_status), 1);
    Object.entries(stats.by_status).forEach(([k, v]) => {
      const pct = (v / maxStatus * 100).toFixed(0);
      const color = statusColors[k] || '#94a3b8';
      statusHtml += '<div class="chart-bar-row">' +
        '<span class="chart-bar-label">' + (statusNames[k] || k) + '</span>' +
        '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<span class="chart-bar-count">' + v + '</span>' +
        '</div>';
    });
    statusHtml += '</div>';

    // Type distribution
    let typeHtml = '<div class="chart-section"><h3>类型分布</h3>';
    const maxType = Math.max(...Object.values(stats.by_type), 1);
    const typeArr = Object.entries(stats.by_type).sort((a, b) => b[1] - a[1]);
    typeArr.forEach(([k, v], i) => {
      const pct = (v / maxType * 100).toFixed(0);
      typeHtml += '<div class="chart-bar-row">' +
        '<span class="chart-bar-label">' + esc(k) + '</span>' +
        '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%;background:' + catColors[i % catColors.length] + '"></div></div>' +
        '<span class="chart-bar-count">' + v + '</span>' +
        '</div>';
    });
    typeHtml += '</div>';

    chartsEl.innerHTML = catHtml + statusHtml + typeHtml;
  } catch(e) {
    cardsEl.innerHTML = '<div class="error-msg">加载统计失败: ' + e.message + '</div>';
  }
}

// ─── Categories ───
async function renderCategories() {
  const wrapper = document.getElementById('cat-grid-wrapper');
  wrapper.innerHTML = '<div class="loading">加载分类中...</div>';

  try {
    const r = await fetch(API + '/assets/categories');
    let cats = await r.json();
    const q = document.getElementById('cat-search').value.trim().toLowerCase();
    if (q) cats = cats.filter(c => c.name.toLowerCase().includes(q));

    if (!cats.length) {
      wrapper.innerHTML = '<div class="empty-msg">无匹配分类</div>';
      return;
    }

    let html = '<div class="cat-grid">';
    cats.forEach(c => {
      html += '<div class="cat-card" onclick="toggleCategory(this)" data-cat="' + esc(c.name) + '">' +
        '<div class="cat-name"><span>' + esc(c.name) + '</span><span style="color:var(--accent);font-size:0.75rem">' + c.count + '</span></div>' +
        '<div class="cat-count">' + c.count + ' 个工具</div>' +
        '<div class="cat-tools" id="cat-tools-' + esc(c.name.replace(/\s+/g, '-')) + '"><div class="loading" style="padding:0.5rem 0;font-size:0.7rem">加载中...</div></div>' +
        '</div>';
    });
    html += '</div>';
    wrapper.innerHTML = html;
  } catch(e) {
    wrapper.innerHTML = '<div class="error-msg">加载分类失败: ' + e.message + '</div>';
  }
}

async function toggleCategory(el) {
  const isExpanded = el.classList.contains('expanded');
  el.classList.toggle('expanded');

  if (!isExpanded) {
    const name = el.dataset.cat;
    const toolsEl = el.querySelector('.cat-tools');
    try {
      const r = await fetch(API + '/assets?category=' + encodeURIComponent(name) + '&limit=50');
      const d = await r.json();
      if (d.assets && d.assets.length) {
        toolsEl.innerHTML = d.assets.map(t =>
          '<a href="#" onclick="event.preventDefault();showDetail(\'' + esc(t.id) + '\')">' + esc(t.id) + '</a>'
        ).join('');
      } else {
        toolsEl.innerHTML = '<span style="color:var(--muted)">无工具</span>';
      }
    } catch(e) {
      toolsEl.innerHTML = '<span style="color:var(--err)">加载失败</span>';
    }
  }
}

// ─── Utility ───
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
