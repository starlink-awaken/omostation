[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "1.3.0"
description = "个人 AI 数字资产管理中心 — 统一工具注册、发现与治理层"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "tool-registry", "mcp", "asset-management"]
dependencies = ["fastmcp>=3.4.2"]

[project.scripts]
forge = "forge.forge:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
