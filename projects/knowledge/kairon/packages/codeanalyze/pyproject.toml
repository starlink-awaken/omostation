[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanalyze"
version = "0.5.0"
description = "Unified code & document analysis toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["code-analysis", "knowledge-graph", "document-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "eidos",
    "click>=8.0",
    "rich>=13.0",
    "core-models",
    "radon>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.6.0"]
mcp = ["fastmcp>=3.4.2"]

[project.scripts]
codeanalyze = "codeanalyze.cli:cli"
policydoc = "policydoc.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/codeanalyze", "src/policydoc"]

[tool.hatch.version]
path = "src/codeanalyze/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
