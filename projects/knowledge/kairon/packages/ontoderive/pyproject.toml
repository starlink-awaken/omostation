[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontoderive"
version = "3.6.4"
description = "OntoDerive 渊衍框架 — 事实驱动的一体化知识工程与方案推导"
authors = [{name = "Summer"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["knowledge-engineering", "ontology", "derivation", "fact-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.3",
    "fastmcp>=3.4.2",
    "core-models",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
llm = ["openai>=2.41.1"]
web = ["fastapi>=0.128.8", "uvicorn>=0.49.0"]

[project.scripts]
ontoderive = "ontoderive.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoderive"]

[tool.hatch.version]
path = "src/ontoderive/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

