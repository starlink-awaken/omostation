[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris"
version = "0.3.0"
description = "Connector hub for personal knowledge platforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "xiamingxing"}]
keywords = ["connector", "knowledge", "note", "sync", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "eidos",
    "kronos",
    "minerva",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.6.0"]

[project.scripts]
iris = "iris.cli:main"

[project.entry-points."iris.connectors"]
local_files = "iris.connectors.local_files:LocalFilesConnector"
obsidian = "iris.connectors.obsidian:ObsidianConnector"
openhuman = "iris.connectors.openhuman:OpenHumanConnector"
wpsnote = "iris.connectors.wpsnote:WPSNoteConnector"
notebooklm = "iris.connectors.notebooklm:NotebookLMConnector"
zhihu = "iris.connectors.zhihu:ZhihuConnector"
wxread = "iris.connectors.wxread:WXReadConnector"
telegram = "iris.connectors.telegram:TelegramConnector"
wechat = "iris.connectors.wechat:WeChatConnector"
pocket = "iris.connectors.pocket:PocketConnector"
polar = "iris.connectors.polar:PolarConnector"
applenotes = "iris.connectors.applenotes:AppleNotesConnector"
github = "iris.connectors.github:GitHubConnector"
dingtalk = "iris.connectors.dingtalk:DingTalkConnector"
feishu = "iris.connectors.feishu:FeishuConnector"
apple_mail = "iris.connectors.apple_mail:AppleMailConnector"
netease_mailmaster = "iris.connectors.netease_mailmaster:NeteaseMailmasterConnector"
seeyon_oa = "iris.connectors.seeyon_oa:SeeyonOAConnector"
cua_browser = "iris.connectors.cua_browser:CuaBrowserConnector"
universal_private = "iris.connectors.universal_private:UniversalPrivateConnector"

[project.entry-points."external.resources"]
local_files = "iris.connectors.local_files:LocalFilesConnector"
obsidian = "iris.connectors.obsidian:ObsidianConnector"
openhuman = "iris.connectors.openhuman:OpenHumanConnector"
wpsnote = "iris.connectors.wpsnote:WPSNoteConnector"
notebooklm = "iris.connectors.notebooklm:NotebookLMConnector"
zhihu = "iris.connectors.zhihu:ZhihuConnector"
wxread = "iris.connectors.wxread:WXReadConnector"
telegram = "iris.connectors.telegram:TelegramConnector"
wechat = "iris.connectors.wechat:WeChatConnector"
pocket = "iris.connectors.pocket:PocketConnector"
polar = "iris.connectors.polar:PolarConnector"
applenotes = "iris.connectors.applenotes:AppleNotesConnector"
github = "iris.connectors.github:GitHubConnector"
dingtalk = "iris.connectors.dingtalk:DingTalkConnector"
feishu = "iris.connectors.feishu:FeishuConnector"
apple_mail = "iris.connectors.apple_mail:AppleMailConnector"
netease_mailmaster = "iris.connectors.netease_mailmaster:NeteaseMailmasterConnector"
seeyon_oa = "iris.connectors.seeyon_oa:SeeyonOAConnector"
cua_browser = "iris.connectors.cua_browser:CuaBrowserConnector"
universal_private = "iris.connectors.universal_private:UniversalPrivateConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
eidos = { workspace = true }
kronos = { workspace = true }
minerva = { workspace = true }
