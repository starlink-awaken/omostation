version: 0.1.0
updated: 2026-05-15
default_policy:
  mode: read_only_first
  requires_work_packet: true
  requires_run_record: true
  output_is_advisory_until_integrated: true
  forbidden_without_human_approval:
    - delete_or_move_files
    - git_commit
    - git_push
    - production_api_call
    - credential_or_secret_change
    - system_configuration_change
    - scheduled_job_change
    - external_project_write
