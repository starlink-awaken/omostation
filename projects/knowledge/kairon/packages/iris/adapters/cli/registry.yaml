    acp_smoke:
      date: 2026-05-16
      result: passed
      run_id: run-20260516094928-18978-copilot-acp
      note: "initialize/session/new/session/prompt completed over ACP stdio with protocolVersion=1 and streamed ACP_OK."
    acp_scoped_write:
      date: 2026-05-16
      result: failed_timeout
      run_ids:
        - run-20260516110318-44748-copilot-acp
        - run-20260516110555-46289-copilot-acp
      note: "ACP write prompt timed out twice and did not create the scoped proof artifact."
    programmatic_write:
      date: 2026-05-16
      result: passed
      command_shape: "-p <prompt> --no-custom-instructions --no-ask-user --no-remote --disable-builtin-mcps --available-tools='apply_patch,create,edit,view' --allow-all-tools --deny-tool=shell --deny-tool=url --share <artifact>"
      proof: artifacts/copilot/wp049/copilot-programmatic-write-proof.txt
      session: artifacts/copilot/wp049/copilot-programmatic-session.md
      note: "Use programmatic CLI for bounded artifact writes; ACP remains better for session smoke and capability discovery."
    default_mode: scoped_worker
    risk_level: medium
    requires_review: true
    first_allowed_tasks:
      - create_schema_drafts
      - fill_template_sections
      - propose_test_cases
      - update_isolated_artifacts
    forbidden_tasks:
