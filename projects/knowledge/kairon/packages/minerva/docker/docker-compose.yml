# Minerva Platform — Docker Compose 全家桶
# docker compose up -d            # 基础 (SearXNG + Minerva)
# docker compose --profile full up -d  # 全家桶 (含 Neo4j + Sophia + Agora)

services:
  # ── Tier 1: Search Infrastructure ──

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: minerva-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      # Image has wget not curl; no /health endpoint — probe /
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Tier 2: Knowledge Graph ──

  neo4j:
    image: neo4j:5-community
    container_name: minerva-neo4j
    profiles: ["full"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_server_memory_pagecache_size=256M
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped
    healthcheck:
      # CMD (exec) does not expand shell ${VAR:-default}; use fixed default matching
      # NEO4J_AUTH above. Override via compose env NEO4J_PASSWORD only if you also
      # change this probe password in lockstep (or switch to CMD-SHELL).
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Minerva: Deep Research Engine ──

  minerva:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minerva-web
    ports:
      - "8765:8765"
    volumes:
      - minerva_knowledge:/root/knowledge
      - minerva_reports:/root/minerva/reports
      - minerva_state:/root/minerva/state
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - LONGCAT_API_KEY=${LONGCAT_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - METASO_API_KEY=${METASO_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NEO4J_URI=bolt://neo4j:7687
      - SEARXNG_URL=http://searxng:8080
      - MINERVA_API_KEY=${MINERVA_API_KEY:-}
      - MINERVA_LOG_LEVEL=${MINERVA_LOG_LEVEL:-info}
    command: ["minerva", "web"]
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Sophia: Paradigm Engine (MCP) ──

  sophia:
    build:
      context: ../../sophia
      dockerfile: Dockerfile
    container_name: sophia-mcp
    profiles: ["full"]
    ports:
      - "9001:9001"
    volumes:
      - sophia_traces:/root/sophia/traces
    command: ["sophia-mcp"]
    restart: unless-stopped

  # ── Agora: Service Convergence Hub (MCP) ──

  agora:
    build:
      context: ../../agora
      dockerfile: Dockerfile
    container_name: agora-hub
    profiles: ["full"]
    ports:
      - "9000:9000"
    command: ["agora-mcp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
  minerva_knowledge:
  minerva_reports:
  minerva_state:
  sophia_traces:
