services:
  # --- Tier 1: Core infrastructure (must be available) ---

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: minerva-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      # Image has wget not curl; no /health endpoint — probe /
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Tier 2: Enhanced (graceful degradation supported) ---

  neo4j:
    image: neo4j:5-community
    container_name: minerva-neo4j
    profiles: ["tier2"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    restart: unless-stopped

  # --- Optional: External tool integrations ---

  # Uncomment if using NotebookLM helper
  # notebooklm-bridge:
  #   image: ghcr.io/minerva/notebooklm-bridge:latest
  #   profiles: ["creative"]
  #   ports:
  #     - "8765:8765"
  #   environment:
  #     - GOOGLE_API_KEY=${GOOGLE_API_KEY}
