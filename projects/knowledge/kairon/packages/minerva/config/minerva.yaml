# Minerva Configuration

system:
  name: "Minerva"
  version: "0.1.0"
  data_dir: "~/minerva"
  state_dir: "~/minerva/state"
  knowledge_dir: "~/knowledge"

# Tier 1 — Hard dependencies (system fails without these)
tier1:
  llm:
    provider: "ollama"
    base_url: "http://localhost:11434/v1"
    models:
      # Align to host Ollama tags (2026-07-23 smoke: gemma4 + north-mini only).
      # Override via editing this file or local ~/.minerva/config if models change.
      agent: "gemma4:31b-mlx"       # Fast / general (was qwen3.6 nvfp4 — not on host)
      reasoning: "gemma4:31b-mlx"   # Deep reasoning fallback to same host model
      writer: "gemma4:31b-mlx"      # Long-form generation
    defaults:
      temperature: 0.6
      top_p: 0.95
      context_size: 16384

  search:
    searxng:
      base_url: "http://localhost:8080"
      enabled: true

  knowledge:
    sqlite_path: "~/minerva/knowledge.db"
    lancedb_path: "~/minerva/vectors"
    wiki_path: "~/knowledge/wiki"
    embedding_model: "all-MiniLM-L6-v2"
    embedding_dim: 384

  nlp:
    spacy_model: "en_core_web_lg"
    spacy_model_zh: "zh_core_web_sm"

# Tier 2 — Enhanced (gracefully degrade when missing)
tier2:
  graphiti:
    enabled: false  # Enable after Phase 2
    backend: "neo4j"
    neo4j_uri: "bolt://localhost:7687"
    neo4j_user: "neo4j"
    neo4j_password: "${NEO4J_PASSWORD}"

  semantica:
    enabled: false  # Enable after Phase 2
    ontology_path: "config/ontology.yaml"
    shacl_shapes_path: "config/shacl_shapes.ttl"

  search_apis:
    exa:
      enabled: true
      api_key: "${EXA_API_KEY}"
      free_queries_per_month: 1000
    jina:
      enabled: false
      api_key: "${JINA_API_KEY}"
      free_tokens_per_month: 10000000
    metaso:
      enabled: true
      api_key: "${METASO_API_KEY}"
    semantic_scholar:
      enabled: true
      api_key: ""  # Optional, works without key

  creative:
    notebooklm:
      enabled: false
      free_per_month: 10

# Cloud LLM APIs (cost-gated)
cloud_llm:
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    models:
      flash: "deepseek-v4-flash"      # $0.14/$0.28 per 1M tokens
      pro: "deepseek-v4-pro"          # $1.74/$3.48 per 1M tokens
  glm:
    api_key: "${GLM_API_KEY}"
    model: "glm-5"                    # $1.00/$3.20 per 1M tokens

# Execution
execution:
  cost_guard:
    monthly_budget_usd: 50.0
    warn_threshold: 0.80  # 80% → yellow warning
    block_threshold: 1.00  # 100% → block cloud, allow local only
    per_level_max_cost:
      L0: 0.00
      L1: 0.00
      L2: 1.00
      L3: 5.00
      L4: 15.00

  triage:
    model: "gemma4:31b-mlx"
    max_latency_ms: 2000

# Pipeline defaults
pipeline:
  L0:
    max_latency_s: 30
    max_sources: 5
  L1:
    max_latency_s: 180
    max_sub_questions: 5
    max_sources: 10
  L2:
    max_latency_s: 900
    max_sub_questions: 10
    max_sources: 25
    deep_read_top_n: 15
  L3:
    max_latency_s: 1800
    max_sub_questions: 15
    academic_depth: true
    counter_argument: true
  L4:
    max_latency_s: 3600
    multi_model_voting: true
    human_checkpoints: true
