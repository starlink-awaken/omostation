# Minerva Ontology — Entity Types and Relations

version: "0.1.0"
description: "Core ontology for Minerva deep research knowledge base"

entity_types:
  Domain:
    description: "Top-level knowledge domain"
    properties: [name, parent_domain, description]

  Organization:
    description: "Company, lab, university, regulatory body, open-source community"
    properties: [name, aliases, country, org_type, founded, parent_org, status]
    org_type_enum: [company, lab, university, regulator, oss_community, government, ngo]

  Person:
    description: "Individual researcher, executive, public figure"
    properties: [name, aliases, affiliations, roles, research_interests, h_index]

  Product:
    description: "Technology product, model, framework, chip, software, service, standard"
    properties: [name, version, product_type, organization, license, pricing, key_metrics]
    product_type_enum: [llm, framework, chip, software, service, standard, dataset, api]

  Publication:
    description: "Paper, preprint, blog post, report, patent, news article"
    properties: [title, authors, venue, published_date, pub_type, url, citation_count]
    pub_type_enum: [paper, preprint, blog, report, patent, news, book, documentation]

  Concept:
    description: "Algorithm, architecture, paradigm, theory, best practice"
    properties: [name, aliases, domain, maturity, first_proposed_date, description]
    maturity_enum: [emerging, growing, mature, declining, obsolete]

  Metric:
    description: "Benchmark score, price, performance measurement"
    properties: [name, value, unit, measured_date, measured_condition, source_id]

  Event:
    description: "Product launch, acquisition, funding, policy change, conference"
    properties: [name, event_type, date, impact_scope, certainty]
    event_type_enum: [launch, acquisition, funding, policy, conference, breakthrough, crisis]
    certainty_enum: [confirmed, reported, rumored]

  Claim:
    description: "Assertion about facts, analysis, predictions, or opinions"
    properties: [text, claim_type, confidence, evidence_count, contradictor_ids, staleness_date]
    claim_type_enum: [fact, analysis, prediction, opinion, unverified]

  Timeline:
    description: "Ordered sequence of events for an entity or topic"
    properties: [entity_id, events, start_date, end_date, granularity]

relation_types:
  CREATED_BY:
    description: "Product/Publication created by Organization/Person"
    domain: [Product, Publication]
    range: [Organization, Person]

  PUBLISHED_IN:
    description: "Publication published in venue/on date"
    domain: [Publication]
    range: [Venue]

  CITES:
    description: "Publication cites Publication"
    domain: [Publication]
    range: [Publication]

  COMPETES_WITH:
    description: "Product/Organization competes with Product/Organization"
    domain: [Product, Organization]
    range: [Product, Organization]

  ENABLES:
    description: "Concept/Product enables Product/Capability"
    domain: [Concept, Product]
    range: [Product, Concept]

  IMPROVES:
    description: "New version improves upon old version"
    domain: [Product, Concept]
    range: [Product, Concept]

  OBSOLETES:
    description: "New thing makes old thing obsolete"
    domain: [Product, Concept, Method]
    range: [Product, Concept, Method]

  BELONGS_TO:
    description: "Person belongs to Organization"
    domain: [Person]
    range: [Organization]

  SUPPORTS:
    description: "Evidence supports Claim"
    domain: [Publication, Metric, DataPoint]
    range: [Claim]

  CONTRADICTS:
    description: "Claim contradicts Claim"
    domain: [Claim]
    range: [Claim]

  PART_OF:
    description: "Component is part of System"
    domain: [Product, Concept]
    range: [Product, Concept, System]

  PRECEDES:
    description: "Event temporally precedes Event"
    domain: [Event]
    range: [Event]

  MEASURED_BY:
    description: "Product measured by Metric"
    domain: [Product]
    range: [Metric]
