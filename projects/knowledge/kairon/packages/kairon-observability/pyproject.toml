[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon-observability"
version = "0.4.0"
description = "Observability toolkit for kairon — metrics, alerts, anomaly detection, dashboards, SLO tracking"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["observability", "metrics", "alerts", "anomaly", "dashboard", "slo", "kairon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "deepeval>=4.0.6",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
