[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon-pipeline"
version = "0.4.0"
description = "D-Harvest data pipeline — sources, extractors, quality gates, and downstream integration"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["pipeline", "extractors", "quality", "sources", "harvest", "kairon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
]

[dependency-groups]
dev = [
    "bus-foundation",
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_pipeline"]

[tool.uv.sources]
bus-foundation = { path = "../../../bus-foundation" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
