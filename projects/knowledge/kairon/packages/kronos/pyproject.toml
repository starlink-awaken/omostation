[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kronos"
version = "0.7.0"
description = "Kronos — 知识摄取管线。L0原生HTTP / L2 Jina / L4 CloakBrowser / 5层自动抓取引擎"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Workspace Team"}
]
keywords = ["knowledge", "pipeline", "ingestion", "content", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "cloakbrowser>=0.1",
    "scrapling>=0.4",
    "core-models",
]

[project.scripts]
kronos = "kronos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
