[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sophia"
version = "1.0.0"
description = "符号化研究范式编译器 — 状态机驱动的研究方法运行时"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["paradigm", "compiler", "state-machine", "reasoning"]

[project.scripts]
sophia = "sophia.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/sophia"]
