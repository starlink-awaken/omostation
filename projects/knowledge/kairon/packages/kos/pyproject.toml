[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kos"
version = "2.0.0"
description = "Knowledge Operating System — cross-domain search, ontology, and deep research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kos Contributors"}]
keywords = ["knowledge", "search", "ontology", "cli"]

dependencies = [
    "eidos",
    "fastapi>=0.128.8",
    "python-docx>=0.8.11",
    "PyMuPDF>=1.23.0",
    "openpyxl>=3.1.0",
    "jieba>=0.42",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
mem0 = ["mem0ai"]

[project.scripts]
kos = "kos.cli.__main__:main"
kairon-cli = "kos.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
