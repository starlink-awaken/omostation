# Memory OS Neo4j (standalone) — Phase 6/7 production graph
# Prefer this when Docker is healthy; brew fallback: docs/operations/memory-os-neo4j-local.md
#
#   docker compose -f projects/kairon/packages/mos/docker-compose.yml up -d
#   export NEO4J_URI=bolt://localhost:7687 NEO4J_USER=neo4j NEO4J_PASSWORD=changeme

services:
  neo4j:
    image: neo4j:5-community
    container_name: mos-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - mos_neo4j_data:/data
      - mos_neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_server_memory_pagecache_size=256M
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped
    healthcheck:
      # literal password matches default NEO4J_AUTH (CMD does not expand ${VAR})
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

volumes:
  mos_neo4j_data:
  mos_neo4j_logs:
