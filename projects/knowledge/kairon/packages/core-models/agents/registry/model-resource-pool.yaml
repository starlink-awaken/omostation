version: 0.1.0
updated: 2026-05-15
principles:
  cli_is_execution_shell: true
  model_is_replaceable_resource: true
  conductor_selects_model_per_task: true
  outputs_are_advisory_until_integrated: true
default_routing:
  implementation_worker: copilot
  adversarial_review: gemini
  final_preflight: claude_code
  implementation_planning: droid_glm47
  product_quality_review: mmx_minimax25
  product_style_review: crush_minimax25
  local_privacy_review: lmstudio_local
  local_fallback_review: ollama_local
  knowledge_retrieval: kos
resources:
  codex:
    cli: codex
    current_model: inherited
    model_variability: high
    status: active
    strengths:
      - conductor_orchestration
      - integration
      - validation
      - controlled_write
    use_when:
      - ssot_update
      - final_acceptance
      - multi_agent_coordination
    avoid_when:
      - cheap_parallel_review_can_be_delegated
  copilot:
    cli: /opt/homebrew/bin/copilot
    current_model: gpt-5.4
    model_variability: high
    status: programmatic_write_tested
    strengths:
      - scoped_file_edits
      - boilerplate
      - schema_fixtures
      - small_tests
    use_when:
      - exact_write_scope_exists
      - output_can_be_verified_by_conductor
    avoid_when:
      - architecture_decision
      - governance_policy
      - broad_refactor
    acp_smoke:
      date: 2026-05-16
      result: passed
      run_id: run-20260516094928-18978-copilot-acp
      note: "Copilot CLI 1.0.48 completed ACP initialize -> session/new -> session/prompt; raw prompt fallback remains non-critical only."
    acp_scoped_write:
      date: 2026-05-16
      result: failed_timeout
      run_ids:
        - run-20260516110318-44748-copilot-acp
        - run-20260516110555-46289-copilot-acp
      note: "Do not assign Copilot ACP autonomous writes until permission/session completion contract is understood."
    programmatic_write:
      date: 2026-05-16
      result: passed
      proof: artifacts/copilot/wp049/copilot-programmatic-write-proof.txt
      session: artifacts/copilot/wp049/copilot-programmatic-session.md
      recommended_for:
        - isolated_artifact_edits
        - generated_review_docs
        - schema_fixture_generation
      required_flags:
        - --no-custom-instructions
        - --no-ask-user
        - --no-remote
        - --disable-builtin-mcps
        - --available-tools=apply_patch,create,edit,view
        - --allow-all-tools
        - --deny-tool=shell
        - --deny-tool=url
  claude_code:
    cli: claude
    current_model: user_configured_default
    detected_version: "2.1.141"
    model_variability: high
    status: active
    strengths:
      - deep_reasoning
      - final_preflight
      - architecture_consistency
      - governance_edge_cases
    use_when:
      - before_starting_scoped_implementation
      - resolving_conflicting_reviews
    avoid_when:
      - cheap_short_review
      - deterministic_machine_validation
  gemini:
    cli: gemini
    current_model: user_configured_default
    model_variability: high
    status: active
    strengths:
      - adversarial_review
      - contradiction_detection
      - alternative_designs
      - long_context_critique
    use_when:
      - challenge_a_plan
      - find_missing_acceptance_criteria
    avoid_when:
      - canonical_integration
      - direct_writes
  droid_glm47:
    cli: droid
    current_model: custom:GLM-4.7-[GLM-Coding-Plan-China]---Openai-1
    preferred_model_family: glm
    model_variability: medium
    status: active
    strengths:
      - implementation_preflight
      - file_scope_analysis
      - dependency_mapping
      - validation_gap_analysis
    use_when:
      - before_assigning_copilot_worker
      - implementation_paths_are_unclear
    avoid_when:
      - product_copy_review
  crush_minimax25:
    cli: crush
    current_model: minimax-china/MiniMax-M2.5
    preferred_model_family: minimax
    model_variability: medium
    status: active
    strengths:
      - product_quality_review
      - acceptance_criteria_review
      - user_workflow_critique
      - concise_narrative_feedback
    use_when:
      - product_value_needs_review
      - cli_agent_wrapper_context_is_useful
    avoid_when:
      - strict_json_stdout_required
    distinction: "Crush is a general agent wrapper using MiniMax China here; it is not the same CLI as mmx."
  mmx_minimax25:
    cli: mmx
    current_model: MiniMax-M2.5
    region: cn
    preferred_model_family: minimax
    model_variability: medium
    status: active
    strengths:
      - headless_text_review
      - json_stdout
      - concise_summary
      - minimax_native_capabilities
    use_when:
      - deterministic_headless_minimax_output_needed
      - operator_summary_or_quality_review
    avoid_when:
      - full_agentic_file_navigation_needed
    distinction: "MMX is MiniMax dedicated CLI; prefer it over Crush when stable stdout evidence is required."
  trae_ide:
    cli: trae
    current_model: user_selected_in_ide
    model_variability: high
    status: manual_bridge
    strengths:
      - ide_context
      - manual_builder_sessions
      - subscription_model_access
    use_when:
      - human_drives_ide_session
      - visual_or_builder_context_needed
    avoid_when:
      - automated_dbos_agent_run
  antigravity:
    cli: antigravity
    current_model: user_selected_in_ide
    model_variability: high
    status: candidate_not_detected
    strengths:
      - ide_agent_manager_candidate
      - visual_artifact_review_candidate
    use_when:
      - deterministic_bridge_available
    avoid_when:
      - current_automated_execution
  opencode:
    cli: opencode
    current_model: opencode-go/deepseek-v4-flash
    alternate_models:
      - opencode-go/deepseek-v4-pro
      - opencode/deepseek-v4-flash-free
      - deepseek/deepseek-v4-flash
      - deepseek/deepseek-v4-pro
    model_variability: high
    status: smoke_tested
    strengths:
      - scoped_code_edits
      - local_refactors
      - implementation_repair
      - bounded_module_pass
    use_when:
      - copilot_needs_second_worker_pass
      - deepseek_v4_is_preferred_for_code_task
      - bounded_code_module_after_artifact_write_trial
    avoid_when:
      - canonical_write_without_explicit_scope
      - reviewer_agent_name_is_required
    smoke_test:
      date: 2026-05-15
      result: ok
      note: "opencode-go/deepseek-v4-flash returned OK; named reviewer agent fell back to default agent."
  kilocode_free:
    cli: kilocode
    current_model: kilo/kilo-auto/free
    alternate_models:
      - kilo/deepseek/deepseek-v4-flash:free
      - kilo/deepseek/deepseek-v4-flash
      - kilo/deepseek/deepseek-v4-pro
      - kilo/minimax/minimax-m2.5
    model_variability: high
    status: smoke_tested
    strengths:
      - free_tier_parallel_review
      - short_plan_critique
      - prompt_sanity_check
      - low_cost_small_artifact_draft
    use_when:
      - cheap_parallel_review_needed
      - non_blocking_second_opinion_needed
      - isolated_artifact_write_trial
    avoid_when:
      - quota_or_free_tier_uncertain_for_critical_path
      - direct_canonical_write
    smoke_test:
      date: 2026-05-15
      result: ok
      note: "kilo/kilo-auto/free returned OK through JSON event output."
  ollama_local:
    cli: ollama
    current_model: qwen3.6:27b-coding-nvfp4
    alternate_models:
      - qwen3.6:35b-a3b-coding-nvfp4
      - gemma4:e4b
      - qwen3.5:4b
    model_variability: medium
    status: inventory_verified
    strengths:
      - local_private_review
      - offline_fallback
      - low_cost_parallel_critique
      - local_code_draft
    use_when:
      - private_source_cannot_leave_local_runtime
      - cloud_quota_pressure
      - non_critical_parallel_review
    avoid_when:
      - high_risk_final_acceptance
      - canonical_write_without_scope
  lmstudio_local:
    cli: lms
    current_model: mlx-qwopus3.5-27b-v3
    alternate_models:
      - qwen3.6-27b-mlx
      - zai-org/glm-4.7-flash
      - gemma-4-31b-it-mlx
      - text-embedding-nomic-embed-text-v1.5
    model_variability: high
    status: smoke_tested_loaded_model
    strengths:
      - local_high_context_review
      - local_reasoning_critique
      - embedding_pipeline_candidate
      - private_data_analysis
    use_when:
      - local_reasoning_needed
      - memory_embedding_pipeline_design
      - privacy_first_review
    avoid_when:
      - high_risk_final_acceptance
      - canonical_write_without_scope
    smoke_test:
      date: 2026-05-15
      result: ok
      note: "mlx-qwopus3.5-27b-v3 is loaded and returned OK through lms chat."
  kos:
    cli: kos
    current_model: tool_pipeline_default
    model_variability: medium
    status: registered_not_exercised
    strengths:
      - local_search
      - evidence_retrieval
      - ontology_operations
      - knowledge_audit
    use_when:
      - source_discovery
      - evidence_mapping
      - local_knowledge_probe
    avoid_when:
      - direct_canonical_write
selection_rules:
  - "Use Copilot for scoped writes only after exact paths are granted."
  - "Use Gemini before implementation for adversarial review."
  - "Use Droid before Copilot when file scope or validation plan is unclear."
  - "Use Claude Code as final preflight when several reviewers disagree or a boundary issue remains."
  - "Use MMX when MiniMax output must be captured headlessly and deterministically."
  - "Use Crush when product-quality review benefits from an agent wrapper and natural critique."
  - "Use Trae and Antigravity only as manual IDE bridges until stdout/headless automation is proven."
  - "Use OpenCode as a secondary scoped worker after a bounded artifact-write trial."
  - "Use KiloCode free tier for cheap parallel reviews and short non-critical drafts."
  - "Use LM Studio local models for privacy-first review and embedding-related planning."
  - "Use Ollama as local fallback reviewer when cloud quota or connectivity is constrained."
