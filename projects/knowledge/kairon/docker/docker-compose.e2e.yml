# kairon E2E Test Environment
# Usage:
#   docker compose -f docker/docker-compose.e2e.yml up -d
#   make test-e2e
#   docker compose -f docker/docker-compose.e2e.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairon
      POSTGRES_PASSWORD: kairon_test
      POSTGRES_DB: gbrain_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairon -d gbrain_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  kairon-e2e:
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kairon:kairon_test@postgres:5432/gbrain_test
      KOS_VAULT_DIR: /tmp/kos-vault
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ../packages:/app/packages:ro
      - ../tests:/app/tests:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
      - ontoderive-e2e-logs:/app/packages/ontoderive/examples/z-park/_derivation_logs
    command: sleep infinity
    networks:
      - kairon-e2e-net

networks:
  kairon-e2e-net:
    driver: bridge

volumes:
  ontoderive-e2e-logs:
