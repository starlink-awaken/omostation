version: "3.8"

# kairon E2E 测试环境
# 用法: make test-e2e 或 docker compose up --build --abort-on-container-exit

services:
  # ── PostgreSQL (gbrain + kairon 共用) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairon
      POSTGRES_PASSWORD: kairon_test
      POSTGRES_DB: kairon_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairon"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # 内存存储，测试更快

  # ── gbrain (知识数据库) ──
  gbrain:
    build:
      context: ../../gbrain
      dockerfile: ../kairon/docker/Dockerfile.gbrain
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kairon:kairon_test@postgres:5432/kairon_e2e
      GBRAIN_PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bun", "run", "src/cli.ts", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── kairon 测试运行器 ──
  kairon-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kairon
    depends_on:
      postgres:
        condition: service_healthy
      gbrain:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kairon:kairon_test@postgres:5432/kairon_e2e
      GBRAIN_URL: http://gbrain:3000
      PYTHONPATH: /workspace/packages:/workspace/src
    command: >
      sh -c "
        echo '=== kairon E2E 测试 ===' &&
        echo '--- 核心模型测试 ---' &&
        cd /workspace/packages/core-models && uv run pytest tests/ -q &&
        echo '--- eidos 测试 ---' &&
        cd /workspace/packages/eidos && uv run pytest tests/ -q --ignore=tests/integration &&
        echo '--- kos 测试 ---' &&
        cd /workspace/packages/kos && uv run pytest tests/ -q &&
        echo '--- kronos 测试 ---' &&
        cd /workspace/packages/kronos && uv run pytest tests/ -q &&
        echo '--- 全部通过 ==='
      "
