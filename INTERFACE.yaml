# Cockpit Interface Registry
project: cockpit
layer: L3
description: 统一研究驾驶舱 (CLI + MCP + Web)

cli:
  - name: cockpit
    module: cockpit.cli:main
    description: 18 子命令 (context/cards/vault/research/status/code/...)
  - name: workspace
    module: cockpit.cli:main
    description: cockpit 别名 (兼容旧名)
  - name: agent-runtime
    module: cockpit.agent_runtime_cli:main
    description: Agent Runtime 执行器
  - name: cockpit-mcp
    module: cockpit.scripts.cockpit_mcp:main
    description: "[DEPRECATED] MCP stdio server (23 tools) — 改用 agora-mcp + resolve_bos_uri(\"bos://cockpit/context\")"

mcp:
  server: cockpit.scripts.cockpit_mcp
  tools: 23
  transport: [stdio]
  status: deprecated
  canonical_path: "agora-mcp → resolve_bos_uri(\"bos://cockpit/context\")"

http:
  - port: 8090
    protocol: http.server (Cockpit Web Dashboard)

dependencies:
  runtime: [runtime, rich, pyyaml, fastmcp]
  dev: [pytest]

tests: 498  # as_of 2026-07-28, 见 pytest tests/ (CI 守, 不硬编码)

# BET-Y1Q4-T8-05 — read-only Portfolio projection consumer
portfolio:
  entry: cockpit portfolio {status|objectives|critical-path|blockers}
  authority: read-only control projection (.omo/_control/portfolio-status.json)
  non_goals:
    - never writes Ledger / Goals / OMO state
