# eCOS Interface Registry
project: ecos
layer: L0
description: SSB 签名链 + 涌现计算 + 认知监控 + 工作流编排

cli:
  - name: ecos-ssb
    module: ecos.core.ssb_client:main
    description: 共享语义总线客户端
  - name: ecos-dashboard
    module: ecos.cli.dashboard:main
    description: Web Dashboard (converged to cockpit /api/ecos/status)
  - name: ecos-workflow
    module: ecos.cli.workflow:main
    description: 工作流编排 CLI (list/run/describe/backends/logs)
  - name: ecos-workflow-runs
    module: ecos.cli.workflow_runs:cmd_runs
    description: 工作流运行历史查询

  - name: ecos-mcp
    module: ecos.mcp_server:main
    description: MCP Server (8 workflow tools + SSOT + domain tools)
    agoraservice: ecos-workflow  # agora KNOWN_BACKENDS 名称

python_api:
  - module: ecos.workflow
    exports:
      - name: load_workflow(name) -> dict
        description: 加载工作流定义（M1 节点优先 → definitions 回退）
      - name: list_workflows() -> list[dict]
        description: 列出所有可用工作流
      - name: execute_workflow(name, params, dry_run) -> dict
        description: 执行工作流（向后兼容接口，有 backend 时自动委派新路由）
      - name: execute_m1_workflow(name, params, dry_run) -> dict
        description: 新接口，通过 BackendRegistry 路由到对应后端
      - name: test_workflow(name) -> dict
        description: 测试工作流编排（mock action，不执行真实脚本）
      - name: register(name, module_path, entrypoint, description)
        description: 注册 workflow backend
      - name: resolve(m1_node) -> Callable
        description: 根据 M1 节点解析后端执行函数
      - name: list_backends() -> list[dict]
        description: 列出所有已注册后端
      - name: get_backend(name) -> dict | None
        description: 获取单个后端信息
      - name: listen_forever(host, port)
        description: 启动事件监听器（bos://ecos/events SSE）
      - name: match_event(event, triggers) -> list
        description: 事件匹配触发器

mcp:
  - name: workflow_list
    description: 列出已注册工作流（按域/层/状态过滤）
  - name: workflow_show
    description: 查看工作流完整定义
  - name: workflow_run
    description: 执行工作流（支持 dry_run）
  - name: workflow_validate
    description: 验证工作流定义（X1-X4 约束检查）
  - name: workflow_backends
    description: 列出已注册 workflow backend
  - name: workflow_actions
    description: 列出已注册 workflow action
  - name: workflow_logs
    description: 查询工作流运行历史（M0 快照）
  - name: workflow_test
    description: 测试工作流编排（mock action）
  - name: workflow_cache_status
    description: 查询工作流缓存状态
  - name: workflow_cache_invalidate
    description: 使工作流缓存失效
  - name: workflow_circuit_breaker_status
    description: 查询后端熔断器状态
  - name: workflow_circuit_breaker_reset
    description: 重置后端熔断器

workflow_backends:
  - name: default
    description: 硬编码 subprocess action 执行器（向后兼容）
  - name: agora
    description: Agora MCP 路由（跨层经 I0 BOS Mesh）
  - name: symphony
    description: Symphony 状态机编排（协议级阶段跃迁）
  - name: swarm
    description: Swarm 多 Agent 任务编排（aetherforge）
  - name: runtime
    description: Runtime 项目生命周期编排（INIT→DELIVERY）
  - name: metaos
    description: MetaOS DAG 工作流引擎（可选依赖）
  - name: dynamic
    description: Dynamic mode — LLM 驱动动态编排（mode=dynamic 时启用）

dependencies:
  runtime: [pyyaml, requests, beautifulsoup4, jinja2]
  dev: [pytest, ruff]

tests: 859  # as_of 2026-07-28, 见 pytest tests/ (CI 守, 不硬编码)
