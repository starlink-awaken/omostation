# Runtime Interface Registry
project: runtime
layer: L1
description: 运行时基础设施 (Matrix + Scheduler + KEI + Cron)

cli:
  - name: runtime
    module: runtime.cli:main
    description: L1 运行时管理 (health/matrix/service/protocol)
  - name: ecos-matrix-scheduler
    module: runtime.scheduler:main
    description: 持续健康监控与自动愈合
  - name: ecos-bus-consumer
    module: runtime.bus_consumer:main
    description: Agora 事件总线消费者

mcp:
  server: runtime.cron_service.mcp_server
  tools: 10
  transport: [stdio]
  # P110-A #1: 14 → 10 tools (P74 review)
  #   合并: runtime_agent_run_task / runtime_agent_execute / runtime_agent_chat
  #   统一入口: runtime_agent_run (mode='task'|'chat'|'execute')
  #   删除: runtime_agent_list_tools (executor 内部用, 不暴露 MCP)

http:
  - port: dynamic
    protocol: FastAPI (Cron Service)

dependencies:
  runtime: [fastapi, fastmcp, httpx, uvicorn, pydantic, pyyaml, apscheduler, croniter, pyjwt]
  dev: [pytest, pytest-asyncio]

tests: 175  # as_of 2026-07-28, 见 pytest tests/ (CI 守, 不硬编码)
