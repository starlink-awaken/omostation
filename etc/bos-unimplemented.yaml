# bos-unimplemented.yaml — UNIMPLEMENTED BOS 服务跟踪注册表
#
# 与 bos-services.yaml 保持同步: 所有 status=unimplemented 的服务必须在此登记。
# POC_SERVICES 加载时丢弃 unimplemented (不可路由), 此文件让两注册表可审计。
# 校验: tests/unit/test_bos_registry.py::test_unimplemented_services_are_tracked

unimplemented:
  - uri: bos://analysis/iris/connect
    reason: Iris connector 未落地 (开发中)
  - uri: bos://analysis/iris/transform
    reason: Iris connector 未落地 (开发中)
  - uri: bos://analysis/iris/validate
    reason: Iris connector 未落地 (开发中)
