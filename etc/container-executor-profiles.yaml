# Container Executor isolation profiles (Scheme C Phase 5b)
# SSOT for stdio / mcp_stdio spawn isolation.
#
# Backend selection (env wins over this file's default_backend):
#   AGORA_SPAWN_BACKEND=local|docker|auto
#   AGORA_SPAWN_PROFILE=default|trusted-local|strict-netnone
#   AGORA_SPAWN_STRICT=0|1          # fail when docker requested but unavailable
#   AGORA_SPAWN_DOCKER_IMAGE=...    # override default image
#   AGORA_SPAWN_DOCKER_BIN=docker   # docker CLI path
#
# default_backend: local keeps CI/dev zero-dep; docker is opt-in for isolation.
version: 1
default_backend: local
default_profile: default
strict: false
# Pinned multi-arch index digest (2026-07-15 host pull). Override:
#   AGORA_SPAWN_DOCKER_IMAGE=python:3.13-slim  # floating (not for prod)
#   AGORA_SPAWN_DOCKER_IMAGE=python:3.13-slim@sha256:...
docker_image: python:3.13-slim@sha256:bffeb7bd6a85767587059c6ba23e1e9122078e3aa3fa836099171b9bb5a9bb00
docker_image_note: "pinned 2026-07-15; refresh when upgrading Python base" 
docker_bin: docker

profiles:
  # Hardened defaults for untrusted / third-party MCP stdio
  default:
    network: none
    read_only_root: true
    memory_limit: "512m"
    cpus: "1.0"
    no_new_privileges: true
    drop_caps: ["ALL"]
    workdir: /workspace
    # host paths are expanded at runtime; ${WORKSPACE_ROOT} falls back to cwd
    mounts:
      - host: "${WORKSPACE_ROOT}"
        container: /workspace
        mode: ro
      - host: "${TMPDIR}"
        container: /tmp
        mode: rw

  # Explicit passthrough (local process only; docker backend refused)
  trusted-local:
    network: host
    read_only_root: false
    no_new_privileges: false
    drop_caps: []
    mounts: []
    local_only: true

  # Stricter network-none with smaller memory (audit / red-team sample)
  strict-netnone:
    network: none
    read_only_root: true
    memory_limit: "256m"
    cpus: "0.5"
    no_new_privileges: true
    drop_caps: ["ALL"]
    workdir: /workspace
    mounts:
      - host: "${WORKSPACE_ROOT}"
        container: /workspace
        mode: ro
      - host: "${TMPDIR}"
        container: /tmp
        mode: rw
