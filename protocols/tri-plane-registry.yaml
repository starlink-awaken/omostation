# Tri-Plane Registry — eCOS L2 内核三平面能力目录 v1.0

# Tri-Plane Registry — eCOS L2 Kernel Tri-Plane Capability Catalog v1.0
#
# Each plane registers its external capabilities.
# Runtime MCP Server routes requests based on this registry.
# Plane-to-plane communication goes through I0 Integration Fabric (MCP mandatory).
# No direct cross-plane calls.

planes:
  governance:
    name: "OMO 治理面"
    code: "~/Workspace/projects/omo/"
    runtime: "uv run python3"
    entry: "cli"
    status: "active"
    description: "宪法执行、债务追踪、任务调度、Truth Mutation 生命周期"
    capabilities:
      - name: "phase_management"
        description: "管理 Phase 14/15/16 阶段流转"
        commands: ["omo:phase14", "omo:phase15", "omo:phase16"]
        input: "phase_number"
      - name: "debt_tracking"
        description: "债务注册、审计、权重计算"
        commands: ["omo:capability registry debt"]
        input: "registry subcommand"
      - name: "worker_dispatch"
        description: "分发任务到 worker、回收完成/失败的任务"
        commands: ["omo:worker dispatch", "omo:worker reclaim"]
        input: "task_id + worker_id"
      - name: "bridge_import"
        description: "导入 markdown spec 到 OMO 任务系统"
        commands: ["omo:bridge"]
        input: "spec_path"
      - name: "garbage_collection"
        description: "清理过期 OMO draft"
        commands: ["omo:worker gc"]
        input: "none"
      - name: "metacognition"
        description: "元认知审计 — 系统状态检查"
        commands: ["omo:metacognition"]
        input: "none"

  engine:
    name: "kairon 引擎面"
    code: "~/Workspace/projects/kairon/"
    runtime: "uv run python3 (agora)"
    entry: "agora (:7431 SSE)"
    status: "active"
    description: "KOS 索引、Agora 路由、LLM Gateway、cron-service、agent-runtime"
    capabilities:
      - name: "kos_indexing"
        description: "知识捕获、索引、语义搜索"
        commands: ["kos capture", "kos ingest", "kos search", "kos wiki"]
        input: "url/text + embeddings"
      - name: "agora_routing"
        description: "MCP 路由、服务发现、能力注册"
        commands: ["agora:* (27+ MCP tools)"]
        input: "mcp_request"
      - name: "llm_gateway"
        description: "LLM 推理、模型路由、载荷分发"
        commands: ["llm-gateway:*"]
        input: "prompt + model"
      - name: "cron_scheduling"
        description: "定时任务调度、cron-job 编排"
        commands: ["cron-service:*"]
        input: "schedule + task"
      - name: "agent_runtime"
        description: "Agent 运行时管理、进程生命周期"
        commands: ["agent-runtime:*"]
        input: "agent_config"

  memory:
    name: "gbrain 记忆面"
    code: "~/Workspace/projects/gbrain/"
    runtime: "bun (gbrain)"
    entry: "kos MCP (stdio)"
    status: "active"
    description: "知识图谱、语义检索、跨会话记忆、实体解析、事实追踪"
    capabilities:
      - name: "semantic_search"
        description: "语义检索知识图谱中的实体和关系"
        commands: ["gbrain query", "gbrain search"]
        input: "search_query"
      - name: "knowledge_capture"
        description: "知识捕获和入库"
        commands: ["kos capture", "kos ingest"]
        input: "url/text"
      - name: "entity_resolution"
        description: "实体解析和关系发现"
        commands: ["gbrain resolve", "gbrain facts"]
        input: "entity_name"
      - name: "fact_tracking"
        description: "事实追踪和轨迹分析"
        commands: ["gbrain eval trajectory", "gbrain founder scorecard"]
        input: "entity_slug"
      - name: "hot_memory"
        description: "热记忆注入 — 自动将相关记忆注入 Agent 上下文"
        commands: ["metaHook: brain_hot_memory"]
        input: "conversation_context"
      - name: "brain_health"
        description: "大脑健康评分、修复自动化"
        commands: ["gbrain doctor", "gbrain doctor --remediate"]
        input: "target_score + budget"
