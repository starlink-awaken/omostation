# =============================================================================
# L0 Protocol Weave — eCOS Protocol Registry (SSOT)
# All protocols used in the eCOS stack, their status, ports, and implementations.
# Managed by Runtime project. Query with: runtime protocol list / get
# =============================================================================
version: 1
updated: "2026-06-05"

protocols:
  # ── Agent Communication ─────────────────────────────────────────────
  - name: "MCP"
    version: "2025-03-26"
    category: "agent-communication"
    status: "active"
    description: "Model Context Protocol — tool/resource/prompt discovery"
    spec_url: "https://modelcontextprotocol.io"
    port_range: "7420-7425"
    transport: ["stdio", "http", "websocket"]
    implementations:
      - "kairon/packages/agora"
      - "native-mcp (Hermes client)"

  - name: "ACP"
    version: "0.1"
    category: "agent-communication"
    status: "active"
    description: "Agent Communication Protocol — stdin/stdout JSON-RPC"
    transport: ["stdio"]
    implementations:
      - "Hermes ACP client (hermes_cli.acp.*)"
    notes: "Used by Hermes subagent delegation. Pipeline-based communication."

  - name: "TaskObject"
    version: "1.0"
    category: "agent-communication"
    status: "active"
    description: "Neutral task format for cross-agent task passing through L3 Entry Bridge"
    spec_url: "~/Workspace/projects/runtime/protocols/task-object-v1.md"
    transport: ["mcp-stdio"]

  - name: "A2A"
    version: "0.1"
    category: "agent-communication"
    status: "planned"
    description: "Agent-to-Agent messaging (Google A2A inspired)"
    port_range: "7430-7435"
    transport: ["http", "websocket"]
    notes: "Not yet implemented. Planned for cross-machine agent orchestration."

  # ── Service Discovery ──────────────────────────────────────────────
  - name: "Runtime Matrix"
    version: "2"
    category: "service-discovery"
    status: "active"
    description: "Service registry YAML — env-var-based, version controlled"
    spec_url: "$RUNTIME_HOME/matrix.yaml"
    transport: ["file"]
    implementations:
      - "runtime CLI (runtime matrix get/list)"
      - "runtime/scripts/matrix.sh"
    notes: "Human-readable SSOT for runtime service inventory."

  - name: "Agora Discovery"
    version: "1"
    category: "service-discovery"
    status: "active"
    description: "Agora service registration and routing"
    spec_url: "~/Workspace/projects/kairon/packages/agora"
    port_range: "7426, 7430-7431"
    transport: ["http", "mcp"]
    implementations:
      - "kairon/packages/agora"
    notes: "Backed by Agora routing services. Concrete runtime endpoints belong in Runtime Matrix."

  # ── Kernel Architecture ───────────────────────────────────────────
  - name: "Tri-Plane Bus"
    version: "1"
    category: "kernel-architecture"
    status: "active"
    description: "L2 Kernel Tri-Plane coordination — governance/engine/memory plane routing"
    spec_url: "~/Workspace/projects/runtime/protocols/tri-plane-registry.yaml"
    transport: ["mcp", "yaml"]
    implementations:
      - "Runtime MCP (plane_list, plane_capabilities)"
      - "OMO MCP (omo_*)"
      - "Agora MCP (agora-unified)"
      - "gbrain MCP (kos*)"

  # ── Governance & Extension ───────────────────────────────────────
  - name: "Governance Constraint"
    version: "1"
    category: "governance"
    status: "active"
    description: "L0 协议级约束 — 宪法约束编译进协议映射矩阵"
    spec_url: "~/Workspace/projects/runtime/protocols/governance-constraints.yaml"
    transport: ["mcp", "yaml"]
    implementations:
      - "Runtime MCP (runtime_stats, kei_*)"
      - "OMO Governance Plane (omo_metacognition)"

  - name: "KEI Extension"
    version: "1.0.0"
    category: "governance"
    status: "active"
    description: "Kernel Extension Interface — 扩展注册、沙箱隔离、权限管理"
    spec_url: "~/Workspace/projects/runtime/protocols/kei-extensions.yaml"
    transport: ["mcp", "yaml"]
    implementations:
      - "Runtime MCP (kei_list, kei_inspect)"
      - "kei_sandbox.py (audit hook)"
      - "kei.py (manifest loader)"

  # ── Self Layer ────────────────────────────────────────────────────
  - name: "L4 Gateway"
    version: "4.0"
    category: "self-layer"
    status: "active"
    description: "CLAUDE_COWORK_GLOBAL.md — 身份锚、域路由、执行纪律、会话行为基线"
    spec_url: "~/Documents/学习进化/CLAUDE_COWORK_GLOBAL.md"
    transport: ["file", "claude-cowork"]
    implementations:
      - "~/Documents/学习进化/CLAUDE_COWORK_GLOBAL.md"

  # ── State Sync ─────────────────────────────────────────────────────
  - name: "KOS State"
    version: "1"
    category: "state-sync"
    status: "active"
    description: "Knowledge OS — capture/ingest/search pipeline"
    transport: ["file", "mcp", "http"]
    implementations:
      - "kairon/packages/kos"
      - "kos capture/ingest/search CLI"
    notes: "Knowledge capture and retrieval substrate. Concrete deployment endpoints belong in Runtime Matrix."

  - name: "GBrain State"
    version: "1"
    category: "state-sync"
    status: "active"
    description: "Postgres+pgvector knowledge graph"
    port_range: "5433"
    transport: ["postgres wire"]
    implementations:
      - "gbrain-postgres"
      - "gbrain-index"

  # ── Model Access ───────────────────────────────────────────────────
  - name: "Ollama API"
    version: "1"
    category: "model-access"
    status: "active"
    description: "Local LLM inference (OpenAI-compatible API)"
    port_range: "11434"
    transport: ["http"]
    implementations:
      - "ollama serve"
      - "nomic-embed-text"
      - "qwen3.6:35b-a3b"
    notes: "Used for local inference and embedding-related workflows."

  # ── Identity & Auth ────────────────────────────────────────────────
  - name: "OMO Governance"
    version: "4.0"
    category: "identity-auth"
    status: "active"
    description: "OMO v4 — truth mutation lifecycle, debt registry, KEI"
    transport: ["cli", "file"]
    implementations:
      - "projects/omo"
      - "omo-cli"
      - ".omo truth data plane"
    notes: "KEI contract for kernel extension. L2 kernel governance."

  # ── Orchestration ──────────────────────────────────────────────────
  - name: "Cron Scheduler"
    version: "2"
    category: "orchestration"
    status: "active"
    description: "cron-service orchestration with MCP and HTTP control surfaces"
    port_range: "7450-7451"
    transport: ["http", "mcp"]
    implementations:
      - "kairon/packages/cron-service"
    notes: "Scheduling runtime details are tracked in Runtime Matrix and runtime health evidence."

  - name: "Agent Runtime API"
    version: "1"
    category: "orchestration"
    status: "active"
    description: "Agent lifecycle management HTTP API"
    port_range: "9876"
    transport: ["http"]
    implementations:
      - "kairon/packages/agent-runtime"
    notes: "Lifecycle API contract for agent execution and health reporting."
