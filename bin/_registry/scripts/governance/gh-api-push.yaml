schema: script-registry/v1
id: bin/gac/gh-api-push.sh
name: Gh Api Push
category: governance
owner: governance-team
description: >
  Non-publishing / proposal-only / diagnostic-read-only surface (WP1 Wave B3).
  Emits PUBLICATION_OWNER_REQUIRED before any Git Data API write. Does not claim
  publishing capability. Canonical remote ref/PR publication is managed
  clone-lifecycle integrate only; proposal creation is not publication and
  unknown outcomes remain query-only.
inputs:
  - name: owner
    type: string
    description: GitHub owner (diagnostic argv only; no write effect)
  - name: repo
    type: string
    description: GitHub repo (diagnostic argv only; no write effect)
  - name: branch
    type: string
    description: Target branch name (rejected; no ref write)
  - name: base-ref
    type: string
    description: Base ref name or sha (diagnostic argv only; no write effect)
  - name: commit-msg
    type: string
    description: Commit message (rejected; no commit write)
  - name: files
    type: list
    description: Local file paths (rejected; no blob/tree write)
outputs:
  - type: exit_code
  - type: json
dependencies: []
triggers:
  - Diagnostic rejection of legacy Git Data API publication attempts
related:
  - bin/gac/clone-lifecycle.py
  - docs/plans/AGENT-BRIEF.md
maturity: draft
last_reviewed: "2026-09-11"
