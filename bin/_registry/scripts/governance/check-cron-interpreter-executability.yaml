schema: script-registry/v1
id: bin/gac/check-cron-interpreter-executability.py
name: Check Cron Interpreter Executability
category: governance
owner: platform-team
description: "cron 登记面解释器可执行性门禁（CRON-BARE-PYTHON3-PY39-IMPORT-DEATH 决策(3)，2026-11-10 principal 裁决「先 warn + 限期收敛」）：对每条本机 active crontab 作业的每个 `python3 <script>.py` 调用点，判「声明/候选解释器真能 import 目标脚本」是否成立，而不是数入口文件名——按入口数只覆盖 8/87，真实死法 45 条，且 `execution-environment-steward.py` 的死因在它 `:39-41` 用 `spec_from_file_location` 动态拉起的兄弟模块。判据全部复用 `bin/lib/cron_normalize`（与 `scheduler-compile`/`install-cron-plane` 同源，门禁与安装器分叉是本债的成因之一），且不执行目标脚本（模块级有 POST git / 递归删目录 / mem0 purge 副作用）。两个口径分开报：发射侧 (`third_party_imports`) 决定退出码，闭包口径 (`import_closure`) 与「静态判不出的兄弟文件」只 advisory。warn 期到 `ENFORCE_AFTER=2026-11-24`（与 governance-checks.yaml 同名规则的 review_before 同值，由 tests/unit/test_cron_interpreter_executability.py 钉住）后自动转阻断。2026-11-10 决策(2) 改判 B′（登记面↔已装面逐字比对不成立——安装侧本来就按宿主重写解释器）后，判据扩到**已装面**：`installed_interpreter_gaps` 用整行折回把已装 crontab 行配对到登记条目，再判该行里 cron 实际执行的解释器路径存不存在、过不过版本下限与第三方依赖（发射侧口径，与退出码同源）；配对时必须先跳过 5 段 schedule 前缀再找 python 调用点（否则解释器不在 `_command_start_tokens` 的视野里）；未登记的坏行与裸 `python3` 写法只计数不判（`plane_unregistered_broken` / `plane_bare_tokens`）；有 python 调用点却一行都配不上时报 `plane_pairing_suspicious`——配对口径坏了的「0 缺口」是空转出来的绿。护栏 tests/unit/test_cron_interpreter_executability.py。"
inputs:
  - .omo/cron/registry.yaml
outputs:
  - type: exit_code
  - type: json
dependencies:
  - bin/lib/cron_normalize.py
triggers:
  - gac-local-gate
  - ci_gate
related:
  - .omo/debt/items/CRON-BARE-PYTHON3-PY39-IMPORT-DEATH.yaml
maturity: draft
last_reviewed: "2026-11-10"
