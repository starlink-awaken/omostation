description: "crontab 平面归一化的唯一实现（库模块, 无 CLI）：normalize_interpreter 按边界分段把绝对路径解释器归一化成裸 python3、expand_workspace 把 $HOME/Workspace 展开成绝对路径（cron 不做变量展开）、normalize_installed_line 把 harness-cron.sh 的重复登记折成规范形、comparison_key 产出归一化整行比较键。存在的理由是终结静默漂移：bin/scheduler-compile.py 与 bin/ops/install-cron-plane.py 各自维护一份、两边 docstring 都自称「与对方同口径」却无门禁盯着, 已经漂移三次（比较键 [:120] 截断 / 解释器归一化范围 / 末段 off-by-one）。护栏 tests/unit/test_cron_normalize.py。"
