schema: script-registry/v1
id: bin/_registry/schemas/script-registry/v1
name: Script Registry Schema
version: 1.0.0
description: >
  Schema for bin/ script registry entries.
  Every script in bin/ must have a corresponding YAML entry
  in bin/_registry/scripts/<category>/<script-id>.yaml.

fields:
  schema:
    type: string
    required: true
    description: Schema version identifier
    example: "script-registry/v1"

  id:
    type: string
    required: true
    description: Stable identifier, path-relative to repo root
    example: "bin/gac/gac-local-gate.py"

  name:
    type: string
    required: true
    description: Human-readable name
    example: "GaC Local Gate"

  category:
    type: string
    required: true
    enum:
      - governance
      - state
      - workflow
      - migration
      - knowledge
      - runtime
      - external
    description: Functional category

  owner:
    type: string
    required: true
    description: Team or agent responsible for this script
    example: "governance-team"

  description:
    type: string
    required: true
    description: >
      One-line description of what the script does.
      Should be sufficient for discoverability.
    example: "Master checker running 49+ individual checks"

  inputs:
    type: array
    required: false
    description: Typed input interfaces
    items:
      type: object
      properties:
        type:
          type: string
          enum: [cli_args, stdin, file, env, network]
        description:
          type: string
        required:
          type: boolean

  outputs:
    type: array
    required: false
    description: Typed output interfaces
    items:
      type: object
      properties:
        type:
          type: string
          enum: [exit_code, json, stdout, file, event]
        description:
          type: string

  dependencies:
    type: array
    required: false
    description: Other scripts or modules this script depends on
    items:
      type: string
    example:
      - "bin/gac/gac-validate.py"
      - "bin/gac/gac-drift.py"

  triggers:
    type: array
    required: false
    description: When this script runs automatically
    items:
      type: object
      properties:
        on:
          type: string
          enum: [pre-commit, pre-push, ci, cron, manual]
        command:
          type: string
          description: Command that triggers this script

  related:
    type: array
    required: false
    description: Documentation links
    items:
      type: string
    example:
      - "docs/operations/runbook-gac-local-gate.md"
      - ".omo/_truth/registry/governance-checks.yaml"

  maturity:
    type: string
    required: true
    enum: [draft, stable, deprecated, archived]
    default: draft

  last_reviewed:
    type: string
    required: true
    description: ISO date of last review
    example: "2026-08-24"

required_fields:
  - schema
  - id
  - name
  - category
  - owner
  - description
  - maturity
  - last_reviewed
