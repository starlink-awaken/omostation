# workflow-scene-map.yaml

## Resolution Rules

1. Look up the closeout run's `workflow_id`.
2. If present in `map`, use the corresponding scene card path.
3. Otherwise fall back to `default` (covers new workflows added
   before this map is updated).

## Adding a Workflow

Append a new entry to `map` and link a scene card under `scenes/`.
The bridge will only emit episodes for workflows listed here or
that fall back to `default`.