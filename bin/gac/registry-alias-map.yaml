  - CR-L2-TASK-DELIVERABLE         # 待决: 任务卡机制去留 owner 定
  - CR-L0-SSOT-PATH-NORM           # 弃用候选: 契约文档已消失
  - CR-X1-POLICIES-SSOT            # 并入 SH-4 DEC-SH-4-AUTHORITATIVE-REGISTRY
  - CR-X2-FRESHNESS-SSOT           # 同上
  - CR-EVIDENCE-DECLARED           # 收窄候选: complete D0 口径复核中
  - CR-EVIDENCE-SHA-FRESHNESS      # 收窄: spec digest 口径 (complete 校验)
  - CR-GIT-STAGE-SUBMODULE-PIN     # 收窄: gitlink-ancestry push 期覆盖核心风险
