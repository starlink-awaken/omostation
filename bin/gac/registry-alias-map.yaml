# registry-alias-map.yaml — multi-registry rule ID cross-walk (BET-Y2Q4-SH-4)
#
# 3 个规则注册表用不同词汇, 需要 alias 映射才能 cross-reference.
# Sources:
#   A. governance-checks.yaml (主仓 SSOT, 86 CR-* + 4 xN-* entries)
#   B. L0-constraints.yaml (子仓 ecos SSOT, 91 CR-/X1-N-/X2-CNN entries)
#   C. hook-manifest.yaml (主仓 hook 执行体, lowercase hyphen names)
#   D. bin executors 实际引用 (string match)
#
# 每个 alias 至少 2 处证据 (governance-checks + L0 或 executors).
# 不重写原注册表; 这是新增 SSOT 工具.
#
# Spec: docs/superpowers/specs/2026-09-25-multi-registry-alias-resolver.md
#
# schema: registry-alias-map/v1

version: 1
owner: governance-team
last_reviewed: 2026-10-09
source_register_ids:
  - "governance-checks.yaml (CR-*)"
  - "L0-constraints.yaml (X*-* / CR-*)"
  - "hook-manifest.yaml (lowercase hyphen)"

# alias groups: canonical_id → [aliases including itself]
# canonical_id is the governance-checks form (主仓 SSOT authoritative for cross-walk)
aliases:
  # ── M0 (model-driven) ──
  - canonical: CR-M0-STAGE-GATE
    aliases: [mof_stage_gate, mof-stage-gate, mof-bootstrap]  # BET-Y2Q4-T10-01: ecos-ci.yml:81 tool-loop 调用 mof-bootstrap
    evidence:
      governance-checks: ".omo/_truth/registry/governance-checks.yaml"
      l0_constraints: "projects/ecos/src/ecos/ssot/registry/L0-constraints.yaml"
      note: "check_type field reference; 实际接线是 alias mof-bootstrap → bin/mof/mof-bootstrap.py (live, gac-local-gate.py:137 与 m4-health-score.py:82 调用); 旧说明曾指向 bin/_archive/gac-execution-gap.py (archive), 该路径不构成接线"

  # ── L0 (protocol layer) ──
  - canonical: CR-L0-BOS-RESOLVE
    aliases: [bos_resolve, bos-resolve]
    evidence:
      governance-checks: ".omo/_truth/registry/governance-checks.yaml"
      bin_executor: "projects/agora/src/agora/mcp/tools/bos_resolve.py (live) + bin/gac/evidence-smoke.py:634 bos_resolve 评分; 旧引用 bin/_archive/gac-execution-gap.py 已归档, 不构成接线"

  - canonical: CR-L0-PROTOCOLS-SSOT
    aliases: [protocols_ssot, protocols-ssot]
    evidence:
      governance-checks: ".omo/_truth/registry/governance-checks.yaml"
      note: "describes protocols SSOT pinning rule; executor is the SSOT itself"

  - canonical: CR-L0-SSOT-PATH-NORM
    aliases: [ssot_path_norm]
    evidence:
      governance-checks: ".omo/_truth/registry/governance-checks.yaml"
      note: "explicit norm rule, enforced via bin/ssot/ tools"

  # ── L1 (runtime) ──
