    aliases: [runtime_health, runtime-health]
    evidence:
      governance-checks: ".omo/_truth/registry/governance-checks.yaml"
      bin_executor: "bin/ssot/health-monitor.py, bin/gac/check-system-health.py"

  # ── L2 (engine) ──
