signals:
  - id: sig-sleep
    icon: moon-star
    iconStyle: warning
    title: 夏明星呼吸机评估
    timeBadge: 本月
    description: 呼吸机治疗已持续数月但睡眠质量仍无改善，需要评估压力设置是否合适、有无其他睡眠结构异常（如周期性肢体运动障碍）。
  - id: sig-eyesight
    icon: eye
    iconStyle: warning
    title: 夏维桢12月龄散瞳验光
    timeBadge: 5个月后
    description: 父母均高度近视，7.5月龄电脑验光提示 SE -2.25D ~ -2.50D（未散瞳），建议 12 月龄做 1% 阿托品慢散瞳验光建立基线。
  - id: sig-heart
    icon: activity
    iconStyle: info
    title: 卵圆孔未闭随访
    timeBadge: 按时复查
    description: 卵圆孔未闭（1mm），先天性心脏缺陷7型（家系遗传待查），FISH/array 未见异常，需定期复查确认自行闭合情况。
  - id: sig-immunity
    icon: flask-conical
    iconStyle: primary-soft
    title: 秦张瑶免疫随访
    timeBadge: 备孕前关
    description: 孕期涉及生殖科+风湿免疫科+产科多学科管理，抗磷脂抗体和ANA谱有异常倾向，再次备孕前需重新评估免疫状态。
stableItems:
  - title: 夏维桢新生儿肺炎
    description: 出生后经抗感染治疗已治愈，无后遗症，当前不需反复确认。
  - title: 先心遗传筛查
    description: FISH/array 未见异常，目前只需关注卵圆孔是否自行闭合，不在此项上过度消耗精力。
  - title: 夏明星抑郁病史
    description: 中度抑郁经安定医院系统治疗后已停药，自感状态已恢复正常，转为关注当下睡眠质量。
  - title: 秦张瑶孕期完整
    description: 备孕→早孕→中孕→分娩全程覆盖，多学科联合管理，产检建档于北大第一医院高规格产科。
