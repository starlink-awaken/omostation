      icon: scan-search
      title: 资料归档
      badge: 已完成
      badgeStyle: success
      description: 证件扫描、OCR 整理和命名规范已基本完成，后续只需维持新增文件的归位习惯。
      timeLabel: 进入维护
  decisionRecords:
    - title: 先稳节奏
      description: 本周的核心不是新增计划，而是把孩子适应、接送安排和家庭睡眠质量先稳定下来。
    - title: 一次配齐
      description: 新车相关用品尽量一次整理成套，减少未来一个月的零散反复购买。
  systemReminders:
    - icon: clock-3
      title: 接送预案
      description: 避免孩子状态波动时，家庭排班没有缓冲。
    - icon: folder-sync
      title: 新增归档
      description: 维持新系统的秩序感，比一次性大整理更重要。
