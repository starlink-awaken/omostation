dailySections:
  heroDescription: 这里是家庭最近生活事务的总览台。它帮助家里快速知道哪些生活线正在推进、哪些地方还卡着、今天先处理什么，以及该从哪个共用入口继续往下走。
  heroSummaries:
    - label: 今日状态
      value: 忙但稳
      subtitle: 适合先做关键项
    - label: 本周重点
      value: 入托衔接
      subtitle: 接送与适应并行
    - label: 今日先手
      value: 对齐接送
      subtitle: 再补应急电话
  overviewSummary: 最近的生活精力主要压在入托衔接、车辆落地和长辈安排上。物业与国网申请已稳住，应急协议结构也已经成形，现在更需要把卡点一件件接过去。
  overviewTags:
    - 先稳入托
  heatSteps:
    - label: 入托
      description: 最高
      active: true
    - label: 车辆
      description: 次高
      active: false
    - label: 长辈
      description: 中段
      active: false
    - label: 应急
      description: 收口中
      active: false
  overviewMiniCards:
    - label: 在跑事项
      value: 6 项
      description: 只保留真正在推进的生活线，不把零散想法全挤进来。
    - label: 已稳事项
      value: 4 项
      description: 物业费、国网申请和体检手续已从焦点区移开。
    - label: 当前主压
      value: 入托衔接
      description: 重点在接送分工、午睡适应和当天恢复。
    - label: 下个卡点
      value: 补完电话
      description: 家庭会议后打印车载应急卡，避免协议只停在文档里。
  opsCards:
    - id: ops-childcare
      icon: baby
      title: 入托衔接
      subtitle: 孩子适应与接送配合
      badge: 优先
      badgeStyle: warning
      tags:
        - 接送分工
        - 午睡观察
      currentBlock: 谁接谁送、临时变动时谁补位，还没有完全说透。
      nextStep: 先把本周接送表和应急替补先对齐，再看情绪与睡眠反馈。
    - id: ops-car
      icon: car-front
      title: 车辆推进
      subtitle: 维修上牌与配套补齐
      badge: 推进中
      badgeStyle: info
      tags:
        - 选号维修
        - 充电桩
      currentBlock: 提车后配套还零散分布，维修、贴膜和儿童座椅容易互相打断。
      nextStep: 先排维修与选号，再把充电桩安装和车衣车膜合成一条清单。
    - id: ops-emergency
      icon: triangle-alert
      title: 家庭应急
      subtitle: 协议补完与车载卡片
      badge: 待补完
      badgeStyle: primary-soft
      tags:
        - 家庭会议
        - 打印应急卡
      currentBlock: 结构已经有了，但电话号码还没在家庭会议里补齐。
      nextStep: 补全号码、确认联系人排序，然后把车载应急卡打印出来。
    - id: ops-parents
      icon: heart-handshake
      title: 长辈安排
      subtitle: 养老方案与沟通节奏
      badge: 初步规划
      badgeStyle: surface-2
      tags:
        - 北京方案
        - 预算评估
      currentBlock: 路径知道要看什么，但还缺和长辈本人意愿的深一点沟通。
      nextStep: 先做预算和方案草图，再安排一次不着急的沟通会。
  priorityItems:
    - id: prio-1
      index: 1
      title: 对齐接送
      description: 把入托接送分工、补位人选和当天反馈方式定下来。
      timeLabel: 今天先做
      isPrimary: true
    - id: prio-2
      index: 2
      title: 维修选号
      description: 把理想 i6 的维修与选号放到同一条推进线上，减少来回切换。
      timeLabel: 两天内
      isPrimary: false
    - id: prio-3
      index: 3
      title: 装充电桩
      description: 衔接物业、国网和安装时间，把已完成手续真正落到可使用状态。
      timeLabel: 本周推进
      isPrimary: false
    - id: prio-4
      index: 4
      title: 备端午行
      description: 围绕保定安排，把出行节奏、车辆准备和孩子用品先打包好。
      timeLabel: 节前完成
      isPrimary: false
    - id: prio-5
      index: 5
      title: 补完电话
      description: 家庭会议里补全应急电话，然后打印车载卡片和家中版本。
      timeLabel: 本周收口
      isPrimary: false
  timeline:
    - id: tl-early
      icon: baby
      iconStyle: warning
      title: 周初接住
      badge: 孩子优先
      badgeStyle: warning
      description: 先把入托接送和当天恢复节奏接稳，避免孩子状态波动时家里临时找人补位。
    - id: tl-mid-car
      icon: car-front
      iconStyle: primary-soft
      title: 周中推进
      badge: 车辆主线
      badgeStyle: primary-soft
      description: 维修、选号和充电桩安装顺着一条线往下走，不再把车膜、座椅和腰靠拆成散点。
    - id: tl-mid-trip
      icon: calendar-range
      iconStyle: info
      title: 周中顺带
      badge: 假期准备
      badgeStyle: info
      description: 端午保定安排和车辆出行准备一起做，顺手把孩子用品和路上补给打包好。
    - id: tl-weekend
      icon: heart-handshake
      iconStyle: primary-soft
      title: 周末再谈
      badge: 长辈安排
      badgeStyle: primary-soft
      description: 把北京养老方案、预算估计和长辈意愿拉回同一张桌上，先听再定方向。
    - id: tl-close
      icon: shield-check
      iconStyle: success
      title: 最后收口
      badge: 应急落地
      badgeStyle: success
      description: 家庭会议里补全号码，再把车载应急卡和家中版一起打印出来，真正让协议能用。
  stableItems:
    - title: 物业费已交
      description: 物业盖章和缴费已经完成，不再占据本周注意力。
    - title: 国网已申
      description: 充电桩申请路径已经打通，剩下的是排安装和现场推进。
    - title: 入托体检
      description: 前置手续已完成，现在更看重真实适应和接送协作。
    - title: 协议结构已定
      description: 家庭紧急联系人协议骨架已经完成，只待补齐号码并落地打印。
  sharedEntries:
    - icon: phone-call
      title: 服务通讯录
      description: 保留物业、维修、儿科、快递和常用联系人。
      href: /doc?path=_knowledge/04.家庭日常/07.服务通讯录/README.md
    - icon: car-front
      title: 物业车辆
      description: 汇总物业事项、停车、维修、上牌与充电桩。
      href: /doc?path=_knowledge/05.资产设备/车辆/2026-06-13_购车配套事务.md
    - icon: heart-handshake
      title: 养老规划
      description: 进入北京养老方案、预算测算和沟通记录。
      href: /doc?path=_knowledge/04.家庭日常/岳父母养老规划.md
    - icon: calendar-range
      title: 家庭日历
      description: 看纪念日、接送安排、出行计划和本周推进节点。
      href: /calendar
    - icon: shield-check
      title: 应急协议
      description: 查看紧急联系人协议、打印版本和车载卡片说明。
      href: /doc?path=_knowledge/04.家庭日常/07.服务通讯录/家庭紧急联系人协议.md
  footer:
    title: 家庭日常总览
    description: 围绕正在推进的生活线、近期节奏和共用支持入口组织，让家庭运转更容易接上。
    tags:
      - 温和可信
      - 事务清晰
      - 适合日用
