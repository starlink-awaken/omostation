id: BET-Y2Q4-T10-252
title: guard-submodules 非破坏性对齐 —— 并发 submodule update 周期不得删除既有检出
goal: 'post-checkout 守卫 `guard-submodules --fix`（bin/gac/gac-worktree.sh）对每个 pin 不一致的子模块执行
  `git submodule update --init --no-fetch`。该命令把「已存在但 gitdir 布局非标准（检出由外部克隆/链接管理）」的检出
  当作无效目录：先删除再按 pin 重克隆；重克隆依赖网络，本机网络受限时必然失败并留下空目录。并发 agent 的
  claim/release 周期在每次 worktree add / checkout 都触发该守卫，于是手动布置的子模块检出被周期性清空——2026-10-14
  实证：ptr-bump 与 ptr-bump2 两轮 gitlink 交付都被反复打断（.git 条目被删、空目录残留、remote-hygiene 报
  origin 指向本地路径）。修法（fail-safe）：守卫只对**不存在 .git 条目**的路径执行破坏性 update --init；
  对已存在且可解析的检出改为非破坏性对齐（本地含 pin 对象时 checkout 到 pin，否则跳过并 advisory），
  任何情况下不删除既有 .git 条目。claim/release 主流程与 reachability/rewind 语义不变。'
