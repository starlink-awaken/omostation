- 'ISC-2 非破坏性对齐：已存在检出且本地含 pin 对象 → --fix 后 HEAD == pin 且 .git 条目仍在'
- 'ISC-3 空缺仍重建：无 .git 条目的路径仍按 pin 对齐（T10-161 原语义）'
- 'ISC-4 缺对象跳过：已存在检出但本地无 pin 对象 → 不动检出、advisory 点名、exit 0'
- 'ISC-5 回归：uv run pytest tests/ -q -k "submodule or guard or worktree" 全绿'
- 'ISC-6 remote 污染检测不变：origin URL 落入子仓 URL 集合的 fixture 仍报 🚨 且不改写'
