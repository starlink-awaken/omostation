schema: agent-error/v1
id: PITFALL-MEA-005
category: measurement
severity: high
title: 同一数据集合多个读取入口计数不一致 = 有一条路径在静默丢元素
symptom: error-knowledge check 报 34 条 pitfall，stats 与 lookup 只报 33；PITFALL-CRD-001
  的教训在召回里永远查不到，但门禁认为库是健康的
root_cause: 'check 自己走目录遍历统计，召回路径 _load_all 另写一份且对不满足严格 schema 的文件 continue 跳过——legacy
  条目用 name: 而非 title: 就被无声丢弃；两份遍历逻辑没有共同计数不变量，分歧无人发现'
solution: 让 check 复用同一个加载器并把不可召回文件作为问题上报，同时断言 len(recallable)+len(unrecallable)==磁盘文件数（recall
  divergence）；加载器对 legacy 条目做字段归一而不是跳过；每条不可召回路径配一个 RED→GREEN 回归测试
prevention: 任何'一个集合、多个读取入口'的工具，加一条跨入口计数一致性断言；计数分歧本身就是缺陷信号，不要靠调低某一边来'修平'
tags:
- recall
- silent-drop
- schema
- consistency-check
