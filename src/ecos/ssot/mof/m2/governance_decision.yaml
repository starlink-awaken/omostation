m2_type: GovernanceDecision
version: 1.0.0
created: '2026-06-23'
introduced_by: P60
description: |
  治理决策节点——建模 P43-P59 沉淀方法论的机器可读契约。
  任何 governance 相关决策 (mof-version bump, ADR 编写, 阶段收口) 应登记为 GovernanceDecision 实例。
GovernanceDecision:
  m3_parent: GovernanceElement
  icon: ⚖️
  stateMachine:
    proposed:
      description: 提案·待审批
      transitions: [accepted, deprecated]
    accepted:
      description: 已接受·当前生效
      transitions: [superseded, deprecated]
    superseded:
      description: 已被新决策替代
      transitions: []
    deprecated:
      description: 已废弃·不再使用
      transitions: []
  requiredProperties:
    decision_id:
      type: string
      pattern: "^GOVD-\\d{4}-\\d{3}$"
      description: 全局唯一决策 ID (GOVD-YYYY-NNN)
    decision_type:
      type: string
      enum:
        - dimension_saturation  # linter 维度饱和决策
        - commit_closure       # 强制闭环纪律决策
        - category_assignment  # 文档分类决策
        - migration            # 真迁移决策 (硬分层)
        - deprecation          # 废弃决策
        - threshold_setting    # 阈值设定决策
      description: 决策类型 (沿用 P43-P59 沉淀类型)
    rationale:
      type: string
      minLength: 100
      description: |
        决策理由, 必含 3 段:
        ## WHY (为什么 - 量化数据支撑)
        ## WHAT (是什么 - 具体改动)
        ## NEXT (下一步 - 候选清单)
      validationRules:
        - "rationale 必含 '## WHY' 标题"
        - "rationale 必含 '## WHAT' 标题"
        - "rationale 必含 '## NEXT' 标题"
    alternatives_considered:
      type: array
      minItems: 1
      description: 至少 1 个被拒方案, 含原因
      items:
        type: object
        properties:
          option:
            type: string
          rejected_because:
            type: string
    consequences:
      type: object
      properties:
        positive:
          type: array
          items: {type: string}
        negative:
          type: array
          items: {type: string}
        neutral:
          type: array
          items: {type: string}
    evidence:
      type: array
      description: 引用证据 (audits, ADR, mof-version 等)
      items: {type: string}
    owner_role:
      type: string
      enum: [governance-team, governance-agent, human-reviewer]
    created_at:
      type: string
      format: date-time
    phase:
      type: string
      pattern: "^P\\d{2,3}$"
      description: 关联 P 阶段 (P60+)
  optionalProperties:
    supersedes:
      type: array
      description: 被此决策替代的旧 decision_id 列表
      items: {type: string}
    references:
      type: array
      description: 外部文档链接
      items: {type: string}