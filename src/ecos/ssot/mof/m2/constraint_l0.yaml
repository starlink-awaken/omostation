# M2: ConstraintL0
# M4 元模型闭环 — Phase 1 (ADR-0132 P1-S1)
# 继承 ConstraintMgmt,添加 L0-constraints 1065 条专用字段集 (12 字段)

m2_type: ConstraintL0
version: 1.0.0
created: '2026-07-06T10:00:00'
ConstraintL0:
  m3_parent: Constraint  # 继承 Constraint (m3.yaml Constraint 类目)
  description: 织星 L0 协议约束 — 跨层协议契约。L0 registry/L0-constraints.yaml 的 M2 schema
  icon: 🔒

  # 沿用 ConstraintMgmt 7 态 + 加 L0 专属
  stateMachine:
    draft:
      description: 起草中
      transitions: [identified, archived]
    identified:
      description: 已识别待评估
      transitions: [scored, accepted, resolved, archived]
    scored:
      description: 已评分
      transitions: [scored_active, accepted, archived]
    scored_active:
      description: 已评分并生效
      transitions: [aging, deprecated, archived]
    aging:
      description: 超过半衰期,需复查
      transitions: [scored_active, deprecated, accepted, archived]
    deprecated:
      description: 已废弃,迁移中
      transitions: [archived]
    accepted:
      description: 接受不修复
      transitions: [archived]
    resolved:
      description: 已解决(被替代约束或重写)
      transitions: [archived]
    archived:
      description: 归档
      transitions: []

  # ──── 12 必填字段 (L0-constraints v2 形状) ────
  requiredProperties:
    id:
      type: string
      pattern: '^[A-Z][0-9]-C[0-9]{2,3}$|^CR-[A-Z0-9-]+-[0-9]{2}$'
      description: L0 约束 ID (继承 X1-C0[0-9]+ 等命名)
    description:
      type: string
      minLength: 5
      description: 约束描述
    applies_to:
      type: list
      items:
        type: enum
        values: [M3, M2, M1, M0, L0, L1, L2, L3, L4, I0, meta]
        minItems: 1
      description: 适用层 / 元层 (L0/M0/M2/M3 是元层语义,L1-L4 是物理层,meta 是治理元层)
    dimension:
      type: enum
      values: [X1, X2, X3, X4, M1, M2, X-meta]
      description: 治理维度
    severity:
      type: enum
      values: [critical, high, medium, low]
      description: 严重度 (替代原 type=required/preferred/advisory)
    rule_expr:
      type: map
      required: [kind]
      properties:
        kind:
          type: enum
          values: [predicate, composite, javascript, lambda, ref]
        args:
          type: string
        ref:
          type: string
      description: 谓词表达式 (DSL 约束)
    violation_code:
      type: string
      pattern: '^E-(L0|L[0-4])-[A-Z0-9-]+: .+$'
      description: 违规代码+默认消息
    relation_constraints:
      type: map
      properties:
        affects:
          type: list
          items: { type: ref }
        depends_on:
          type: list
          items: { type: ref }
        conflicts_with:
          type: list
          items: { type: ref }
      description: 与其他约束的关系

  # ──── 5 可选字段 ────
  optionalProperties:
    confidence:
      type: enum
      values: [fact, inference, hypothesis, estimated]
      default: fact
      description: 元模型的置信度 (Phase 2 桥接 meta_model.py.Confidence)
    examples:
      type: list
      items: { type: ref }
      description: 示例场景 (→M1 实例 yaml 引用)
    references:
      type: list
      items: { type: ref }
      description: 引用其他 M3 Element (反向链接)
    rationale:
      type: string
      description: 约束存在的 rationale (架构意图)
    half_life_days:
      type: integer
      default: 365
      min: 1
      description: 价值半衰期 (天),默认 1 年

  # ──── 校验规则 ────
  validationRules:
    - rule: severity == 'critical' implies applies_to ⊆ ['L0', 'M0']
      level: error
      message: critical 约束只能用于 L0/M0 元层
    - rule: confidence in ['hypothesis', 'estimated'] implies severity in ['low', 'medium']
      level: error
      message: 假设/估计 置信度不能升 high/critical
    - rule: rule_expr.kind == 'ref' implies rule_expr.ref != null
      level: error
      message: ref 表达式必须有引用目标
    - rule: state == 'aging' implies half_life_days < 365
      level: warning
      message: 老化约束应有较短半衰期

  # ──── 关系约束 ────
  relationConstraints:
    can_be_source_of:
      - Constrains
      - ConflictsWith
    can_be_target_of:
      - Constrains
      - DependsOn
      - Supersedes
      - ConflictsWith

  # ──── ADR / 治理锚 ────
  adr_refs:
    - ADR-0132 (L0/M0/MOF 统一元模型)
    - ADR-0129 (state projection plane, gitignored 派生面)

  examples:
    - id: X1-C01-v2
      name: Protocol registration requirement
      description: 所有跨层协议映射必须在 L0 Protocol Registry 中注册
      applies_to: [L0, L1, L2, L3]
      dimension: X1
      severity: high
      rule_expr: { kind: predicate, args: 'protocol.registered == true' }
      violation_code: 'E-L0-001: 未注册协议映射'
      confidence: fact
      state: scored_active
    - id: CR-MCP-LAZY-01-v2
      name: Agora Proxy lazy initialization
      description: Agora Proxy 必须采用 lazy initialization 避免循环依赖锁死
      applies_to: [L0, L1, L2, I0]
      dimension: X1
      severity: critical
      rule_expr: { kind: predicate, args: "proxy.initialization == 'lazy'" }
      violation_code: 'E-L0-011: 触发代理循环依赖 (Eager proxy initialization detected)'
      confidence: fact
      half_life_days: 730
      state: scored_active
