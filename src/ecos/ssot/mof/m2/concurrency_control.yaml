m2_type: ConcurrencyControl
version: 1.0.0
created: '2026-06-13'
updated: '2026-06-13'
ConcurrencyControl:
  m3_parent: InfrastructureElement.Concurrency
  description: 并发控制机制——文件锁、乐观锁、信号量等
  icon: 🔒
  stateMachine:
    draft:
      description: 草稿
      transitions: [active, deprecated]
    active:
      description: 激活
      transitions: [deprecated]
    deprecated:
      description: 弃用
      transitions: [archived]
    archived:
      description: 归档
      transitions: []
  requiredProperties:
    lock_type:
      type: string
      description: 锁类型 (file_lock/optimistic_lock/semaphore/mutex)
  optionalProperties:
    scope:
      type: string
      description: 锁作用域 (e.g. domain_control/global/per_resource)
    timeout_seconds:
      type: number
      description: 锁获取超时 (秒)
    retry_interval:
      type: number
      description: 重试间隔 (秒)
    max_retries:
      type: number
      description: 最大重试次数
  validationRules:
    - rule: lock_type != null
      level: error
      message: ConcurrencyControl 必须有 lock_type
    - rule: status == 'active' implies timeout_seconds > 0
      level: warning
      message: 激活的锁应配置 timeout_seconds
  relationConstraints:
    can_be_source_of:
      - Protects
    can_be_target_of:
      - References
  examples:
    - id: CONCURRENCY-FILE-LOCK
      name: fcntl 文件锁
      description: 基于 fcntl.flock 的文件级互斥
    - id: CONCURRENCY-OPTIMISTIC
      name: 乐观锁
      description: 基于版本号的乐观并发控制
