m2_type: RoutingPolicy
version: 1.0.0
created: '2026-06-08T23:27:00'
routing_policy:
  m3_parent: GovernanceElement
  description: LLM 路由策略节点(cost-first/balanced 等)
  stateMachine:
    initial: draft
    states:
      - draft
      - active
      - deprecated
      - archived
    transitions:
      - from: draft
        to: active
        trigger: approve
      - from: active
        to: deprecated
        trigger: supersede
      - from: deprecated
        to: archived
        trigger: decommission
  requiredProperties:
    id:
      type: string
      description: 唯一标识
    name:
      type: string
      description: 策略名称
  optionalProperties:
    strategy:
      type: string
      description: 路由策略
    fallback_provider:
      type: string
      description: 降级提供方
    cost_threshold:
      type: number
      description: 成本阈值 USD/1K tokens
