# M2: EventEnvelope
# W1-01 strict contract — raw event wrapper with explicit version + relationship fields.
# Anchored to BehavioralElement — an event envelope is a behavioral signal carrier.

m2_type: EventEnvelope
version: 1.0.0
created: '2026-08-10T10:00:00+08:00'
EventEnvelope:
  m3_parent: BehavioralElement
  description: |
    Event 信封——原始事件的严格包装器，携带显式版本字段和关系字段。
    定义"系统中发生了什么"的最小可信单元。
    每个 EventEnvelope 必须声明 schema_version 和 source_ref（来源引用），
    确保 provenance 明确无歧义。

  icon: ✉️

  stateMachine:
    emitted:
      description: 已发射
      transitions: [delivered, dead_letter]
    delivered:
      description: 已送达
      transitions: [archived]
    dead_letter:
      description: 死信（送达失败）
      transitions: [emitted, archived]
    archived:
      description: 归档
      transitions: []

  requiredProperties:
    event_id:
      type: string
      description: 事件全局唯一标识 (UUID 或确定性 hash)
      pattern: '^[A-Za-z0-9_-]{8,}$'
    schema_version:
      type: string
      description: 契约版本号 (必须匹配 event-envelope/vN)
      pattern: '^event-envelope/v[0-9]+$'
    source_ref:
      type: string
      description: |
        显式来源引用 — 发出此事件的实体/系统/agent 的标识。
        这是 EventEnvelope 的核心关系字段，provenance 不可缺失。
      pattern: '^.+$'
    emitted_at:
      type: string
      description: 发射时间 (ISO-8601)
      format: date-time
    payload:
      type: map
      description: 事件业务载荷 (键值对)

  optionalProperties:
    episode_ref:
      type: ref
      description: 所属 Episode 引用 (→Episode)
    signal_ref:
      type: ref
      description: 由此事件衍生的 Signal 引用 (→Signal)
    trace_id:
      type: string
      description: 全链路追踪 ID

  validationRules:
    - rule: event_id is not None and event_id != ''
      level: error
      message: event_id 必须非空
    - rule: schema_version is not None and schema_version.startswith('event-envelope/v')
      level: error
      message: schema_version 必须匹配 event-envelope/vN 格式
    - rule: source_ref is not None and source_ref != ''
      level: error
      message: source_ref 必须非空 — 事件来源不可缺失或空
    - rule: emitted_at is not None and emitted_at != ''
      level: error
      message: emitted_at 必须非空

  relationConstraints:
    can_be_source_of:
      - ContainedBy  # →Episode
      - DerivesSignal  # →Signal
    can_be_target_of:
      - References

  examples:
    - id: EVENT-EXAMPLE-001
      name: 最小事件信封
      description: |
        一个携带 schema_version 和 source_ref 的最小 EventEnvelope 实例。
