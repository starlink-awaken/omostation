m2_type: Federation
version: 1.0.0
created: '2026-06-13'
updated: '2026-06-13'
Federation:
  m3_parent: ArchitectureElement.Federation
  description: 联邦模式——多节点协调
  icon: 🌐
  stateMachine:
    standalone:
      description: 单机
      transitions: [federated, archived]
    federated:
      description: 联邦
      transitions: [standalone, archived]
    archived:
      description: 归档
      transitions: []
  requiredProperties:
    node_id:
      type: string
      description: 节点唯一 ID
    federation_mode:
      type: string
      description: 联邦模式 (standalone/peer/master_slave/gossip)
  optionalProperties:
    peers:
      type: list
      description: 对等节点列表
    federated_domains:
      type: list
      description: 联邦化的域 ID 列表
  validationRules:
    - rule: node_id != null and federation_mode != null
      level: error
      message: Federation 必须有 node_id + federation_mode
  relationConstraints:
    can_be_source_of:
      - FederatesWith
    can_be_target_of:
      - References
  examples:
    - id: FEDERATION-STANDALONE
      name: 单机联邦
      description: 单节点运行, 未来可扩展
