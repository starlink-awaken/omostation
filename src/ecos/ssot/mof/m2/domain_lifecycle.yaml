m2_type: DomainLifecycle
version: 1.0.0
created: '2026-06-13T08:00:00'
updated: '2026-06-13'
DomainLifecycle:
  m3_parent: LifecycleElement.DomainLifecycle
  description: 域生命周期——域的完整状态机
  icon: 🔄
  stateMachine:
    proposed:
      description: 提案
      transitions: [active, archived]
    active:
      description: 激活
      transitions: [degraded, frozen, archived]
    degraded:
      description: 降级
      transitions: [active, frozen, archived]
    frozen:
      description: 冻结
      transitions: [active, archived]
    archived:
      description: 归档
      transitions: [removed]
    removed:
      description: 移除
      transitions: []
  requiredProperties:
    domain_id:
      type: string
      description: 适用域 ID (all 表示通用)
    stateMachine:
      type: list
      description: 状态转移序列
  optionalProperties:
    owner:
      type: string
      description: 生命周期 owner
  validationRules:
    - rule: domain_id != null
      level: error
      message: DomainLifecycle 必须有 domain_id
  relationConstraints:
    can_be_source_of:
      - Realizes
    can_be_target_of:
      - References
  examples:
    - id: DOMAIN-LIFECYCLE-STANDARD
      name: 标准域生命周期
      description: "21 域通用生命周期: proposed → active → degraded → frozen → archived → removed"
