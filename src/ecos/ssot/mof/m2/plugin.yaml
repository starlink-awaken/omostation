m2_type: Plugin
version: 1.0.0
created: '2026-06-13'
updated: '2026-06-13'
Plugin:
  m3_parent: ArchitectureElement.Plugin
  description: 插件——为系统提供可插拔的能力扩展
  icon: 🧩
  stateMachine:
    draft:
      description: 草稿
      transitions: [active, deprecated]
    active:
      description: 激活
      transitions: [deprecated]
    deprecated:
      description: 弃用
      transitions: [archived]
    archived:
      description: 归档
      transitions: []
  requiredProperties:
    plugin_type:
      type: string
      description: 插件类型 (builtin/external/dynamic_loaded)
    actions:
      type: list
      description: 插件提供的 actions 列表
  optionalProperties:
    metaos_admission:
      type: object
      description: MetaOS 准入白名单配置 (role, supports_otlp, omo_audit_trail_id, declared_values)
    domain_type:
      type: string
      description: 插件服务的 domain 类型 (e.g. config/document)
    version_constraint:
      type: string
      description: 版本约束 (semver 表达式)
  validationRules:
    - rule: plugin_type != null and actions.size >= 1
      level: error
      message: Plugin 必须有 plugin_type 与 ≥1 个 action
  relationConstraints:
    can_be_source_of:
      - Extends
    can_be_target_of:
      - References
  examples:
    - id: PLUGIN-CONFIG-DOMAIN
      name: ConfigDomainPlugin
      description: 配置域的 4-action 插件
    - id: PLUGIN-DOCUMENT-KEMS
      name: DocumentKEMSPlugin
      description: 文档域的 KEMS 5 面插件
