id: "OMO-SELF-CORRECTION-PATTERN"
type: Pattern
name: "OMO Self-Correction Discipline 模式"
description: "OMO 路线图 P5-P7 closeout 阶段建立的 self-correction 8 段硬结构 + 5 红线 + 6 遗留争议显式段. 用于所有 OPC Phase / Sub-gate / Self-correction 收口报告."
status: "documented"
domain: "meta"
layer: "L2"
created: "2026-06-13"
version: "1.0.0"
properties:
  problem: "OPC 路线图 Phase / Sub-gate closeout 报告缺少 reviewer-acceptable 结构, 容易出现 (1) 结论虚假 / (2) 精确命令缺失 / (3) 工作区状态不分区域 / (4) 第三方强建议未执行时不承认 / (5) 反模式轨迹不可审计 / (6) Self-Correction 闭环无显式段 / (7) 遗留争议被掩盖 / (8) Redline 失守 8 类反模式"
  context: "适用于 OPC P0-P7 路线图所有 Phase / Sub-gate / Self-correction 收口报告. 不适用于: (1) 单文件 bug 修复 (无 closeout) (2) 中间 commit (无 closeout) (3) 文档增量更新 (无 6 段遗留争议必要)"
  solution: "8 段硬结构 (诚实话语前置 / 精确命令 / 工作区分区域 / 次优解承认 / 反模式修复轨迹 / Self-Correction Trajectory / 遗留争议显式 / Redline Audit) + 5 红线 (gate_status=not_yet_passed / planned→active 必须审批 / manual 演练仅 1 次 / 子仓指针不自动 bump / 无证据不宣称 passed) + 6 处遗留争议必列 (P0-P3 红黄绿)"
  domain_field: ".omo"
  lifecycle: "active"
  known_uses:
    - "2026-06-13: OPC P5-P7 closeout (8 阶段模拟演练, F1-F4 / G1-G4 / H1-H5 全部套用 8 段结构, reviewer 揭示 4 反模式, 全部闭环)"
    - "2026-06-13: scripts/opc_p7_phase_gate_check.py phase gate 自动检查, 引用 8 段结构作为 pass/fail 判据"
  anti_pattern: "看似合规但实际是 '结论先行 + 命令后补 + 反模式隐藏 + 强建议假装执行' 的伪 closeout 报告。识别信号: (1) 全文 0 个精确命令 (2) 0 处遗留争议 (3) gate_status 写 passed 但无 evidence (4) 子仓 dirty 假装干净"
  forces:
    - "closeout 时间紧迫 vs 8 段全部写完的成本"
    - "reviewer 一票否决风险 vs 自我验收通过"
    - "次优解的诚实承认 vs 全部 self-claim 为最优"
    - "redline 守住 (passed 不宣称) vs OPC 推进的'快进'惯性"
  related_patterns:
    - "PATT-2026-06-06-001 (SSOT 级联模式)"
    - "PATT-2026-06-06-002 (CARDS parent→child 模式)"
  relations:
    - "self_correction_closeout_report_path: .omo/_knowledge/audits/{date}-*-self-correction-closeout.md"
    - "self_correction_evidence_root: .omo/_delivery/audit-rollout/{date}-5repos.json"
    - "self_correction_8_sections_template: 诚实前置/精确命令/分区域/次优承认/反模式轨迹/Self-Correction/遗留争议/Redline"
    - "self_correction_5_red_lines: gate_status-not_passed/planned-not-active/manual-only-1-time/子仓指针不自动bump/无证据不宣称"
    - "self_correction_6_next_action: 6 处遗留争议必显式列 (P2/P3 红黄绿)"
  references:
    - "feedback_opc_closeout_reviewer_acceptable_20260613.md"
    - "feedback_no_standard_weakening_20260612.md"
    - "feedback_real_cron_window_stop_manual_practice_20260612.md"
    - ".omo/standards/opc-review-template.md"
    - "GOV-X1-CONSTRAINT.yaml: CR-CADENCE-01 / CR-INDEX-LOCK-01 / CR-MODE-ENV-01 / CR-TIME-ENV-01 / CR-MODE-COPY-01 / CR-DRIFT-LOOP-01 / CR-AUDIT-5REPOS-01"
    - "GOV-X4-CONSISTENCY.yaml: CS-06 / CS-07 / CS-08"
  incident_history:
    - "2026-06-13 OPC P5-P7 closeout (8 阶段模拟演练) — reviewer 揭示 4 反模式, 全部闭环"
source: ".omo/_knowledge/audits/2026-06-13-opc-p5-p7-self-correction-closeout.md"

