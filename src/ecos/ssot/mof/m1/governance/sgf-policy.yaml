# SGF-v1: Starlit Self-Governance Framework Unified Policy (M1 Model Instance)
# SSOT Source for all GAC checks configuration, replacing hardcoded checks in gac-local-gate.py.

id: "sgf-policy"
type: GovernancePolicy
name: "SGF 统一治理策略 — GAC 门禁配置数据化 SSOT"
description: "SGF-v1: 大仓 31 个 Gate 门禁项规则数据化注册表 + SGF 运行设置"
status: active
domain: "meta"
layer: "X"
created: "2026-08-03"
version: "1.0.0"
properties:
  policy_id: "sgf-policy"
  dimension: "all"
  thresholds:
    gates: 33

settings:
  attention:
    folding_threshold: 90
    drift_penetration: true
  output:
    terminal_mode: "slim"  # options: 'verbose', 'slim'

# 全量注册大仓 31 个 Gate 门禁项 (规则数据化)
gates:
  - id: "gac-validate"
    command: ["bin/gac/gac-validate.py", "--gate"]
  - id: "gac-drift"
    command: ["bin/gac/gac-drift.py"]
  - id: "write-owner-audit"
    command: ["bin/ssot/write-owner-audit.py", "--staged"]
  - id: "install-watch-agent"
    command: ["bin/gac/install-watch-agent.py"]
    ci_skip: true
  - id: "test-mcp-kos"
    command: ["bin/ssot/test-mcp-kos.py"]
  - id: "check-cockpit-ui-dist"
    command: ["bin/ssot/check-cockpit-ui-dist.py"]
  - id: "agent-workflow-lint"
    command: ["bin/agent-workflow.py", "lint"]
    broken: true
    broken_reason: "worktree 状态不完整, local agent-workflow 依赖不全"
  - id: "agent-workflow-integrations"
    command: ["bin/agent-workflow.py", "integrations"]
    broken: true
    broken_reason: "worktree 状态不完整, local agent-workflow 依赖不全"
  - id: "agent-workflow-adapters"
    command: ["bin/agent-workflow.py", "adapters"]
    broken: true
    broken_reason: "worktree 状态不完整, local agent-workflow 依赖不全"
  - id: "agent-workflow-bootstrap"
    command: ["bin/agent-workflow.py", "bootstrap", "--skip-health"]
    broken: true
    broken_reason: "worktree 状态不完整, local agent-workflow 依赖不全"
  - id: "agent-workflow-verify-plan"
    command: ["bin/agent-workflow.py", "verify", "--file", "bin/agent-workflow.py"]
    agent_workflow_only: true  # 仅在 staged touch agent-workflow 时跑
  - id: "agent-workflow-compliance"
    command: ["bin/agent-workflow.py", "compliance"]
    agent_workflow_only: true
  - id: "agent-workflow-doctor"
    command: ["bin/agent-workflow.py", "doctor"]
    ci_skip: true
    agent_workflow_only: true
  - id: "agent-workflow-observe"
    command: ["bin/agent-workflow.py", "observe"]
    broken: true
    broken_reason: "worktree 状态不完整, local agent-workflow 依赖不全"
  - id: "governance-evolution"
    command: ["bin/gac/governance-evolution.py", "validate", "--json"]
    ci_only: true  # ISC-3f/3g: 依赖 agora/cockpit 子模块脚本, worktree 部分 init 假阳性; non-strict pre-commit 跳过, CI strict 兜底
  - id: "mof-schema-validate"
    command: ["projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py", "--json"]
  - id: "mof-state-bridge"
    command: ["projects/ecos/src/ecos/ssot/tools/mof-state-bridge.py", "--json"]
  - id: "mof-drift"
    command: ["bin/mof/mof-drift"]
  - id: "m4-bootstrap-reflex"
    command: ["bin/mof/mof-bootstrap.py", "all"]
  - id: "m4-mcp-tool-integrity"
    command: ["bin/gac/mcp-tool-data-complete.py"]
  - id: "doc-ssot-lint"
    command: ["bin/ssot/doc-ssot-lint.py"]
    ci_only: true  # ISC-3f: check_required_generated_artifacts 依赖 docs/generated/* (gitignored post-commit 萃取), worktree 无; non-strict pre-commit 跳, CI strict 兜底
  - id: "project-layer-index"
    command: ["bin/mof/project-layer-index.py", "--check"]
    ci_only: true  # 默认 strict/CI 跑，本地 skip 防止冲突
  - id: "doc-ssot-snapshots"
    command: ["bin/ssot/doc-governance-check.py"]
    note: 原 scripts/check-doc-ssot-snapshots.py 已被取代; scripts/ 是镜像子模块. 见 ADR-0394.
  - id: "doc-link-check"
    command: ["bin/ssot/doc-link-check.py"]
  - id: "change-lane-check"
    command: ["bin/change-lane-check.py", "--staged"]
  - id: "dependency-baseline-drift"
    command: ["bin/mof/gen-dependency-baseline.py", "--check"]
    ci_only: true
  - id: "matrix-consistency"
    command: ["bin/ssot/matrix-consistency-lint.py", "--skip-launchd"]
    ci_skip: true  # CI 无 launchd 依赖，在 CI_SKIP 里注册
  - id: "governance-convergence"
    command: ["bin/gac/governance-convergence-lint.py"]
  - id: "governance-semantic-gate"
    command: ["bin/gac/governance-semantic-gate.py", "--json"]
  - id: "adr-coverage"
    command: ["bin/adr/adr-coverage.py", "--json"]
    description: "ADR-0367 C4: ADR 编号/前端/INDEX 覆盖检查, 阻断性"
  - id: "state-freshness-check"
    command: ["bin/gac/state-freshness-check.py", "--json"]
    ci_only: true
    ci_skip: true  # local env 无完整 state 快照, CI strict 跑
  - id: "check-dashboard-registry-consistency"
    command: ["bin/ssot/check-dashboard-registry-consistency.py"]
  - id: "check-toolbox-ssot"
    command: ["bin/ssot/check-toolbox-ssot.py"]
  - id: "check-domain-m1-alignment"
    command: ["bin/ssot/check-domain-m1-alignment.py"]
  - id: "test-gac-engine"
    command: ["bin/ssot/test-gac-engine.py"]
  - id: "service-config-validate"
    command: ["bin/mof/gen-service-configs.py", "--validate"]
  - id: "service-config-drift"
    command: ["bin/mof/gen-service-configs.py", "--check"]
    ci_skip: true  # P74 阶段3: 本机 plist drift gate, CI 无本机 plist → skip (双源与主仓 DEFAULT_POLICY L66-67 一致)
  - id: "gac-mesh-router-check"
    command: ["bin/gac/gac-mesh-router.py", "--check"]
    ci_only: true
    ci_skip: true  # 本地无 mesh-router 服务, CI strict 跑
  - id: "gac-consensus-inject-check"
    command: ["bin/gac/gac-consensus-inject.py", "--check"]
    ci_only: true
    ci_skip: true  # 本地无共识注入需求, CI strict 跑
  - id: "gac-compute-onboard-check"
    command: ["bin/gac/gac-compute-onboard.py", "--check"]
    broken: true
    broken_reason: "依赖本地算力服务 (cc-switch/codexbar/litellm/omlxc), 本地不存在 → 超时"
  - id: "bus-usage-report"
    command: ["bin/ssot/bus-usage-report.py"]
  - id: "bus-e2e-harness"
    command: ["bin/ssot/bus-e2e-harness.py", "--count", "30", "--json"]
    ci_only: true
  # ADR-0181: ecos core/fabric/ops import zones (was dead .omo/_knowledge/zones-check.py)
  - id: "zones-check"
    command: ["projects/ecos/src/ecos/ssot/tools/partition_import_lint.py", "--json"]
    ci_only: true
    ci_skip: true  # 本地 ecos 子模块可能已漂移, CI strict 跑
  # P45 W1 新增门禁 — 写协议 + 债务保护
  - id: "omo-state-write-guard"
    command: ["bin/gac/omo-state-write-guard.py"]
  - id: "brief-protect"
    command: ["bin/mof/generate-brief.py", "--protect"]
  # P0-A (integrated-governance §P0): 三把锁接线到 SGF 真实生效源.
  # sgf-policy 覆盖 DEFAULT_POLICY (load_sgf_policy or DEFAULT), 故必须接此处才生效.
  # layer-call 按 new-violation blocking: --baseline 存量 11 grace, 新违规 exit 1.
  - id: "mof-capabilities-drift-check"
    command: ["bin/mof/check-mof-capabilities-drift.py"]
  - id: "doc-claims-check"
    command: ["bin/mof/check-doc-claims.py"]
  - id: "layer-call-direction-check"
    command: ["bin/ssot/check-layer-call-direction.py", "--baseline", ".omo/_truth/registry/layer-call-baseline.txt"]
  # P85 G1+G2: redline executability wiring. These gates are what
  # the redline registry at .omo/_truth/registry/redlines.yaml
  # points to, so adding/removing rows there is safe.
  - id: "check-severity-registry"
    command: ["bin/gac/check-severity-registry.py"]
  - id: "check-work-landed"
    command: ["bin/gac/check-work-landed.py"]
    timeout: 45
  - id: "check-governance-ratio"
    command: ["bin/gac/check-governance-ratio.py"]
  - id: "check-redline-coverage"
    command: ["bin/gac/check-redline-coverage.py"]
  # P85 G2.2: workorder schema is warn-only by default; promote to
  # --strict in CI after the grace period (G2 follow-up).
  - id: "check-workorder-schema"
    command: ["bin/gac/check-workorder-schema.py"]
  # P85 G3: P84 dual-track守护. Three checks enforcing the
  # dual-track isolation contract (P84 §0).
  - id: "check-dual-track-purity"
    command: ["bin/gac/check-dual-track-purity.py"]
  - id: "check-silent-loss"
    command: ["bin/gac/check-silent-loss.py"]
  - id: "check-adversarial-effectiveness"
    command: ["bin/gac/check-adversarial-effectiveness.py"]
  # LLM-ENGINE-ARCHITECTURE Wave 3: LLM 推理必须走统一接入层 (llm-router / AetherForge)
  # 纯静态源码扫描 — CI (GitHub runner) 无本地 LLM 也能运行。
  # --warn: 历史存量迁移期仅告警不失败; 全量违规归零后移除 --warn 提升为硬 gate。
  - id: "check-llm-gateway-only"
    command: ["bin/gac/check-llm-gateway-only.py", "--warn", "--json"]
  # ADR-0379 E-3: CI 平面可观测性 — ci-surfaces SSOT 接线检测 (CR-CI-SURFACE-SSOT)
  - id: "ci-surfaces-check"
    command: ["bin/gac/check-ci-surfaces.py"]
  # D5 retro 强制: done bet 缺复盘 → gate 红 (bet-ledger retro-due)
  - id: "bet-retro-due-check"
    command: ["bin/plan/bet-ledger.py", "retro-due", "--json"]
