id: "GOV-X1-CONSTRAINT"
type: GovernancePolicy
name: "X1 约束维 — 系统边界与约束治理"
description: "X1 治理维: 定义 `.omo` 状态面、`projects/omo` 治理内核、`projects/c2g` 战略入口的边界、硬约束和合规规则"
status: active
domain: "meta"
layer: "X1"
created: "2026-06-09"
version: "1.0.0"
properties:
  policy_id: "x1-constraint-policy"
  dimension: "X1"
  constraints:
    - "CR-L0-01: 所有协议必须在 L0 注册"
    - "CR-L0-02: M1 节点必须满足 M2 Schema"
    - "CR-TRIGGER-01~06: Trigger 约束"
    - "CR-CADENCE-01: OPC cron wrapper 必须显式注入 INVOCATION_ID + OPC_TRIGGER"
    - "CR-INDEX-LOCK-01: index.json 写入必须 fcntl.flock 互斥"
    - "CR-MODE-ENV-01: OPC_MODE env 透传, 禁止硬编码 mode-specific 路径"
    - "CR-TIME-ENV-01: OPC_GENERATED_AT/OPC_TODAY env 覆盖语义时间"
    - "CR-MODE-COPY-01: {date}-{mode}.json 副本单一 owner (5repos.py)"
    - "CR-DRIFT-LOOP-01: drift>0 必须 emit self-evolution task 落 planned/ approval_required=true"
    - "CR-AUDIT-5REPOS-01: 5repos.py 路径唯一 .omo/_delivery/audit-rollout/{date}-5repos.json"
    - "CR-MOF-VALIDATE-01: MOF Schema 必跑校验 (mof-schema-validate.py 0 drift/missing/invalid)"
    - "CR-MOF-ALIAS-01: MOF Type Alias 双向匹配 (m2_type ∪ section_key 双向 alias)"
    - "CR-MOF-BIDIR-01: MOF Required 双向字段 (properties ∪ top-level 双向查找)"
    - "CR-MCP-LAZY-01: 所有 Agora ProxyManager 必须按需加载 (lazy=True) 以避免启动死锁"
    - "CS-10: BOS URI 注册必须包含 domain 和 cross_references.realized_by 元数据"
    - "CR-OMO-SURFACE-01: `.omo` 顶层治理资产必须登记到 .omo/_truth/registry/omo-governance-surfaces.yaml"
    - "CR-OMO-SURFACE-02: `.omo` 是 state plane, 不得被表述为完整治理执行内核"
    - "CR-C2G-INGRESS-01: `projects/c2g` 只能向 `.omo/tasks/planned/` 物化任务, 不得直写 active/done"
    - "CR-VIBEOPS-01: 混合裁判测试必须使用 @pytest.mark.vibeops 隔离"
    - "CR-VIBEOPS-02: LLM 裁判发包必须强制路由回 bos://capability/forge/gateway 计费网关 (原 bos://capability/llm-gateway 已并入 aetherforge)"
    - "CR-RBAC-01: Generator 角色无权访问 bos://capability/evaluator 裁判域"
    - "CR-ADMISSION-01: Agora 路由注册前必须通过 AdmissionPort.evaluate 准入审查（实现由 I0 SPI 绑定）"
    - "CR-C2G-01: 所有 OMO Planned Task 必须持有合法的 context_uri，指向设计的不可变契约或 Fast-Track 锚点。"
    - "CR-C2G-V3-01: C2G v3 SSOT Write-back 约束"
    - "CR-C2G-V3-02: C2G v3 Fast-Track Compaction 约束"
    - "CR-C2G-V3-03: C2G v3 Agent 战术退让约束"
    - "CR-STRATEGY-01: C2G v4 Pitch 孤儿拦截约束 (必须有 Upstream)"
    - "CR-STRATEGY-02: C2G v4 向量打分约束 (战略对齐衡量)"
    - "CR-STRATEGY-03: C2G v4 熵减代谢约束 (Sandbox 超过 28 天 GC 归档)"
  scope: "全层 (L0-L4, I0)"
  thresholds:
    warn_threshold: 0.7
    fail_threshold: 0.5
  sla:
    check_frequency: "weekly"
    response_time_hours: 24
  behavior:
    enforcement: "block-write"
    auto_remediation: false
  domain_field: "meta"
  validator: "ecos/ssot/registry/L0-constraints.yaml + .omo/_truth/x1-governance-policies.yaml + .omo/_truth/registry/omo-governance-surfaces.yaml"
  compliance: "partial"
source: "ecos/ssot/registry/L0-constraints.yaml + .omo/_truth/x1-governance-policies.yaml + .omo/standards/omo-governance-surfaces.md"

model_driven_refs:
  source_file: projects/ecos/src/ecos/ssot/mof/m1/

state_history:
  - state: active
    timestamp: '2026-06-19T00:00:00Z'
    reason: initial_modeling
