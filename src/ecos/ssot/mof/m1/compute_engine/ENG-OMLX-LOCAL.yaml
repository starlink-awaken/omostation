id: ENG-OMLX-LOCAL
type: ComputeEngine
node_ref: NODE-LOCAL-MAC
engine_type: local_inference
network_zone: local
base_url: "unix://omlxc/api/v1"
transport: unix_socket
endpoint_ref: omlxc.daemon.socket
placement_source: "omlxc GET /api/v1/models"
supported_protocols: ["omlxc-v1", "openai"]
request_defaults:
  chat_template_kwargs:
    enable_thinking: false
  thinking_budget: 0
cost_multiplier: 0.0001
status: active
description: >-
  omlxc UDS/API 提供本地物理 placement、容量准入与执行；AetherForge 保持逻辑模型、
  认证和唯一公共数据面 bos://compute/aetherforge/infer。默认关闭 thinking。

model_driven_refs:
  source_file: projects/ecos/src/ecos/ssot/mof/m1/

state_history:
  - state: active
    timestamp: '2026-06-19T00:00:00Z'
    reason: initial_modeling
  - state: active
    timestamp: '2026-07-04T00:00:00Z'
    reason: repoint_to_litellm_gateway_100.96.126.35:4000
  - state: active
    timestamp: '2026-07-05T00:00:00Z'
    reason: converge_all_nodes_wildcard_passthrough_and_mythos_fast
  - state: active
    timestamp: '2026-08-10T00:00:00Z'
    reason: >-
      repoint_from_litellm_4000_to_aetherforge_facade_9290 —
      LiteLLM 下线, 本机 omlx 模型的"单一 URL 多路复用"改由 aetherforge 的
      OpenAI 兼容门面承接。注意 gateway 对本机模型优先直连各模型端口
      (model_ports), 本 endpoint 是回退路径; gateway 侧已加自引用防护,
      避免回退时打回自己造成递归。
  - state: active
    timestamp: '2026-08-10T12:45:00Z'
