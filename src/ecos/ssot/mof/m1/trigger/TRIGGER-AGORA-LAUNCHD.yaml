id: "TRIGGER-AGORA-LAUNCHD"
type: "Trigger"
name: "Agora MCP Hub Launchd"
description: "Agora MCP Hub — 开机自启，SSE 模式需 --sse 标志"
status: "active"
domain: "meta"
layer: "I0"
created: "2026-06-09"
updated: "2026-06-16"
version: "1.1.0"
properties:
  trigger_type: "launchd"
  trigger_source: "launchd RunAtLoad + KeepAlive"
  trigger_action: "agora-mcp --sse"
  schedule: "continuous"
  health_check:
    endpoint: "http://127.0.0.1:8080/v1/health"
    expected_status: "200"
  convergence_note: "MCP default changed to stdio; SSE requires --sse flag"
source: "agora/scripts/install-launchd.sh"
