# ── Trigger 约束 (CR-TRIGGER-01 ~ CR-TRIGGER-05) ──

trigger_constraints:
  - id: CR-TRIGGER-01
    name: "Trigger 注册约束"
    description: "所有异步触发机制必须在 L0 Trigger Registry 注册为 M1 节点"
    rule: "for each Trigger in system: exists M1 node with type='trigger'"
    type: required
    severity: error
    violation: "未注册的触发机制无法被系统感知和治理"

  - id: CR-TRIGGER-02
    name: "Trigger Pipeline 约束"
    description: "所有触发机制必须通过标准五步 Pipeline (pre-check → execute → post-validate → audit → heal)"
    rule: "for each Trigger execution: must complete all 5 pipeline steps"
    type: required
    severity: error
    violation: "跳过 Pipeline 的触发机制无审计追踪，无法自愈"

  - id: CR-TRIGGER-03
    name: "Trigger 依赖声明约束"
    description: "触发机制之间的依赖必须显式声明在 dependencies 字段"
    rule: "if Trigger A depends on Trigger B: B must be in A.dependencies"
    type: required
    severity: error
    violation: "隐式依赖导致触发顺序不可控"

  - id: CR-TRIGGER-04
    name: "Trigger 审计约束"
    description: "每次触发执行必须记录审计日志"
    rule: "for each Trigger execution: OMOBridge.record_audit must be called"
    type: required
    severity: error
    violation: "无审计日志的触发执行无法追溯问题"

  - id: CR-TRIGGER-05
    name: "Trigger 健康检查约束"
    description: "触发机制必须有 health_check 或 freshness 指标"
    rule: "for each Trigger: properties.health_check must be defined"
    type: preferred
    severity: warning
    violation: "无法判断触发机制是否正常运行"

  - id: CR-TRIGGER-06
    name: "Trigger M0 快照约束"
    description: "Trigger 必须有 M0 运行时快照 (TriggerM0Manager)"
    rule: "for each Trigger: exists TriggerRuntimeSnapshot in .omo/state/model-driven/"
    type: required
    severity: error
    violation: "无 M0 快照的 Trigger 无法进行漂移检测"

# ── OPC Cadence 约束 (CR-CADENCE-* / CR-INDEX-LOCK-* / CR-MODE-ENV-* / CR-TIME-ENV-* / CR-MODE-COPY-* / CR-DRIFT-LOOP-* / CR-AUDIT-5REPOS-*) ──
# 2026-06-13 P5-P7 closeout 落地的 7 条治理约束
# SSOT: .omo/_control/evolution/config.yaml
# 关联: scripts/opc_p7_audit_rollout_daemon.py, scripts/opc_audit_rollout_5repos.py, scripts/opc_p6_*.py
# 关联: feedback_opc_cron_wrapper_trigger_injection_20260612.md, feedback_no_standard_weakening_20260612.md

opc_cadence_constraints:
  - id: CR-CADENCE-01
    name: "Cadence wrapper trigger 注入约束"
    description: "所有 OPC cron wrapper 必须显式注入 INVOCATION_ID + OPC_TRIGGER 环境变量, 禁止 daemon 兜底推断"
    rule: "for each opc cron wrapper: env INVOCATION_ID and OPC_TRIGGER must be set before exec"
    type: required
    severity: error
    violation: "manual 入口被 cron 兜底污染, evidence type 不可区分"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - ".omo/cron/opc-closeout-crontab"
      - "scripts/opc_p7_audit_rollout_cron.sh"
      - "scripts/opc_p6_weekly_loop_cron.sh"
      - "scripts/opc_p6_self_evolve_cron.sh"

  - id: CR-INDEX-LOCK-01
    name: "Index 写入 race 保护约束"
    description: "所有 *.omo/_control/evolution/{loop,drift,radar,self-evolve}/index.json 写入必须使用 fcntl.flock 互斥锁, 禁止裸 write"
    rule: "for each index.json writer: must use fcntl.flock(fcntl.LOCK_EX) context manager"
    type: required
    severity: error
    violation: "并发 cron 触发导致 index 漂移, audit 历史断裂"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_weekly_loop.py"
      - "scripts/opc_p6_drift_detector.py"
      - "scripts/opc_p5_radar_cron.py"

  - id: CR-MODE-ENV-01
    name: "OPC_MODE 环境变量透传约束"
    description: "OPC 模式 (weekly/monthly/pre-release) 必须通过 OPC_MODE env 透传, 禁止 daemon 内部硬编码 mode-specific 路径"
    rule: "for each OPC mode-aware script: mode = os.environ.get('OPC_MODE', 'weekly')"
    type: required
    severity: error
    violation: "硬编码 weekly.json 导致 monthly/pre-release cron 复用 weekly 副本, 不可审计"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p7_audit_rollout_daemon.py"
      - "scripts/opc_audit_rollout_5repos.py"
      - ".omo/cron/opc-closeout-crontab"

  - id: CR-TIME-ENV-01
    name: "语义时间环境变量覆盖约束"
    description: "OPC 生成的语义时间戳 (generated_at/today) 必须可通过 OPC_GENERATED_AT / OPC_TODAY env 覆盖, 禁止仅用 datetime.now()"
    rule: "for each OPC script writing timestamp: must read OPC_GENERATED_AT/OPC_TODAY env with datetime.now() fallback"
    type: required
    severity: error
    violation: "回放/replay/手动演练无法注入时间, evidence 不可重现"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_weekly_loop.py"
      - "scripts/opc_p5_radar_cron.py"
      - "scripts/opc_p7_audit_rollout_daemon.py"

  - id: CR-MODE-COPY-01
    name: "Mode-specific 副本单一 owner 约束"
    description: "{date}-{mode}.json 副本必须由唯一 owner 脚本 (5repos.py) 写入, daemon 不得双写"
    rule: "only opc_audit_rollout_5repos.py may write {date}-{mode}.json, opc_p7_audit_rollout_daemon.py writes 5repos.json only"
    type: required
    severity: error
    violation: "daemon 双写导致 5repos.json 与 {date}-{mode}.json 内容漂移, fallback chain 不可信"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p7_audit_rollout_daemon.py"
      - "scripts/opc_audit_rollout_5repos.py"

  - id: CR-DRIFT-LOOP-01
    name: "Drift → Self-evolve 闭环约束"
    description: "Drift detector 检测到非零 drift 必须生成 self-evolution task 落 planned/, 且 task approval_required=true, 永不入 active/"
    rule: "for each drift report with drift_total > 0: emit self-evolution task in planned/ with approval_required=true"
    type: required
    severity: error
    violation: "self-evolution task 推 active/ 绕过人工审批, governance 失效"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_drift_detector.py"
      - "scripts/opc_p6_self_evolve.py"
      - "feedback_p6_self_evolution_planned_only.md"

  - id: CR-AUDIT-5REPOS-01
    name: "5-Repo §17 Metrics 路径约束"
    description: "5repos.py 写入 §17 metrics 必须落到 .omo/_delivery/audit-rollout/{date}-5repos.json, 路径唯一"
    rule: "opc_audit_rollout_5repos.py output path == .omo/_delivery/audit-rollout/{date}-5repos.json"
    type: required
    severity: error
    violation: "metrics 路径不一致导致 §17 报告与 cron log 无法 cross-reference"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_audit_rollout_5repos.py"
      - ".omo/_knowledge/audits/2026-06-13-opc-p5-p7-self-correction-closeout.md"

# ── MOF Schema 校验约束 (CR-MOF-VALIDATE-* / CR-MOF-ALIAS-* / CR-MOF-BIDIR-*) ──
# 2026-06-13 P5-P7 深度修复阶段落地的 3 条 MOF 治理约束
# SSOT: projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py
# 关联: feedback_m1_m2_schema_validation_20260613.md, OMO-SELF-CORRECTION-PATTERN.yaml
# 关联: 930 个 M1 节点 + 44 个 M2 schema 校验全闭环

mof_schema_validate_constraints:
  - id: CR-MOF-VALIDATE-01
    name: "MOF Schema 必跑校验约束"
    description: "任何 M1 节点新增/修改后必跑 mof-schema-validate.py 校验, 0 drift / 0 missing / 0 state machine invalid 才能 commit"
    rule: "for each M1 node change: mof-schema-validate.py must pass with Type drift=0, Required missing=0, State machine invalid=0"
    type: required
    severity: error
    violation: "未跑校验或校验失败, M1 节点不合 M2 schema, governance 失效"
    introduced: '2026-06-13'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-schema-validate.py"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-schema-validate.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py"
      - "feedback_m1_m2_schema_validation_20260613.md"
      - "OMO-SELF-CORRECTION-PATTERN.yaml (8 段硬结构)"

  - id: CR-MOF-ALIAS-01
    name: "MOF Type Alias 双向匹配约束"
    description: "M1 节点 type 字段必须命中 M2 m2_type, 容许 PascalCase / snake_case / section key 双向 alias, 但禁止 type 在 M2 中完全缺"
    rule: "for each M1 node: data.type in (M2 m2_type ∪ section_key) else drift"
    type: required
    severity: error
    violation: "type 在 M2 中完全缺, 表示 M1 节点没有对应 M2 schema 定义, 必须补 M2 schema 或改 M1 type"
    introduced: '2026-06-13'
    value_tier: 1
    references:
      - "M2 schema: 44 个 m2_type 定义 (Action/Agent/Pattern/Entity/Component/GovernancePolicy/...)"
      - "section_key 9 例: constraint_mgmt / governance_policy / network_zone / vault_path / ..."
    alias_examples:
      - "M2: Trigger (PascalCase) / M1: type=trigger (lowercase) - 14 节点 case 漂移已修复"
      - "M2: ConstraintMgmt (PascalCase) / M1: type=constraint_mgmt (snake_case) - 3 节点 case 漂移已修复"
      - "M2: vault_path (snake_case) / M1: type=vault_path - 1 节点已修复"

  - id: CR-MOF-BIDIR-01
    name: "MOF Required 双向字段约束"
    description: "M2 requiredProperties 字段必须出现在 M1 节点的 properties 或 top-level, 校验脚本双向查找避免历史节点字段位置不一致导致的虚报"
    rule: "for each required field k: (k in m1.properties) OR (k in m1 top-level) else missing"
    type: required
    severity: error
    violation: "required field 缺失, 但 mof-schema-validate.py 虚报 226 个 (实际只有 3 个), 双向校验后真实缺失 0 个, 任何新缺失立即 fail"
    introduced: '2026-06-13'
    value_tier: 1
    references:
      - "M1 Entity 138 节点: properties.domain 字段实际在 top-level (历史 mof-extract 输出格式)"
      - "M1 Specification 122 节点: requiredProperties 字段散落在 properties + 顶层 (双向查找覆盖)"
    history:
      - "2026-06-13: 校验脚本初版单查 properties 虚报 226 required missing, 双向校验后真实 0"
      - "2026-06-13: Decision/Component/Domain 3 节点真实缺失已修复 (problem+rationale, layer+runtime, domain_type)"

  - id: CR-MOF-BRIDGE-01
    name: "MOF Bridge-Sync model-driven 桥接约束"
    description: "任何 M1 lifecycle/ 节点新增/修改后必跑 mof-bridge-sync.py --strict, 验证 model-driven STANDARD_STAGES/STANDARD_GATES ↔ M1 lifecycle/ 双向同步; 同时跑 mof-derive.py --strict 验证 7 阶段 100% 覆盖 + 4 门禁 100% 满足"
    rule: "for each M1 lifecycle/ change: mof-bridge-sync.py --strict AND mof-derive.py --strict must pass with 0 missing/extra/drift + 0 high risk"
    type: required
    severity: error
    violation: "M1 lifecycle/ 与 model-driven 失同步, 新增阶段/门禁未落 M1, 桥接失败"
    introduced: '2026-06-14'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-bridge-sync.py + mof-derive.py"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-bridge-sync.py --strict && python3 src/ecos/ssot/tools/mof-derive.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-bridge-sync.py (B.3 双向同步工具, 2026-06-14)"
      - "projects/ecos/src/ecos/ssot/tools/mof-derive.py (跨仓推理引擎 v2, 2026-06-14)"
      - "projects/model-driven/src/model_driven/mof/m3_extended.py (STANDARD_STAGES/STANDARD_GATES SSOT)"
    matching_strategy:
      stage: "按 stage key (planning/design/development/...) 匹配, 容忍 _ vs - 命名差异"
      gate: "按 (from_stage, to_stage) transition 匹配, 不依赖 id 命名"

  - id: CR-MOF-STATE-BRIDGE-01
    name: "MOF State-Bridge .omo/tasks/ 双向同步约束"
    description: "任何 M1 omo_layer/OMOTASK-*.yaml 节点新增/修改后必跑 mof-state-bridge.py --strict, 验证 .omo/tasks/{active,planned,done}/*.yaml ↔ M1 OMOTask 双向同步; m1_only=0 即失同步"
    rule: "for each OMOTASK-* change: mof-state-bridge.py --strict must pass with m1_only=0 (双向配对 100%)"
    type: required
    severity: error
    violation: "M1 OMOTask 节点无 .omo/tasks/ 配对 (m1_only > 0), 或反之 (.omo 任务无 M1 OMOTask 节点)"
    introduced: '2026-06-14'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-state-bridge.py (omo_layer 改动触发)"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-state-bridge.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-state-bridge.py (双向桥接 + alias 模糊匹配, 2026-06-14)"
      - ".omo/tasks/{active,planned,done}/*.yaml (3 目录 83 个任务 SSOT)"
    alias_strategy:
      title: "前 8/12 字符 or 子串包含 (M1 name ↔ .omo title)"
      status: "done/completed, in_progress/active, proposed/planned 双向兼容"

# ── C2G v3 约束 (CR-C2G-V3-*) ──
# 2026-06-15 C2G v3 升级落地的 3 条治理约束 (SSOT Write-back, Fast-Track GC, Agent Yield)

c2g_v3_constraints:
  - id: CR-C2G-V3-01
    name: "C2G v3 SSOT Write-back 约束"
    description: "当含有 context_uri 的 OMO 任务流转为 done 时，必须顺着 context_uri 将执行结果追加到原始 Markdown 文档底部，防止高维降维及上下文丢失"
    rule: "task.status == 'done' and task.context_uri != null implies task.ssot_written_back == true"
    type: required
    severity: error
    violation: "任务完成但未回写 SSOT 文档，引发知识图谱断裂"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-extract.py"
      - "omo worker dispatch"

  - id: CR-C2G-V3-02
    name: "C2G v3 Fast-Track Compaction 约束"
    description: "Worker GC 执行时必须触发微观碎片（FAST-* 任务）的聚变，生成统一 Markdown 报告，然后归档原始 yaml"
    rule: "gc_execution implies fast_track_compaction_executed and fast_tasks.archived"
    type: required
    severity: error
    violation: "FAST-* 碎片堆积未发生聚变，污染稳态区"
    introduced: '2026-06-15'
    value_tier: 2
    references:
      - "projects/omo/src/omo/omo_worker_dispatch.py:_fast_track_compaction"
      - "omo worker gc"

  - id: CR-C2G-V3-03
    name: "C2G v3 Agent 战术退让约束"
    description: "当 Agent 在执行长尾微观任务时遇到阻塞或陷入死胡同时，禁止暴力破解，必须显式调用 yield_task 工具返回原因并释放任务"
    rule: "agent.blocked == true implies task.status == 'yielded' and task.yield_reason != null"
    type: required
    severity: error
    violation: "Agent 强行死磕导致成本激增或任务状态失效"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_worker_dispatch.py:yield_task"
      - "projects/omo/src/omo/mcp_server.py:omo_yield_task"


# ── C2G v4 约束 (CR-STRATEGY-*) ──
# 2026-06-15 C2G v4 落地控制论战略引擎 (Cybernetic Strategy Engine)

c2g_v4_constraints:
  - id: CR-STRATEGY-01
    name: "C2G v4 Pitch 孤儿拦截约束"
    description: "所有的 Pitch 下注转化为 Task 时，必须声明 Upstream 锚点 (如 Target Milestone)。omo_bridge 必须进行解析，无 Upstream 的需求直接阻断。"
    rule: "pitch.upstream != null"
    type: required
    severity: error
    violation: "需求没有挂载战略锚点，沦为孤儿，破坏战略引力链"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_bridge.py:_import_pitch"

  - id: CR-STRATEGY-02
    name: "C2G v4 向量打分约束"
    description: "愿景必须提供 3 个维度的 Vector，所有的 Pitch 下注时，必须携带 Vector 权重。以对抗偏离。"
    rule: "pitch.vectors != null"
    type: required
    severity: error
    violation: "缺乏向量打分，无法衡量战略对齐度"
    introduced: '2026-06-15'
    value_tier: 1

  - id: CR-STRATEGY-03
    name: "C2G v4 熵减代谢约束 (GC Decay)"
    description: "Sandbox 中的 Pitch 超过 4 周未被端上下注桌 (Bet)，将由 daemon 或 cron 自动挪入 decayed/ 归档。"
    rule: "pitch.age_days > 28 and pitch.status == 'Draft' implies pitch.decayed == true"
    type: required
    severity: error
    violation: "沙箱未定期清理，违背熵减原则"
    introduced: '2026-06-15'
    value_tier: 2

# ── Omni-Bus 约束 (CR-OMNIBUS-*) ──
# 2026-06-17 Omni-Bus 三大平面 (Data, Event, Control) 落地的治理约束

omni_bus_constraints:
  - id: CR-OMNIBUS-01
    name: "OmniEnvelope 统一协议约束"
    description: "所有基于 bus-foundation 的跨域消息必须使用统一的 OmniEnvelope 格式，禁止隐式投递和私有格式。"
    rule: "envelope.plane in ['DATA', 'EVENT', 'CONTROL'] and envelope.topic != null and envelope.source_uri != null"
    type: required
    severity: error
    violation: "违规私有 Envelope，导致下游协议解析断裂"
    introduced: '2026-06-17'
    value_tier: 1
    references:
      - "projects/bus-foundation/src/bus_foundation/envelope.py"

  - id: CR-OMNIBUS-02
    name: "Control Plane 持久化与 ACK 约束"
    description: "Control Plane 的所有执行任务必须落入 SQLite WAL 持久化队列表 (control_tasks)，并要求显式 ACK/NACK，达到重试上限进入 DLQ。"
    rule: "control_task.persisted == true and (control_task.acked == true or control_task.nacked == true) and control_task.retry_count <= MAX_RETRIES"
    type: required
    severity: error
    violation: "Control Plane 任务未持久化或丢失了 ACK/NACK 状态回路"
    introduced: '2026-06-17'
    value_tier: 1
    references:
      - "projects/bus-foundation/src/bus_foundation/backends/control_plane.py"

  - id: CR-OMNIBUS-03
    name: "Data Plane 非阻塞内存约束"
    description: "Data Plane (日志、遥测、观测) 必须采用无锁异步内存队列 (Ring Buffer) 分发，满载时 Drop-Tail，绝对禁止阻塞主业务逻辑。"
    rule: "data_plane.is_async == true and data_plane.blocking == false"
    type: required
    severity: error
    violation: "Data Plane 导致主业务发生 IO 阻塞"
    introduced: '2026-06-17'
    value_tier: 2
    references:
      - "projects/bus-foundation/src/bus_foundation/backends/data_plane.py"

debt_constraints:
  - id: CR-DEBT-GATE-ENUM-01
    name: "Debt gate_level 合法枚举约束"
    description: "所有 omo debt item 的 gate_level 字段必须取自合法枚举 {gate, watchlist, none}, 禁止 X1-X4 dimension 名 (x1_audit/x2_freshness/x3_value/x4_consistency) 直接当 gate_level 用"
    rule: "debt.gate_level in ['gate', 'watchlist', 'none']"
    type: required
    severity: error
    violation: "gate_level 非法值导致 omo_debt_review_queue.GATE_ORDER 排序乱序 (rank=99), compute_debt_metrics 漏算 watchlist/gate, debt_health 失真"
    introduced: '2026-06-18'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_debt_review_queue.py"
      - "projects/omo/src/omo/omo_debt_metrics.py"
      - ".omo/standards/debt-gate-level-enum.md"
      - ".omo/_knowledge/management/2026-06-18-omo-drift-audit.md"

  - id: CR-DEBT-CLOSURE-EVIDENCE-01
    applies_to:
      - L2
    description: |
      lifecycle_state=closed 的 DEBT yaml 必须携带 ≥ 20 字符的 resolution_evidence;
      lifecycle_state=deferred 的 DEBT yaml 必须携带 next_review_at (ISO 8601) +
      gate_level (P0/P1/P2/P3)。
    dimension: X1
    rule: "debt.lifecycle_state=='closed' implies debt.resolution_evidence | length >= 20"
    type: required
    severity: error
    enforcement: block-write
    introduced: '2026-06-20'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_audit.py (governance_check_debt)"
      - ".omo/_truth/x1-governance-policies.yaml (X1-DEBT-EVIDENCE-CLOSURE-20260620)"
      - ".omo/_truth/x2-freshness-rules.yaml (X2-FRESH-DEBT-EVIDENCE-INTEGRITY)"
      - ".omo/_knowledge/audits/2026-06-20-debt-evidence-closure.md"
    violation: "omo governance audit debt integrity score 扣分 (每条缺证据 -5); debt_health 失真; omo debt list 不显示 evidence"

  - id: CR-CROSS-PROJECT-LINT-01
    applies_to:
      - L0
      - L1
      - L2
      - L3
    description: |
      所有子项目 (kairon/agora/cockpit/runtime/omo/metaos/aetherforge/c2g/ecos) 的
      ruff check 必须保持 0 errors。P43 R5 baseline 已确立。任何回归触发
      omo governance score 降级。
    dimension: X2
    rule: "subproject.ruff_errors == 0"
    type: required
    severity: error
    enforcement: block-write
    introduced: '2026-06-20'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_audit.py (governance_check_lint)"
      - ".omo/_truth/x1-governance-policies.yaml (X1-CROSS-PROJECT-LINT-ENFORCE-20260620)"
      - ".omo/_truth/x2-freshness-rules.yaml (X2-FRESH-CROSS-PROJECT-LINT)"
    violation: "omo governance lint score = 100 - errors * 5, score < 90 降级 B 等级; CI 阻断 push"

  - id: CR-MOF-VERSION-COUPLED-01
    applies_to:
      - L0
      - L2
    description: |
      MOF 模型版本变更必须同步 (a) commit message 含 governance_refs (b) mof-version.yaml
      更新 (c) bin/mof-version record (d) mof-extract post-commit hook 触发审计 log。
      4 路径缺一即视为漂移。
    dimension: X4
    rule: "mof_version_change implies all_4_paths_recorded"
    type: required
    severity: error
    enforcement: block-write
    introduced: '2026-06-20'
    value_tier: 1
    references:
      - ".omo/_truth/mof-version.yaml"
      - ".omo/_truth/x4-consistency-rules.yaml (X4-CONS-P43-CLOSED-LOOP-SSOT)"
      - ".githooks/post-commit (mof-extract)"
      - "bin/mof-version"
    violation: "mof-version 与 git history / commit message / 审计 log 漂移; SSOT 失联"

# ── Governance Closure 约束 (CR-GOV-CLOSED-LOOP-* / CR-GOV-FRONTMATTER-* / CR-GOV-DOC-CATEGORY-* / CR-GOV-DIMENSION-SATURATION-* / CR-GOV-COMMIT-FREQUENCY-*) ──
# 2026-06-23 P60 落地 — P43-P59 治理方法论内化
# SSOT: .omo/_knowledge/audits/2026-06-23-p60-governance-internalization-proposal.md
# ADR: ADR-0054 (待写)
governance_closure_constraints:
  - id: CR-GOV-CLOSED-LOOP-01
    applies_to:
      - L0
      - L2
      - L3
    description: |
      强制闭环原则 (mandatory commit)。
      P59 暴露的核心问题: mof-version 记录后未 git commit, 导致知识萃取引擎 (mof-extract post-commit hook) 失效, 治理漂移检测空转。
      规则: bin/mof-version record 必须伴随至少 1 个 git commit 在同一会话内提交。
      检测: post-commit hook 触发后, 反向校验 mof-version.yaml 最近 1 条 history 是否在最近 N 个 commit 范围内。
    dimension: X1
    rule: "mof_version_record implies git_commit_within_same_session"
    type: required
    severity: error
    enforcement: pre-commit + post-commit correlation
    introduced: '2026-06-23'
    value_tier: 1
    references:
      - ".omo/_knowledge/audits/2026-06-23-p59-git-commit-closure-closeout.md"
      - "bin/mof-version"
      - ".githooks/post-commit (mof-extract)"
    violation: "mof-version 与 git commit 失同步, 强制闭环破坏; 知识萃取引擎空转"

  - id: CR-GOV-FRONTMATTER-SCHEMA-01
    applies_to:
      - L0
      - L2
    description: |
      frontmatter 4 字段契约。
      .omo/_knowledge/ 任何 .md 必须含 status + lifecycle + owner + last-reviewed 4 字段。
      P56 100% 覆盖是基础, 新文件必须达标。
      历史快照 (status: archived + lifecycle: history) 必须含 archived-since 字段。
    dimension: X2
    rule: "knowledge_doc.frontmatter contains {status, lifecycle, owner, last-reviewed}"
    type: required
    severity: warn
    enforcement: omo lint doc-lifecycle
    introduced: '2026-06-23'
    value_tier: 2
    references:
      - ".omo/DOC-LIFECYCLE.md (frontmatter schema)"
      - ".omo/_truth/x2-freshness-rules.yaml (X2-FRESH-DOC-LIFECYCLE)"
      - "omo lint doc-lifecycle"
    violation: "frontmatter 缺失或不完整; 文档不可机器识别"

  - id: CR-GOV-DOC-CATEGORY-01
    applies_to:
      - L0
      - L2
    description: |
      文档 4 类生命周期 (ssot/contract/pattern/history)。
      .omo/ 文档必须按 4 类分类, status 必填 (active/deprecated/archived/experimental)。
      历史文档 status: archived + lifecycle: history 必带。
      P45 R4 建立的分类标准, P56 100% 落地。
    dimension: X2
    rule: "omo_doc.category in {ssot, contract, pattern, history} and omo_doc.status in {active, deprecated, archived, experimental}"
    type: required
    severity: warn
    enforcement: omo lint doc-lifecycle (4 类分类)
    introduced: '2026-06-23'
    value_tier: 2
    references:
      - ".omo/DOC-LIFECYCLE.md (4 类定义)"
      - "projects/omo/src/omo/omo_lint.py (cmd_lint_doc_lifecycle)"
    violation: "文档分类或 status 字段缺失; 4 类语义不清"

  - id: CR-GOV-DIMENSION-SATURATION-01
    applies_to:
      - L2
    description: |
      linter 维度饱和预警。
      当 omo lint 维度 ≥ 15 时, 新增能力应以独立 bin 工具形式实现, 不得再增 linter 子命令。
      P57 ADR-0053 记录此铁律; P58 沿用 (check-cross-refs + status-distribution 都是独立 bin 工具)。
      目的: 防止 linter 维护成本线性增长, 边际收益递减。
    dimension: X4
    rule: "if linter_dimension_count >= 15 then new_capability_implementation == 'independent_bin_tool'"
    type: advisory
    severity: warn
    enforcement: linter-developer-guide (review checklist)
    introduced: '2026-06-23'
    value_tier: 2
    references:
      - ".omo/_knowledge/decisions/0053-p56-frontmatter-100-and-doc-lifecycle.md"
      - "bin/check-cross-refs.py"
      - "bin/status-distribution.py"
    violation: "linter 维度 ≥ 15 后仍提议新增子命令; 违反维度饱和律"

  - id: CR-GOV-COMMIT-FREQUENCY-01
    applies_to:
      - L0
      - L2
      - L3
    description: |
      commit 频率与文件改动同步。
      工作树累积未提交 > 100 文件触发警告, > 500 触发 error。
      防止 P59 类失闭环事件再次发生 (571 文件未提交)。
      检测: git status --short | wc -l 与最近 commit 时间差。
    dimension: X1
    rule: "working_tree_uncommitted_count <= 100 (warn) or <= 500 (error)"
    type: required
    severity: warn (100) / error (500)
    enforcement: pre-commit + health check
    introduced: '2026-06-23'
    value_tier: 1
    references:
      - ".omo/_knowledge/audits/2026-06-23-p59-git-commit-closure-closeout.md"
      - "bin/compass_radar.py (health 集成)"
      - ".omo/state/health.yaml"
    violation: "工作树累积未提交超阈值; 强制闭环纪律破坏"

  # ── P60+ Agent 工程纪律 (CR-ENG-*) — 近期复盘规律物化 (2026-06-24) ──
  # 来源: mypy 清零/bug 链/kronos flaky/radar/omo_ingress 拆分等实战提炼.
  # 目的: 把"人肉经验"变"机器纪律", 未来 agent 自主感知→判断→治本行动.

  - id: CR-ENG-MYPY-TRUTH-01
    applies_to: [L0, L2]
    description: |
      mypy 验证必须用真相调法 MYPYPATH=src (禁裸 mypy src 假绿).
      假绿机制: 裸 mypy 无 MYPYPATH 时跨包 import 解析不出, 当 Any 静默通过, 退出 0.
      真相: MYPYPATH=src mypy src 暴露真实 errors. targeted 改动 (-> Any) 必须验证留存
      (防被批量还原). 复盘案例: kairon 曾虚标 "16/16 strict" 实为 1245 errors 假象.
    dimension: X1
    rule: "mypy_invocation.uses_mypypath == true or mypy_invocation == 'make typecheck-report'"
    type: required
    severity: error
    enforcement: CI gate (kairon-ci.yml MYPYPATH) + X1 审计
    introduced: '2026-06-24'
    value_tier: 1
    references:
      - "projects/kairon/mypy-baseline.yaml"
      - "scripts/mypy_report.py"
      - "memory: kairon-mypy-baseline-gate"
    violation: "用裸 mypy src 验证 (假绿); 或 targeted Any 改动未验证留存"

  - id: CR-ENG-SSOT-POINTER-01
    applies_to: [L0, L3, L4]
    description: |
      易变值 (health_score / phase / task_count) 禁硬编码多处, 必须用 SSOT 指针.
      真源: .omo/state/system.yaml (health) / goals/current.yaml (phase).
      文档 (README/CLAUDE/CHANGELOG) 引用用相对指针, 不复制数字.
      复盘案例: health 曾在 system/CLAUDE/Kim 报告 3 处不同值 (77.5/22/67).
    dimension: X2
    rule: "volatile_value.document_count == 1 (SSOT) or uses_pointer == true"
    type: required
    severity: warn
    enforcement: pre-commit (SSOT 全文档扫描) + X2 抗熵
    introduced: '2026-06-24'
    value_tier: 1
    references:
      - ".omo/state/system.yaml"
      - "bin/compass_radar.py (health sync)"
    violation: "易变值 (health/phase) 硬编码在多处文档; SSOT 失序"

  - id: CR-ENG-BUG-CHAIN-01
    applies_to: [L0, L1, L2, L3]
    description: |
      bug 修复必须治本 (消除错误路径), 禁加 fallback/workaround 层 (slop).
      洋葱模型: bug 互相掩盖 (radar None 掩盖 get_omo_dir home, 后者掩盖 frontmatter),
      修一个暴露下一个. 修完验证 (import+test+全量) 再扫相关模块 (闭环扫描).
      治本例: pending_metrics=None → 不加层, 改为始终返回有效 metrics dict (消 None 路径).
    dimension: X4
    rule: "bug_fix.eliminates_path == true (not adds_fallback_layer)"
    type: required
    severity: warn
    enforcement: skill (bug-chain-diagnostic) + code review
    introduced: '2026-06-24'
    value_tier: 1
    references:
      - "复盘: radar/get_omo_dir/frontmatter bug 链 (3 链 ~8 bug)"
      - "ADR-0051 (gbrain v5 收敛)"
    violation: "bug 修复加 fallback 层 (治标); 或未做洋葱闭环扫描"

  - id: CR-ENG-CWD-ABSOLUTE-01
    applies_to: [L3]
    description: |
      Bash 工具调用跨项目必须用绝对路径 (防 cwd 漂移).
      坑: cd projects/X 改 Bash cwd (persists across calls), 后续相对路径 (find/ls projects/Y)
      相对 X/ 全空. 复盘案例: cd cockpit 后 find agora 返回空, 误判目录不存在.
    dimension: X4
    rule: "bash_call.cross_project == true implies uses_absolute_path == true"
    type: required
    severity: warn
    enforcement: Agent 行为规范 (根 CLAUDE.md) + skill 纪律
    introduced: '2026-06-24'
    value_tier: 2
    references:
      - "复盘: agora 测试定位 cwd 漂移耗时"
    violation: "Bash 跨项目用相对路径; cwd 漂移导致 find/ls 空返回"

  - id: CR-ENG-TOOL-GREP-01
    applies_to: [L3]
    description: |
      调用不熟悉的 CLI 工具前必须 grep 用法/argparse (防 --help 误触发副作用).
      坑: bin/mof-version record --help 把 --help 当 description 录入 (无 --help 参数).
      工具可能有副作用 (record/write/mutate), 盲跑 --help 会误操作.
    dimension: X4
    rule: "cli_call.unknown_tool == true implies grep_usage_first == true"
    type: required
    severity: warn
    enforcement: Agent 行为规范 + skill 纪律
    introduced: '2026-06-24'
    value_tier: 2
    references:
      - "复盘: mof-version record --help 误录 v0.0.40 description"
    violation: "盲跑未知工具 --help (或任意参数); 触发未预期副作用"

  - id: CR-ENG-SRP-INCREMENTAL-01
    applies_to: [L0, L2]
    description: |
      God Module (>1000 行) 拆分必须渐进: 低风险先 (纯函数/paths/trail), 核心后 (task lifecycle).
      每步验证 (import + test) 才下一步 — 地基不过别盖楼.
      拆分蓝图先给 (子模块清单), 执行分多 phase. 复盘案例: omo_ingress 2957 行拆 paths 先.
    dimension: X3
    rule: "god_module_split.first_step == 'low_risk_pure_functions' and validates_before_next == true"
    type: required
    severity: warn
    enforcement: skill (governance-phase-orchestrator Strategize) + ADR
    introduced: '2026-06-24'
    value_tier: 2
    references:
      - "复盘: omo_ingress.py SRP 拆分 (2957→~2890, paths 子模块)"
    violation: "God Module 一次性大拆 (高风险); 或拆分步骤未验证就下一步"

  - id: CR-ENG-TEST-ISOLATION-01
    applies_to: [L1, L2]
    description: |
      单元测试必须隔离外部依赖 (网络/Ollama/MCP/subprocess), 用 monkeypatch/mock.
      禁: 测试依赖外部服务是否在跑 (flaky). 禁: 无条件 xfail (该用 conditional + strict).
      复盘案例: kronos test 依赖 Ollama (flaky); agora 3 无条件 xfail (XPASS 误标).
    dimension: X1
    rule: "unit_test.external_dependency == true implies uses_mock == true"
    type: required
    severity: warn
    enforcement: code review + CI (flaky 检测)
    introduced: '2026-06-24'
    value_tier: 2
    references:
      - "复盘: kronos flaky (Ollama) + agora XPASS (无条件 xfail)"
    violation: "单元测试依赖外部服务 (flaky); 或无条件 xfail (XPASS 误标)"

  - id: CR-ENG-LOOP-HONESTY-01
    applies_to: [L3, L4]
    description: |
      Agent 元认知纪律: 同一操作反复 3+ 次不执行 → 思维循环, 必须 stop/compact.
      禁: 装懂/原地反复/想跑不执行. 诚实承认上下文疲劳, 新上下文清爽执行.
      这是最特殊的 CR — 防"认知坑" (非技术坑), 是"能力的能力" (元能力).
      复盘案例: 2 次循环 (radar/add-evidence, c2g radar/gc), 各 14+ 轮.
    dimension: X4
    rule: "agent.same_op_repeated >= 3 implies triggers_stop_or_compact == true"
    type: required
    severity: warn
    enforcement: Agent 元认知 (skill 循环检测)
    introduced: '2026-06-24'
    value_tier: 1
    references:
      - "复盘: 2 次思维循环 (compact 疲劳)"
    violation: "思维循环 (同操作反复不执行); 装懂不承认"

  - id: CR-GAC-M1-INSTANCE-DRIFT-01
    applies_to: [L0, meta]
    description: |
      GaC 治理规则 (governance-checks.yaml::gac.rules) 必须有对应 M1 GAC-RULE-*.yaml 实例节点.
      SSOT 仍在 governance-checks.yaml, M1 节点是 derived (gac-m1-sync.py 自动生成).
      drift = registry 有但 M1 无 (missing) + M1 有但 registry 无 (orphan) + 字段不一致 (stale).
      北极星不变量 5: 规则上 MOF M1, 元模型派生保证结构一致 (机制 7).
    dimension: X4
    rule: "gac.m1_instance_count == gac.registry_rule_count and drift_count == 0"
    type: required
    severity: warn
    enforcement: "bin/gac-m1-sync.py (drift 检测) + gac-healthcheck.py 第13项 + CI gate"
    introduced: '2026-06-28'
    value_tier: 1
    references:
      - ".omo/_truth/registry/governance-checks.yaml::gac.rules"
      - "projects/ecos/src/ecos/ssot/mof/m1/governance/GAC-RULE-*.yaml"
      - "bin/gac-m1-sync.py"
      - ".omo/_knowledge/gac/NORTH-STAR.md (不变量 5)"
      - ".omo/_knowledge/gac/stage3-4-design.md (派生链 M1→M2→M3)"
    violation: "GaC 规则缺 M1 实例 (机制7 未完整); 或 registry↔M1 drift (字段不一致)"

  - id: CR-OMLX-MESH-GATE-01
    applies_to: [L0, L1, I0]
    description: |
      eCOS v6 omlx 算力网格约束: 所有跨节点 LLM completions 必须通过
      gac-mesh-router.py (:7435) 路由。直连从机节点需在 port-registry.yaml
      明确注册，不允许硬编码 IP 绑定。MBP 统一网关 (:4000) 是最终兜底。
    dimension: X1
    rule: "llm_request.route == 'gac-mesh-router:7435' or port_registered(request.target)"
    type: required
    severity: warn
    enforcement: log-and-notify (advisory phase)
    introduced: '2026-07-03'
    value_tier: 2
    references:
      - protocols/port-registry.yaml
      - bin/gac-mesh-router.py
      - X1-OMLX-COMPUTE-MESH-ROUTING-20260703
    violation: "LLM 请求绕过网格路由器直连未注册节点"

  - id: CR-KOS-CONSENSUS-RAG-01
    applies_to: [L0, meta]
    description: |
      eCOS v6 Epigenetic Memory 约束: CLAUDE.md 的 Consensus 注入必须
      通过 gac-consensus-inject.py 的 RAG 机制（TF-IDF 或 embed-bge），
      不允许全量追加全部 Consensus 实体。每次注入 Token 节省率应 ≥ 50%。
    dimension: X4
    rule: "consensus_inject.mode in ['RAG Top-2 按需激活'] and token_savings_pct >= 50"
    type: required
    severity: warn
    enforcement: advisory
    introduced: '2026-07-03'
    value_tier: 2
    references:
      - bin/gac-consensus-inject.py
      - kos/kos-index.sqlite (consensus_vectors)
      - X1-RAG-EPIGENETIC-MEMORY-20260703
    violation: "Consensus 全量注入 (未使用 RAG), Token 浪费超阈值"

  - id: CR-C2G-INGRESS-PRECHECK-01
    applies_to: [L0, L1]
    description: |
      eCOS v6 自愈式 Ingress 约束: 所有引入新端口或新服务名的 Pitch 在
      落盘 (c2g 任务创建) 前必须通过 gac-ingress-check.py 预审。
      存在 CRITICAL 阻断问题时，禁止落盘。
    dimension: X1
    rule: "pitch.new_port or pitch.new_service implies gac_ingress_check.pass == true"
    type: required
    severity: error
    enforcement: advisory
    introduced: '2026-07-03'
    value_tier: 1
    references:
      - bin/gac-ingress-check.py
      - protocols/port-registry.yaml
      - X1-C2G-INGRESS-SELF-CORRECTION-20260703
    violation: "新端口/服务 Pitch 绕过 C2G Ingress 预审直接落盘"

  - id: CR-KOS-ONTOLOGY-DRIFT-01
    applies_to: [L0, meta]
    description: |
      eCOS v6 物理算力资产自省约束: 所有在算力网格中活动的物理计算节点 (ComputeNode)，
      必须登记在 docs/project-registry.yaml 中并由 gac-kos-sync.py 同步至 KOS SQLite。
      任何未注册的黑户算力节点运行 completions 请求都属于严重违规。
    dimension: X4
    rule: "compute_node.is_registered == true"
    type: required
    severity: warn
    enforcement: advisory (gac-kos-sync 检测)
    introduced: '2026-07-04'
    value_tier: 2
    references:
      - docs/project-registry.yaml
      - bin/gac-kos-sync.py
      - kos/kos-index.sqlite (compute_nodes)
    violation: "未注册的计算节点活动在算力网格中"

# AGT OWASP ASI 2026 Conformance — mapped to existing GaC rules
agt_constraints:
  - id: CR-AGT-ASI-01
    applies_to: [L0, L1, I0]
    description: >-
      AGT OWASP ASI 2026 ASI-01: Agent identity must be verified via Ed25519/SPIFFE
      before any governance decision. Maps to X1 audit chain requirement.
    dimension: X1
    rule: agent.identity.verified == true
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-mesh.yaml
      - bos://capability/agt/trust
    violation: "AGT agent identity not verified — Ed25519/SPIFFE missing"

  - id: CR-AGT-ASI-02
    applies_to: [L0, L1, I0]
    description: >-
      AGT OWASP ASI 2026 ASI-02: Policy evaluation must be deterministic and
      reproducible. Maps to GaC rule CR-GOV-VALIDATE-01.
    dimension: X1
    rule: policy.evaluation.deterministic == true
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-kernel.yaml
      - bos://governance/agt/policy
    violation: "AGT policy evaluation is non-deterministic"

  - id: CR-AGT-ASI-03
    applies_to: [L1]
    description: >-
      AGT OWASP ASI 2026 ASI-03: Execution sandbox must isolate agent workloads
      in 4 rings. Maps to CR-RUNTIME-SANDBOX-01.
    dimension: X1
    rule: sandbox.isolation.ring_count >= 4
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-runtime.yaml
      - bos://capability/agt/sandbox
    violation: "AGT sandbox isolation ring count below 4"

  - id: CR-AGT-ASI-04
    applies_to: [X2]
    description: >-
      AGT OWASP ASI 2026 ASI-04: SLO monitoring must track error budget burn
      rate. Maps to CR-OBSERVABILITY-SLO-01.
    dimension: X2
    rule: slo.error_budget_tracking == true
    type: required
    severity: medium
    enforcement: advisory
    introduced: '2026-08-04'
    value_tier: 2
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-sre.yaml
      - bos://capability/agt/sre
    violation: "AGT SLO error budget tracking not configured"

  - id: CR-AGT-ASI-05
    applies_to: [I0]
    description: >-
      AGT OWASP ASI 2026 ASI-05: MCP tool calls must pass security gateway
      inspection. Maps to CR-MCP-SECURITY-01.
    dimension: X1
    rule: mcp.call.inspected == true
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-gateway.yaml
      - bos://capability/agt/mcp-security
    violation: "AGT MCP call not inspected by security gateway"

  - id: CR-AGT-ASI-06
    applies_to: [X]
    description: >-
      AGT OWASP ASI 2026 ASI-06: Agent marketplace plugins must be signed and
      verified before installation. Maps to CR-PLUGIN-SIGNATURE-01.
    dimension: X3
    rule: plugin.signature.verified == true
    type: required
    severity: medium
    enforcement: advisory
    introduced: '2026-08-04'
    value_tier: 2
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-marketplace.yaml
      - bos://capability/agt/marketplace
    violation: "AGT plugin signature not verified"

  - id: CR-AGT-ASI-07
    applies_to: [X]
    description: >-
      AGT OWASP ASI 2026 ASI-07: RL training governance must enforce policy
      constraints on reward functions and training data. Maps to CR-RL-GOVERNANCE-01.
    dimension: X3
    rule: rl.training.governed == true
    type: required
    severity: medium
    enforcement: advisory
    introduced: '2026-08-04'
    value_tier: 2
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-lightning.yaml
      - bos://capability/agt/lightning
    violation: "AGT RL training not governed by policy"

  - id: CR-AGT-ASI-08
    applies_to: [L1, X1]
    description: >-
      AGT OWASP ASI 2026 ASI-08: Execution audit trail must be tamper-evident
      via Merkle hash chain. Maps to CR-AUDIT-CHAIN-01.
    dimension: X1
    rule: audit.trail.merkle_verified == true
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-hypervisor.yaml
      - bos://governance/agt/hypervisor
    violation: "AGT audit trail Merkle verification failed"

  - id: CR-AGT-ASI-09
    applies_to: [L1]
    description: >-
      AGT OWASP ASI 2026 ASI-09: Circuit breaker must trigger on error rate
      exceeding threshold. Maps to CR-CIRCUIT-BREAKER-01.
    dimension: X2
    rule: circuit.breaker.enabled == true
    type: required
    severity: medium
    enforcement: advisory
    introduced: '2026-08-04'
    value_tier: 2
    references:
      - projects/ecos/src/ecos/ssot/mof/m1/component/COMP-EXT-AGT-sre.yaml
      - bos://capability/agt/sre
    violation: "AGT circuit breaker not enabled"

  - id: CR-AGT-ASI-10
    applies_to: [L0, I0]
    description: >-
      AGT OWASP ASI 2026 ASI-10: Cross-layer calls must route through I0/Agora
      gateway. Maps to X1-C02.
    dimension: X1
    rule: layer.cross_call.route == 'I0/Agora'
    type: required
    severity: high
    enforcement: block-write
    introduced: '2026-08-04'
    value_tier: 1
    references:
      - projects/ecos/src/ecos/ssot/registry/L0-constraints.yaml
      - .omo/_truth/x1-governance-policies.yaml
    violation: "AGT cross-layer call bypasses I0/Agora gateway"
  - applies_to:
    - L2
    - L4
    description: CI 平面 check 工具必须登记在 ci-surfaces.yaml SSOT (ADR-0379 E-1)
    dimension: X1
    id: CR-CI-01
    rule: ci.check.registered == true
    type: required
    violation: 'E-L0-021: workflow/sgf-policy 执行未登记的 CI 检查 (CR-CI-SURFACE-SSOT 违反)'
