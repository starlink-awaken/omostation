# ── Trigger 约束 (CR-TRIGGER-01 ~ CR-TRIGGER-05) ──

trigger_constraints:
  - id: CR-TRIGGER-01
    name: "Trigger 注册约束"
    description: "所有异步触发机制必须在 L0 Trigger Registry 注册为 M1 节点"
    rule: "for each Trigger in system: exists M1 node with type='trigger'"
    type: required
    severity: error
    violation: "未注册的触发机制无法被系统感知和治理"

  - id: CR-TRIGGER-02
    name: "Trigger Pipeline 约束"
    description: "所有触发机制必须通过标准五步 Pipeline (pre-check → execute → post-validate → audit → heal)"
    rule: "for each Trigger execution: must complete all 5 pipeline steps"
    type: required
    severity: error
    violation: "跳过 Pipeline 的触发机制无审计追踪，无法自愈"

  - id: CR-TRIGGER-03
    name: "Trigger 依赖声明约束"
    description: "触发机制之间的依赖必须显式声明在 dependencies 字段"
    rule: "if Trigger A depends on Trigger B: B must be in A.dependencies"
    type: required
    severity: error
    violation: "隐式依赖导致触发顺序不可控"

  - id: CR-TRIGGER-04
    name: "Trigger 审计约束"
    description: "每次触发执行必须记录审计日志"
    rule: "for each Trigger execution: OMOBridge.record_audit must be called"
    type: required
    severity: error
    violation: "无审计日志的触发执行无法追溯问题"

  - id: CR-TRIGGER-05
    name: "Trigger 健康检查约束"
    description: "触发机制必须有 health_check 或 freshness 指标"
    rule: "for each Trigger: properties.health_check must be defined"
    type: preferred
    severity: warning
    violation: "无法判断触发机制是否正常运行"

  - id: CR-TRIGGER-06
    name: "Trigger M0 快照约束"
    description: "Trigger 必须有 M0 运行时快照 (TriggerM0Manager)"
    rule: "for each Trigger: exists TriggerRuntimeSnapshot in .omo/state/model-driven/"
    type: required
    severity: error
    violation: "无 M0 快照的 Trigger 无法进行漂移检测"

# ── OPC Cadence 约束 (CR-CADENCE-* / CR-INDEX-LOCK-* / CR-MODE-ENV-* / CR-TIME-ENV-* / CR-MODE-COPY-* / CR-DRIFT-LOOP-* / CR-AUDIT-5REPOS-*) ──
# 2026-06-13 P5-P7 closeout 落地的 7 条治理约束
# SSOT: .omo/_control/evolution/config.yaml
# 关联: scripts/opc_p7_audit_rollout_daemon.py, scripts/opc_audit_rollout_5repos.py, scripts/opc_p6_*.py
# 关联: feedback_opc_cron_wrapper_trigger_injection_20260612.md, feedback_no_standard_weakening_20260612.md

opc_cadence_constraints:
  - id: CR-CADENCE-01
    name: "Cadence wrapper trigger 注入约束"
    description: "所有 OPC cron wrapper 必须显式注入 INVOCATION_ID + OPC_TRIGGER 环境变量, 禁止 daemon 兜底推断"
    rule: "for each opc cron wrapper: env INVOCATION_ID and OPC_TRIGGER must be set before exec"
    type: required
    severity: error
    violation: "manual 入口被 cron 兜底污染, evidence type 不可区分"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - ".omo/cron/opc-closeout-crontab"
      - "scripts/opc_p7_audit_rollout_cron.sh"
      - "scripts/opc_p6_weekly_loop_cron.sh"
      - "scripts/opc_p6_self_evolve_cron.sh"

  - id: CR-INDEX-LOCK-01
    name: "Index 写入 race 保护约束"
    description: "所有 *.omo/_control/evolution/{loop,drift,radar,self-evolve}/index.json 写入必须使用 fcntl.flock 互斥锁, 禁止裸 write"
    rule: "for each index.json writer: must use fcntl.flock(fcntl.LOCK_EX) context manager"
    type: required
    severity: error
    violation: "并发 cron 触发导致 index 漂移, audit 历史断裂"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_weekly_loop.py"
      - "scripts/opc_p6_drift_detector.py"
      - "scripts/opc_p5_radar_cron.py"

  - id: CR-MODE-ENV-01
    name: "OPC_MODE 环境变量透传约束"
    description: "OPC 模式 (weekly/monthly/pre-release) 必须通过 OPC_MODE env 透传, 禁止 daemon 内部硬编码 mode-specific 路径"
    rule: "for each OPC mode-aware script: mode = os.environ.get('OPC_MODE', 'weekly')"
    type: required
    severity: error
    violation: "硬编码 weekly.json 导致 monthly/pre-release cron 复用 weekly 副本, 不可审计"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p7_audit_rollout_daemon.py"
      - "scripts/opc_audit_rollout_5repos.py"
      - ".omo/cron/opc-closeout-crontab"

  - id: CR-TIME-ENV-01
    name: "语义时间环境变量覆盖约束"
    description: "OPC 生成的语义时间戳 (generated_at/today) 必须可通过 OPC_GENERATED_AT / OPC_TODAY env 覆盖, 禁止仅用 datetime.now()"
    rule: "for each OPC script writing timestamp: must read OPC_GENERATED_AT/OPC_TODAY env with datetime.now() fallback"
    type: required
    severity: error
    violation: "回放/replay/手动演练无法注入时间, evidence 不可重现"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_weekly_loop.py"
      - "scripts/opc_p5_radar_cron.py"
      - "scripts/opc_p7_audit_rollout_daemon.py"

  - id: CR-MODE-COPY-01
    name: "Mode-specific 副本单一 owner 约束"
    description: "{date}-{mode}.json 副本必须由唯一 owner 脚本 (5repos.py) 写入, daemon 不得双写"
    rule: "only opc_audit_rollout_5repos.py may write {date}-{mode}.json, opc_p7_audit_rollout_daemon.py writes 5repos.json only"
    type: required
    severity: error
    violation: "daemon 双写导致 5repos.json 与 {date}-{mode}.json 内容漂移, fallback chain 不可信"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p7_audit_rollout_daemon.py"
      - "scripts/opc_audit_rollout_5repos.py"

  - id: CR-DRIFT-LOOP-01
    name: "Drift → Self-evolve 闭环约束"
    description: "Drift detector 检测到非零 drift 必须生成 self-evolution task 落 planned/, 且 task approval_required=true, 永不入 active/"
    rule: "for each drift report with drift_total > 0: emit self-evolution task in planned/ with approval_required=true"
    type: required
    severity: error
    violation: "self-evolution task 推 active/ 绕过人工审批, governance 失效"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_p6_drift_detector.py"
      - "scripts/opc_p6_self_evolve.py"
      - "feedback_p6_self_evolution_planned_only.md"

  - id: CR-AUDIT-5REPOS-01
    name: "5-Repo §17 Metrics 路径约束"
    description: "5repos.py 写入 §17 metrics 必须落到 .omo/_delivery/audit-rollout/{date}-5repos.json, 路径唯一"
    rule: "opc_audit_rollout_5repos.py output path == .omo/_delivery/audit-rollout/{date}-5repos.json"
    type: required
    severity: error
    violation: "metrics 路径不一致导致 §17 报告与 cron log 无法 cross-reference"
    introduced: '2026-06-12'
    value_tier: 1
    references:
      - "scripts/opc_audit_rollout_5repos.py"
      - ".omo/_knowledge/audits/2026-06-13-opc-p5-p7-self-correction-closeout.md"

# ── MOF Schema 校验约束 (CR-MOF-VALIDATE-* / CR-MOF-ALIAS-* / CR-MOF-BIDIR-*) ──
# 2026-06-13 P5-P7 深度修复阶段落地的 3 条 MOF 治理约束
# SSOT: projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py
# 关联: feedback_m1_m2_schema_validation_20260613.md, OMO-SELF-CORRECTION-PATTERN.yaml
# 关联: 930 个 M1 节点 + 44 个 M2 schema 校验全闭环

mof_schema_validate_constraints:
  - id: CR-MOF-VALIDATE-01
    name: "MOF Schema 必跑校验约束"
    description: "任何 M1 节点新增/修改后必跑 mof-schema-validate.py 校验, 0 drift / 0 missing / 0 state machine invalid 才能 commit"
    rule: "for each M1 node change: mof-schema-validate.py must pass with Type drift=0, Required missing=0, State machine invalid=0"
    type: required
    severity: error
    violation: "未跑校验或校验失败, M1 节点不合 M2 schema, governance 失效"
    introduced: '2026-06-13'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-schema-validate.py"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-schema-validate.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py"
      - "feedback_m1_m2_schema_validation_20260613.md"
      - "OMO-SELF-CORRECTION-PATTERN.yaml (8 段硬结构)"

  - id: CR-MOF-ALIAS-01
    name: "MOF Type Alias 双向匹配约束"
    description: "M1 节点 type 字段必须命中 M2 m2_type, 容许 PascalCase / snake_case / section key 双向 alias, 但禁止 type 在 M2 中完全缺"
    rule: "for each M1 node: data.type in (M2 m2_type ∪ section_key) else drift"
    type: required
    severity: error
    violation: "type 在 M2 中完全缺, 表示 M1 节点没有对应 M2 schema 定义, 必须补 M2 schema 或改 M1 type"
    introduced: '2026-06-13'
    value_tier: 1
    references:
      - "M2 schema: 44 个 m2_type 定义 (Action/Agent/Pattern/Entity/Component/GovernancePolicy/...)"
      - "section_key 9 例: constraint_mgmt / governance_policy / network_zone / vault_path / ..."
    alias_examples:
      - "M2: Trigger (PascalCase) / M1: type=trigger (lowercase) - 14 节点 case 漂移已修复"
      - "M2: ConstraintMgmt (PascalCase) / M1: type=constraint_mgmt (snake_case) - 3 节点 case 漂移已修复"
      - "M2: vault_path (snake_case) / M1: type=vault_path - 1 节点已修复"

  - id: CR-MOF-BIDIR-01
    name: "MOF Required 双向字段约束"
    description: "M2 requiredProperties 字段必须出现在 M1 节点的 properties 或 top-level, 校验脚本双向查找避免历史节点字段位置不一致导致的虚报"
    rule: "for each required field k: (k in m1.properties) OR (k in m1 top-level) else missing"
    type: required
    severity: error
    violation: "required field 缺失, 但 mof-schema-validate.py 虚报 226 个 (实际只有 3 个), 双向校验后真实缺失 0 个, 任何新缺失立即 fail"
    introduced: '2026-06-13'
    value_tier: 1
    references:
      - "M1 Entity 138 节点: properties.domain 字段实际在 top-level (历史 mof-extract 输出格式)"
      - "M1 Specification 122 节点: requiredProperties 字段散落在 properties + 顶层 (双向查找覆盖)"
    history:
      - "2026-06-13: 校验脚本初版单查 properties 虚报 226 required missing, 双向校验后真实 0"
      - "2026-06-13: Decision/Component/Domain 3 节点真实缺失已修复 (problem+rationale, layer+runtime, domain_type)"

  - id: CR-MOF-BRIDGE-01
    name: "MOF Bridge-Sync model-driven 桥接约束"
    description: "任何 M1 lifecycle/ 节点新增/修改后必跑 mof-bridge-sync.py --strict, 验证 model-driven STANDARD_STAGES/STANDARD_GATES ↔ M1 lifecycle/ 双向同步; 同时跑 mof-derive.py --strict 验证 7 阶段 100% 覆盖 + 4 门禁 100% 满足"
    rule: "for each M1 lifecycle/ change: mof-bridge-sync.py --strict AND mof-derive.py --strict must pass with 0 missing/extra/drift + 0 high risk"
    type: required
    severity: error
    violation: "M1 lifecycle/ 与 model-driven 失同步, 新增阶段/门禁未落 M1, 桥接失败"
    introduced: '2026-06-14'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-bridge-sync.py + mof-derive.py"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-bridge-sync.py --strict && python3 src/ecos/ssot/tools/mof-derive.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-bridge-sync.py (B.3 双向同步工具, 2026-06-14)"
      - "projects/ecos/src/ecos/ssot/tools/mof-derive.py (跨仓推理引擎 v2, 2026-06-14)"
      - "projects/model-driven/src/model_driven/mof/m3_extended.py (STANDARD_STAGES/STANDARD_GATES SSOT)"
    matching_strategy:
      stage: "按 stage key (planning/design/development/...) 匹配, 容忍 _ vs - 命名差异"
      gate: "按 (from_stage, to_stage) transition 匹配, 不依赖 id 命名"

  - id: CR-MOF-STATE-BRIDGE-01
    name: "MOF State-Bridge .omo/tasks/ 双向同步约束"
    description: "任何 M1 omo_layer/OMOTASK-*.yaml 节点新增/修改后必跑 mof-state-bridge.py --strict, 验证 .omo/tasks/{active,planned,done}/*.yaml ↔ M1 OMOTask 双向同步; m1_only=0 即失同步"
    rule: "for each OMOTASK-* change: mof-state-bridge.py --strict must pass with m1_only=0 (双向配对 100%)"
    type: required
    severity: error
    violation: "M1 OMOTask 节点无 .omo/tasks/ 配对 (m1_only > 0), 或反之 (.omo 任务无 M1 OMOTask 节点)"
    introduced: '2026-06-14'
    value_tier: 1
    enforcement:
      ci_pre_commit: "projects/ecos/.githooks/pre-commit 调用 mof-state-bridge.py (omo_layer 改动触发)"
      cli_invoke: "cd projects/ecos && python3 src/ecos/ssot/tools/mof-state-bridge.py --strict"
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-state-bridge.py (双向桥接 + alias 模糊匹配, 2026-06-14)"
      - ".omo/tasks/{active,planned,done}/*.yaml (3 目录 83 个任务 SSOT)"
    alias_strategy:
      title: "前 8/12 字符 or 子串包含 (M1 name ↔ .omo title)"
      status: "done/completed, in_progress/active, proposed/planned 双向兼容"

# ── C2G v3 约束 (CR-C2G-V3-*) ──
# 2026-06-15 C2G v3 升级落地的 3 条治理约束 (SSOT Write-back, Fast-Track GC, Agent Yield)

c2g_v3_constraints:
  - id: CR-C2G-V3-01
    name: "C2G v3 SSOT Write-back 约束"
    description: "当含有 context_uri 的 OMO 任务流转为 done 时，必须顺着 context_uri 将执行结果追加到原始 Markdown 文档底部，防止高维降维及上下文丢失"
    rule: "task.status == 'done' and task.context_uri != null implies task.ssot_written_back == true"
    type: required
    severity: error
    violation: "任务完成但未回写 SSOT 文档，引发知识图谱断裂"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/ecos/src/ecos/ssot/tools/mof-extract.py"
      - "omo worker dispatch"

  - id: CR-C2G-V3-02
    name: "C2G v3 Fast-Track Compaction 约束"
    description: "Worker GC 执行时必须触发微观碎片（FAST-* 任务）的聚变，生成统一 Markdown 报告，然后归档原始 yaml"
    rule: "gc_execution implies fast_track_compaction_executed and fast_tasks.archived"
    type: required
    severity: error
    violation: "FAST-* 碎片堆积未发生聚变，污染稳态区"
    introduced: '2026-06-15'
    value_tier: 2
    references:
      - "projects/omo/src/omo/omo_worker_dispatch.py:_fast_track_compaction"
      - "omo worker gc"

  - id: CR-C2G-V3-03
    name: "C2G v3 Agent 战术退让约束"
    description: "当 Agent 在执行长尾微观任务时遇到阻塞或陷入死胡同时，禁止暴力破解，必须显式调用 yield_task 工具返回原因并释放任务"
    rule: "agent.blocked == true implies task.status == 'yielded' and task.yield_reason != null"
    type: required
    severity: error
    violation: "Agent 强行死磕导致成本激增或任务状态失效"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_worker_dispatch.py:yield_task"
      - "projects/omo/src/omo/mcp_server.py:omo_yield_task"


# ── C2G v4 约束 (CR-STRATEGY-*) ──
# 2026-06-15 C2G v4 落地控制论战略引擎 (Cybernetic Strategy Engine)

c2g_v4_constraints:
  - id: CR-STRATEGY-01
    name: "C2G v4 Pitch 孤儿拦截约束"
    description: "所有的 Pitch 下注转化为 Task 时，必须声明 Upstream 锚点 (如 Target Milestone)。omo_bridge 必须进行解析，无 Upstream 的需求直接阻断。"
    rule: "pitch.upstream != null"
    type: required
    severity: error
    violation: "需求没有挂载战略锚点，沦为孤儿，破坏战略引力链"
    introduced: '2026-06-15'
    value_tier: 1
    references:
      - "projects/omo/src/omo/omo_bridge.py:_import_pitch"

  - id: CR-STRATEGY-02
    name: "C2G v4 向量打分约束"
    description: "愿景必须提供 3 个维度的 Vector，所有的 Pitch 下注时，必须携带 Vector 权重。以对抗偏离。"
    rule: "pitch.vectors != null"
    type: required
    severity: error
    violation: "缺乏向量打分，无法衡量战略对齐度"
    introduced: '2026-06-15'
    value_tier: 1

  - id: CR-STRATEGY-03
    name: "C2G v4 熵减代谢约束 (GC Decay)"
    description: "Sandbox 中的 Pitch 超过 4 周未被端上下注桌 (Bet)，将由 daemon 或 cron 自动挪入 decayed/ 归档。"
    rule: "pitch.age_days > 28 and pitch.status == 'Draft' implies pitch.decayed == true"
    type: required
    severity: error
    violation: "沙箱未定期清理，违背熵减原则"
    introduced: '2026-06-15'
    value_tier: 2

# ── Omni-Bus 约束 (CR-OMNIBUS-*) ──
# 2026-06-17 Omni-Bus 三大平面 (Data, Event, Control) 落地的治理约束

omni_bus_constraints:
  - id: CR-OMNIBUS-01
    name: "OmniEnvelope 统一协议约束"
    description: "所有基于 bus-foundation 的跨域消息必须使用统一的 OmniEnvelope 格式，禁止隐式投递和私有格式。"
    rule: "envelope.plane in ['DATA', 'EVENT', 'CONTROL'] and envelope.topic != null and envelope.source_uri != null"
    type: required
    severity: error
    violation: "违规私有 Envelope，导致下游协议解析断裂"
    introduced: '2026-06-17'
    value_tier: 1
    references:
      - "projects/bus-foundation/src/bus_foundation/envelope.py"

  - id: CR-OMNIBUS-02
    name: "Control Plane 持久化与 ACK 约束"
    description: "Control Plane 的所有执行任务必须落入 SQLite WAL 持久化队列表 (control_tasks)，并要求显式 ACK/NACK，达到重试上限进入 DLQ。"
    rule: "control_task.persisted == true and (control_task.acked == true or control_task.nacked == true) and control_task.retry_count <= MAX_RETRIES"
    type: required
    severity: error
    violation: "Control Plane 任务未持久化或丢失了 ACK/NACK 状态回路"
    introduced: '2026-06-17'
    value_tier: 1
    references:
      - "projects/bus-foundation/src/bus_foundation/backends/control_plane.py"

  - id: CR-OMNIBUS-03
    name: "Data Plane 非阻塞内存约束"
    description: "Data Plane (日志、遥测、观测) 必须采用无锁异步内存队列 (Ring Buffer) 分发，满载时 Drop-Tail，绝对禁止阻塞主业务逻辑。"
    rule: "data_plane.is_async == true and data_plane.blocking == false"
    type: required
    severity: error
    violation: "Data Plane 导致主业务发生 IO 阻塞"
    introduced: '2026-06-17'
    value_tier: 2
    references:
      - "projects/bus-foundation/src/bus_foundation/backends/data_plane.py"
