constraints:
- applies_to:
  - L0
  - L1
  - L2
  - L3
  description: 所有跨层协议映射必须在 L0 Protocol Registry 中注册
  dimension: X1
  id: X1-C01
  rule: protocol.registered == true
  type: required
  violation: 'E-L0-001: 未注册协议映射'
- applies_to:
  - L1
  - L2
  - L3
  description: 跨层 MCP 调用必须经过 I0/Agora 路由
  dimension: X1
  id: X1-C02
  rule: layer.cross_call.route == 'I0/Agora'
  type: required
  violation: 'E-L0-002: 绕过 I0/Agora 的跨层直连'
- applies_to:
  - L1
  - L2
  - I0
  description: Agora Proxy 必须采用 lazy initialization 避免循环依赖锁死
  dimension: X1
  id: CR-MCP-LAZY-01
  rule: proxy.initialization == 'lazy'
  type: required
  violation: 'E-L0-011: 触发代理循环依赖 (Eager proxy initialization detected)'
- applies_to:
  - L0
  - I0
  description: BOS URI 路由表注册必须提供 domain 和 cross_references.realized_by 元数据
  dimension: X1
  id: CS-10
  rule: bos_route.domain != null and bos_route.cross_references.realized_by != null
  type: required
  violation: 'E-L0-012: BOS URI 元数据缺失'
- applies_to:
  - L2
  - L4
  description: 混合裁判测试用例必须使用 @pytest.mark.vibeops 隔离
  dimension: X1
  id: CR-VIBEOPS-01
  rule: test.is_vibeops implies 'vibeops' in test.markers
  type: required
  violation: 'E-L0-013: 混合裁判测试未被隔离，可能影响基础 CI 时效'
- applies_to:
  - L2
  - I0
  description: DeepEval/Ragas 等 LLM 裁判调用必须走 Agora LLM Gateway 进行计费与路由
  dimension: X1
  id: CR-VIBEOPS-02
  rule: vibeops.llm_calls.target == 'bos://capability/llm-gateway'
  type: required
  violation: 'E-L0-014: LLM 裁判绕过内部 Gateway，破坏安全合规与成本追踪'
- applies_to:
  - I0
  description: bos://capability/evaluator 及其子域工具，拒绝任何 role != evaluator 的请求
  dimension: X1
  id: CR-RBAC-01
  rule: request.target.startswith('bos://capability/evaluator') implies request.role == 'evaluator'
  type: required
  violation: 'E-L0-015: Generator 越权调用评估工具，破坏系统隔离性'
- applies_to:
  - I0
  - L2
  description: agora.ProxyManager 注册新路由前，必须通过 metaos 颁发的五大部件准入控制
  dimension: X1
  id: CR-ADMISSION-01
  rule: bos_route.registration implies metaos.evaluate_admission(bos_route.metadata).status == 'admitted'
  type: required
  violation: 'E-L0-016: 未经 MetaOS 准入的黑户服务尝试接入 Agora'
- applies_to:
  - I0
  description: Agora register 是唯一写操作入口
  dimension: X1
  id: X1-C03
  rule: write.entry == 'agora.register'
  type: required
  violation: 'E-L0-003: 未经 Agora 的写操作'
- applies_to:
  - L0
  description: 协议版本必须声明——未版本化协议不可进入注册表
  dimension: X2
  id: X2-C01
  rule: protocol.version != null
  type: required
  violation: 'E-L0-004: 未版本化协议'
- applies_to:
  - L0
  description: 协议版本超过 2 个 MAJOR 版本应触发升级审查
  dimension: X2
  id: X2-C02
  rule: protocol.age_major_versions <= 2
  type: preferred
  violation: 'W-L0-001: 协议版本老化'
- applies_to:
  - L4
  description: CLAUDE.md 超过 60 天未更新应触发保鲜告警
  dimension: X2
  id: X2-C03
  rule: claude_md.age_days <= 60
  type: required
  violation: 'W-L0-002: CLAUDE.md 保鲜告警'
- applies_to:
  - L0
  description: 协议引入超过 half_life_days 后应触发老化审查
  dimension: X2
  id: X2-C04
  rule: protocol.age_days <= protocol.half_life_days
  type: preferred
  violation: 'W-L0-005: 协议超过半衰期'
- applies_to:
  - L4
  description: 每个功能域应声明 value_tier
  dimension: X3
  id: X3-C01
  rule: domain.value_tier != null
  type: preferred
  violation: 'W-L0-003: 未声明 value_tier'
- applies_to:
  - L4
  description: value_tier=1 的域应有 cost_attribution
  dimension: X3
  id: X3-C02
  rule: domain.value_tier == 1 implies domain.cost_attribution != 'none'
  type: preferred
  violation: 'W-L0-004: 核心域无成本归因'
execution:
  last_run: null
  mode: warn
  validator: ecos-constraint-validator.py
