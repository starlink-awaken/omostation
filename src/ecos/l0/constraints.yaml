# eCOS v6 L0 — 协议级约束定义 (PoC)
# =========================================
# Phase7 / ADT-04 / v5 设计能力 — 协议约束最低可行产品
# 宪法约束编译为 YAML，由 ecos-constraint-validator.py 在协议映射阶段校验。
#
# 约束类型:
#   required  — 必须满足，否则拒绝
#   preferred — 推荐满足，不满足告警
#   immutable — 不可变更（仅 L4 宪法修订可改）

version: "3.0.0"
generated: "2026-06-06"
updated: "2026-06-07  # v3.0: BOS URI协议·Domain Manager规范·L4→L1脚本下沉·全量建模"

constraints:
  # ── X1: 治理安全约束 ──
  - id: X1-C01
    type: required
    dimension: X1
    description: "所有跨层协议映射必须在 L0 Protocol Registry 中注册"
    rule: "protocol.registered == true"
    applies_to: [L0, L1, L2, L3]
    violation: "E-L0-001: 未注册协议映射"

  - id: X1-C02
    type: required
    dimension: X1
    description: "跨层 MCP 调用必须经过 I0/Agora 路由"
    rule: "layer.cross_call.route == 'I0/Agora'"
    applies_to: [L1, L2, L3]
    violation: "E-L0-002: 绕过 I0/Agora 的跨层直连"

  - id: X1-C03
    type: required
    dimension: X1
    description: "Agora register 是唯一写操作入口"
    rule: "write.entry == 'agora.register'"
    applies_to: [I0]
    violation: "E-L0-003: 未经 Agora 的写操作"

  # ── X2: 抗熵进化约束 ──
  - id: X2-C01
    type: required
    dimension: X2
    description: "协议版本必须声明——未版本化协议不可进入注册表"
    rule: "protocol.version != null"
    applies_to: [L0]
    violation: "E-L0-004: 未版本化协议"

  - id: X2-C02
    type: preferred
    dimension: X2
    description: "协议版本超过 2 个 MAJOR 版本应触发升级审查"
    rule: "protocol.age_major_versions <= 2"
    applies_to: [L0]
    violation: "W-L0-001: 协议版本老化"

  - id: X2-C03
    type: required
    dimension: X2
    description: "CLAUDE.md 超过 60 天未更新应触发保鲜告警"
    rule: "claude_md.age_days <= 60"
    applies_to: [L4]
    violation: "W-L0-002: CLAUDE.md 保鲜告警"

    # ── X2: 协议级反熵 (v5 设计能力) ──
  - id: X2-C04
    type: preferred
    dimension: X2
    description: "协议引入超过 half_life_days 后应触发老化审查"
    rule: "protocol.age_days <= protocol.half_life_days"
    applies_to: [L0]
    violation: "W-L0-005: 协议超过半衰期"

  # ── X3: 价值堆栈约束 ──
  - id: X3-C01
    type: preferred
    dimension: X3
    description: "每个功能域应声明 value_tier"
    rule: "domain.value_tier != null"
    applies_to: [L4]
    violation: "W-L0-003: 未声明 value_tier"

  - id: X3-C02
    type: preferred
    dimension: X3
    description: "value_tier=1 的域应有 cost_attribution"
    rule: "domain.value_tier == 1 implies domain.cost_attribution != 'none'"
    applies_to: [L4]
    violation: "W-L0-004: 核心域无成本归因"

  # ── X4: 一致性治理约束 (NEW) ──
  - id: X4-C01
    type: required
    dimension: X4
    description: "每个 L4 域必须在 L0 Domain Registry 中注册"
    rule: "domain.registered == true"
    applies_to: [L4]
    violation: "E-L0-006: 未注册的 L4 域"

  - id: X4-C02
    type: required
    dimension: X4
    description: "域治理 Tier ≥ 2 必须有 STATE.md"
    rule: "domain.governance_tier >= 2 implies domain.state_md != null"
    applies_to: [L4]
    violation: "E-L0-007: Tier≥2 域缺少 STATE.md"

  - id: X4-C03
    type: preferred
    dimension: X4
    description: "被 ≥2 个域引用的实体应有跨域 SSOT 定义"
    rule: "entity.cross_domain_refs >= 2 implies entity.ssot_registered == true"
    applies_to: [L4]
    violation: "W-L0-006: 跨域实体缺少 SSOT 定义"

  - id: X4-C04
    type: preferred
    dimension: X4
    description: "域 CLAUDE.md 应在 parent 域 CLAUDE.md 的域路由表中注册"
    rule: "domain.parent_claude_md != null implies domain.registered_in_parent_routing == true"
    applies_to: [L4]
    violation: "W-L0-007: 子域未在父域路由表中注册"

  # ── X4: 域间交互约束 (Domain Interaction Protocol) ──
  - id: X4-C05
    type: required
    dimension: X4
    description: "域不可直接写入其他域的文件 (DIP-02)"
    rule: "domain.write_target == self"
    applies_to: [L4]
    violation: "E-L0-008: 跨域直接写入"

  - id: X4-C06
    type: preferred
    dimension: X4
    description: "跨域影响必须通过 SIGNALS.md 登记 (DIP-03)"
    rule: "cross_domain.impact implies signals_registered == true"
    applies_to: [L4]
    violation: "W-L0-008: 未登记的跨域影响"

  - id: X4-C07
    type: preferred
    dimension: X4
    description: "新域治理文件必须从标准模板初始化 (DIP-05)"
    rule: "domain.init.template_source == '@公共/_knowledge/10-templates/domain-governance/'"
    applies_to: [L4]
    violation: "W-L0-009: 未使用标准模板初始化"

  # ── X2: 归档约束 ──
  - id: X2-C05
    type: preferred
    dimension: X2
    description: "过期内容应归档并标注日期和原因 (DIP-06)"
    rule: "content.expired implies content.location == '_archive/'"
    applies_to: [L4]
    violation: "W-L0-010: 过期内容未归档"

  # ── X4: KEMS 结构约束 ──
  - id: X4-C08
    type: required
    dimension: X4
    description: "Tier 1 域必须包含所有必需的 KEMS 六面"
    rule: "domain.governance_tier == 1 implies domain.kems_planes.includes_all(['_control','_entities','_knowledge','_storage','_archive'])"
    applies_to: [L4]
    violation: "E-L0-009: KEMS 六面不完整"

  - id: X4-C09
    type: required
    dimension: X4
    description: "域生命周期状态必须与 L0 Domain Registry 一致"
    rule: "domain.status == domain_registry.status"
    applies_to: [L4]
    violation: "E-L0-010: 域生命周期状态不一致"

  - id: X4-C10
    type: required
    dimension: X4
    description: "BOS URI 必须遵循规范格式 bos://{domain_id}[/{resource}]"
    rule: "bos_uri.format == 'bos://{domain_id}[/{resource}]'"
    applies_to: [I0, L3, L4]
    violation: "E-L0-011: BOS URI 格式不符合规范"

  - id: X4-C11
    type: required
    dimension: X4
    description: "BOS URI 必须可解析为有效的域标识"
    rule: "bos_uri.resolvable == true"
    applies_to: [I0, L3, L4]
    violation: "E-L0-012: BOS URI 不可解析"

  - id: X4-C12
    type: required
    dimension: X4
    description: "BOS URI 解析的物理路径必须存在"
    rule: "bos_uri.path.exists == true"
    applies_to: [I0, L3, L4]
    violation: "E-L0-013: BOS URI 对应物理路径不存在"

  - id: X4-C13
    type: preferred
    dimension: X4
    description: "BOS URI 应登记生命周期状态 (proposed/active/deprecated/removed)"
    rule: "bos_uri.lifecycle != null"
    applies_to: [I0, L3, L4]
    violation: "W-L0-013: BOS URI 缺少生命周期登记"

  # ── QG: 内容质量门禁 ──
  - id: QG-C01
    type: preferred
    dimension: X4
    description: "所有文件应有完整的 frontmatter (轻量门禁)"
    rule: "file.frontmatter.has_all(['title','status','type','domain','owner','created','last-reviewed'])"
    applies_to: [L4]
    violation: "W-L0-011: frontmatter 不完整"

  - id: QG-C02
    type: preferred
    dimension: X4
    description: "治理文件 (STATE/MEMORY/ENTITIES/TIMELINE) 应符合标准模板格式 (完整门禁)"
    rule: "governance.file.format == 'standard_template'"
    applies_to: [L4]
    violation: "W-L0-012: 治理文件格式不符合模板"

  # ── X5: BOS URI 统一寻址约束 (Phase 33/45) ──
  - id: X5
    name: bos-uri-unified-routing
    description: "BOS URI 解析必须通过统一注册表 (BOSRouter)，不允许直连下游"
    level: L0
    category: routing
    enforcement: validate
    # X4-compat fields (validator reads type/dimension/applies_to/violation)
    type: preferred
    dimension: X5
    applies_to: [L0, L1, L2, L3]
    violation: "E-L0-014: BOS URI 未通过 BOSRouter 统一入口"
    rule: "所有 bos:// URI 操作必须调用 resolve_bos_uri() 统一入口"
    violation_severity: critical
    auto_remediate: false
    created: '2026-06-07'
    phase: P45

  - id: X6
    name: bos-uri-audit-mandatory
    description: "所有 BOS URI 操作必须通过 L0 审计，记录到 SSB 不可变日志"
    level: L0
    category: audit
    enforcement: enforce
    # X4-compat fields
    type: required
    dimension: X6
    applies_to: [I0, L3]
    violation: "E-L0-015: BOS URI 操作未通过 L0 审计"
    rule: "所有 BOS 读/写/订阅操作必须调用 _bos_pre_check() 和 _bos_post_audit()"
    violation_severity: major
    auto_remediate: false
    created: '2026-06-07'
    phase: P45

  - id: X7
    name: bos-uri-domain-whitelist
    description: "BOS URI 域必须是 5 个预定义域 (memory/omo/analysis/persona/forge) 之一，不可扩展"
    level: L0
    category: security
    enforcement: enforce
    # X4-compat fields
    type: required
    dimension: X7
    applies_to: [I0, L3]
    violation: "E-L0-016: BOS URI 域不在白名单中"
    rule: "bos://{domain} 的 domain 必须在 [memory, omo, analysis, persona, forge] 中"
    violation_severity: critical
    auto_remediate: false
    created: '2026-06-07'
    phase: P45

  # ── 抽象族覆盖约束 (2026-08-08, 16 族抽象提炼) ──
  - id: X1-C04
    name: cross-repo-contract-registered
    description: "跨仓 HTTP/异步调用契约必须在接口注册表登记，禁止未登记的跨仓调用"
    level: L0
    category: contract
    enforcement: enforce
    type: required
    dimension: X1
    applies_to: [L1, L2, L3]
    violation: "E-L0-017: 未登记的跨仓契约调用"
    rule: "cross_repo.contract_registered == true"
    violation_severity: major
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: X1-C05
    name: commit-lane-discipline
    description: "提交必须遵循单变更车道纪律（governance_code/code/tests 分车道），禁止混车道提交"
    level: L0
    category: process
    enforcement: enforce
    type: required
    dimension: X1
    applies_to: [L1, L2, L3]
    violation: "E-L0-018: 混合变更车道提交"
    rule: "commit.single_lane == true"
    violation_severity: major
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: X2-C06
    name: health-score-gate
    description: "治理健康度分数不得回退（m4-health-score delta >= 0），回退须有 ADR 豁免"
    level: L0
    category: governance
    enforcement: enforce
    type: required
    dimension: X2
    applies_to: [L0, L1, L2, L3]
    violation: "E-L0-019: 健康度回退无豁免"
    rule: "health_score.delta >= 0 OR exempted_by_adr == true"
    violation_severity: major
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: X2-C07
    name: code-hygiene-god-module
    description: "禁止 god-module（单一文件 > 800 行纯逻辑），超标须拆解或豁免"
    level: L0
    category: hygiene
    enforcement: enforce
    type: required
    dimension: X2
    applies_to: [L1, L2, L3]
    violation: "E-L0-020: god-module 超限"
    rule: "module.lines <= 800 OR exempted == true"
    violation_severity: minor
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: X3-C03
    name: debt-redline
    description: "治理债务与交付比例不得越过红线（REDLINE 门禁），越过须暂停新增"
    level: L0
    category: debt
    enforcement: enforce
    type: required
    dimension: X3
    applies_to: [L1, L2, L3]
    violation: "E-L0-021: 债务红线越界"
    rule: "debt_ratio <= redline"
    violation_severity: critical
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: X4-C14
    name: ssot-pointer-drift
    description: "子模块/SSOT 指针不得漂移（reachability + freshness），漂移须立即修复"
    level: L0
    category: ssot
    enforcement: enforce
    type: required
    dimension: X4
    applies_to: [L1, L2, L3]
    violation: "E-L0-022: SSOT/子模块指针漂移"
    rule: "pointer.drift == 0"
    violation_severity: critical
    auto_remediate: true
    created: '2026-08-08'
    phase: P57

  - id: QG-C03
    name: meta-governance-rule-ssot
    description: "治理规则（GaC checks）必须以 governance-checks.yaml 为唯一源，禁止散落硬编码"
    level: L0
    category: meta
    enforcement: enforce
    type: required
    dimension: QG
    applies_to: [L0, L1, L2, L3]
    violation: "E-L0-023: 治理规则非 SSOT"
    rule: "governance_rule.ssot == true"
    violation_severity: major
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

  - id: QG-C04
    name: security-baseline
    description: "敏感面（secret/权限/凭证）必须满足安全基线，违规即阻断交付"
    level: L0
    category: security
    enforcement: enforce
    type: required
    dimension: QG
    applies_to: [L1, L2, L3]
    violation: "E-L0-024: 安全基线违规"
    rule: "security.baseline_passed == true"
    violation_severity: critical
    auto_remediate: false
    created: '2026-08-08'
    phase: P57

