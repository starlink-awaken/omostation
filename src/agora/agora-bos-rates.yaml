# Agora BOS 限流 + 缓存 TTL 配置 (agora-bos-rates.yaml)
# 配置文件支持热加载: ConfigWatcher 每 5s 检查变化
# 手动触发: kill -SIGUSR1 <agora-pid>
#
# cache_ttl: 缓存有效秒数 (默认 30s, 无配置时回退)
#   高频访问/稳定数据 → 较长的 TTL (60-120s)
#   实时查询/易变数据 → 较短的 TTL (5-15s)

routes:
  # Memory 域 — 搜索/查询稳定, 缓存久一点
  - prefix: "bos://memory/kos/"
    qps: 20
    cache_ttl: 60
    pricing: {input_rate_per_m: 0.05, output_rate_per_m: 0.20}   # 能力市场: 便宜记忆服务
  - prefix: "bos://memory/kronos/"
    qps: 10
    cache_ttl: 30

  # Analysis 域 — 研究结果可缓存, 但实时性要求高
  - prefix: "bos://analysis/minerva/"
    qps: 5
    cache_ttl: 120
    pricing: {input_rate_per_m: 0.30, output_rate_per_m: 1.20}   # 能力市场: 昂贵研究服务
  - prefix: "bos://analysis/code/"
    qps: 10
    cache_ttl: 15
  - prefix: "bos://analysis/iris/"
    qps: 10
    cache_ttl: 30

  # Governance 域 — 审计结果短时缓存
  - prefix: "bos://governance/omo/"
    qps: 10
    cache_ttl: 15
  - prefix: "bos://governance/metaos/"
    qps: 5
    cache_ttl: 30

  # Persona 域 — 个人信息相对稳定
  - prefix: "bos://persona/"
    qps: 10
    cache_ttl: 60

  # Forge 域 — 工具列表可缓存, 执行结果不缓存 (默认 30s 不影响)
  - prefix: "bos://forge/"
    qps: 10
    cache_ttl: 30

  # Ecos workflow 域 (M1 自动注册) — 实时流程不缓存
  - prefix: "bos://ecos/"
    qps: 5
    cache_ttl: 10

# ── 配额 (遗留-3: per-caller 每日成本上限, USD) ────────────────
# 由 mcp/bos_quota.py QuotaChecker 读取, 与 routes 一并热加载。
quotas:
  default_daily_usd: 10.0        # 未配置 caller 的默认每日上限 (安全默认)
  callers:
    - id: "anonymous"            # 无身份调用 (本地/未认证)
      daily_usd: 2.0
    - id: "local"                # 进程内本地调用 (P2-6 放行)
      daily_usd: 5.0
    - id: "agent-*"              # agent 身份 (通配)
      daily_usd: 50.0
    - id: "admin"
      daily_usd: 100.0
  services:
    - prefix: "bos://analysis/minerva/"   # 昂贵研究服务, 收紧
      daily_usd: 5.0
