# multica runtime 配额观察台账 —— 运行时数据文件，非治理 SSOT
# 用法见 ../multica-squad-ops/SKILL.md §4「分派决策（配额感知）」
#
# 字段说明:
#   runtime            : provider 名 (multica-native 对应 `multica runtime list` 的 provider 字段;
#                         direct-cli 对应本机可执行文件名)
#   invocation_mode    : multica-native (走 multica issue/agent) | direct-cli (Bash 直接调用其非交互命令)
#   tier               : 当前所属能力分层 (T0-T4，见 docs/architecture/multica-squad-system-v1.md §2)
#   quota_type         : 次数 | token | 并发 | unknown (初始未知时填 unknown，靠观察积累)
#   period             : 日 | 月 | unknown
#   known_limit        : 已知官方限额数值，无则 null (多数订阅制工具没有公开 quota API)
#   exhaustion_signals : 观察到的报错关键字列表 (人工/Observer squad 补充)
#   last_exhausted_at  : ISO8601 时间戳，最近一次判定为耗尽的时间；null 表示未触发过
#   cooldown_hours     : 冷却期，期间该 runtime 在同 Tier 分派中降权/跳过 (默认 24)
#
# 熔断降级规则: 连续 2 次命中 exhaustion_signals -> 写入 last_exhausted_at ->
#   本次及 cooldown_hours 内的分派改派同 Tier 备选。

