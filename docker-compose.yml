version: '3.8'

services:
  ecos:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ECOS_CONFIG=/app/ecos.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import ecos; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
