id: ADV57-griefing-abort
category: B_failure_injection
adversarial: true
seed: 157
description: >
  [对抗·red-team wave10] 恶意使对方工作作废: 临门超时+清零产物,
  管线尚无 griefing_abort_detected → 预期 FAIL
setup:
  blackboard:
    - {key: work_product, value: "almost_done", writers: [worker]}
  roles: [worker, griefer]
inject:
  - {type: role_timeout, role: worker}
  - {type: write_conflict, role: griefer, target: work_product, value: "wiped"}
  - {type: subtask_fail, subtask: worker_delivery}
expected:
  behavior: griefing_abort_detected
  silent_loss: 0
verdict:
  - criterion: griefing_abort_detected
    check: events_contain
    args: {kind: griefing_abort_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
