id: ADV65-mev-leak
category: A_conflict
adversarial: true
seed: 165
description: >
  [对抗·red-team wave11] MEV 泄露: 私有意图在公开 mempool 被复制,
  管线尚无 mev_leak_detected → 预期 FAIL
setup:
  blackboard:
    - {key: private_intent, value: "buy_xyz_secret", writers: [user]}
  roles: [user, searcher]
inject:
  - {type: write_conflict, role: searcher, target: public_mempool, value: "buy_xyz_secret"}
  - {type: write_conflict, role: searcher, target: execution, value: "searcher_first"}
expected:
  behavior: mev_leak_detected
  silent_loss: 0
verdict:
  - criterion: mev_leak_detected
    check: events_contain
    args: {kind: mev_leak_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
