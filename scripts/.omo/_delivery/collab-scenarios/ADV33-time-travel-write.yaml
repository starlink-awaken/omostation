id: ADV33-time-travel-write
category: B_failure_injection
adversarial: true
seed: 133
description: >
  [对抗·red-team wave6] 时间旅行写: 用更旧逻辑版本覆盖新结果 (stale override),
  管线尚无 time_travel_write_detected → 预期 FAIL
setup:
  blackboard:
    - {key: ledger, value: "v3_final", writers: [committer]}
  roles: [committer, stale_writer]
inject:
  - {type: write_conflict, role: stale_writer, target: ledger, value: "v1_old"}
  - {type: write_conflict, role: stale_writer, target: ledger, value: "v0_ancient"}
expected:
  behavior: time_travel_write_detected
  silent_loss: 0
verdict:
  - criterion: time_travel_write_detected
    check: events_contain
    args: {kind: time_travel_write_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
