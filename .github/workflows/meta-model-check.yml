name: Meta-Model CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/runtime'
      - 'projects/runtime/protocols/*.yaml'
      - 'projects/runtime/protocols/*.md'
  pull_request:
    paths:
      - 'projects/runtime'
      - 'projects/runtime/protocols/*.yaml'
      - 'projects/runtime/protocols/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 显式 init scripts + runtime (下方步骤), 不 recursive (避免撞 private 子模块)
          submodules: false
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Init required submodules
        run: git submodule update --init projects/runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install yamllint pyyaml pytest
      - name: Validate YAML syntax
        # -c 读本仓的配置: protocols/*.yaml 是数据文件 (单行最长 237), 默认 80 列会造出
        # 35 条 line-length error, 让每一次 runtime gitlink bump 都卡这里 (2026-11-03 实测)。
        run: yamllint -c projects/runtime/.yamllint.yml projects/runtime/protocols/
      - name: Validate Protocol Registry Hygiene
        run: python3 -m pytest projects/runtime/tests/test_protocol_registry_hygiene.py
      - name: List protocols
        run: |
          # --no-deps: runtime 的依赖里有指向兄弟子模块的 path 源 (aetherforge / omo /
          # agora / bus-foundation), 而本 job 只 init 了 projects/runtime ⇒ pip 解析不到,
          # 整步失败 (2026-11-03 实测: 每一次 runtime gitlink bump 都会踩)。
          # 改为只装 runtime 本体 + 其外部依赖 (path 源那几个由 runtime 自己的 uv 环境解析)。
          python3 -m pip install --no-deps -e projects/runtime/
          python3 -m pip install apscheduler croniter fastapi fastmcp httpx pydantic pyjwt requests uvicorn pyyaml
          python3 -m runtime protocol list
