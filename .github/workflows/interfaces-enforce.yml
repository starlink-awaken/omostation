name: interfaces-enforce
# P47+: 接口契约 + 端口冲突 enforce. 复用 scripts/check-interfaces.py.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the PR head tree so gitlink updates are not shadowed by
          # an unreachable submodule pointer from GitHub's synthetic merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # 显式 init scripts, 不 recursive (避免撞 private 子模块)
          submodules: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - name: Run interfaces check (registry-driven, ADR-0380 P1a)
        run: python3 bin/gac/ci-check-runner.py --workflow interfaces-enforce.yml
