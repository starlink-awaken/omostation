name: Debt Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一早上 9 点运行
    - cron: '0 9 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pull-requests: write   # comment on PR (GITHUB_TOKEN 默认只读致 createComment 403)

jobs:
  debt-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 显式 init scripts (debt-audit.sh 核心审计), 不 recursive (避免撞 private 子模块)
          submodules: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run debt audit
        # debt-audit.sh 已归档 (scripts 子模块无此脚本) → 用 bin/gac/debt-integrity-check.py 替代
        # 报告取检查的真实输出: 此前「错误: 0 / 警告: 0」是写死的, 检查失败也被 || echo 吞掉,
        # PR 评论永远报 0 (2026-09-28 修)。检查失败则本步骤失败 (本 workflow 非 required check)。
        run: |
          set +e
          python3 bin/gac/debt-integrity-check.py > debt-integrity.txt 2>&1
          rc=$?
          set -e
          cat debt-integrity.txt
          errors=$(grep -c "❌" debt-integrity.txt || true)
          warnings=$(grep -c "⚠️" debt-integrity.txt || true)
          {
            echo "# 债务审计报告"
            echo ""
            echo "- 检查: bin/gac/debt-integrity-check.py (exit ${rc})"
            echo "- 错误: ${errors}"
            echo "- 警告: ${warnings}"
            echo ""
            echo '```'
            cat debt-integrity.txt
            echo '```'
          } > debt-audit-report.md
          exit "${rc}"
      
      - name: Generate governance dashboard
        continue-on-error: true
        run: python3 bin/gac/governance-dashboard.py
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debt-audit-report
          path: debt-audit-report.md
          retention-days: 30
      
      - name: Comment on PR
        # 审计失败时更需要评论 (默认 success() 条件会跳过)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('debt-audit-report.md', 'utf8');
            
            // 提取关键信息
            const errors = report.match(/错误: (\d+)/)?.[1] || '0';
            const warnings = report.match(/警告: (\d+)/)?.[1] || '0';
            
            const body = `## 📊 债务审计报告
            
            | 指标 | 值 |
            |------|-----|
            | 错误 | ${errors} |
            | 警告 | ${warnings} |
            
            <details>
            <summary>详细报告</summary>
            
            ${report}
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
