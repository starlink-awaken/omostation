name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv venv --allow-existing --python 3.13
      - name: Ruff check
        run: uv run --no-project --with ruff ruff check packages/reach/src/ scripts/reachbridge-kems-gateway.py tests/test_reach_kems.py
      - name: Ruff format check
        run: uv run --no-project --with ruff ruff format packages/reach/src/ scripts/reachbridge-kems-gateway.py tests/test_reach_kems.py --check
      - name: Contract Gatekeeper
        run: python3 scripts/contract_gatekeeper.py packages/reach/src/reach_gateway/ scripts/reachbridge-kems-gateway.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv venv --allow-existing --python 3.13
      - name: Run tests
        run: PYTHONPATH=packages/reach/src uv run --no-project --with pytest --with pytest-asyncio pytest tests/test_reach_kems.py -q --tb=short
