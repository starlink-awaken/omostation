name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Diff-scoped Ruff checks
        run: |
          changed_py="$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.py')"
          if [ -n "$changed_py" ]; then
            uv run --no-project --with "ruff>=0.4" ruff check --select I $changed_py
            uv run --no-project --with "ruff>=0.4" ruff format $changed_py --check
          else
            echo "No Python files changed; skipping Ruff checks."
          fi
      - name: OMO Contract Gatekeeper
        run: python scripts/contract_gatekeeper.py src/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Run tests
        run: |
          # Workspace-only integration and release tests run in root CI.
          env PYTHONPATH="$PWD/src:$PWD" uv run --no-project \
            --with "pytest>=9" \
            --with "pytest-asyncio>=1.4.0" \
            --with "pyyaml>=6.0.3" \
            --with "httpx[socks]>=0.28.1" \
            --with "openai>=2.41.1" \
            --with "pydantic>=2.0" \
            --with "fastmcp>=3.4.2" \
            --with "ecos @ git+https://github.com/starlink-awaken/omostation-ecos.git@3d252996fee0de328cce31ac2f9f6d7d7598b965" \
            pytest tests/ --tb=short \
            --ignore=tests/integration \
            --ignore=tests/test_append_only_log_schemas.py \
            --ignore=tests/test_omo_direct_io_gate.py \
            --ignore=tests/test_omo_daemon_publish_e2e.py \
            --ignore=tests/test_phase3_acceptance_runner.py \
            --ignore=tests/unit/test_release.py \
            -k "not test_find_omo_dir_prefers_workspace_root_over_subrepo_shadow"

  test-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Run tests with coverage
        run: |
          # Workspace-only integration and release tests run in root CI.
          env PYTHONPATH="$PWD/src:$PWD" uv run --no-project \
            --with "pytest>=9" \
            --with "pytest-asyncio>=1.4.0" \
            --with "pytest-cov>=5" \
            --with "pyyaml>=6.0.3" \
            --with "httpx[socks]>=0.28.1" \
            --with "openai>=2.41.1" \
            --with "pydantic>=2.0" \
            --with "fastmcp>=3.4.2" \
            --with "ecos @ git+https://github.com/starlink-awaken/omostation-ecos.git@3d252996fee0de328cce31ac2f9f6d7d7598b965" \
            pytest tests/ --tb=short --cov \
            --ignore=tests/integration \
            --ignore=tests/test_append_only_log_schemas.py \
            --ignore=tests/test_omo_direct_io_gate.py \
            --ignore=tests/test_omo_daemon_publish_e2e.py \
            --ignore=tests/test_phase3_acceptance_runner.py \
            --ignore=tests/unit/test_release.py \
            -k "not test_find_omo_dir_prefers_workspace_root_over_subrepo_shadow"
