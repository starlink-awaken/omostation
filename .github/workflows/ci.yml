name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          python-version: "3.13"
      - run: uv sync --all-groups --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - name: Smoke generated wheel entry points in an isolated environment
        run: |
          smoke_dir="$RUNNER_TEMP/omlxc-wheel-smoke"
          uv venv --python 3.13 "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/omlxc-3.0.0a1-py3-none-any.whl
          "$smoke_dir/bin/omlxc" --version
          "$smoke_dir/bin/omlxcd"
      - run: uv run pip-audit
