name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format src/ --check
      - name: Contract Gatekeeper
        run: python scripts/contract_gatekeeper.py src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/e2e -q --tb=short

  validate-bos-contracts:
    # Phase 1 (P110-C, ADR-0110): BOS Contract Linter 30-day plan 强制接入
    # 只在 PR 修改 projects/agora/etc/bos-services.yaml 时触发
    # 避免 PR 未改 bos-services.yaml 时无效运行 (19 errors 当前)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'projects/agora/etc/bos-services.yaml') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install ecos (BOS Contract Linter)
        run: |
          cd projects/ecos
          uv sync
      - name: Validate BOS Contracts
        run: |
          echo "Validating BOS Service Contracts (Phase 1, ADR-0110)..."
          cd projects/ecos
          uv run mof-contract-lint --json --bos-yaml "../agora/etc/bos-services.yaml"
