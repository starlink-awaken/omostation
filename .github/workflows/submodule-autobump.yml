name: Submodule Auto-Bump
# 自动检测子模块指针相对远端 main 的精确 SHA 漂移, 每日一次.
# proposal-only: 检测 + 上传提案产物; 不在云端自愈发布.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for submodule advances
        id: check
        run: |
          chmod +x bin/ssot/submodule-autobump.sh
          set +e
          bash bin/ssot/submodule-autobump.sh --check-only 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::submodule-autobump check failed (exit $rc)" && exit 1 ;;
          esac

      - name: Emit publication proposal artifact
        run: |
          set -euo pipefail
          mkdir -p proposal-artifact
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          base_sha = git("rev-parse", "HEAD")
          has_changes = os.environ.get("HAS_CHANGES", "false") == "true"
          status = "drift_detected" if has_changes else "clean"
          proposed_ref = "proposal/submodule-autobump"

          paths: list[str] = []
          if Path(".gitmodules").exists():
              raw = subprocess.check_output(
                  [
                      "git",
                      "config",
                      "--file",
                      ".gitmodules",
                      "--get-regexp",
                      r"^submodule\..*\.path$",
                  ],
                  text=True,
              )
              for line in raw.splitlines():
                  parts = line.split(" ", 1)
                  if len(parts) == 2:
                      paths.append(parts[1].strip())

          proposal = {
              "schema": "github-publication-proposal/v1",
              "workflow": "submodule-autobump",
              "status": status,
              "base_sha": base_sha,
              "head_sha": base_sha,
              "base_ref": "main",
              "proposed_ref": proposed_ref,
              "ref": proposed_ref,
              "instruction": "PUBLICATION_OWNER_REQUIRED",
              "managed_remediation_entrypoint": "bin/gac/clone-lifecycle.py integrate",
              "remediation": {
                  "summary": (
                      "submodule-autobump --check-only reported drift; "
                      "cloud job uploads proposal only."
                      if has_changes
                      else "No submodule advances detected."
                  ),
                  "paths": paths,
                  "check_only": True,
              },
          }
          out = Path("proposal-artifact/publication-proposal.json")
          out.write_text(json.dumps(proposal, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
        env:
          HAS_CHANGES: ${{ steps.check.outputs.has_changes }}

      - name: Upload proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: submodule-autobump-publication-proposal
          path: proposal-artifact/publication-proposal.json
          retention-days: 30

      - name: Fail closed on detected drift (no self-heal)
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "::error::submodule advances detected; proposal artifact uploaded, no cloud publication performed"
          exit 1
