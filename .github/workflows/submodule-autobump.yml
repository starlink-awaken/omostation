name: Submodule Auto-Bump
# 自动 bump 子模块指针到远端 main 的精确 SHA, 每日一次.
# 全量验证通过且有变动才 bump + 开 PR; 任何 fetch/验证失败 → fail-closed, 不开 PR.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Check for submodule advances
        id: check
        run: |
          chmod +x bin/ssot/submodule-autobump.sh
          set +e
          bash bin/ssot/submodule-autobump.sh --check-only 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::submodule-autobump check failed (exit $rc)" && exit 1 ;;
          esac

      - name: Apply bump and create PR
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # bot identity: 脚本 commit 前显式配置 (脚本自身不设置身份)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash bin/ssot/submodule-autobump.sh
          BRANCH="auto/submodule-bump-$(date +%Y%m%d%H%M)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: auto-bump submodule pointers to latest main" \
            --body "Auto-generated: bumped submodule pointers to latest origin/main." \
            --base main \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
