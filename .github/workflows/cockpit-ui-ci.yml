name: Cockpit UI CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/cockpit-ui'
      - 'projects/cockpit-ui/**'
      - '.github/workflows/cockpit-ui-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/cockpit-ui'
      - 'projects/cockpit-ui/**'
      - '.github/workflows/cockpit-ui-ci.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build and Lint UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      # cockpit-ui 为独立仓 omostation-cockpit-ui, 以 submodule 挂载主仓 (ADR 见 decisions)。
      # 主仓检出不含该目录时优雅跳过, 不再让主仓 PR 永远挂在 cd 失败上。
      - id: guard
        name: Detect cockpit-ui presence
        run: echo "present=$([ -d projects/cockpit-ui ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: 20
      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        run: cd projects/cockpit-ui && npm install
      - name: Lint
        if: steps.guard.outputs.present == 'true'
        run: cd projects/cockpit-ui && npm run lint || true
      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: cd projects/cockpit-ui && npm run build
