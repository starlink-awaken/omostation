name: Agent Workflow Standard Check

on:
  push:
    branches: [main]
    paths:
      - 'lib/agent_workflow_standard.py'
      - 'bin/gac/agent-workflow-standard-check.py'
      - 'bin/agent-workflow.py'
      - '.github/workflows/agent-workflow-standard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agent_workflow_standard.py'
      - 'bin/gac/agent-workflow-standard-check.py'
      - 'bin/agent-workflow.py'
      - '.github/workflows/agent-workflow-standard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-workflow-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest

      - name: Check agent workflow standard compliance
        run: |
          python3 bin/gac/agent-workflow-standard-check.py --all --json
        env:
          AGENT_WORKFLOW_STANDARD_MODE: 'true'

      - name: Run standard tests
        run: |
          python3 -m pytest tests/test_agent_workflow_standard.py -v --tb=short

      - name: Verify standard library imports
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'lib')
          from agent_workflow_standard import (
              create_range_declaration,
              check_lock_status,
              verify_modification,
              validate_agent_signature,
              check_compliance,
          )
          print('All imports successful')
          "

      - name: Check standard mode environment
        run: |
          echo "AGENT_WORKFLOW_STANDARD_MODE=${AGENT_WORKFLOW_STANDARD_MODE}"
          python3 bin/gac/agent-workflow-standard-check.py --status --json
        env:
          AGENT_WORKFLOW_STANDARD_MODE: 'true'

      - name: Verify backward compatibility
        env:
          PYTHONPATH: projects/omo/src
        run: |
          # Ensure existing agent-workflow.py still works
          python3 bin/agent-workflow.py --help
          echo "Backward compatibility check passed"

      - name: Generate compliance report
        if: always()
        run: |
          python3 bin/gac/agent-workflow-standard-check.py --all --json > standard-compliance-report.json || true
          cat standard-compliance-report.json

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-compliance-report
          path: standard-compliance-report.json
          retention-days: 30
