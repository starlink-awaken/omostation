name: Submodule Freshness Gatekeeper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight to check for drifted submodules
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-and-bump-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Detect submodule remote drift
        id: drift
        run: |
          set -euo pipefail
          git submodule update --remote --recursive
          if [ -z "$(git status --porcelain)" ]; then
            echo "No submodules need updating."
            echo "CHANGED=false" >> "$GITHUB_ENV"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submodules drifted! Emitting proposal only (no self-heal)."
            echo "CHANGED=true" >> "$GITHUB_ENV"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify gitlink reachability
        run: python3 bin/ssot/submodule-reachability-gate.py --source worktree --fetch

      - name: Run Workspace Tests (kairon, agora, omo, bus-foundation)
        if: env.CHANGED == 'true'
        run: |
          # 假设这是全局 CI 验证宏入口
          # 如果子模块更新破坏了架构，这里会 fail
          make governance-verify
          # 暂时允许通过，后续由真实的单测取代

      - name: Emit publication proposal artifact
        run: |
          set -euo pipefail
          mkdir -p proposal-artifact
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          base_sha = os.environ.get("GITHUB_SHA") or git("rev-parse", "HEAD")
          has_changes = os.environ.get("HAS_CHANGES", "false") == "true"
          status = "drift_detected" if has_changes else "clean"
          proposed_ref = "proposal/submodule-freshness"

          upgrade_paths: list[dict[str, str]] = []
          status_lines = subprocess.check_output(
              ["git", "submodule", "status"], text=True
          ).splitlines()
          for line in status_lines:
              parts = line.split()
              if len(parts) < 2:
                  continue
              sm = parts[1]
              head_sha = ""
              ls_tree = subprocess.run(
                  ["git", "ls-tree", "HEAD", sm],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if ls_tree.returncode == 0 and ls_tree.stdout.strip():
                  head_sha = ls_tree.stdout.split()[2]
              wt = subprocess.check_output(
                  ["git", "submodule", "status", sm], text=True
              ).split()
              wt_sha = wt[0].lstrip("+-") if wt else ""
              if head_sha and wt_sha and head_sha != wt_sha:
                  upgrade_paths.append(
                      {
                          "path": sm,
                          "base_sha": head_sha,
                          "head_sha": wt_sha,
                      }
                  )

          proposal = {
              "schema": "github-publication-proposal/v1",
              "workflow": "submodule-freshness-gatekeeper",
              "status": status,
              "base_sha": base_sha,
              "head_sha": base_sha,
              "base_ref": "main",
              "proposed_ref": proposed_ref,
              "ref": proposed_ref,
              "instruction": "PUBLICATION_OWNER_REQUIRED",
              "managed_remediation_entrypoint": "bin/gac/clone-lifecycle.py integrate",
              "remediation": {
                  "summary": (
                      "Freshness gate detected drifted gitlinks; proposal uploaded, "
                      "no cloud publication."
                      if has_changes
                      else "All submodule gitlinks match remote HEAD."
                  ),
                  "paths": [p["path"] for p in upgrade_paths],
                  "upgrades": upgrade_paths,
              },
          }
          out = Path("proposal-artifact/publication-proposal.json")
          out.write_text(json.dumps(proposal, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
        env:
          HAS_CHANGES: ${{ steps.drift.outputs.has_changes }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: submodule-freshness-publication-proposal
          path: proposal-artifact/publication-proposal.json
          retention-days: 30

      - name: Fail closed on detected drift (no self-heal)
        if: steps.drift.outputs.has_changes == 'true'
        run: |
          echo "::error::stale/drifted submodule gitlink detected; proposal artifact uploaded, no cloud publication performed"
          exit 1
