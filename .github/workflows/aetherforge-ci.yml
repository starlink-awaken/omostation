name: AetherForge CI (Local Compute Gateway & Swarm)

on:
  push:
    branches: [main]
    paths:
      - 'projects/aetherforge/**'
      - '.github/workflows/aetherforge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/aetherforge/**'
      - '.github/workflows/aetherforge-ci.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    name: AetherForge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "projects/aetherforge/pyproject.toml"
      - name: Install dependencies
        run: cd projects/aetherforge && uv sync
      - name: Run pytest
        run: cd projects/aetherforge && uv run pytest -q
