name: OMO Autopilot (v4.0 Evolutionary Loop)

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC daily
  workflow_dispatch: # Allow manual trigger
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  metabolic_loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          
      - name: Install OMO Tools
        run: |
          uv tool install --force ./projects/omo
          uv tool install --force ./projects/omo  # omo-debt 内包 (ADR-0412)
          
      - name: 1. Perception (Sense Debt)
        run: |
          # ADR-0412: CI installs the omo-bundled omo-debt (uv tool install ./projects/omo),
          # which does not expose the standalone 'analyze' subcommand. Use the bundled
          # refresh (refresh debt output state) + dispatch (materialize current debt
          # output packet) to sense the current debt posture.
          omo-debt refresh --omo-dir .omo --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          omo-debt dispatch --omo-dir .omo --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
      - name: 2. Metabolism (GC)
        run: |
          omo gc
          
      - name: 3. Ledger Snapshot (Governance Log)
        run: |
          omo ledger --message "Automated Daily Metabolic Snapshot"
          
      - name: Create Pull Request if changes exist
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(omo): daily metabolic evolution"
          branch: omo-daily-metabolism
          title: "🤖 OMO Daily Metabolic Evolution"
          body: "Automated cleanup, debt assessment, and ledger snapshot."
