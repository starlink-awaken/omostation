name: observability-ci
# P47 E: observability 是 docker-compose (Langfuse + webhook-bridge → omo).
# CI = compose config 语法校验 + webhook-bridge.py 语法检查.
on:
  push:
    branches: [main]
    paths: ['projects/observability/**', '.github/workflows/observability-ci.yml']
  pull_request:
    branches: [main]
    paths: ['projects/observability/**', '.github/workflows/observability-ci.yml']

jobs:
  validate:
    name: observability compose config + bridge lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - name: Fallback checkout (no submodules)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - name: Init submodules (fallback)
        if: steps.checkout.outcome == 'failure'
        run: git submodule update --init --recursive 2>/dev/null || true
      - name: docker compose config -q (语法校验)
        run: cd projects/observability && docker compose config -q
      - name: webhook-bridge.py syntax check
        run: python3 -m py_compile projects/observability/webhook-bridge.py
