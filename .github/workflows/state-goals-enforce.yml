name: state-goals-enforce
# P47+: state/goals 对齐 enforce. 复用 bin/ssot/current-state-coherence.py.
# (scripts/check-state-goals-alignment.py 已随 scripts 子模块清理归档 ADR-0394,
# 功能由 current-state-coherence.py 覆盖.)
# 脚本只读主仓 .omo/ (state/goals/tasks), 不依赖 projects/ 子模块 — 所以不拉
# submodules: recursive (会撞 private 子模块导致 checkout 失败). 只 init scripts.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - run: python3 bin/ssot/current-state-coherence.py
