name: state-goals-enforce
# P47+: state/goals 对齐 enforce. 复用 bin/ssot/current-state-coherence.py
# (替代 scripts/check-state-goals-alignment.py — 该脚本从未合入 scripts 子模块 main,
# 功能已被 current-state-coherence.py 覆盖).
# 脚本只读主仓 .omo/ (state/goals/tasks), 不依赖 projects/ 子模块.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - run: python3 bin/ssot/current-state-coherence.py
