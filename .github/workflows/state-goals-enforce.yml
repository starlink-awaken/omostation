name: state-goals-enforce
# P47+: state/goals 对齐 enforce. 复用 bin/ssot/current-state-coherence.py.
# (scripts/check-state-goals-alignment.py 已随 scripts 子模块清理归档 ADR-0394,
# 功能由 current-state-coherence.py 覆盖.)
# 脚本只读主仓 .omo/ (state/goals/tasks), 不依赖 projects/ 子模块 — 所以不拉
# submodules: recursive (会撞 private 子模块导致 checkout 失败). 只 init scripts.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This check reads only root .omo state/goals/tasks. Recursive checkout
          # can fail on private submodules and leave the root projection absent.
          submodules: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      # ADR-0456 B5 (BET-Y2Q4-T10-235) — .omo/state/system.yaml 已摘库, 干净检出里它根本不存在,
      # 而下面的检查对缺失输入抛 CoherenceInputError 返回 rc 2. 先由创建者从已提交真源物化一次.
      - run: python3 bin/gac/materialize-system-state.py --json
      - run: python3 bin/ssot/current-state-coherence.py
