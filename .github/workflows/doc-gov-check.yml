name: doc-gov-check
on:
  pull_request:
    paths:
      - "**.md"
      - "bin/ssot/generate-docs-index.py"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "bin/ssot/generate-docs-index.py"
      - "docs/**"

jobs:
  doc-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成文档索引
        run: python3 bin/ssot/generate-docs-index.py

      - name: 合规检查 (--check, UNTYPED 不阻塞)
        run: |
          # 仅对 SSOT/derived/ephemeral 类型做严格检查
          # UNTYPED 文档是渐进式改进目标，不阻塞 CI
          python3 -c "
          import json, sys, os
          os.environ['WORKSPACE_ROOT'] = '.'
          # 重新运行并仅检查非 UNTYPED 问题
          from bin.ssot.generate_docs_index import scan_md_files, check_compliance, GENERATED_DIR
          files = scan_md_files()
          all_issues = check_compliance(files)
          strict_issues = [i for i in all_issues if not i.startswith('[UNTYPED]')]
          if strict_issues:
              print(f'FAIL: {len(strict_issues)} 个严格合规问题')
              for i in strict_issues:
                  print(f'  {i}')
              sys.exit(1)
          print(f'PASS: SSOT/derived/ephemeral 全部合规 (untyped: {sum(1 for f in files if f[\"type\"]==\"untyped\")}, 渐进改进中)')
          "

      - name: 检查索引文件是否最新
        run: |
          if [ -n "$(git status --porcelain docs/generated/doc-inventory.md)" ]; then
            echo "::warning::doc-inventory.md 需要更新，请运行: python3 bin/ssot/generate-docs-index.py"
          fi
