name: Governance Check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/governance-check.yml"
      - ".pre-commit-config.yaml"
      - ".omo/**"
      - "docs/OPC-*.md"
      - "docs/**"
      - "bin/ssot/doc-governance-check.py"
      - ".omo/_truth/registry/document-governance.yaml"
      - ".omo/standards/document-governance-standard.md"
      - "projects/*"
      - "projects/*/pyproject.toml"
      - "projects/*/src/**"
      - "projects/omo/tests/**"
      - "projects/ecos/scripts/contract_gatekeeper.py"
      - "bin/ssot/workspace-audit"
      - "CLAUDE.md"
      - "LAYER-INDEX.md"
  pull_request:
    paths:
      - ".github/workflows/governance-check.yml"
      - ".pre-commit-config.yaml"
      - ".omo/**"
      - "docs/OPC-*.md"
      - "docs/**"
      - "bin/ssot/doc-governance-check.py"
      - ".omo/_truth/registry/document-governance.yaml"
      - ".omo/standards/document-governance-standard.md"
      - "projects/*"
      - "projects/*/pyproject.toml"
      - "projects/*/src/**"
      - "projects/omo/tests/**"
      - "projects/ecos/scripts/contract_gatekeeper.py"
      - "bin/ssot/workspace-audit"
      - "CLAUDE.md"
      - "LAYER-INDEX.md"
  schedule:
    - cron: "0 */6 * * *"  # 每6小时自动运行，确保SSOT长期绿色
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  meta-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: M2 引用活性巡检 (cron/launchd 登记目标存在性; CI 无本地心跳语境跳过 M1)
        run: python3 bin/gac/meta-doctor.py --workspace "$GITHUB_WORKSPACE" --refs-only

  interface-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Run governance checks
        run: |
          # ADR-0379 E-2: registry-driven — 检查清单来自 ci-surfaces.yaml (workflow=governance-check.yml),
          # 取代旧 21 行 FAILED=1 bash 循环 (P77 silent-fail 根因: 无 per-check 报告/无登记契约).
          # 新增/移除 doc check 只改 .omo/_truth/registry/ci-surfaces.yaml (CR-CI-SURFACE-SSOT).
          FAILED=0
          python3 bin/gac/ci-check-runner.py --workflow governance-check.yml || FAILED=1
          python3 bin/gac/check-submodule-rewind.py --json > /tmp/rewind-report.json || FAILED=1
          python3 -c "import json,sys; d=json.load(open('/tmp/rewind-report.json')); v=d.get('violations',[]); w=d.get('warns',[]); print(f'rewind violations={len(v)}, warns={len(w)}'); sys.exit(1 if v else 0)" || FAILED=1
          # BET-Y2Q4-T10-06: 孤儿执行器接线 (规则接线批次三) — 三脚本本地 rc=0 实测
          python3 bin/gac/mcp-tool-data-complete.py || FAILED=1
          python3 bin/ssot/check-cross-repo-consistency.py || FAILED=1
          python3 bin/gac/timeout-audit.py || FAILED=1
          python3 bin/gac/check-debt-closure-discipline.py || FAILED=1
          cd projects/omo
          uv sync --quiet   # 显式 sync (确保 pydantic 等依赖装好)
          uv run --no-sync --directory . python -m omo.cli governance surfaces --workspace-root ../.. --json > /tmp/omo-governance-surfaces.json || { echo "=== governance surfaces FAIL, output: ==="; cat /tmp/omo-governance-surfaces.json 2>/dev/null; FAILED=1; }
          uv run --no-sync --directory . python -m omo.cli lint direct-omo-io || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint sensitive-governed-writes || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint schemas || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint yaml-bypass || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint ingress-registry --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint mutation-surfaces --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint internal-write-profiles --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint state-plane-assets --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint c2g-omo-boundary --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint ingress-artifacts --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint mutation-ledger --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint doc-lifecycle --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint self-evolution-approval --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint task-policy --all --workspace-root ../.. || FAILED=1
          uv run --no-sync --directory . python -m omo.cli lint god-module --workspace-root ../.. || echo "⚠️ god-module warnings (non-blocking)"
          # 模型驱动治理闭环 (L0↔MOF, 2026-08-09): 真实数据端到端验证
          # cwd 在 projects/omo (上方 cd), 用 ../.. 回到 workspace root 再跑.
          python3 ../../bin/ssot/governance_closed_loop.py || { echo "❌ 治理闭环验证失败 (governance_closed_loop)"; FAILED=1; }
          # Root-level governance-invariant tests (CI visibility closure, 2026-10-08):
          # 此前 root tests/ 仅 test_agent_workflow.py 被点名; 其余治理不变量测试本地可红
          # 但 CI 结构性失明 (如 test_rule_wiring_coverage.py 曾数月红而 CI 从未见)。
          # 按 ADR-0379 E-2 显式白名单惯例逐文件点名, 不转 glob。每文件均须在当前 main 全绿
          # 且为 hermetic 治理断言 (registry/gate 性质), 基线实测 215/239 pass 后挑选。
          # 2026-10-08 追加 tests/unit/ 两件 (#4671 事故的直接后果: 那两个 sys.path 算错的
          # 脚本唯一被跑到的用例就在 tests/unit/, 白名单此前不含该平面, 于是"CI 绿"对这类
          # 交付不构成任何证据)。点名理由逐件: test_bin_syspath_resolution 钉 parents[K] 算数
          # +  detector 自证; test_system_yaml_write_plane 钉 system.yaml 写面落 state 根 +
          #  检出副本由用例自己物化。两者实测 7 + 25 pass, 且 replay 原缺陷会当场红 (牙齿验过)。
          uv run pytest \
            tests/test_omo_ingress.py \
            tests/test_omo_gc.py \
            tests/test_omo_governance.py \
            tests/test_omo_governance_surfaces.py \
            tests/test_omo_direct_io_gate.py \
            tests/test_omo_task_policy.py \
            tests/test_opc_p5_p7_runtime.py \
            ../../tests/test_agent_workflow.py \
            ../../tests/test_rule_wiring_coverage.py \
            ../../tests/test_adr_coverage_exit_contract.py \
            ../../tests/test_gac_gate_workflow.py \
            ../../tests/test_gac_gate_workflow_purity.py \
            ../../tests/test_doc_ssot_lint_json.py \
            ../../tests/test_doc_governance_check.py \
            ../../tests/test_check_cross_refs.py \
            ../../tests/test_cron_registry_contract.py \
            ../../tests/test_ssot_guardian.py \
            ../../tests/test_service_registry_reality.py \
            ../../tests/test_yaml_bypass_invariant.py \
            ../../tests/unit/test_bin_syspath_resolution.py \
            ../../tests/unit/test_system_yaml_write_plane.py \
            -q || FAILED=1
          if [ $FAILED -ne 0 ]; then
            echo "❌ One or more governance checks failed."
            exit 1
          fi

      - name: MOF security scan
        run: |
          bin/mof/mof-scan || echo "⚠️ Security scan found issues (non-blocking)"

      - name: Agent 准入检查 (metaos admit)
        run: |
          cd projects/metaos
          uv run metaos admit --domain ci --role generator --values "safety,transparency" --otlp --audit-id "ci-${{ github.sha }}" || echo "⚠️ Agent admit check (non-blocking, informational)"

  doc-freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Check documentation freshness
        run: |
          # ADR-0379 E-2: check-interfaces 已由独立 workflow interfaces-enforce.yml 覆盖, 移除冗余
          python3 bin/ssot/doc-governance-check.py --scope workspace --no-new-warnings --json

  # 2026-08-26: bet-done-transition 拆至独立 workflow bet-done-gate.yml —
  # 本 workflow 的 path 过滤使 required check 在非匹配路径 PR 上永久悬空
  # (#2197), 独立必跑 workflow 根治。job 名不变, branch protection 无需改动。

  governance-verify:
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || github.ref == 'refs/heads/main'"
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the submitted tree itself for deterministic PR evidence.
          # GitHub's synthetic merge ref
          # can resolve conflicting gitlinks to the base side, which would
          # make governance checks inspect a different submodule graph than
          # the PR delivers.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # T1-12: done-transition 守卫需要 base revision 做台账 diff
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Python gate deps
        run: pip install pyyaml pydantic pytest
      - name: BET spec binding lint contract tests
        run: python3 -m pytest tests/test_spec_binding_lint.py -q
      - name: ADR-0456 B1 call-time write-plane gate
        # tests/unit/** 不在任何 CI 白名单里 (verify-omo.sh 只跑 projects/omo 与 .omo/tests),
        # 结构性源码扫描必须显式点名, 否则「CI 绿」不构成这条门禁的证据 (BET-Y2Q4-T10-232)。
        run: python3 -m pytest tests/unit/test_b1_ledger_call_time.py -q
      - name: ADR-0456 B5 system.yaml materializer gate
        # 创建者 I1–I4 + 摘库接线; 未点名则 §7 验收-5 的「pytest 全绿」只是本地证据 (T10-235)。
        run: python3 -m pytest tests/unit/test_system_yaml_materializer.py -q
      - name: ADR-0456 B5 materializer consumer wiring gate
        # 第二次交付: 读者接线顺序 (创建者先跑) + 登记面 (ci-surfaces/_registry) + 正向落点。
        # 判据只吃已提交的 workflow/registry 文本, 因此在干净检出里同样成立 (BET-Y2Q4-T10-235 判据-6)。
        run: python3 -m pytest tests/unit/test_system_yaml_consumer_inputs.py -q
      - name: Run full governance verification
        run: make governance-verify
      - name: Submodule pointer drift check
        run: |
          # Normal PRs/main pushes reject ahead/diverged pointers. Reachable
          # behind pointers remain a supply signal handled by the auto-bump PR.
          pointer_out="$RUNNER_TEMP/submodule-pointer-drift.json"
          set +e
          python3 bin/gac/check-submodule-pointer-drift.py --json > "$pointer_out"
          pointer_rc=$?
          set -e
          cat "$pointer_out"
          if [[ "$pointer_rc" -ne 0 ]]; then
            echo "❌ submodule pointer divergence detected"
            exit 1
          fi
          if ! jq -e '
            .results | type == "array" and all(.[];
              type == "object" and (
                .status == "aligned" or
                .status == "behind" or
                .status == "ahead" or
                .status == "DIVERGED" or
                .status == "unverifiable" or
                .status == "skip"
              )
            )
          ' "$pointer_out" > /dev/null; then
            echo "❌ malformed submodule pointer report"
            exit 1
          fi
          # NOTE: "ahead" is intentionally non-blocking (script reports it as OK).
          # The reachability gate (gac-gate) separately ensures the commit is on a
          # pushed origin branch. Removing the extra jq guard that contradicted
          # the script's own non-blocking designation for "ahead".
      - name: Submodule pointer strict auto-bump gate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/submodule-bump-')
        run: |
          # A PR whose only purpose is freshness must close every reachable
          # behind pointer; unlike normal delivery PRs, warnings are blocking.
          python3 bin/gac/check-submodule-pointer-drift.py --strict || {
            echo "❌ submodule pointer freshness drift detected"
            exit 1
          }
      - name: Document governance
        run: python3 bin/ssot/doc-governance-check.py --no-new-warnings
      - name: Emit failure signal on break
        if: failure()
        continue-on-error: true
        env:
          FAILURE_LOG: ${{ runner.temp }}/omo-events.jsonl
          FAILURE_REF: ${{ github.ref }}
          FAILURE_SHA: ${{ github.sha }}
          FAILURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": os.environ["FAILURE_REF"],
              "sha": os.environ["FAILURE_SHA"],
              "run_url": os.environ["FAILURE_RUN_URL"],
          }, separators=(",", ":")))
          PY
          )"
          signal_status=0
          uv run --project projects/omo python -m omo.cli event emit \
            --type governance_verify_failed \
            --source ci/governance-check.yml \
            --payload "$payload" \
            --log "$FAILURE_LOG" || signal_status=$?
          {
            echo "## Governance verification failure signal"
            echo "- ref: \`$FAILURE_REF\`"
            echo "- sha: \`$FAILURE_SHA\`"
            echo "- run: $FAILURE_RUN_URL"
            echo "- emitter exit: \`$signal_status\`"
            echo "- artifact: \`governance-verify-failure-signal-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$signal_status"

      - name: Upload governance failure signal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governance-verify-failure-signal-${{ github.run_id }}
          path: ${{ runner.temp }}/omo-events.jsonl
          if-no-files-found: warn
          retention-days: 14
