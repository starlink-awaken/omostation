        run: python3 -m pytest tests/unit/test_spine_diff_adaptation.py -q
      - name: zhixing GET method safety gate
        # 钉 zhixing GET 的方法安全 (只读方法不得带副作用)。实测 26 pass。
        run: python3 -m pytest tests/unit/test_zhixing_get_method_safety.py -q
      - name: bet-ledger JSON output gate
        # 钉台账 JSON 输出的字段契约。实测 1 pass。
        run: python3 -m pytest tests/unit/test_bet_ledger_json_output.py -q
      - name: check interfaces gate
        # 钉各 check 的接口契约。实测 16 pass。
        run: python3 -m pytest tests/unit/test_check_interfaces.py -q
      - name: real evalset generation gate
        # 钉真实评测集生成的字段契约。实测 6 pass。
        run: python3 -m pytest tests/unit/test_gen_real_evalset.py -q
      - name: journey fallback backedge gate
        # 钉 journey 回退的后向边 (回退不得成环)。实测 2 pass。
        run: python3 -m pytest tests/unit/test_journey_fallback_backedge.py -q
      - name: mail daemon resident loop gate
        # 钉邮件守护的 resident 循环口径。实测 5 pass。
        run: python3 -m pytest tests/unit/test_mail_daemon_resident_loop.py -q
      - name: gantt brief source consistency gate
        # 钉 gantt/brief 的源一致性 (cohort 先于 brief)。实测 7 pass。
        run: python3 -m pytest tests/unit/test_panorama_gantt_brief_source_consistency.py -q
      - name: reference-cell DL verify gate
        # 钉 reference-cell 的 DL 校验口径。实测 2 pass。
        run: python3 -m pytest tests/unit/test_reference_cell_dl_verify.py -q
      - name: agent-cell semantic smoke receipt-chain gate
        # 钉 agent-cell 语义 smoke 的收据链口径 (role capsule / mesh queue / 二次运行链式收据)。
        # STATE_DIR 被 monkeypatch 到 tmp_path, 不读 host 状态; HOME=<空> + env -u OMOSTATION_*
        # 下 4 pass。此前不在白名单 ⇒ 这条链的判据 CI 永远看不见。
        run: python3 -m pytest tests/unit/test_agent_cell_semantic_smoke.py -q
      - name: Phase 8 ecosystem root-resolver and retired-entry firewall gate
        # 钉 Phase 8 统一生态的 root resolver (sys.path 注入) 与退役入口的 refusal firewall。
        # 两个真实依赖: ① runpy 加载 bin/cockpit ⇒ 需要 rich (见上「Install Python gate deps」);
        # ② 断言 projects/{omo,ecos,agora}/src 已进 sys.path, 而 setup_workspace_paths() 只注入
        # 存在的目录 ⇒ 需要子模块在场 (本 job 是 submodules: recursive, 满足)。
        # 实测 10 pass; 依赖面收紧到只有 pyyaml/pydantic/pytest/pytest-timeout/rich 时同样 10 pass。
        run: python3 -m pytest tests/unit/test_phase8_unified_ecosystem.py -q
      - name: diff debt marker gate
        # 钉 diff 债务口径（TODO/FIXME 等 marker 的扫描与 base 比对）。用例自己在
        # tmp_path 建一次性 git 仓并配 local 身份, 被检脚本是 stdlib-only, 不读 host。
        # 实测 6 pass。
        run: python3 -m pytest tests/unit/test_diff_debt.py -q
      - name: diff growth gate
        # 钉 diff 增长口径。同上: 自建 git 仓 + stdlib-only 脚本。实测 6 pass。
        run: python3 -m pytest tests/unit/test_diff_growth.py -q
      - name: diff lifecycle gate
        # 钉 diff 生命周期口径。同上: 自建 git 仓 + stdlib-only 脚本。实测 9 pass。
        run: python3 -m pytest tests/unit/test_diff_lifecycle.py -q
      - name: stale branches gate
        # 钉失修分支口径 (protected branches 名单是入参, 不解析仓内 ref)。同上:
        # 自建 git 仓 + stdlib-only 脚本。实测 6 pass。
        run: python3 -m pytest tests/unit/test_stale_branches.py -q
      - name: guard-submodules non-destructive alignment gate
        # 钉 guard-submodules --fix 的非破坏性 (INV-1..4): 从生产脚本抽取
        # guard_submodules() 本体执行, 不复制逻辑。ISC-3 需从本地路径克隆, 故本轮
        # 同时修了它依赖 host gitconfig 的缺陷 (GIT_ALLOW_PROTOCOL=file)。实测 5 pass。
        run: python3 -m pytest tests/unit/test_gac_guard_submodules.py -q
      - name: submodule reachability undecidable-state gate
        # 钉「不可判定的 gitlink 不得静默放行」的反橡皮章契约 (契约 2 是关键断言)。
        # 本轮同时修了它只在 seed 仓配 git 身份、clone 侧缺失的缺陷。实测 4 pass。
        run: python3 -m pytest tests/unit/test_submodule_reachability_undecidable.py -q
      - name: gac-bootstrap layer mutation gate
        # 钉 gac-bootstrap 层3/层4/层6 的三组变异 (BET-Y2Q4-T10-347): 零分母判红、
        # 层4 覆盖全部路径型 source_ref、层6 的平面比对不得退回文本正则。
        # tests/unit/** 不在任何 CI 白名单里, 不点名则「CI 绿」不构成这条门禁的证据。
        # 实测 12 pass。
        run: python3 -m pytest tests/unit/test_gac_bootstrap_layers.py -q
      - name: gate parallel-classification census gate
        # 钉 gac-local-gate 的并行/串行分类账完备性: 新增 gate 未进任何一本账即红
        # (漏登记写类 gate 会让它静默继承「默认并行」⇒ 并发读写同一份工作区)。
        # tests/unit/** 不在任何 CI 白名单里; pitfalls-index (#5286) 漏登记本账,
        # 在 main 上静默了 8 天 (2026-11-12 实测 98 vs 97)。实测 7 pass。
        run: python3 -m pytest tests/unit/gac/test_gac_local_gate_parallel.py -q
      - name: governance orchestrator path-resolution gate
        # 钉 governance-orchestrator 的 REPO 是检出根、且模块里每条 REPO / '<file>'
        # 都解析到真实文件。2026-11-12 前 REPO 是 parents[1] (= <root>/bin), 于是
        # compliance_check 的 interface_check 恒 false (路径全错一层 + 工具名写错)。
        # 实测 3 pass; 把 REPO 改回 parents[1] ⇒ 2 条当场红。
        run: python3 -m pytest tests/unit/gac/test_governance_orchestrator_paths.py -q
      - name: Run full governance verification
        run: make governance-verify
      - name: Submodule pointer drift check
        run: |
          # Normal PRs/main pushes reject ahead/diverged pointers. Reachable
          # behind pointers remain a supply signal handled by the auto-bump PR.
          pointer_out="$RUNNER_TEMP/submodule-pointer-drift.json"
          set +e
          python3 bin/gac/check-submodule-pointer-drift.py --json > "$pointer_out"
          pointer_rc=$?
          set -e
          cat "$pointer_out"
          if [[ "$pointer_rc" -ne 0 ]]; then
            echo "❌ submodule pointer divergence detected"
            exit 1
          fi
          if ! jq -e '
            .results | type == "array" and all(.[];
              type == "object" and (
                .status == "aligned" or
                .status == "behind" or
                .status == "ahead" or
                .status == "DIVERGED" or
                .status == "unverifiable" or
                .status == "skip"
              )
            )
          ' "$pointer_out" > /dev/null; then
            echo "❌ malformed submodule pointer report"
            exit 1
          fi
          # NOTE: "ahead" is intentionally non-blocking (script reports it as OK).
          # The reachability gate (gac-gate) separately ensures the commit is on a
          # pushed origin branch. Removing the extra jq guard that contradicted
          # the script's own non-blocking designation for "ahead".
      - name: Submodule pointer strict auto-bump gate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/submodule-bump-')
        run: |
          # A PR whose only purpose is freshness must close every reachable
          # behind pointer; unlike normal delivery PRs, warnings are blocking.
          python3 bin/gac/check-submodule-pointer-drift.py --strict || {
            echo "❌ submodule pointer freshness drift detected"
            exit 1
          }
      - name: Document governance
        run: python3 bin/ssot/doc-governance-check.py --no-new-warnings
      - name: Emit failure signal on break
        if: failure()
        continue-on-error: true
        env:
          FAILURE_LOG: ${{ runner.temp }}/omo-events.jsonl
          FAILURE_REF: ${{ github.ref }}
          FAILURE_SHA: ${{ github.sha }}
          FAILURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": os.environ["FAILURE_REF"],
              "sha": os.environ["FAILURE_SHA"],
              "run_url": os.environ["FAILURE_RUN_URL"],
          }, separators=(",", ":")))
          PY
          )"
          signal_status=0
          uv run --project projects/omo python -m omo.cli event emit \
            --type governance_verify_failed \
            --source ci/governance-check.yml \
            --payload "$payload" \
            --log "$FAILURE_LOG" || signal_status=$?
          {
            echo "## Governance verification failure signal"
            echo "- ref: \`$FAILURE_REF\`"
            echo "- sha: \`$FAILURE_SHA\`"
            echo "- run: $FAILURE_RUN_URL"
            echo "- emitter exit: \`$signal_status\`"
            echo "- artifact: \`governance-verify-failure-signal-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$signal_status"

      - name: Upload governance failure signal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governance-verify-failure-signal-${{ github.run_id }}
          path: ${{ runner.temp }}/omo-events.jsonl
          if-no-files-found: warn
          retention-days: 14
