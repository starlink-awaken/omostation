name: Governance Check
on:
  push:
    paths:
      - ".github/workflows/governance-check.yml"
      - ".pre-commit-config.yaml"
      - ".omo/**"
      - "docs/OPC-*.md"
      - "docs/**"
      - "bin/ssot/doc-governance-check.py"
      - ".omo/_truth/registry/document-governance.yaml"
      - ".omo/standards/document-governance-standard.md"
      - "projects/*/pyproject.toml"
      - "projects/*/src/**"
      - "projects/omo/tests/**"
      - "projects/ecos/scripts/contract_gatekeeper.py"
      - "scripts/check-*.py"
      - "scripts/opc_*.py"
      - "bin/ssot/workspace-audit"
      - "CLAUDE.md"
      - "LAYER-INDEX.md"
  pull_request:
    paths:
      - ".github/workflows/governance-check.yml"
      - ".pre-commit-config.yaml"
      - ".omo/**"
      - "docs/OPC-*.md"
      - "docs/**"
      - "bin/ssot/doc-governance-check.py"
      - ".omo/_truth/registry/document-governance.yaml"
      - ".omo/standards/document-governance-standard.md"
      - "projects/*/pyproject.toml"
      - "projects/*/src/**"
      - "projects/omo/tests/**"
      - "projects/ecos/scripts/contract_gatekeeper.py"
      - "scripts/check-*.py"
      - "scripts/opc_*.py"
      - "bin/ssot/workspace-audit"
      - "CLAUDE.md"
      - "LAYER-INDEX.md"
  schedule:
    - cron: "0 */6 * * *"  # 每6小时自动运行，确保SSOT长期绿色

jobs:
  interface-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Run governance checks
        run: |
          # ADR-0379 E-2: registry-driven — 检查清单来自 ci-surfaces.yaml (workflow=governance-check.yml),
          # 取代旧 21 行 FAILED=1 bash 循环 (P77 silent-fail 根因: 无 per-check 报告/无登记契约).
          # 新增/移除 doc check 只改 .omo/_truth/registry/ci-surfaces.yaml (CR-CI-SURFACE-SSOT).
          FAILED=0
          python3 bin/gac/ci-check-runner.py --workflow governance-check.yml || FAILED=1
          python3 bin/gac/check-submodule-rewind.py --json > /tmp/rewind-report.json || FAILED=1
          python3 -c "import json,sys; d=json.load(open('/tmp/rewind-report.json')); v=d.get('violations',[]); w=d.get('warns',[]); print(f'rewind violations={len(v)}, warns={len(w)}'); sys.exit(1 if v else 0)" || FAILED=1
          cd projects/omo
          uv sync --quiet   # 显式 sync (确保 pydantic 等依赖装好)
          uv run python -m omo.cli governance surfaces --workspace-root ../.. --json > /tmp/omo-governance-surfaces.json || { echo "=== governance surfaces FAIL, output: ==="; cat /tmp/omo-governance-surfaces.json 2>/dev/null; FAILED=1; }
          uv run python -m omo.cli lint direct-omo-io || FAILED=1
          uv run python -m omo.cli lint sensitive-governed-writes || FAILED=1
          uv run python -m omo.cli lint schemas || FAILED=1
          uv run python -m omo.cli lint yaml-bypass || FAILED=1
          uv run python -m omo.cli lint ingress-registry --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint mutation-surfaces --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint internal-write-profiles --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint state-plane-assets --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint c2g-omo-boundary --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint ingress-artifacts --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint mutation-ledger --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint doc-lifecycle --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint self-evolution-approval --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint task-policy --all --workspace-root ../.. || FAILED=1
          uv run python -m omo.cli lint god-module --workspace-root ../.. || echo "⚠️ god-module warnings (non-blocking)"
          uv run pytest \
            tests/test_omo_ingress.py \
            tests/test_omo_gc.py \
            tests/test_omo_governance.py \
            tests/test_omo_governance_surfaces.py \
            tests/test_omo_direct_io_gate.py \
            tests/test_omo_task_policy.py \
            tests/test_opc_p5_p7_runtime.py \
            ../../tests/test_agent_workflow.py \
            -q || FAILED=1
          if [ $FAILED -ne 0 ]; then
            echo "❌ One or more governance checks failed."
            exit 1
          fi

      - name: MOF security scan
        run: |
          bin/mof/mof-scan || echo "⚠️ Security scan found issues (non-blocking)"

      - name: Agent 准入检查 (metaos admit)
        run: |
          cd projects/metaos
          uv run metaos admit --domain ci --role generator --values "safety,transparency" --otlp --audit-id "ci-${{ github.sha }}" || echo "⚠️ Agent admit check (non-blocking, informational)"

  doc-freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Check documentation freshness
        run: |
          # ADR-0379 E-2: check-interfaces 已由独立 workflow interfaces-enforce.yml 覆盖, 移除冗余
          python3 bin/ssot/doc-governance-check.py --scope workspace --no-new-warnings --json

  governance-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Python gate deps
        run: pip install pyyaml pydantic pytest
      - name: Run full governance verification
        run: make governance-verify
      - name: GaC local gate
        run: python3 bin/gac/gac-local-gate.py
      - name: Document governance
        run: python3 bin/ssot/doc-governance-check.py --no-new-warnings
      - name: Emit failure signal on break
        if: failure()
        run: |
          uv run --package omo python -m omo.cli event emit \
            --type governance_verify_failed \
            --source ci/governance-check.yml \
            --payload '{"ref":"${{ github.ref }}","sha":"${{ github.sha }}","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            --workspace-root .
          echo "❌ governance-verify failed; signal emitted"
