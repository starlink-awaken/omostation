name: Submodule Auto-Update
# Auto-detect and fix submodule pointer drift on push to main.
# Complements submodule-autobump.yml (scheduled) with event-driven detection.
#
# Flow:
#   1. Detect drift using lib.submodule_auto
#   2. If drift found, auto-update pointers
#   3. Run CI verification
#   4. Create PR if changes were made

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.gitmodules'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Treat behind (stale) as drift'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry-run only (no PR created)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect submodule drift
        id: detect
        run: |
          set +e
          python3 bin/gac/submodule-auto-check.py --json > /tmp/drift-report.json 2>&1
          rc=$?
          set -e

          if [ $rc -eq 0 ]; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            echo "No submodule drift detected."
          else
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            echo "Submodule drift detected!"
            cat /tmp/drift-report.json
          fi

      - name: Auto-update submodule pointers
        if: steps.detect.outputs.has_drift == 'true'
        id: update
        run: |
          STRICT_FLAG=""
          if [ "${{ inputs.strict }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi

          set +e
          python3 bin/gac/submodule-auto-check.py --fix --apply $STRICT_FLAG --json > /tmp/update-report.json 2>&1
          rc=$?
          set -e

          echo "update_exit=$rc" >> "$GITHUB_OUTPUT"

          # Check if any updates were made
          updated=$(python3 -c "import json; r=json.load(open('/tmp/update-report.json')); print(r.get('updated', 0))")
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

          if [ "$updated" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          cat /tmp/update-report.json

      - name: Verify pointer integrity
        if: steps.update.outputs.has_changes == 'true'
        run: |
          python3 bin/gac/submodule-auto-check.py --integrity --json
          echo "Integrity check passed."

      - name: Run CI verification
        if: steps.update.outputs.has_changes == 'true'
        run: |
          # Run the submodule reachability gate
          python3 bin/ssot/submodule-reachability-gate.py --source worktree --require-main || {
            echo "::error::Submodule reachability gate failed after auto-update"
            exit 1
          }

      - name: Create PR
        if: steps.update.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="auto/submodule-auto-update-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: auto-update submodule pointers to latest main" -m "Auto-detected and fixed submodule pointer drift. Updated ${{ steps.update.outputs.updated }} submodule pointer(s). Triggered by: ${{ github.event_name }}"

          git push origin "$BRANCH"

          PR_BODY="## Auto-Submodule Update\n\n"
          PR_BODY+="This PR was auto-generated by the Submodule Auto-Update workflow.\n\n"
          PR_BODY+="### What happened\n"
          PR_BODY+="- Submodule pointer drift was detected on push to main\n"
          PR_BODY+="- ${{ steps.update.outputs.updated }} submodule pointer(s) were auto-updated\n"
          PR_BODY+="- Integrity verification passed\n"
          PR_BODY+="- CI reachability gate passed\n\n"
          PR_BODY+="### Details\n"
          PR_BODY+="- Trigger: \`${{ github.event_name }}\`\n"
          PR_BODY+="- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
          PR_BODY+="- Strict mode: ${{ inputs.strict || 'false' }}\n\n"
          PR_BODY+="### Verification\n"
          PR_BODY+="- [x] Pointer integrity check passed\n"
          PR_BODY+="- [x] Submodule reachability gate passed\n"
          PR_BODY+="- [ ] CI checks pass (automated)"

          gh pr create \
            --title "chore: auto-update submodule pointers (drift detected)" \
            --body "$(echo -e "$PR_BODY")" \
            --base main \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Report status
        if: always()
        run: |
          echo "## Submodule Auto-Update Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drift detected: ${{ steps.detect.outputs.has_drift || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updates applied: ${{ steps.update.outputs.updated || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Has changes: ${{ steps.update.outputs.has_changes || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry-run: ${{ inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
