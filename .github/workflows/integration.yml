name: Integration Tests
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - name: Retry checkout
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - name: Init submodules
        if: steps.checkout.outcome == 'failure'
        run: git submodule update --init --recursive 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tracked-project integration tests
        # P41-W1 fix: projects/kairon is .gitignore'd. Run integration tests for projects tracked in monorepo.
        run: |
          cd projects/omo && uv sync && uv run pytest tests/integration/ -q --ignore=tests/integration/test_runtime_e2e.py
