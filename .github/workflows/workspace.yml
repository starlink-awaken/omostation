name: Workspace CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        # PASW: 子模块 checkout 失败必须 fail fast — 指针不可达说明 bump-pointer 前未 push 子模块
      - name: PASW — 自动同步子模块指针
        run: bash bin/ssot/sync-submodule-pointers.sh 2>&1 || true
      - name: PASW — 子模块指针可达性前置检查
        run: python3 bin/ssot/submodule-reachability-gate.py --source head --fetch 2>&1
        continue-on-error: false
