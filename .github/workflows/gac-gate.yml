name: gac-gate
# GaC 治理即代码 gate.
# PR: 始终 strict（合并前彻底验）。
# push main: 始终跑（防「非 governance 路径合入后 tip 不重跑」假绿）。
# push 其它分支: 仍用 paths 限流，避免 feature 分支每次 push 全套。
on:
  push:
    branches:
      - main
    # non-main feature branches keep path filter via separate workflow path below
  pull_request:
  workflow_dispatch:
  # feature branch path-filtered runs (not main)
  # implemented as additional push without branch filter + job if:
  # keep simple: always on main + all PRs is enough for protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true


jobs:
  gac-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Speed up submodule fetch (parallel)
        # actions/checkout 跑的是 `git -c protocol.version=2 submodule update --init --force
        # --depth=1 --recursive` —— **不带 --jobs**，于是 16 个子模块**串行**抓取
        # （CI 日志时间戳实证：`submodule sync` → `foreach gc.auto` 间隔 9.8~21.1s，
        #  而根部 fetch 只需 ~2.3s ⇒ checkout 的耗时几乎全是这段）。
        # `submodule.fetchJobs` 就是给这条命令用的开关，必须在 checkout **之前**写入
        # global config（该步不需要仓库已存在）。末行回显，便于日志直接核对是否生效。
        run: |
          git config --global submodule.fetchJobs 8
          echo "submodule.fetchJobs=$(git config --global --get submodule.fetchJobs)"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        # PASW: 子模块 checkout 失败必须 fail fast — 指针不可达说明 bump-pointer 前未 push 子模块
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # E2-B (2026-09-28): uv 前移并开官方缓存。
      # 原先这里有一步 `actions/cache` on ~/.cache/uv —— **对 uv 无效**: setup-uv 会把
      # UV_CACHE_DIR 指到 $RUNNER_TEMP/setup-uv-cache (作业日志 env 实证), 那个目录才是
      # uv 真正读写的位置; 缓存 ~/.cache/uv 永远是空命中。改用 setup-uv 自带 enable-cache。
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: install pyyaml and pytest
        # pytest 供 `test-collection` 守卫 (bin/gac/check-test-collection.py) 使用 ——
        # 它只 `--collect-only` 验证每个测试文件可 import, 防孤儿测试腐烂。
        # 该守卫在无 pytest 时优雅跳过 (env_skip), 但 CI 应让其真正生效。
        # 走 uv (命中上面的缓存) 而不是 pip: 免去每次作业重新下载/解析。
        # `--break-system-packages` 是给「解释器带 EXTERNALLY-MANAGED 标记」的保险
        # (本机 Homebrew Python 实测会撞 PEP 668); runner 上该标记通常不存在, 无标记时此参数为空操作。
        run: uv pip install --system --break-system-packages pyyaml pytest
      - name: CR-L4-DOCUMENTS-MIGRATION-COVERAGE — Documents 迁移 registry 覆盖
        run: python3 bin/gac/documents-content-plane-migration-check.py --json
      - name: CR-PR-DESCRIPTION-NON-EMPTY — PR 描述非空校验
        # PR 描述必须包含变更动机与验证说明, 防空 PR body
        run: python3 bin/gac/check-pr-description.py
      - name: CR-RUFF-SCOPE-STABLE — Ruff scope 稳定校验
        # 防止 X-Plane 项目改变 ruff scope 导致 lint 面漂移
        run: python3 bin/gac/check-ruff-scope-stable.py
      - name: CR-P76-7-1-LLM-ADVISORY-ONLY — LLM auto-apply 检查
        # LLM 只 generate suggestion, 永不 auto-apply
        run: python3 bin/gac/check-llm-advisory-only.py
      - name: CR-P76-8-1-SUBMODULE-PR-INDEPENDENT — 子模块 PR 独立性检查
        # 跨仓 PR 独立提交, 不在主仓 commit submodule 内容
        run: python3 bin/gac/check-submodule-pr-independent.py
      - name: CR-X4-SUBMODULE-POINTER-INTEGRITY — 子模块指针完整性检查
        # 子模块指针必须与远程同步, 禁止超前指针
        run: python3 bin/gac/check-submodule-pointer-integrity.py
      - name: CR-X4-MEMORY-OS-SURFACE-INTEGRITY — Memory OS light gate
        # SSOT/ports/env/help catalog surfaces; blocking (no Neo4j required)
        run: python3 bin/gac/check-memory-os-surfaces.py
      - name: Cache cockpit venv (Memory OS SSOT tests)
        # E2 第二批: cockpit 的 uv.lock 是生成物 (被 .gitignore 忽略) ⇒ CI 每次都要重新解析
        # 依赖 + 建 venv (实测 11~14s)。缓存 venv+lock, key 用受跟踪的 pyproject.toml 指纹,
        # 还原后 `uv sync` 命中即 0.1s (本机实测)。
        uses: actions/cache@v4
        with:
          path: |
            projects/cockpit/.venv
            projects/cockpit/uv.lock
          key: cockpit-venv-${{ runner.os }}-${{ hashFiles('projects/cockpit/pyproject.toml') }}
          restore-keys: |
            cockpit-venv-${{ runner.os }}-
      - name: Memory OS catalog SSOT tests (cockpit help/discover)
        # help_map catalog ⊆ CLI parsers; discover shares help_map (no Neo4j)
        # uv 已在作业开头 setup (E2-B), 此处不再重复 setup。
        run: |
          if [[ -d projects/cockpit/src/cockpit/tests ]]; then
            cd projects/cockpit
            uv sync --quiet
            uv run pytest src/cockpit/tests/test_help_discover_ssot.py src/cockpit/tests/test_status_memory_os_line.py -q
          else
            echo "SKIP cockpit submodule tests absent"
          fi
      - name: CR-X2-GAC-DRIFT — GaC drift 自检 (注册表 vs 实际执行)
        run: python3 bin/gac/gac-drift.py
      - name: CR-L0-ENFORCE — L0 协议约束 CI 校验 (required)
        # 校验 X1-C01/CS-10/X2-C01/X2-C03/X4-C01, 任一 FAIL 则 CI 红
        run: python3 bin/gac/check-l0-constraints.py
      # ── Phase 8: Harness 全生命周期合规 (ADR-0444) ──
      - name: CR-HARNESS-SECTION — Harness 12 章节完整性 (required)
        # harness-policy.yaml 必须包含 12 必现章节 + SFOP S 槽位唯一
        run: python3 bin/gac/harness-compliance-check.py --gate
      - name: CR-HARNESS-MOF — MOF 约束联动检查 (required)
        # 8 条 Agent-MOF 规则接入 Harness 全生命周期
        run: python3 bin/gac/harness-mof-bridge.py --state
      - name: shell 测试套件 (tests/**/*.sh)
        # 原本**没有任何执行入口** —— CI 不跑、pytest 不收集、Makefile 不调 ⇒ 回归保护为零
        # (2026-09-29 实测: 4 个已烂掉却长期无人知)。
        # 纳入/排除规则见 tests/run-shell-suites.sh 与 tests/shell-suites.exclude
        # (新测试默认自动纳入; 排除项须写原因, 且 runner 会校验名单不腐烂)。
        # 放 required job 里且**阻塞**: 红测试就该拦住合并; 本套件实测 ~25s。
        # 位置刻意留在 immutable sandwich 之外 (它不写工作树, 但也不必进那条不变量).
        run: bash tests/run-shell-suites.sh
      - name: immutable checkout precondition
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - name: PASW — 子模块指针可达性前置检查
        run: python3 bin/ssot/submodule-reachability-gate.py --source head --fetch
        continue-on-error: false
      - name: generated projection drift checks
        run: |
          python3 bin/mof/project-layer-index.py --check
          python3 bin/gac/gac-drift.py
      - name: check-layers (跨层依赖检查)
        run: python3 bin/layer-dependency-check.py
      # ADR-0456 B5 (BET-Y2Q4-T10-235) — .omo/state/system.yaml 已摘库, 干净检出里没有这份生成态,
      # 而下面 strict gate 的两个消费者按存在性判定 (doc-link-check 的 16 处 `[system.yaml](…)` 链接、
      # current-state-coherence 的输入)。先由创建者从已提交真源物化一次, 判据语义一律不动。
      # CI 未声明 OMOSTATION_STATE_ROOT ⇒ state_root()==code_root(), 落点是 .gitignore:297 忽略的路径,
      # 所以 immutable postcondition (git status --porcelain 为空) 不受影响。
      - name: Materialize generated state input for the strict gate
        run: python3 bin/gac/materialize-system-state.py --json
      - name: gac-local-gate (strict)
        # H1a: the strict full-workspace gate is merge-blocking after the R1 canary.
        env:
          # 4019+ waiver 机制: env GITHUB_PR_NUMBER 命中 .omo/_truth/governance-evidence/waiver-*.md
          # frontmatter 的 pr_numbers 列表时, check-governance-ratio 单次 merge bypass.
          GITHUB_PR_NUMBER: \${{ github.event.pull_request.number }}
        run: python3 bin/gac/gac-local-gate.py --strict
      - name: immutable checkout postcondition
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - name: worktree guard (数量上限门禁)
        # P74: 防 worktree 堆积 — 超 MAX_WORKTREES 即 fail, 触发人工清理
        run: bash bin/gac/gac-worktree-guard.sh --check
        continue-on-error: false

  # ── E2 第二批 (2026-09-28): advisory 步骤搬到并行 job ─────────────────────
  # 这 28 步本来就 `continue-on-error: true`（**不阻塞合并**），却串行占着核心 job 的
  # 临界路径（实测 8~13s）。搬到独立 job 后与 gac-gate 并行，合入等待时间不再包含它们。
  #
  # 关键不变量: **任何阻塞步骤都不得离开 `gac-gate`** —— 否则 required check 形同虚设。
  # 由 tests/test_gac_gate_workflow_purity.py::
  #   test_no_blocking_step_lives_outside_the_required_gate_job 钉住。
  gac-gate-aux:
    runs-on: ubuntu-latest
    steps:
      - name: Speed up submodule fetch (parallel)
        # actions/checkout 跑的是 `git -c protocol.version=2 submodule update --init --force
        # --depth=1 --recursive` —— **不带 --jobs**，于是 16 个子模块**串行**抓取
        # （CI 日志时间戳实证：`submodule sync` → `foreach gc.auto` 间隔 9.8~21.1s，
        #  而根部 fetch 只需 ~2.3s ⇒ checkout 的耗时几乎全是这段）。
        # `submodule.fetchJobs` 就是给这条命令用的开关，必须在 checkout **之前**写入
        # global config（该步不需要仓库已存在）。末行回显，便于日志直接核对是否生效。
        run: |
          git config --global submodule.fetchJobs 8
          echo "submodule.fetchJobs=$(git config --global --get submodule.fetchJobs)"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        # PASW: 子模块 checkout 失败必须 fail fast — 指针不可达说明 bump-pointer 前未 push 子模块
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # E2-B (2026-09-28): uv 前移并开官方缓存。
      # 原先这里有一步 `actions/cache` on ~/.cache/uv —— **对 uv 无效**: setup-uv 会把
      # UV_CACHE_DIR 指到 $RUNNER_TEMP/setup-uv-cache (作业日志 env 实证), 那个目录才是
      # uv 真正读写的位置; 缓存 ~/.cache/uv 永远是空命中。改用 setup-uv 自带 enable-cache。
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: install pyyaml and pytest
        # pytest 供 `test-collection` 守卫 (bin/gac/check-test-collection.py) 使用 ——
        # 它只 `--collect-only` 验证每个测试文件可 import, 防孤儿测试腐烂。
        # 该守卫在无 pytest 时优雅跳过 (env_skip), 但 CI 应让其真正生效。
        # 走 uv (命中上面的缓存) 而不是 pip: 免去每次作业重新下载/解析。
        # `--break-system-packages` 是给「解释器带 EXTERNALLY-MANAGED 标记」的保险
        # (本机 Homebrew Python 实测会撞 PEP 668); runner 上该标记通常不存在, 无标记时此参数为空操作。
        run: uv pip install --system --break-system-packages pyyaml pytest
      - name: CR-PRINCIPLE-ENFORCEMENT — 原则执行化校验 (advisory)
        # 验证工程原则是否被工具/流程执行, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-principle-enforcement.py
      - name: CR-P76-9A-4-HEURISTIC-DEFAULT — LLM fallback 检查 (advisory)
        # 本地工具应有 --no-llm 或 heuristic fallback, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-heuristic-default.py
      - name: CR-P76-7-2-TIER-GRACEFUL-FALLBACK — LLM 3-tier fallback 检查 (advisory)
        # LLM provider 3-tier — aetherforge → ollama → heuristic, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-llm-tier-fallback.py
      - name: CR-P76-7-5-RESOLVE-NOT-STUB — 物理实现不占位检查 (advisory)
        # 物理未实现的 placeholder 必须决议, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-resolve-not-stub.py
      - name: CR-P76-8-3-DEAD-PATH-TOOL-FALLBACK — 工具双路 fallback 检查 (advisory)
        # 工具检查应该 first-level + projects/*/first-level 双路 fallback, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-dead-path-tool-fallback.py
      - name: CR-P76-8-4-INCREMENTAL-COMMIT — 增量提交检查 (advisory)
        # 每 sub-task 完成立即 commit, 防 X-Plane clean worktree 丢失工作, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-incremental-commit.py
      - name: CR-X4-MESH-EXECUTOR-RELIABILITY — Mesh executor 可靠性检查 (advisory)
        # mesh executor 脚本必须有超时控制、错误处理、日志记录, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-mesh-executor-reliability.py
      - name: CR-X1-EXTERNAL-AGENT-AUDIT — 外部 agent 审计检查 (advisory)
        # 外部 agent 接入必须注册 MCP 入口 + 审计链, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-external-agent-audit.py
      - name: CR-X4-SWEEP-TOOL-INTEGRITY — Sweep 工具完整性检查 (advisory)
        # sweep 工具链必须有测试覆盖和 CI 集成, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-sweep-tool-integrity.py
      - name: CR-X4-MESH-ROUTING-CONSISTENCY — Mesh 路由一致性检查 (advisory)
        # mesh 路由必须遵循 BOS URI 标准, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-mesh-routing-consistency.py
      - name: CR-X2-PROJECT-HEALTH-FRESHNESS — 项目健康分新鲜度检查 (advisory)
        # 项目健康分必须定期更新, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-project-health-freshness.py
      - name: CR-X3-DELIVERY-VALUE-GATE — 交付 X3 价值门禁检查 (advisory)
        # 交付文件必须有 X3 价值标注, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-delivery-value-gate.py
      - name: CR-X3-DELIVERY-CADENCE — PR 交付节奏检查 (advisory)
        # PR 交付节奏是 X3 价值流指标, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-delivery-cadence.py
      - name: CR-P77-3-2-PREFIX-PATTERN — URI 前缀模式检查 (advisory)
        # URI 末尾 / 表 routing prefix, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-uri-prefix-pattern.py
      - name: CR-P77-6-2-TIER-FALLBACK-TEST — 层级 fallback 测试检查 (advisory)
        # 每级 fallback 必须有测试, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-fallback-test-coverage.py
      - name: CR-P79-4-CATALOG-HEALTH-METRIC — Catalog 健康指标检查 (advisory)
        # GaC 规则数作为可观测指标, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-catalog-health.py
      - name: CR-X-META-HEALTH — GaC 治理系统自检 (advisory)
        # 治理系统自身健康度: 规则数 ≤ freeze, 无重复 ID, 无过期 draft
        continue-on-error: true
        run: python3 bin/gac/check-meta-health.py
      - name: CR-M4-HEALTH-SCORE — M4 Health Score 量化 (advisory)
        continue-on-error: true
        run: python3 bin/mof/m4-health-score.py --json
      - name: CR-HARNESS-OMO — OMO 状态同步检查 (advisory)
        # Harness 运行状态同步到 OMO system.yaml, 非阻塞
        continue-on-error: true
        run: python3 bin/gac/harness-omo-bridge.py
      - name: CR-HARNESS-ENFORCE — 统一约束与驱动 (advisory)
        # 整合 4 引擎 (arch + compliance + mof + omo), CI 模式
        continue-on-error: true
        run: python3 bin/gac/harness-constraint-enforcer.py --ci
      - name: CR-P76-7-4-EVIDENCE-HONEST-CLOSURE — 任务关闭需真证据 (advisory)
        continue-on-error: true
        run: python3 bin/gac/check-evidence-honest-closure.py
      - name: CR-P77-6-3-GATEWAY-STATUS-DOC — Gateway 状态文档化 (advisory)
        continue-on-error: true
        run: python3 bin/gac/check-gateway-status-doc.py
      - name: CR-P79-3-FOUNDRY-DECK — 治理轴 Foundry Deck (advisory)
        continue-on-error: true
        run: python3 bin/gac/check-foundry-deck-coverage.py
      - name: CR-X2-EVIDENCE-FRESHNESS — 证据新鲜度检查 (advisory)
        continue-on-error: true
        run: |
          if compgen -G '.omo/_delivery/evidence-smoke/*.json' > /dev/null; then
            python3 bin/gac/check-evidence-freshness.py --json
          else
            echo "SKIP evidence freshness: no immutable report in checkout"
          fi
      - name: CR-X2-GOVERNANCE-TREND — 治理指标趋势检查 (advisory)
        continue-on-error: true
        run: python3 bin/gac/check-governance-trend.py
      - name: CR-X2-DOC-FRESHNESS-GATE — 文档新鲜度门禁检查 (advisory)
        # 检查 docs/ 下 md 文件是否在 90 天内更新过, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-doc-freshness-gate.py
      - name: CR-X2-METRIC-TREND — 治理指标趋势检查 (advisory)
        # 检查 governance-evolution 指标趋势, 确认关键指标未恶化, 非阻塞 advisory
        continue-on-error: true
        run: python3 bin/gac/check-metric-trend.py
      - name: mof-check (L0 约束对齐验证, advisory)
        # MOF 全量检查: gate + validate + audit + enforce
        # 非阻塞: 周度 mof-update.yml 已覆盖, 这里作为日常快速探测
        continue-on-error: true
        working-directory: projects/ecos
        run: |
          uv run mof check 2>&1 | tail -20
