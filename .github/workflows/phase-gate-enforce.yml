name: phase-gate-enforce
# ADR-0223: hard-block PRs that touch locked phase paths without unlock verdict.
# Minimal deps (stdlib + PyYAML) — no m1-closeout-report import (anti self-blind, ADR-0202 D1).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  documents-changes:
    name: documents-changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect Documents owner-job changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          required=false
          while IFS= read -r path; do
            case "${path}" in
              .omo/_truth/registry/documents-domain-projects.yaml|\
              bin/gac/documents-claude-desktop-config.py|\
              bin/gac/documents-codex-profile.py|\
              bin/gac/documents-zed-profile.py|\
              bin/gac/documents-zcode-config.py|\
              bin/gac/documents-chatgpt-tunnel.py|\
              bin/gac/documents-domain-index.py|\
              bin/gac/documents-domain-project-check.py|\
              bin/gac/documents-domain-owner-job.py|\
              bin/gac/documents_domain_jobs.py|\
              tests/test_documents_claude_desktop_config.py|\
              tests/test_documents_codex_profile.py|\
              tests/test_documents_zed_profile.py|\
              tests/test_documents_zcode_config.py|\
              tests/test_documents_chatgpt_tunnel.py|\
              tests/test_documents_domain_index.py|\
              tests/test_documents_domain_project_check.py|\
              tests/test_documents_domain_owner_job.py|\
              projects/cockpit|\
              projects/l4-kernel|\
              projects/runtime|\
              .github/workflows/phase-gate-enforce.yml)
                required=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" HEAD)
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

  documents-domain-projects:
    name: Documents domain projects
    needs: documents-changes
    if: needs.documents-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required owners
        run: git submodule update --init projects/l4-kernel projects/runtime
      - uses: astral-sh/setup-uv@v4
      - name: Focused tests
        run: >-
          uv run --with pytest --with pyyaml python -m pytest
          tests/test_documents_claude_desktop_config.py
          tests/test_documents_codex_profile.py
          tests/test_documents_zed_profile.py
          tests/test_documents_zcode_config.py
          tests/test_documents_chatgpt_tunnel.py
          tests/test_documents_domain_index.py
          tests/test_documents_domain_project_check.py
          tests/test_documents_domain_owner_job.py -q
      - name: Ruff
        run: >-
          uv run --with ruff ruff check
          bin/gac/documents-domain-project-check.py
          bin/gac/documents-claude-desktop-config.py
          bin/gac/documents-codex-profile.py
          bin/gac/documents-zed-profile.py
          bin/gac/documents-zcode-config.py
          bin/gac/documents-chatgpt-tunnel.py
          bin/gac/documents-domain-index.py
          bin/gac/documents-domain-owner-job.py
          bin/gac/documents_domain_jobs.py
          tests/test_documents_domain_project_check.py
          tests/test_documents_claude_desktop_config.py
          tests/test_documents_codex_profile.py
          tests/test_documents_zed_profile.py
          tests/test_documents_zcode_config.py
          tests/test_documents_chatgpt_tunnel.py
          tests/test_documents_domain_index.py
          tests/test_documents_domain_owner_job.py

  phase-gate:
    name: phase-gate
    needs: [documents-changes, documents-domain-projects]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Documents owner-job gate when affected
        env:
          CHANGE_RESULT: ${{ needs.documents-changes.result }}
          DOCUMENTS_REQUIRED: ${{ needs.documents-changes.outputs.required }}
          DOCUMENTS_RESULT: ${{ needs.documents-domain-projects.result }}
        run: |
          set -euo pipefail
          test "${CHANGE_RESULT}" = "success"
          if [ "${DOCUMENTS_REQUIRED}" = "true" ]; then
            test "${DOCUMENTS_RESULT}" = "success"
          else
            test "${DOCUMENTS_RESULT}" = "skipped"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML only
        run: pip install --quiet pyyaml
      - name: Phase gate check (ADR-0223 + ADR-0225 caliber)
        env:
          PHASE_ESCAPE_ID: ${{ vars.PHASE_ESCAPE_ID }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE}" ]; then
            BASE="origin/${{ github.base_ref || 'main' }}"
          fi
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          # Path unlock (ADR-0223) + metrics caliber (ADR-0225):
          # measure_all is in-process sim; must not claim physical G-DEL.1/3 pass.
          python3 bin/delivery/measure_all.py > /tmp/g-del-measure.json
          python3 bin/gac/phase-gate-check.py \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --metrics /tmp/g-del-measure.json \
            --json
