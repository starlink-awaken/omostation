name: omlxc CI (Compute Fabric & Data Plane)

on:
  push:
    branches: [main]
    paths:
      - 'projects/omlxc/**'
      - '.github/workflows/omlxc-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/omlxc/**'
      - '.github/workflows/omlxc-ci.yml'

jobs:
  lint-and-typecheck:
    name: Lint & Pyright Strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "projects/omlxc/pyproject.toml"
      - name: Ruff check
        run: cd projects/omlxc && uv run ruff check .
      - name: Pyright strict
        run: cd projects/omlxc && uv run pyright

  unit-tests:
    name: Unit & Fabric Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "projects/omlxc/pyproject.toml"
      - name: Run pytest
        run: cd projects/omlxc && uv run pytest -q
      - name: Verify fabric smoke
        run: cd projects/omlxc && uv run omlxc fabric inspect --json
