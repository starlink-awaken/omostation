name: Architecture Check
on:
  pull_request:
    paths:
      - 'docs/scene-cards/**'
      - 'docs/journey-specs/**'
      - '.omo/standards/**'
      - 'bin/mof/**'
      - 'bin/ssot/**'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Initialize architecture check consumers
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$CROSS_REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" submodule update --init projects/ecos projects/cockpit projects/family-hub projects/aetherforge projects/omlxc projects/runtime projects/metaos
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install pyyaml
      # ADR-0456 B5 (BET-Y2Q4-T10-235) — core_documents.STATE.md 声明的就是这份已摘库的生成态;
      # --gate 的 ssot_index 存在性断言保持不变, 由创建者在检查之前把它供上。
      - name: Materialize generated state input for the architecture gate
        run: python3 bin/gac/materialize-system-state.py --json
      - name: Run architecture check
        run: python3 bin/gac/architecture-check.py --gate
