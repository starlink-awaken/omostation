name: Architecture Check
on:
  pull_request:
    paths:
      - 'docs/scene-cards/**'
      - 'docs/journey-specs/**'
      - '.omo/standards/**'
      - 'bin/mof/**'
      - 'bin/ssot/**'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run architecture check
        run: python3 bin/gac/architecture-check.py --gate
