# Dimension System Standard
# ============================
# 维度体系标准，定义系统所有度量维度及其指标。
#
# SSOT: .omo/standards/dimension-system.yaml
# Version: 2.0.0 | 2026-08-31

schema: dimension-system/v1

# 官方 12 维度定义 (5+4+1-1 中的 4 横切面 + 8 业务/运营)
dimensions:
  # ── 治理维度 (4) ──
  X1_audit:
    name: "审计/边界"
    description: "审计日志、边界控制、写入守护"
    metrics:
      - name: "audit_coverage"
        target: 100
        unit: "%"
      - name: "boundary_violations"
        target: 0
        unit: "count"

  X2_freshness:
    name: "保鲜/抗熵"
    description: "文档新鲜度、抗熵增"
    metrics:
      - name: "doc_freshness_score"
        target: 95
        unit: "%"
      - name: "stale_docs"
        target: 0
        unit: "count"

  X3_value:
    name: "价值/成本"
    description: "价值证明、成本归因"
    metrics:
      - name: "time_saved_minutes"
        target: 30
        unit: "min/task"
      - name: "decision_throughput"
        target: 80
        unit: "score"

  X4_consistency:
    name: "一致性/SSOT"
    description: "SSOT 一致性、收敛"
    metrics:
      - name: "ssot_drift_count"
        target: 0
        unit: "count"
      - name: "registry_sync_rate"
        target: 100
        unit: "%"

  # ── 业务维度 (5) ──
  D1_scene:
    name: "场景"
    description: "业务场景覆盖和活跃度"
    metrics:
      - name: "active_scenes"
        target: 50
        unit: "count"
      - name: "scene_trigger_rate"
        target: 50
        unit: "%"

  D2_function:
    name: "功能"
    description: "功能完整性和成熟度"
    metrics:
      - name: "maturity_score"
        target: 9.5
        unit: "/10"

  D3_journey:
    name: "旅程"
    description: "Journey 执行和完成率"
    metrics:
      - name: "journey_completion_rate"
        target: 80
        unit: "%"

  D4_experience:
    name: "体验"
    description: "用户体验和满意度"
    metrics:
      - name: "daemon_stability"
        target: 99
        unit: "%"

  D5_vision:
    name: "愿景"
    description: "战略愿景达成度"
    metrics:
      - name: "north_star_score"
        target: 88
        unit: "/100"

  # ── 运营维度 (3) ──
  D6_operations:
    name: "运营"
    description: "长期运营健康度"
    metrics:
      - name: "bet_completion_rate"
        target: 95
        unit: "%"

  D7_maintenance:
    name: "运维"
    description: "系统运维成熟度"
    metrics:
      - name: "probe_health_rate"
        target: 100
        unit: "%"

  D8_harness:
    name: "Harness"
    description: "自进化 Harness 治理 (防腐+约束+进化+信任)"
    metrics:
      - name: "harness_implementation_rate"
        target: 100
        unit: "%"
        description: "harness-policy 声明功能的实现比例"
      - name: "harness_event_coverage"
        target: 100
        unit: "%"
        description: "7 类探针事件的实际发射覆盖"
      - name: "dag_completion_rate"
        target: 95
        unit: "%"
        description: "8 阶段 DAG 成功完成率"
      - name: "surface_growth_net"
        target: 0
        unit: "count"
        description: "表面积净增长 (负值=减少)"
      - name: "rule_budget_compliance"
        target: 100
        unit: "%"
        description: "GaC 规则不超 85 条预算"

# 度量框架
measurement_framework:
  score_range: [0, 10]
  target_score: 9.5
  evidence_required: true
  trend_tracking: true

  levels:
    critical: "0-4"    # 需要立即处理
    warning: "4-7"     # 需要关注
    healthy: "7-9"     # 健康
    excellent: "9-10"  # 优秀
