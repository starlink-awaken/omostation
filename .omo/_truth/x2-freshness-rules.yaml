# X2 Freshness Rules — 抗熵与过期检测
#
# 定义哪些组件/项目需要 freshness 检查，以及过期后的处理动作。

documentation_contract:
  ssot_role: authoritative_freshness_source
  derived_consumers:
    - AGENTS.md
    - .omo/_truth/INDEX.md
    - .omo/standards/omo-governance-surfaces.md

rules:
  - rule_id: X2-FRESH-OMO-GOVERNANCE-SURFACES
    title: OMO 三层治理契约必须持续保鲜
    type: governance_surface_freshness
    status: active
    created: '2026-06-16'
    target: .omo/_truth/registry/omo-governance-surfaces.yaml
    freshness:
      mechanism: registry-review
      threshold_days: 14
      action: escalate
    owner: governance-team
    notes: >
      `.omo` 顶层资产、`projects/omo` 路径常量、`projects/c2g` 入口元数据
      只要任一发生显著变化，14 天内必须同步更新标准与注册表。

  - rule_id: X2-FRESH-EVIDENCE-ALIAS
    title: evidence 兼容别名必须持续收敛
    type: compatibility_alias_watch
    status: active
    created: '2026-06-17'
    target: .omo/evidence/
    freshness:
      mechanism: alias-backlog-review
      threshold_days: 30
      action: warn
    owner: governance-team
    notes: >
      `.omo/evidence/` 仅允许作为 `_delivery` 下真实证据目录的兼容别名存在；
      若 30 天内没有继续消化历史引用与迁移计划，需显式登记为治理债务。

  - rule_id: X2-FRESH-ARCHIVED-LLMGATEWAY
    title: llm-gateway 已归档，禁止产生新的活跃任务
    type: project_archive
    status: active
    created: '2026-06-16'
    target: projects/llm-gateway/
    freshness:
      mechanism: git-commit-staleness
      threshold_days: 90
      action: warn
    archived: true
    replacement:
      project: aetherforge
      entrypoint: packages/gateway/
    notes: >
      llm-gateway 代码已迁移至 aetherforge/packages/gateway/src/llm_gateway/_legacy/。
      仅允许消化 _legacy/ 中的能力，不允许在 projects/llm-gateway/ 新增功能。

  - rule_id: X2-FRESH-MERGE-CHECKLIST
    title: MERGE-CHECKLIST 必须按计划推进
    type: artifact_review
    status: active
    created: '2026-06-16'
    target: projects/aetherforge/packages/gateway/MERGE-CHECKLIST.md
    freshness:
      mechanism: manual-review
      threshold_days: 30
      action: escalate
    owner: architecture-team
    notes: >
      _legacy/ 中的能力需在 30 天内逐项消化或明确废弃。

  - rule_id: X2-FRESH-DEBT-EVIDENCE-INTEGRITY
    title: DEBT closure evidence 完整性 14 天巡检
    type: governance_loop_freshness
    status: active
    created: '2026-06-20'
    target: .omo/debt/items/D-*.yaml
    freshness:
      mechanism: governance-audit
      threshold_days: 14
      action: escalate
    owner: governance-team
    notes: >
      P43 闭环确立 debt closure 必带 resolution_evidence 的强制约束。
      P84 R2 修正: target 改为 D-*.yaml (历史 debt 用 D- 前缀, 非 DEBT-).
      `omo governance` 每 14 天自动审计: lifecycle_state=closed 的 debt
      必须有 ≥ 20 字符的 resolution_evidence；lifecycle_state=deferred 的 debt
      必须有 next_review_at + gate_level。审计失败触发 debt integrity score 扣分。
      巡检脚本: projects/omo/src/omo/omo_audit.py:governance_check_debt

      ⚠️ 2026-11-09 实测: 本条的 ❌ 是**结构性假警报**, 不是发现。三重错位 ——
        ① 上面声明的「每 14 天自动审计」**没有排程**: 它属于 .omo/cron/registry.yaml
           的 open_decisions D4 列出的 17 条 status: proposed 治理巡检任务之一
           (含 debt-refresh), D4 至今未决, 未启用为真实 crontab。launchd /
           crontab / .omo/cron/registry.yaml 三处都搜不到 omo governance audit。
        ② 本检查器 (bin/gac/x2-freshness-check.py) 对本条实际走的机制是
           `path_last_modified` —— 量的是 **target 文件的文件系统 mtime**,
           不是「审计上次跑是什么时候」。两者不是一回事。
        ③ 于是回退机制拿 8 份 D-*.yaml 的 mtime 当代理, 而这 8 份
           **全部是 lifecycle_state: resolved 的历史记录** (2026-09-27 之后无人编辑)。
           已关闭的债务当然不会被编辑 ⇒ 本条**永久**报 42d 超期。
        ④ 附带: notes 里「lifecycle_state=closed」与实际数据不符 —— 审计代码
           (omo_audit_checks.py:governance_check_debt_integrity) 早在 2026-09-19
           就已同时接受 resolved 与 closed, 只有这段 notes 没跟上。
        ⑤ 更根本的: `path_last_modified` 量的是**文件系统 mtime**, 而 mtime 取决于
           **什么时候 clone/checkout**, 与任何治理事件无关。实测同一条规则:
           在主检出 (2026-09-27 之后未动) 读成 42d ❌, 在一个当天新建的 worktree 里
           读成 0d ✓ —— 同一条规则、同一份 registry, 读数完全由检出时间决定。
           这类「环境依赖读数」正是本仓反复警告的假绿/假红来源。
      正确的 freshness 目标应是**审计产物** ~/runtime/audit/governance-audit.jsonl
      (omo_audit.py:_default_audit_file; 实测 2026-10-10 之后未再写入), 而不是债务条目本身。
      **在 D4 决出之前不要**把本条改判成「已巡检」— 那会让唯一还亮着的信号也灭掉。
      D4 若决定启用这批任务, 同步把 target 改为审计产物并确认审计会写它
      (run_governance_audit 当前不调用 record(), 需要一并接上线)。

  - rule_id: X2-FRESH-CROSS-PROJECT-LINT
    title: 全子项目 ruff 0 errors 7 天巡检
    type: governance_loop_freshness
    status: active
    created: '2026-06-20'
    target: projects/*/src/**/*.py
    freshness:
      mechanism: governance-audit
      threshold_days: 7
      action: escalate
    owner: governance-team
    notes: >
      P43 R5 收口确立 9 子项目 ruff 全 0 baseline。每 7 天通过 `omo governance`
      (governance_check_lint) 自动扫描 kairon packages/，其他子项目走
      `cd projects/<x> && uv run ruff check src/` 手动验证。
      任何子项目回归非 0 即触发 lint score 扣分并降级 governance 等级。

  - rule_id: X2-FRESH-MOF-VERSION-BUMP
    title: MOF 模型版本变更 30 天巡检
    type: model_drift_freshness
    status: active
    created: '2026-06-20'
    target: .omo/_truth/mof-version.yaml
    freshness:
      mechanism: git-commit-staleness
      threshold_days: 30
      action: warn
    owner: architecture-team
    notes: >
      MOF 模型版本 (当前 v0.0.12) 超过 30 天无变化时告警, 提示
      mof-extract 钩子是否失活 / 是否需要新阶段登记。需配合 `bin/mof-version show`
      与 `.omo/_knowledge/audits/*.md` 联合审计。

  - rule_id: X2-FRESH-DOC-LIFECYCLE
    title: 文档 ownership/lifecycle 健康度必须持续维护
    type: doc_lifecycle_freshness
    status: active
    created: '2026-06-22'
    target: .omo/_truth/registry/document-governance.yaml
    freshness:
      mechanism: doc-governance-check
      threshold_days: 7
      action: warn
    owner: governance-team
    notes: >
      P45 R2/P100: `bin/ssot/doc-governance-check.py` 是文档 ownership、
      lifecycle、review freshness 和 discoverability 的统一入口。
      PR 默认扫描 tracked 文档；定时审计使用 `--scope workspace --json`
      扫描 ignored plans 和 runtime projections。缺 frontmatter、旧 review
      日期和 orphan 文档先作为 warning，registry 损坏和 malformed metadata
      阻断；治理面消费统一的 path/rule/owner/severity/workflow/evidence findings.

  - rule_id: X2-FRESH-COMMIT-FATIGUE
    title: 工作树累积预警 (commit fatigue detector)
    type: commit_closure_freshness
    status: active
    created: '2026-06-23'
    target: .omo/
    freshness:
      mechanism: git-working-tree-accumulation
      threshold_days: 1
      threshold_count: 100
      action: escalate
    owner: governance-team
    notes: >
      P59 暴露 571 文件未提交的失闭环事件。本规则监控工作树累积,
      防止 agent 在长会话中累积大量修改而不提交。
      P85 R1 修正: action 改为 'escalate' (warn@100files / escalate@500files
      拆为 freshness 子字段, 单一 action).
      实现: bin/check-commit-fatigue.py (P60+ 实现) + pre-commit 钩子。
      参考: L0-constraints.yaml:CR-GOV-COMMIT-FREQUENCY-01
  - rule_id: X2-FRESH-OMO-LINT-SIZE
    title: "P90 omo_lint.py 抗 god-module 拆解监控 (P89-A 待拆 schemas 432L)"
    type: governance_loop_freshness
    status: active
    target: projects/omo/src/omo/omo_lint.py
    freshness:
      mechanism: manual-review
      threshold_days: 7
      action: warn
    owner: governance-team
    notes: >
      P90 R2 新增 rule (omo_lint.py 抗 god-module 监控).

  - rule_id: X2-FRESH-GOV-DASHBOARD
    title: "P91 governance-dashboard cron 持续运行监控 (确保 7 天内 dashboard 跑过)"
    type: governance_loop_freshness
    status: active
    target: .omo/cron/governance-dashboard-crontab
    freshness:
      mechanism: manual-review
      threshold_days: 7
      action: warn
    owner: governance-team
    notes: >
      P90 R2 新增 rule (omo_lint.py 抗 god-module 监控).

  - rule_id: X2-FRESH-ADR-DRIFT
    title: "P96 ADR drift 持续监督 (15 P50+ issues 待清, threshold 30 天)"
    type: governance_loop_freshness
    status: active
    target: .omo/_delivery/adr-drift-apply-history.jsonl
    freshness:
      mechanism: manual-review
      threshold_days: 30
      action: warn
    owner: governance-team
    notes: >
      P90 R2 新增 rule (omo_lint.py 抗 god-module 监控).

  - rule_id: X2-FRESH-NAV-DOC-REVIEW
    title: "导航/契约文档定期 review 运行时声称 (禁内嵌版本号/分数)"
    type: nav_doc_freshness
    status: active
    created: '2026-06-29'
    target: .omo/_truth/INVENTORY.md
    freshness:
      mechanism: registry-review
      threshold_days: 14
      action: warn
    owner: governance-team
    notes: >
      2026-06-29 L0/SSOT/M0/MOF 对齐审计新增 (审计: .omo/_knowledge/audits/
      2026-06-29-l0-ssot-m0-mof-alignment-remediation.md §6). INVENTORY 等导航
      文档易内嵌过时运行时声称 (mof-version vX.Y.Z / governance score / 任务数).
      14 天 review, 确保要么指针化, 要么刷新. 时间软约束 (owner 定期 review),
      非内容机器 check. 若内嵌版本号漂移反复 ≥3 次, 升级为 doc-ssot-lint
      STALE_PATTERNS content check (遵 YAGNI, 当前不建).

  - rule_id: X2-FRESH-DEBT-DASHBOARD
    title: "debt dashboard generated_at 新鲜度 (ISC-11, 防 ISC-10 post-hook 失效后看板停更)"
    type: governance_loop_freshness
    status: active
    created: '2026-07-01'
    target: .omo/debt/dashboard/current.yaml
    freshness:
      mechanism: generated_at-staleness
      threshold_days: 7
      action: warn
    owner: governance-team
    notes: >
      ISC-11 治本: omo refresh_outputs 写的活看板 (随 task 变更刷新, ISC-10 cli.py
      post-hook). 7 天 stale 说明 task pipeline 停滞或 post-hook 失效. 配合 ISC-50
      (两套看板 SSOT 统一 ADR) — _control/debt-dashboard/ 废弃后本 rule 成为唯一
      dashboard freshness 守护. 验证: grep generated_at + 距今 > 7 天 → warn.
