schema: scene-card/v3
scene_id: scene-inbox-to-decision
version: "3.0.0"
name: 收件箱到决策
description: >
  统一收件箱信号 → 智能分类 → 审查 → 决策 → 归档的全链路自动化。
  聚合多通道消息(邮件/OA/IM)，LLM 分类后由 Agent 生成决策建议，
  高置信度自动归档，低置信度提交人工审批。

scene_class: business
scene_type: inbound
domain: work

lifecycle: assisted
activation: controlled
owner: xiamingxing
approver: governance-agent
approval_state: confirmed

bet: BET-Y1Q4-T6-24

triggers:
  - type: signal
    signal: email.received
    filter: "subject contains '通知' OR '请报' OR '请示'"
    debounce: 300s
  - type: schedule
    cron: "0 9,14 * * 1-5"
  - type: condition
    expression: "inbox.unread > 20 AND time.hour >= 9 AND time.hour <= 18"

input:
  contract: scene-inbox-input-v3
  required: [source, content, metadata]
  optional: [attachments, context]

output:
  contract: scene-decision-output-v3
  produces: [decision, task, knowledge]
  events_emitted: [scene.completed, scene.decision_made]

runtime:
  journey_ref: journey-inbox-to-decision
  timeout: 3600s
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 5s
    max_delay: 60s
  compensation:
    on_failure: archive-as-pending
    on_timeout: escalate-to-human
  sandbox:
    level: isolated
    capabilities:
      - bos://memory/kos/search
      - bos://capability/compute/generate
      - bos://analysis/codeanalyze/scan
    permissions: [workflow-read, evidence-write]
    resource_limits:
      max_tokens: 50000
      max_tool_calls: 20
      max_duration: 300s

quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    min_precision: 0.7
    metrics:
      - {name: decision_accuracy, target: 0.8, weight: 0.4}
      - {name: time_saved_ratio, target: 0.5, weight: 0.3}
      - {name: false_positive_rate, target: 0.1, weight: 0.3}
  falsifier:
    - {condition: "calibration < 0.6 over 30d", action: demote_to_shadow}
    - {condition: "false_positive_rate > 0.2", action: demote_to_assisted}

topology:
  upstream:
    - {scene: scene-unified-inbox, handoff_via: intent}
  downstream:
    - {scene: scene-knowledge-ingest, trigger_on: scene.completed}
    - {scene: scene-document-review, trigger_on: "decision.type == 'document'"}

human_in_the_loop:
  escalation:
    - {condition: "confidence < 0.7", action: require_approval}
    - {condition: "risk == 'high'", action: block_and_notify}
  notification:
    - {event: scene.started, channel: none}
    - {event: scene.completed, channel: dashboard}
    - {event: scene.escalated, channel: push}

observability:
  tracing: true
  evidence_capture: full

activation_blockers: []
