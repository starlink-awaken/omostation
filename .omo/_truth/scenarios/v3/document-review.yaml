schema: scene-card/v3
scene_id: scene-document-review
version: "3.0.0"
name: 公文审查
description: >
  公文起草 → 格式检查 → 敏感项核查 → 依据验证，全程审计留痕。
  支持公文格式(GB/T 9704)、敏感词、政策依据三维度审查。

scene_class: business
scene_type: inbound
domain: work

lifecycle: assisted
activation: controlled
owner: xiamingxing
approver: governance-agent
approval_state: confirmed

bet: BET-Y1Q4-T6-24

triggers:
  - type: signal
    signal: document.created
    filter: "category == 'official'"
    debounce: 60s
  - type: manual

input:
  contract: scene-document-input-v3
  required: [document_path, document_type]
  optional: [context, related_documents]

output:
  contract: scene-review-output-v3
  produces: [review_report, issues, decision]
  events_emitted: [scene.completed, scene.review_completed]

runtime:
  journey_ref: journey-document-review
  timeout: 1800s
  retry:
    max_attempts: 2
    backoff: fixed
    initial_delay: 10s
  sandbox:
    level: isolated
    capabilities:
      - bos://capability/compute/generate
      - bos://memory/kos/search
    permissions: [workflow-read, evidence-write]
    resource_limits:
      max_tokens: 30000
      max_tool_calls: 10
      max_duration: 180s

quality:
  calibration:
    min_samples: 30
    min_calibration: 0.65
    metrics:
      - {name: issue_detection_rate, target: 0.85, weight: 0.5}
      - {name: false_positive_rate, target: 0.1, weight: 0.3}
      - {name: review_speed_seconds, target: 120, weight: 0.2}
  falsifier:
    - {condition: "issue_detection_rate < 0.7 over 30d", action: demote_to_shadow}

topology:
  upstream:
    - {scene: scene-inbox-to-decision, handoff_via: event}
  downstream:
    - {scene: scene-knowledge-ingest, trigger_on: scene.completed}

human_in_the_loop:
  escalation:
    - {condition: "review.severity == 'critical'", action: require_approval}
  notification:
    - {event: scene.escalated, channel: push}

observability:
  tracing: true
  evidence_capture: full
