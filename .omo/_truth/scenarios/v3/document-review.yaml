schema: scene-card/v3
scene_id: document-review
version: 3.0.0
name: Document Review
description: 将公文草稿生成、格式检查、敏感项检查和依据核验放进同一条可审计、可退回的决策旅程
scene_class: business
scene_type: inbound
domain: work
lifecycle: supervised
activation: active
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q1-T7-01
runtime:
  journey_ref: inbox-to-decision
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities:
    - bos://capability/compute/generate
    - bos://memory/kos/search
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 shadow 期间无文档被自动审查，则场景无价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: '公文起草/审查需求进入确认队列 (来源: 卫健委借调 / 国转中心 / 日常公文)'
input_contract: 具备主题、时间、接收对象、核心内容四要素的公文任务引用 (evidence:// 或 vault://redacted/)
result_contract: 包含草稿、格式检查、敏感项审查、依据核验、人工退回记录的 Workflow Mesh 证据
outcome_metric: review_cycle_hours
consumer: document-owner-and-reviewer
failure_cost: 公文格式/敏感项/依据错误外发，造成返工、合规风险或决策延误
data_classification: internal
data_scope: redacted-document-references-and-governed-review-evidence
operator: document-review-agent-under-human-review
permission_ref: permission://scene/document-review
sample_refs:
- vault://redacted/document-review/sample-1
- vault://redacted/document-review/sample-2
- vault://redacted/document-review/sample-3
