schema: scene-card/v3
scene_id: scene-meeting-to-delivery
version: 3.0.0
name: Meeting To Delivery
description: 会议结束后的行动项提取与任务自动创建
scene_class: business
scene_type: inbound
domain: work
lifecycle: assisted
activation: controlled
owner: governance-team
approver: governance-agent
approval_state: confirmed
bet: BET-Y2Q1-T7-03
runtime:
  journey_ref: meeting-to-delivery
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities: []
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内会议纪要无一条转化为交付物 (delivery artifact), 场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: 会议日历事件结束
input_contract: CalendarEvent + MeetingNotes
result_contract: Task[] + FollowUp[]
outcome_metric: action_item_extraction_rate >= 0.8
failure_cost: low
data_classification: internal
data_scope: workspace-meeting
operator: omo-resident
permission_ref: bos://resident/meeting/read
sample_refs:
- .omo/state/scene-cards/meeting-to-delivery/samples/sample-1.json
- .omo/state/scene-cards/meeting-to-delivery/samples/sample-2.json
- .omo/state/scene-cards/meeting-to-delivery/samples/sample-3.json
