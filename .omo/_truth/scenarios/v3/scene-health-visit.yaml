schema: scene-card/v3
scene_id: scene-health-visit
version: 3.0.0
name: Health Visit
description: 就诊结束后记录诊断/处方/医嘱, 形成就诊结构化档案
scene_class: business
scene_type: inbound
domain: work
lifecycle: draft
activation: preview
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q4-T8-04
runtime:
  journey_ref: health-medical-workflow
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities:
    - llm:local-classify
    - storage:local-health-ledger
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内无 health 类任务触发，则场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: 人工触发 (就诊完成后录入或口述转写)
input_contract: 就诊结果描述 (诊断/处方/医嘱/复查要求, 文本口述均可)
result_contract: 就诊档案 (diagnosis/prescription/followup_required) + records_received
  布尔判定
outcome_metric: health_visit_capture_completeness
consumer: xiamingxing
failure_cost: 处方/复查要求遗失导致用药或复诊中断
data_classification: confidential
data_scope: local-health-ledger-only
operator: health-visit-dispatch-under-human-review
