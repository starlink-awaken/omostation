schema: scene-card/v3
scene_id: unified-inbox
version: 3.0.0
name: Unified Inbox
description: 将多渠道 (邮件/IM/OA) 的工作信息汇聚为统一、可分诊、可追踪的待办流
scene_class: business
scene_type: inbound
domain: work
lifecycle: supervised
activation: active
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q1-T2-01
triggers:
- type: manual
output:
  contract: '统一待办列表 (分诊结果: 需要审查/需要回复/需要执行/可归档), 每项带来源渠道+优先级+截止时间'
  events_emitted:
  - scene.completed
runtime:
  journey_ref: inbox-to-decision
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities: []
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 shadow 期间无信号被归一化入 inbox，则场景无价值，回退 draft
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: '新邮件/消息/OA待办到达 (来源: 卫健委邮箱, 网易邮箱大师, 致远OA, 钉钉/飞书)'
input_contract: 多渠道消息引用 (evidence:// 或 vault://redacted/), 不含原文
outcome_metric: inbox_triage_accuracy / triage_to_action_latency
consumer: xiamingxing
failure_cost: 重要消息遗漏/误分类导致工作延误或决策缺失
data_classification: internal
data_scope: channel-metadata-and-redacted-message-references
operator: inbox-triage-agent-under-human-review
permission_ref: permission://scene/unified-inbox
