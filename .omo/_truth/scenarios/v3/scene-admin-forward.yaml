schema: scene-card/v3
scene_id: scene-admin-forward
version: 3.0.0
name: Admin Forward
description: 生成转发通知与数据收集表两份草稿, 供人工确认后发送
scene_class: business
scene_type: inbound
domain: work
lifecycle: shadow
activation: preview
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q4-T8-04
runtime:
  journey_ref: admin-notification-workflow
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities:
    - risk_engine:forward-check
    - doc:generate-draft
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内无 admin 类任务触发，则场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: journey classified→forwarding 转移 (requires_forwarding == true)
input_contract: latest_subject + target + deadline
result_contract: email_drafts_created 布尔 + notice_draft/form_draft 草稿路径 + requires_human_confirm
  (恒 true)
outcome_metric: draft_acceptance_rate
consumer: xiamingxing
failure_cost: 草稿质量差增加人工修改成本 (不直接外发, 风险受控)
data_classification: internal
data_scope: draft-documents-only
operator: admin-forward-dispatch-under-risk-engine
