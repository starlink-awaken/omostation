schema: scene-card/v3
scene_id: periodic-reporting
version: 3.0.0
name: Periodic Reporting
description: 按周期 (周/月/季) 自动汇聚工作产出, 生成结构化报送材料和绩效证据包
scene_class: business
scene_type: inbound
domain: work
lifecycle: supervised
activation: active
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q2-T6-04
triggers:
- type: manual
output:
  contract: 报送文档 (含完成项/进行中/阻塞项/下周计划) + 绩效证据包 (PR清单/测试覆盖/交付指标)
  events_emitted:
  - scene.completed
runtime:
  journey_ref: schedule-to-evidence
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities: []
    permissions:
    - ci-read
    - workflow-read
    - evidence-write
    - config-read
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 shadow 期间无自动报告产出，则场景无价值，回退 draft
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: 到达报送周期节点 (周报/月报/季报) 或临时报送要求
input_contract: 周期内交付物引用 (PR/文档/任务完成记录, evidence:// 格式)
outcome_metric: report_compilation_hours / evidence_completeness_rate
consumer: xiamingxing
failure_cost: 报送遗漏/数据不准/绩效证据缺失影响考核
data_classification: internal
data_scope: reporting-metadata-and-delivery-evidence
operator: reporting-agent-under-human-review
permission_ref: permission://internal/periodic-reporting
