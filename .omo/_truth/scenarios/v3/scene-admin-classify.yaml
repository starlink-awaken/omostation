schema: scene-card/v3
scene_id: scene-admin-classify
version: 3.0.0
name: Admin Classify
description: 对已判定为任务的邮件做 LLM 任务分解, 识别转发需求/任务类型/截止时间/转发对象
scene_class: business
scene_type: inbound
domain: work
lifecycle: shadow
activation: preview
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q4-T8-04
runtime:
  journey_ref: admin-notification-workflow
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities:
    - llm:local-classify
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内无 admin 类任务触发，则场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: journey received→classified 转移 (has_task == true)
input_contract: latest_subject + mails 分类上下文
result_contract: requires_forwarding 布尔 + task_type (转发通知/收集数据/提交报告) + deadline +
  target + required_docs
outcome_metric: classify_accuracy
consumer: xiamingxing
failure_cost: 任务类型误判导致流程走错分支
data_classification: internal
data_scope: task-metadata-only
operator: admin-classify-dispatch
