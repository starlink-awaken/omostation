schema: scene-card/v3
scene_id: scene-health-intake
version: 3.0.0
name: Health Intake
description: 将症状/体征指标/医嘱等健康信息结构化记录到本地健康台账, 并判定是否需要就诊
scene_class: business
scene_type: inbound
domain: work
lifecycle: draft
activation: preview
owner: xiamingxing
approver: business-governance
approval_state: confirmed
bet: BET-Y1Q4-T8-04
runtime:
  journey_ref: health-medical-workflow
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities:
    - llm:local-classify
    - storage:local-health-ledger
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内无 health 类任务触发，则场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: 人工触发 journey run (P1 无自动采集源, 敏感域约束)
input_contract: 健康事件描述 (症状文本/指标数值/发生时间), 仅本地处理
result_contract: 结构化健康记录 (symptom/metric/onset/severity) + needs_doctor_visit 布尔判定
outcome_metric: health_intake_structuring_accuracy
consumer: xiamingxing
failure_cost: 症状信息遗漏或误判就医必要性导致延误
data_classification: confidential
data_scope: local-health-ledger-only
operator: health-intake-dispatch-under-human-review
