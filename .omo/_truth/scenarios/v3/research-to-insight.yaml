schema: scene-card/v3
scene_id: research-to-insight
version: 3.0.0
name: Research To Insight
description: 研究任务完成后的知识沉淀与关联发现
scene_class: business
scene_type: inbound
domain: work
lifecycle: assisted
activation: controlled
owner: governance-team
approver: governance-agent
approval_state: confirmed
bet: BET-Y2Q1-T7-03
runtime:
  journey_ref: research-to-insight
  timeout: 3600s
  sandbox:
    level: isolated
    capabilities: []
    permissions: []
quality:
  calibration:
    min_samples: 30
    min_calibration: 0.6
    metrics:
    - name: success_rate
      target: 0.9
      weight: 0.5
    - name: time_saved_ratio
      target: 0.5
      weight: 0.3
    - name: false_positive_rate
      target: 0.1
      weight: 0.2
falsifier: 若 30 天内研究成果无一条被后续任务/决策引用 (insight 复用=0), 场景无实际价值
observability:
  tracing: true
  evidence_capture: full
activation_blockers: []
trigger: 研究任务状态变为 completed
input_contract: ResearchTask (query, sources, findings)
result_contract: Insight[] + KnowledgeNode[]
outcome_metric: insights_per_research >= 2
failure_cost: low
data_classification: internal
data_scope: workspace-research
operator: omo-resident
permission_ref: bos://resident/research/read
sample_refs:
- .omo/state/scene-cards/research-to-insight/samples/sample-1.json
- .omo/state/scene-cards/research-to-insight/samples/sample-2.json
- .omo/state/scene-cards/research-to-insight/samples/sample-3.json
