phase10:
  neo4j_as_of: true
  live_kos: MOS_LIVE_KOS=1 → HTTP KOS_API_URL
  live_gbrain: MOS_LIVE_GBRAIN=1 → gbrain search/query subprocess
  live_gbrain_write: MOS_LIVE_GBRAIN_WRITE=1 → best-effort gbrain put on write
  notes: capability deepen; defaults remain fixture-safe
phase6:
  neo4j_writer: projects/kairon/packages/mos/src/mos/neo4j_writer.py
