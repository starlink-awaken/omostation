    change: |
      修正 ci_coverage 计数: 26 → 14。原因是初版用字符串匹配统计 tests/*.py,
      把 projects/{omo,cockpit,runtime}/tests/ 下的 10 个子项目测试误计为根仓测试。
  - version: 3
    date: '2026-09-22'
    change: |
      再修正 14 → 15: v2 的解析未在 step 边界重置 cwd, 致 governance-check.yml 中
      `python3 -m pytest tests/test_spec_binding_lint.py`(cwd=根仓) 被沿用前一步的
      `cd projects/omo` 误解析而漏计。同时**实测**全部 15 个 CI 覆盖文件
      (362 passed / 0 failed), 将「CI 覆盖的测试全部通过」从推断升级为已验证,
      并补记「9 个 documents 测试属条件性覆盖(路径过滤), 常规 PR 不触发」。
      判定表主体（5 类 / 44 文件 / 160 测试）两轮均不受影响, 因其基于失败清单直接分类;
      「CI 覆盖 ∩ 失败 = ∅」结论亦不变(重算后仍为 0)。
