# 根层测试债（tests/*.py）—— 判定表
#
# 背景: CI 以「显式列举」方式只运行 26 个根层测试文件（见 .github/workflows/*.yml），
# 其余 218 个既无 CI 也无 cron 覆盖。全量 `pytest tests/` 实测:
#   3513 collected / 0 collection error / 160 failed + 29 setup errors / 3319 passed
# 即 189 个失败长期不可见 —— `bin/gac/check-test-collection.py` 只守「收集完整性」,
# 不守「通过率」, 故该守卫 PASS 而失败照旧。
#
# 本表为只读判定的产物（2026-09-22）, 未做任何处置。每项含根因与建议动作。
# 判定依据: 目标存活（文件系统为准 —— 本仓为 shallow clone, 历史不可靠）+
#           失败原因直读 + 隔离性分析（fixture vs 读真实仓库）。
#
# 处置原则: 「已归档/已移除」→ 删测试; 「时间炸弹」→ 改相对时间;
#           「环境」→ 加守卫（参照 tests/test_scene_outcome_episode_bridge.py 模式);
#           「行为漂移」→ 逐个判定测试对错, 不得批量跳过。
