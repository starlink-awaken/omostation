version: 1
ssot_ref: BET-Y1Q1-T2-01
description: '外部信号源注册表。每个信号源定义健康状态、失败策略和去重窗口。 不可达时 health=unreachable，禁止呈现为"本周 0 条信号"。
  bos://perception/* 在 agora 注册。

  '
sources:
- id: apple_mail_inbox
  description: Apple Mail 收件箱 — 个人邮件信号入口
  scene_binding: document-review
  transport: local_filesystem
  path: ~/Library/Mail/
  probe_depth: 3
  poll_interval: 300s
  dedup_window: 24h
  idempotency_key: message_id
  failure_policy:
    max_retries: 3
    backoff: exponential
    on_failure: emit_unreachable
  health: healthy
  last_signal_at: '2026-08-19T13:08:52Z'
  registered_at: '2026-08-07T00:00:00Z'
  bos_uri: bos://perception/apple_mail/inbox
  verified_mbox_count: 27
- id: netease_mailmaster_inbox
  description: 网易邮箱大师收件箱 — 工作邮件信号入口
  scene_binding: document-review
  transport: local_filesystem
  path: ~/Library/Containers/com.netease.macmail/Data/Library/Application Support/data/
  probe_depth: 2
  poll_interval: 300s
  dedup_window: 24h
  idempotency_key: message_id
  failure_policy:
    max_retries: 3
    backoff: exponential
    on_failure: emit_unreachable
  health: degraded
  last_signal_at: null
  registered_at: '2026-08-07T00:00:00Z'
  bos_uri: bos://perception/netease/inbox
- id: github_push
  description: GitHub push event — 代码变更信号入口
  scene_binding: engineering-delivery
  transport: webhook
  poll_interval: 60s
  dedup_window: 1h
  idempotency_key: commit_sha
  failure_policy:
    max_retries: 2
    backoff: linear
    on_failure: emit_unreachable
  health: healthy
  last_signal_at: '2026-08-19T18:00:00Z'
  registered_at: '2026-08-07T00:00:00Z'
  bos_uri: bos://perception/github/push
- id: inbox_folder
  description: 感知文件夹 — 投放文件即信号 (第二根管子, BET-Y1Q3-T2-01)
  scene_binding: unified-inbox
  transport: local_filesystem
  path: ~/Documents/@感知信号
  poll_interval: 60s
  dedup_window: 1h
  idempotency_key: file_path
  failure_policy:
    max_retries: 3
    backoff: exponential
    on_failure: emit_unreachable
  health: healthy
  last_signal_at: '2026-08-19T17:30:00Z'
  registered_at: '2026-08-09T00:00:00Z'
  bos_uri: bos://perception/folder/inbox
health_states:
- healthy
- degraded
- unreachable
- unknown
schema_contract:
  required_fields:
  - id
  - description
  - transport
  - dedup_window
  - idempotency_key
  - failure_policy
  - health
  - bos_uri
  - scene_binding
  health_must_not:
  - value: healthy
    when: last_signal_at is null or older than 2x poll_interval
