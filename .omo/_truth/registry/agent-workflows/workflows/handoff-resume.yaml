id: handoff-resume
run_frequency: on_demand
title: Compression-safe handoff and resume
purpose: Persist enough workflow state that another agent or a compressed session
  can continue.
agents:
  roles:
  - any-agent
  observer_policy: optional
allowed_lanes:
- docs
- code
- governance_code
- governance_state
- config
- submodule_pointer
lock_scopes:
- agent-run:{run_id}
surfaces:
  read:
  - .omo/_delivery/agent-workflows/runs/**
  - .agents/**
  write:
  - .omo/_delivery/agent-workflows/runs/**
phases:
  preflight:
  - id: workflow-lint
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - lint
  execute:
  - id: resume
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - resume
    - '{run_id}'
  verification:
  - id: run-record
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - show-run
    - '{run_id}'
  closeout:
  - id: close-run
    mode: manual
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - close
    - '{run_id}'
    - --status
    - ok
