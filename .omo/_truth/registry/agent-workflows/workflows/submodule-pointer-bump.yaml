id: submodule-pointer-bump
run_frequency: on_demand
title: Submodule pointer safe bump
purpose: >
  子模块指针安全更新 — 防止直通 main 和指针污染。
  强制 4 步流程: check → update → verify → push。
agents:
  roles:
  - release-agent
  - governance-agent
  observer_policy: required
allowed_lanes:
- submodule_pointer
- config
lock_scopes:
- submodule:{sub_name}
- root-gate
surfaces:
  read:
  - .omo/standards/submodule-pointer-bump-contract.md
  - bin/ssot/submodule-reachability-gate.py
  write:
  - projects/{sub_name}
phases:
  preflight:
  - id: check_ff
    command: git -C projects/{sub_name} pull --ff-only
    expect: exit 0
  - id: check_reachability
    command: python3 bin/ssot/submodule-reachability-gate.py
    expect: PASS
  execute:
  - id: bump_pointer
    command: bash bin/ssot/submodule-pointer-transaction.sh --message "{message}"
  verify:
  - id: verify_ancestry
    command: git -C projects/{sub_name} log --oneline -3
  - id: push_submodule
    command: git -C projects/{sub_name} push origin main
  - id: push_root
    command: git add projects/{sub_name} && git commit && git push
evidence_required:
- transaction_log
- ancestry_verification
