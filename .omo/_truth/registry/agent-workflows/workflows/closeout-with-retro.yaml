id: closeout-with-retro
run_frequency: on_demand
title: Closeout with mandatory retrospective
purpose: >
  闭环收尾 + 强制复盘。
  解决当前 agent-workflow closeout 不强制 retro 导致教训流失的问题。
agents:
  roles:
  - engineering-agent
  - qa-agent
  - governance-agent
  observer_policy: optional
allowed_lanes:
- docs
- governance_code
lock_scopes:
- closeout:{run_id}
surfaces:
  read:
  - .agents/skills/closeout-retro/SKILL.md
  - .omo/_knowledge/patterns/p78-triple-axis-diagnostic-pattern.md
  write:
  - .omo/_knowledge/retros/**
phases:
  preflight:
  - id: basic_closeout
    mode: required
    command:
    - git
    - status
    - --short
  - id: gac_gate
    mode: required
    command:
    - make
    - gac-local-gate
  execute:
  - id: p78_diagnostic
    mode: required
    command:
    - python3
    - bin/gac/p78-diagnostic-prescan.py
  verification:
  - id: retro_analysis
    mode: required
    command:
    - python3
    - bin/gac/p78-diagnostic-prescan.py
    - --json
  closeout:
  - id: solidify
    mode: manual
    command:
    - agent
    - solidify-retro
evidence_required:
- p78_answers
- solidification_actions
