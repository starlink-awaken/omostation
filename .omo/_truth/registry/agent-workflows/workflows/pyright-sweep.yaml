id: pyright-sweep
run_frequency: on_demand
title: Python type and style sweep
purpose: Route cross-package pyright and ruff debt cleanup through a bounded, test-backed
  convergence loop.
agents:
  roles:
  - engineering-agent
  - qa-agent
  - governance-agent
  observer_policy: use_for_high_blast_radius_or_unattended_runs
allowed_lanes:
- code
- governance_code
- config
- docs
lock_scopes:
- python-type-sweep
- root-gate
surfaces:
  read:
  - projects/*/src/**/*.py
  - projects/*/tests/**/*.py
  - projects/*/pyproject.toml
  - projects/*/pyrightconfig.json
  - bin/sweep/**
  write:
  - projects/*/src/**/*.py
  - projects/*/tests/**/*.py
  - projects/*/pyproject.toml
  - projects/*/pyrightconfig.json
  - bin/sweep/**
  - .omo/_knowledge/decisions/**
  - .omo/_knowledge/patterns/**
phases:
  preflight:
  - id: root-status
    mode: required
    command:
    - git
    - status
    - --short
  - id: workflow-lint
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - lint
  execute:
  - id: sweep
    mode: manual
    command:
    - agent
    - edit
    - python-type-and-style-debt
  verification:
  - id: project-pyright
    mode: manual
    command:
    - project-local
    - pyright-command
  - id: project-ruff
    mode: manual
    command:
    - project-local
    - ruff-command
  - id: project-tests
    mode: manual
    command:
    - project-local
    - test-command
  - id: gac-local-gate
    mode: required
    command:
    - make
    - gac-local-gate
  closeout:
  - id: diff-stat
    mode: required
    command:
    - git
    - diff
    - --stat
