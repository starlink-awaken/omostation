id: governance-audit
run_frequency: periodic
title: Workspace Systemic Governance Audit
purpose: Execute systemic governance health scan, write-ownership check, brief generation,
  and SSOT alignment.
agents:
  roles:
  - governance-agent
  observer_policy: optional
allowed_lanes:
- docs
- governance_code
- governance_state
lock_scopes:
- governance-audit-run
surfaces:
  read:
  - .omo/_truth/registry/**
  - bin/**
  - BRIEF.md
  write:
  - .omo/state/**
  - BRIEF.md
phases:
  preflight:
  - id: status
    mode: required
    command:
    - git
    - status
    - --short
  - id: workflow-lint
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - lint
  execute:
  - id: audit-health
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/compass_radar.py
  - id: audit-brief
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/mof/generate-brief.py
    - --write
  verification:
  - id: write-owner-audit
    mode: required
    command:
    - python3
    - bin/ssot/write-owner-audit.py
    - --staged
  - id: ssot-guardian
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/ssot/ssot-guardian.py
  - id: gac-local-gate
    mode: required
    command:
    - make
    - gac-local-gate
  closeout:
  - id: diff-stat
    mode: required
    command:
    - git
    - diff
    - --stat
