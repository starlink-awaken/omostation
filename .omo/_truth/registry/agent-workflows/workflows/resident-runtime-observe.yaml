id: resident-runtime-observe
run_frequency: continuous
title: Resident runtime observe
purpose: >
  让 agent 从 workflow 层感知 resident 常驻 agent 体系 (WP-A~I / ADR-0396) 活性。
  不新增运行时能力，只补治理感知面：水位新鲜度、角色对齐、BOS 路由。
agents:
  roles:
  - governance-agent
  - observer-agent
  observer_policy: read_only_required
allowed_lanes:
- governance_code
- governance_state
lock_scopes:
- resident-observe
surfaces:
  read:
  - .omo/_delivery/resident-orchestrator/watermarks/**
  - projects/omo/src/omo/resident/roles.py
  - projects/ecos/src/ecos/ssot/mof/m1/agent/AGENT-RESIDENT-ROLES.yaml
  - projects/agora/etc/bos-services.yaml
  - projects/agora/etc/bos-registry.json
  write: []
phases:
  preflight:
  - id: workflow-lint
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - lint
  execute:
  - id: observe
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - observe
  verification:
  - id: resident-status
    mode: required
    command:
    - python3
    - bin/gac/check-resident-status.py
  - id: resident-mof-sync
    mode: required
    command:
    - python3
    - bin/gac/check-resident-mof-sync.py
  - id: resident-bos
    mode: required
    command:
    - python3
    - bin/gac/check-resident-bos.py
  closeout:
  - id: doctor
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - doctor
notes:
- 本 workflow 存在的理由(P74): resident 感知面是高频检查项，挂通用 observer-audit 属于错位。
- 三个 check 工具独立可跑，也被 gac-local-gate 聚合；本 workflow 提供 agent 层单一入口。
- 不修改 resident 运行时；只读 watermark / roles / BOS 路由。
