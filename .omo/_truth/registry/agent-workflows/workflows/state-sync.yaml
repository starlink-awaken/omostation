id: state-sync
run_frequency: continuous
title: Runtime state projection sync
purpose: Refresh high-churn runtime projections through the OMO state-sync broker
  instead of ad-hoc agent writes.
agents:
  roles:
  - state-sync-agent
  - governance-agent
  observer_policy: recommended_for_unattended_runs
allowed_lanes:
- governance_state
- docs
- runtime_snapshot
lock_scopes:
- surface:omo-state-sync-projection
- .omo/state
surfaces:
  read:
  - .omo/_truth/registry/**
  - .omo/state/system_health.yaml
  - .omo/state/system.yaml
  - .omo/_control/debt-dashboard/current.yaml
  - .omo/tasks/**
  - spaces/**
  - projects/c2g/**
  - projects/omo/**
  - bin/compass_radar.py
  - bin/mof/generate-brief.py
  write:
  - .omo/state/health.yaml
  - .omo/state/system.yaml
  - .omo/_control/governance-data.json
  - BRIEF.md
  - runtime/omo/_delivery/ingress/state/**
phases:
  preflight:
  - id: workflow-lint
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - lint
  - id: state-sync-dry-run
    mode: required
    command:
    - uv
    - run
    - --project
    - projects/omo
    - omo
    - state
    - sync
    - --dry-run
    - --json
  execute:
  - id: state-sync
    mode: required
    command:
    - uv
    - run
    - --project
    - projects/omo
    - omo
    - state
    - sync
    - --json
  verification:
  - id: state-freshness
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/gac/state-freshness-check.py
    - --json
  - id: ssot-guardian
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/ssot/ssot-guardian.py
  closeout:
  - id: observe
    mode: required
    command:
    - uv
    - run
    - --with
    - pyyaml
    - python
    - bin/agent-workflow.py
    - observe
