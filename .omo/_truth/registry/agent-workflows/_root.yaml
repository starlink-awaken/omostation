version: 1
description: Project-level executable workflows for AI agents working in omostation.
ssot:
  governance_rules: .omo/_truth/registry/governance-checks.yaml
  agent_protocol: .omo/standards/agent-mutation-protocol.md
  omo_surfaces: .omo/standards/omo-governance-surfaces.md
  doc_contract: .omo/standards/doc-ssot-contract.md
internal_integrations:
  gac:
    status: integrated
    authority: governance_gate
    owner: governance-team
    ssot_rule: Governance rules are canonical in .omo/_truth/registry/governance-checks.yaml;
      Markdown may only point to generated summaries.
    gate: make gac-local-gate
    gate_binding: make gac-local-gate
    runner_lint_binding: bin/gac/gac-local-gate.py::agent-workflow-lint
    health_command:
    - bin/gac/gac-validate.py
    - --gate
    health_required: true
  omo:
    status: integrated
    authority: state_broker
    owner: omo-team
    ssot_rule: OMO owns governed state mutation; direct .omo writes are exceptional
      and must be called out.
    bridge_compat: uv run --project projects/omo omo bridge --format <format> <source-file>
    state_broker: projects/omo
    gate_binding: omo-bridge-help
    health_command:
    - uv
    - run
    - --project
    - projects/omo
    - omo
    - bridge
    - --help
    health_required: true
  c2g:
    status: integrated
    authority: strategy_ingress
    owner: strategy-team
    ssot_rule: Strategy and external specs enter governed work through C2G/OMO planned
      task materialization.
    pitch_bet: uv run --project projects/c2g c2g bet <pitch.md>
    cockpit_entry: uv run --project projects/cockpit cockpit compass bet <pitch.md>
    gate_binding: c2g-bet-help
    health_command:
    - uv
    - run
    - --project
    - projects/c2g
    - c2g
    - bet
    - --help
    health_required: true
  cockpit:
    status: integrated
    authority: entrypoint
    owner: cockpit-team
    ssot_rule: Cockpit is the L3 human entrypoint and delegates governance behavior
      to registered lower-layer tools.
    compass: uv run --project projects/cockpit cockpit compass --help
    agent: uv run --project projects/cockpit cockpit agent
    workflow: uv run --project projects/cockpit cockpit agent-workflow --help
    gate_binding: cockpit-agent-workflow-list
    health_command:
    - uv
    - run
    - --project
    - projects/cockpit
    - cockpit
    - agent-workflow
    - list
    health_required: true
  mof:
    status: integrated
    authority: model_registry
    owner: ecos-team
    ssot_rule: MOF M1/M2/M3 model facts and capability tools are canonical under ecos/mof
      registries.
    capabilities: .omo/_truth/registry/mof-capabilities.yaml
    schema_validate: python3 projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py
      --json
    state_bridge: python3 projects/ecos/src/ecos/ssot/tools/mof-state-bridge.py --json
    drift: bin/mof-drift
    gate_binding: mof-schema-validate
    health_command:
    - python3
    - projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py
    - --json
    health_required: true
runner:
  entrypoint: bin/agent-workflow.py
  generated_skill: .agents/skills/project-governance/SKILL.md
  run_state_dir: .omo/_delivery/agent-workflows/runs
  lock_state_dir: .omo/_delivery/agent-workflows/locks
  ledger_path: .omo/_delivery/agent-workflows/events.jsonl
  lock_ttl_hours: 24
silent_workflow_policy:
  description: 'Registry-level policy for workflows that have no recent agent_workflow_start
    events (ADR-0130 / P74). P74 §4.4 distinguishes A1 (check-layer silent, addressed
    via doctor_checks / diff_checks) from A2 (run-layer silent, intentionally not
    force-triggered because gate coverage already exercises them). A workflow is considered
    silently healthy when its path appears in at least one diff_checks or doctor_checks
    rule. Workflows with neither coverage AND no recent run events trigger a [warn]
    in agent-workflow compliance (p74_solidification).

    '
  warn_after_days: 30
  warn_after_days_by_frequency:
    on_demand: 30
    periodic: 7
    continuous: 1
requirement_iteration_policy:
  mode: required
  adr: ADR-0203
  enforcement: ADR-0204
  description: 'All requirement iterations (feature, bugfix, ops landing, governance/SSOT/ADR
    changes, submodule pointer closeout tied to delivery) MUST execute via bin/agent-workflow.py:
    bootstrap → start → claim → verify → closeout. Prompt memory alone is non-compliant.
    claim_policy tiers still enforce path claims; this policy is the agent-facing
    mandatory rule for starting a run before edits. Executable gate (ADR-0204): staged
    in-scope files without an active run → compliance halt. Unstaged dirty in-scope
    files → warn only (multi-agent worktree safe). Bypass: AGCP_REQUIREMENT_ITERATION_GATE=0

    '
  required_lifecycle:
  - bootstrap
  - start
  - claim
  - verify
  - closeout
  in_scope:
  - feature_or_bugfix_code_change
  - governance_ssot_or_adr_change
  - ops_landing_with_repo_diff
  - delivery_closeout_with_product_or_governance_change
  - submodule_pointer_closeout
  in_scope_paths:
  - projects/**
  - .omo/_truth/**
  - .omo/standards/**
  - .omo/_knowledge/decisions/**
  - .omo/_knowledge/patterns/**
  - .agents/**
  - bin/**
  - docs/**
  - tests/**
  - AGENTS.md
  - CLAUDE.md
  - ARCHITECTURE.md
  - README.md
  exclude_paths:
  - .omo/state/**
  - .omo/_delivery/**
  - .omo/_control/**
  - runtime/**
  - '**/__pycache__/**'
  exempt_classes:
  - pure_readonly_qa_or_explore
  - observer_audit_readonly
  - explicit_user_waiver_recorded_in_closeout
  exempt_workflows:
  - observer-audit
  non_exempt_note: 'handoff-resume is recovery of an existing run, not a license to
    edit without a run-id.

    '
claim_policy:
  mode: advisory
  required_paths:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - docs/GOVERNANCE-EVOLUTION-ROADMAP.md
  - projects/AGENTS.md
  tiers:
  - id: core-governance-required
    mode: required
    paths:
    - .agents/skills/**
    - .omo/_truth/registry/**
    - .omo/standards/**
    - bin/agent-workflow.py
    - bin/change-lane-check.py
    - bin/gac/gac-local-gate.py
    - bin/gac/governance-evolution.py
    - bin/gac/omo-state-projection-guard.py
    - bin/gac/omo-runtime-stamp-policy.py
    - projects/agora/etc/bos-services.yaml
    - projects/cockpit/src/cockpit/cli.py
    - projects/cockpit/src/cockpit/commands/agent_workflow.py
    - projects/cockpit/src/cockpit/tests/test_agent_workflow_command.py
    - projects/ecos/src/ecos/ssot/mof/**
    - tests/test_agent_workflow.py
  - id: runtime-projection-snapshot
    mode: required
    paths:
    - .omo/_truth/registry/runtime-projections.yaml
    - .omo/state/runtime/**
    - .omo/_control/**
    - BRIEF.md
    note: 'Runtime projections refreshed by the omo state sync broker (ADR-0129, P74
      §3.2). Derived artifacts; required so that omo state sync workflows must claim
      them, keeping broker regeneration auditable.

      '
  - id: agent-entrypoint-advisory
    mode: advisory
    paths:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - docs/GOVERNANCE-EVOLUTION-ROADMAP.md
    - projects/AGENTS.md
evidence_schema:
  version: 1
  required_event_fields:
  - ts
  - event
  - run_id
  command_result_fields:
  - id
  - command
  - returncode
  - duration_s
  - ok
  closeout_required_events:
  - agent_workflow_verify
  - agent_workflow_closeout
  - agent_workflow_close
compliance_slo:
  stale_locks: 0
  closed_ok_without_evidence: 0
  required_integration_health: 100%
  doc_ssot_conflicts: 0
  generated_digest_drift: 0
