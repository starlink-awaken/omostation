# 复跑命令: uv run --with pyyaml python bin/ssot/check-mcptool-impl-drift.py [--json]
#
# 上一版 (2026-09-23) 的 156 条 drift 系探针假阳性, 已由 PR #4277 修复。
# 详见文末 corrections 段 —— 该段也说明为何本报告从 156 条变为 0 条。

summary:
  total_drifts: 0
  cockpit_declared_only: 0  # 声明但未实现
  cockpit_impl_only: 0      # 实现但未声明
  agora_impl_only: 0        # 已跳过, 见 servers.AGORA

servers:
  COCKPIT:
    declared: 23            # 仅统计 status: active 的 MCPTOOL-COCKPIT-*.yaml
    implemented: 23         # cockpit mcp --list-tools
    consistent: true
    note: 23 个 active 声明与 23 个实现一一对应

  AGORA:
    declared: 0
    implemented: 111
    skipped: true
    note: >-
      声明面为空 + 实现经 source_extract 从 @mcp.tool() 提取, 恒定产生 111 条
      「实现无声明」噪音; 属已知内部情况 (agora 工具不面向 MCPTOOL 注册面),
      不构成待办缺口。

categories:
