  cockpit_declared_only: []

  # 🟡 中优先级 — 后端实现但无前端声明
  cockpit_impl_only: []

  # 🟢 低优先级 — agora 实现但无声明
  agora_impl_only: []

recommendations: []

corrections:
  - date: '2026-09-25'
    by: 'PR #4277 (squash 34e70dd2a)'
    change: >-
      探针 load_declared_tools 改为只统计 status: active 的声明文件 (跳过
      retired/withdrawn), 并在 detect_drift 跳过 AGORA。
    before_after:
      # 同环境双版本实跑对照 (worktree 基线 34e70dd2a)
      cockpit_declared: 49 -> 23
      cockpit_impl: 23 -> 23
      cockpit_declared_only: 26 -> 0
      agora_impl_only: 111 -> 0
      total_drifts: 137 -> 0
    false_positive_detail: >-
      上一版列为「🔴 高优先级 — 前端暴露但无后端实现」的 26 条
      (daily_summary / github_pr_review / governance_* / research_* /
      shared_context_* / status_json / status_summary / vault_search)
      全部对应 status: retired 的 cockpit 工具声明, 即已被主动撤回的工具
      (呼应提交 ab286d5fc "...withdraw 26 cockpit MCP tools")。
      原探针把已撤回的声明仍计入声明面, 故恒定报「声明无实现」。
      经核对: MCPTOOL-COCKPIT-*.yaml 共 49 个, status 分布 retired=26 /
      active=23, 与过滤掉的 26 条精确吻合 —— 属假阳性, 非真实缺口。
    note_on_previous_totals: >-
      上一版记录 total_drifts=156 (26/19/111), 本次对照实测修复前为 137
      (26/0/111)。差值 19 系该报告生成时点 (2026-09-23) 的实现面状态与
      本次不同, 未复现; 但 26 条 declared_only 与 111 条 agora_impl_only
      均精确复现, 结论不受影响。
