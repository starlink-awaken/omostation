version: 1.0
description: "X1-X4 \u6CBB\u7406\u68C0\u67E5\u5668\u6CE8\u518C\u8868"
checkers:
- id: x1-audit-chain
  dimension: X1
  name: "\u5BA1\u8BA1\u94FE\u68C0\u67E5\u5668"
  description: "\u68C0\u67E5\u64CD\u4F5C\u662F\u5426\u5B89\u5168\uFF1A\u503A\u52A1\
    \u5BA1\u8BA1 + \u64CD\u4F5C\u5BA1\u8BA1"
  module: ecos.l0.governance.checkers
  class: X1AuditChainChecker
  type: python
  severity: high
  enabled: true
  schedule: daily
  owner: governance-team
  expected: All operations pass debt audit + operation audit (X1 audit chain)
  remediation: Investigate audit failure and apply targeted fix; re-run x1-audit-chain
- id: x2-staleness
  dimension: X2
  name: "\u6297\u71B5\u68C0\u67E5\u5668"
  description: "\u68C0\u67E5\u6570\u636E\u662F\u5426\u65B0\u9C9C\uFF1A\u503A\u52A1\
    \u65B0\u9C9C\u5EA6 + \u5065\u5EB7\u5EA6\u8D8B\u52BF"
  module: ecos.l0.governance.checkers
  class: X2StalenessChecker
  type: python
  severity: medium
  enabled: true
  schedule: daily
  owner: governance-team
  expected: All facts stay fresh per X2 freshness rules (debt freshness + health trend)
  remediation: Refresh stale facts via state sync; verify against x2-freshness-rules
- id: x3-value
  dimension: X3
  name: "\u4EF7\u503C\u6808\u68C0\u67E5\u5668"
  description: "\u68C0\u67E5\u6295\u5165\u662F\u5426\u5408\u7406\uFF1A\u503A\u52A1\
    \u4F18\u5148\u7EA7 + SLA \u8FBE\u6210"
  module: ecos.l0.governance.checkers
  class: X3ValueChecker
  type: python
  severity: medium
  enabled: true
  schedule: weekly
  owner: governance-team
  expected: Debt prioritized by value stack; SLA targets met (X3 value stack)
  remediation: Rebalance debt priorities against x3-value-stack; escalate SLA misses
- id: x4-consistency
  dimension: X4
  name: "\u4E00\u81F4\u6027\u68C0\u67E5\u5668"
  description: "\u68C0\u67E5\u89C4\u5219\u662F\u5426\u88AB\u9075\u5B88\uFF1ACI + pre-commit\
    \ + \u6587\u6863"
  module: ecos.l0.governance.checkers
  class: X4ConsistencyChecker
  type: python
  severity: high
  enabled: true
  owner: governance-team
  expected: All rules enforced by CI + pre-commit + doc checks (X4 consistency)
  remediation: Apply consistency rules via x4-consistency-rules; fix violation source
  schedule: daily
execution:
  parallel: true
  max_workers: 4
  timeout_seconds: 300
  retry:
    enabled: true
    max_retries: 2
    backoff_seconds: 5
alerting:
  channels:
  - type: log
    enabled: true
  - type: webhook
    enabled: false
    url: ''
  thresholds:
    critical: 1
    high: 3
    medium: 10
sla:
  X1:
    response_hours: 1
    resolution_hours: 24
  X2:
    response_hours: 24
    resolution_hours: 168
  X3:
    response_hours: 24
    resolution_hours: 168
  X4:
    response_hours: 24
    resolution_hours: 72
