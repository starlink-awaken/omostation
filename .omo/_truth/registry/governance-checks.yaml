    - draft
    - active
    - deprecated
    - superseded
    - removed
    executor_enum:
    - hook_pre_edit
    - hook_post
    - ci_gate
    - omo_audit
    - mcp_tool
    - mof_validate
    - mof_audit
    - evidence_smoke
    - radar_cron
    - gc_cron
    - gac_local_gate
    - foundry_cron
