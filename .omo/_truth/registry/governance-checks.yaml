  - id: CR-X4-HEALTH-SSOT
    dimension: X4
    layer: L2
    name: 健康分 SSOT
    description: health_score 唯一源 system.yaml, 文档用指针不复制
    check_type: ssot_pointer
    target: .omo/state/system.yaml::health_score
    forbid_copy_in:
    - CLAUDE.md
    - '**/*.md'
    - HEALTH_DASHBOARD.md
    executor:
    - hook_pre_edit
    - ci_gate
    - omo_audit
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0053
    enforcement: required
    source_ref: bin/mof/m4-health-score.py
    owner: governance-team
    expected: .omo/state/system.yaml::health_score is the unique source of truth;
      no markdown or other file may duplicate this value
    remediation: Remove duplicated value from markdown; reference the SSOT file instead
    related_runbooks: []
    added_at: '2026-08-28'
    review_before: '2026-12-13'
    justification: '[ADR-0431 D2] CR-X4-HEALTH-SSOT — 待补存在理由 (90 天内补齐)'
  - id: CR-M0-STAGE-GATE
    dimension: X4
    layer: M0
    name: M0 7 阶段 Stage/Gate 派生一致
