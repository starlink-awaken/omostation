status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-06-28
---
version: 1.0
description: X1-X4 治理检查器注册表
checkers:
- id: x1-audit-chain
  dimension: X1
  name: 审计链检查器
  description: 检查操作是否安全：债务审计 + 操作审计
  module: ecos.l0.governance.checkers
  class: X1AuditChainChecker
  type: python
  severity: high
  enabled: true
  schedule: daily
- id: x2-staleness
  dimension: X2
  name: 抗熵检查器
  description: 检查数据是否新鲜：债务新鲜度 + 健康度趋势
  module: ecos.l0.governance.checkers
  class: X2StalenessChecker
  type: python
  severity: medium
  enabled: true
  schedule: daily
- id: x3-value
  dimension: X3
  name: 价值栈检查器
  description: 检查投入是否合理：债务优先级 + SLA 达成
  module: ecos.l0.governance.checkers
  class: X3ValueChecker
  type: python
  severity: medium
  enabled: true
  schedule: weekly
- id: x4-consistency
  dimension: X4
  name: 一致性检查器
  description: 检查规则是否被遵守：CI + pre-commit + 文档
  module: ecos.l0.governance.checkers
  class: X4ConsistencyChecker
  type: python
  severity: high
  enabled: true
  schedule: daily
execution:
  parallel: true
  max_workers: 4
  timeout_seconds: 300
  retry:
    enabled: true
    max_retries: 2
    backoff_seconds: 5
alerting:
  channels:
  - type: log
    enabled: true
  - type: webhook
    enabled: false
    url: ''
  thresholds:
    critical: 1
    high: 3
    medium: 10
sla:
  X1:
    response_hours: 1
    resolution_hours: 24
  X2:
    response_hours: 24
    resolution_hours: 168
  X3:
    response_hours: 24
    resolution_hours: 168
  X4:
    response_hours: 24
    resolution_hours: 72
gac:
  version: '1.0'
  north_star: .omo/_knowledge/gac/NORTH-STAR.md
  adr: ADR-0106
  schema:
    required:
    - id
    - dimension
    - layer
    - check_type
    - executor
    - lifecycle
    - version
    - created_at
    source_type_enum:
    - native
    - indexed
    indexed_required:
    - source_ref
    dimension_enum:
    - X1
    - X2
    - X3
    - X4
    layer_enum:
    - M0
    - L0
    - L1
    - L2
    - L3
    - L4
    - I0
    - X
    - meta
    check_type_enum:
    - ssot_pointer
    - mof_stage_gate
    - bos_resolve
    - task_field
    - drift_audit
    - freshness
    - value_roi
    - audit_chain
    - direct_io_gate
    - hygiene_zero_byte
    - hygiene_case
    - legacy_index
    - schema_integrity
    - yaml_bypass
    - sensitive_write
    - mutation_surface
    - registry_integrity
    - internal_write_profile
    - state_plane_asset
    - ingress_boundary
    - ingress_artifact
    - mutation_ledger
    - doc_lifecycle
    - doc_archival
    - self_evolution_approval
    - task_policy
    - god_module
    - test_coverage
    - ssot_lint
    - mesh_routing
    - memory_rag
    - ingress_precheck
    - consistency_drift
    - eval_exec
    - mutable_default
    - placeholder
    lifecycle_enum:
    - draft
    - active
    - deprecated
    - superseded
    - removed
    executor_enum:
    - hook_pre_edit
    - hook_post
    - ci_gate
    - omo_audit
    - mcp_tool
    - mof_validate
    - mof_audit
    - evidence_smoke
    - radar_cron
    - gc_cron
    - gac_local_gate
    - foundry_cron
    - sweep_index_cli
  rules:
  - id: CR-X4-HEALTH-SSOT
    dimension: X4
    layer: L2
    name: 健康分 SSOT
    description: health_score 唯一源 system.yaml, 文档用指针不复制
    check_type: ssot_pointer
    target: .omo/state/system.yaml::health_score
    forbid_copy_in:
    - CLAUDE.md
    - '**/*.md'
    - HEALTH_DASHBOARD.md
    executor:
    - hook_pre_edit
    - ci_gate
    - omo_audit
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-M0-STAGE-GATE
    dimension: X4
    layer: M0
    name: M0 7 阶段 Stage/Gate 派生一致
    description: M1→M2→M3 派生必走 mof Stage/Gate (零风险派生)
    check_type: mof_stage_gate
    target: projects/model-driven (7 阶段引擎)
    executor:
    - mof_validate
    - mof_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-L0-BOS-RESOLVE
    dimension: X1
    layer: L0
    name: BOS 声明/执行一致
    description: BOS URI 声明必须 resolve (evidence-smoke 防 alive 标志假阳)
    check_type: bos_resolve
    target: projects/agora/etc/bos-services.yaml
    executor:
    - evidence_smoke
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-L2-TASK-DELIVERABLE
    dimension: X4
    layer: L2
    name: 任务 deliverable 文件路径必填
    description: OMO 任务必声明 deliverables (task-yaml-rules 规则 1)
    check_type: task_field
    target: .omo/tasks/**/*.yaml::deliverables
    executor:
    - omo_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-X2-GAC-DRIFT
    dimension: X2
    layer: meta
    name: GaC drift 自检 (注册表 vs 实际执行)
    description: '防 GaC 自己走偏: 注册表规则 vs hook/mcp/gate 实际注册, drift 告警 + 自愈'
    check_type: drift_audit
    target: governance-checks.yaml::gac.rules vs executor 实际注册
    executor:
    - radar_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-X1-AGENT-AUDIT
    dimension: X1
    layer: meta
    name: agent 操作审计链
    description: agent 编辑经 MCP/omo CLI, 自动记 AppendOnlyLog (可追溯)
    check_type: audit_chain
    target: runtime/omo/_delivery/ingress/ingress-trail.jsonl
    executor:
    - mcp_tool
    - omo_audit
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-X3-DEBT-TIER
    dimension: X3
    layer: L2
    name: 债务 X3 tier 必声明
    description: debt items 必声明 x3_tier (价值分级, 投入产出可量化)
    check_type: value_roi
    target: .omo/debt/items/*.yaml::x3_tier
    executor:
    - omo_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-26'
    adr: ADR-0106
  - id: CR-L1-RUNTIME-HEALTH
    dimension: X2
    layer: L1
    name: 运行时健康监控新鲜
    description: runtime 健康监控数据新鲜 (不超 24h, X2 抗熵)
    check_type: freshness
    target: projects/runtime (健康监控)
    executor:
    - omo_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-L3-COCKPIT-ENTRY
    dimension: X4
    layer: L3
    name: cockpit 唯一人类 CLI 入口
    description: cockpit 是唯一人类 CLI/Web 入口 (其他 CLI 程序接口, X4 一致)
    check_type: ssot_pointer
    target: projects/cockpit (唯一入口)
    executor:
    - omo_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-L2-DIRECT-IO
    dimension: X1
    layer: L2
    name: .omo 直写拦截 (走 omo ingress, 禁原生 write_text/mkdir)
    description: 禁止绕过 omo ingress 直写 .omo (防状态竞态死锁, 报告债务① Critical)
    check_type: direct_io_gate
    target: .omo/ (omo lint direct-omo-io gate)
    executor:
    - ci_gate
    - omo_audit
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-HYG-01
    dimension: X4
    layer: meta
    name: 0 字节文件检查 (防空文件污染)
    description: pre-commit 扫描 0 字节文件 (报告建议3 CR-HYG-01)
    check_type: hygiene_zero_byte
    target: '**/* (0 字节文件)'
    executor:
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-HYG-02
    dimension: X4
    layer: meta
    name: 大小写 inode 一致 (防 APFS plan/Plans 混淆)
    description: pre-commit 大小写拼写一致性 (报告建议3 CR-HYG-02, APFS case-insensitive)
    check_type: hygiene_case
    target: '**/* (大小写 inode 冲突)'
    executor:
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-X4-DOC-SSOT
    dimension: X4
    layer: meta
    name: 文档 SSOT (markdown 禁硬编码项目元数据, 引用 project-registry)
    description: markdown 禁硬编码 (包数/版本/Phase/健康分), 引用 docs/project-registry.yaml (bin/ssot/doc-ssot-lint.py 扫描)
    check_type: ssot_pointer
    target: docs/project-registry.yaml + bin/ssot/doc-ssot-lint.py 扫描范围
    forbid_copy_in:
    - AGENTS.md
    - CLAUDE.md
    - '**/README.md'
    - LAYER-INDEX.md
    executor:
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-L2-SURFACES-INTEGRITY
    dimension: X4
    layer: L2
    name: governance surfaces 面定义完整 (state/kernel/ingress plane)
    description: omo-governance-surfaces.yaml 面定义权威 (plane 资产归属), GaC 引用不复制; omo governance surfaces 校验完整
    check_type: ssot_pointer
    target: .omo/_truth/registry/omo-governance-surfaces.yaml::governance_stack
    executor:
    - omo_audit
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-L2-MUTATION-BROKER
    dimension: X1
    layer: L2
    name: mutation surfaces broker 写权限注册 (非 broker 禁写)
    description: mutation-surfaces.yaml broker 注册权威 (entrypoint+target+mode), workspace governance verify 校验; 非 broker 写 .omo
      = 违规
    check_type: audit_chain
    target: .omo/_truth/registry/mutation-surfaces.yaml::surfaces
    executor:
    - omo_audit
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-L0-PROTOCOLS-SSOT
    dimension: X4
    layer: L0
    name: protocols 注册表 SSOT (端口/vault/x-axis 禁硬编码)
    description: protocols/{port,vault-paths,x-axis}-registry.yaml 协议层 SSOT, markdown/代码禁硬编码端口号; scripts/check-vault-paths.py
      CI 校验
    check_type: ssot_pointer
    target: protocols/port-registry.yaml + vault-paths.yaml + x-axis-registry.yaml
    forbid_copy_in:
    - '**/*.md'
    - '**/*.py'
    executor:
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-X2-GAC-BOOTSTRAP
    dimension: X2
    layer: meta
    name: GaC 自举递归 (工具活/indexed 完整/exec 有效/schema 自洽)
    description: 'GaC 治一切, GaC 自己也要被治 (NORTH-STAR 元治理递归); bin/gac/gac-bootstrap.py 检测 4 层: 工具活/死 + indexed source_ref 完整 +
      executor 执行有效 + schema 自洽'
    check_type: drift_audit
    target: bin/gac/gac-bootstrap.py (GaC 自身完整性自检)
    executor:
    - ci_gate
    - radar_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-X2-GAC-EXEC-DRIFT
    dimension: X2
    layer: meta
    name: GaC executor 注册 drift (声明 vs 实际存在)
    description: GaC 规则声明 executor (ci_gate/omo_audit/evidence_smoke 等), 验证实际存在 (文件/命令/CI workflow); bin/gac/gac-executor.py
      检测 missing executor = 规则声明不存在的执行器
    check_type: drift_audit
    target: bin/gac/gac-executor.py (executor 声明 vs 实际存在性)
    executor:
    - ci_gate
    - foundry_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-06-27'
    adr: ADR-0106
  - id: CR-X2-GOVERNANCE-SEMANTIC-GATE
    dimension: X2
    layer: meta
    name: 治理语义门禁统一契约
    description: '防声明/执行语义错位: 本地 gate 不只看 exit code, 还消费 gac-bootstrap/gac-executor/gac-mof-validate/mof-schema/adr-coverage/AGCP/package
      的 JSON ok 字段; release 模式硬挡 active runs 和 release package 未决. PR #17 落地工具 (bin/gac/governance-semantic-gate.py), M1 实例同步派生,
      但 registry SSOT 漏登记 — 本 commit 补.'
    check_type: schema_integrity
    target: bin/gac/governance-semantic-gate.py (统一消费治理工具 JSON 语义)
    executor:
    - ci_gate
    - gac_local_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0121
  - id: CR-X1-EVIDENCE-RUNNABLE
    dimension: X1
    layer: meta
    name: GaC 声明可执行证据 (声明绿必须真跑过)
    description: '防元治理盲区: CR-X2-GAC-EXEC-DRIFT 验 ''executor 文件存在'' 不够, 需证据证明 ''executor 真能跑出结果''. 元规则: 任何声明的 executor (尤其
      evidence_smoke/mcp_tool/mof_validate 等低频/人工触发型) 必须在最近 N 天内有 evidence 落盘 (./omo/_delivery/evidence-smoke/<date>.json
      等), 否则标 ghost executor. P2-1 (2026-07-02) — 实现见 radar_cron 周期检查 + ci_gate 兜底'
    check_type: audit_chain
    target: 'executor_evidence_manifest: .omo/_delivery/evidence-smoke/<date>.json + .omo/_log/mof-validate.jsonl'
    executor:
    - foundry_cron
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0106
  - id: CR-L0-BOS-DOMAIN-NORM
    dimension: X4
    layer: L0
    name: BOS URI 5 域锁定 + kind 标签
    description: '防 BOS 域越界 + 协议漂移: eCOS v6 锁定 5 主域 (memory/governance/analysis/persona/capability), 扩展域 (meta/omo/swarm/system/toolbox)
      走 kind:bridge|facet. 跨域越界需在 .omo/standards/bos-uri-domain-standard.md 登记, 不可直接 commit. 标准: docs/PANORAMA.md + .omo/standards/bos-uri-domain-standard.md
      (P2-2 2026-07-02)'
    check_type: bos_resolve
    target: projects/agora/etc/bos-services.yaml + .omo/standards/bos-uri-domain-standard.md
    executor:
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0106
  - id: CR-META-BIN-NAMING
    dimension: X4
    layer: meta
    name: bin 工具命名空间一致
    description: '防命名漂移: bin/*.py 工具按域归类共享单前缀 (gac-/governance-/adr-/doc-/x2-/auto-merge-/submodule- 等), 禁止短前缀 gov- 代替 governance-.
      命名迁移计划见 ADR-0115 Phase 2 (gov-history-stats → governance-history-stats). 标准: .omo/standards/bin-tool-naming.md'
    check_type: registry_integrity
    target: .omo/standards/bin-tool-naming.md + bin/*.py
    executor:
    - ci_gate
    - radar_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0106
  - id: CR-META-BIN-ORPHAN
    dimension: X1
    layer: meta
    name: bin 工具未接 caller drift (工具存在但 0 caller)
    description: '防元治理盲区 2.0: bin/*.py 工具应至少有一个 caller (Makefile / .github/workflows/ / pre-commit / gac-local-gate.py::CHECKS
      / docs 之一). 0 caller 工具落入''声明/执行鸿沟'' (同 CR-X1-EVIDENCE-RUNNABLE 警示). 当前已知 8 个 check-* 工具 0 caller 待 ADR-0115 Phase 3
      评估接入. 实现: bin/gac/gac-executor.py 扩展检查 ''caller 引用'' 而非仅 ''文件存在'''
    check_type: drift_audit
    target: 'bin/gac/gac-executor.py (扩展: 检查 bin/*.py 是否有 caller 引用)'
    executor:
    - ci_gate
    - radar_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0106
  - id: CR-P74-STATE-PROJECTION-GUARD
    dimension: X4
    layer: meta
    name: Runtime projection path consistency guard (P74, ADR-0130)
    description: 'P74 §2 鸿沟回收: 治 P71 类 A 复发. 验证 runtime-projections.yaml 声明的 canonical 路径存在且 parse OK, pending projection
