version: 1.0
description: X1-X4 治理检查器注册表
checkers:
- id: x1-audit-chain
  dimension: X1
  name: 审计链检查器
  description: 检查操作是否安全：债务审计 + 操作审计
  module: ecos.l0.governance.checkers
  class: X1AuditChainChecker
  type: python
  severity: high
  enabled: true
  schedule: daily
  owner: governance-team
  expected: All operations pass debt audit + operation audit (X1 audit chain)
  remediation: Investigate audit failure and apply targeted fix; re-run x1-audit-chain
- id: x2-staleness
  dimension: X2
  name: 抗熵检查器
  description: 检查数据是否新鲜：债务新鲜度 + 健康度趋势
  module: ecos.l0.governance.checkers
  class: X2StalenessChecker
  type: python
  severity: medium
  enabled: true
  schedule: daily
  owner: governance-team
  expected: All facts stay fresh per X2 freshness rules (debt freshness + health trend)
  remediation: Refresh stale facts via state sync; verify against x2-freshness-rules
- id: x3-value
  dimension: X3
  name: 价值栈检查器
  description: 检查投入是否合理：债务优先级 + SLA 达成
  module: ecos.l0.governance.checkers
  class: X3ValueChecker
  type: python
  severity: medium
  enabled: true
  schedule: weekly
  owner: governance-team
  expected: Debt prioritized by value stack; SLA targets met (X3 value stack)
  remediation: Rebalance debt priorities against x3-value-stack; escalate SLA misses
- id: x4-consistency
  dimension: X4
  name: 一致性检查器
  description: 检查规则是否被遵守：CI + pre-commit + 文档
  module: ecos.l0.governance.checkers
  class: X4ConsistencyChecker
  type: python
  severity: high
  enabled: true
  owner: governance-team
  expected: All rules enforced by CI + pre-commit + doc checks (X4 consistency)
  remediation: Apply consistency rules via x4-consistency-rules; fix violation source
  schedule: daily
execution:
  parallel: true
  max_workers: 4
  timeout_seconds: 300
  retry:
    enabled: true
    max_retries: 2
    backoff_seconds: 5
alerting:
  channels:
  - type: log
    enabled: true
  - type: webhook
    enabled: false
    url: ''
  thresholds:
    critical: 1
    high: 3
    medium: 10
sla:
  X1:
    response_hours: 1
    resolution_hours: 24
  X2:
    response_hours: 24
    resolution_hours: 168
  X3:
    response_hours: 24
    resolution_hours: 168
  X4:
    response_hours: 24
    resolution_hours: 72
gac:
  version: '1.0'
  north_star: .omo/_knowledge/gac/NORTH-STAR.md
  adr: ADR-0106
  schema:
    required:
    - id
    - dimension
    - layer
    - check_type
    - executor
    - lifecycle
    - version
    - created_at
    source_type_enum:
    - native
    - indexed
    indexed_required:
    - source_ref
    dimension_enum:
    - X1
    - X2
    - X3
    - X4
    layer_enum:
    - M0
    - L0
    - L1
    - L2
    - L3
    - L4
    - I0
    - X
    - meta
    check_type_enum:
    - ssot_pointer
    - mof_stage_gate
    - bos_resolve
    - task_field
    - drift_audit
    - freshness
    - value_roi
    - audit_chain
    - direct_io_gate
    - hygiene_zero_byte
    - hygiene_case
    - legacy_index
    - schema_integrity
    - yaml_bypass
    - sensitive_write
    - mutation_surface
    - registry_integrity
    - internal_write_profile
    - state_plane_asset
    - ingress_boundary
    - ingress_artifact
    - mutation_ledger
    - doc_lifecycle
    - doc_archival
    - self_evolution_approval
    - task_policy
    - god_module
    - test_coverage
    - ssot_lint
    - mesh_routing
    - memory_rag
    - ingress_precheck
    - consistency_drift
    - eval_exec
    - mutable_default
    - placeholder
