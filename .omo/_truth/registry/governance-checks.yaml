    check_type: god_module
    target: bin/ssot/check-god-module.py --strict (新文件 > 1500L 阻塞, 已有文件仅 warn)
    executor:
    - ci_gate
    - radar_cron
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-02'
    adr: ADR-0106
  - id: CR-DOC-NO-LAST-UPDATED
