    - ci_gate
    - radar_cron
    lifecycle: active
    version: 1.1.0
    created_at: '2026-07-03'
    adr: ADR-0130
  - id: CR-P74-WORKFLOW-SILENCE
    dimension: X1
    layer: meta
    name: Workflow silence detection (P74, ADR-0130)
    description: 'P74 §4.4 A2: workflow 30d 内 0 触发 → warn. 通过 agent-workflow compliance p74_solidification 段输出. 防 P71 类 C
