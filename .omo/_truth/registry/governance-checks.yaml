    check_type: audit_chain
    target: .omo/_truth/registry/agent-workflows::silent_workflow_policy + bin/agent-workflow.py
    executor:
    - ci_gate
    - evidence_smoke
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-03'
    adr: ADR-0130
  - id: CR-P74-WORKFLOW-SUGGEST
    dimension: X3
    layer: meta
    name: Workflow routing advisory suggest (P74, ADR-0130)
    description: 'P74 §3 错位路由纠正: 给出 changes 期望走的 workflow 建议. advisory only, 不强制. 实现: bin/agent-workflow.py suggest --from-diff'
    check_type: registry_integrity
    target: .omo/_truth/registry/agent-workflows + bin/agent-workflow.py
    executor:
    - mcp_tool
    - ci_gate
    lifecycle: active
    version: 1.0.0
    created_at: '2026-07-03'
    adr: ADR-0130
  - id: CR-X1-GOD-MODULE-LIMIT
    dimension: X1
    layer: L2
    name: god-module 文件行数上限 (新代码 > 1500L 阻塞)
    description: '防 god module 漂移: 当前已知 7 文件 > 1500L (gbrain 重灾区) + 51 文件 > 800L, 大多数是历史累积. 新代码不许引入 > 1500L 文件 (P0 audit 2026-07-02).
      实现: bin/ssot/check-god-module.py 扩展 --strict 模式, 新加文件 > 1500L 返回 exit 1. 已有 god module 走 ADR-0115 渐进拆分 (单仓 / 跨仓分别由对应模块
