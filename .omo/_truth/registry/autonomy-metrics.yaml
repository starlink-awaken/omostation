status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-08-08
---
version: 1
description: 自主度评估5维度指标定义 (ADR-0403 P3)

dimensions:
  adaptivity:
    weight: 0.25
    description: "学习曲线 — agent随时间是否产出更多非noop行为"
    source: agent-tick-daemon.jsonl
    metric: non_noop_rate
    formula: "non_noop_ticks / total_ticks"

  retention:
    weight: 0.20
    description: "记忆保留率 — 多少记忆是活跃的(非archived)"
    source: mos://agent_skills + mos://agent_experiences
    metric: active_memory_ratio
    formula: "active_items / total_items"

  generalization:
    weight: 0.20
    description: "跨域能力 — agent在多少不同领域有calibration数据"
    source: mos://capability_calibrations
    metric: domain_coverage
    formula: "unique_capability_refs / expected_domains"

  efficiency:
    weight: 0.15
    description: "资源效率 — PR审查通过率 + autoloop成功率"
    source: verify.py + autoloop-controller
    metric: success_rate
    formula: "passed_verifications / total_verifications"

  safety:
    weight: 0.20
    description: "安全合规 — constraint-gate通过率 + 0违规"
    source: constraint-gate + governance-checks
    metric: compliance_rate
    formula: "allowed_actions / total_gates"

thresholds:
  auto_merge_min: 0.8
  human_review: 0.5
  alert_below: 0.3
