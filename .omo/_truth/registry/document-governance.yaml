---
status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-08-27
---

version: 1
description: Document ownership, lifecycle, freshness, and discoverability policy.

metadata:
  valid_statuses: [draft, active, stale, superseded, archived, deprecated, experimental, planned, retired]
  valid_lifecycles: [ssot, entry, contract, pattern, plan, history, generated, spec, experimental, stable, report, proposal, retired]
  required_frontmatter: [status, lifecycle, owner, last-reviewed]
  date_format: YYYY-MM-DD

surfaces:
  - id: root-entry
    patterns:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - ARCHITECTURE.md
      - LAYER-INDEX.md
      - docs/SYSTEM-INDEX.md
      - docs/INDEX-*.md
    owner: governance-team
    lifecycle: entry
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: external
    review_days: 30
    workflow: project-doc-change

  - id: omo-standards
    patterns:
      - .omo/standards/*.md
    owner: governance-team
    lifecycle: contract
    ssot: .omo/standards/doc-ssot-contract.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: project-doc-change

  - id: omo-truth-docs
    patterns:
      - .omo/_truth/*.md
    owner: governance-team
    lifecycle: ssot
    ssot: .omo/_truth/INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: governance-state-mutation

  - id: omo-knowledge
    patterns:
      - .omo/_knowledge/**/*.md
    excludes:
      - .omo/_knowledge/audits/**
      - .omo/_knowledge/decisions/**
      - .omo/_knowledge/management/**
      - .omo/_knowledge/decision-proposals/**
    owner: governance-team
    lifecycle: history
    ssot: docs/INDEX-KNOWLEDGE.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    workflow: project-doc-change

  - id: docs-discoverable
    patterns:
      - docs/**/*.md
    excludes:
      - docs/generated/**
      - docs/closeout/**
      - docs/reports/**
      - docs/superpowers/specs/**
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    discoverability: directory-index
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: accepted-specifications
    patterns:
      - docs/superpowers/specs/*.md
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    valid_statuses: [accepted, draft, superseded, deprecated, active]
    valid_lifecycles: [spec, contract]
    review_days: 180
    discoverability: directory-index
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: project-entry
    patterns:
      - projects/*/AGENTS.md
      - projects/*/CLAUDE.md
      - projects/*/ARCHITECTURE.md
      - projects/*/BOUNDARY.md
      - projects/*/GOVERNANCE.md
    owner: project-owner
    lifecycle: entry
    ssot: docs/project-registry.yaml
    verifier: bin/ssot/doc-governance-check.py
    metadata: external
    review_days: 90
    workflow: project-doc-change

rules:
  missing_frontmatter:
    severity: warning
  malformed_frontmatter:
    severity: error
  invalid_metadata:
    severity: warning
  stale_review:
    severity: warning
  orphan_document:
    severity: warning
  missing_index:
    severity: error

warning_exceptions:
  version: 2
  generated: 2026-08-27
  policy: no-new-warnings
  entries:
    - id: legacy-omo-knowledge-frontmatter
      rule: missing_frontmatter
      surface: omo-knowledge
      max_findings: 120
      expires: 2026-10-31
      owner: governance-team
      reason: Legacy knowledge documents being migrated to frontmatter contract.
    - id: legacy-omo-knowledge-enums
      rule: invalid_metadata
      surface: omo-knowledge
      max_findings: 30
      expires: 2026-10-31
      owner: governance-team
      reason: Historical lifecycle values require explicit mapping to current enum.
    - id: concurrent-plans-orphan-docs
      rule: orphan_document
      surface: docs-discoverable
      max_findings: 15
      expires: 2026-10-31
      owner: governance-team
      reason: >
        ADR-0384 concurrent docs/plans migration plus BET-Y1Q1-T6-01 deferred
        Phase-numbering rewrite. 2026-08-27 健康域 P1 新增 4 场景卡 + 并行 agent
        新增文档推高 orphan 计数 (actual=13)。Revisit 2026-10-31.
      reason: Existing document status/lifecycle values require explicit migration decisions.
