---
status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-11-09
---

version: 1
description: Document ownership, lifecycle, freshness, and discoverability policy.

metadata:
  valid_statuses: [draft, active, stale, superseded, archived, deprecated, experimental, planned]
  valid_lifecycles: [ssot, entry, contract, pattern, plan, history, generated, spec]
  required_frontmatter: [status, lifecycle, owner, last-reviewed]
  date_format: YYYY-MM-DD
  # ⚠️ `valid_review_states` **故意不声明** —— 不是漏了, 别「好心」补。
  #
  # `bin/ssot/doc-governance-check.py` 里有 review-state 校验机制
  # (`valid_review_states` + review-state/metadata-migrated-at/content-reviewed-at 联动),
  # 它读的正是本块的 `metadata.valid_review_states`。本块不声明 ⇒ 该机制整段不触发
  # (代码守卫是 `if valid_review_states and review_state is not None:`)。
  #
  # 不声明的理由 (2026-11-09 全量普查, 排除 .worktrees/ 副本后的仓内实数):
  # `review-state` 字段在 **90 份文档**里实际用到 **15 种取值**, 而代码只认其中 2 种:
  #   metadata-only        67    ← 代码认, 要求 metadata-migrated-at
  #   content-reviewed      5    ← 代码认, 要求 content-reviewed-at
  #   user-authorized       4    content-reviewed-20260817   3
  #   contract-reviewed     1    content-reviewed-20260917   1
  #   plan-mainline-adr-0410 1   scenario-first-converged    1
  #   draft-for-human-decision 1  evidence-refreshed         1
  #   superseded-by-plan      1  verified-v3                 1
  #   metadata-fresh          1  evidence-based-audit        1
  #   reconciled              1
  # 后面 13 种是一次性历史标记 (带日期/ADR 号/场景名/动作名), 不是可复用的审查态枚举。
  # 把它声明成枚举会变成 whack-a-mole: 要么只列一部分 ⇒ 其余文档当场 invalid;
  # 要么全列 ⇒ 把一次性标记固化成「标准」, 以后每加一个标记都要改注册表。
  # 这与 orphan_document 退役 (2026-10-06, ADR-0464 R2) 是同一判断: 语义没有清晰的
  # 机检定义前, 不重建规则。
  #
  # 若将来确实要启用: 先与 governance-team 敲定 review-state 的**封闭枚举**(而不是
  # 把现存的 15 种抄进来), 再在本块声明, 并同步代码对每个状态要求的伴生日期字段。
  # 在敲定之前, 现存文档的 review-state 值不受本机检约束 —— 这是**明知的**状态。

surfaces:
  - id: root-entry
    patterns:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - ARCHITECTURE.md
      - LAYER-INDEX.md
    owner: governance-team
    lifecycle: entry
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    # 2026-11-09: metadata external -> frontmatter。原值让**全部** metadata 检查
    # (missing/malformed/invalid + stale_review) 在 `if surface["metadata"] == "frontmatter"`
    # 守卫下静默跳过 —— 本 surface 的 review_days: 30 因此是纯声明零执行 (DECL_EXEC_GAP)。
    # 逐条核对: 五份文档 frontmatter 的 status/lifecycle/owner/last-reviewed 齐备且取值合法。
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 30
    workflow: project-doc-change

  - id: root-index
    patterns:
      - docs/SYSTEM-INDEX.md
      - docs/INDEX-*.md
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    # 2026-11-09 从 root-entry 拆出并**激活执行**。拆因: 这批文档的 lifecycle 是
    # history / generated / contract, 套 30 天 SLA 与 X2-C05 同类校准错误 ——
    # 生成物的新鲜度来自重新生成 (INDEX-PROJECTS/TOOLS 已由生成器盖日期), 历史/契约
    # 文档在本 registry 其他 surface 一律 180d。拆出后仍受 stale_review 执行, 只是
    # 节奏校准到 180d; 不是放宽, 是把死声明换成真声明。
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    workflow: project-doc-change

  - id: omo-standards
    patterns:
      - .omo/standards/*.md
    owner: governance-team
    lifecycle: contract
    ssot: .omo/standards/doc-ssot-contract.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: project-doc-change

  - id: omo-truth-docs
    patterns:
      - .omo/_truth/*.md
    owner: governance-team
    lifecycle: ssot
    ssot: .omo/_truth/INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: governance-state-mutation

  - id: omo-knowledge
    patterns:
      - .omo/_knowledge/**/*.md
    excludes:
      - .omo/_knowledge/audits/**
      - .omo/_knowledge/decisions/**
      - .omo/_knowledge/management/**
      - .omo/_knowledge/decision-proposals/**
      - .omo/_knowledge/design/plans/archive/**
      - .omo/_knowledge/sediment/**
    owner: governance-team
    lifecycle: history
    ssot: docs/INDEX-KNOWLEDGE.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    workflow: project-doc-change

  - id: docs-discoverable
    patterns:
      - docs/**/*.md
    excludes:
      - docs/generated/**
      - docs/closeout/**
      - docs/reports/**
      - docs/superpowers/specs/**
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    discoverability: index-exists  # M2 (2026-10-06): orphan_document 已退役 (R2), directory-index 语义不再由任何检查实现; 该字段现只驱动 missing_index (index 文件存在性) 检查
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: accepted-specifications
    patterns:
      - docs/superpowers/specs/*.md
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    valid_statuses: [accepted, draft, superseded, deprecated, active]
    valid_lifecycles: [spec, contract]
    review_days: 180
    discoverability: index-exists  # M2 (2026-10-06): 同上 — 只驱动 missing_index, 不再声称 orphan 检测
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: project-entry
    patterns:
      - projects/*/AGENTS.md
      - projects/*/CLAUDE.md
      - projects/*/ARCHITECTURE.md
      - projects/*/BOUNDARY.md
      - projects/*/GOVERNANCE.md
    owner: project-owner
    lifecycle: entry
    ssot: docs/project-registry.yaml
    verifier: bin/ssot/doc-governance-check.py
    # 2026-11-09: metadata external -> frontmatter。与 root-entry 同因 —— 原值让全部
    # metadata 校验 (含 stale_review) 落在 `if surface["metadata"] == "frontmatter"`
    # 守卫内被静默跳过, 本 surface 的 review_days: 90 因此是纯声明零执行。
    # 这是全仓**最后一个**非 frontmatter 型 surface; 激活后 missing_frontmatter
    # 立即从 0 变 71 (见 warning_exceptions 的 legacy-project-entry-frontmatter)。
    # stale_review 实测 0 命中: 70 份文档里没有任何一份 last-reviewed 超过 90 天。
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: project-doc-change

rules:
  missing_frontmatter:
    severity: warning
  malformed_frontmatter:
    severity: error
  invalid_metadata:
    severity: warning
  stale_review:
    severity: warning
  # orphan_document REMOVED 2026-10-06 (ADR-0464 治理门禁覆盖审计修复波 R2):
  # _is_discoverable() 以无条件 return True 结尾, finding 永不触发, 声明即假覆盖。
  # 不重建规则: docs/-prefix 口径反复 (2026-08-27) 证明"可发现性"语义没有
  # 明确的机检定义前重建只会继续 whack-a-mole (见 ADR-0464 盲区二/审计修复波 R2)。
  # 相应的 warning_exceptions 条目 concurrent-plans-orphan-docs 也已删除。
  missing_index:
    severity: error

warning_exceptions:
  version: 1
  generated: 2026-07-31
  policy: no-new-warnings
  entries:
  # 2026-11-09 逐桶实测（bin/ssot/doc-governance-check.py --json --no-new-warnings --scope tracked，
  # files_scanned=4796，读数取自该 JSON 的 warning_baseline.observed / .budgets 两栏）：
  #   missing_frontmatter:omo-knowledge        18 / 120    missing_frontmatter:docs-discoverable   2 / 175
  #   invalid_metadata:omo-knowledge           20 /  75    invalid_metadata:docs-discoverable      3 /  24
  #   invalid_metadata:accepted-specifications  1 /   2
  #   missing_frontmatter:project-entry         71 /  80   ← 2026-11-09 新增桶（见下）
  # 较 2026-11-02 读数：invalid_metadata:omo-knowledge 14→20、invalid_metadata:docs-discoverable 2→3，
  # 均在各自预算内（75 / 24），故未动 max_findings。
  # missing_frontmatter:project-entry 的 71 是 **pin 实测**（`git ls-tree HEAD projects/` 取 14 个
  # gitlink 的 pin，再 `git -C <sub> show <pin>:<file>` 逐份读，不动工作区）：68 份 pinned 文档里
  # 0 份合规，其中 3 份（cockpit-ui 的 AGENTS/ARCHITECTURE/BOUNDARY）完全无 frontmatter（2 findings/份），
  # 其余 65 份各 1 finding。工作区实测 70 份文件同结构（4 个 `+` 子模块的新增文件不改变缺口形状）。
  # 该桶由 legacy-project-entry-frontmatter 覆盖（max 80，含 9 条余量，同 actual=117/max=120 口径）。
  # 2026-11-02 据此删掉命中为 0 的三条（legacy-omo-truth-frontmatter / legacy-omo-standards-frontmatter /
  # legacy-omo-standards-enums）：它们已经不压制任何现存告警，但会在窗口内继续压制未来新增的
  # 无 frontmatter 文档，删掉是 shrink_only 方向上的收紧，不是放宽。
  # 2026-11-09 同一口径删掉 stale-omo-truth-docs-review：它压制的两条 omo-truth-docs 文档
  # （.omo/_truth/registry/omo-audit-rule-map.md 与 phase-escapes/README.md）已在本轮真复审中
  # 更新 last-reviewed（2026-07-31 → 2026-11-09），命中 2 → 0，该预算不再压制任何现存告警；
  # 留着它反而制造 2026-11-30 的集体过期炸点（expires 一到即 expired_warning_exception error）。
  # 其余条目 max_findings 与 expires 一字未动（窗口 2027-01-31 由 #4995 定下）。
  # ⚠️ bin/gac/check-expiry-radar.py 只看 surfaces[].review_days 与 X2 规则，**不看 warning_exceptions
  # 的 expires** —— 2026-10-31 那一次集体过期就是零预警跨零点的（8 条同日到点，gac-gate /
  # interface-check / doc-freshness 三条腿同红）。续期时先跑上面那条命令取读数，别照抄旧数。
    - id: legacy-omo-knowledge-frontmatter
      rule: missing_frontmatter
      surface: omo-knowledge
      max_findings: 120  # 2026-08-18 116→120: Y1Q4-T6-01 dedup-ledger + bus_adapter 归档新增推高计数 (actual=117)
      expires: 2027-01-31
      owner: governance-team
      reason: Legacy knowledge documents are being migrated to the frontmatter contract. Budget raised to 90 (2026-08-09) to accommodate new BET retro stub files created as part of D5 retro-due gate work (ADR-0404).
    - id: legacy-docs-frontmatter
      rule: missing_frontmatter
      surface: docs-discoverable
      max_findings: 175  # 2026-08-18 170→175: Y1Q4-T6-01 dedup-ledger + bus_adapter 归档新增推高计数 (actual=171)
      expires: 2027-01-31
      owner: governance-team
      reason: "Existing discoverable docs need frontmatter migration and index review. 2026-08-17 三调 127→135: 并发 agent 批量新增 legacy 标准累积超支 (132 轮)."
    - id: legacy-omo-knowledge-enums
      rule: invalid_metadata
      surface: omo-knowledge
      max_findings: 75  # 2026-09-27 70→75: auto-bump (governance 增量)
      # auto-bumped to 75 on 2026-09-27
      expires: 2027-01-31
      owner: governance-team
      reason: Historical lifecycle values require explicit mapping to the current enum.
    - id: legacy-docs-enums
      rule: invalid_metadata
      surface: docs-discoverable
      max_findings: 24  # 2026-08-26 16→24: T1-12 收口修复后 CI 实测 17, 并发窗口抖动留余量; T1-12 closeout 修复 value-evidence 残损 frontmatter 后暴露存量 enum 违例 (actual=16)
      expires: 2027-01-31
      owner: governance-team
      reason: Existing document status/lifecycle values require explicit migration decisions.
    - id: accepted-specs-invalid-metadata
      rule: invalid_metadata
      surface: accepted-specifications
      max_findings: 2
      expires: 2027-01-31
      owner: governance-team
      reason: Newly created specs may have last-reviewed set to creation date which CI flags as future-dated.
    - id: legacy-project-entry-frontmatter
      rule: missing_frontmatter
      surface: project-entry
      max_findings: 80
      expires: 2027-03-31
      owner: governance-team
      reason: |
        2026-11-09 激活 project-entry 的 90 天 SLA 时实测的存量债务 (本 surface 此前是
        metadata: external, 全部 metadata 校验被静默跳过, 故这批缺口不可见)。

        实测读数 (2026-11-09, 主检出 + 其 pin 的子模块): 本 surface 覆盖 70 份文档,
        分布在 18 个子模块仓; 完全合规仅 2 份。缺口分布:
          - 68 份缺 status + lifecycle (1 finding/份)
          - 其中 3 份 (cockpit-ui 的 AGENTS/ARCHITECTURE/BOUNDARY) 完全没有 frontmatter
            (2 findings/份)
        ⇒ missing_frontmatter:project-entry 实测 71 条; 本预算 max_findings 取 80 (含 9 条余量,
        与 legacy-omo-knowledge-frontmatter 的 actual=117/max=120 同口径)。

        stale_review:project-entry 实测 **0** 命中 —— 70 份里没有任何一份 last-reviewed
        超过 90 天, 故本条只覆盖 missing_frontmatter 一个桶。

        max_findings 是**界**不是豁免: 新增不合规的项目入口文档会当场把它顶穿。
        清偿路径 = 逐批修子模块文档 (每个仓 commit + push + 父仓 gitlink bump),
        修一批计数就降一批; 修完即可删本条 (shrink_only 方向)。
        expires 取 2027-03-31 而非其他 legacy 条的 2027-01-31, 因为清偿要跨 18 个
        独立子模块仓、每仓一次三步提交, 比仓内文档改动的窗口天然更长。
