---
status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-11-03
---

version: 1
description: Document ownership, lifecycle, freshness, and discoverability policy.

metadata:
  valid_statuses: [draft, active, stale, superseded, archived, deprecated, experimental, planned]
  valid_lifecycles: [ssot, entry, contract, pattern, plan, history, generated, spec]
  required_frontmatter: [status, lifecycle, owner, last-reviewed]
  date_format: YYYY-MM-DD

surfaces:
  - id: root-entry
    patterns:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - ARCHITECTURE.md
      - LAYER-INDEX.md
      - docs/SYSTEM-INDEX.md
      - docs/INDEX-*.md
    owner: governance-team
    lifecycle: entry
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: external
    review_days: 30
    workflow: project-doc-change

  - id: omo-standards
    patterns:
      - .omo/standards/*.md
    owner: governance-team
    lifecycle: contract
    ssot: .omo/standards/doc-ssot-contract.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: project-doc-change

  - id: omo-truth-docs
    patterns:
      - .omo/_truth/*.md
    owner: governance-team
    lifecycle: ssot
    ssot: .omo/_truth/INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 90
    workflow: governance-state-mutation

  - id: omo-knowledge
    patterns:
      - .omo/_knowledge/**/*.md
    excludes:
      - .omo/_knowledge/audits/**
      - .omo/_knowledge/decisions/**
      - .omo/_knowledge/management/**
      - .omo/_knowledge/decision-proposals/**
      - .omo/_knowledge/design/plans/archive/**
      - .omo/_knowledge/sediment/**
    owner: governance-team
    lifecycle: history
    ssot: docs/INDEX-KNOWLEDGE.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    workflow: project-doc-change

  - id: docs-discoverable
    patterns:
      - docs/**/*.md
    excludes:
      - docs/generated/**
      - docs/closeout/**
      - docs/reports/**
      - docs/superpowers/specs/**
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    review_days: 180
    discoverability: index-exists  # M2 (2026-10-06): orphan_document 已退役 (R2), directory-index 语义不再由任何检查实现; 该字段现只驱动 missing_index (index 文件存在性) 检查
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: accepted-specifications
    patterns:
      - docs/superpowers/specs/*.md
    owner: governance-team
    lifecycle: contract
    ssot: docs/SYSTEM-INDEX.md
    verifier: bin/ssot/doc-governance-check.py
    metadata: frontmatter
    required_frontmatter: [status, lifecycle, owner, last-reviewed]
    valid_statuses: [accepted, draft, superseded, deprecated, active]
    valid_lifecycles: [spec, contract]
    review_days: 180
    discoverability: index-exists  # M2 (2026-10-06): 同上 — 只驱动 missing_index, 不再声称 orphan 检测
    index: docs/SYSTEM-INDEX.md
    workflow: project-doc-change

  - id: project-entry
    patterns:
      - projects/*/AGENTS.md
      - projects/*/CLAUDE.md
      - projects/*/ARCHITECTURE.md
      - projects/*/BOUNDARY.md
      - projects/*/GOVERNANCE.md
    owner: project-owner
    lifecycle: entry
    ssot: docs/project-registry.yaml
    verifier: bin/ssot/doc-governance-check.py
    metadata: external
    review_days: 90
    workflow: project-doc-change

rules:
  missing_frontmatter:
    severity: warning
  malformed_frontmatter:
    severity: error
  invalid_metadata:
    severity: warning
  stale_review:
    severity: warning
  # orphan_document REMOVED 2026-10-06 (ADR-0464 治理门禁覆盖审计修复波 R2):
  # _is_discoverable() 以无条件 return True 结尾, finding 永不触发, 声明即假覆盖。
  # 不重建规则: docs/-prefix 口径反复 (2026-08-27) 证明"可发现性"语义没有
  # 明确的机检定义前重建只会继续 whack-a-mole (见 ADR-0464 盲区二/审计修复波 R2)。
  # 相应的 warning_exceptions 条目 concurrent-plans-orphan-docs 也已删除。
  missing_index:
    severity: error

warning_exceptions:
  version: 1
  generated: 2026-07-31
  policy: no-new-warnings
  entries:
  # 2026-11-02 逐桶实测（bin/ssot/doc-governance-check.py --json --no-new-warnings --scope tracked，
  # files_scanned=4738，读数取自该 JSON 的 warning_baseline.observed / .budgets 两栏）：
  #   missing_frontmatter:omo-knowledge        18 / 120    missing_frontmatter:docs-discoverable   2 / 175
  #   invalid_metadata:omo-knowledge           14 /  75    invalid_metadata:docs-discoverable      2 /  24
  #   invalid_metadata:accepted-specifications  1 /   2    stale_review:omo-truth-docs             2 /   4
  #   missing_frontmatter:omo-truth-docs        0 /  15    missing_frontmatter:omo-standards       0 /  15
  #   invalid_metadata:omo-standards            0 /   4
  # 据此删掉命中为 0 的三条（legacy-omo-truth-frontmatter / legacy-omo-standards-frontmatter /
  # legacy-omo-standards-enums）：它们已经不压制任何现存告警，但会在窗口内继续压制未来新增的
  # 无 frontmatter 文档，删掉是 shrink_only 方向上的收紧，不是放宽。其余条目 max_findings 与
  # expires 一字未动（窗口 2027-01-31 由 #4995 定下）。
  # ⚠️ 下面这条 stale-omo-truth-docs-review 是**下一个日历炸点**（2026-11-30，命中 2/4），且
  # bin/gac/check-expiry-radar.py 只看 surfaces[].review_days 与 X2 规则，**不看 warning_exceptions
  # 的 expires** —— 2026-10-31 那一次集体过期就是零预警跨零点的（8 条同日到点，gac-gate /
  # interface-check / doc-freshness 三条腿同红）。续期时先跑上面那条命令取读数，别照抄旧数。
    - id: legacy-omo-knowledge-frontmatter
      rule: missing_frontmatter
      surface: omo-knowledge
      max_findings: 120  # 2026-08-18 116→120: Y1Q4-T6-01 dedup-ledger + bus_adapter 归档新增推高计数 (actual=117)
      expires: 2027-01-31
      owner: governance-team
      reason: Legacy knowledge documents are being migrated to the frontmatter contract. Budget raised to 90 (2026-08-09) to accommodate new BET retro stub files created as part of D5 retro-due gate work (ADR-0404).
    - id: legacy-docs-frontmatter
      rule: missing_frontmatter
      surface: docs-discoverable
      max_findings: 175  # 2026-08-18 170→175: Y1Q4-T6-01 dedup-ledger + bus_adapter 归档新增推高计数 (actual=171)
      expires: 2027-01-31
      owner: governance-team
      reason: "Existing discoverable docs need frontmatter migration and index review. 2026-08-17 三调 127→135: 并发 agent 批量新增 legacy 标准累积超支 (132 轮)."
    - id: legacy-omo-knowledge-enums
      rule: invalid_metadata
      surface: omo-knowledge
      max_findings: 75  # 2026-09-27 70→75: auto-bump (governance 增量)
      # auto-bumped to 75 on 2026-09-27
      expires: 2027-01-31
      owner: governance-team
      reason: Historical lifecycle values require explicit mapping to the current enum.
    - id: legacy-docs-enums
      rule: invalid_metadata
      surface: docs-discoverable
      max_findings: 24  # 2026-08-26 16→24: T1-12 收口修复后 CI 实测 17, 并发窗口抖动留余量; T1-12 closeout 修复 value-evidence 残损 frontmatter 后暴露存量 enum 违例 (actual=16)
      expires: 2027-01-31
      owner: governance-team
      reason: Existing document status/lifecycle values require explicit migration decisions.
    - id: accepted-specs-invalid-metadata
      rule: invalid_metadata
      surface: accepted-specifications
      max_findings: 2
      expires: 2027-01-31
      owner: governance-team
      reason: Newly created specs may have last-reviewed set to creation date which CI flags as future-dated.
    - id: stale-omo-truth-docs-review
      rule: stale_review
      surface: omo-truth-docs
      max_findings: 4
      expires: 2026-11-30
      owner: governance-team
      reason: |
        Two .omo/_truth/*.md documents (omo-audit-rule-map.md, phase-escapes/README.md)
        crossed their 90-day review SLA on 2026-10-30 (last-reviewed 2026-07-31). Purely
        calendar-driven, unrelated to any code change. These documents still need a human
        content review; this budget records the debt explicitly instead of silently
        refreshing last-reviewed (which would falsely claim the review happened).
