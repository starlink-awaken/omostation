# 探测器心跳矩阵 — 所有探测器的心跳 SLA 定义

schema: probe-heartbeat-matrix/v1
description: "探测器心跳矩阵 — 监控所有治理探测器的活性"

heartbeats:
  - file: .omo/state/system_health.yaml
    field: last_scan
    sla_hours: 48
    severity: P1
    description: "系统健康巡检"

  - file: .omo/state/health.yaml
    field: generated_at
    sla_hours: 72
    severity: P2
    description: "健康评分"

  - file: .omo/_control/debt-dashboard/current.yaml
    field: generated_at
    sla_hours: 336
    severity: P2
    description: "债务看板"

  - file: .omo/_control/governance-data.json
    field: generated_at
    sla_hours: 168
    severity: P2
    description: "治理数据投影"

  - file: .omo/state/agent-tick-daemon.jsonl
    field: ts
    sla_hours: 24
    severity: P1
    description: "Agent Tick 守护"

  - file: .omo/state/routed-signals.json
    field: routed_at
    sla_hours: 168
    severity: P3
    description: "信号路由"

  - file: .omo/state/evolution-proposals.json
    field: generated_at
    sla_hours: 336
    severity: P3
    description: "进化提案"

  - file: .omo/state/history/health.jsonl
    field: ts
    sla_hours: 72
    severity: P2
    description: "价值历史"

alerting:
  lapsed_to_debt: true
  lapsed_to_inbox: true
  lapsed_to_weekly_review: true
