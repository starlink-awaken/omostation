# Runtime Projection Registry
# Canonical paths for recomputable runtime/state projections managed by the
# OMO state-sync broker. Consumers should use omo.paths.projection_path(name)
# instead of hard-coding any of these paths.

projections:
  health:
    description: Governance health score projection from compass_radar / omo state sync
    canonical: .omo/state/runtime/health.yaml
    legacy: .omo/state/health.yaml
    generator: omo state sync
    lane: runtime_snapshot

  system_health:
    description: Runtime Matrix health scan snapshot
    canonical: .omo/state/runtime/system_health.yaml
    legacy: .omo/state/system_health.yaml
    state: active
    generator: omo state refresh (implemented, active after fresh runtime bootstrap validation)
    lane: runtime_snapshot

  governance_data:
    description: Aggregated governance data dashboard JSON
    canonical: .omo/state/runtime/governance-data.json
    legacy: .omo/_control/governance-data.json
    generator: omo state sync
    lane: runtime_snapshot

  brief:
    description: Human/AI attention brief rendered from system state
    canonical: .omo/state/runtime/brief.md
    legacy: BRIEF.md
    generator: omo state sync
    lane: runtime_snapshot

  metrics_store:
    description: Append-only governance metrics time series (JSONL) for adaptive threshold and trend analysis
    canonical: .omo/state/runtime/metrics-store.jsonl
    legacy: .omo/state/metrics-store.jsonl
    generator: gac-local-gate --metrics / metrics-store.py
    lane: runtime_snapshot

  anomaly_events:
    description: Anomaly events JSONL emitted by anomaly-detector from metrics-store.jsonl
    canonical: .omo/state/runtime/anomaly-events.jsonl
    legacy: .omo/state/anomaly-events.jsonl
    generator: anomaly-detector.py
    lane: runtime_snapshot

  governance_dashboard:
    description: Governance metrics dashboard data (JSON) generated from metrics-store.jsonl
    canonical: .omo/state/runtime/governance-dashboard.json
    legacy: .omo/state/runtime/governance-dashboard.json
    generator: governance-dashboard.py --metrics-dashboard
    lane: runtime_snapshot

  cross_domain_trend:
    description: Cross-domain trend fusion analysis output (JSON)
    canonical: .omo/state/runtime/cross-domain-trend.json
    legacy: .omo/state/runtime/cross-domain-trend.json
    generator: cross-domain-trend.py
    lane: runtime_snapshot

  predictive_governance:
    description: Predictive governance output with recommendations (JSON)
    canonical: .omo/state/runtime/predictive-governance.json
    legacy: .omo/state/runtime/predictive-governance.json
    generator: predictive-governance.py
    lane: runtime_snapshot

