---
title: External Connection Fabric Registry
status: active
type: registry
owner: architecture-governance
last-reviewed: 2026-08-03
lifecycle: ssot
---
version: "1.0"
registry_id: external-connection-fabric
description: >-
  Unified contract for external knowledge, data, resources, methods, tools, channels and model
  providers. It defines discovery, admission, routing, evidence and reversible lifecycle without
  creating a second task, credential, knowledge or runtime truth.
truth_owners:
  contract: ecos
  admission_and_evidence: omo
  discovery_and_routing: agora
  source_adapters: kairon.iris
  method_compilation_and_evaluation: kairon.sophia
  execution_and_delivery: runtime
  compute_and_credentials: aetherforge
  canonical_memory: kairon.kos-gbrain
  human_catalog: cockpit
descriptor:
  schema_version: external-resource/v1
  required_fields:
    - id
    - kind
    - provider
    - protocol
    - capabilities
    - data_classification
    - provenance
    - lifecycle
    - health
    - owner
    - version
    - permission_ref
  secret_policy: credential_ref_only
  forbidden_fields:
    - access_token
    - refresh_token
    - password
    - private_key
    - raw_private_content
resource_kinds:
  knowledge_source:
    owner: kairon.iris
    allowed_capabilities: [discover, search, read, snapshot, subscribe]
    default_mode: live_query
  data_source:
    owner: kairon
    allowed_capabilities: [discover, query, export, snapshot, subscribe]
    default_mode: governed_snapshot
  resource_provider:
    owner: agora
    allowed_capabilities: [discover, resolve, quote, reserve]
    default_mode: live_query
  method_pack:
    owner: kairon.sophia
    allowed_capabilities: [discover, explain, compile, evaluate]
    default_mode: proposal_only
  tool_capability:
    owner: agora
    allowed_capabilities: [discover, invoke, validate]
    default_mode: proposal_only
  channel:
    owner: runtime
    allowed_capabilities: [discover, deliver, receipt, suppress]
    default_mode: approved_delivery
  model_provider:
    owner: aetherforge
    allowed_capabilities: [discover, infer, embed, evaluate]
    default_mode: proposal_only
connection_modes:
  live_query:
    copy_policy: zero_copy_preferred
    evidence: source_ref_and_query_receipt
  live_invoke:
    copy_policy: request_scoped
    evidence: invocation_receipt_and_output_provenance
  ttl_snapshot:
    copy_policy: bounded_snapshot
    evidence: snapshot_hash_and_expiry
  governed_snapshot:
    copy_policy: approved_snapshot
    evidence: approval_ref_snapshot_hash_and_expiry
  event_subscription:
    copy_policy: event_payload_minimized
    evidence: subscription_ref_and_delivery_receipt
  approved_delivery:
    copy_policy: recipient_scoped
    evidence: delivery_receipt_and_channel_policy
  proposal_only:
    copy_policy: no_production_side_effect
    evidence: proposal_ref_and_evaluation_ref
lifecycle:
  states: [discovered, sandbox, admitted, active, degraded, quarantined, retired]
  transitions:
    discovered: [sandbox, retired]
    sandbox: [admitted, discovered, quarantined, retired]
    admitted: [active, sandbox, quarantined, retired]
    active: [degraded, quarantined, retired]
    degraded: [active, quarantined, retired]
    quarantined: [sandbox, retired]
    retired: []
  active_requirements:
    - expiry_or_review_at
    - health_probe
    - rollback_plan
    - owner
    - permission_ref
admission:
  owner: omo
  required_scene_binding:
    - scene_id
    - journey_id
    - outcome_metric
    - data_scope
    - operator
    - permission_ref
  fail_closed_on:
    - missing_permission
    - missing_health
    - missing_provenance
    - expired_descriptor
    - unbounded_copy
    - missing_scene_binding
routing:
  owner: agora
  score_factors: [relevance, trust, freshness, permission, availability, cost, latency]
  required_result_fields: [selected_resource_id, decision_factors, policy_digest, trace_id]
  circuit_breaker: required
  fallback: explicit_unavailable
evidence:
  workflow_envelope: workflow-mesh/v1
  required_for: [discovery, admission, invocation, delivery, retirement]
  minimum_fields: [trace_id, resource_id, receipt_id, observed_at, result_state, provenance_ref, policy_digest]
dynamic_discovery:
  entry_point_group: external.resources
  provider_method: external_descriptor
  failure_policy: isolate_provider_and_return_error_record
  direct_project_imports: forbidden
  capability_directory_contract: external-resource-directory/v1
  capability_directory_builder: bin/ssot/external-resource-catalog.py::build_external_resource_directory_snapshot
  capability_directory_cli: bin/ssot/external-resource-catalog.py --directory
  connection_plan_contract: external-resource-connection-plan/v1
  connection_plan_builder: bin/ssot/external-resource-catalog.py::build_external_resource_connection_plan
  connection_plan_cli: bin/ssot/external-resource-catalog.py --connection-plan
  refresh_plan_contract: external-resource-refresh-plan/v1
  refresh_plan_builder: bin/ssot/external-resource-catalog.py::build_external_resource_refresh_plan
  refresh_plan_cli: bin/ssot/external-resource-catalog.py --refresh-plan
  capability_directory_semantics:
    source: external-resource-catalog/v1
    purpose: capability_freshness_and_expansion_map
    activation: forbidden
    provider_invocation: forbidden
    workflow_run_creation: forbidden
    admission_mutation: forbidden
    required_indexes: [capability_index, kind_index, next_steps]
    next_step_policy: deterministic_review_or_probe_action
  connection_plan_semantics:
    source: external-resource-directory/v1
    purpose: evidence_collection_and_governed_extension_queue
    activation: forbidden
    provider_invocation: forbidden
    workflow_run_creation: forbidden
    admission_mutation: forbidden
    required_item_fields: [resource_id, next_step, status, blockers, required_inputs]
    status_policy: blocked_until_required_evidence_exists
  refresh_contract:
    triggers: [startup, periodic, on_demand, descriptor_change]
    identity_fields: [id, provider, version]
    change_policy: record_diff_and_re_evaluate_admission
    stale_policy: degrade_then_unavailable
    provider_isolation: required
    probe_method: health_probe
    probe_side_effect_policy: read_only_only
    projection_contract: external-resource-catalog/v1
    diff_contract: external-resource-catalog-diff/v1
    previous_snapshot_owner: caller_or_governed_observer
    human_catalog_api: /api/external-resources
    governed_observation:
      owner: omo
      schema: external-resource-observation/v1
      append_only_log: .omo/_log/external-resource-observations.jsonl
      latest_projection: .omo/_log/external-resource-observation-latest.json
      write_entrypoint: omo external-resources observe --stdin
      read_entrypoint: omo external-resources latest --json
      idempotency_key: observed_at_and_catalog_digest
      provider_invocation: forbidden
      cockpit_default_view: observed_then_dynamic_fallback
    refresh_plan:
      purpose: observation_cadence_and_recovery_priority
      owner: caller_or_governed_observer
      schema: external-resource-refresh-plan/v1
      activation: forbidden
      provider_invocation: forbidden
      workflow_run_creation: forbidden
      scheduler_mutation: forbidden
      interval_policy_by_kind:
        knowledge_source: 86400
        data_source: 21600
        resource_provider: 3600
        method_pack: 604800
        tool_capability: 86400
        channel: 3600
        model_provider: 21600
      priority_order: [urgent, high, normal, low]
      unhealthy_action: health_probe
      descriptor_deadline_action: human_review
      cockpit_api: GET /api/external-resources/refresh-plan
  health_contract:
    required_probe_fields: [observed_at, status, latency_ms, source]
    expired_health_policy: unavailable
    failed_probe_policy: quarantine_candidate
  extension_contract:
    pack_schema: external-resource-pack/v1
    pack_check_schema: external-resource-pack-check/v1
    pack_preview_schema: external-resource-pack-catalog-preview/v1
    pack_proposal_observation_schema: external-resource-pack-proposal-observation/v1
    pack_proposal_recorder: projects/omo/src/omo/omo_external_pack.py
    pack_proposal_log: .omo/_knowledge/workflow-mesh/external-resource-pack-proposals.jsonl
    pack_checker: bin/ssot/external-resource-pack.py
    new_provider_requires: [descriptor, permission_ref, health_probe, rollback_plan, owner]
    pack_requires: [pack_id, pack_version, extension, descriptor]
    pack_extension:
      entry_point_group: external.resources
      provider_method: external_descriptor
      health_probe_method: health_probe
      health_probe_side_effect: read_only
      provider_import_during_check: forbidden
      provider_invocation_during_check: forbidden
      omo_write_during_check: forbidden
    pack_statuses: [blocked, proposal_only, ready_for_catalog_preview]
    pack_activation: forbidden
    pack_preview_semantics:
      source: manifest_only
      availability: unobserved
      health: unobserved
      provider_invocation: forbidden
      omo_write: forbidden
      next_step: catalog_discovery_then_health_probe
    pack_proposal_semantics:
      allowed_statuses: [proposal_only, ready_for_catalog_preview]
      review_actions: [submit, defer, request_changes]
      blocked_persistence: forbidden
      workflow_mesh_mutation: forbidden
      admission_mutation: forbidden
      provider_invocation: forbidden
      idempotency_key: proposal_id_and_projection_digest
    observation_run_schema: external-resource-observation-run/v1
    observation_run_recorder: projects/omo/src/omo/omo_external_observation_run.py
    observation_run_log: .omo/_knowledge/workflow-mesh/external-resource-observation-runs.jsonl
    observation_run_semantics:
      provider_business_invocation: forbidden
      activation: forbidden
      workflow_mesh_mutation: forbidden
      admission_mutation: forbidden
      cost_without_metering: unmetered_and_amount_null
      empty_catalog_result: unavailable
      partial_health_or_errors_result: degraded
      idempotency_key: run_id_and_run_digest
    scene_trial_schema: external-scene-trial/v1
    scene_trial_recorder: projects/omo/src/omo/omo_external_scene_trial.py
    scene_trial_log: .omo/_knowledge/workflow-mesh/external-scene-trials.jsonl
    scene_trial_semantics:
      allowed_stage: observation_only
      allowed_status: proposal_only
      activation: forbidden
      provider_invocation: forbidden
      workflow_run_binding_before_promotion: forbidden
      workflow_mesh_mutation: forbidden
      admission_mutation: forbidden
      feedback_contract: outcome-feedback/v1
      promotion_requires: [real_consumer, workflow_run_id, external_receipt, outcome_feedback]
      idempotency_key: trial_id_and_stable_contract_digest
    scene_trial_review_schema: external-scene-trial-feedback/v1
    scene_trial_review_recorder: projects/omo/src/omo/omo_external_scene_trial_feedback.py
    scene_trial_review_log: .omo/_knowledge/workflow-mesh/external-scene-trial-feedback.jsonl
    scene_trial_review_api:
      read: GET /api/external-resources/scene-trials
      write: POST /api/external-resources/scene-trials/review
      mode: proposal_only
      allowed_actions: [continue, request_changes, reject]
      required_refs: [trial_id, reviewer_ref, review_ref, evidence_refs]
      activation: forbidden
      provider_invocation: forbidden
      workflow_run_creation: forbidden
      admission_mutation: forbidden
      idempotency_key: feedback_id_and_stable_review_digest
    scene_trial_readiness_schema: external-scene-trial-promotion-readiness/v1
    scene_trial_readiness_builder: projects/omo/src/omo/omo_external_scene_readiness.py
    scene_trial_readiness_cli: omo external-resources scene-trial-readiness
    scene_trial_readiness_api:
      read: GET /api/external-resources/scene-trials/readiness
      mode: read_only_projection
      required_facts: [trial_recorded, review_continue, workflow_run, external_receipt, outcome_feedback]
      statuses: [empty, blocked, ready, unavailable]
      activation: forbidden
      provider_invocation: forbidden
      workflow_run_creation: forbidden
      admission_mutation: forbidden
      external_side_effects: disabled
      promotion_semantics: human_proposal_only
    scene_consumer_schema: external-scene-consumer/v1
    scene_consumer_recorder: projects/omo/src/omo/omo_external_scene_consumer.py
    scene_consumer_log: .omo/_knowledge/workflow-mesh/external-scene-consumers.jsonl
    scene_consumer_cli: omo external-resources record-scene-consumer --stdin
    scene_consumer_semantics:
      allowed_status: [declared]
      required_refs: [consumer_ref, owner_ref, entrypoint_ref, capability_ref, permission_ref, metric_ref, rollback_ref]
      required_scene_binding: true
      activation: forbidden
      provider_invocation: forbidden
      workflow_run_binding_before_promotion: forbidden
      readiness_role: required_fact
      idempotency_key: consumer_id_and_stable_contract_digest
    pack_lifecycle_start: [discovered, sandbox]
    route_code_change_required: false
    activation_requires_scene_binding: true
evaluation:
  source_pack:
    required_labels: [provenance, freshness, permission, usefulness]
    stale_result_policy: reject_or_mark_degraded
  method_pack:
    stages: [offline, proposal_only, shadow, approval, canary, rollback]
    production_side_effect_requires: human_approval
  model_pack:
    stages: [offline, proposal_only, shadow, approval, canary, rollback]
    direct_admission_write: forbidden
  channel_pack:
    required_receipt: delivery_receipt
    retry_policy: explicit_and_idempotent
scene_activation_gate:
  required: true
  minimum_repeated_demand: 连续四周或明确机会窗口
  freeze_when:
    - no_real_consumer
    - no_outcome_metric
    - no_owner
    - no_permission_boundary
bindings:
  source_adapters: projects/kairon/packages/iris
  method_compiler: projects/kairon/packages/sophia
  capability_router: projects/agora/src/agora/external_connections.py
  workflow_execution: docs/WORKFLOW-MESH-IMPLEMENTATION.md
  governance: projects/omo
  contract_validation: projects/ecos
  user_entry: [projects/cockpit, projects/cockpit-ui]
validation:
  contract_test: tests/test_external_connection_fabric_registry.py
  runtime_test: tests/test_external_connection_runtime.py
  checks: [registry_shape, secret_field_absence, lifecycle_transition_closure, architecture_pointer_integrity, runtime_receipt_mesh_compatibility]
