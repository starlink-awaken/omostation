# ── Governance Rule Definitions ──
governance_rules:
  CR-QB-001:
    name: "隔离事务必须可逆"
    description: "所有隔离操作必须生成回滚清单，且回滚清单必须可验证"
    enforcement: pre_commit
  CR-QB-002:
    name: "符号链接隔离不得跟随"
    description: "符号隔离操作必须 no-follow，保留 link target"
    enforcement: pre_commit
  CR-OWN-001:
    name: "Owner 任务必须只读"
    description: "Documents owner 任务不得修改 Documents 内容"
    enforcement: pre_commit
  CR-AUD-001:
    name: "审计必须生成证据"
    description: "所有审计操作必须生成不可篡改的证据记录"
    enforcement: post_commit
  CR-PRE-001:
    name: "预检必须验证依赖"
    description: "预检操作必须验证所有依赖项可用"
    enforcement: pre_commit
  CR-CUT-001:
    name: "切换必须可回滚"
    description: "所有切换操作必须备份原状态并可回滚"
    enforcement: pre_commit
  CR-RET-001:
    name: "退役必须保留证据"
    description: "退役操作必须保留完整证据链和回滚能力"
    enforcement: pre_commit
  CR-CON-001:
    name: "收敛必须保持一致性"
    description: "收敛操作必须保持系统一致性，不得引入分裂"
    enforcement: pre_commit
