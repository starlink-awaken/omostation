# write-owners.yaml — .omo/ 状态平面写权限定义 (GaC #38)
#
# 两个独立段，两套 owner 约定：
#   write_owners: 路径级规则，消费者 bin/ssot/write-owner-audit.py (pre-commit G-CONV.5)
#   fields:       字段级归属，消费者 bin/gac/omo-state-write-guard.py (check_field_ownership)
# 段内 owner 词法见各自的注释块。

version: 1
last_updated: "2026-10-01"

# Path-level rules for bin/ssot/write-owner-audit.py (pre-commit G-CONV.5).
# owner format: "script:<name>" | "daemon:<name>" | "human:<name>"
# script/daemon owned paths forbid manual commit outside AGENT_WORKFLOW_RUN_ID / CI.
write_owners:
  - path: ".omo/state/system.yaml"
    owner: "script:runtime-scan"
  - path: ".omo/state/health.yaml"
    owner: "script:strategy-sync"
  - path: ".omo/state/system_health.yaml"
    owner: "script:runtime-scan"
  - path: ".omo/state/runtime/system_health.yaml"
    owner: "script:runtime-scan"
  - path: ".omo/debt/*"
    owner: "script:omo-debt"
  - path: ".omo/debt/**"
    owner: "script:omo-debt"

# fields: 段 — system.yaml 的字段级归属 (ADR-0456 B5 / BET-Y2Q4-T10-219)
# owner 词法 (OMO_STATE_FIELD_LEXICON，由 omo-state-write-guard.py check_field_ownership 校验):
#   "script:<repo 相对路径>" — 该路径必须在 code_root() 下真实存在
#   "daemon:<name>" | "human:<name>" | "broker:<name>" | "anyone"
# 多写者用列表；列表项逐一校验。
# 只声明**当前文件里真实存在**的顶层键：有代码写路径但当前缺席的键
# (next_milestone / health_score_raw / debt_watchlist_count / debt_gate_count / phase28_status)
# 故意不声明 —— 它们第一次落盘时会以 undeclared-key 触发门禁，由写入方补声明。
fields:
  # system.yaml — 运行时 + 治理状态（23 个顶层键，实测写者图见
  # docs/superpowers/specs/2026-10-01-bet-219-system-yaml-field-writer-ownership.md §4）
  .omo/state/system.yaml:
    active_tasks:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
    blocked_tasks:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
    completed_tasks:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
    current_phase: "script:projects/omo/src/omo/omo_audit_sync.py"
    current_wave: "script:projects/omo/src/omo/omo_audit_sync.py"
    governance_anomaly_score: "script:bin/compass_radar.py"
    governance_feedback_last_run: "script:projects/omo/src/omo/omo_ingress_state.py"
    harness: "script:bin/gac/harness-omo-bridge.py"
    health_score:                     # 顶部复合健康分（三个写者，同键覆写）
      - "script:bin/compass_radar.py"
      - "script:bin/gac/unified-health-score.py"
      - "script:projects/omo/src/omo/omo_audit_sync.py"
    health_score_evidence:
      - "script:bin/gac/evidence-smoke.py"
      - "script:bin/compass_radar.py"    # :1420 覆写成自己的 health_score
    health_score_evidence_generated_at: "script:bin/gac/evidence-smoke.py"
    health_score_evidence_source:
      - "script:bin/gac/evidence-smoke.py"
      - "script:bin/compass_radar.py"
    health_score_generated_at: "script:bin/compass_radar.py"
    health_score_source: "script:bin/compass_radar.py"
    next_active_tasks: "script:projects/omo/src/omo/omo_state.py"
    next_planned_tasks: "script:projects/omo/src/omo/omo_state.py"
    planned_tasks:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
    runtime_health_summary: "script:bin/compass_radar.py"  # 内含 health_score (ISC-3 同口径)
    self_evolution: "script:bin/gac/self-evolution-loop.py"
    service_online_ratio: "script:bin/compass_radar.py"
    total_tasks:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
    updated_at:
      - "script:projects/omo/src/omo/omo_audit_sync.py"
      - "script:projects/omo/src/omo/omo_state.py"
      - "script:projects/omo/src/omo/omo_ingress_state.py"
    workflow_mesh_health: "script:bin/compass_radar.py"

  # health.yaml — 健康分 SSOT
  .omo/state/health.yaml:
    health_score: strategy-sync
    immutable: anyone       # 标记字段, 任何写入方不应删除

  # system_health.yaml — 健康扫描 SSOT
  .omo/state/system_health.yaml:
    last_scan: runtime-scan
    services: runtime-scan
  .omo/state/runtime/system_health.yaml:
    last_scan: runtime-scan
    services: runtime-scan

  # .omo/debt/ — 债务系统, 只能通过 OMO debt CLI 修改
  .omo/debt/:
    _dir: omo-debt           # 整个目录由 omo-debt 系统管理
    _rule: no-direct-write   # 禁止非 broker 直接写

  # BRIEF.md — agent 认知入口
  BRIEF.md:
    _file: anyone            # 允许任何写入, 但建议通过 generate-brief.py
