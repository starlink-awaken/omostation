apiVersion: workspace.omostation/v1
kind: DocumentsDomainProjects
id: documents-domain-projects
status: active
owner: cockpit

# Domain identity/path/authority are intentionally not duplicated here.
# They resolve through the Documents registry and each referenced DOMAIN.yaml.
domain_registry:
  owner: l4-kernel
  documents_relative_ref: "@公共/_control/L4-DOMAIN-REGISTRY.yaml"
  environment_override: L4_DOMAIN_REGISTRY

workspace_mcp:
  owner: cockpit
  server: cockpit
  entrypoint: cockpit-mcp
  transport: stdio
  read_tools:
    - workspace_context
    - domains_list
    - domain_context
    - cards_status
    - cards_check
    - kems_status

capability_routes:
  skills:
    owner: workspace-skills
    registry_ref: ".agents/skills"
    guidance: "Discover the relevant Workspace skill; do not copy skill implementations into Documents."
  workflows:
    owner: workspace-workflow-mesh
    registry_ref: ".omo/_truth/registry/agent-workflows.yaml"
    guidance: "Route multi-step execution through Workspace Workflow Mesh/Runtime; Documents stores only declarations and evidence."
  tasks_and_approvals:
    owner: omo
    tool_refs:
      - cards_status
      - cards_check
  knowledge_runtime:
    owner: kairon-kos
    guidance: "Use Kairon/KOS through Workspace routes; never start a domain-local KEMS runtime."

clients:
  claude:
    instruction_file: CLAUDE.md
    mcp_scope: user
    note: "Install/configure the Cockpit MCP once; the domain gateway selects domain context."
  codex:
    instruction_file: AGENTS.md
    mcp_scope: user_or_project
    profile_contract:
      name: documents
      owner: workspace
      generator_ref: bin/gac/documents-codex-profile.py
      exclusive_mcp_server: cockpit
      approval_mode: approve
      skill_policy: disable_user_local
    note: "Use AGENTS.md with the generated `documents` profile; the profile keeps only Cockpit read tools and removes user-local Skill injection from this client context."
  zed:
    instruction_file: AGENTS.md
    mcp_scope: client
    profile_contract:
      name: documents
      owner: workspace
      generator_ref: bin/gac/documents-zed-profile.py
      exclusive_mcp_server: cockpit
      approval_mode: allow_read_tools
      builtin_tool_policy: disable_all
    note: "Use the generated `Documents` Agent Profile; it disables built-in tools and enables only the Cockpit read tools declared by content-domain."
  zcode:
    instruction_file: AGENTS.md
    mcp_scope: user
    config_contract:
      owner: workspace
      generator_ref: bin/gac/documents-zcode-config.py
      configuration_surface: native_json
      config_path: ~/.zcode/cli/config.json
      managed_mcp_server: cockpit
      preserve_unrelated_servers: true
    note: "Open Documents as the ZCode workspace so its root AGENTS.md is authoritative; the native user config manages only Cockpit and preserves third-party model and MCP settings."
  agents_compatible:
    instruction_file: AGENTS.md
    mcp_scope: client
    note: "For clients without a dedicated contract, use AGENTS.md plus the client MCP settings."
  chatgpt_web:
    instruction_file: null
    mcp_scope: public_https_or_secure_tunnel
    requires_developer_mode: true
    setup_ref: "https://developers.openai.com/plugins/deploy/connect-chatgpt"
    tunnel_ref: "https://developers.openai.com/api/docs/guides/secure-mcp-tunnels"
    note: "Developer mode connects a public HTTPS MCP endpoint or Secure MCP Tunnel; local Claude/Codex JSON is not consumed."

profiles:
  content-domain:
    allowed_workspace_tools:
      - workspace_context
      - domain_context
      - cards_status
      - cards_check
    skill_route: skills
    workflow_route: workflows
    execution_policy: workspace_only

runtime_jobs:
  - id: creative-manifest-check
    domain_id: creative
    owner: l4-kernel
    action: validate_manifest
    schedule: manual
    timeout_seconds: 10
    reads:
      - domain_registry
      - registered_manifests
    writes: []
    evidence_path: manifest-validation.json
    fail_closed: true

domains:
  - id: shared
    profile: content-domain
  - id: personal
    profile: content-domain
  - id: vault
    profile: content-domain
  - id: family
    profile: content-domain
  - id: creative
    profile: content-domain
  - id: opc
    profile: content-domain
  - id: work-docs
    profile: content-domain
  - id: work-weijian
    profile: content-domain
  - id: work-guozhuan
    profile: content-domain
  - id: work-liyongke
    profile: content-domain
  - id: work-contracts
    profile: content-domain
  - id: cockpit
    profile: content-domain
