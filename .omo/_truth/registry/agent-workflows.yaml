agent_profiles:
  adapter-agent:
    allowed_workflows:
    - external-adapter-sync
    - agent-onboarding
    - bet-execution
    can_write_lanes:
    - docs
    - governance_code
    - governance_state
    closeout_required:
    - adapter-doctor
    - integration-map-review
    purpose: Inspect and synchronize optional external tools without making them new governance authorities.
  any-agent:
    allowed_workflows:
    - handoff-resume
    can_write_lanes:
    - docs
    - code
    - governance_code
    - governance_state
    - config
    - submodule_pointer
    closeout_required:
    - run-record
    purpose: Resume or hand off a compressed session through persisted run state.
  builder-agent:
    allowed_workflows:
    - '*'
    can_write_lanes:
    - docs
    - code
    - governance_code
    - compute_fabric
    purpose: 主权算力投机生成与代码/公文起草 (ADR-0197)
  c2g-agent:
    allowed_workflows:
    - governance-state-mutation
    - c2g-spec-ingress
    - external-adapter-sync
    can_write_lanes:
    - governance_state
    - docs
    closeout_required:
    - ssot-guardian
    - gac-local-gate
    purpose: Convert strategy inputs, pitches, BMAD, or OpenSpec material into governed planned tasks.
  devil-challenger:
    allowed_workflows:
    - '*'
    can_write_lanes:
    - docs
    - governance_code
    - governance_state
    purpose: 审计/等保/法务影子对抗审查与 Auto-Patch (ADR-0196)
  docs-agent:
    allowed_workflows:
    - project-doc-change
    - bet-execution
    can_write_lanes:
    - docs
    closeout_required:
    - doc-ssot-lint
    - ssot-guardian
    - gac-local-gate
    purpose: Maintain Markdown and project docs without duplicating SSOT facts.
  engineering-agent:
    allowed_workflows:
    - project-code-change
    - pyright-sweep
    - bet-execution
    - round-engineering
    - round-type-router
    - closeout-with-retro
    can_write_lanes:
    - code
    - config
    closeout_required:
    - project-tests
    - gac-local-gate
    purpose: Implement project-local code changes with project tests and workspace gates.
  external-contributor-agent:
    allowed_workflows:
    - project-doc-change
    - project-code-change
    - handoff-resume
    - observer-audit
    can_write_lanes:
    - docs
    - code
    - config
    closeout_required:
    - verify
    notes: Must start+claim before edits (ADR-0203). No direct .omo governance_state.
    purpose: External MCP host allowed to deliver docs/code under claim
  external-readonly-agent:
    allowed_workflows:
    - observer-audit
    - handoff-resume
    - mof-state-bridge-audit
    can_write_lanes: []
    closeout_required: []
    notes: Prefer for Cursor/Codex sessions that only inspect health/BOS/audit.
    purpose: External MCP host with read-only oversight (no requirement writes)
  governance-agent:
    allowed_workflows:
    - project-doc-change
    - project-code-change
    - pyright-sweep
    - governance-state-mutation
    - c2g-spec-ingress
    - mof-model-change
    - mof-state-bridge-audit
    - external-adapter-sync
    - submodule-pointer-close
    - observer-audit
    - governance-audit
    - state-sync
    - agent-onboarding
    - bet-execution
    - resident-runtime-observe
    - documents-consumer-audit-weekly
    - convergence-pulse-weekly
    - round-engineering
    - round-type-router
    - closeout-with-retro
    - scene-card-promotion
    - submodule-pointer-bump
    can_write_lanes:
    - docs
    - governance_code
    - governance_state
    - config
    - submodule_pointer
    closeout_required:
    - agent-workflow-lint
    - agent-workflow-observe
    - gac-local-gate
    purpose: Route governance-sensitive edits through GAC, OMO, C2G, and SSOT checks.
  keeper-cartridge:
    allowed_workflows:
    - '*'
    can_write_lanes:
    - docs
    - governance_code
    - governance_state
    purpose: 领域卡带与 SOP 资产装配 (ADR-0198)
  mof-agent:
    allowed_workflows:
    - mof-model-change
    - mof-state-bridge-audit
    can_write_lanes:
    - governance_code
    - governance_state
    - docs
    closeout_required:
    - mof-schema-validate
    - mof-state-bridge
    - mof-drift
    - gac-local-gate
    purpose: Maintain MOF M1/M2/M3 model changes, schema validation, state bridge alignment, and MOF version evidence.
  observer-agent:
    allowed_workflows:
    - observer-audit
    - mof-state-bridge-audit
    - resident-runtime-observe
    can_write_lanes: []
    closeout_required:
    - observe-json
    - doctor
    purpose: Run read-only oversight for locks, run records, ledger events, and handoff evidence.
  qa-agent:
    allowed_workflows:
    - project-code-change
    - pyright-sweep
    - closeout-with-retro
    can_write_lanes:
    - code
    closeout_required:
    - project-tests
    purpose: Verify code behavior and report failures without owning broad implementation changes.
  release-agent:
    allowed_workflows:
    - submodule-pointer-close
    can_write_lanes:
    - submodule_pointer
    - config
    closeout_required:
    - reachability
    - gac-local-gate
    purpose: Close submodule pointer and release-gate work without dangling SHAs.
  sage-planner:
    allowed_workflows:
    - '*'
    can_write_lanes:
    - docs
    - governance_code
    purpose: 意图解构与工程规格反编译 (ADR-0195, cognitive-governance-delivery)
  state-sync-agent:
    allowed_workflows:
    - state-sync
    can_write_lanes:
    - governance_state
    - runtime_snapshot
    closeout_required:
    - state-sync
    - state-sync-dry-run
    - agent-workflow-observe
    purpose: Refresh high-churn runtime projections through the OMO state-sync broker.
  strategy-agent:
    allowed_workflows:
    - c2g-spec-ingress
    - external-adapter-sync
    can_write_lanes:
    - docs
    - governance_state
    closeout_required:
    - planned-task-review
    purpose: Shape upstream intent before it is materialized into C2G or OMO task state.
claim_policy:
  mode: advisory
  required_paths:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - docs/GOVERNANCE-EVOLUTION-ROADMAP.md
  - projects/AGENTS.md
  tiers:
  - id: core-governance-required
    mode: required
    paths:
    - .agents/skills/**
    - .omo/_truth/registry/**
    - .omo/standards/**
    - bin/agent-workflow.py
    - bin/change-lane-check.py
    - bin/gac/gac-local-gate.py
    - bin/gac/governance-evolution.py
    - bin/gac/omo-state-projection-guard.py
    - bin/gac/omo-runtime-stamp-policy.py
    - projects/agora/etc/bos-services.yaml
    - projects/cockpit/src/cockpit/cli.py
    - projects/cockpit/src/cockpit/commands/agent_workflow.py
    - projects/cockpit/src/cockpit/tests/test_agent_workflow_command.py
    - projects/ecos/src/ecos/ssot/mof/**
    - tests/test_agent_workflow.py
  - id: runtime-projection-snapshot
    mode: required
    note: 'Runtime projections refreshed by the omo state sync broker (ADR-0129, P74 §3.2). Derived artifacts; required so that omo state sync workflows must claim them, keeping broker regeneration auditable.

      '
    paths:
    - .omo/_truth/registry/runtime-projections.yaml
    - .omo/state/runtime/**
    - .omo/_control/**
    - BRIEF.md
  - id: agent-entrypoint-advisory
    mode: advisory
    paths:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - docs/GOVERNANCE-EVOLUTION-ROADMAP.md
    - projects/AGENTS.md
