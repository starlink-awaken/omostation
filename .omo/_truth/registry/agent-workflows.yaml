projection:
  authority: projection
  lifecycle: read_only_generated_compatibility
  schema: agent-workflow-compat-projection/v1
  source: .omo/_truth/registry/agent-workflows
  source_digest: sha256:7ee086272e8275fcc8e8304b8175e338fbcfdf27482e3f3b225ac21e162a4abe
  writer: bin/agent-workflow.py projection-sync
requirement_iteration_policy:
  adr: ADR-0203
  description: 'All requirement iterations (feature, bugfix, ops landing, governance/SSOT/ADR changes, submodule pointer closeout tied to delivery) MUST execute via bin/agent-workflow.py: bootstrap → start → claim → verify → closeout. Prompt memory alone is non-compliant. claim_policy tiers still enforce path claims; this policy is the agent-facing mandatory rule for starting a run before edits. Executable gate (ADR-0204): staged in-scope files without an active run → compliance halt. Unstaged dirty in-scope files → warn only (multi-agent worktree safe). Bypass: AGCP_REQUIREMENT_ITERATION_GATE=0

    '
  enforcement: ADR-0204
  exclude_paths:
  - .omo/state/**
  - .omo/_delivery/**
  - .omo/_control/**
  - runtime/**
  - '**/__pycache__/**'
  exempt_classes:
  - pure_readonly_qa_or_explore
  - observer_audit_readonly
  - explicit_user_waiver_recorded_in_closeout
  exempt_workflows:
  - observer-audit
  in_scope:
  - feature_or_bugfix_code_change
  - governance_ssot_or_adr_change
  - ops_landing_with_repo_diff
  - delivery_closeout_with_product_or_governance_change
  - submodule_pointer_closeout
  in_scope_paths:
  - projects/**
  - .omo/_truth/**
  - .omo/standards/**
  - .omo/_knowledge/decisions/**
  - .omo/_knowledge/patterns/**
  - .agents/**
  - bin/**
  - docs/**
  - tests/**
  - AGENTS.md
  - CLAUDE.md
  - ARCHITECTURE.md
  - README.md
  mode: required
  non_exempt_note: 'handoff-resume is recovery of an existing run, not a license to edit without a run-id.

    '
  required_lifecycle:
  - bootstrap
  - start
  - claim
  - verify
  - closeout
runner:
  entrypoint: bin/agent-workflow.py
  generated_skill: .agents/skills/project-governance/SKILL.md
  ledger_path: .omo/_delivery/agent-workflows/events.jsonl
  lock_state_dir: .omo/_delivery/agent-workflows/locks
  lock_ttl_hours: 24
  run_state_dir: .omo/_delivery/agent-workflows/runs
silent_workflow_policy:
  description: 'Registry-level policy for workflows that have no recent agent_workflow_start events (ADR-0130 / P74). P74 §4.4 distinguishes A1 (check-layer silent, addressed via doctor_checks / diff_checks) from A2 (run-layer silent, intentionally not force-triggered because gate coverage already exercises them). A workflow is considered silently healthy when its path appears in at least one diff_checks or doctor_checks rule. Workflows with neither coverage AND no recent run events trigger a [warn] in agent-workflow compliance (p74_solidification).

    '
  warn_after_days: 30
  warn_after_days_by_frequency:
    continuous: 1
    on_demand: 30
    periodic: 7
ssot:
  agent_protocol: .omo/standards/agent-mutation-protocol.md
  doc_contract: .omo/standards/doc-ssot-contract.md
  governance_rules: .omo/_truth/registry/governance-checks.yaml
  omo_surfaces: .omo/standards/omo-governance-surfaces.md
version: 1
