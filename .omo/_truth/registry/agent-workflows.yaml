  purpose: Register a new AI agent in the workspace, including profile registration, MCP connection setup, BOS URI discovery, and first workflow lifecycle run.
  run_frequency: on_demand
  surfaces:
    read:
    - AGENTS.md
    - CLAUDE.md
    - ARCHITECTURE.md
    - docs/SYSTEM-INDEX.md
    - docs/INDEX-AGENTS.md
    - .omo/_truth/registry/agent-workflows/**
    - projects/agora/etc/bos-services.yaml
    - projects/cockpit/README.md
    write:
    - .omo/_truth/registry/agent-workflows/profiles/**
    - .agents/skills/**
  title: Agent Onboarding
- agents:
    observer_policy: optional
    roles:
    - engineering-agent
    - governance-agent
  allowed_lanes:
  - docs
  - code
  - governance_code
  - governance_state
  - config
  diff_checks:
  - check: bet-ledger-lint
    path_glob: docs/plans/3y-bet-ledger.yaml
    required: true
  - check: retro-five-questions
    path_glob: .omo/_knowledge/retros/**
    required: false
  id: bet-execution
  lock_scopes:
  - bet:{bet_id}
  - root-gate
  notes:
  - 本 workflow 存在的理由(P74): 执行 bet 是高频重复动作, 挂通用 project-code-change 属于错位。
  - 单个 bet 的实际写面由 bet.write_surfaces 限定, 必须逐条 agent-workflow claim。
  - 跨 lane 的 bet(既改 .md 又改 .yaml/.py)需拆成两次提交, 见 skill git-discipline §5。
  - 六条铁律 D0-D5 见 docs/plans/AGENT-BRIEF.md, closeout 逐条必检。
  phases:
    closeout:
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - retro-due
      id: retro-written
      mode: required
      note: D5 — 本 bet 的 .omo/_knowledge/retros/{bet_id}.md 必须存在且五问齐全
    - command:
      - agent
      - run
      - git tag -a bet/{bet_id}-$(date -u +%Y%m%dT%H%M%SZ) -m "{bet_id} deliverable"
      id: pin-tag
      mode: required
      note: D0 — commit 只是暂时安全, 共享分支 rebase 会挤掉提交; tag ref 不会
    - command:
      - git
      - diff
      - --stat
      id: diff-stat
      mode: required
    - command:
      - bash
      - bin/gac/gac-worktree.sh
      - submit
      - '{bet_id}'
      id: worktree-submit
      mode: manual
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - complete
      - '{bet_id}'
      id: bet-complete
      mode: required
      note: 'P1: 台账回写 — retro 通过后置 done (防 done 状态滞后)'
    execute:
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - show
      - '{bet_id}'
      id: read-bet
      mode: required
    - command:
      - agent
      - edit
      - bet-write-surfaces-only
      id: implement
      mode: manual
      note: 只改 bet.write_surfaces 列出的路径; non_goals 是硬边界; 每写完一个文件立刻 git add (D0)
    preflight:
    - command:
      - git
      - status
      - --short
      id: status
      mode: required
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - lint
      id: ledger-lint
      mode: required
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - claim-check
      - '{bet_id}'
      id: claim-check
      mode: required
    - command:
      - bash
      - bin/gac/gac-worktree.sh
      - claim
      - '{bet_id}'
      id: worktree-claim
      mode: required
    verification:
    - command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - verify
      - '{bet_id}'
      - --execute
      id: bet-verify
      mode: required
    - command:
      - uv
      - run
      - --with
