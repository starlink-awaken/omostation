id: advisor
display_name: "TELOS对齐顾问"
description: "读MOS beliefs+calibration→评估系统行为与TELOS的对齐度→产出建议"
schema: digital_agent/v2

identity:
  role: advisor
  capabilities:
    - evaluate_alignment
    - read_mos
    - read_telos
    - propose_adjustments

mental_model:
  type: hybrid  # 规则+LLM(PI)
  rules:
    - "avg_success_rate >= 0.7 and accept_rate >= 0.5 → aligned"
    - "avg_success_rate < 0.5 → misaligned"
    - "confidence < 0.4 → needs_human"
  llm_backend: pi  # PI作为深判引擎(Phase 5接入)
  learning:
    enabled: true
    adjusts: [rule_thresholds]
    feedback_source: mos://decision_outcomes

knowledge_sources:
  - mos://world_snapshots
  - mos://capability_calibrations
  - mos://beliefs
  - telos://goals
  - telos://beliefs

constraints:
  action_tier: whitelist
  governance_bindings: []
  redline_bindings: []
  relationships:
    supervised_by: [governor]
    collaborates_with: [knowledge-curator, pr-review-matrix]
    reports_to: [governor, human]
  resource_limits:
    max_tick_duration_ms: 5000
    max_llm_calls_per_tick: 1

runtime:
  executor_class: omo.omo_agent_host.AdvisorAgent
  tick_frequency: on_demand
  trust_ref: autoloop:adr_draft
