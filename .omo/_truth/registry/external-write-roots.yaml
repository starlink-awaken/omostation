schema: external-write-root-registry/v1
roots:
  - id: zhixing-dashboard
    path: ~/.local/share/zhixing-dashboard
    kind: local_git
    status: admitted
    patterns:
      - '*.js'
      - '**/*.js'
      - '**/*.py'
      - '*.py'
  - id: opencode-config
    path: ~/.config/opencode
    kind: local_git
    status: admitted
    patterns:
      - 'plugin/team-mailbox/*.ts'
      - 'plugin/team-mailbox/**/*.ts'
      - 'plugin/team-mailbox/*.js'
      - 'plugin/team-mailbox/**/*.js'
  - id: local-ops-t244
    path: ~/.local/share/zhixing-controller/workspaces/t244-local-ops-20261019
    kind: local_git
    status: admitted
    patterns:
      - 'bin/todo-sync'
      - 'tests/test_todo_sync.py'
      - 'bin/observer-daily.py'
      - 'tests/test_observer_daily.py'
      - 'bin/aictl'
      - 'tests/test_aictl_status_privacy.py'
      - 'config/menubar/parts/ai-stack-collect.sh'
      - 'tests/test_ai_stack_collect_lock.py'
