  program:
    interpreter: stable-python3
    entrypoint: bin/gac/meta-doctor.py
    args:
    - --workspace
    - .
    - --json
  notes: 治理活性巡检
  liveness:
    signal: .omo/_delivery/meta-doctor/
    max_stale_hours: 24
- id: cron.debt_refresh
  enabled: true
  scheduler: cron
  trigger: schedule
  schedule: 30 10 * * 1
  program:
    interpreter: uv
    entrypoint: projects/omo
    args:
    - debt
    - refresh
  notes: 每周债务刷新
  liveness:
    signal: .omo/_delivery/debt-refresh/
    max_stale_hours: 168
- id: mcp.agora
  enabled: true
  scheduler: manual
  trigger: on_demand
  transport: sse
  port: 7433
  program:
    interpreter: uv
    entrypoint: projects/agora
    args:
    - agora-mcp
    - --sse
  liveness:
    signal: http
    endpoint: http://localhost:7433/health
    max_stale_hours: 1
