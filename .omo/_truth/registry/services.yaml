  notes: 每周债务刷新
  liveness:
    signal: .omo/_delivery/debt-refresh/
    max_stale_hours: 168
- id: mcp.agora
  enabled: true
  scheduler: manual
  trigger: on_demand
  transport: sse
  port: 7433
  program:
    interpreter: uv
    entrypoint: projects/agora
    args:
    - agora-mcp
    - --sse
  liveness:
    signal: http
    endpoint: http://localhost:7433/health
