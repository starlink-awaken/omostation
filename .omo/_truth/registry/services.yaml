# 调度服务注册 (Scheduling Contract) — 理想态注册→生成→drift 闭环
#
# 调度配置 (launchd plist / GHA schedule / daemon) 从本注册生成, 不手写.
# 生成器 bin/mof/gen-service-configs.py 读此 → 产 plist (稳定锚点, 杜绝 uv 临时路径炸弹).
# GaC drift check: plist vs 本注册不一致 = drift.
# 见 P73 pattern + governance-ssot-edit skill.
#
# interpreter 锚点: stable-python3 → shutil.which("python3"); 绝对路径 → 直接用 (须稳定).

services:
  - id: governance.watch
    enabled: true
    scheduler: launchd
    trigger: watchpaths
    label: com.l4.governance.watch
    program:
      interpreter: stable-python3
      entrypoint: bin/gac/state-stale-emit.py
      # args 与 install-watch-agent.py 触发 + state-stale-emit --surface 需求一致 (SSOT 完整声明)
      args: [--source, launchd-watch, --trigger, watchpaths, --surface, .omo/_truth/registry, --surface, projects/ecos/src/ecos/ssot]
    watch_paths:
      - .omo/_truth/registry
      - projects/ecos/src/ecos/ssot
    environment:
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    resilience:
      keepalive: crashed
      throttle_interval: 10
    run_at_load: true
    outputs:
      stdout: runtime/logs/watch_stdout.log
      stderr: runtime/logs/watch_stderr.log
    liveness:
      signal: .omo/_knowledge/omo-events.jsonl
      event_kind: state_stale
      max_stale_hours: 24
    generated_by: bin/mof/gen-service-configs.py
    note: "原 install-watch-agent.py 硬编码 plist (sys.executable 炸弹), 治本后从本注册生成"

  # ── 引导扇区 (阶段4 元递归): GaC/health 工具自身调度注册 ──────────
  # 这些工具是 evidence/health/gac 真源, 调度注册为元递归闭环 (GaC 治含自身).
  # scheduler=gha/manual (非 launchd), gen-service-configs 跳过不生配置 —
  # 引导扇区: 这些工具定义 gen/evidence/health 本身, 不能由自己生成自己 (避循环),
  # 仅声明注册 (SSOT 完整: services.yaml 含所有调度含 GaC 自身).
  - id: evidence-smoke
    enabled: true
    scheduler: gha
    trigger: schedule
    program:
      interpreter: stable-python3
      entrypoint: bin/gac/evidence-smoke.py
    schedule_ref: .github/workflows/evidence-smoke-gate.yml
    liveness:
      signal: .omo/_delivery/evidence-smoke/
      max_stale_hours: 24
    note: "实测 health (回路多源 OR/BOS/dirty). gha 调度. 引导扇区 (evidence 源, 不自生)."
  - id: compass-radar
    enabled: true
    scheduler: gha
    trigger: schedule
    program:
      interpreter: stable-python3
      entrypoint: bin/compass_radar.py
    schedule_ref: .github/workflows/c2g-radar-daily.yml
    liveness:
      signal: .omo/state/health.yaml::generated_at
      max_stale_hours: 24
    note: "合成 health_score (含 feedback 硬门槛 PR#81). gha daily. 引导扇区."
  - id: gen-service-configs
    enabled: true
    scheduler: manual
    trigger: on-registry-change
    program:
      interpreter: stable-python3
      entrypoint: bin/mof/gen-service-configs.py
    note: "从本注册生 launchd plist (scheduler=launchd 项). manual/on-registry-change. 引导扇区 (生成本身, 不自生)."
  # ── 计算面 (omlx) ──────────────────────────────────────────
  # 2026-08-08: 这些一直在跑但没有生命周期声明, wsvc 的 S1 检查会持续告警。
  # 字段照 ~/Library/LaunchAgents/*.plist 的真实配置登记, 未臆造。
  # ── 本地算力中枢 ────────────────────────────────────────────────────────
  # 分工(SSOT: ~/omlx/conf/models.json 的 engine_policy):
  #   MBP      omlx(mlx_lm.server 等) 主引擎 + 加载器, LM Studio 兜底
  #   mac-mini / Y7000P   只跑 LM Studio, 三机经 LM Link 合成同一模型池
  - id: lmstudio.server
    enabled: true
    generate: false
    config_source: ~/Library/LaunchAgents/com.lmstudio.server.plist
    scheduler: launchd
    trigger: run_at_load
    label: com.lmstudio.server
    program:
      interpreter: /bin/bash
      entrypoint: ~/.lmstudio/bin/lms
      args: ["server", "start", "--port", "1234"]
    run_at_load: true
    outputs:
      stdout: /tmp/lmstudio-server.out.log
      stderr: /tmp/lmstudio-server.err.log
    notes: >-
      MBP 的 LM Studio server :1234(只绑 loopback; 跨机走 LM Link 自己的通道)。
      是 omlx 后端起不来时的兜底引擎, 也是 MBP 向 LM Link 池供模型的入口。
      2026-08-10 实测它当时并未运行, 池子从 43 个模型缩到 17 个而无人察觉 ——
      纳入注册表就是为了让这种"少了一台"能被看见。lms server start 幂等。

  - id: omlx.gateway
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: ~/omlx-orchestration/launchd/com.omlx.gateway.plist
    scheduler: launchd
    trigger: keepalive
    label: com.omlx.gateway
    program:
      interpreter: /bin/bash
      entrypoint: ~/.local/bin/omlx-gw-guard
      args: []
    resilience:
      keepalive: always
    run_at_load: true
    outputs:
      stdout: ~/Library/Logs/omlx-gateway.log
      stderr: ~/Library/Logs/omlx-gateway.log
    notes: >-
      LiteLLM 网关 :4000 —— **待退役**。职责已由 aetherforge.gateway 接管
      (门面过渡期同时监听 4000)。两者不能同时绑 4000, 切换时先停这条。
      另: 它实际下发的是 --host 0.0.0.0, 对同网段任意机器开放, 与
      "tailnet + localhost" 的说法不符; 门面只绑 loopback + tailnet。

  - id: omlx.gateway-ui
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: ~/omlx-orchestration/launchd/com.omlx.gateway-ui.plist
    scheduler: launchd
    trigger: keepalive
    label: com.omlx.gateway-ui
    program:
      interpreter: /bin/bash
      entrypoint: ~/.local/bin/omlx-gw-ui-guard
      args: []
    resilience:
      keepalive: always
    run_at_load: true
    outputs:
      stdout: ~/Library/Logs/omlx-gateway-ui.log
      stderr: ~/Library/Logs/omlx-gateway-ui.log
    notes: 网关 UI

  - id: omlx.autopilot
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: ~/omlx-orchestration/launchd/com.omlx.autopilot.plist
    scheduler: launchd
    trigger: interval
    interval_sec: 300
    label: com.omlx.autopilot
    program:
      interpreter: stable-python3
      entrypoint: ~/omlx-orchestration/bin/omlx-autopilot
      args: []
    run_at_load: true
    outputs:
      stdout: ~/omlx-orchestration/logs/autopilot.out.log
      stderr: ~/omlx-orchestration/logs/autopilot.err.log
    notes: 常驻预热 / 空闲卸载 / 内存压力触发 / LaunchAgent 自愈 / SSOT 自动同步

  - id: omlx.autostart
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: ~/omlx-orchestration/launchd/com.omlx.autostart.plist
    scheduler: launchd
    trigger: boot
    label: com.omlx.autostart
    program:
      interpreter: /bin/bash
      entrypoint: ~/omlx-orchestration/bin/omlx-autostart-boot.sh
      args: []
    resilience:
      keepalive: crashed
    run_at_load: true
    outputs:
      stdout: ~/omlx-orchestration/logs/autostart-agent.out.log
      stderr: ~/omlx-orchestration/logs/autostart-agent.err.log
    notes: 开机拉起本地模型

  # ── 服务面 (Workspace) ─────────────────────────────────────
  - id: agora.sse
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: 手写 plist (~/Library/LaunchAgents/com.agora.sse.plist)
    scheduler: launchd
    trigger: keepalive
    label: com.agora.sse
    program:
      interpreter: uv
      entrypoint: projects/agora
      args: ["agora-mcp", "--sse"]
    resilience:
      keepalive: always
    run_at_load: true
    ports: [7431]
    outputs:
      stdout: ~/.agora/logs/sse-stdout.log
      stderr: ~/.agora/logs/sse-stderr.log
    notes: Agora MCP (SSE 模式, :7431)。BOS 的 mcp_proxy 能力由本进程按需 spawn
      stdio 子进程承载 —— 它们不监听独立端口, 不要在 bos-services 里给它们写
      http endpoint (见 omostation-agora#19)。

  - id: cockpit.dashboard
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: 手写 plist (~/Library/LaunchAgents/com.cockpit.dashboard.plist)
    scheduler: launchd
    trigger: keepalive
    label: com.cockpit.dashboard
    program:
      interpreter: uv
      entrypoint: projects/cockpit
      args: ["python", "-m", "cockpit.dashboard_server", "--host", "127.0.0.1", "--port", "8090"]
    resilience:
      keepalive: crashed
    run_at_load: true
    ports: [8090]
    outputs:
      stdout: .omo/_delivery/cockpit-dashboard-stdout.log
      stderr: .omo/_delivery/cockpit-dashboard-stderr.log
    notes: Cockpit Web 面板 :8090 (含 /api/svc/* 服务控制面)。
      注意 8090 会自增占用 809x, 本地模型端口已避让到 818x/819x 段。

  # ── 数据面 (docker) ────────────────────────────────────────
  - id: docker.observability-db
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: docker compose (projects/observability)
    scheduler: docker
    trigger: compose
    label: "docker:observability-db-1"
    program:
      interpreter: docker
      entrypoint: projects/observability
      args: ["compose", "up", "-d"]
    notes: 可观测性数据库

  - id: docker.searxng
    enabled: true
    # plist/容器由外部拥有, 注册表只记录不生成 (见 gen-service-configs)
    generate: false
    config_source: docker compose
    scheduler: docker
    trigger: compose
    label: "docker:searxng"
    program:
      interpreter: docker
      entrypoint: searxng
      args: ["compose", "up", "-d"]
    ports: [8080]
    notes: 本地搜索。占用 8080 —— 本地模型端口曾与它冲突, 已避让。
  # ── LLM 入口 ───────────────────────────────────────────────
  - id: aetherforge.gateway
    enabled: true
    generate: false
    config_source: ~/Library/LaunchAgents/com.aetherforge.gateway.plist
    scheduler: launchd
    trigger: keepalive
    label: com.aetherforge.gateway
    program:
      interpreter: /bin/bash
      entrypoint: ~/.local/bin/aetherforge-gw-guard
      args: []
    resilience:
      keepalive: always
    run_at_load: true
    # 过渡期同时监听 4000: 调用方(kairon 10 处 / cockpit 2 处 / bin/gac 1 处)
    # 全写着 :4000, 门面就地接管这个位置, 停 LiteLLM 就是零改动的事。
    # 调用方迁到 9290 之后再把 4000 摘掉。两者不能同时绑 4000。
    ports: [9290, 4000]
    outputs:
      stdout: ~/Library/Logs/aetherforge-gateway.log
      stderr: ~/Library/Logs/aetherforge-gateway.log
    notes: >-
      aetherforge OpenAI 兼容门面 — LiteLLM :4000 的继任者。
      别名见 llm_gateway/aliases.yaml; SSOT 的 ENG-OMLX-LOCAL 已改指本端点。
      硬约束: 启动路径不得有外部网络依赖(guard 直接用项目 venv 解释器,
      不走 uv run), 且显式隔离系统代理 —— LiteLLM 曾栽在这两条上。
      绑到 loopback 之外(--bind tailnet)必须配 AETHERFORGE_API_KEY,
      否则拒绝启动 —— 绑定范围变大和鉴权消失不允许同时发生。
