status: active
lifecycle: ssot
owner: governance-team
last-reviewed: 2026-07-03
---
services:
- id: governance.watch
  enabled: true
  scheduler: launchd
  trigger: watchpaths
  label: com.l4.governance.watch
  program:
    interpreter: stable-python3
    entrypoint: bin/gac/state-stale-emit.py
    args:
    - --source
    - launchd-watch
    - --trigger
    - watchpaths
    - --surface
    - .omo/_truth/registry
    - --surface
    - projects/ecos/src/ecos/ssot
  watch_paths:
  - .omo/_truth/registry
  - projects/ecos/src/ecos/ssot
  environment:
    PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
  resilience:
    keepalive: crashed
    throttle_interval: 10
  run_at_load: true
  outputs:
    stdout: runtime/logs/watch_stdout.log
    stderr: runtime/logs/watch_stderr.log
  liveness:
    signal: .omo/_knowledge/omo-events.jsonl
    event_kind: state_stale
    max_stale_hours: 24
  generated_by: bin/mof/gen-service-configs.py
  note: 原 install-watch-agent.py 硬编码 plist (sys.executable 炸弹), 治本后从本注册生成
- id: evidence-smoke
  enabled: true
  scheduler: gha
  trigger: schedule
  program:
    interpreter: stable-python3
    entrypoint: bin/gac/evidence-smoke.py
  schedule_ref: .github/workflows/evidence-smoke-gate.yml
  liveness:
    signal: .omo/_delivery/evidence-smoke/
    max_stale_hours: 24
  note: 实测 health (回路多源 OR/BOS/dirty). gha 调度. 引导扇区 (evidence 源, 不自生).
- id: compass-radar
  enabled: true
  scheduler: gha
  trigger: schedule
  program:
    interpreter: stable-python3
    entrypoint: bin/compass_radar.py
  schedule_ref: .github/workflows/c2g-radar-daily.yml
  liveness:
    signal: .omo/state/health.yaml::generated_at
    max_stale_hours: 24
  note: 合成 health_score (含 feedback 硬门槛 PR#81). gha daily. 引导扇区.
- id: gen-service-configs
  enabled: true
  scheduler: manual
  trigger: on-registry-change
  program:
    interpreter: stable-python3
    entrypoint: bin/mof/gen-service-configs.py
  note: 从本注册生 launchd plist (scheduler=launchd 项). manual/on-registry-change. 引导扇区
    (生成本身, 不自生).
- id: lmstudio.server
  enabled: true
  generate: false
  config_source: ~/Library/LaunchAgents/com.lmstudio.server.plist
  scheduler: launchd
  trigger: run_at_load
  label: com.lmstudio.server
  program:
    interpreter: /bin/bash
    entrypoint: ~/.lmstudio/bin/lms
    args:
    - server
    - start
    - --port
    - '1234'
  run_at_load: true
  outputs:
    stdout: /tmp/lmstudio-server.out.log
    stderr: /tmp/lmstudio-server.err.log
  notes: MBP 的 LM Studio server :1234(只绑 loopback; 跨机走 LM Link 自己的通道)。 是 omlx 后端起不来时的兜底引擎,
    也是 MBP 向 LM Link 池供模型的入口。 2026-08-10 实测它当时并未运行, 池子从 43 个模型缩到 17 个而无人察觉 —— 纳入注册表就是为了让这种"少了一台"能被看见。lms
    server start 幂等。
  ports:
  - 1234
- id: omlxc.daemon
  enabled: true
  generate: false
  config_source: projects/omlxc/packaging/launchd/com.omlxc.daemon.plist
  scheduler: launchd
  trigger: keepalive
  label: com.omlxc.daemon
  program:
    interpreter: /usr/bin/env
    entrypoint: ~/.local/bin/omlxcd
    args: []
  transport: unix_socket
  socket_ref: omlxc.config.socket
  resilience:
    keepalive: crashed
  run_at_load: true
  notes: omlxc 私有本地算力守护进程，仅经权限受限的 Unix Socket 服务 CLI、TUI 与 AetherForge；不声明网络端口。plist
    由 projects/omlxc 自己安装和管理， Workspace 只登记生命周期，因此 generate=false。
- id: omlx.gateway
  enabled: false
  lifecycle: retired
  generate: false
  config_source: ~/omlx-orchestration/launchd/com.omlx.gateway.plist
  scheduler: launchd
  trigger: keepalive
  label: com.omlx.gateway
  program:
    interpreter: /bin/bash
    entrypoint: ~/.local/bin/omlx-gw-guard
    args: []
  resilience:
    keepalive: always
  run_at_load: true
  outputs:
    stdout: ~/Library/Logs/omlx-gateway.log
    stderr: ~/Library/Logs/omlx-gateway.log
  notes: 'LiteLLM 网关 :4000 —— 已退役。职责已由 aetherforge.gateway 接管 (门面过渡期同时监听 4000)。保留本条
    config_source/program 作为回滚记录， 不得与 aetherforge.gateway 同时启用。 另: 它实际下发的是 --host
    0.0.0.0, 对同网段任意机器开放, 与 "tailnet + localhost" 的说法不符; 门面只绑 loopback + tailnet。'
- id: omlx.gateway-ui
  enabled: false
  lifecycle: retired
  generate: false
  config_source: ~/omlx-orchestration/launchd/com.omlx.gateway-ui.plist
  scheduler: launchd
  trigger: keepalive
  label: com.omlx.gateway-ui
  program:
    interpreter: /bin/bash
    entrypoint: ~/.local/bin/omlx-gw-ui-guard
    args: []
  resilience:
    keepalive: always
  run_at_load: true
  outputs:
    stdout: ~/Library/Logs/omlx-gateway-ui.log
    stderr: ~/Library/Logs/omlx-gateway-ui.log
  notes: 已退役的网关 UI；保留 config_source/program 作为只读归档与回滚记录。
- id: omlx.autopilot
  enabled: false
  lifecycle: retired
  generate: false
  config_source: ~/omlx-orchestration/launchd/com.omlx.autopilot.plist
  scheduler: launchd
  trigger: interval
  interval_sec: 300
  label: com.omlx.autopilot
  program:
    interpreter: stable-python3
    entrypoint: ~/omlx-orchestration/bin/omlx-autopilot
    args: []
  run_at_load: true
  outputs:
    stdout: ~/omlx-orchestration/logs/autopilot.out.log
    stderr: ~/omlx-orchestration/logs/autopilot.err.log
  notes: 已退役；预热、空闲卸载、内存准入与自愈职责归 omlxc.daemon。 保留 config_source/program 作为只读归档与回滚记录。
- id: omlx.autostart
  enabled: false
  lifecycle: retired
  generate: false
  config_source: ~/omlx-orchestration/launchd/com.omlx.autostart.plist
  scheduler: launchd
  trigger: boot
  label: com.omlx.autostart
  program:
    interpreter: /bin/bash
    entrypoint: ~/omlx-orchestration/bin/omlx-autostart-boot.sh
    args: []
  resilience:
    keepalive: crashed
  run_at_load: true
  outputs:
    stdout: ~/omlx-orchestration/logs/autostart-agent.out.log
    stderr: ~/omlx-orchestration/logs/autostart-agent.err.log
  notes: 已退役；本地运行时启动与模型驻留由 omlxc.daemon 管理。 保留 config_source/program 作为只读归档与回滚记录。
- id: agora.sse
  enabled: false
  generate: false
  config_source: 手写 plist (~/Library/LaunchAgents/com.agora.sse.plist) — 已移除
  scheduler: launchd
  trigger: keepalive
  label: com.agora.sse
  program:
    interpreter: uv
    entrypoint: projects/agora
    args:
    - agora-mcp
    - --sse
  resilience:
    keepalive: always
  run_at_load: true
  ports:
  - 7431
  outputs:
    stdout: ~/.agora/logs/sse-stdout.log
    stderr: ~/.agora/logs/sse-stderr.log
  notes: Agora MCP (SSE 模式, :7431)。BOS 的 mcp_proxy 能力由本进程按需 spawn stdio 子进程承载 —— 它们不监听独立端口,
    不要在 bos-services 里给它们写 http endpoint (见 omostation-agora#19)。
- id: cockpit.dashboard
  enabled: true
  generate: false
  config_source: 手写 plist (~/Library/LaunchAgents/com.cockpit.dashboard.plist)
  scheduler: launchd
  trigger: keepalive
  label: com.cockpit.dashboard
  program:
    interpreter: uv
    entrypoint: projects/cockpit
    args:
    - python
    - -m
    - cockpit.dashboard_server
    - --host
    - 127.0.0.1
    - --port
    - '8090'
  resilience:
    keepalive: crashed
  run_at_load: true
  ports:
  - 8090
  outputs:
    stdout: .omo/_delivery/cockpit-dashboard-stdout.log
    stderr: .omo/_delivery/cockpit-dashboard-stderr.log
  notes: Cockpit Web 面板 :8090 (含 /api/svc/* 服务控制面)。 注意 8090 会自增占用 809x, 本地模型端口已避让到
    818x/819x 段。
- id: docker.observability-db
  enabled: true
  generate: false
  config_source: docker compose (projects/observability)
  scheduler: docker
  trigger: compose
  label: docker:observability-db-1
  program:
    interpreter: docker
    entrypoint: projects/observability
    args:
    - compose
    - up
    - -d
  notes: 可观测性数据库
  liveness:
    signal: docker
    max_stale_hours: 1
- id: docker.searxng
  enabled: true
  generate: false
  config_source: docker compose
  scheduler: docker
  trigger: compose
  label: docker:searxng
  program:
    interpreter: docker
    entrypoint: searxng
    args:
    - compose
    - up
    - -d
  ports:
  - 8080
  notes: 本地搜索。占用 8080 —— 本地模型端口曾与它冲突, 已避让。
  liveness:
    signal: docker
    max_stale_hours: 1
- id: aetherforge.gateway
  enabled: false
  generate: false
  config_source: ~/Library/LaunchAgents/com.aetherforge.gateway.plist — 已移除
  scheduler: launchd
  trigger: keepalive
  label: com.aetherforge.gateway
  program:
    interpreter: /bin/bash
    entrypoint: ~/.local/bin/aetherforge-gw-guard
    args: []
  resilience:
    keepalive: always
  run_at_load: true
  ports:
  - 9290
  - 4000
  outputs:
    stdout: ~/Library/Logs/aetherforge-gateway.log
    stderr: ~/Library/Logs/aetherforge-gateway.log
  notes: 'aetherforge OpenAI 兼容门面 — LiteLLM :4000 的继任者。 唯一公共推理 URI 是 bos://compute/aetherforge/infer；逻辑模型、认证与公共数据面
    归 AetherForge，本地物理 placement 与执行经 omlxc Unix Socket API。 硬约束: 启动路径不得有外部网络依赖(guard
    直接用项目 venv 解释器, 不走 uv run), 且显式隔离系统代理 —— LiteLLM 曾栽在这两条上。 绑到 loopback 之外(--bind
    tailnet)必须配 AETHERFORGE_API_KEY, 否则拒绝启动 —— 绑定范围变大和鉴权消失不允许同时发生。'
- id: omo.sync_daemon
  enabled: true
  scheduler: launchd
  trigger: interval
  interval_sec: 1800
  label: com.l4.omo.sync
  program:
    interpreter: uv
    entrypoint: projects/omo
    args:
    - omo-sync
  resilience:
    keepalive: crashed
    throttle_interval: 60
  run_at_load: true
  ports: []
  outputs:
    stdout: runtime/logs/omo-sync-stdout.log
    stderr: runtime/logs/omo-sync-stderr.log
  liveness:
    signal: .omo/state/system.yaml::governance_feedback_last_run
    max_stale_hours: 24
  notes: OMO sync daemon — 30min tick, audit→history→sync (dry-run), 只读
- id: resident.orchestrator
  enabled: true
  scheduler: launchd
  trigger: interval
  interval_sec: 30
  label: com.l4.resident.orchestrator
  program:
    interpreter: stable-python3
    entrypoint: bin/ssot/resident-orchestrator-daemon.py
    args: []
  resilience:
    keepalive: crashed
    throttle_interval: 30
  run_at_load: true
  ports: []
  outputs:
    stdout: runtime/logs/resident-orchestrator-stdout.log
    stderr: runtime/logs/resident-orchestrator-stderr.log
  liveness:
    signal: .omo/_knowledge/omo-events.jsonl
    event_kind: resident_tick
    max_stale_hours: 1
  notes: Resident 编排 daemon — ledger checkpoint + 规则路由 (30s 间隔)
- id: gac.daemon_watchdog
  enabled: true
  scheduler: launchd
  trigger: keepalive
  label: com.l4.gac.watchdog
  program:
    interpreter: stable-python3
    entrypoint: bin/gac/daemon-watchdog.py
    args: []
  resilience:
    keepalive: always
  run_at_load: true
  ports: []
  outputs:
    stdout: runtime/logs/gac-watchdog-stdout.log
    stderr: runtime/logs/gac-watchdog-stderr.log
  notes: GaC 自治 Daemon 看门狗 — 监控 Agora Bus (:7432) + BOS 服务, 自动修复重启
  liveness:
    signal: .omo/_delivery/gac-watchdog/
    max_stale_hours: 2
  depends_on:
  - omo.sync_daemon
- id: cron.capability_ownership
  enabled: true
  scheduler: cron
  trigger: schedule
  schedule: 30 8 * * *
  program:
    interpreter: stable-python3
    entrypoint: bin/gac/check-capability-ownership.py
  liveness:
    signal: .omo/_delivery/capability-ownership/
    max_stale_hours: 24
  notes: 每日能力所有权检查
- id: cron.agent_workflow_status
  enabled: true
  scheduler: cron
  trigger: schedule
  schedule: 0 9 * * *
  program:
    interpreter: uv
    entrypoint: bin/agent-workflow.py
