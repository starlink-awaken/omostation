  liveness:
    signal: .omo/_delivery/meta-doctor/
    max_stale_hours: 24
- id: cron.debt_refresh
  enabled: true
  scheduler: cron
  trigger: schedule
  schedule: 30 10 * * 1
  program:
    interpreter: uv
    entrypoint: projects/omo
    args:
    - debt
