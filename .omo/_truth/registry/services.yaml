  interval_sec: 1800
  label: com.l4.mail.daemon
  program:
    interpreter: stable-python3
    entrypoint: bin/ssot/mail_daemon.py
  resilience:
    keepalive: crashed
    throttle_interval: 300
  run_at_load: true
  outputs:
    stdout: runtime/logs/mail-daemon-stdout.log
    stderr: runtime/logs/mail-daemon-stderr.log
  notes: 邮件感知 daemon — 每 30min 读邮件→LLM 分类→任务提取
  liveness:
    signal: .omo/_delivery/mail-daemon/
    max_stale_hours: 2
  depends_on:
  - omo.sync_daemon
