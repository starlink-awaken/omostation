  topic: git-discipline
  belief: PATH shim 包装脚本内严禁在未净化 PATH 的情况下隐式内调 git 命令，否则会导致 Fork Bomb 死循环卡死 Bash
  pitfall: Wrapper 内 Bash/Python 调用子命令 git 继承了前置 PATH (~/.agents/shim/bin) 触发无限递归子进程
