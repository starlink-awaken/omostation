#   freq      resident|1min|2min|5min|30min|hourly|daily|weekly|event
#   intent    一句话意义
#   evidence  心跳/产物路径 (可选; 无则只查载体登记)
#   dormant_since  显式休眠标注 (历史活跃, 现停摆, 待人工裁决)
