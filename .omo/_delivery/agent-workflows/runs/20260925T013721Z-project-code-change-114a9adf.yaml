  acceptance:
    done_when:
    - id: AC-01
      assertion: A successful backend probe restores stale placements under that backend
        to current readiness and capacity state.
      evidence_type: structured_report
    - id: AC-02
      assertion: Transient no-capacity failures decay and do not require a gateway
        restart after backend recovery.
      evidence_type: structured_report
    - id: AC-03
      assertion: A deterministic missing placement remains rejected without unbounded
        retry.
      evidence_type: structured_report
    - id: AC-04
      assertion: Targeted daemon and gateway regression tests pass.
      evidence_type: structured_report
    - id: AC-05
      assertion: A live local readiness and authenticated inference canary is recorded,
        or the exact environmental blocker is recorded.
      evidence_type: structured_report
    verify_commands:
    - - cd projects/omlxc && uv run pytest tests/integration/test_task11_fix6_eligibility.py
