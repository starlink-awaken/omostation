  - code
  - governance_code
  - config
  lock_scopes:
  - 'project:'
  - root-gate
  phases:
    preflight:
    - id: root-status
      mode: required
      command:
      - git
      - status
      - --short
    - id: project-status
      mode: advisory
      cwd: projects/
      command:
      - git
      - status
      - --short
    - id: workflow-lint
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/agent-workflow.py
      - lint
    execute:
    - id: implement
      mode: manual
      command:
      - agent
      - edit
      - project-code
    verification:
    - id: project-tests
      mode: manual
      cwd: projects/
      command:
      - project-local
      - test-command
    - id: gac-local-gate
      mode: required
      command:
      - make
      - gac-local-gate
    closeout:
    - id: diff-stat
      mode: required
      command:
      - git
      - diff
      - --stat
