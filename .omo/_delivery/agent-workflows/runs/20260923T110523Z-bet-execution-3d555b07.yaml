plan:
  id: bet-execution
  title: 3Y bet execution
  purpose: '执行三年规划台账(docs/plans/3y-bet-ledger.yaml)里的单个 bet。 把 claim / 执行 / 验收 / 表面积记账
    / 复盘 / 钉死 六段固化为可复核的 phases, 避免每个 agent 各自记流程, 也避免继续错位挂在通用 project-code-change
    上(P74)。

    '
  agents:
    roles:
    - engineering-agent
    - governance-agent
    observer_policy: optional
  allowed_lanes:
  - docs
  - code
  - governance_code
  - governance_state
  - config
  lock_scopes:
  - bet:BET-Y2Q2-T4-01
  - root-gate
  phases:
    preflight:
    - id: status
      mode: required
      command:
      - git
      - status
      - --short
    - id: ledger-lint
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - lint
    - id: claim-check
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - claim-check
      - BET-Y2Q2-T4-01
    - id: worktree-claim
      mode: required
      command:
      - bash
      - bin/gac/gac-worktree.sh
      - claim
      - BET-Y2Q2-T4-01
    execute:
    - id: read-bet
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - show
      - BET-Y2Q2-T4-01
    - id: implement
      mode: manual
      command:
      - agent
      - edit
      - bet-write-surfaces-only
      note: 只改 bet.write_surfaces 列出的路径; non_goals 是硬边界; 每写完一个文件立刻 git add (D0)
    verification:
    - id: bet-verify
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - verify
      - BET-Y2Q2-T4-01
      - --execute
    - id: surface-accounting
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - surface
      note: D2 — 必须把净增减写进复盘 Q4
    - id: gac-local-gate
      mode: required
      command:
      - make
      - gac-local-gate
    - id: ssot-guardian
      mode: required
      command:
      - make
      - ssot-guardian
    - id: sync-check
      mode: required
      command:
      - python3
      - bin/ssot/post-commit-sync-check.py
      note: 迭代后派生文档同步检查 (子模块指针变更 → sync-all-docs + 提示提交)
    closeout:
    - id: retro-written
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - retro-due
      note: D5 — 本 bet 的 .omo/_knowledge/retros/BET-Y2Q2-T4-01.md 必须存在且五问齐全
    - id: pin-tag
      mode: required
      command:
      - agent
      - run
      - git tag -a bet/BET-Y2Q2-T4-01-$(date -u +%Y%m%dT%H%M%SZ) -m "BET-Y2Q2-T4-01
        deliverable"
      note: D0 — commit 只是暂时安全, 共享分支 rebase 会挤掉提交; tag ref 不会
    - id: diff-stat
      mode: required
      command:
      - git
      - diff
      - --stat
    - id: worktree-submit
      mode: manual
      command:
      - bash
      - bin/gac/gac-worktree.sh
      - submit
      - BET-Y2Q2-T4-01
    - id: bet-complete
      mode: required
      command:
      - uv
      - run
      - --with
      - pyyaml
      - python
      - bin/plan/bet-ledger.py
      - complete
      - BET-Y2Q2-T4-01
      note: 'P1: 台账回写 — retro 通过后置 done (防 done 状态滞后)'
