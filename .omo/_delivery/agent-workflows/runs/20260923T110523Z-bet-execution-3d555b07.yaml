        capability.
      evidence_type: structured_report
    - id: AC-03
      assertion: Fresh A1-A9, SFOP, managed code-root health, workflow observer, and
        OMO single-control-plane checks pass from one authoritative source set.
      evidence_type: structured_report
    - id: AC-04
      assertion: Strategy, architecture, runtime, and Ledger map one Vision-to-Episode-to-Memory
        chain without a parallel SSOT, dispatcher, ontology, or top-level project.
      evidence_type: structured_report
    - id: AC-05
      assertion: One real external personal work signal completes the full Decision
        Episode lifecycle through EpisodeClosed with a valid Mandate for every external
        action.
      evidence_type: structured_report
    - id: AC-06
      assertion: Accept, edit, reject, and ignore adjudications preserve original
        signals, concrete revision diffs, outcomes, costs, and human time burden.
      evidence_type: structured_report
    - id: AC-07
      assertion: At least 30 qualifying v2 real records exist; no fixture, backfill,
        gate, test, PR, commit, or agent count qualifies.
      evidence_type: structured_report
    - id: AC-08
      assertion: Four consecutive weeks each contain at least three principal-accepted
        and verifiable delegated outcomes.
      evidence_type: structured_report
    - id: AC-09
      assertion: Human approval and correction time remains below system time saved;
        otherwise the Golden Scenario is degraded or stopped.
      evidence_type: structured_report
