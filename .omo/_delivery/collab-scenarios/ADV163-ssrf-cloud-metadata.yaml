id: ADV163-ssrf-cloud-metadata
category: B_failure_injection
adversarial: true
seed: 263
description: >
  [对抗·red-team wave28] SSRF 打云元数据: 内网请求窃取实例角色凭证,
  管线尚无 ssrf_cloud_metadata_detected → 预期 FAIL
setup:
  blackboard:
    - {key: fetch_url, value: "https://api.example.com", writers: [app]}
  roles: [attacker, app, metadata]
inject:
  - {type: write_conflict, role: attacker, target: fetch_url, value: "http://169.254.169.254/latest/meta-data/iam"}
  - {type: write_conflict, role: app, target: http_client, value: "server_side_fetch"}
  - {type: write_conflict, role: metadata, target: iam_creds, value: "role_keys_leaked"}
  - {type: write_conflict, role: attacker, target: loot, value: "aws_keys"}
expected:
  behavior: ssrf_cloud_metadata_detected
  silent_loss: 0
verdict:
  - criterion: ssrf_cloud_metadata_detected
    check: events_contain
    args: {kind: ssrf_cloud_metadata_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
