expected:
  behavior: state_bloat_grief_detected
  silent_loss: 0
verdict:
  - criterion: state_bloat_grief_detected
    check: events_contain
    args: {kind: state_bloat_grief_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
