id: ADV131-ci-secret-exfil
category: B_failure_injection
adversarial: true
seed: 231
description: >
  [对抗·red-team wave23] CI 密钥外泄: 恶意 workflow 步骤打印/上传 secrets,
  管线已有 ci_secret_exfil_detected → 预期 PASS
setup:
  blackboard:
    - {key: ci_secrets, value: "masked", writers: [ci]}
  roles: [attacker, ci, runner]
inject:
  - {type: write_conflict, role: attacker, target: workflow_step, value: "echo_all_env"}
  - {type: write_conflict, role: runner, target: ci_secrets, value: "unmasked_in_log"}
  - {type: write_conflict, role: attacker, target: upload_artifact, value: "secrets_dump.txt"}
  - {type: write_conflict, role: attacker, target: remote_sink, value: "exfil_complete"}
expected:
  behavior: ci_secret_exfil_detected
  silent_loss: 0
verdict:
  - criterion: ci_secret_exfil_detected
    check: events_contain
    args: {kind: ci_secret_exfil_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
