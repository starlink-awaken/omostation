id: ADV177-http-request-smuggling
category: B_failure_injection
adversarial: true
seed: 277
description: >
  [对抗·red-team wave30] HTTP 请求走私: CL.TE 歧义走私后门请求,
  管线尚无 http_request_smuggling_detected → 预期 FAIL
setup:
  blackboard:
    - {key: front_proxy, value: "CL", writers: [proxy]}
  roles: [attacker, proxy, origin]
inject:
  - {type: write_conflict, role: attacker, target: headers, value: "Content-Length_and_Transfer-Encoding_chunked"}
  - {type: write_conflict, role: proxy, target: parse_mode, value: "prefer_CL"}
  - {type: write_conflict, role: origin, target: parse_mode, value: "prefer_TE"}
  - {type: write_conflict, role: attacker, target: smuggled, value: "admin_POST_hidden"}
expected:
  behavior: http_request_smuggling_detected
  silent_loss: 0
verdict:
  - criterion: http_request_smuggling_detected
    check: events_contain
    args: {kind: http_request_smuggling_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
