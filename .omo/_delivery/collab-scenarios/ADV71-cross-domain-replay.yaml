id: ADV71-cross-domain-replay
category: B_failure_injection
adversarial: true
seed: 171
description: >
  [对抗·red-team wave12] 跨域重放: 域A签名消息在域B再次执行,
  管线尚无 cross_domain_replay_detected → 预期 FAIL
setup:
  blackboard:
    - {key: domain_a_msg, value: "sig_payload_xyz", writers: [relayer]}
  roles: [relayer, executor]
inject:
  - {type: write_conflict, role: executor, target: domain_b_exec, value: "sig_payload_xyz"}
  - {type: write_conflict, role: executor, target: domain_b_exec, value: "sig_payload_xyz"}
expected:
  behavior: cross_domain_replay_detected
  silent_loss: 0
verdict:
  - criterion: cross_domain_replay_detected
    check: events_contain
    args: {kind: cross_domain_replay_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
