id: ADV121-rpc-auth-bypass
category: B_failure_injection
adversarial: true
seed: 221
description: >
  [对抗·red-team wave22] RPC 鉴权绕过: 未授权调用 admin RPC 修改节点配置,
  管线已有 rpc_auth_bypass_detected → 预期 PASS
setup:
  blackboard:
    - {key: rpc_acl, value: "auth_required", writers: [node]}
  roles: [attacker, node, admin]
inject:
  - {type: write_conflict, role: attacker, target: rpc_acl, value: "auth_disabled"}
  - {type: write_conflict, role: attacker, target: admin_rpc, value: "set_peer_ban_all"}
  - {type: write_conflict, role: attacker, target: node_config, value: "open_debug_port"}
  - {type: write_conflict, role: node, target: security_flag, value: "compromised"}
expected:
  behavior: rpc_auth_bypass_detected
  silent_loss: 0
verdict:
  - criterion: rpc_auth_bypass_detected
    check: events_contain
    args: {kind: rpc_auth_bypass_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
