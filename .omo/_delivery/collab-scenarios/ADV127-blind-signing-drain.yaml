id: ADV127-blind-signing-drain
category: A_conflict
adversarial: true
seed: 227
description: >
  [对抗·red-team wave22] 盲签抽干: 用户盲签恶意 payload 导致资产转出,
  管线尚无 blind_signing_drain_detected → 预期 FAIL
setup:
  blackboard:
    - {key: wallet_balance, value: "10000", writers: [user]}
  roles: [user, dapp, attacker]
inject:
  - {type: write_conflict, role: dapp, target: sign_request, value: "opaque_hex_blob"}
  - {type: write_conflict, role: user, target: signature, value: "blind_signed_ok"}
  - {type: write_conflict, role: attacker, target: wallet_balance, value: "0"}
  - {type: write_conflict, role: attacker, target: attacker_wallet, value: "received_10000"}
expected:
  behavior: blind_signing_drain_detected
  silent_loss: 0
verdict:
  - criterion: blind_signing_drain_detected
    check: events_contain
    args: {kind: blind_signing_drain_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
