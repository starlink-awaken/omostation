id: ADV125-clock-sync-poison
category: B_failure_injection
adversarial: true
seed: 225
description: >
  [对抗·red-team wave21] 时钟同步投毒: 伪造 NTP/时源使节点时间漂移导致共识失败,
  管线尚无 clock_sync_poison_detected → 预期 FAIL
setup:
  blackboard:
    - {key: wall_clock, value: "synced", writers: [ntp]}
  roles: [attacker, ntp, node_a, node_b]
inject:
  - {type: write_conflict, role: attacker, target: ntp_response, value: "skew_plus_2h"}
  - {type: write_conflict, role: node_a, target: wall_clock, value: "skewed_ahead"}
  - {type: write_conflict, role: node_b, target: wall_clock, value: "still_correct"}
  - {type: write_conflict, role: node_a, target: consensus_view, value: "timestamp_reject_storm"}
expected:
  behavior: clock_sync_poison_detected
  silent_loss: 0
verdict:
  - criterion: clock_sync_poison_detected
    check: events_contain
    args: {kind: clock_sync_poison_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
