id: ADV63-reentrancy
category: B_failure_injection
adversarial: true
seed: 163
description: >
  [对抗·red-team wave11] 重入: 回调中再次扣减余额,
  管线尚无 reentrancy_detected → 预期 FAIL
setup:
  blackboard:
    - {key: balance, value: "100", writers: [vault]}
  roles: [vault, attacker]
inject:
  - {type: write_conflict, role: attacker, target: balance, value: "50"}
  - {type: write_conflict, role: attacker, target: balance, value: "0"}
  - {type: write_conflict, role: attacker, target: withdraw_log, value: "withdraw_100_twice"}
expected:
  behavior: reentrancy_detected
  silent_loss: 0
verdict:
  - criterion: reentrancy_detected
    check: events_contain
    args: {kind: reentrancy_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
