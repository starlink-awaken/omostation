id: ADV161-sqli-auth-bypass
category: B_failure_injection
adversarial: true
seed: 261
description: >
  [对抗·red-team wave27] SQL 注入鉴权绕过: 登录查询拼接导致恒真,
  管线尚无 sqli_auth_bypass_detected → 预期 FAIL
setup:
  blackboard:
    - {key: auth_query, value: "parameterized", writers: [app]}
  roles: [attacker, app, db]
inject:
  - {type: write_conflict, role: attacker, target: username, value: "admin' OR '1'='1"}
  - {type: write_conflict, role: app, target: auth_query, value: "string_concat_sql"}
  - {type: write_conflict, role: db, target: query_result, value: "row_returned_true"}
  - {type: write_conflict, role: attacker, target: session, value: "admin_without_password"}
expected:
  behavior: sqli_auth_bypass_detected
  silent_loss: 0
verdict:
  - criterion: sqli_auth_bypass_detected
    check: events_contain
    args: {kind: sqli_auth_bypass_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
