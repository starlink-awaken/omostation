id: ADV173-file-upload-webshell
category: B_failure_injection
adversarial: true
seed: 273
description: >
  [对抗·red-team wave29] 上传 Webshell: 双扩展名绕过过滤执行远程代码,
  管线尚无 file_upload_webshell_detected → 预期 FAIL
setup:
  blackboard:
    - {key: upload_dir, value: "/var/www/uploads", writers: [app]}
  roles: [attacker, app, runtime]
inject:
  - {type: write_conflict, role: attacker, target: filename, value: "photo.jpg.php"}
  - {type: write_conflict, role: app, target: mime_check, value: "trust_client_type"}
  - {type: write_conflict, role: app, target: stored_path, value: "/var/www/uploads/photo.jpg.php"}
  - {type: write_conflict, role: runtime, target: exec, value: "webshell_rce"}
expected:
  behavior: file_upload_webshell_detected
  silent_loss: 0
verdict:
  - criterion: file_upload_webshell_detected
    check: events_contain
    args: {kind: file_upload_webshell_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
