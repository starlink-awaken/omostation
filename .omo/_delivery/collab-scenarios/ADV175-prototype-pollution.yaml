  - {type: write_conflict, role: app, target: merge_lib, value: "unsafe_recursive_merge"}
  - {type: write_conflict, role: runtime, target: Object_prototype, value: "isAdmin_true"}
  - {type: write_conflict, role: attacker, target: auth_check, value: "bypass_via_polluted_proto"}
expected:
