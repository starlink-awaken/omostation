id: ADV107-cross-chain-msg-replay
category: B_failure_injection
adversarial: true
seed: 207
description: >
  [对抗·red-team wave18] 跨链消息重放: 同 nonce 消息在多链重复执行,
  管线尚无 cross_chain_msg_replay_detected → 预期 FAIL
setup:
  blackboard:
    - {key: msg_nonce, value: "nonce_42", writers: [relayer]}
  roles: [relayer, attacker, chain_a, chain_b]
inject:
  - {type: write_conflict, role: relayer, target: msg_payload, value: "transfer_1000"}
  - {type: write_conflict, role: chain_a, target: exec_nonce_42, value: "executed_once"}
  - {type: write_conflict, role: attacker, target: exec_nonce_42_b, value: "replay_on_chain_b"}
  - {type: write_conflict, role: chain_b, target: balance_attacker, value: "double_credit"}
expected:
  behavior: cross_chain_msg_replay_detected
  silent_loss: 0
verdict:
  - criterion: cross_chain_msg_replay_detected
    check: events_contain
    args: {kind: cross_chain_msg_replay_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
