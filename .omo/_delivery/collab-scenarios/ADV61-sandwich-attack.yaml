description: >
  [对抗·red-team wave11] 三明治攻击: 前后夹击受害交易,
  管线尚无 sandwich_attack_detected → 预期 FAIL
setup:
  blackboard:
    - {key: pool_price, value: "100", writers: [pool]}
  roles: [pool, attacker, victim]
inject:
  - {type: write_conflict, role: attacker, target: pool_price, value: "110"}
  - {type: write_conflict, role: victim, target: victim_swap, value: "swap_at_110"}
  - {type: write_conflict, role: attacker, target: pool_price, value: "100"}
  - {type: write_conflict, role: attacker, target: attacker_profit, value: "extracted"}
expected:
  behavior: sandwich_attack_detected
  silent_loss: 0
verdict:
  - criterion: sandwich_attack_detected
    check: events_contain
    args: {kind: sandwich_attack_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
