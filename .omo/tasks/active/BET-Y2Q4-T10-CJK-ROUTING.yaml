appetite: 1 day
desc: >-
  packages/mos/src/mos/routing.py 第 32-40 行的 _CODE_RE / _PREF_RE / _ENTITY_RE /
  _TASK_RE / _CARD_RE / _FILE_RE 各自把**整个 alternation** 包在 \b(...)\b 里，
  包括 CJK 分支。失效机制不是「CJK 不是词字符」—— Python 的 \b 定义在 \w 之上，
  而 str pattern 的 \w 是 Unicode 感知的、**包含 CJK**；真正的机制是 CJK 串内部
  **处处都是词字符**：在 文档路径 里 文档 后面紧跟 路，两侧都不存在边界，
  \b文档\b 因此不成立。第 41 行的注释早已写明该规则（"avoid \b for CJK tokens
  (Python word-boundary is ASCII-oriented)"），且**只有 _TEMPORAL_RE 遵守**。
  但遵守规则 ≠「中文时间表达今天能路由」：_TEMPORAL_RE 的词表是
  时效/有效期/何时生效/过期，加 ASCII 的 valid_from/valid_to/expired/as-of/until/
  effective/before YYYY/after YYYY，**不含任何年份或月份相对词** ——
  词表里没有 去年/今年/明年/前年/后年/上个月/本月/上月/下月。
  所以今天只有上述那几个中文时间词能路由，年份月份相对词全部落 general。
  第 41-44 行注释是「已记录但未执行」的典型：规则在案，执行缺失。
