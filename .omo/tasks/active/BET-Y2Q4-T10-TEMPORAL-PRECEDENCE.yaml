desc: >-
  这是一条**待决问题**记录，不是进行中的修复。先说清一件本记录上一版搞错的事：
  **待决问题按原措辞无法成立**。上一版把它写成「年份相对词（去年/今年/明年/前年/后年）
  是否应当压过文档/卡片类名词」，但 _TEMPORAL_RE 里根本没有这些词 —— 它的词表是
  时效/有效期/何时生效/过期，加 ASCII 的 valid_from/valid_to/expired/as-of/until/
  effective/before YYYY/after YYYY（routing.py:42-45）；git log -S 证明该 pattern 自
  bf5c02db 起逐字节未变、从未持有过年份或月份相对词。所以「去年写的文档」这类查询今天
  压根到不了 TEMPORAL 分支：它落 general 是因为**没有任何 pattern 匹配**，不是因为
  TEMPORAL 短路赢了。可复现的版本是同一个问题的另一组词 —— _TEMPORAL_RE **实际持有**的
  那些时间词与文档/卡片/偏好/实体类名词同时出现在一条查询里时谁该胜出。
  classify_intent 的检查顺序是 CODE → TASK → TEMPORAL → PREF → ENTITY → CARD → FILE，
  一个查询同时命中两三个 pattern 时胜者纯由检查顺序决定，与用户真实意图无关 ——
  这条性质是真的，且今天可测。决策本身仍然成立，只是必须按实际词表重新提问。
non_goals:
