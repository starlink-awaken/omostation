decision_to_make: >-
  （2026-10-04 按实际词表重述）_TEMPORAL_RE 持有的时间词 —— 时效 / 有效期 / 何时生效 /
  过期 / effective / expired / until / as-of / valid_from / valid_to / before YYYY /
  after YYYY —— 是否应在 classify_intent 中压过文档类名词（ADR / 文档 / 笔记 / 哪个文件）
  与卡片类名词（card / 知识卡片）？即 _TEMPORAL_RE 保持排在 _FILE_RE / _CARD_RE 之前，
  还是下移。原措辞「年份相对词（去年/今年/…）是否压过文档名词」**不可回答**：那些词不在
  _TEMPORAL_RE 里，该竞争在今天的代码上不存在。若人类认为「中文年份相对词本就该路由到
  temporal_fact」，那是一个**新增词表**的决策（应另开 BET），不是重排决策 ——
  先加词，重排才有对象。
