measurement_correction: >-
  （2026-10-04 重写）上一版的「修正」建立在一条假推断上：它说「因为 _TEMPORAL_RE 是六个里
  唯一本就合规的 pattern，且排在 _CARD_RE/_PREF_RE/_ENTITY_RE/_FILE_RE 之前，
  任何含年份词的查询在修复前就已经在 TEMPORAL 短路」。**年份词不在 _TEMPORAL_RE 里，
  没有任何短路发生** —— 这 8 条查询在 915fc76b 上 matched_patterns 全为空，落 general 是
  「零命中」而非「TEMPORAL 胜出」。纠正后的读数分三层：
  (1) 无时间词的查询确实受 \b 缺陷支配，但方向与上一版相反 —— 它们今天**全部**落 general
  （函数在哪个文件 general、谁调用了去年的任务 general），不是「变成了 code_structure」。
  上一版声称的迁移来自已丢失的 worktree，无法复跑。
  (2) 含年份词的查询今天对本决策**完全不可观察** —— 不是「读数相同所以看起来没问题」，
  而是根本没有竞争发生。
  (3) 唯一可观察 precedence 的是 _TEMPORAL_RE 实际持有的词，即上表 live-precedence 8 行。
  本决策真正的影响面是 (3)。(2) 要变成 (3) 的对象，前提是有人先把年份词加进词表。
options:
- option: A — 接受 temporal 优先，维持现状
  consequence: >-
    零行为改动、零回归风险，探测表与 pin 断言原样保留。代价：_TEMPORAL_RE 持有的时间词
    会吞掉文档 / 卡片 / 偏好 / 实体查询 —— 实测 有效期 ADR / 过期 ADR 去查时间线而非文档，
    effective card / effective preference / effective relation 同理。这是**今天真实发生**的
    召回损失，且与中文年份词无关。
- option: B — 把 _TEMPORAL_RE 下移到 _FILE_RE / _CARD_RE 之后
  consequence: >-
    文档/卡片优先，名词成为主意图、时间词降为修饰。按 live-precedence 8 行精确推算影响面：
    TEMPORAL 当前赢的 6 行（effective ADR / 过期 ADR / 有效期 ADR / effective card /
    effective preference / effective relation）会全部翻到名词侧；effective call graph 与
    expired task 两行不变（CODE / TASK 本来就排在 TEMPORAL 之前）。token-gap 8 行不受影响 ——
    它们今天零命中，将来仍零命中，除非同时新增年份词表。须重跑全部探测表 + eval_harness，
    并更新 pin 断言。
- option: C — 收窄时间词作用域
  consequence: >-
    例如要求时间词与查询其余部分构成「时间限定 + 载体名词」时才让 TEMPORAL 胜出，或把
    时效 / 有效期 / 何时生效 / 过期 降到只在无其他 pattern 命中时才生效。代价：规则复杂度
    上升，需要新的判定函数与更完整的基线；收益是同时保住两类查询的召回。**注意**：本选项
    上一版写成「收窄年份词作用域」，而年份词不在 _TEMPORAL_RE 里，无从收窄 —— 已按实际
    持有的词重述。若人类的真实意图是让中文年份词参与路由，那是新增词表，须另开 BET。
