  2. cron 准入校验 — gen-service-configs --validate (CI) 增加 cron 规则:
     enabled cron 条目必须带可匹配 token (id 尾段出现于 entrypoint,
     或显式 crontab_token 字段), 拒绝 `projects/omo` 类占位 entrypoint
     再进注册表 (批次 18 抓到的 30 条误判根因).

