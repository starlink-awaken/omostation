desc: |
  metaos Phase 0 (P0-1..P0-5 + §J1) 已完成 — 260 passed, §J1 漂移门上线 (ADR-0242,
  一扇门覆盖 MOF + metaos registry), CI 3 个 ignore 移除 (本地全量绿证明安全),
  P0-5 失真防复发门 (check-doc-claims). Phase 1/2 启动前需人类拍板四项决策 (workorder §F):

  D1 metaos CLI 定位 — 提案推荐 A (正名为 cockpit 稳定契约). 老王判断: 同意 A.
    注意与 MOF D1 (删 CLI) 结论相反 — 按消费实证定去留 (metaos CLI 是 cockpit
    活契约, model-driven CLI 无消费者). 老王不自决.

  D2 PID 控制器 — 提案推荐 A (标 experimental 降级). 老王判断: 同意 A. 无消费者
    的能力宣称一律降级 (S2 消费驱动).

  D3 agentkit — 提案 A (兑现 v0.2 门控) / B (降级 reference). 老王判断: 倾向 B 兜底.
    理由: 与当前 agent 协作主轴 (C 波) 资源竞争; A 值 +1 周但战略价值可延后.

  D4 admit 门禁 blocking — 提案推荐 A (转 blocking, 2 周观察期). 老王判断: 同意 A
    但强调观察期. informational 门禁等于没门禁, 但转 blocking 前必须有误拦数据.

  红线: 不加回 metaos 独立 MCP 入口 (ADR-0181, 不可议). PID 激活 / 真 codegen
  式能力扩张另立 ADR. 为无消费者的宣称补实现违反 S2 (一律降级不补).

  Human: 拍板 D1-D4 (可逐项 A/B/否决). 拍板前不启动 Phase 1/2 任何 deliverable.
