title: 'AGE-v2 Agent Cell 违反 SFOP 八律第3条(后端不拥有收件箱): omo cli.py 直连路由需改经 Mesh 分发'
description: '现状: ADR-0401(2026-08-24 accepted)采用 AGE-v2 五角色架构(Planner/Executor/Verifier/Coordinator/Governor);
  SFOP v1(2026-08-25, docs/architecture/os-operating-pattern-v1.md)把 AGE-v2 Cell 正式分类进
  B(后端)槽, S槽(唯一dispatcher)是 COMP-WS-omo/Mesh。八律第3条''后端不拥有收件箱'', B槽''禁止变成''一栏写的就是''收件箱主人''。真实违规:
  projects/omo/src/omo/cli.py 的 cell 子命令直接路由到 omo.resident.cell_cli, 绕开 Mesh(workflow_mesh.py)独立当收件箱。这条八律目前没有对应的
  bin/gac/check-sfop-slots.py 自动化检查(不是被重命名成 CR-X3-NS-001, 那是另一条不相关规则——北极星分子污染检测)。任务:
  1) 设计 Mesh 如何分发到 B 槽后端(现状待查, workflow_mesh.py 是否已有通用后端分发机制); 2) 把 omo cell 入口改经
  Mesh 分发; 3) 给八律第3条补一条 CR-SFOP-0X 自动化检查。2026-09-11 用户已批准方向。'
