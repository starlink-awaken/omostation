schema: agent-error/v1
id: PITFALL-GAT-012
category: gate
severity: medium
title: git 的 hook-was-ignored 提示是告知现状不是请求修复 —— 别顺手 chmod；确要启用须先重写判定逻辑 + 补回归测试
symptom: git 提示 The '.githooks/pre-rebase' hook was ignored because it's not set as executable，看起来像漏配权限，顺手
  chmod +x 就能修好
root_cause: 脚本本身从未通过测试：① 逃生口写死失效 —— 单引号 [ ] 里 != 是字面串比较，只有 [[ ]] 才做 glob 模式匹配，所以 SWARM_ESCAPE_ID=rebase-ci
  永远不生效；② git pre-rebase 的签名是 <upstream> [<branch>]，第 2 参是被 rebase 的分支名而不是 onto，脚本声称的拒绝 rebase onto main
  逻辑从来没实现过。缺执行位反而让这份未验证脚本一直是惰性的。
solution: '先实测再动手，别把 hint 当缺陷。三条证据：逃生口 exit 1 复现；$2 语义核对 git hooks man；在落后 main 的分支上跑 PITFALL-GAT-007
  规定的 git rebase origin/main → 该 hook exit 1，即激活 = 全场 Agent push 前动作失效。正确处置是只报告 + 上报 principal；真要修得重写判定逻辑（用
  [[ ]] 模式匹配、正确取 onto）并补 pre-rebase 回归测试。


  resolved: 2026-10-05 按本 PITFALL 的 solution 字段执行（principal 决策）。① pre-rebase 改用 escaped() 辅助函数（[[ ]] glob），onto
  改从 $1 读取，$2 降级为分支名提示；② 三个 hook（pre-rebase / pre-merge-commit / post-merge）补 +x，模式 100755 入 git index；③
  新增 tests/unit/gac/test_pre_rebase_hook.py 15 用例，含真实 git 仓库端到端（造 bare origin + feature/main 分支）；④ 新增
  .github/workflows/hook-regression.yml 接线 CI —— 因 governance-check.yml:118 的 pytest 是显式白名单、不含 tests/unit/**，不放进独立
  workflow 则该测试在 CI 永远不可见。变异测试确认判别力：把 [[ ]] 退回 [ ] → 逃生口用例红；把 onto 改回 $2 → 3 个用例红（含端到端）。'
resolved: 2026-10-05 按本 PITFALL 的 solution 字段执行（principal 决策）。① pre-rebase 改用 escaped() 辅助函数（[[ ]] glob），onto
  改从 $1 读取，$2 降级为分支名提示；② 三个 hook（pre-rebase / pre-merge-commit / post-merge）补 +x（模式 100755 入 git index）；③
  新增 tests/unit/gac/test_pre_rebase_hook.py 15 个用例，含真实 git 仓库端到端；④ 新增 .github/workflows/hook-regression.yml
  接线 CI —— 因 governance-check.yml:118 的 pytest 是显式白名单、不含 tests/unit/**，不放进独立 workflow 则测试在 CI 永远不可见。变异测试确认判别力：把
  [[ ]] 退回 [ ] → 逃生口用例红；把 onto 改回 $2 → 3 个用例红（含端到端）。
prevention: 动 .githooks/ 任何脚本前先跑一次它的正向用例和逃生用例；git 的 'hook was ignored because it's not set as executable'
  提示是在告知现状，不是在请求修复。改 hook 属交付面变更，需 principal 决策。修复后仍须守住三条：① 逃生口用 [[ ]] 而非 [ ]（后者 != 是字面串比较，glob 永不生效）②
  读 git 传的参数前先实测（造真仓库跑探针 hook 打印 ARGC，本例实测 `git rebase main` 只有 $1、`--onto` 形态才有 $2）③ 测试要有判别力，注入旧缺陷验证测试会红。
  修复后仍须守住三条：① 逃生口用 [[ ]] 而非 [ ]（后者 != 是字面串比较，glob 永不生效）；② 读 git 传给 hook 的参数前先实测（造真仓库装探针 hook 打印 ARGC；本例实测
  `git rebase main` 只有 $1，`--onto` 形态才有 $2）；③ 新测试必须有判别力——注入旧缺陷验证测试会红，否则「绿」只是没命中。
