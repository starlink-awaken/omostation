schema: agent-error/v1
id: PITFALL-COO-003
category: coordination
severity: high
title: git add -A 误 stage 子仓旧指针（worktree 共享环境）
symptom: add -A 后 commit 含 projects/<sub> gitlink 指向 side-branch/旧 checkout；被 submodule-guard/pointer-drift/gitlink-ancestry
  任一 gate 以 "指针回退 NOT on origin/main" 拦截
root_cause: worktree 内子仓常被切到 side-branch（prune/feat 等），git add -A 把该 gitlink 状态连同目标文件一并
  stage
solution: git restore --staged projects/<sub> && git -C projects/<sub> checkout origin/main
  后重 commit；amend 需重新 add
prevention: 永远 git add <具体路径> 替代 -A；add 前自检 git diff --cached --submodule=short
tags:
- submodule
- git-discipline
- add-a
- incident-to-rule
