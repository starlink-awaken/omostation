title: 子模块空检出 — git dir在但文件未物化
symptom: ls projects/<sub>/ 显示空目录但 .git 文件存在; gate报missing files
root_cause: git submodule update --init 中断或网络超时导致 checkout 未完成
solution: git -C projects/<sub> reset --hard HEAD 强制重新物化文件
