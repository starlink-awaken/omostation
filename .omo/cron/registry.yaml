# ── 待人工一次性拍板 (不影响本次收敛的文档统一, 只影响是否改变真实运行行为) ──
open_decisions:
  - id: D2
    question: worktree-hygiene 是否要把 --stale-days 3 补回 make 目标? branch-prune 频率日/周哪个对?
  - id: D3
    question: ssot-guardian 频率到底是每日还是每周三? 当前保留真实运行的每周三。
  - id: D4
    question: >-
      上面 17 条 status: proposed 的治理巡检任务(agent-workflow-status/governance-evolution/
      m4-health-score/doctor/mof-drift/debt-refresh/weekly-review/drift-sweep/
      capability-ownership/observability/anomaly-alert/meta-doctor/unified-health-score/
      rules-lifecycle/scene-calibration/scene-registry-sync) 是否现在正式启用为真实
      crontab? 这是新增自动化, 不是文档整理, 需要单独决定, 启用前需设置真实
      OMO_WORKSPACE_ROOT。
  - id: D7
    status: resolved
    resolved_at: '2026-09-11'
    resolution: >-
      方案 A (重归类): l4-kernel dao_layer dao→fa (ecos#74), l4-harness-6h
      正式登记进本 registry。理由: 道=不可执行, harness 巡检是可执行门禁
      判定活动属法; 全仓唯一 dao 归类系命名直觉。归类指引见
      docs/architecture/dao-fa-shu-qi.md。
    question: >-
      真实在跑的 l4-harness-6h(每6小时跑一次 projects/l4-kernel 的 harness 巡检)
      违反 CR-DFSQ-01(dao 层组件不得出现在 cron 执行账本), 且已经违反了一段时间
      (不是本次改动引入)。故意没有登记进本文件(登记会让 check-sfop-slots.py 硬性
      FAIL)。需要决定: 停用这条 cron、把 harness 巡检挪到 cron 之外的机制、还是
      重新评估 l4-kernel 的 dao_layer 归类。
