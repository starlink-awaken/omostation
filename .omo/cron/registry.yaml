# 调度编译器登记源 — 单一事实源 (ADR-A, ADR-0119/0121)
# 编译产物: crontab / launchd / GitHub Actions schedule
#
# v2 (2026-09-11, TASK-B3229A65): 收敛 3 个互相矛盾的历史声明源——
#   v1 registry.yaml (10条, 全部从未真正安装) /
#   .omo/cron/operating-rhythm-crontab (14条, ADR-0119/0121, OMO_WORKSPACE_ROOT 留空从未安装) /
#   真实 `crontab -l` (10条, 唯一真的在保护系统, 但两个声明文件都不认识它)
