## 维护规则

1. 任何 runtime commit 引入新 DEBT, 必须在 PR body "DEBT" 段声明 ID + 1 行描述
2. 关闭 DEBT 时必须:
   - 同步本文件 + 主 SSOT (`.omo/_truth/registry/debt.yaml`)
   - PR body "Fixes DEBT-RUNTIME-XXX" 显式引用
3. 季度审计: governance-agent 自动扫 `rg "DEBT-" src/`, 比对本文件; 缺 ID → 警告
4. P110-A 拆分时 god module 必须按"先单测后拆分"顺序, 缺单测不拆

