decision_needed: '待裁（三选一 + 一项授权，均属工具契约与 state 面变更，不由 agent 选定）：


  ① 对称守卫 —— closeout 的 status=ok 增加与 close 一致的人工 evidence 存在性要求（cli.py:505-510 同一口径），可另加 strip 后长度下限与占位串拒绝。代价：以 closeout 自动证据收尾的既有编排会开始失败，长度下限需定 N。


  ② 追加动词 —— 新增只追加、不改写旧行的 amend-evidence / note 类动词，使已 ok 的 run 能补带时间戳的更正证据。代价：run 记录由「一次写入即终态」变多版本，消费方需按时间取末值。


  ③ 分开计数 —— 保持不可修正，但自动生成 2 行与人工 evidence 分列计数（如 manual_evidence_count），并在 observe/compliance 面要求人工 ≥1。代价：仅可见性改进，占位串仍留在记录里。


  ④ 授权项 —— 是否回填 run 20261124T112136Z-governance-state-mutation-747a2eac 的正式证据指针。无 sanctioned 动词可用，等于手工编辑 .omo/_delivery 受管面，需 principal 明确授权；本批只把事实登记入册，未动该 run 文件。'
