id: "PROJECT-ENTRY-FRONTMATTER-UNVALIDATED-GROWTH"
title: "project-entry frontmatter 缺口随子模块 pin 前进单调增长：入口文档落地不校验、pin bump 也不校验，只能靠抬预算兜"
