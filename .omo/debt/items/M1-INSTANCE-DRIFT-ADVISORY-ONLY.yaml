id: "M1-INSTANCE-DRIFT-ADVISORY-ONLY"
title: "GaC 规则 registry(86) 与 M1 实例(137) 大幅漂移：69 个 M1 孤儿 + 18 条 registry 规则无实例 + 5 条字段过期 —— 而同步器是 advisory 且无人接线"
