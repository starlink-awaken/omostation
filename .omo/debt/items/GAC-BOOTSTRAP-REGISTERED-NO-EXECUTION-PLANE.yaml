decision_needed: >-
  本条登记的是**已测出但尚无人认领**的债，不是待查现象。读数取 2026-11-22 在 origin/main@e2c7d48bb
  的 fresh worktree 实机 `gac-bootstrap.py --json`（`projects/ecos` 已 init，runtime 平面
  `policy_source=sgf`、90 gates / 80 路径 —— 降级副本下五平面判定会整批改口 `device_unavailable`，
  那类读数不能当本条事实）。


  【层3 工具普查】326 个 GaC 工具里 320 有 `__main__`，6 个没有，故按入口判据算「死」：
  convergence-pulse-verify.py / documents_domain_jobs.py / gac_severity.py /
  rule-vitality-tracker.py / test_agent_clone.py / zhixing_host_sync.py。其中至少
  gac_severity.py 是被别的模块 import 的库、test_agent_clone.py 是被测试直接调的脚本，
  需要逐个裁定「改成库并从普查剔除」还是「补 `__main__`」，普查口径不能靠豁免名单软化。


  【层6 声明执行但无人执行】157 面里 147 条声称有执行方（4 条 tool 非 .py、6 条既不声称
  workflow 也不声称自动 trigger ⇒ 计入 skipped），五平面命中 138，点名 9：


  · `declared_no_execution_plane` 8 条 —— check-cron-interpreter-executability.py、
  check-gate-detail-contract.py、ci-local-fast.py、bin/ssot/observability-events.py、
  anomaly-detector.py、alert-router.py、cross-domain-trend.py、predictive-governance.py。
  后四条的 cron 作业确实存在但 `reality=declared_only`（声明未验证装机），按「不把声明当执行」
  的口径仍算缺席。裁定：接进 sgf-policy / hook-runner / workflow `run:` 任一面，或撤登记。


  · `dead_tool_registered_as_executed` 1 条 —— bin/gac/documents_domain_jobs.py 被平面文本提到，
  但层3 判它无 `__main__` 入口，执行它 = 零效果。这条判据 2026-11-22 才接上（层3 死集合喂层6），
  之前「被提到」与「被执行」是同一件事。裁定：补入口还是撤登记。


  【A 类的机制根因】登记 `trigger: [gac_local_gate, per_pr]` 而工具名只出现在
  `gac-local-gate.py` 的 `DEFAULT_POLICY` 字面量里 —— 本机 `load_sgf_policy()` 成功时
  `POLICY = load_sgf_policy() or DEFAULT_POLICY` 走 sgf 分支，DEFAULT_POLICY **一次都不执行**。
  同一条判据的另一半是 `check-ci-surfaces.py`：它的 `_local_gate_tools()`（:99）把 sgf-policy
  与「正则扫 `gac-local-gate.py` 文本」（:123）并起来，因此 DEFAULT_POLICY 的字面量仍算「已执行」；
  同一份检出它给 `ok=true / errors=0 / warnings=0 / wired_tools=143`，层6 给 9 条点名 —— 差值就是
  两套口径的盲区。**不在本条处置范围**：把它切到与层6 同源的 importlib 运行时口径由
  `CI-SURFACES-GATE-FIELD-UNDEFINED` 承载（`gate` 字段三种读法与消费者都在那条里谈）。


  【层4 不在本条】层4 现在逐条查 90 条规则里 75 条路径型 `source_ref` 的存在性，当前余 6 条不可达
  （5 条 `bin/gac/check-age-*.py` + `.omo/standards/ssot-path-norm.md`）。立案与裁定归
  `GAC-BOOTSTRAP-10-SOURCE-REFS-DEAD`（引用口径）与 `CR-AGE-RULES-NO-BASIS-NO-EXECUTION`
  （AGE 五则去留），本条不重复登记；2026-11-11 首版里的 B 类（`check-god-module.py` 目录写错）已由本 BET
  修掉，C 类（4 条 SEC 规则的幻影 `source_ref`）由 #5356 改指真实执行面 `bin/gac/gac-hook-pre-edit.py`，
  两者不再是待裁项。


  【转阻断的唯一开关】`governance-checks.yaml::CR-X2-GAC-BOOTSTRAP.enforcement`
  当前 `advisory`、`review_before: 2026-11-29`。层3 零分母、层4 indexed 子集、层2、层5 保持硬阻断；
  加宽的层4 / 层6 / 层3-死工具走 advisory（否则这些无人认领的发现会把 CI 全数染红）。
  本条与上述三条收敛后把该字段单点改成 `blocking` 即转阻断 —— **不要**在脚本里加开关或硬编码。


  【附带观察，不在本条处置范围】`governance-check.yml` 里称 `bin/ssot/check-interfaces.py`
  「从未提交进本仓」的注释已陈旧 —— 实测该文件存在且 ci-surfaces 登记项 missing-on-disk=0。
  属文档措辞债，单独登记或下次顺手改。
