decision_needed: >-
  本条登记的是**已测出但尚无人认领**的债，不是待查现象。四层读数与三类缺陷的当前状态：


  【层3 工具普查】326 个 GaC 工具里 320 有 `__main__`，6 个没有，故按入口判据算「死」：
  convergence-pulse-verify.py / documents_domain_jobs.py / gac_severity.py /
  rule-vitality-tracker.py / test_agent_clone.py / zhixing_host_sync.py。前两条与
  gac_severity.py、rule-vitality-tracker.py 是被别的模块 import 的库/被测试直接调的脚本，
  需要逐个裁定「改成库并从普查剔除」还是「补 `__main__`」，普查口径不能靠豁免名单软化。


  【层4 source_ref 指向不存在文件】90 条规则里 75 条是路径型引用，实测缺席 10 条（本轮修掉 2 条，
  余 10 条 = 下面 B/C/D/E 类）。indexed 类（`governance-checks.yaml::indexed`）缺席 0，始终阻断。


  【层6 声明执行但无人执行】157 面里 148 条声明了执行方，四平面命中 138，点名 10：
  check-cron-interpreter-executability.py、check-gate-detail-contract.py、ci-local-fast.py、
  perception-coverage.py、observability-events.py、log-rotate.py、anomaly-detector.py、
  alert-router.py、cross-domain-trend.py、predictive-governance.py。


  【缺陷分类与待裁定项】

  A 类（2 条规则）：登记 `trigger: [gac_local_gate, per_pr]`，但工具名只出现在
  `gac-local-gate.py` 的 `DEFAULT_POLICY` 字面量（:38-370）内 —— 本机 `load_sgf_policy()`
  成功时 `POLICY = load_sgf_policy() or DEFAULT_POLICY`（:370）走 sgf 分支，
  DEFAULT_POLICY **一次都不执行**。裁定：改 sgf-policy 把它们真正接进 GATES_LIST，还是把声明改成
  「仅缺省策略兜底」。

  B 类（本轮已修）：`source_ref: bin/gac/check-god-module.py` 目录写错，真实文件在 `bin/ssot/`；
  修 `governance-checks.yaml` 两条（CR-X1-GOD-MODULE-LIMIT、CR-X2-GOD-MODULE-EDIT）+
  `advisory-checks-upgrade.py:45`。遗留判断：同类「目录写错」是否还有其它条目 —— 层4 现在逐条查文件存在性，
  下次 drift 会当场点名。

  C 类（4 条 SEC/PY 规则）：`bin/ssot/check-{yaml-bypass,sensitive-write,eval-exec,mutable-default}.py`
  从未存在，检查逻辑实际内联在 `.githooks/` 里。裁定：把内联逻辑抽成脚本并接线，还是把 source_ref 改指 hook。

  D 类（5 条 `CR-AGE-*`）：`bin/gac/check-age-{bos,policy,memory,replay,event}.py` 全是幻影脚本。
  裁定：这 5 条规则是否已随 AGE 面退役 —— 退役就删规则，不能留登记。

  E 类（1 条）：`.omo/standards/ssot-path-norm.md` 文档缺失，被规则当 source_ref。裁定：补文档还是改引用。

  F 类：`gate: true` 却无 trigger 无 workflow，或声明 `scheduled` 但 cron 平面没有登记 ——
  cron 平面实测只有 `knowledge-foundry-cron.py`
  （`runtime/cron/systemd/omostation-knowledge-foundry.service:13`）。裁定：逐条补齐定时登记或删除声明。


  【与既有判据的关系（重要，避免重复立案）】本仓已有 `bin/gac/check-ci-surfaces.py` 的 false-wiring
  （:243-271），它用**正则扫 `gac-local-gate.py` 文本**取本地门禁工具集，因此把 DEFAULT_POLICY 里
  的字面量也算「已执行」；且循环对 `workflow: (none)` 直接 `continue`。同一份检出里它只报 **1** 条
  false-wiring（perception-coverage），层6 报 **10** 条 —— 9 条盲区。层6 用 importlib 真实加载
  `gac-local-gate.py` 取运行时 `GATES_LIST`（实测 90 gates / policy_source=sgf），两者机制不同。
  **本轮不改 check-ci-surfaces.py**（另有会话在其上作业），收敛动作是把它切到同一运行时口径，
  届时 10 条盲区应同时消失；不能长期并存两套口径。


  【转阻断的唯一开关】`governance-checks.yaml::CR-X2-GAC-BOOTSTRAP.enforcement`
  当前 `advisory`、`review_before: 2026-11-29`。层3 零分母、层4 indexed 子集、层2、层5 保持硬阻断；
  加宽的层4 / 层6 / 层3-死工具走 advisory（否则 20 条无人认领的发现会把 CI 全数染红）。
  C/D/E/F 全部收敛后把该字段单点改成 `blocking` 即转阻断 —— **不要**在脚本里加开关或硬编码。


  【附带观察，不在本条处置范围】`governance-check.yml:247-251` 的注释称
  `bin/ssot/check-interfaces.py`「从未提交进本仓」，实测该文件存在且 ci-surfaces 登记项
  missing-on-disk=0，注释已陈旧。属文档措辞债，单独登记或下次顺手改。
