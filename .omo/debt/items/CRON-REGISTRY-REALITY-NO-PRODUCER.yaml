id: "CRON-REGISTRY-REALITY-NO-PRODUCER"
title: "cron 登记面的 `reality` 字段没有任何生产者（纯手工维护），且对 launchd 盲 —— `debt-refresh-weekly` 标 `declared_only` 而 launchd 正在跑同一条命令"
