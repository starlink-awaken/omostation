description: >-
  `tests/unit/gac/test_check_submodule_pointer_drift.py` 的多条用例（`test_detect_runs_cleanly`
  / `test_json_output` / `test_fix_dry_run` / `test_each_result_has_required_fields`）都通过
  `_run()` **真实执行** `bin/gac/check-submodule-pointer-drift.py`；而该检测器的
  `get_submodule_origin_main()` 默认对**每个子模块**执行 `git fetch origin`（15s 超时）。

  网络正常时每轮几秒；**网络慢/对端拥塞时每次 fetch 都吃满 15s**，5 个子模块 × 多条用例
  ⇒ 整套 `tests/unit/gac` 从 2 分钟级膨胀到 **>10 分钟且看不到进展**，形态与「挂起」同形
  （2026-11-26 本会话实测：全量跑到 13% 的 `test_json_output` 就停住，`ps` 显示 pytest
  无子进程、纯等待）。

  **同族风险**：任何「用例直接跑会联网/长耗时的检测器」都会把宿主网络状态变成套件耗时的一部分
  —— 与 AGENTS.md 「hermetic 测试不得依赖 host 状态」同族。
decision_needed: >-
  建议（已实施）：给检测器加 `--no-fetch`（跳过 fetch，只用最近一次 fetch 到的 refs），
  测试装置统一传它；默认行为（pre-push 等真实调用方）不变。另给该类「真跑外部脚本」的
  装置补 `stdin=subprocess.DEVNULL` 与超时，避免把「慢」升级成「无限等」。
history:
- at: "2026-11-26T05:40:00+00:00"
  action: register
