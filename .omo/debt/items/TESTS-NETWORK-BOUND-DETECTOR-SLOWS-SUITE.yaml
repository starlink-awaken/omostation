  actor: "governance-agent"

- at: "2026-11-26T06:05:00+00:00"
  action: mitigate
  note: >-
    **已做**：检测器新增 `--no-fetch`（跳过逐子模块 `git fetch`，只用最近一次 fetch 到的
    refs），测试装置 `_run()` 统一传它并补 `stdin=subprocess.DEVNULL`；默认调用方（pre-push 等）
    行为不变。**效果实测**：`test_check_submodule_pointer_drift.py` 9 passed / **2.61s**
    （此前单文件即把全量拖到 >10 分钟无进展）；全量 `pytest tests/unit/gac`
    **833 passed / 63 skipped / 93.41s**（此前 206s 且多次卡死）。
    **判据**：`test_no_fetch_skips_the_network_probe`（spy 断言 `fetch=False` 时不发起任何含
    `fetch` 的子进程调用）。**同族已一并硬化**：三处 PATH 伪 `crontab` shim 装置补
    `stdin=DEVNULL`（债条目 TESTS-CRON-SHIM-HANG-ORDER-DEPENDENT）。
  actor: "governance-agent"
