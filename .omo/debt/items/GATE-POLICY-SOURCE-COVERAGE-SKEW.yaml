    **发现经过**：修完「门禁命令旗标只在 fallback 加、被 submodule 策略绕过」（#5590）之后,
    顺手比了两份策略的 **gate id 集合**, 才发现绕过的不是几个旗标而是**整批条目**。
    **判据** —— 比较策略来源时, 不能只比「同 id 的字段」, 要比**全集**: 二选一的整体替换
    会让「只在另一边存在的条目」无声消失, 而两边的差集都需要解释。
    **纪律**: 修一类缺陷后, 立刻问「同一机制还有没有别的面」—— 本轮 #5585/#5588/#5590
    是同一根因（两套权威面）连续三次换面。
