  而聚合平面 `current.json` 的同一门只剩 `A9 evidence incomplete: cockpit_sources`（39 字符）。
  这正好重建了判据注释里声称 2026-10-23 已消灭的现象（「只看得到 cockpit_sources 时
  无法分辨原因，得人工翻 cockpit current.json」）——修在采集侧，丢在聚合侧。
  ② A1 —— `detail` 字面值是单个右括号 `'}'`（len=1），而 `source_verdict=PASS`；
  截断成因未查，不做推测。
  要决定的是：detail/原因这类诊断串在跨平面传递时应保持何种契约（原样透传或显式丢弃并留痕），
  并给 A 系门禁的 detail 加一条"不得为空/不得短于阈值且须与 verdict 同源"的一致性检查。
  复算：python3 -c "import json;d=json.load(open('/Users/xiamingxing/.local/share/zhixing-dashboard/current.json'));print([(g.get('id'),g.get('verdict'),g.get('source_verdict'),g.get('detail')) for g in d['gates'] if g.get('id') in ('A1','A9')])"
  （2026-11-10 06:33 补：② 已定论为**发布链代码版本偏斜**，同 instant 双平面对照见 history 同日 review 条，不要再按「聚合截断」重做；③ 已于 2026-11-10 交付（门禁 `bin/gac/check-gate-detail-contract.py` + 规则 `CR-X2-GATE-DETAIL-CONTRACT`，sorted 口径同批修入 `bin/panorama/panorama-collect.py:1491`），余下未决的是**发布链代码收敛**：把 `bin/panorama/assets/host/*.asset` 恢复到宿主部署面需 principal 授权，未授权前 skew 只会一直在 advisory 里可见。）
  （2026-11-10 07:5x 补：skew **已修复** —— 用 `zhixing-host-sync.py publish --file panorama-collect-main.py` 在 origin/main 的 worktree 里发布（版本身份取自检出 commit，故必须从 origin/main 发，canonical 停在陈旧提交会报 `version_identity_conflict`）。发布后投影刷新器于 07:44:20Z `publish_ok` 跟上（最新 revision 的 `dashboard.code_oid` = `83adb6724…`，`fresh_until` 07:54:19Z），`/health` 从 `CODE_DRIFT` + HTTP 503 转为 `code_drift: false` / `projection_status: BOUND_FRESH` / HTTP 200。**注意**：发布只解决资产 skew；503 的另一半是运行中的 live_server 进程陈旧（重启前 `dashboard_code_oid` 报 `17afa5408…`，既不等于旧 current 也不等于新 current），需 `launchctl kickstart -k gui/<uid>/com.omostation.zhixing-dashboard` 让进程跟上 `current`。三者（资产发布 + 进程重启 + 投影刷新）缺一不可。） —— `zhixing-host-sync.py plan --file panorama-collect-main.py` 报 `state: drifted, source_sha=e71cdd1e… vs runtime_sha=fa7eb9c1…`（`write_performed: false`，plan 是干跑）。同步器 `bin/gac/zhixing-host-sync.py` 的 `HOST_FILES` 清单**已含** `("panorama-collect-main.py", "panorama-collect-main.py.asset")`，子命令有 `status/plan/check/publish/restore/migrate` —— 修复入口是 `publish`，不是改代码。实测 28 个 asset 里**只有这 1 个 drifted**，其余 SAME；`current` 与 plan 的 `target_root` 一致（`releases/697151a9c…`），部署副本 mtime 01:48Z 早于 #5232 的合入，即**发布滞后**而非登记错误。差异内容：repo 侧用 `repo_root.event_ledger_path()`，部署侧用 `OMO_EVENT_LEDGER_DB` 环境变量兜底。）
