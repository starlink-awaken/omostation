  `orchestrator.py` 读 `state_root()/runtime/dashboard/data.json` 的 base 链 —— 该路径在本机**不存在**
  （`FileNotFoundError`），门禁 cohort 自 2026-10-28 起被冻结；base 实际由
  `panorama-dashboard-refresh` 用**陈旧 code root**（`code-main`, 2026-09-26）产出，`_diagnostic()`
  修复只在 origin/main 上。故未决项收敛为：**base 落根与 code root 的裁定**（BET-Y2Q4-T16-03 决策矩阵
  A/B/C/D）+ **三向根错位修复**（生产者 `PANORAMA_ROOT` / 消费者 `state_root()` / registry 声明）。
  余下只是「detail 跨平面契约」的裁决项：

  两个形状（同一条 detail 通路，各自独立复现）：
  ① A9 —— 判据把原因串作为 `missing` 的第二个元素带出
  （`_cockpit_source_reasons`），revision 平面 `revisions/*/data.json` 里完整可见
