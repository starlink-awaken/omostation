    原来「聚合侧丢内容」与「上游投影随时间变化」两种解释都被这份对照排除。
    发布链跑的是 2026-09 的冻结副本，这些副本里 #4870（原因串）与 #5220（`_diagnostic`）都不存在：
    `APP/panorama-collect.py` mtime 2026-09-22、`APP/panorama-collect-main.py` 2026-09-30、
