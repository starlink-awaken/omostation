id: "TESTCOLLECTION-ENV-MISCLASSIFIED"
title: "check-test-collection 把「addopts 引用的插件未安装」判成仓内腐化(FAIL) —— 与它自己「环境缺失 → 报告但不 FAIL」的契约相反"
