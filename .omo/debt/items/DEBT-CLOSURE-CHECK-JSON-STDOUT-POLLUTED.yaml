description: '2026-11-23 在 origin/main(802b6eb87) 快照上实测：`bin/gac/check-debt-closure-discipline.py:132`
  在 `scan_gate_level_enum()` 里无条件 `print(f"  gate_level 分布: {dict(counts)}")` 写 stdout，而
  `--json` 分支只在最后打印 JSON。于是 `--json` 的输出首行是中文分布行，`json.loads` 在 line 1 column 3 抛
  JSONDecodeError（本窗口实际踩到）。任何按 `--json` 消费的自动化都会拿到不可解析文本；若调用方 try/except 吞异常，就退成本仓已登记的「解析失败退回空」形状
  —— 读数变 0 而不是报错。'
