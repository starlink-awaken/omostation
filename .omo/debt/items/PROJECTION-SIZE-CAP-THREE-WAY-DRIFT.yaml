  note: >-
    **发现口径**：根 `tests/` 全量 sweep（22 分钟）里 `test_zhixing_projection_size_contract.py`
    两条红，逐层查读数得到上表。关键证据是 `git show 5d5ae5404 -- <asset>`
    的 diff 注释 —— 它把「为什么抬到 64 MiB」写得很清楚，而同一条 commit 没有
    同步抬 `live_server.py`。
    **判据**：一个「两处常量必须相等」的断言，在其比较对象之一被**有实测依据地**
    单独调整后，必然红；此时要问的是「相等这条契约还成立吗」，而不是把常量改回去
    或者把断言删掉 —— 后者都是拿判据迁就现状。**纪律**：`tests/**` 不在 CI 白名单的
    那批（本次实测根 247 + `tests/bin/**`）要当「本地跑得到、CI 看不见」的平面对待。
  actor: "governance-agent"
