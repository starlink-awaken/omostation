  `watchlist_item_ids: []` / `gate_item_ids: []`，而同一生成器在 origin/main 内容上算出的是
  `backlog_pressure: 3.15` / `debt_health: 0.0` / 3 条 watchlist。两者差了一个**落后约 279 个
  commit 的检出**。生成它的 `com.omostation.omo-debt-refresh` 每小时 :05/:35 跑，命令里
  **硬编码** `--omo-dir /Users/xiamingxing/Workspace/.omo`。

  **复核 (2026-11-23, 基线 origin/main@37268397c, fresh worktree ws-debtrefs)** —— 本条假绿的主因**不是**检出落后，而是生成作业每次硬崩：
  `launchctl print gui/$(id -u)/com.omostation.omo-debt-refresh` 给 `runs=112` / `last exit code=1` / `job state=exited`；
  `runtime/cron/omo-debt-refresh.log` 6410 行里 **59 段 Traceback 全为同一签名** `TypeError: argument should be a str or an os.PathLike object where __fspath__ returns a str, not 'dict'`
  （崩点 `projects/omo/src/omo/omo_debt_metrics.py:27 _resolve_ref_path` ← `collect_stale_evidence_item_ids:68` ← `compute_debt_metrics:92` ← `omo_debt.py:431 refresh_outputs`），
  前 53 次运行打印 `refreshed/dispatched/campaigned/reported` 均成功，最后成功正对 `current.yaml::generated_at 2026-11-22T12:05:05Z` ⇒ 连续失败 ≈29.5 h（59 × 30 min）。
  plist 用 `&&` 串四步，refresh 崩 ⇒ `dispatch/campaign/report` 一并停摆。唯一污染源实测为**一个** item：
  `.omo/debt/items/GAC-BOOTSTRAP-REGISTERED-NO-EXECUTION-PLANE.yaml::mitigation_refs[0]` 的散文里含 ASCII `run: `，YAML 于是把该列表项解析成 mapping
  （98 个 item 全量扫描：`evidence_refs` 295 个元素全 str；`mitigation_refs` 57 str + 1 dict）；该形状自 `abaec3429`（11-12）即在 origin/main，
  **致命起点由作业所读检出的推进时点决定，与畸形数据的写入时点无关**。修复后同一份数据在 fresh worktree 重算：
  `debt_health 0.0 / backlog_pressure 7.45 / state_entropy 0.1 / pointer_entropy 1.16 / time_entropy 0.3` / watchlist 6 条，
  与冻结读数的 `100.0 / 0 / 全零 / []` 逐项相反（本条 11-10 原记的 `3.15 / 3 条` 是当时读数，现已前进）。
  **报警其实看得见但不阻断**：`bin/gac/state-freshness-check.py --json` 对该投影给 `ok:false / stale:true / score:50 / age_hours:29.79`，
  而脚本整体 `ok:true`、**exit 0**，故 30 h 无人处置；全仓无任何门禁读者消费 `launchctl ... last exit code`（仅 `bin/svc/service_view.py`、`bin/panorama/panorama-collect.py` 展示）。
  交叉引用：`LAUNCHD-PLIST-INSTALLED-DIVERGED` 的 11-23 复核「症状消失」指 exit **2**（缺 `--now`）那一因，本条是 exit **1**（数据畸形）的另一因，勿据其判定作业已成功。
decision_needed: >-
  要裁决的是：债务投影该读哪个检出？(A) 继续读 canonical，但在投影里**写明来源 commit 并在
  落后时显式标 stale**（缺省不改变行为，缺生可见）；(B) 让该作业改读一个保证跟 origin/main 的
  发布位检出（类似 publisher）；(C) 把该作业从 launchd 降为按需。注意 canonical 是**共享工作区**，
  多 agent 并发下落后是常态而非异常 —— 任何「读 canonical 派生治理读数」的作业都有同一风险面，
  本条只是其中一个实例。

  **复核追加待裁 (2026-11-23，不在上述 A/B/C 内)** —— 实测「投影冻结」已有检测、只缺阻断：`state-freshness-check.py` 对该文件给 `stale:true / score:50` 却整体 `exit 0`。
  是否把「债务投影 stale/冻结」升为阻断门禁项、以及是否让 launchd 作业 `last exit code != 0` 进入某个 gate，属**门禁严格度变更**，需 principal 单独裁定，本条不代为决定。

  **第二次复核追加待裁 (2026-11-23，仍不在上述 A/B/C 内，也不与上一段重复)** —— 「证据指针 stale」
  这个信号在当前写法约定下**没有边际区分度**：实测它与 `lifecycle_state` 未闭集完全同集
  （50 对 50，双向零差集；`closed`/`resolved` 的 47 条无一计入），因为判据是条目级 all-or-nothing
  而开放条目的 ref 按约定就是取证散文。后果：**再混进一条真坏 ref，群体计数不会变**，
  BET-Y2Q4-T10-350 的护栏只买到「不崩」，没买到「能看见」。
  可选方向（都要改数据契约，不是纯缺陷修复，故不代为决定）：(D) 把指针拆成结构化字段
  （`path` 参与解析判据 + 自由文本 `note` 不参与），代价是动 `omo_debt_metrics` 判据口径与
  97 条存量条目共 171 条 ref 的写法；(E) 保留散文约定，把 stale 显式降级为**展示字段**并在门禁与
  台账里声明它不是告警源，代价是放弃这个维度、需要另找能差分的探针。
  本次只登记测量与两条代价，方向由 principal 裁定后再落地。
    第三次复核追加待裁（2026-11-23T21:05Z，`history` 第八次的实测 ①⑤）：发布链与修复链不在同一平面上，
    由此产生两项新的裁决，均为 agent 不可自达：
    (F) **宿主部署面发布授权** —— 简报由 `com.omostation.panorama-dashboard-refresh`（240s）跑
    `~/.local/share/zhixing-dashboard/panorama-collect.py`（4,343 行旧副本，未含 `gate_reverify_hint`）产出，
    `~/.local/opt/omostation` 安装副本停在 `5cec6612a`；`zhixing-host-sync.py status` 实测 2 个资产 `drifted`。
    不授权 `publish` 则本条 (A)/(B)/(C) 与 #5491/#5492 的全部改进在人类页面与 agent 简报上都**读不到效果**；
    授权即部署面写（`governance-checks.yaml` 判为 principal 权限）。
    (G) **`projection_code_root_dirty` 的脏判据是否收窄** —— 现口径把 41 个 untracked 的
    `.omo/_delivery/scene-outcomes/**` 运行回执计为脏，而这些回执正是采集/场景作业自己的产物（自毒循环），
    且 untracked 文件不进入 `ls-tree -r HEAD` 的 provenance 摘要。收窄（只看 tracked，或只看受管路径）
    会放宽发布信任的前置条件，属门禁严格度变更，不代为裁定。
