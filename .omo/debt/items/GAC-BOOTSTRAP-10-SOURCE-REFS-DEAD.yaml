  action: identify
  note: >-
    **发现经过**：在 origin/main 的干净检出上跑 `gac-healthcheck` 取权威读数, 逐条
    定性那些 ❌ —— `executor-drift 3/35` 与 `doc-ssot 1 冲突` 都是**子模块未初始化**
    的检出形态问题(canonical 上分别 ✅ 与 0), 而 `indexed缺=10` 是**主仓路径**、
    与子模块无关, 是真的。
    **判据**：给 healthcheck 的每条红定性时, **先分清「检出形态」与「真缺陷」** ——
    同一个 healthcheck 里两类混在一起报, 不逐条复算就会把环境噪声当成治理缺口
    (本轮 executor-drift 就差点被当成 35 条规则的缺口)。**纪律**：判据里带
    「子模块未初始化」分支的项, 必须在**子模块齐全的检出**上复算再定性。
  actor: "governance-agent"
