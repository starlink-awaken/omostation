id: "GAC-BOOTSTRAP-10-SOURCE-REFS-DEAD"
title: "10 条 GaC 规则的 source_ref 指向不存在的文件（gac-bootstrap 层4 每次运行都报 indexed缺=10，当前只算 advisory）"
