  同一份 item 的计数单位与终态极性错误就是这样落了盘 (PR #5149, 后由 #5159 订正), 全程没有任何门禁报过 write_owner_violation。修法方向
  (待裁): 给 write-owner-audit 增加 --range <base>..HEAD (或 --from-diff) 取改动清单的模式, 并取消
