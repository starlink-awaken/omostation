    的 broken:True 派生, 而本条目没有 broken 键); :955 实为 RISK_AWARE_CHECKS, 其用法在
    :807 `if risk_profile == "medium" and name not in RISK_AWARE_CHECKS: continue`, 本条目
    在其中 ⇒ medium 风险面照常执行。即「跳过」这条空转路径不存在。
    ② 真因是单一的: 唯一采集面是 git 索引, 而运行门禁的每个场合索引都是空集 (CI 的
    actions/checkout 不 stage / post-commit 时索引已清空 / 手工跑 make gac-local-gate 不
    stage)。同区间对照实测: `--staged` → files_audited=0, ok=true; 新增 `--range
    origin/main~8..origin/main` → files_audited=15, violations=2。
    ③ 且 `.githooks/` 内没有任何 hook 调用 gac-local-gate (仅 .githooks/AGENTS.md 文档
    提及), write-owners.yaml:4 声明的消费者「pre-commit G-CONV.5」是悬空声明。
    ④ 活的门禁清单来源是 projects/ecos/src/ecos/ssot/mof/m1/governance/sgf-policy.yaml
    (实测 POLICY is DEFAULT_POLICY → False), DEFAULT_POLICY 只是降级兜底 ⇒ 只改
    DEFAULT_POLICY 的接线不生效 (本轮抓到并已改为根侧覆盖; 子模块侧那条 `--staged` 仍在,
    两份真相未收敛)。
    ⑤ 阻断化的实测代价: 近 200 commits 触及规则面的 30 个 commit 中 27 个当时无覆盖性
    claim, 且四种时间窗口口径 (claim≤commit≤close / 忽略 close / +72h / +24h) 读数同为
    90% ⇒ 窗口口径不是原因; 其中 21 个是 broker 自身写入 (主题 governance_state:), 6 个是
    手写 ⇒ 任何「必须有 claim」的阻断都会误拦 broker 自己。
    ⑥ 「可核验 broker 出身」这条替代路径也不成立: 提交里 history.actor 形如
    `governance-agent/20261109T060043Z-gsm-a4649e5a` (缩写 workflow 段), 而本地 registry 的
    run_id 是 `...-governance-state-mutation-e21e5056` 全名 ⇒ 37 个文件条目 0 个可解析回溯。
    ⑦ 原记「让 gac-gate.yml 的 --strict 真正覆盖它」这条修法方向不可执行: `.gitignore:12`
    忽略 `.omo/_delivery/*`, 417 条 run 记录只存在于单机, CI checkout 里没有 claim 数据,
    claim 核验在 CI 结构性不可判定。
    本轮已交付: `--range <base>..<head>` (含 `auto`: PUSH_RANGE → origin/main...HEAD)、
    范围面不套 env 豁免、`--advisory` 恒退 0 但仍报条数 (与 change-lane-check 同口径)、
    同一文件命中 `.omo/debt/*` 与 `/**` 两条规则时按文件计不再翻倍、缺采集面 exit 2 不再
    静默 ok=true、根侧把门禁接线覆盖成 `--range auto --advisory`;
    tests/test_write_owner_audit_range.py 9 例。未做: 阻断化 (见⑤)、子模块侧 sgf-policy
    同步 (见④)。lifecycle_state 归一按状态机原文走: 设计原文
    (.omo/_knowledge/superpowers/specs/2026-06-02-debt-governance-mechanism-design.md:186)
    是 identified -> classified -> scheduled -> in_progress -> mitigated -> verified -> closed,
    所以先前把 broker 自产的 `scheduled` 归一回 `identified` 是**倒退两格**; 本轮交付在途且
