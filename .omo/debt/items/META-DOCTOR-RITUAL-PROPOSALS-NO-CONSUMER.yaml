    不是 active ⇒ 每日生产路径也没真正排上。本机 crontab 里 `meta-doctor` 命中 **0** 行。

    环节二：提案落不了任何地方。
    手动/本地跑 meta-doctor 确实产出提案，实测（安装位那份树，05:04Z）：
    `summary.ritual_lapsed = 1`，debt_proposals 一条原文
    `{"id": "M3-owner-review-lapsed", "title": "主人周检视断供>14天", "dimension": "governance",
      "subdimension": "ritual", "severity": "medium", "lifecycle_state": "proposed",
      "owner": "governance-team", "source_ref": "meta-doctor-ritual://.omo/state/heartbeats/weekly-review.json",
      "target_ref": "meta-doctor-ritual://weekly-review-heartbeat", "proposed_by": "meta-doctor"}`。
    这份 payload 只出现在 meta-doctor 自己的 stdout（`:467/:527/:531` 写 `lifecycle_state="proposed"` 与
    `proposed_by="meta-doctor"`），没有任何持久化：全仓检索 `proposed_by` / `lifecycle_state.*proposed` /
    `M3-owner-review` **只命中生产方自己**（`bin/gac/meta-doctor.py` 一个文件）。

    环节三：唯一消费方把它筛掉了，而且自身无接线。
    `bin/gac/remediation-engine.py:242-249` 读 `data.get("debt_proposals", [])` 之后，
    只保留 `if "断链" in title or "dead" in title.lower()` 的提案，动作是 `:255 fix_mdead_dead_refs`
    （从 git 历史恢复断链文件）。`M3-owner-review-lapsed` 两个关键词都不命中 ⇒ 直接丢弃。
    而 remediation-engine 自己在 CI/workflow/cron 里查无调用点（`.github/workflows/post-merge-validate.yml:36`
    只有一句注释「存量由 remediation-engine 管」，不是调用），它同属本会话今晚在
    CRON-INSTALLERS-OUTSIDE-SSOT 里记的那批「登记面外、且当前零安装」的工具。

    反向复核（避免读成「只是没接线，实际有人在管」）：
    `.omo/debt/items/` 的 `lifecycle_state` 取值分布实测是（canonical 检出 101 份与 main 104 份两份树同读数）:
    `identified 38 / resolved 32 / closed 26 / in_progress 5` —— **没有 `proposed` 这个值**，
    且没有任何条目的标题含「周检视/weekly-review」⇒ 从 2026 年至今 ritual 提案从未落成过条目，
    不是「今天恰好没落」。

    为什么这值得单独立一条：`meta-doctor.py:564` 已把 `ritual_proposals` 计入自身 ok，
    但 `bin/gac/gate-health-check.py:100 / :113` 的 A2/A5 组成项只列 `stale_beats / dead_refs /
    submodule_regressions` ⇒ 它既不红门禁、也不落条目、也不进门禁，一条 medium 信号在整条链上零可见性。
    它与今晚另三条不重叠：`ISC1-ROOT-PIN-BASELINE-COUPDATE-GAP`（基线与被扫面同批联动）、
    `HEARTBEAT-READ-ROOT-AND-COLLECTOR-DRIFT`（心跳读取根与部署副本版本）、
    `OMO-WORKFLOW-STALE-HEARTBEAT-LOCK-THEFT`（锁陈旧判定），本条讲的是**提案生产-持久-消费三段断开**。
    '.
