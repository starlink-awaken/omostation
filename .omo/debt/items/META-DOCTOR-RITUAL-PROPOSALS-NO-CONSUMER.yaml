decision_needed: |
  待裁三问，本轮只登记，不改 meta-doctor、不改 remediation-engine、不给 registry 作业改 status：
  (1) 提案的落地形态选哪个：
      (a) 持久化为条目（`proposed` → 真条目，需要 `omo-debt register` 之外再加一条「从提案落条目」的通路，
          属新自动化写面，需 principal 授权）；
      (b) 只读呈现（把 proposals 面并进 agent-brief / dashboard，不写治理状态）；
      (c) 维持现状，接受 ritual 提案只是调试输出。
      三者差别是「这条信号该不该产生义务」，不是技术选型。
  (2) 若选 (a)：`owner` 字段现在硬编码 `governance-team`，而 M3 的主体是主人本人的周检视节奏 ——
      由 agent 自动登记「主人没做周检视」这类条目是否恰当，属价值判断，不代裁。
  (3) 生产侧接线：`meta-doctor-daily` 的 `status: proposed` 要不要转 active，以及 CI 的 `--refs-only`
      要不要在非 refs 面另跑一次 ritual 检查（后者会改变 CI 的 fail 面，因 `:564` 已把 ritual 计入 ok）。
  另附一条实测边界：本条**不**主张「ritual_lapsed 应进 A2/A5」—— 那只改变门禁组成项，属判据面，
  若要动请与之同批裁。
