id: "PANORAMA-BRIEF-REPUBLISH-SECOND-BOUNDARY-FLAKE"
title: "agent-brief 重复发布幂等用例跨秒即失败：载荷含秒级 generated_at，两次调用不同秒 ⇒ revision_id 不同"
