decision_needed: '待裁（三选一，裁决前不动 packet 文案、不改 8 个测试文件的逐字断言、不建 shim）：① 把 packet 命令改指向真实入口（本机实测可用的是 python3 -m omo.omo_debt_cli，另有 cockpit/ecos wrapper 可选）—— 代价: 要同步改 96 处测试断言与生成器 5 处，并先定「在哪个 cwd、用哪个解释器」的跨机口径（mini 与本机 PATH/venv 不同，参见「cron 的最小 PATH 不含 /opt/homebrew/bin」与「canonical venv 的 path hook 把 worktree 里的 import omo 静默指向主检出」）；② 恢复 scripts/omo_debt.py 作 shim 指向 CLI —— 代价: 与 e41a1d7「删除 28 死模块」的方向相反，等于把死模块请回来；③ 只修测试面（断言改为断言真实入口 + 给这批用例接上某个 CI 路径）—— 前置是先定 ① 的口径，否则测试会钉住另一个未验证的字符串。'
