    死路径证据 (子模块 pin d87a680df, 2026-11-23 实测):

    - git -C projects/omo ls-tree -r --name-only HEAD | grep -c ''^scripts/omo_debt.py'' = 0 —— 该脚本在 omo 仓 tree 里不存在。

    - git -C projects/omo log --oneline --all -- scripts/omo_debt.py 末条 = e41a1d7 「refactor(omo): Batch 1 模块清理 — 删除 28 死模块」—— 脚本被当死模块删除，packet 生成器与测试仍引用它。

    - 引用面共 9 个文件 99 处: test_omo_debt_cli.py 60, test_omo_debt_docs.py 10, test_omo_debt_dispatch.py 9, omo_debt_action_packet.py 5(src), test_omo_debt_action_packet.py 6, test_omo_debt_outputs.py 4, test_omo_debt_reporting.py 3, test_omo_debt_campaign.py 2, test_omo_debt_owner_routing.py 2。


    空转证据 (同一 pin 上实跑):

    - 默认口径: 上述 8 个测试文件 58 collected / 12 passed / 46 skipped。

    - 给 tests/test_omo_debt_cli.py 加 --run-real-omo: 43 failed / 0 passed（子进程找不到脚本，且 cwd=parents[2] 解析到 <root>/projects，与 scripts/ 不在同一层）。

    - rg --run-real-omo 在 Makefile、.github/workflows/、projects/omo/Makefile、projects/omo/pyproject.toml 全无启用面 ⇒ 这批用例在任何路径下都不执行，只在真机上手动加旗标时必红。


    影响: packet 的 command 字段是 agent 直接照抄执行的入口（见 .omo/debt/dispatch 面），指向不存在的路径等于派发即失败；测试逐字断言这些字符串把「文本字面量」当执行平面钉住，反而阻止修复。本次立案时顺带量到: 同族缺陷此前已在本会话的 OMO-DEBT-HISTORY-EMPTY-TIMESTAMP 结案说明里作为附带发现登记。''.'
