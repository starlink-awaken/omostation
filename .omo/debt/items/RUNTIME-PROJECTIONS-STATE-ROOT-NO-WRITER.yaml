id: "RUNTIME-PROJECTIONS-STATE-ROOT-NO-WRITER"
title: "runtime-projections 声明的 canonical 全在 .omo/state/runtime/**，但 state 根一份都没有 —— 副本散在检出（部分陈旧 68 天）或安装根，规则化的「7 天新鲜度」因此空转"
