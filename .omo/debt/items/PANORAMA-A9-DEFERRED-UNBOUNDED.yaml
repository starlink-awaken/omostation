    上把 `collect_a9_gate` 的接受条件从三条标签规则 改成 `bounded (age is not None and age <= 21600)`
    单一口径, 实跑 `tests/unit/test_panorama_a9_deferred.py` / `test_panorama_a9_bounded_fail.py`
    / `test_panorama_a9_race.py` / `test_panorama_source_health.py`: **改前 14 passed,
    改后 5 failed** ⇒ 现有测试**明确钉住标签规则**, 不是遗漏。 逐个看失败点, 现行为是**混合规则**而非纯标签白名单: `test_bounded_fail_is_accepted`
    (FAIL + 4.77h ⇒ PASS) / `test_beyond_bound_fail_still_blocks` (FAIL + 48h ⇒ PARTIAL)
    / `test_bounded_stale_unavailable_still_accepted` (STALE_UNAVAILABLE + 5h ⇒ PASS)
    三条都符合「年龄为主」; 但 `test_unbounded_failure_still_blocks` 用 `compute: UNAVAILABLE`
    且 fixture 默认 `age=1h`(**界内**)却断言 PARTIAL —— **用例名里的 "unbounded" 与 fixture 的 1h
    界内互相矛盾**, 它钉的是 「UNAVAILABLE 即使界内也阻断」这条标签规则。 ⇒ 裁决的必要证据已齐: 现行为是**刻意的混合规则**(三条年龄
    + OK/DEFERRED 无条件 + 其余标签恒阻), 不是实现疏漏; 且其中一条用例名与自身 fixture 不符。 **另测实时影响**: 把 `/data.json`
    实取 (`curl 127.0.0.1:43191/data.json`, 111 键) 喂给改前/改后两个版本, A9 的 `verdict` 与 `detail`
