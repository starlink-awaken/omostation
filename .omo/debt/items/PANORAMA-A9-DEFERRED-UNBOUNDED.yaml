decision_needed: >-
  判据（bin/panorama/panorama-collect.py 的 A9 cockpit 源准入段）自述意图是
  「真正的信号是年龄而不是状态标签」，但实现是三条不对称规则：
  ① `OK` 无条件接受；② `DEFERRED` **无任何年龄界**即接受 —— 一个长期停留在 DEFERRED
  的源可以无限期让 A9 通过，而它的上次成功观测可能已经很久；
  ③ `STALE_UNAVAILABLE`/`FAIL` 需 ≤21600s（6h）才接受，而 `PARTIAL` 不在接受集合里，
  **即使年龄界内也判不合格**。需要决定：DEFERRED 是否应与 ③ 同界；PARTIAL 界内是否应被接受
  （按自述意图应当是），以及把这三条统一成"以年龄为主判据、标签只做解释"的单一口径。
  如实留记：本条不是 A9 当前不闭合的直接原因 —— strategy/documents 既是 PARTIAL
  又超界（306h/287h），任何一侧规则都会拒它们；直接原因见 PANORAMA-A9-SOURCES-STALE-12D。
  本条要防的是另一个方向：2026-11-10 实测同一对源在高负载轮显示 DEFERRED、在另一些轮显示
  PARTIAL，标签在轮次之间摆动；一旦摆动落在 DEFERRED 侧，A9 就无条件放行。
history:
