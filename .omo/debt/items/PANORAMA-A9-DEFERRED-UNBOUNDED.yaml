id: "PANORAMA-A9-DEFERRED-UNBOUNDED"
title: "A9 判据的年龄界不对称：DEFERRED 完全无界可永久通过，PARTIAL 界内也永不被接受"
dimension: "governance"
subdimension: "consistency"
