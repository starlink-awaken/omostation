        `projects/` 引用在未检出时记 `device_unavailable` 而非判红 ⇒ 两处都不受影响。
    ③ `CR-X1-EXTERNAL-AGENT-AUDIT.description` 删去「实现: …」, 改为
       「执行体: … 占位桩, 未实现」; `bin/_registry/scripts/governance/check-external-agent-audit.yaml`
       的 description 同步。
    **未做（有意）**: 不把桩补成真检查 —— 真检查的前提是「哪些面算外部 agent 接入」
