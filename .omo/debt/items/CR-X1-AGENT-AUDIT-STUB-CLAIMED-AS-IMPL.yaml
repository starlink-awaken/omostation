  note: >-
    **发现经过**：清顶层测试红时, `test_rule_wiring_coverage` 报「候选漂移:
    got=['CR-X1-AGENT-AUDIT','x1-audit-chain']」。**先按检出形态处理了一半** ——
    确认 `x1-audit-chain` 的真实现在 projects/ecos, 本树未检出 ⇒ 加守卫即可。
    但 `CR-X1-AGENT-AUDIT` 追下去发现**不是检出形态**: 顺着规则描述里那句
    「实现: bin/gac/check-external-agent-audit.py」去看, 那个文件恒 rc=0 且自带 TODO,
    桩里的 id 还与规则 id 不同。**判据**: 一条规则的「实现」若是一个**永不失败的桩**,
    那「已接线」就是假的 —— 与本仓 §7「有实现、有测试、却没人调用」同族。
    **纪律**: 清红时**先分「检出形态」与「真缺陷」**, 但**别在第一批就把所有红
    都归给检出形态** —— 本条就是混在检出形态堆里的真缺陷。
  actor: "governance-agent"
