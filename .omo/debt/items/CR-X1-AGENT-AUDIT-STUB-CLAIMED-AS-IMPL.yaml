description: >-
  `.omo/_truth/registry/governance-checks.yaml:344` 的规则 `CR-X1-AGENT-AUDIT`
  （`lifecycle: active`，`check_type: audit_chain`），其**紧邻的下一条**
  （`:1770` 起，name「外部 agent 接入审计」）的描述里写着：

  > 扩展 CR-X1-AGENT-AUDIT 覆盖外部 agent 场景. 实现: `bin/gac/check-external-agent-audit.py`
  > (gac-gate CI, advisory)

  而那个文件是一个**恒 green 的桩**（全文 19 行）：

  ```
  def main() -> int:
      print("[external-agent-audit] SKIP: advisory check (no external agents registered)")
      print("[external-agent-audit] TODO: 接入外部 agent 后移入 blocking")
      return 0
  ```

  两个独立的问题：

  **① 假门**：无论仓库状态如何都 `rc=0`，且自己印着 `TODO`。把它写成某条规则的
  「实现」，等于让那条规则的「已接线」由一段永不失败的 print 支撑 —— 正是本仓
  反复出事的「声明绿/执行红」形状。

  **② 原名「id 不一致 ⇒ 测试恒红」—— 该判断已被实测否证（2026-11-16 复核）**：
  桩的 docstring 写的是 `CR-X1-EXTERNAL-AGENT-AUDIT`，那**正是** `governance-checks.yaml`
  另一条规则自己的 id（`:1771`），两者自洽。而 `CR-X1-AGENT-AUDIT` 之所以曾被报未接线，
  是因为 `bin/gac/registry-alias-map.yaml:108` **早已**存在
  `canonical: CR-X1-AGENT-AUDIT / aliases: [x1-audit-chain, x1_audit_chain]` 这组映射，
  接线判定走的是**子模块语料里的 `x1-audit-chain`**，不是根仓那个桩。

  实测三处读数（同一份 origin/main 内容）：

  | 检出 | 语料含 `projects/ecos` | `candidates_unwired.governance-checks` |
  |---|---|---|
  | canonical（子模块齐） | 是 | `[]` |
  | ws-cr-x1（子模块未 init） | 否 | `['x1-audit-chain', 'CR-X1-AGENT-AUDIT']` |
  | CI `governance-verify` | 是（`submodules: recursive`，`:359`） | `[]` |

  而 `tests/test_rule_wiring_coverage.py` 的「候选集必须为空」那条**自带 skip 守卫**
  （`#5393` 与本条同批加入）：探针 `projects/ecos/src/ecos/l0/governance/checkers.py`
  缺席即 `pytest.skip`。所以在子模块未检出的树上它**skip 而非红**，在 CI 里**绿**。
  **结论：不存在「恒红」。** 本条真正的缺陷只有 ① 假门。

  **纪律（本轮固化）**：把「某条测试恒红」写进债条目前，必须在**判据实际运行的那棵树**
  上跑一遍 —— 本次「恒红」产自一棵**子模块未检出**的 worktree，而判据的运行前提
  （`submodules: recursive`）在 CI 里是满足的。**检出形态能伪造「恒红」**，
  与它能伪造「恒绿」是同一枚硬币的两面。
decision_needed: >-
  两问：

  - (1) **桩要不要留**：留 —— 那描述里的「实现: …」必须删掉或改成
    「占位桩，未实现」（否则「已接线」由永真的 print 支撑）；
    不留 —— 删掉桩与那句描述，或把桩补成真检查（真读 `runtime/omo/_delivery/ingress/
    ingress-trail.jsonl` 的 `check_type: audit_chain` 语义）。
  - (2) **id 对齐**：桩的 docstring 用 `CR-X1-EXTERNAL-AGENT-AUDIT`，规则是
    `CR-X1-AGENT-AUDIT`。要么给规则加 alias（`registry-alias-map.yaml`，
    检测器认 alias），要么把桩的 id 改成规则 id —— 但**别名必须让检测器认得**
    （`_resolve_via_alias` 是大小写不敏感的精确串匹配，不是子串）。
  **本条不代决。**
