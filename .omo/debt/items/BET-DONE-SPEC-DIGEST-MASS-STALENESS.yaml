id: "BET-DONE-SPEC-DIGEST-MASS-STALENESS"
title: "329/451 条 done BET 的 accepted_specifications.content_digest 已陈旧（spec 被批量 frontmatter 补丁改过），而 bet-ledger.py lint 刻意豁免 done BET 从不校验"
