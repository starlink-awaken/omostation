id: "CI-SURFACE-FALSE-WIRING-PERCEPTION-COVERAGE"
title: "ci-surfaces 给 perception-coverage 声明了 gac-gate.yml + per_pr/push 触发，但它没有任何执行面"
dimension: "governance"
subdimension: "ssot"
domain: "infrastructure"
scope: "workspace"
severity: "medium"
weight: 0.2
entropy_class: "medium"
lifecycle_state: "resolved"
owner: "governance-team"
closed_at: "2026-11-11"
close_reason: >-
  假声明已更正, 全仓 false-wiring 警告归零。裁决取「改声明」而非「接线」: 该工具是静态
  report generator (DATA_SOURCES/PROBES 硬编码, --report/--json/--status 均无退出码语义),
  接进 blocking gate 会造出一道恒绿的假门; 而它当前无任何真实探测, 接线无从谈起。
  改声明只让登记面与事实一致, 不剥夺未来接线的可能 —— 真实探测与退出码就位后,
  改回 workflow 名即可, 是低风险可逆动作。
resolution_evidence: >-
  2026-11-11 在 init 了 projects/ecos 的检出 (sgf-policy 齐备) 里实测:
  ① 改前 `python3 bin/gac/check-ci-surfaces.py --json` 报
  `false-wiring: bin/gac/perception-coverage.py 声明由 gac-gate.yml 执行, 但该 workflow
  既不含此工具、也不以 --workflow gac-gate.yml 调 ci-check-runner.py、也不经
  gac-local-gate.py 执行它`, warn_count=1;
  ② 改 `.omo/_truth/registry/ci-surfaces.yaml` 的 `bin-gac-perception-coverage-py`
  条目为 `workflow: (none)` + `triggers: []` (与 #5276 更正的另外 3 条同形),
  并保留 note 说明「接线与否待裁定」;
  ③ 改后同命令读数 `ok=true / errors=0 / warn_count=0 / surfaces=157 / wired=141`,
  `--check` 输出 `✅ CI 平面干净`。
  判据: 声明与执行面一致 (无执行面则声明 (none)), 而非把工具硬塞进 gate。
