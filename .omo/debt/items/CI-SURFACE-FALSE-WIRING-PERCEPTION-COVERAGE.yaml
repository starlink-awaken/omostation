description: >-
  `.omo/_truth/registry/ci-surfaces.yaml` 的 `bin-gac-perception-coverage-py` 条目声明
  `workflow: gac-gate.yml` + `triggers: [per_pr, push]`, 但实测该工具**在任何地方都没有执行面**:
  全仓 workflows 无引用、`ci-check-runner.py` 只被以 `--workflow governance-check.yml` 调用过一次、
  `gac-local-gate.py` 的门禁清单里也没有它。而 `check-ci-surfaces.py --check` 报
  `ok: True / errors: 0 / warnings: 0`。
decision_needed: >-
  要裁决的是：这条目该**接线**（加进 `gac-local-gate.py` 的 root gates, 让 `gac-gate.yml --strict`
  真的跑它）还是**改成 `(none)`**（与另外 8 条手工工具同形）。注意它是 report generator
  （`--report/--json/--status`）而非 gate —— 接进 blocking gate 需要它先有退出码语义。
  本条不代决。
history:
- at: "2026-11-10T13:55:00+00:00"
  action: identify
  note: >-
    **扫描口径**：对每条 `surfaces` 条目, 取其 `workflow` 声明的 workflow 文件, 判定该文件
    **能否执行**它 —— 要么文件文本里出现该工具路径, 要么该文件调 `ci-check-runner.py --workflow <自己>`
    （runner 读同一份 ci-surfaces 并按 `workflow` 字段分派）。结果 **9 条**声明了不能执行它们的 workflow。
    **逐条复核后 8 条是误报** —— 它们声明 `gac-gate.yml`, 而 `gac-gate.yml:203-209` 跑
    `gac-local-gate.py --strict`, 后者经 ecos policy + 文件内 root gates 执行了这些工具
    （`check-sfop-slots` / `check-execution-chain` / `root-directory-governance-scan` /
    `bin-scripts-convergence-audit` 等实测在本地门禁输出里）。**剩下 1 条是真的**：
    `perception-coverage` 声明 `gac-gate.yml`, 但 `gac-local-gate.py` 的门禁清单（含 ecos policy
    与 root gates）里**没有它**, 全仓 workflows 亦无引用。
    **交叉验证**：`ci-check-runner.py` 在 workflows 里只被调用一次, 参数恒为
    `--workflow governance-check.yml` ⇒ runner 只会执行 `workflow: governance-check.yml` 的条目;
    `perception-coverage` 声明的是 `gac-gate.yml` ⇒ 即便走 runner 也不会执行。
    **门禁为何看不见**：`check-ci-surfaces.py::_discover_wiring()` 只扫 workflow 文本 +
    `sgf-policy.yaml` 的 gate command, **不认** `gac-local-gate.py` 这个聚合器 ⇒ 所有本地门禁工具
    都被算成「未接线」（实测 `wired_tools: 146 / registered: 151`）, 于是「声明了 workflow 却无人执行」
    这一形状在`wired_tools` 计数里也**不体现**。
    **同一盲点的第二半**：`wired_tools` 的 146/151 差额正是这个聚合器盲点造成的, 属计数失真而非漏报。
  actor: "governance-agent"
- at: "2026-11-10T14:40:00+00:00"
  action: review
  note: >-
    **补全为完整清单（共 4 条，全部经 `check-ci-surfaces.py` 的 false-wiring 检查在
    **子模块齐全的检出**里实测输出）**：
    ① `bin/gac/perception-coverage.py` → 声明 `gac-gate.yml`（report generator，无任何执行面）；
    ② `bin/gac/gac-worktree.sh` → 声明 `reusable-submodule-bump-pr.yml`（该 workflow 跑在
    GitHub runner 上、自包含 shell，**无法**调用本地工具；声明为假）；
    ③ `bin/ops/lighthouse-stub.py` → 声明 `gac-gate.yml`（note 自述 "pending real integration"）；
    ④ `bin/ops/nfr-stub.py` → 声明 `gac-gate.yml`（同上）。
    **两种性质不同**：① ② 是**纯粹的假声明**（工具本身完整、只是没人执行）；
    ③ ④ 是**占位声明**（工具本身是 stub，声明表达的是「待接入」的意图）——
    对后者，更合适的表达是 `workflow: "(none)"` + note 说明待接入，而不是挂一个不执行的
    workflow 名。**这属于表达约定问题，仍待 principal 裁定**。
    **扫描器口径（供复核）**：对每条 `surfaces` 条目，取其 `workflow` 声明的文件，判定它能否执行
    该工具 —— 文本含该工具 / 该文件以 `--workflow <自己>` 调 `ci-check-runner.py` / 该文件调
    `gac-local-gate.py` 且工具在其门禁集（sgf-policy gate command + gac-local-gate.py 文件内字面量）。
    三条都不成立即告警。**子模块未初始化的检出**里 sgf-policy 缺席，此时对 gac-local-gate
    下单**保守跳过**（否则会把 `script-registry` 这类真 gate 误报成无人执行）。
  actor: "governance-agent"
