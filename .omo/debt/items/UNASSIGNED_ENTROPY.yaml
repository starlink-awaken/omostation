close_reason: >-
  2026-09-19 以实测复核并闭环 (替换原悬空引用 P43-ARCH-ANALYSIS-002):
  现场测量推翻原前提, 且原前提的『强制』本就不存在:
  ① 非终态 omo-schema 任务 (active/planned/blocked) **100% 有 owner** —— 原声称的熵
     在 live 任务上不成立;
  ② 缺 owner 的全部是**终态历史记录** (closed/done, 所有权不再可行动), 或
     remediation/ (另一套 schema, 用 assigned_to, 本不适用 owner/phase);
  ③ phase 并非 omo 任务 schema 的字段 (实测 active 0/1、closed 0/15、done 0/11 使用;
     仅 archived 与 remediation 使用) —— 故『phase 必填』的要求不成立, 不应虚设;
  ④ 原文声称的『bet-ledger + task schema 强制』确不存在 (唯一相关实现
     bin/_archive/bet-to-task.py 已归档)。
  处置: 把『声称存在的强制』真正落地 —— 新增 bin/gac/check-task-ownership.py
  (非终态任务必须有 owner, 范围按实测收敛, 不虚设 phase 要求) + Makefile
  task-ownership-check。该检查实测通过 (扫描全部非终态任务, 无缺主)。
