- .omo/_attic/observability-archive
evidence_refs:
- "gac-gate run 32199174187 (2026-08-18T23:55): fatal: No url found for submodule path '.omo/_attic/family-hub-archive' in .gitmodules"
- "git ls-tree HEAD .omo/_attic/: 160000 883188e (family-hub-archive) + 160000 7b8114a (observability-archive) 均为孤儿 gitlink"
- "对应远程仓库 omostation-family-hub-archive / omostation-observability-archive 均 404 (不存在)"
mitigation_refs:
- "git rm --cached .omo/_attic/family-hub-archive .omo/_attic/observability-archive (移除孤儿 gitlink, 保留空目录占位)"
description: |-
  #1696 之前某个 PR (bed403a1e 或更早) 把 `.omo/_attic/family-hub-archive` 与
  `.omo/_attic/observability-archive` 以 submodule gitlink (mode 160000) 形式提交，
  但 `.gitmodules` 从未注册这两个路径的 URL，对应远程仓库也不存在 (404)。
  CI `actions/checkout submodules: recursive` 的 `submodule update --init` 因此
  在每次 run 报 `fatal: No url found for submodule path ... in .gitmodules`
  (exit 128) → gac-gate 红。本 debt 记录修复: 从索引移除孤儿 gitlink，
  让 `.omo/_attic/` 回归普通空目录。附: cockpit help_map/cli.py 不一致
  (f456ce9 已修) 亦曾致 gac-gate 红，同轮确认已闭环。
