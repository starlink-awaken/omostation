    **发现经过**：本轮已两次把「检出形态」误读成治理缺口（`executor-drift`、`doc-links`），
    于是做一次权威测量：fresh worktree 上跑 `--strict --json`，把 16 条 hard fail
    逐条看首行报错。结果 16/16 都指向「子模块未 init / 生成态未物化」。
    **判据**：定性一条红之前，先找**同一事实在两个检出上的对拍**——
    `check-evidence-freshness` 会自跑 evidence-smoke，同一份 295 条 BOS 声明在
    canonical 是 94.0/gap 0、在 fresh worktree 是 62.6/gap 184，差值全部落在
    「实现在子模块里」这一类，这就是最干净的一次对拍。
    **纪律**：门禁的红必须**先被定性再被采信**；`hard_fails` 这个字段名本身
    不区分「仓库有问题」与「输入没备齐」，而两者对 agent 的行动含义相反。
  actor: "governance-agent"
