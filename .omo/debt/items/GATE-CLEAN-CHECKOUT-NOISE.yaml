description: >-
  2026-11-15 在 `origin/main` 的 **fresh worktree**（`git worktree add`，不 init 子模块、
  不物化生成态）上跑 `gac-local-gate.py --strict --json`：**87 个 check 里 16 个 hard fail**
  （另 2 个 soft warn）。逐条定性：

  | # | check | 报错首行 | 定性 |
  |---|---|---|---|
  | 1 | `check-cockpit-ui-dist` | `cockpit-ui static assets (dist/index.html) missing` | 子模块未 init |
  | 2 | `capability-ownership` | `注册能力 ecos-ssot-tools 实现缺失: projects/ecos/src/ecos/ssot/tools` | 子模块未 init |
  | 3 | `auto-fix-loop` | `注册表 path 指向缺失实现: ecos-ssot-tools` | 子模块未 init |
  | 4 | `mof-schema-validate` | `can't open file projects/ecos/src/ecos/ssot/tools/mof-schema-validate.py` | 子模块未 init |
  | 5 | `mof-state-bridge` | `can't open file …/mof-state-bridge.py` | 子模块未 init |
  | 6 | `m4-bootstrap-reflex` | `Traceback …` | 子模块未 init |
  | 7 | `doc-ssot-lint` | `L0 约束源缺失: projects/ecos/.omo/_derived/…` | 子模块未 init |
  | 8 | `governance-semantic-gate` | `gac-mof-validate` / `mof-schema-validate` 均 rc=1 | 子模块未 init |
  | 9 | `mof-capabilities-drift-check` | `tool_path_exists: ecos-ssot-tools … MISSING` | 子模块未 init |
  | 10 | `test-gac-engine` | `sgf-policy.yaml metadata registry not found` | 子模块未 init |
  | 11 | `check-severity-registry` | `primary lock 'doc-claims-check' not declared in sgf-policy.yaml` | 子模块未 init |
  | 12 | `governance-evolution` | `missing file: projects/agora/etc/bos-services.yaml` + cockpit CLI | 子模块未 init |
  | 13 | `dependency-baseline-drift` | `74 项 drift`（pyproject 在子模块里） | 子模块未 init |
  | 14 | `test-collection` | `pytest rc=4`，无测试可收集 | 子模块未 init |
  | 15 | `doc-link-check` | 14 条死链 | 子模块未 init + 生成态未物化 |
  | 16 | `check-evidence-freshness` | `score=62.6 < 90.0` | 生成态（自生成报告） |

  **16/16 全部是检出形态，没有一条是仓库缺陷。**

  **决定性对拍**：`check-evidence-freshness` 在无报告时会**自己跑一次 evidence-smoke**
  （`:96-104`），所以它量的是「这棵树的 BOS 可解析率」。同一份 `services.yaml`（295 条声明）：

  | 检出 | score | resolvable | gap |
  |---|---|---|---|
  | canonical（子模块齐） | **94.0** | 295 | **0** |
  | fresh worktree（子模块缺） | **62.6** | 111 | **184** |

  差值 184 全部落在 `module pkg not found` / `script not found` / `module path not found`
  —— 即**声明指向子模块里的实现，而实现没被检出**。

  **门禁已经有一半自诊断**：`load_sgf_policy()` 在 `projects/ecos/.../sgf-policy.yaml`
  缺失时打印 `[WARN] … falling back to the hardcoded DEFAULT_POLICY … do not read this
  run as full gate coverage`（`:44-46`）。但它只覆盖**gate 集合**这一个面，且只走 stderr、
  不进 JSON —— 于是上面 16 条红仍然以 `hard_fails` 的身份出现，看起来与真缺陷同形。

  **代价**：任何 agent 在 fresh clone / 新 worktree 上跑 `make gac-local-gate-strict`，
  都要手工把 16 条红逐条定性一遍。本轮这个坑被踩到三次
  （`executor-drift` / `doc-links` / 本条），每次都得重跑一遍才敢下结论。
decision_needed: >-
  **(b) 已落地（#5364），(a) 仍开放。**

  - (b) **把「检出未备齐」做成结构化字段** —— **已做**：`run_gate` 的报告里新增
    `preflight`（`complete` / `sgf_policy_loaded` / `uninitialized_submodules` /
    `missing_generated_inputs` / `reasons`），未备齐时向 stderr 打横幅。
    **判定语义刻意不动**：`hard_fails` 与退出码不变，它只做定性、不做「跳过即绿」。
  - (a) **把缺输入造成的红从 `hard_fails` 里分出来**（例如 `invalidated_fails`）——
    **仍未做**，这是本条剩下的部分。难点是**逐条定性**：一条 check 的红是不是
    缺输入造成的，不能用「报错文本里有没有某个词」来判（那是匹配拼写，
    与本仓「判据与被检对象不共享失效模式」的纪律相反）。可行方向是让
    **check 自己**声明「我没测成」（`test-mcp-kos` 的 `exit 78`、
    `current-state-coherence` 的 `missing input` 已经是这个形状），
    再由门禁汇总 —— 但那是逐个 check 的改造，不是一次 PR 能收的。
  - (c) **在 `make gac-local-gate-strict` 前加物化/子模块前置** —— 治标，
    且 `git submodule update --init` 在网络受限时会半途留下更糟的检出（见
    BET-Y2Q4-T10-252 的守卫退化记录）。
  **本条不代决。**
