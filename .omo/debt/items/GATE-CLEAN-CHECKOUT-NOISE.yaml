    **实测覆盖面**：fresh worktree 87 个 check 里只有 **2 个**属这一类
    （`mof-schema-validate` / `mof-state-bridge`）—— 说明「入口缺失」是个**小类**，
    剩下十几条红都属于「跑起来了、但**目标**在子模块里」：那一类只能逐 check
    让它自己声明，没有捷径。**纪律**：先量覆盖面再决定要不要造机制 ——
    为 2 条红造一套判据是可以的（它同时是「脚本型 check 未检出」的通用信号），
    但如果量出来是 0 条，就不该造。
