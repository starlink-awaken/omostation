  的签名默认 timestamp="" 且 actor 仅在有值时才写入条目 ⇒ 这三条状态流转落盘为 at 空字符串，审计时间线断裂。同文件 close(:80)/desc(:119)/reopen(:410)
  传 _now_iso() + actor，是正确写法，可直接照抄。实测复现：2026-11-23 在 /tmp/repro-at 的临时 .omo 上跑一次 escalate，history
  尾项即 at 空串，rc=0 静默通过。

  进度（2026-11-23 更新）：时间戳半边 (omostation-omo#257 / PR #5477) 与 actor 半边 (omostation-omo
  00b809d) 均已交付落地；reclassify/escalate/revalidate 统一支持 --actor 并写入有效 UTC 时间戳。'
