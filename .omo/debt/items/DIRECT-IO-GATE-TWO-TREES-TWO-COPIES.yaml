decision_needed: >-
  两问分开裁决, 有顺序依赖。(1) **子仓那份 contract_gatekeeper.py 副本是否废除**: 它是 08-08 的实现,
  判定项集合不含 MUTATION_METHOD_NAMES / MUTATION_HELPER_NAMES, 因此看不见 mkdir() 与 open(..., "a"),
  PR #122 才会在自家 CI 绿、在 root 门禁红。收为同一实现 (删副本或指向 ecos 份) 是**加覆盖**, 使子仓 main
  自己就拦住同类提交。(2) **freshness job 的 verify 步按哪棵树评**: 按接受的 gitlink (与 governance-check.yml
  对齐) 还是按子仓 remote main (现状)。现状实质是 root 用自己的定时 job 去红一个 root 尚未接受的子仓提交,
  且该步失败会 skip 掉后面的漂移提案 / 上传 / fail-closed 腿 (实测 skipped), 有漂移的运行反而发不出提案。
  **不要**在裁决前动 CR-L2-DIRECT-IO 的 advisory/blocking 标注, 也不要收窄 _has_forbidden_prefix() 判据 ——
  前者让规则更不可信, 后者会把 Path.home()/".omo" 这类真实写入一并放过; 两者都是判准宽度改动, 属 principal。
  (3) **裁决 (2) 时要同时覆盖两条失效腿**: 实测红期里 step 7 (verify) 与 step 10 (drift fail-closed) 各红过, 且 drift 腿在 root 树零变化下也能红。只把 verify 改为按接受 gitlink 评, 定时 run 仍会因 `update --remote` 与接受 pin 的差集而红 —— 要么 drift 腿对 schedule 一并降为 warning, 要么明确 drift 的参照系同样是接受面。
