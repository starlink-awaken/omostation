id: "DEBT-SCHEMA-THREE-WAY-DESYNC"
title: "债务条目的「权威 schema」有三处互不一致：broker 注入 8 个 schema 外键（其中 status 会被本仓工具判为冲突）、kernel DebtItem 丢弃 closed_at/close_reason/resolution_evidence、\"22 键为权威\"的表述已过期"
