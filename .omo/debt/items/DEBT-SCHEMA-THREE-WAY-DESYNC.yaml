    **判据**：一个 schema 的「权威」版本若只存在于**文档表述**里，而三处实现
    各自多退少补，那么「合规」这个词就没有稳定所指 —— 必须先**三处对拍**
    （broker 产出 / 文件 / kernel 视图）再谈修哪一处。
    **纪律**：自证要做 —— 光读 `fix-debt-fields.py` 的代码得出「broker 形态会被判冲突」
    是不够的，造一份最小 broker 形态文件实跑，才排除「判据其实有豁免」的可能。
