description: >-
  债务条目文件里「什么算权威 schema」有三个互不一致的版本，各自都有消费者：

  **① broker 产出的文件带 8 个 schema 外键。** `omo_ingress_debt.py` 的 `upsert_debt_item`
  会 `payload.setdefault(...)` / 直接赋值一批字段：`description` / `source` /
  `registered_at` / `opened_at` / `first_seen_at` / `last_seen_at` /
  `occurrence_count` / `status` / `source_ref` / `lifecycle_state`。其中
  **`status` 与 `lifecycle_state` 并存** —— 而本仓 `bin/gac/fix-debt-fields.py`
  的 `scan_debt_items` 恰把「同时有 `status` 与 `lifecycle_state`」判为
  `dual_fields` **冲突**。**自证**：造一份 broker 形态的最小文件
  （`id/title/lifecycle_state/status/owner`）跑 `fix-debt-fields.py --root <tmp>`
  ⇒ `conflict_count: 1`（`has_status: true, has_lifecycle_state: true`）。
  即**官方立案入口现在会产出被本仓自己的债务工具标记为冲突的文件**。

  **② kernel 的 `DebtItem` 只有 22 个字段，静默丢弃闭局证据。**
  `omo_debt_registry.py:10-33` 的 `@dataclass(frozen=True) DebtItem` 字段为
  id/title/dimension/subdimension/domain/scope/severity/weight/entropy_class/
  lifecycle_state/owner/affected_roots/evidence_refs/mitigation_refs/opened_at/
  last_reviewed_at/next_review_at/gate_level/history/x1_policy_ref/x2_freshness/x3_tier
  —— **没有** `closed_at` / `close_reason` / `resolution_evidence`。
  实测（`load_debt_ledger(Path(".omo"))` 读一份 resolved 条目）：文件 23 键，
  `kernel 丢弃的键: ['close_reason', 'closed_at', 'resolution_evidence']`。
  而 `bin/gac/check-debt-closure-discipline.py` 要求终态项**必须有** `closed_at`
  才合规 —— 判据读原始 YAML，所以门禁是绿的；但任何走 `load_debt_ledger`
  的消费者**看不到闭局证据**。

  **③ 「22 键为权威」的表述已过期。** 债条目
  `DEBT-REVIEW-SCAN-POPULATION-ALL-TERMINAL` 的 evidence 写着
  「`omo_debt_registry.py:10-33` 为权威」，而实际文件 schema 比它多至少 3 个
  被两处 omo 审计（`omo_audit_checks.py:122`、`omo_audit_freshness.py:45`）
  与闭环节律共同使用的键。

  **broker 路径近期根本没被用**：origin/main 86 份条目里仅 **7 份**带 broker 键
  （6 份 `registered_at+source` 的 closed 项 + `DOC_CLAIMS_SCOPE.yaml` 一份带
  完整 5 键的 resolved 项），**7/7 全是终态** ⇒ 现存 79 份非 broker 条目都是
  直接落盘写的。这与 `DEBT-REVIEW-SCAN-POPULATION-ALL-TERMINAL` 的记录一致：
  broker 形态与 22 键权威不一致，正是「直接写文件」被反复选用的机制原因。
decision_needed: >-
  三问，建议按此顺序：

  - (1) **`status` 这个键要不要** —— **已修（子模块 PR omostation-omo#252，合并
    a22df739；主仓 gitlink bump 随本条目的这一批交付）**：broker 不再写 `status`。
    取「以 `DebtItem` 的 22 键为准」这一侧 —— 不在权威键里的字段不该有
    「与权威键冲突」的地位。**已核无真实读者**：`omo_debt_registry.py:133` 只在
    `lifecycle_state` 缺席时把 `status` 当 fallback；`omo_debt_cli.py:53` 的
    `[status]` 是本地算的显示值。测试由原 `assert payload["status"] == "open"`
    改为 `assert "status" not in payload`。
  - (2) **闭局证据要不要进 kernel** —— **已修（子模块 PR omostation-omo#253，
    合并 `8bc86c1a`；主仓 gitlink bump 随本批交付）**：`DebtItem` 末尾加
    `closed_at` / `close_reason` / `resolution_evidence` 三键（带默认值，向后兼容；
    构造点只有 `_parse_debt_item` 与测试）。取「进 kernel」这一侧 —— 三处判据
    （主仓闭环节律要 `closed_at`；`omo_audit_freshness` / `omo_audit_checks` 要
    `resolution_evidence` >= 20 字符）已经依赖它们，让 kernel 看不见才是异常。
    配套加 `_as_text`：列表形态的 `resolution_evidence` 换行拼接而非裸 `str()`
    （裸 `str()` 会写成 Python repr，是静默损坏），并接收等价的 `closed_evidence`。
  - (3) **broker 路径要不要保留**：7/86 的使用率说明它事实上已被绕过。
    若保留，得先让它产出的文件**能通过本仓自己的 debt 工具**（否则官方入口
    名存实亡）；若废弃，应显式退役并说明立案入口改成什么。
  **本条不代决。** 三问都跨 `projects/omo` 子模块与主仓工具，属治理规范变更。
