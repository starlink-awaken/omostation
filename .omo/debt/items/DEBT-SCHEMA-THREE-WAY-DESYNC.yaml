  note: >-
    **发现经过**：给 `DEBT-REVIEW-SCAN-POPULATION-ALL-TERMINAL` 做结案复测时，
    顺着它 evidence 里「22 键为权威」这句话去 `load_debt_ledger` 实跑了一遍，
    才看到 ① broker 注入键 ② kernel 丢键 两处分裂 —— 它们都**不报任何错**：
    闭局证据缺失时 `check-debt-closure-discipline` 会红，但**字段被 kernel 丢弃**
    这件事没有任何判据会红（`DebtItem` 只是构造时不抄那几个键）。
    **判据**：一个 schema 的「权威」版本若只存在于**文档表述**里，而三处实现
    各自多退少补，那么「合规」这个词就没有稳定所指 —— 必须先**三处对拍**
    （broker 产出 / 文件 / kernel 视图）再谈修哪一处。
    **纪律**：自证要做 —— 光读 `fix-debt-fields.py` 的代码得出「broker 形态会被判冲突」
    是不够的，造一份最小 broker 形态文件实跑，才排除「判据其实有豁免」的可能。
