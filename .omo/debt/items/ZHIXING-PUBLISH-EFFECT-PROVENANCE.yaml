description: '**实测 (2026-11-23, 基线 origin/main): `status` 已逐文件点名漂移, 该子项看起来已满足。**


  `python3 bin/gac/zhixing-host-sync.py status --json` 现有输出:


  - `files[]` 每条带 `state` (`in_sync` / `drifted`) + `repo_sha` + `deploy_sha` + 字节数;

  - 顶层 `drifted: <计数>` / `missing_repo_copy` / `missing_deploy_copy` / `ok`;

  - `source_tree` 带 `head` / `origin_main` / `behind_origin_main` / `stale`。


  ⇒ 单文件发布**继承同目录其他文件漂移**这件事, 读者不必再自己去比哈希 —— `state: drifted` 与两个 sha 直接给出。本条 `decision_needed`
  里那句「也应在自证输出里显式列出, 而不是要人自己去比哈希」**已落地**。


  **本次读数** (仓根为陈旧检出, `behind_origin_main=40 / stale=true`): 25 个资产里 `refresh.py` 一条
  `drifted`, 其余 `in_sync`。


  **文献 ① 也已缓释**: `status` 输出现在带 `source_tree` —— `root` / `head` / `origin_main` /
  `behind_origin_main` / `stale` (本次实测 `behind_origin_main=40, stale=true`), 读者能看出这次读数取自一棵陈旧检出。`check`/`plan`
  与它共用同一 status 面。


  **仍未做的** (本条主要问题, 未动): 「判断 host 发布到底改变了哪一字节」在**发布前**没有可靠通路 —— 要决定的是给 publish 加「发布后自证」步骤
  (读运行时产物与发布前后指纹做定向 diff), 替掉手写 `--json` 计数的土办法。**本次只记实测, 不代做该设计。**'
