decision_needed: 2026-11-10 发布 BET-Y2Q4-T10-343 时，我为了回答"线上生效了没有"连续误判四次，根因是缺一条 可直接判定的通路。三个实测障碍：
  ① `zhixing-host-sync.py` 的 `check`/`plan` 拿**运行它的树**当源真值，用落后 main 的共享主树跑 就报 `in_sync`（假安心）；②
  `revisions/*/manifest.json` 的 `producer.root_oid` 与 `collector_sha256` 读起来像"哪份代码在执行"，实际在我发布前
  2.5h 就已是目标值 （48 份 revision 恒 `f891ad40…`），采集侧 `panorama-collect.py` 有清单路径（`:571-582`）与
  现场 git 根路径（`:585-588`）两条，走哪条、`ZHIXING_DASHBOARD_CODE_ROOT` 指向何处未查； ③ `current` 符号链接翻转后，300s
  刷新任务自动吃新代码，但常驻 `live_server.py`（pid 50155） 的 cwd 仍停在发布前 release，publish 不换它。 要决定的是：给
  publish 加一个"发布后自证"步骤（读运行时产物与发布前后指纹做定向 diff 并写进 退出结果，替我现在手写 `--json` 计数的土办法），或至少让
  `check` 明确报告它比对的是哪棵树、 以及常驻进程当前归属哪个 release。单文件发布继承同目录其他文件的漂移 （`panorama-collect-main.py`
  仍 `fa7eb9c1…`，其内 15 处 `--json` 是各自 CLI 正常用法） 也应在自证输出里显式列出，而不是要人自己去比哈希。
history:
- at: '2026-11-10T02:41:00+00:00'
  action: identify
  note: 本次发布的效应最终只能靠两处独立实测钉住：`collectors/scheduler.py` 内容哈希 28ad3162…（含 `--json` 2
    处）→ 51f2b281…（0 处），以及线上快照里 `diagnostic command exit 2` 由 1 次归零、`scheduler.status`
    转 OK。 过程性教训已入 docs/pitfalls.md（「发布通道的 in_sync 读数在陈旧树上等于两边同为旧版」条）。
  actor: governance-agent
- at: '2026-11-17T00:00:00Z'
  action: mitigate
  note: '**做了 decision_needed 的「至少」那一支: 让 check/plan 明说比对的是哪棵树。** `zhixing-host-sync.py`
    新增 `source_tree_probe()`（`git rev-parse HEAD` / `origin/main` + `rev-list --count
    HEAD..origin/main`），字段 `source_tree` `{root, head, origin_main, behind_origin_main,
    stale}` 进 `status()` 与 `_asset_plan()`（`check`/`plan` 共用后者）的 JSON。非 git 目录降级为
    `null`, 探针本身不成为新崩溃点。 **实测 (2026-11-17)**: 新鲜 worktree ⇒ `behind_origin_main=0
    / stale=false`; 陈旧的 `~/Workspace` ⇒ `behind_origin_main=278 / stale=true` —— 障碍①
    描述的 「在陈旧树上跑就报 in_sync」从此在读数里**可见**, 不再靠人记得自己站在哪棵树。 **未做**: 「发布后自证」步骤（读运行时产物与发布前后指纹做定向
    diff）与 ②（`revisions/*/manifest.json` 的 `producer.root_oid` / `collector_sha256`
    到底指哪份代码）、③（`current` 翻转后常驻 `live_server.py` 的 cwd 仍停在旧 release, publish 不换它）。②③
    未动。 **验证**: 新增 `tests/test_zhixing_source_tree_provenance.py` 5 条 (自造 git 仓, hermetic);
    变异对照: 摘掉 `_asset_plan` 的 `source_tree` 字段 ⇒ 1 failed, 恢复 ⇒ 5 passed。已纳入 governance-check
    白名单。'
  actor: governance-agent
- at: '2026-11-23T05:42:58.019752+00:00'
  action: update_description
  note: 'Updated description from '''' to ''**实测 (2026-11-23, 基线 origin/main): `status`
    已逐文件点名漂移, 该子项看起来已满足。**


    `python3 bin/gac/zhixing-host-sync.py status --json` 现有输出:


    - `files[]` 每条带 `state` (`in_sync` / `drifted`) + `repo_sha` + `deploy_sha` +
    字节数;

    - 顶层 `drifted: <计数>` / `missing_repo_copy` / `missing_deploy_copy` / `ok`;

    - `source_tree` 带 `head` / `origin_main` / `behind_origin_main` / `stale`。


    ⇒ 单文件发布**继承同目录其他文件漂移**这件事, 读者不必再自己去比哈希 —— `state: drifted` 与两个 sha 直接给出。本条 `decision_needed`
    里那句「也应在自证输出里显式列出, 而不是要人自己去比哈希」**已落地**。


    **本次读数** (仓根为陈旧检出, `behind_origin_main=40 / stale=true`): 25 个资产里 `refresh.py`
    一条 `drifted`, 其余 `in_sync`。


    **仍未做的** (本条主要问题, 未动): 「判断 host 发布到底改变了哪一字节」在**发布前**没有可靠通路 —— `check`/`plan` 拿**运行它的树**当源真值
    (文献 ①), 用落后 main 的共享主树跑会报 `in_sync` (假安心)。要决定的是给 publish 加「发布后自证」步骤 (读运行时产物与发布前后指纹做定向
    diff), 或至少让 `check` 明确报告它比对的是哪棵树。**本次只记实测, 不代做该设计。**''.'
