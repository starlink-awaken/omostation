id: "METRICS-STORE-PIPELINE-UNWIRED"
title: "`.omo/state/metrics-store.jsonl` 的唯一写者（`gac-local-gate --metrics`）从不执行 —— 11 个消费者读一个停在 2026-09-21 的库"
