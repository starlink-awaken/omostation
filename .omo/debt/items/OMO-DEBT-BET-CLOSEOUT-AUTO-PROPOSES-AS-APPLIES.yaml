    lint <path>`，而 lint 子命令不接受位置参数，argparse 直接 `error: unrecognized arguments` 非零退出，脚本只把失败打成
    ⚠️ 便继续放行，等于自检步骤全程空转；Step 5 的建议文本让用户 `git rebase origin/main`，与本仓明确禁止用 rebase/merge/pull
    吸收上游的约定冲突（AGENTS.md §6；gac-worktree.sh:966 的 WP1 Wave B2 注释把 submit 定为 proposal-only）。


    【实测】2026-11-25 BET-Y2Q4-T10-351 done-transition 过程中：跑 bet-closeout-auto 后 `git
    diff --stat -- docs/plans/3y-bet-ledger.yaml` 为 0 行，status 仍 pending；手工执行正确形式
    `bet-ledger.py lint`（不带路径）→ `OK -- 599 bets, 17 tracks, no errors`；台账 done 迁移实际由
    `bet-ledger.py complete BET-Y2Q4-T10-351` 完成（rc=0，写 status: done + done_at）。


    【为什么这是错的】「声称效应 ≠ 实际效应」的工具最容易造成漏收尾：操作者看到脚本报「已处理/建议已给出」便以为状态迁移完成。本仓已经吃过同形状的亏（submit
    的 exit 2 被读成拦截而不是终态）。lint 步骤空转还让该脚本对自身产出完全没有验证能力——它唯一能发现「台账写坏了」的机会被一个参数错误永久关闭。


    【修复方向】Step 3 要么真调 complete（带 completion_evidence 前置校验与幂等），要么把输出措辞改为「仅建议，未落盘」；Step
    4 改为 `bet-ledger.py lint`（无位置参数）并把 rc!=0 视为失败；Step 5 删除 rebase 提示，改为按 §6 的 push
    + gh pr create 路径。''.'
