    (4) **写探针这一腿目前在 studio 是盲的**：主日志 11-08 与 11-09 各一条 `[00:00:00] NOTE: MOVESPEED 保活写入被拒(Operation not permitted), 多半是 launchd 下 bash 无『可移动卷』授权(TCC); 卷本身已确认挂载, 不计入异常`，`writenote` 内容 = `2026-11-09` ⇒ 「没有写失败告警」不能读成「写路径健康」；本条的缺席检测实际只剩挂载探测一腿有效。

    (5) **两个 3 分钟驱动并存，会污染「连续第 N 次」的时间语义（未确证，供 owner 核）**：`crontab -l` 有 `*/3 * * * * /bin/bash ~/.local/bin/disk-keepalive-cron.sh`（wrapper 头注释称 studio 的守护「装在图形会话域里，图形会话一结束就没了」—— 与本轮实测的系统域 plist 不一致，注释应已过期），同时 (0) 的 LaunchDaemon `StartInterval 180` 也在。实测 state 更新时刻既出现 cron 对齐的 `09:45:01`，又出现不对齐的 `09:48:59`（+59 s，符合 StartInterval 漂移），与双驱动一致但我没有单独确证；`disk-keepalive-cron.log` 不存在。后果：双驱动下 ALERT 计数不再等于 N×3 分钟，10 次升级阈值会提前到达；对照 11-07 的 ALERT 序列 07:03/06/09/12/15/18/21/24/27 严格每 3 分钟一次 ⇒ 那时只有单驱动在跑。

