  frontmatter 从不被读取。于是「这份 retro 属于哪条 BET」只有文件名一个信号，没有任何判据把「交付提交」与「被完成的 BET」对齐。


  【事故实例】交付提交 9abcccfd6（PR #5498）的 commit subject 写成 `(BET-Y2Q4-T10-350)`，实际交付范围是 T10-351（scene-journey-autogen
