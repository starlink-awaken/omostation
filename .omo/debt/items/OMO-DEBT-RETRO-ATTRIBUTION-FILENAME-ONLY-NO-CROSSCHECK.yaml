  H1 与正文归属写成 T10-350。结果「范围已交付」与「台账仍 pending」同时为真且不被任何门禁发现——2026-11-25 是靠 done_when
  三条实测（scan Missing journey specs=0 / pytest 5 passed / 5 个 journey dry-run 无 FileNotFoundError）才定案，不是靠读提交主题。


