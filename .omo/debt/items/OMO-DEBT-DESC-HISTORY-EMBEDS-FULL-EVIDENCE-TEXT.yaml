  note: 'Updated description from '''' to ''【批次 18 · B/2】omo-debt desc 把新旧全文写进每条 history
    note：全库历史体积 3.07× 正文


    §1 机制（origin/main 305afff3e）

    `projects/omo/src/omo/omo_debt_cli.py:133-134`：desc 写完正文后追加 history，note 形如

    `f"Updated description from ''{old_desc}'' to ''{description}''."`

    即每次重写把「旧全文 + 新全文」各一份塞进同一条 note。多次重写 ⇒ 同一正文的多个历史版本全量留在文件里，且没有任何 `MAX_`/截断护栏（同批
    A 项 §3 的 grep 零命中）。


    §2 全库规模实测

    `.omo/debt/items/` 共 111 条：description 字段合计 104,597 B，history note 合计 321,233
    B，历史/正文比 = 3.07×。

    重写 ≥2 次的 7 条贡献 101,831 B，占全库历史字节的 31%。头部（history B / description B）：

    - OMO-DEBT-LEDGER-INSERT-SKIPS-ENUM-CHECKS 24,439 / 5,850（3 次）

    - OMO-DEBT-EVIDENCE-REF-ACCEPTANCE-TWO-JUDGES 20,735 / 6,614（3 次）

    - OMO-WRITEOWNER-AUDIT-VACUOUS-FOUR-PATHS 19,787 / 3,584（4 次）

    - OMO-DEBT-BROKER-MINTS-PHANTOM-ITEM-FOR-UNKNOWN-ID 14,904 / 3,215

    - PANORAMA-A9-SOURCES-STALE-12D 10,612 / 1,483

    - OMO-DEBT-PACKET-COMMAND-DEAD-SCRIPT 6,048 / 1,677


    §3 本会话一手观察

    批次 17 条目从 229 行涨到 396 行 / 32,402 B，而正文只有 6,614 B ⇒ 该文件 63% 是历史副本。行数膨胀直接放大 `git
    diff` 审阅面与这条路径的 affected-hash 面。


    §4 这份额外体积是否被依赖？（实测：代码上有，现实中没有）

    `projects/omo/src/omo/omo_audit_checks.py:138-155`（debt integrity 检查）对 lifecycle
    为 resolved/closed 且 `resolution_evidence`/`closed_evidence` 皆空的条目，回退读 `history[-1].note`（要求
    `len ≥ 20`）当证据。实测：111 条里有 6 条走这条回退，它们的最后一条 note 的 action 全是 resolve 类（`resolve`
    ×4、`resolve-default-a` ×1、`resolve-removal` ×1），note 长度 99–435 B；全库 `history[-1]`
    是 `update_description` 的条目只有 1 条。

    ⇒ desc 的全文嵌入目前不是这 6 条的证据来源；但任何以 desc 重写收尾的条目，其超长 note 会被该检查当证据读。改成 digest 的方案必须同时交代这条回退的口径。


    §5 先例

    同包 `projects/omo/src/omo/outcome_feedback.py:143` 对 note 只存 `note_digest`（`_digest(...)`），说明「digest
    替代全文」在本仓已有实现形状。


    §6 待裁

    1. note 只记 digest 与长度差（形如 `sha256:<hex> 6353→6614 B`），全文不再进历史——与 §5 先例对齐；代价：历史不再能逐字回放旧正文。

    2. 保留全文但截断到 N 字符：需先定 N 与截断标记口径，并同步复核 `omo_audit_checks` 的 `len≥20` 回退是否仍成立。

    3. 维持现状：把「历史即全文快照」明文写成审计设计意图，同时在文档登记其体积代价。

    另需一并裁定：是否对既有 111 条做一次历史瘦身。改动他人条目的正文/历史属在册的「不代为变更」范围，本批未动任何他人条目。

    ''.'
