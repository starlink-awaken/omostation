description: >-
  `bin/gac/check-llm-advisory-only.py`（CR-P76-7-1，声明「LLM 只 generate suggestion,
  不 auto-apply」）的判据是文本正则，两处限制：

  ① **字符串字面量不区分执行上下文**：`git commit --no-verify` / `git push --force`
  等模式对字符串内容一律命中 —— `return "git push --force"` 与
  `os.system("git push --force")` 在本检查器眼里同形。实测仓内 `.py` 当前**零命中**
  （含这些命令文本的都是 `.omo/_knowledge`、`docs`、`.agents/skills` 下的 markdown，
  而本检查器只扫 `*.py`），故属**潜伏**误报而非现行红灯。要区分需按 AST 判定
  「字符串是否处于被调用位置（Call 的 args）」，而不是逐行文本。

  ② **只扫 `*.py`**：shell 脚本里的 `git commit --no-verify` 完全不在覆盖范围内。
  而 `bin/gac/swarm-git` 恰恰是 `.sh`，且其**注释**里就写着 `--no-verify`
  （它是 fail-closed 守卫，ADR-0220 / ADR-0422）—— 直接把扫描面扩到 `.sh` 会把
  守卫脚本本身报成违规，需先设计白名单/守卫豁免。

  另：本检查器在 `gac-gate.yml:71-73` 是 **required `gac-gate` job 内的阻塞步**
  （无 `continue-on-error`；同文件 `:224` 的注释与
  `tests/test_gac_gate_workflow_purity.py::test_no_blocking_step_lives_outside_the_required_gate_job`
  钉住「任何阻塞步骤都不得离开 gac-gate」）。注意 `ci-surfaces.yaml` 里该条目的
  `gate: false` **不是**「CI 不阻塞」的意思 —— 该字段表示「是否属于 sgf-policy
  门禁集」（`check-ci-surfaces.py:99-107` 只由 sgf-policy 的 gate command 赋
  `gate=True`），本检查器经 workflow 接线而非 sgf-policy，故为 false。
  severity 取 medium 的依据是**两条限制各自的影响面**（潜伏误报、覆盖缺口），
  而非「不阻塞」。
decision_needed: >-
  两条限制需分别裁决：① 是否把判据改成 AST 调用点判定（更准，但需处理
  `getattr(subprocess, "run")` 之类间接调用，且仍会漏掉「字符串拼进 shell 再执行」
  的形状 —— 改判据的收益边界要写清）；② 是否把扫描面扩到 `.sh`（需先给 `swarm-git`
  这类**守卫脚本**设计豁免，否则扩面即自伤）。本条不代决。
history:
- at: "2026-11-10T19:05:00+00:00"
  action: identify
  note: >-
    同轮修掉的是**第三类**误报：注释与 docstring。实测探针（docstring 里写
    `git commit --no-verify` + 两行注释）在旧实现下报 **3 处**违规，其中 **2 处是纯文字**；
    改为「匹配前抹掉注释与 docstring、但保留字符串字面量」（保留字符串是因为判据本身
    要匹配 `subprocess.run(["git","commit"])` / `os.system("git commit ...")` 这类
    字符串里的命令文本）后，该探针只剩字符串字面量那 1 处 —— 即本条限制 ①。

    **变异对照**：把 `_strip_comments_and_docstrings` 改回全文读取 ⇒
    `tests/unit/test_llm_advisory_only_code_only.py::test_comments_and_docstrings_are_not_auto_apply`
    当场红（另两条真实检出用例仍绿），证明用例承重。

    **扫描口径**：对 `bin/`、`lib/` 下 `.py` 与 `.sh` 全量搜
    `git commit --no-verify` / `git push --force` / `git commit -a`，命中全在 markdown；
    `.sh` 侧另查 `git commit|git push` 得到 7 个脚本，其中 `swarm-git` 的命中全是
    fail-closed 守卫注释 —— 这是限制 ② 「扩面即自伤」的直接证据。
  actor: "governance-agent"
- at: "2026-11-10T22:50:00+00:00"
  action: review
  note: >-
    **自查更正首版的一处事实错误**：首版写「`ci-surfaces.yaml` 中该条目
    `gate: false` ⇒ 本检查器**不阻塞**」，这是把字段语义读错了。
    `gate` 在 `ci-surfaces.yaml` 里表示「该工具是否属于 **sgf-policy 门禁集**」——
    `check-ci-surfaces.py:99-107` 中 `gate=True` 只由 sgf-policy 的 gate command 赋值，
    经 workflow 接线的工具一律为 false。它**不是**「CI 是否阻塞」。
    **实测**：`gac-gate.yml:71-73` 的 `CR-P76-7-1-LLM-ADVISORY-ONLY` 步**没有**
    `continue-on-error`，且位于 required 的 `gac-gate` job 内（`gac-gate-aux` 才从
    `:230` 开始）⇒ **是阻塞步**。已由
    `tests/test_gac_gate_workflow_purity.py::test_no_blocking_step_lives_outside_the_required_gate_job`
    钉住该不变量。
    **影响**：本条 severity=medium 的理由从「不阻塞」改为「两条限制各自的影响面」
    （判据本身不变 —— 它现在跑的是修好的实现，两条限制都还是真实缺口）。
  actor: "governance-agent"
