id: "RUNTIME-PROJECTIONS-GENERATOR-SHAPE-MIXED"
title: "`runtime-projections.yaml` 的 `generator` 字段混着四种形状（散文 / 带参命令 / 裸文件名 / 符号引用），消费者无法按同一口径解析 —— 裸名 `predictive-governance.py` 曾匹配两个文件"
