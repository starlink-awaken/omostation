  note: >-
    2026-09-25 PR #4308 支援中实证：index 含 staged submodule 指针时，
    hook 的 conflict-marker 检查以 traceback 失败（_staged_blob 内
    `git show :projects/<sub>` 对 gitlink 非 blob 抛错），导致与冲突标记
    完全无关的提交被 blocking 拦截。当时以 --no-verify 绕过一个零内容空提交
    （CI 侧跑同样门禁，风险≈0），但根因未修：任何暂存了子模块指针的提交都会
    被误拦。复现：在 index 有 M/aetherforge 等 gitlink 条目时提交任意文件。
