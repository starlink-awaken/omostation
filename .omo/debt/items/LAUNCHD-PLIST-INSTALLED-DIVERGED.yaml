id: LAUNCHD-PLIST-INSTALLED-DIVERGED
title: 已安装的 launchd plist 与本仓 plist 漂移 —— omo-debt-refresh 一直失败 (exit 2), 且 --omo-dir
  指向缺 _truth 的 state 根
dimension: governance
subdimension: consistency
domain: infrastructure
scope: host
severity: medium
weight: 0.15
entropy_class: medium
lifecycle_state: identified
owner: governance-team
affected_roots:
- ~/Library/LaunchAgents/com.omostation.omo-debt-refresh.plist
- bin/ops/launchd/com.omostation.omo-debt-refresh.plist
evidence_refs:
- '已安装 plist: `NOW=2026-10-28T08:18:36Z` **硬编码** + `--omo-dir /Users/xiamingxing/.local/state/omostation/prod/.omo`
  + 安装位 venv python'
- '本仓 bin/ops/launchd/com.omostation.omo-debt-refresh.plist:40: `NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)`
  **动态** + `--omo-dir /Users/xiamingxing/Workspace/.omo` + `python3` (PATH)'
- '实测已安装命令: `FileNotFoundError: No debt registry found at ~/.local/state/omostation/prod/.omo/_truth/registry/debt.yaml
  or .../debt/registry.yaml` ⇒ rc=1 (作业末次退出码 2)'
- '`~/.local/state/omostation/prod/.omo/` 只有 `_delivery/` `_knowledge/` `state/` ——
  **完全没有 `_truth/`** (读面按 ADR-0456 跟随检出, 故 state 根本不需要也不该有)'
- 'services.yaml:5856-5860 该条目 `generate: false` + `config_source: ~/Library/LaunchAgents/...`
  + `content_digest: sha256:bebd759d...` ⇒ plist 是**手工维护**且 digest 追踪, 改了要同步 digest'
mitigation_refs: []
opened_at: '2026-11-09'
last_reviewed_at: '2026-11-09'
next_review_at: '2026-11-16'
gate_level: none
x1_policy_ref: ''
x3_tier: Principle
decision_needed: '两问。(1) **plist 的正确形态**: 本仓版用 `python3`(PATH, 本机 = 3.9.6) ⇒ 会撞 `datetime.UTC`
  解释器债务; 已安装版用安装位 venv python (3.13+, 无此问题) 但把 `--omo-dir` 指向 state 根 (缺 `_truth`)
  ⇒ 读不到 registry。两者**各有硬伤**。 正解看起来是: **保留安装位 venv python, 但 `--omo-dir` 指向检出** (`.omo`
  里有 `_truth`), 并恢复动态 `NOW`。(2) **谁负责同步**: plist 是手工维护 + digest 追踪, 但没有任何机制保证「本仓 plist
  改了 → 已安装 plist 跟着改」—— 本次漂移就是这么发生的 (B4b 安装位迁移时手工改了已安装版, 之后本仓修 `NOW` 硬编码时没回头改已安装版)。
  需要一个「plist 一致性巡检」(比对已安装 plist 与本仓 plist 的关键字段), 或把 plist 纳入 `gen-service-configs.py`
  的生成面 (把 `generate: false` 改成 true)。'
blockers:
- id: PLIST-TRACKED-BY-DIGEST
  since: '2026-11-09'
  detail: services.yaml 用 `content_digest` 追踪已安装 plist —— 直接改 plist 会造 drift, 必须同步更新
    digest (否则 reality-check 报漂移)。
history:
- at: '2026-11-09T09:05:00+00:00'
  action: identify
  note: '扫 launchd 作业退出码时发现 `com.omostation.omo-debt-refresh` 末次退出码 2。 手动复跑已安装 plist
    的命令 ⇒ `FileNotFoundError: No debt registry found at <state_root>/.omo/_truth/registry/debt.yaml`。

    **两个字段与本仓 plist 不同**: ① `NOW` 从动态 `$(date -u ...)` 变成**硬编码** `2026-10-28T08:18:36Z`
    (12 天前); ② `--omo-dir` 从检出 `.omo` 变成 state 根 `.omo`, 而 state 根按 ADR-0456 只有写面、**没有
    `_truth/`** (读面跟随检出) ⇒ 永远读不到 registry。

    **为什么值得修**: 该作业产出 `.omo/debt/*/current.*`, 一直失败 ⇒ 债务衍生视图是陈旧的。 同批发现 `com.omostation.tailscale-heartbeat`
    也恒失败 (已由 #5176 修好), 说明 「已安装 plist 与本仓漂移」不是孤例。'
  actor: governance-agent
- at: '2026-11-10T02:05:00+00:00'
  action: review
  note: 'Q1 (plist 正确形态) 已闭环 (PR #5213, 2026-11-10): repo plist 解释器由 `python3` 改为
    `.venv/bin/python` —— launchd 默认 PATH 下 `python3` = `/usr/bin/python3`(3.9.6),
    而 `omo_debt_cli.py:15` `from datetime import UTC` 是 3.11+ 才有的 (实跑 ImportError);
    改 venv (3.14) 后与解释器版本解耦。 同轮发现已安装 plist 被手工削掉 WorkingDirectory / PATH / StartCalendarInterval
    (只剩 RunAtLoad ⇒ 每 30 分钟的刷新实际只在家载入时 跑一次), 已整份覆盖重装 (bootout+bootstrap, runs=2, last
    exit code=0), services.yaml 的 content_digest 同步 (旧值与 repo/已装两边都不匹配)。 Q2 (同步机制)
    部分收敛: 该条目已是 `generate: true`, E1 判据 (注册表渲染 vs plist 文本) 闭合; 但「install 时别只抄 command
    行」目前只写在 plist 注释里, 仍无机器判据 —— 剩余风险保留。'
  actor: governance-agent
- at: '2026-11-22T00:00:00Z'
  action: review
  actor: governance-agent
  note: '**复测（pristine `origin/main` worktree + 本机）: 这条红仍在, 且已定位到三个具体缺口。** 门禁项 `service-config-drift`（`ci_skip:
    True` ⇒ 只在 CI 跳, 本地 `--strict` 必跑）硬失败, `gen-service-configs.py --check` ⇒ `drift_count:
    1` （`com.omostation.omo-debt-refresh: plist 与 services.yaml 不一致`）。 **先确认它不是本轮的回归**:
    在一棵**未经我改动**的 `origin/main` worktree 上复算, 读数相同。 **差异清单**（剥掉 XML 注释后仍有 19 行差异）:
    已装件比注册表渲染多出 ① `WorkingDirectory = /Users/xiamingxing/Workspace/projects/omo` ②
    `EnvironmentVariables{PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin, no_proxy=github.com,api.github.com,localhost,127.0.0.1}`
    ③ `StartCalendarInterval` 为 **`<array>` 两条**（`Minute 5` / `Minute 35`）。 **两条根因**:
    (a) `services.yaml` 该条目是 `trigger: calendar` 但 `calendar: None`, 且无 `working_directory`
    / `environment` ⇒ 渲染出来**根本没有这三项**; (b) E1 是**逐字节文本**比对 ⇒ 已装件那一大段说明注释也算 drift。
    **渲染器能力缺口**: `gen_launchd_plist()` 不支持 `working_directory`; `calendar` 只支持单条 `{Hour,
    Minute}` dict, 不支持多时刻 `<array>`。 **要清掉这条红, 三者缺一仍红**: (1) 渲染器补 `working_directory`
    + calendar 列表; (2) `services.yaml` 补上三项; (3) E1 改为比对**解析后的 plist**（注释/键序不算 drift）。
    **纪律**: 上一条记的「E1 判据恢复闭合」指的是**判据接线闭合**, 不是 `drift=0` —— 这两件事此前被同一句话盖住了。另: `ci_skip`
    的红 CI 永远看不见, 只有装了 launchd 的 本机跑 `--strict` 才看得见, 所以它一直只是「本机噪音」而没被当成缺陷。'
- at: '2026-11-22T13:30:00+00:00'
  action: review
  actor: governance-agent
  note: '**认领指针 (防重复劳动)**: 本条的修复已由 **BET-Y2Q4-T10-349** 认领并在途 (2026-11-22 实测: 其 worktree
    正在改 `bin/mof/gen-service-configs.py` 与 `.omo/_truth/registry/services.yaml` ——
