id: DEBT-REVIEW-SCAN-POPULATION-ALL-TERMINAL
title: 债务复审调度器的扫描总体取 registry.seed_items (25 条, 实测 18 resolved + 7 closed = 非终态 0), 而 `.omo/debt/items/` 里 9 条非终态待办全部在面外; glob 回退分支在 seed_items 非空时不可达, 反向 (磁盘→登记) 无门禁 ⇒ 复审机制结构上永远报「无可办」
dimension: governance
subdimension: gate
domain: infrastructure
scope: workspace
severity: high
weight: 0.2
entropy_class: medium
lifecycle_state: identified
owner: governance-team
affected_roots:
- bin/gac/debt-review-scheduler.py
- .omo/_truth/registry/debt.yaml
- bin/gac/debt-integrity-check.py
evidence_refs:
- '扫描总体定义: `bin/gac/debt-review-scheduler.py:48-56` `load_items` —— 总体 = `.omo/_truth/registry/debt.yaml` 的 `seed_items`; `:54-56` 的目录 glob 回退**只在 `paths` 为空**时触发。现 seed_items 有 25 条 (非空) ⇒ 回退分支不可达, 目录里的其余条目永不进入复审'
- '总体组成 (origin/main 实测): seed_items = 25 条且 `seed_refs_not_on_disk = 0` (全部存在), 其 lifecycle 分布 = **18 resolved + 7 closed**, 即扫描面内非终态项 **0 条**'
- '面外组成: `.omo/debt/items/` 在 origin/main 共 45 个条目 (44 yaml + 1 `README.md`), 未登记 20 条, lifecycle 分布 = 8 identified / 9 resolved / 1 closed / 1 in_progress (+1 非 YAML 文档) ⇒ **非终态且扫描面外 = 9 条**, 且 9/9 都带非空 `decision_needed` (逐条核对)'
- '实跑读数 (2026-11-09, 用 `/opt/homebrew/bin/python3.13` 绕开同平面的解释器缺陷): rc=0, stderr 0 行, `--json` = `total_items: 25, needs_reassessment: [], overdue: []` ⇒ 「一切正常」来自总体选错, 不是债务健康; 上面 9 条待办中任一条都不出现在输出里'
- '反向无门禁: `bin/gac/debt-integrity-check.py:25-43` 只验「seed_items 指向的文件是否存在」(单向, 空则报 empty), `bin/gac/gac-local-gate.py:217` 接的正是这条 ⇒ 「磁盘上有但登记面没有」结构上不可见。本地门禁 70 checks 全绿的同一时刻, 9 条待办不在复审面'
- '按调度器自己的口径这些项该被提示: 同文件 `:29` `INTERVAL_DAYS = critical 14 / high 30 / medium 60 / low 90`. 例: `STORAGE-MINI-INTERNAL-NO-RECURRING-BACKUP` sev=high, `last_reviewed_at=2026-10-12` ⇒ 2026-11-11 到期; 因未登记, 到期当天也不会产生任何提示'
- '自我实证 (本项的成因链): 2026-11-09 立案 `BET-LEDGER-CLI-AUTHORITY-SPLIT` (PR #5142) 走的是**直接写 `.omo/debt/items/<ID>.yaml`**, 未登记, `make gac-local-gate` 与 PR CI 全程无异议 ⇒ 该项落在此刻的扫描面外。而 `.omo/_truth/x1-governance-policies.yaml:130` 与 `x4-consistency-rules.yaml:89,138` 明文要求债务修复路径走 `omo governance ingress-debt` broker (broker 会 upsert seed_items) ⇒ 政策存在但无执行面。本项与 `CRON-BARE-PYTHON3-PY39-IMPORT-DEATH` 立案后即同样在面外, 直到裁决落地'
- '为什么会出现两条路径: broker 侧 `projects/omo/src/omo/omo_ingress_debt.py:66-67` `payload.update(debt_data)` 与 `:70` 注入 `source_ref`, `:71-81` setdefault 一批 schema 外键 (`description/source/registered_at/first_seen_at/last_seen_at/occurrence_count`) —— 走 broker 产出的条目形态与本仓 22 键文件 (`projects/omo/src/omo/omo_debt_registry.py:10-33` 为权威) 不一致, 这是「直接写文件」被反复选用的机制原因, 属同一缺陷的另一半, 不是单纯违规'
- '去重: `DEBT-20260917021531-GAP-SEED-DISPATCH` (lifecycle resolved, 2026-09-20 闭环) 处理的是**反方向** —— `gap_seed_items` 27 条声明但物理不存在, 其 resolve_partial 明确记录「gap_seed_items 与 gap_items_dir 全仓无消费者」故移除零影响。本项讲的是有消费者的 live `seed_items` 覆盖不全, 两者不重叠; 该次工作把「声明→执行」补齐, 留下了「执行→登记」这一半'
- '仪器自纠 (立案过程内两例, 均已复算): ① 首轮把 `git ls-tree --name-only` 的**全路径**再拼一次 `.omo/debt/items/` 前缀 ⇒ 集合差算成 45/45、`git show` 空返回被 `or {}` 洗成 None, 输出 45 行全 None (假结论); 修正为不拼接后得 25/20。② 未容错的 `yaml.safe_load` 撞上 `README.md` 抛 ScannerError 中断整轮, 一度误判「有一项 YAML 损坏」—— 逐份 try/except 后确认 README.md 是合法 Markdown 文档 (标题 `# \`.omo/debt/items/\` — Debt Canonical SSOT`), 损坏假设撤回, 44 yaml 全部可解析'
