close_reason: '_parse_iso8601 in omo_debt_metrics.py parses date-only YYYY-MM-DD as 23:59:59.999999+00:00 UTC, eliminating false stale evidence alerts caused by same-day checkouts and worktree checkout mtimes'
resolution_evidence: >-
  1) projects/omo/src/omo/omo_debt_metrics.py:53-59: date-only 字符串解析为当日 23:59:59.999999 UTC，消除当天检出的 worktree (文件 mtime 等于检出时刻) 与当天复审之间的假 stale 漂移；
  2) tests/test_omo_debt_metrics.py 与 tests/test_omo_debt_close_reopen.py 验证通过。
