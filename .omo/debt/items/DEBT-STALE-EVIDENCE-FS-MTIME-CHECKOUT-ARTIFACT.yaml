id: DEBT-STALE-EVIDENCE-FS-MTIME-CHECKOUT-ARTIFACT
title: 'debt 度量把文件系统 mtime 当证据更新时间：worktree 内 mtime 等于 checkout 时刻，补复审无法让条目脱离 stale，且 debt_health 扣分已饱和'
