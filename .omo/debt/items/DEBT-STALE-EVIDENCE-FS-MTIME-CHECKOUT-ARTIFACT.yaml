decision_needed: |-
  三项都是指标口径变更，代理不代做，请 principal 裁决（可分别选）：

  **(D1) stale 判据的时间来源**：`collect_stale_evidence_item_ids`
  (`projects/omo/src/omo/omo_debt_metrics.py:77`) 用 `ref.stat().st_mtime > last_reviewed_at`
  判「证据比复审新」。选项：
  ① 换成 git 侧时间（`git log -1 --format=%ct -- <ref>`，即「证据内容何时变」）；
  ② 保留 fs mtime 但排除「与本次 checkout 同一时刻」的批量值（worktree 检出会把所有文件打成同一秒）；
  ③ 判据只在 canonical / CI 检出上计算，worktree 内记为 `not_measurable`（与 ADR-0456 双根契约一致）。
  影响：50 条 stale 读数中有多少会消失，取决于所选口径，本轮不预测。

  **(D2) `last_reviewed_at` 的写入口径**：97 条里 **84 条是 date-only**（`'2026-11-09'` 这类），
  `_parse_iso8601` 补 UTC 零点 ⇒ 「当天复审」在边界上恒等于 00:00，任何当天发生的证据改动都算「比复审新」。
  选项：① 复审写全 ISO 时间戳（含时分秒）；② 判据把 date-only 视为「当日 23:59」；③ 维持现状并接受「补复审不改变读数」。

  **(D3) 分数饱和**：`debt_health = max(0, 100 − 12.5×overdue − 10×gate − 7.5×missing_pointers − 5×stale)`
  (`:100-107`)。实测 open 50 项：overdue 14 (=175.0) + missing_pointers 8 (=60.0) + stale 50 (=250.0)
  = **485.0 分扣分 vs 100 分预算**；即便把 stale 清零，`health_if_stale0` 仍是 **0.0**。
  ⇒ 当前台账规模下该分数恒为 0，无法表达任何改善，`pointer_entropy` 亦为 1.16（>1 却未被任何门禁拦）。
  选项：① 改成比率/归一化口径（并同步 `.omo/standards/health-metrics-semantics.md`）；
  ② 保留绝对扣分但设下限告警（饱和即视为「指标失效」而非「债务为零」）；③ 明确弃用该分数，改看分项计数。
