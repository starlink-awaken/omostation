- at: "2026-11-23T21:46:30+00:00"
  action: identify
  actor: governance-agent
  note: >-
    **立案由另一次交付的副作用测出。** 本轮给 `AGENT-BRIEF-CANONICAL-ROOT-NO-SCHEDULED-WRITER`
    补 `last_reviewed_at`（`2026-11-09` → `2026-11-23`）后，`collect_stale_evidence_item_ids` 的读数不变：
    canonical 与新建 worktree 都是 `items 97 / stale_total 50`，该条目**仍在 stale 集合内**。逐 ref 直测找到原因：
    ① worktree `/Users/xiamingxing/ws-briefplane352` 内该条目 4 个 ref
    （`docs/pitfalls.md`、`bin/panorama/materialize-agent-brief.py`、`.omo/_truth/registry/services.yaml`、
    `bin/scheduler-compile.py`）mtime **全部是 `2026-11-23T21:35:45Z`——同一秒**，正是本次
    `gac-worktree.sh claim` 的检出时刻；而 canonical 同一批 ref 的 mtime 是分散的
    （`20:41:20` / `06:02:31` / `07:09:44` / `12:12:50`）。
    ② 判据 `:77` 是 `datetime.fromtimestamp(ref.stat().st_mtime, tz=UTC) > last_reviewed`，
    而 date-only 的 `last_reviewed_at` 被 `_parse_iso8601`（`:36-46`）补成 **UTC 零点** ⇒
    「今天复审」= 00:00 < 21:35:45，**判据必然为真**。
    ③ 覆盖面：97 条中 **84 条** `last_reviewed_at` 长度为 10（date-only）。
    ⇒ 结论：在新鲜 worktree 里，「做了复审」这件事**不可能**让条目脱离 stale；
    同一份 YAML 在两个根里 stale 原因不同（canonical 是内容真的改过，worktree 是检出时刻），
    但都计入同一个 `stale_total 50`。**这是「判据描述的是内容事件，实现却打在文件系统状态上」的形状**，
    与本会话已登记的「同一文件两套权威面要声明读数来源」同类。
    ④ 顺带量到分数饱和（见 `decision_needed` D3）：50 项 open 的扣分合计 485.0 对 100 分预算，
    且 stale 清零后 `debt_health` 仍为 0.0 ⇒ **面板上的 0 分不是债务状况，是公式在当前规模下饱和**。
    ⑤ 反向登记面缺口本轮**已不存在**：`.omo/_truth/registry/debt.yaml::seed_items` 97 条 vs
    磁盘 97 个 yaml，`seed_missing_on_disk 0`、`disk_not_in_seed 0`（`docs/pitfalls.md` 里 2026-11-09
    那条「25 vs 46」的措辞已过时，本轮只记录实测，不改那条历史文本）。
    本轮**只立案，不改判据**：D1/D2/D3 任一项都会改变 50 条读数或面板分数，属指标口径变更。
