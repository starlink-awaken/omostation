- "bin/gac/ops-cron-install.py:54 (`REGISTRY=`) 与 :80 (`unregistered_jobs()`) 与 :112-114 (`install()` 一进门见 missing 即 return 非零) 与 :165 (预检输出明说 `--install 会被拒`) —— #5124 的 fail-closed; 复算其 4 个作业确实 0 个在登记面"
