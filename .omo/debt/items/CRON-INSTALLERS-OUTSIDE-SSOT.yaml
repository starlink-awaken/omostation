    唯一剩下的口径差是 `weekly-review.py` 一名：名在册 ≠ 该作业在册。

    ③ 残留一（守卫强度不等，非现行漏洞）：resident 的判据是 `grep -q "omo.cli resident"` —— **单个子串存在性**，
    实测 registry 里命中 4 次（其中 2 次在描述性文字里），`--dry-run` 因此 **rc=0 放行**；
    它不枚举自己要写的作业行（脚本内 5 字段 cron 行只有 1 条字面量，其余来自 `${_ROLE_CRON}`/`${CRON_HEALTH}` 等变量）。
    相对地 maturity/ops 用**逐条命令串覆盖**。⇒ 同一句「fail-closed」下面住着一强两弱：
