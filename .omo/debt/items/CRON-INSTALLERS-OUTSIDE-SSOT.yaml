- "bin/gac/ops-cron-install.py (4 个作业, 0 个在登记面; PR #5124 已加 fail-closed 校验)"
- "bin/ssot/install-resident-cron.sh (resident 平面, 见 RESIDENT-PLANE-SPLIT-LAUNCHD-INERT)"
