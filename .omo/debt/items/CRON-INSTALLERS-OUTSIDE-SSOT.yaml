    8 条路径**全部真实存在**（无"命令指向已删脚本"那种缺陷，我不据此立案）；
    但除 `signal-poller.py`（crontab 活行 1 + `com.omostation.signal-poller.plist`）外，
    其余 7 条（`remediation-engine.py`、`anti-corrosion-check.py`、`north-star-weekly.py`、`health-check-cron.py`、
    `weekly-evolution-report.py`、`weekly-review.py`、`architecture-drift.py`）**在任何面都没在跑**。
    最近提交时间：`weekly-evolution-report.py` 11-12、`architecture-drift.py` 11-24，其余停在 08-17~09-27。
    ⇒ 闭案把「旁路安装」关掉了，没回答「这 7 条该不该活」。要裁的是二选一：
    登记进 `.omo/cron/registry.yaml` 并置 active（则守卫放行、作业复活），还是删掉安装器里的 `JOBS` 条目（承认为死代码）。
    我不代为选，也不新建债条目重复本条已载的事实面。
    本轮零改动：不动三个安装器、不动 registry、不动 crontab。
