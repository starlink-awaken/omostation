decision_needed: |
  三选一，裁决前不改 check-debt-staleness.py 的判据与输出契约，也不动 gac-local-gate 接线：
  (a) 让 `_commits_since` 检查 `out.returncode`：非 0 时返回哨兵（如 -1）并在 report 里加
      `git_ok: false`，`_render`（`:115-119`）把「疑似陈旧=0」改写成「无法取证（git 不可读）」；
      同时在 `main()` 默认路径前置跑一次 `self_test()`（:132 已实现，今天只是没被调用）。
      代价：这条 advisory 的输出行数与措辞会变，任何按现文案 grep 的人/脚本会失配。
      本会话已全仓检索 `疑似陈旧|check-debt-staleness`，命中仅 3 个文件 —— 脚本自身、
      `bin/gac/gac-local-gate.py`（按子进程调用不解析文案）、`bin/_registry/scripts/governance/check-debt-staleness.yaml`
      （登记描述），**无文案消费者** ⇒ (a) 的失配风险实测为零。
  (b) 保持脚本不变，改接线：`gac-local-gate.py:421` 换成带 `--self-test` 前置的双步，
      使「仪器能跑」成为读数的前提。代价：门禁多一步 git 操作（self_test 建临时仓，实测耗时约 1-2 s）。
  (c) 接受现状，把「这条读数只在真实仓里可信」写进使用侧约定（不进代码）。
  另附一条独立问题：`:221` 恒 exit 0 使该信号永不失败，而 `governance-checks.yaml:182` 已把它登记进
  `script_baseline`（743→744）。若将来要让它参与阻断，需要先决定「git 不可读」算不算失败——
  那属判据面变更，本条不代裁，也不代为接线。
