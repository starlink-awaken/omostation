  action: update_description
  note: |-
    Updated description from '' to '一条 advisory 信号在证据源缺席时谎报全清。三段都在同一个脚本里，可复算。

    判据怎么算「陈旧」：`bin/gac/check-debt-staleness.py:55 _commits_since(root, path, ts)` 用
    `git log --since=@<ts> --format=%h -- <path>` 取**提交数**（`:58-59` 的 docstring 解释了为什么用计数而不是布尔：
    二元命中在活跃期 21/21 全中，没有区分度），`:60-68` 起 `subprocess.run(..., cwd=root, timeout=30)`。

    断点一（本条核心）：**退出码从未被检查**。
    - `:69-70` `except (OSError, subprocess.SubprocessError): return 0`；
    - `:71` `return len(out.stdout.split())`。
    非 git 目录里 `git log` 返回 rc=128 且 stdout 为空，**不触发异常**，于是直接走到 `:71` ⇒ 计数 **0**；
    即使真抛异常也是 `return 0`。两条路径都把「无法取证」折叠成「自复审以来零改动」，
    与真实的 `0 commits since` 在输出上完全同形，且 `rc` 不进 report、不进渲染行。

    断点二：默认调用路径不带自证。`:206-212` 的 `main()` 里 `--self-test` 是独立开关（`:213-214`），
    只有显式传旗标才跑 `self_test()`（`:132`，它会在临时目录 `git init` + 两次 commit 证明检测器真能分辨改动）。
    而实际接线 `bin/gac/gac-local-gate.py:421` 的命令是
    `{"command": ["bin/gac/check-debt-staleness.py"]}` —— 无参数，走的就是不静默自证的那条路。

    断点三：退出码恒 0。`:221 return 0`（advisory 设计如此），所以「疑似陈旧 N 条」再多也不会拦任何东西；
    这与断点一叠加后的净效果是：**这条信号既不能失败，也能在没跑的时候说「✅ 无」**。

    复现（本会话 05:50Z，三种环境同一份代码）：
    | 环境 | identified | 候选(有 roots+复审日) | 疑似陈旧 |
    |------|-----------|---------------------|---------|
    | main tip 的 **git-less** 抽取（`git archive origin/main .omo bin` 解到 /tmp/driftchk，无 `.git`） | 42 | **26** | **0** + `✅ 无: 所有候选条目的 affected_roots 自复审以来未被改动` |
    | claim 出的 worktree（main tip，真实仓） | 42 | 26 | 21 |
    | canonical（101 份旧检出，真实仓） | 38 | 18 | 16 |
    候选分母在 git-less 那份与真实 worktree **完全相同**（42/26），只有「疑似陈旧」从 21 变成 0 并附带绿色结论行
    ⇒ 差异不是数据、不是口径，而是 git 是否可读。这正是本仓避坑条目「仪器阴性先证其能跑」
    与「`2>/dev/null` 把『仪器根本没跑』洗成『零命中』」的同族，只是这里的掩盖方式是不看 rc。

    与既立案的边界（避免读成重复）：本条**不是** `DEBT-YAML-BYPASS-TEST-VENV-FALLBACK-FALSE-RED`
    （那份讲测试因 venv 回退而假红），也不是 `check-debt-staleness` 今天在我复核批次里出现的 `rc=0` 读数本身
    —— 那些读数都来自真实仓，成立。本条只针对「git 不可读 ⇒ 假绿」这一条形状。
    `ISC1-ROOT-PIN-BASELINE-COUPDATE-GAP` 讲的是「基线改了没人 bump」，方向相反（那个是恒红，这个是恒绿）。
    '.
