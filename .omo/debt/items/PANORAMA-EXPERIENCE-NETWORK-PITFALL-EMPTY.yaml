decision_needed: "三条修法互不等价，差别在「承认哪个平面是权威」，需 principal 裁决后 agent 才能动判据面：\n\n(a) **修读者，保住机器面** —— `panorama-collect.py:4443` 的 glob 改 `.omo/_knowledge/pitfalls/*/PITFALL-*.yaml`，解析改成 `yaml.safe_load(整份)`（不再按 `---` 切 frontmatter），并把 decisions 半边的 `PITFALL-(\\d+)` 与节点 id 命名空间对齐（现网 58 条是 `PITFALL-{CAT}-{NNN}` 三段式，非纯数字）。代价：改 `bin/panorama/` 采集代码 + 需要一次面板对拍；收益：58 条知识真正进图，实测 `try/except Exception: pass` 吞掉的异常面也一并显式化。agent 倾向此项，但它改的是消费端判据口径，不属「纯缺陷零政策变更」。\n\n(b) **宣布机器面不被消费，与 ① 收敛** —— 保留 `error-knowledge.py` 作为写入侧，把 `.omo/_knowledge/pitfalls/INDEX.md` 的 `type: ssot` 与「`ecos-constraint pitfall scan` 纳入 CI 静态门禁」两处自陈改成如实措辞（指向 `docs/pitfalls.md` 为唯一人读权威），Panorama 经验网络改读 ①。代价：58 条机器面条目变成历史资产；收益：三张表变两张，消除 INDEX.md 的虚假接线声明。\n\n(c) **只修 glob，不修解析** —— 最小改动让文件被采到。实测会产出 58 个 id 全是 `PIT-`（空 title）的塌缩节点，比现在恒空更难读，属**明确不推荐**，列出来只为记录「修一半」的形状。\n\n无论选哪条，本项都以「三张表读数不同源」为事实登记：`ecos-constraint pitfall list`=3（硬编码，两平面都不读）、`error-knowledge.py stats`=58、`docs/pitfalls.md`=162。任何引用其中单一读数的论证都不能代表另两侧。"
