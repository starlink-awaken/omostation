id: OMO-DEBT-GATE-GOVERNANCE-RATIO-CI-HAS-NO-POPULATION-WAIVER-CANNOT-COINCIDE
title: 治理占比 40% 上限在 CI 无判据输入 (ledger 未入库 => no-ledger 恒 PASS), waiver 仅 CI 生效, 两面永不同时成立
dimension: governance
subdimension: gate
domain: workspace
scope: governance_kernel
severity: medium
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-agent
affected_roots:
- bin/gac/check-governance-ratio.py
- bin/gac/gac-local-gate.py
- .github/workflows/gac-gate.yml
- .omo/_truth/governance-evidence/waiver-2026-11-25-debt-batch21-24-ratio.md
evidence_refs:
- '判据输入路径: bin/gac/check-governance-ratio.py:51 LEDGER = WORKSPACE / ".omo/_delivery/agent-workflows/events.jsonl";
  :161-175 `if not LEDGER.is_file():` 直接构造 ok=True, ratio=0.0, message="no ledger"
  并 return 0 —— 台账缺席即 PASS.'
- '台账不入库 (实测 @51cc1efc5, worktree /Users/xiamingxing/ws-debt21): `git ls-files --error-unmatch
  .omo/_delivery/agent-workflows/events.jsonl` → NOT-TRACKED; `git show HEAD:.omo/_delivery/agent-workflows/events.jsonl`
  → no committed blob. 故 CI checkout 得到的树里该文件必然不存在.'
- 'canonical 侧形态: 在 /Users/xiamingxing/Workspace 跑 `git check-ignore -v <同路径>` → `fatal:
  pathspec ... is beyond a symbolic link` (该处 .omo/_delivery 为符号链接, linked worktree
  与 canonical 共享 inode); 本机该文件实存且 agent_workflow_start 计数 496 —— 本机有输入, CI 无输入.'
- 'CI 无补料路径 (全库检索): `rg -n "events\.jsonl|_delivery/agent-workflows" .github/workflows/*.yml`
  只命中 governance-check.yml:850/887 的 `${{ runner.temp }}/omo-events.jsonl` (失败日志 artifact,
  不是台账); `rg -n "agent-workflow\.py (start|claim)" .github/workflows/` 零命中; `git check-attr
  filter -- <台账路径>` → `filter: unspecified` (无 LFS 拉取). 没有任何步骤在 CI 里造出该文件.'
- 'CI 确实执行了这个 check (排除「没接线」解释): 导入 bin/gac/gac-local-gate.py 后在 env CI=true 下调 `gate_checks(strict=True)`
  返回 88 个 id 且 `check-governance-ratio` 在内; 该 id 逐项实测不在 OPS_ONLY_CHECKS / AGENT_WORKFLOW_GATE_CHECKS
  / CI_ONLY_CHECKS / CI_SKIP_CHECKS / BROKEN_CHECKS 任一集合 (全 False), 且在 CHECKS 中无 ci_only/broken
  标记.'
- 'CI 读数: PR #5553 gac-gate run 45558466383 的 "gac-local-gate (strict)" step, env
  段打印 `GITHUB_PR_NUMBER: 5553`, 末行 `GaC local gate: PASS (88 checks executed, 2 SOFT
  WARN)`; 同 step 在 `gh run view --log` 里逐条 `[PASS] <id> :: <cmd>` 只剩 2/88 条 (日志压缩),
  所以「ratio 那行没出现」不能当「未执行」的证据 —— 该 PASS 的成因只能落到第 1 条的 no-ledger 短路.'
- '同 commit 本机读数 (对照实验): `make gac-local-gate` rc=2, 打 `[FAIL] check-governance-ratio
  :: bin/gac/check-governance-ratio.py` + `check-governance-ratio: FAIL (blocking)`
  + `window=30d total=142 governance=59 collab=0 flex=83 ratio=41.5% ratio 41.5% >
  ceiling 40%`. 同一份代码同一个判据, CI PASS / 本机 FAIL, 全部差异来自台账文件在不在.'
- '豁免在本机不可能触发: `check-governance-ratio.py:281-282` `pr_number = os.environ.get("GITHUB_PR_NUMBER",
  "").strip()`; `if not pr_number: return []`. 本机不设该 env, 所以即使台账在场且超线, waiver 也无法生效
  —— 批次 22/23/24/26 的 `--status blocked` 读数不会因为 waiver 被转换 (这与创建豁免时向 principal 声明的限制一致,
  本条是机制级复证).'
- '两面合不上 (结论): 判据能 FAIL 的平面 (本机, 有台账) 是豁免唯一读不到的平面; 豁免唯一能读到的平面 (CI, GITHUB_PR_NUMBER
  存在) 是判据因无输入而恒 PASS 的平面. 于是 ADR-0249 的 40% 上限当前不存在任何一个「超额」与「豁免裁定」同时成立的执行平面, principal
  选择的 waiver 在本批及既往批次都只完成了记账, 没有完成放行.'
- '豁免实例本体: .omo/_truth/governance-evidence/waiver-2026-11-25-debt-batch21-24-ratio.md,
  `schema_version: governance-waiver/v1`, `status: active`, `pr_numbers: [5553]`,
  commit aa58486cb.'
