history:
- at: '2026-11-25T06:21:30.604122+00:00'
  action: register
  note: Registered debt item OMO-DEBT-GATE-GOVERNANCE-RATIO-CI-HAS-NO-POPULATION-WAIVER-CANNOT-COINCIDE.
  actor: governance-agent
- at: '2026-11-25T06:24:36.416180+00:00'
  action: update_description
  note: 'Updated description from '''' to ''现象：ADR-0249 规定治理自省占比 ≤ 40%（另两档 40/20），执行判据是
    bin/gac/check-governance-ratio.py，由 bin/gac/gac-local-gate.py 的 CHECKS 注册为 check-governance-ratio，既非
    ci_only 也非 broken，因此在 CI 的 --strict 全量档里被选中（实测 gate_checks(strict=True) 在 env
    CI=true 下返回 88 个 id 且包含它）。但它唯一的输入 .omo/_delivery/agent-workflows/events.jsonl
    是宿主运行态、不在版本控制里（git ls-files --error-unmatch 报 NOT-TRACKED，git show HEAD: 该路径无
    blob），CI checkout 得到的树里它必然缺席，于是 :161-175 的 `if not LEDGER.is_file()` 短路成 ok=True
    / ratio=0.0 / message=''no ledger'' 并 return 0。同一份代码同一棵提交，在本机 FAIL（rc=2，window=30d
    total=142 governance=59 ratio=41.5% > ceiling 40%），在 CI PASS（gac-gate run 45558466383
    该 step 末行 ''GaC local gate: PASS (88 checks executed, 2 SOFT WARN)''）。差异不来自阈值、分类或时间窗口，只来自台账在不在。


    与豁免机制的合不上：check-governance-ratio._active_waivers() 只在环境变量 GITHUB_PR_NUMBER 存在时才去读
    .omo/_truth/governance-evidence/waiver-*.md 的 pr_numbers（:281-282 空值即 return []），而该
    env 只有 .github/workflows/gac-gate.yml:214 在 strict step 上注入。结果两面永不同时成立——判据能 FAIL
    的平面（本机，有台账）恰好是豁免唯一读不到的平面；豁免唯一能生效的平面（CI，有 env）恰好是判据因无输入而恒 PASS 的平面。ADR-0249 的 40%
    上限因此没有任何一个「超额」与「豁免裁定」可以同时被表达的接缝，principal 裁定的 waiver（waiver-2026-11-25-debt-batch21-24-ratio.md，pr_numbers
    [5553]，commit aa58486cb）对本机批次 22/23/24/26 的 blocked 读数不产生转换作用，对 CI 也不产生放行作用，只完成了记账。


    取证边界如实记录：CI 日志里该 step 的逐条 [PASS] <id> :: <cmd> 只剩 2/88 条（gh run view --log 对长
    step 的压缩，实测 selector 88 条 vs 日志命中 2 条），所以「ratio 那行没打印」不能作为「该 check 未执行」的证据，本条结论落在
    no-ledger 短路这一 git 层可判定的事实上。另排除三种替代解释：CI 无任何步骤物化该台账（rg 全库只命中 governance-check.yml:850/887
    的 runner.temp/omo-events.jsonl 失败日志；CI 不调 agent-workflow start/claim；该路径无 LFS
    filter）。


    后果：40% 预算封顶实际只在开发机生效且只由 agent 自己的 gate 读数触发，合并面不受其约束；同时任何「靠 waiver 放行合并」的设计意图在
    CI 里都得不到验证，后续若有人据此认为豁免已被演练过会产生错误安全感。


    本批不自行修的理由：修法要么改判据输入面（把台账入库或让 CI 从 runs/*.yaml 重建 population），要么改 waiver 生效面（让本机也读
    PR 号或让 CI 强制先物化），两者都动 ADR-0249 的执行平面与治理占比的判定口径，属 principal 决策范围，且会改变既有 blocked
    读数的可比性。本批只把机制事实钉成条目。''.'
- at: '2026-11-25T09:10:00+00:00'
  action: mitigate
  note: >-
    **#5559 消掉了「假 PASS」, 但没有消掉本条的后果, 条目不闭合。**
    改动: `check-governance-ratio.py` 在 `not LEDGER.is_file()` 时不再返回
    `ok:true / ratio:0.0`, 而是自报 `measured:false, reason:"no_ledger"`;
    门禁命令补 `--json` 让它进 `not_measured`。判据语义与退出码未动 (缺输入不阻断)。
    **为什么不算闭合**: 40% 上限在 CI 依旧**不受约束** —— 那里仍然没有台账,
    只是从「假装测过且通过」变成「承认没测」。本条描述的接缝问题 (能 FAIL 的平面
    读不到 waiver, 能读 waiver 的平面没有输入) 一字未变。要真生效仍需 owner 裁:
    ① 把台账入库或让 CI 从 `runs/*.yaml` 重建 population; ② 让 waiver 在本机也可读
    (或 CI 先物化台账)。两条都动 ADR-0249 的执行平面, 与本条原判断一致。
    **同族另有两处, 已一并修成「自报」** (#5561 `check-evidence-honest-closure`、
    #5569 `check-work-landed`; 三处都读 `.omo/_delivery/**` 这个 gitignore 面)。
    扫描口径 (可复跑): 全 `bin/` + `scripts/` 里 `if not <gitignore 面路径>` 后 9 行内出现
    `"ok": True` / `PASS` 且 return 的分支 —— 2026-11-25 全量筛得 8 个候选, 逐处看下来
    仅这三处为真缺陷, 其余早退的输入都在被跟踪的仓内路径上 (缺席属真异常)。
  actor: 'governance-agent'
