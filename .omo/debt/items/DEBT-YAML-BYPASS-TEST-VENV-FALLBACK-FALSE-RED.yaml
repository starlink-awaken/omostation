  note: >-
    **交付中实测到的假红，形状是「仪器根本没跑，却按阴性出判决」。** 在
    `/Users/xiamingxing/ws-briefplane352`（`gac-worktree.sh claim` 新建，base `77bcf1838`）跑：
    ① `uv run --no-sync pytest -o addopts="" -q tests/test_yaml_bypass_invariant.py` ⇒
    **2 failed, 17 passed**，断言文本为「yaml-bypass lint 仍 fail (rc=1)」。
    ② 但同一命令读到的真实原因不是违规，而是命令根本没执行：
    `/Users/xiamingxing/.local/pipx/venvs/pytest/bin/python: Error while finding module specification for 'omo.omo_lint' (ModuleNotFoundError: No module named 'omo')`。
    ③ 机制在 `tests/test_yaml_bypass_invariant.py:24-27`：`venv_py = ROOT/projects/omo/.venv/bin/python`
    不存在时**静默回退 `sys.executable`**，而 `ROOT` 是 worktree，worktree 内无 `projects/omo/.venv`
    （实测 `no venv`），于是用的是宿主 pipx pytest 的解释器，里面没有 `omo` 包。
    ④ 阳性对照（证明判据本身是绿的、只是装置问题）：改用 canonical 的 venv 跑同一测试文件
    `/Users/xiamingxing/Workspace/projects/omo/.venv/bin/python -m pytest -o addopts="" -q tests/test_yaml_bypass_invariant.py`
    ⇒ **3 passed**（`ROOT` 仍解析到本 worktree，故 lint 检查的是我改动后的 worktree YAML，不是 canonical 文件）。
    ⑤ 影响面：任何在 worktree 里按常规方式（`uv run` / pipx pytest）跑本测试的 agent 或 CI，
    会得到「yaml-bypass 违规」的假红，并可能据此去剥离自己没写的字段；本条出现的具体现场是
    新建 `DEBT-STALE-EVIDENCE-FS-MTIME-CHECKOUT-ARTIFACT.yaml` 之后的回归跑。
    本轮**只立案，不改测试**：修 skip 口径或回退顺序都会改变这条不变量在哪些环境下判红，属门禁语义变更。
