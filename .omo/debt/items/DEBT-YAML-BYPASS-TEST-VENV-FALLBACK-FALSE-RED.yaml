decision_needed: |-
  修法涉及「测不出来时该报什么」，是门禁语义变更，请 principal 裁决其一：

  **(E1) 区分「跑不成」与「跑出违规」**：`_run_lint()` 在解释器无法 `import omo` 时
  （stderr 含 `ModuleNotFoundError` / `Error while finding module specification`）应
  `pytest.skip("yaml-bypass lint 装置不可用")`，而不是让 rc=1 流进断言当违规。
  **(E2) 修回退顺序**：`tests/test_yaml_bypass_invariant.py:25-27` 先取
  `ROOT/projects/omo/.venv/bin/python`，不存在则退到 `sys.executable`；worktree 里没有
  `projects/omo/.venv`，`sys.executable` 可能是任何 venv 的 pytest。可改为按 `repo_root()`/
  `install_root()` 解析（ADR-0456），或回退到 `<canonical>/projects/omo/.venv/bin/python`。
  **(E3) 不动测试，改 CI 口径**：要求 gac/CI 只在装有 omo venv 的检出上跑本测试（登记到
  `.omo/_truth/registry/ci-surfaces.yaml`），本地 worktree 不计入。
  本条**只立案不改**：E1/E2 都会改变这条不变量的红/绿判定面。
