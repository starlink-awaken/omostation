  note: >-
    **核查口径**：`git cat-file -e origin/main:<path>` 逐条判存在 + 与 `status` 交叉，
    两条方向都算。**判据**：设计「用 A 的存在性推断 B 的状态」这类判据前，先问
    「A 在 B 之前出现是合法的吗」—— 本例合法（spec 先于交付提交），所以该判据不成立。
    **纪律**：否定结论也要落进条目，否则下一轮会有人把同一个不成立的判据再提一遍。
