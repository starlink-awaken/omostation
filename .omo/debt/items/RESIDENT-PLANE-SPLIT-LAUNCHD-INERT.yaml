id: "RESIDENT-PLANE-SPLIT-LAUNCHD-INERT"
title: "resident agent 两个驱动平面分裂 —— launchd 侧空转 (0 台账事件) 且与 crontab 侧读不同事件源、写不同 ledger"
dimension: "governance"
subdimension: "consistency"
domain: "system"
scope: "host"
severity: "high"
weight: 0.25
entropy_class: "medium"
lifecycle_state: "identified"
owner: "governance-team"
affected_roots: []
evidence_refs:
- "~/Library/LaunchAgents/com.l4.resident.decision.plist (EnvironmentVariables.OMOSTATION_STATE_ROOT => ~/.local/state/omostation/prod)"
- "~/.local/state/omostation/prod/runtime/omo/event-ledger.sqlite3 (event_log 0 行 / event_outbox 0 行)"
- "~/Workspace/runtime/omo/event-ledger.sqlite3 (event_log 452 行 / event_outbox 452 行)"
- "已装 crontab 的 5 条 `omo.cli resident daemon --once --role <role> --ledger ~/Workspace/runtime/omo/event-ledger.sqlite3`"
- ".omo/_truth/registry/services.yaml (resident 服务声明 OMOSTATION_STATE_ROOT)"
mitigation_refs: []
opened_at: "2026-11-07"
last_reviewed_at: '2026-11-07'
next_review_at: '2026-11-14'
gate_level: none
x1_policy_ref: ""
x3_tier: "Principle"
decision_needed: "先裁决「哪个平面是 resident 的权威驱动」，再让两边的 ledger 与事件源收敛到同一处。可选: (a) 以 launchd 为唯一平面 —— 把 crontab 那 5 条摘掉 (需 crontab 写入恢复), 并让 launchd 侧真的产生台账; (b) 以 crontab 为唯一平面 —— 停用 com.l4.resident.* 六个 agent; (c) 保留双平面但统一 ledger (给 launchd plist 也加 OMO_EVENT_LEDGER_DB, 或去掉 crontab 行的 --ledger 改用 state_root())。**不要**在没裁决前单独改一侧 —— 那会造出「一边有事件、一边没有」的更大分裂。"
history:
- at: '2026-11-07T05:00:00+00:00'
  action: identify
  note: >-
    实测 (2026-11-07): resident 五角色 (sediment/decision/execute/monitor/heartbeat)
    同时被两个平面驱动 ——
    ① launchd: com.l4.resident.<role>, StartInterval=120, ProgramArguments=
       /bin/bash ~/.local/opt/omostation/lib/resident-role-tick.sh <role>
       (即 uv run --project <安装位>/projects/omo python -m omo.resident.cli daemon
       --once --role <role>), EnvironmentVariables.OMOSTATION_STATE_ROOT=
       ~/.local/state/omostation/prod; registry 侧对应 resident-launchd-* 条目
       (status: active, reality: installed)。
    ② crontab: `*/2 * * * *` 五条, 走 **检出** 的 omo.cli, 且显式
       `--ledger ~/Workspace/runtime/omo/event-ledger.sqlite3`; 这五条在
       registry 里没有登记, 只在 known_orphans 里 (模式 `omo.cli resident daemon
       --once --role`)。

    分裂的三处读数:
    - **台账**: state-root ledger event_log = **0 行**; 检出 ledger event_log =
      **452 行**。即 launchd 平面驱动的那些角色没有产生任何台账事件。
    - **事件源**: 手动跑 launchd 侧命令 (带同样的 OMOSTATION_STATE_ROOT) 得
      `{"events_in_file": 22918, "processed": 0, "start_index": 22906,
      "task_queue": {..., "skipped": true}}` —— 读的是另一个事件源, 且处理 0 条。
      同期 crontab 侧日志每次处理 143 条。
    - **码面**: launchd 跑的是安装位 (~/.local/opt/omostation, 主仓落后
      origin/main), crontab 跑的是检出 —— 同一角色由两份代码执行。

    launchd 侧不是没跑: `launchctl print` 显示 runs=167 / last exit code=0 /
    state=active, 但台账零增长 —— **空转**。

- at: '2026-11-07T05:30:00+00:00'
  action: evidence-reinforce
  note: >-
    补三条把「分裂」钉死的读数 (追查 ledger 时顺带发现, 分裂不止于 ledger):

    ① **事件源不同**: `omo.resident.daemon` 读
       `write_path(DEFAULT_EVENTS_JSONL)` = `<state_root>/.omo/_knowledge/workflow-mesh/
       events.jsonl`。launchd 侧 state_root=~/.local/state/omostation/prod ⇒ 读那份;
       crontab 侧无 profile ⇒ 读检出那份。两份文件都真实存在但**内容不同**。
    ② **水位/计数不同**: 同一 role (decision) 两侧报的 `events_in_file` 差三个数量级 ——
       launchd 侧 22918 (start_index 22906, processed 0, skipped=true), crontab 侧
       6018276 (processed 143)。`events_in_file = last_index + len(scanned)`, 而
       `last_index` 取自**各自 ledger 的 checkpoint** ⇒ 两个 checkpoint 各自演进,
       不是同一份进度。
    ③ **字节水位各自独立**: `_load_byte_offset(projector)` 走 `write_path(...)` ⇒ 每侧
       一份 watermark, 互不可见。

    结论: 这不是「一边写了、一边没写」, 而是**两套独立演进的读+写**。裁决时不能只
    对齐 ledger 路径 —— 还要决定用哪份事件源与哪个 checkpoint, 否则对齐路径后两边
    仍会从各自的水位继续, 处理重复或漏处理。
  actor: "governance-agent"
- at: '2026-11-09T04:15:00+00:00'
  action: evidence
  note: >-
    把上面 ① 的「两份文件内容不同」量化成**新鲜度差**, 并订正一处读法 (2026-11-09
    12:11 实测, 本机 mbp):

    | 事件源 | 行数 | mtime | 谁在读 |
    |---|---|---|---|
    | `<state_root>/.omo/_knowledge/workflow-mesh/events.jsonl` | **14** | 2026-11-09 **07:31** (4.5h 前) | launchd 侧 |
    | `~/Workspace/.omo/_knowledge/workflow-mesh/events.jsonl` | **2625** | 2026-11-09 **12:00** (11min 前) | crontab 侧 |

    ⇒ **live 事件源是检出那份**, state 根那份是**陈旧的** (4.5 小时无写入)。launchd
    平面因此结构性地追一个没人写的文件 —— 这不是「处理慢」, 是**没有输入**。

    **订正**: 上一轮把 `task_queue.skipped: true` 与「空转」并列读, 容易读成故障。
    实测源码 `daemon.py:333-335`: `skipped: true` 只是**队列表不存在** (`db_path`
    不存在即返回), 属正常空队列; 真正的读数是 `processed: 0` 且
    `start_index == events_in_file` —— 字节水位已在 EOF, 无增量可读。

    **checkpoint 尺度差**: 同一 role 两侧 ledger 的 `projection_checkpoint` ——
    检出 `resident-execute: 8,826,634` / `resident-decision: 8,260,836`;
    state 根 `resident-decision: 34,049` / `resident-execute: 36,506`。差 ~200 倍,
    与上一轮「差三个数量级」一致但更精确 —— 两个 checkpoint 确实各自演进。

    **手动复跑** (带 `OMOSTATION_STATE_ROOT`): `{"events_in_file": 34049, "processed": 0,
    "start_index": 34049, "task_queue": {"completed": 0, "failed": 0, "picked": 0,
    "skipped": true}}`; 对照 crontab 侧每次处理 143 条。

    **修法方向 (供裁决)**: ① 让事件**生产方**也走 state 根 (补 ADR-0456 迁移的
    最后一环), 两侧才可能同源; ② 或让 launchd 侧不声明 profile, 与 crontab 侧一起
    落在检出 (等于债务 option (c) 的极端形式); ③ 或裁 crontab 侧为唯一平面 (option (b)),
    停掉 6 个 `com.l4.resident.*`。**不要**只删/改一侧的 `OMOSTATION_STATE_ROOT` ——
    事件源与 checkpoint 两处都同源才会收敛, 只对齐 ledger 路径会从各自水位继续跑。
  actor: "governance-agent"
