last_reviewed_at: '2026-11-23'
next_review_at: '2026-12-07'
gate_level: none
x1_policy_ref: ""
x3_tier: "Principle"
decision_needed: |-
  先裁决「哪个平面是 resident 的权威驱动」，再让两边的 ledger 与事件源收敛到同一处。可选: (a) 以 launchd 为唯一平面 —— 把 crontab 那 5 条摘掉 (需 crontab 写入恢复), 并让 launchd 侧真的产生台账; (b) 以 crontab 为唯一平面 —— 停用 com.l4.resident.* 六个 agent; (c) 保留双平面但统一 ledger (给 launchd plist 也加 OMO_EVENT_LEDGER_DB, 或去掉 crontab 行的 --ledger 改用 state_root())。**不要**在没裁决前单独改一侧 —— 那会造出「一边有事件、一边没有」的更大分裂。

  **2026-11-23T23:31Z 复测追加（原 (a)/(b)/(c) 文字不动，实测见本条 `review` 条目 ④⑤）：驱动平面实测是三个，不是两个。**

  - **crontab 侧**：5 条 `--role` 行（`sediment`/`decision`/`execute`/`monitor`/`heartbeat`，均 `*/2 * * * *`），
    产物在**检出根**且新鲜（`.omo/state/resident-heartbeat.jsonl` mtime `2026-11-23T23:30:01Z`）。
  - **launchd 侧**：6 个 `com.l4.resident.*`（promote/execute/inbox/signals/event-ingest/decision）last exit 0、
    当前无 PID（间隔作业）；6 份 plist 实测 `EnvironmentVariables.OMOSTATION_STATE_ROOT =
    ~/.local/state/omostation/prod` 且 `ProgramArguments = /bin/bash ~/.local/opt/omostation/lib/resident-role-tick.sh <role>`
    ⇒ 它是**按 env 被钉到 state 根**，不是跑坏了；其事件源 14 天只增 13 行、距本次取样 ~24 h 无写入。
  - **常驻 daemon 侧（本条此前完全未登记）**：`resident.pid` = **2706 存活**（`kill -0` 通过），
    `ps` 原文 `/Users/xiamingxing/.local/opt/omostation/projects/omo/.venv/bin/python -B -m omo.resident.service_runner --daemon`，
    `lstart Sat Nov 21 18:16:31 2026`、`etime 02-13:14:46`、`ppid 1`、**cwd = `~/.local/opt/omostation`（install 根 = 第三个根）**；
    另有 pid 2768 `… .venv/bin/python -m omo.cli resident daemon`。它 2 h 内写了 install 根
    `.omo/state/{agent-tick-daemon.jsonl(23:28:43Z),signal-poller-state.json(23:28:26Z),mail-daemon.jsonl(23:16:45Z),cell_states.json(22:16:11Z)}`，
    但 install 根 `.omo/_knowledge/workflow-mesh/` 只有 1 个文件、2 h 内 **0 次写入**
    ⇒ daemon **活着、在产出，但不产出 mesh 事件流**。

  **(d) 第三个平面在权威裁决里算什么（原三选项都不含它）。** 选项：
  (i) 并入 (b)「以 crontab 为唯一平面」——裁决时同时停掉 pid 2706/2768；
  (ii) 并入 (a)「以 launchd 为唯一平面」——把这个 daemon 认作 launchd 侧的常驻实现（`ppid 1`；它是否由某个 launchd 作业派生本轮未追，故不作为既成事实）；
  (iii) 新选项：判 daemon 为正解，把它的事件输出接到 `workflow-mesh/events.jsonl` 并停掉另外两侧；
  (iv) 先只登记第三平面的存在，(a)/(b)/(c) 留待后续。

  **(e)「无输入」的措辞精度（影响 (c) 的定义）。** state 根事件源并非零写入（14 天 +13 行），
  是**写入速率比检出侧低约两个数量级**（比值 2026-11-09 ~188× → 2026-11-23 ~153×）。
  若选 (c)「双平面统一 ledger」，必须先定义 state 根那份 `events.jsonl` 的**写入者**，
  否则统一后仍有一侧近乎只增不改，分裂只是换个度量口径。
  **本轮不代裁、不单侧改动**（本条原文警告的「一边有事件、一边没有」在三个平面下更容易发生）。

