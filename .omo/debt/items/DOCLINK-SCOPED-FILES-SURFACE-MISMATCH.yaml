  action: update_description
  note: 'Updated description from '''' to ''**症状** —— 一个只碰 `docs/pitfalls.md` 与 `AGENTS.md` 的**纯追加型**文档 PR（`git diff --cached` 只有一个 hunk `@@ -425,0 +426,4 @@`，0 删除行），在 worktree 里 `make gac-local-gate` 报 `[FAIL] doc-link-check :: bin/ssot/doc-link-check.py --files AGENTS.md docs/pitfalls.md`，明细 `doc-link-check: FAIL (2 broken links)`，位置 `docs/pitfalls.md:367`（解析出的目标 `bin/[A-Za-z0-9_./-]+\.py`）与 `docs/pitfalls.md:370`（目标 `bin/...\.py`）。两条都是 2026-11-11 立案的既有条目把正则字面量写在单反引号里：`re.findall(r''["\''](bin/[A-Za-z0-9_./-]+\.py)["\'']'', …)`，其 `[` … `](` … `)` 相邻形状被链接尺当成语义链接；`git show origin/main:docs/pitfalls.md` 同两行逐字相同 ⇒ 与本 diff 零交集。


    **装置的自陈意图与实际接线不同源** —— 尺子本体 `bin/ssot/doc-link-check.py:19` 是 `LINK_RE = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")`，对 inline code span 不做排除（CommonMark 规定 code span 内容不参与链接解析）；它的扫描面 `LOCAL_DOC_GLOBS`（`:20-30`，8 个 pattern：根面 5 个 + `projects/AGENTS.md` + `projects/*/AGENTS.md` + `projects/*/CLAUDE.md`）**不含 `docs/**`**，且脚本 docstring 明写意图是「scans the small, agent-facing documentation surface instead of every historical note under .omo/ … without turning archived knowledge into noisy gate failures」。而调用侧 `bin/gac/gac-local-gate.py:978-986 scoped_doc_link_command()` 分两支：`strict=True` 走默认面（即 `LOCAL_DOC_GLOBS`，历史档案不在内）；非 strict 走 `staged_files_git()` 里**全部** `.md` 原样传给 `--files`，不按 `LOCAL_DOC_GLOBS` 过滤。于是「本地门禁」实际比装置声明的面大，历史档案被拉进扫描面。


    **覆盖面量实** —— `docs/**/*.md` 共 1111 个文件，`LINK_RE` 命中「目标含正则元字符 `[ \ ] + * ? { } |`」的伪链接共 3 处：`docs/pitfalls.md:367`、`docs/pitfalls.md:370`、以及 `docs/2026-07-10-bus-foundation-r89-r97.md:518` 的 GitHub 搜索 URL —— 后者 scheme 是 `https`，走 `IGNORED_SCHEMES`（`:31-40`）不计入假阳性 ⇒ **真实假阳性 2 处**，与门禁读数相等（3 − 1 = 2）。对照面：`LOCAL_DOC_GLOBS` 的根面文件（`AGENTS.md` / `CLAUDE.md` / `README.md` / `ARCHITECTURE.md` / `LAYER-INDEX.md`）同形状 **0 处** ⇒ 只要 `--files` 按声明面过滤，这一红不会出现。**CI 走默认面有接线为证**：`.github/workflows/gac-gate.yml:215` 跑的是 `python3 bin/gac/gac-local-gate.py --strict`，而 `scoped_doc_link_command()` 的 `strict=True` 分支返回不带 `--files` 的默认命令；实测同一份内容在 CI 全绿（PR #5481 的 `gac-gate` / `governance-verify` / `interface-check` 全 pass），本地却红 —— 分歧点就是这一支。


    **影响** —— ① 任何触碰 `docs/**` 的交付都会在本地为**别人的历史文本**报红，本地红 / CI 绿 的分歧要靠人现场分诊才能排除（本仓同族既有坑：「生成物 CI 口径 ≠ 本地」）；② 更坏的一面是它**掩盖真信号**：同一个大于声明的面里，一条只出现在历史档案中的**真**死链与语法性假阳性同形，读数不区分真假，于是「先把真的当噪声排掉」的诱惑被固化进流程；③ 每次咬人都要多轮分诊才能排除：本轮从门禁 FAIL 走到上面的读数，依次做了「抽 FAIL 行 → 打明细 → 与 canonical 对照 → 数 staged diff hunk → 读尺子源码 → 查接线 → 查 CI 口径 → 枚举覆盖面」，没有一步是交付本身。


    **与既有债的关系（不同面，不合并）** —— `DOCLINK-GITIGNORED-PERMA-RED`（`lifecycle_state: resolved`，2026-11-15 裁决「不改判据」）管的是「不完整检出上 `.omo/state/system.yaml` 链接报 14 条」，物化输入即清零；该条末尾自陈的第三个残留缺口是「本地 `make gac-local-gate-strict` 的 docstring 声称与 CI 的 gac-gate 对等，但没有 CI 那道物化前置」，属**strict 入口的前置缺失**，也与本条的「非 strict 分支的 `--files` 面大于声明面」不是同一件事。三条各自独立，本条不代裁前两条。''.'
- at: '2026-11-24T04:05:30Z'
  action: review
  actor: governance-agent
  note: |-
    **正日复测 (11-24 03:59Z)：假阳性原样复现，两侧口径都拿到新读数；并纠正一次「worktree 缺运行态工件」造成的假面。**
    ① 尺子自陈面：`bin/ssot/doc-link-check.py:20-28` 的 `LOCAL_DOC_GLOBS` = **9 条模式**
       （AGENTS.md / CLAUDE.md / README.md / ARCHITECTURE.md / LAYER-INDEX.md / projects/AGENTS.md /
       projects/*/AGENTS.md / projects/*/CLAUDE.md / projects/*/README.md），默认面实测扫 **36** 个文件，
       canonical 上 `python3 bin/ssot/doc-link-check.py` ⇒ **rc=0 PASS (36 files)**。
    ② 非 strict 侧仍是「全部 staged .md」：`bin/gac/gac-local-gate.py:993-1001` 的 `scoped_doc_link_command`
       在 `strict` 为假时取 `staged_files_git()` 里所有 `.md` 直接接 `--files`，与 ① 的 9 模式面**无交集约束**
       ⇒ 任何不在这 36 个文件内的 .md 一旦被 stage 就进入该尺。前提未变。
    ③ 2 条假阳性原样复现（canonical 与 worktree 同读数）：`docs/pitfalls.md:367` 的
       ``bin/[A-Za-z0-9_./-]+\.py`` 与 `:370` 的 ``bin/...\.py`` 被当链接解析，报
       `broken link … -> docs/bin/…`；`--files docs/pitfalls.md` ⇒ **rc=1 FAIL (2 broken links)**。
       对照组 `--files AGENTS.md` ⇒ **rc=0 PASS (1 files)**。⇒ 仍是「扫描面大于自陈范围」。
    ④ 仪器条件单独记一条，防下一个复核者误报：同一条命令在 claim 出的新 worktree 里跑**默认面**得
       **rc=1 / 15 broken links**，全部指向 `../../.omo/state/system.yaml`
       （`projects/omo/AGENTS.md:62`、`projects/runtime/AGENTS.md:62` 等）—— 该文件是运行态工件、不在 git，
       只在 canonical 存在（实测 1.9k、mtime 11-24 11:50），在 canonical 复跑即 rc=0。
       ⇒ 报「默认面 N 条坏链」之前必须声明扫的是哪棵树（同「陈旧检出会伪造结论」「快速 claim 的运行态工件缺失」）。
    ⑤ 排期补记：本条此前同为 `unscheduled`（`next_review_at` 空，成因见 OMO-DEBT-REGISTER-NO-REVIEW-DATES），本轮补 `next_review_at=2026-12-08` 后退出 `unscheduled` 桶（4 → 0），但**不等于进面板** —— 内核 `REVIEW_WINDOW_DAYS = 7`，12-08 是 14 天后，既不进 `due_now` 也不进 `upcoming`，四条在 queue 的任何列表里都不出现（`build_review_queue` 实测 11-24 04:10Z：修复前 due_now 1 / upcoming 2 / unscheduled 4，修复后 unscheduled 0 而另两桶不变）。准确状态是「已排期、未进 7 天窗口」。
    ⑥ 修法 (a) 过滤 `--files` / (b) `LINK_RE` 跳过 code span / (c) 维持现状，本轮零改动；
       取 (b) 需先补的「默认面 5 个根文件里反引号路径计数」读数本轮**未做**，不代为判定。
