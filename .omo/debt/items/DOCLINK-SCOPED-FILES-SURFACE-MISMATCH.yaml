decision_needed: "**需要裁决：修哪一侧都改变门禁判据宽度，agent 侧只登记不代裁。**\n- (a) 让非 strict 分支的 `--files` 按 `LOCAL_DOC_GLOBS` 过滤（`bin/gac/gac-local-gate.py:983-986`）—— 与实际尺子的自陈意图同源，本轮那 2 条假阳性立刻消失；代价是 `docs/**` 里的真死链从此既不进 CI（CI 走默认面）也不进本地，1111 个文件完全脱离该尺。\n- (b) 让 `LINK_RE` 跳过 inline code span（反引号内不解析链接，这是 CommonMark 语义：code span 内容不参与链接解析）—— 不改文件面，只排除语法性假阳性；代价是「写在反引号里的真死链」一并失去被 `--files` 面捕获的机会，而本仓大量路径正是以反引号书写的，若取 (b) 须先补一个读数：默认面 5 个根文件里有多少 `[x](path)` 形态出现在反引号内（本条未量，不据此下结论）。\n- (c) 不动装置，改 `docs/pitfalls.md:367/370` 两条证据的引号形式（把正则字面量拆成不构成 `[..](..)` 相邻的写法）—— 零判据变更、覆盖面不变；代价是把装置缺陷留在原地，下一个在历史档案里写正则的人还会踩，且这是「改证据去迁就尺子」。\n倾向 (a)：改动最小且与 `doc-link-check.py` docstring 的意图一致；但「`docs/**` 到底归不归某把尺管」是面的定义问题，应与 (a) 一起在同一次裁决里写清楚，别留下第三个静默缺口。"
