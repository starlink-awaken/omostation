id: "DEPENDENCY-BASELINE-57-DRIFT-INVISIBLE"
title: "dependency-baseline 有 57 项 drift（MISSING 1 / STALE 52 / MISMATCHED 4），而生成器因根深度缺陷恒报「0 deps 全部对齐」"
