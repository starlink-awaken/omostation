id: "DEPENDENCY-BASELINE-57-DRIFT-INVISIBLE"
title: "dependency-baseline 有 32 项 drift（CI 读数：MISSING 19 / STALE 1 / MISMATCHED 12），而生成器因根深度缺陷恒报「0 deps 全部对齐」"
