id: "DEBT-20260927-RUN-REGISTRY-RACE"
title: "全局 runs 注册表跨会话写竞态 — run 文件可被并发会话覆写（bet_id/objective 丢失）"
dimension: "governance"
subdimension: "tooling"
domain: "meta"
scope: "workspace"
severity: "medium"
weight: 0.1
entropy_class: "coordination"
lifecycle_state: "resolved"
owner: "governance-team"
closed_at: "2026-11-05T00:00:00Z"
close_reason: >-
  已修（PR #5059，merge commit 10cc9b85f）。根因与债务描述方向相反：不是并发会话
  覆写 pruner 的结果，而是 pruner 裸写覆写并发会话的结果。
resolution_evidence: >-
  2026-11-05 复核：bin/ssot/auto-pruner.py（每日定时跑，.omo/cron/registry.yaml
  SH-1）对 run 文件做 read-modify-write 但不持 run_update_lock；而
  .omo/_delivery/agent-workflows/ 是全机共享面，并发会话的 start/claim/close
  都在写同一批文件 —— pruner 用旧内容重写，把并发会话刚写的字段整份覆盖。
  排查确认 lifecycle.py 内 4 个写点里 3 个已在锁内（claim_run:1390 /
  close_run:1510 / agent-workflow.py:829），只有 start_run:1202 无锁（它新建
  run，无并发更新对象）—— 真正的漏洞是 lifecycle 之外的 auto-pruner。
  修法：新增 _run_update_lock(run_id)（拿不到 omo 时返回 None，退化为无锁），
  prune_runs 改成「廉价预检（无锁）→ 取锁 → 锁内重读 → 判 age/lock → 写」。
  验证：test-auto-pruner.py 7/7（新增 2 条）；变异对照（把取锁换成 if True）
  ⇒ 第一条当场失败（6/7）。writeplane §1 的 .omo/_truth 桶因新增站点 162->163，
  已按 ISC-1 同源重签（spec 第五次复核 + SPEC_MARKER_READINGS）。
affected_roots:
  - ".omo/_delivery/agent-workflows/runs/"
evidence_refs:
- "2026-09-27 BET-Y2Q4-T3-03 实证: run 20260927T230315Z-project-code-change-b4efea8b
    （本会话 start, objective=KOS 摄入）随后被并发会话的 BOS 清理 objective 覆写
    （同 run 文件, bet_id 字段消失）→ complete 报 missing_bet_binding。
    .omo/_delivery/agent-workflows 已被符号链接化为全局共享目录（多会话写同一路径）。"
- "当时的缓解: complete --force 逃生（实质检查人工确认: spec binding/D0/retro 均在案）。"
mitigation_refs: []
decision_needed: >
  run 文件写入需要会话隔离或原子性: (a) run 文件按会话分目录; (b) 写入加文件锁;
  (c) start 后 run 文件只允许属主会话追加。当前 last-writer-wins 使 run 身份可被
  并发覆写, complete 的链检查是唯一护栏。
