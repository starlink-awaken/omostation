id: OMO-DEBT-CHAIN-BIND-PORTFOLIO-SUBCMD-NOT-DISPATCHED
title: chain-bind-check portfolio 子命令有实现却不在 main 派发字典：CLI rc=1 KeyError，W0 派生谓词仓内不可达
dimension: governance
subdimension: gate
domain: workspace
scope: governance_kernel
severity: high
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-agent
affected_roots:
- bin/plan/chain-bind-check.py
- bin/plan/chain_bind.py
- tests/test_chain_bind.py
- docs/plans/3y-bet-ledger.yaml
evidence_refs:
- bin/plan/chain-bind-check.py:305-315 注册 portfolio 子命令（8 个旗标 + :315 `set_defaults(func=cmd_portfolio)`），但
  :318-324 的 `main()` 不走 args.func，而是硬编派发字典 {start, closeout, complete, self-check,
  perception} ⇒ 缺 portfolio
- '真实 CLI: `python3 bin/plan/chain-bind-check.py portfolio --milestone-id MS-W0-CONTRACT`
  rc=1，stderr 末行 `KeyError: ''portfolio''`（traceback 出自 :322 的 `{...}[args.cmd]`，被
  :332 `raise SystemExit(main())` 原样抛出）；同一 CLI 的 `self-check` rc=0 打 `13 fixture cases`
  ⇒ 仪器能跑，只缺这条接线'
- '实现可用: importlib 直接调 cmd_portfolio(milestone_id=''MS-W0-CONTRACT'') → rc=0 `{"code":
  "MILESTONE_MET", "ok": true, "reasons": []}`；MIGRATION/PRODUCT/CANARY 同判 MILESTONE_MET
  ⇒ 缺陷是接线缺席而非死代码（与 gac-worktree.sh guard-submodules 被 release-diagnose 顶掉同形状）'
- '消费者为零: tests/test_chain_bind.py:137/144/156/174/191/208 用真实 CLI 跑其它子命令，从不跑 portfolio；rg
  ''cmd_portfolio'' 覆盖 tests/.github/bin/gac = 0 命中；.omo/_truth/registry/{governance-checks,ci-surfaces}.yaml
  无 chain-bind-check 接线（命中的是另一个脚本 bin/plan/chain-bind-audit.py）；全库无文档写 `chain-bind-check.py
  portfolio`'
- '影响面: docs/plans/3y-bet-ledger.yaml 有 5 项 `status: derived`（4 个 MS-W0-* 在 :48509-48513
  一侧，CMP-W0-PORTFOLIO-TRUST 与另 2 个 milestone 在 :48661-48688 一侧），其判定唯一实现就是这个跑不通的子命令
  ⇒ W0 门禁结论在 CI/运维视角恒为不可得，只能靠临时 import 得（本轮即如此）'
- '派生面的第二个缺口: cmd_portfolio 只读 ledger[''milestones'']（:101-102），campaign id 永远查不到
  —— `CMP-W0-PORTFOLIO-TRUST` → rc=1 `chain-bind-check: unknown milestone CMP-W0-PORTFOLIO-TRUST`；仓内不存在
  campaign 谓词'
- 'vision 侧诚实边界: `--vision` 在 --objectives-json/--window-json 均缺省时返回 rc=1 `VISION_WINDOW_INCOMPLETE:
  weeks=0 need>=12` + `missing human final verdict`；weeks=0 是「谓词不自取数据」的输入产物，不能被读作工作区实况，human
  final verdict 属 principal 保留'
- '取证装置坑: `python3 ... portfolio ... 2>&1 | tail -3; echo cli_rc=$?` 打出 rc=0，是 zsh
  管道取到 tail 的退出码（PIPESTATUS 陷阱，AGENTS §7 已登记过同形）；本轮改用 subprocess 取到真实 rc=1'
mitigation_refs: []
