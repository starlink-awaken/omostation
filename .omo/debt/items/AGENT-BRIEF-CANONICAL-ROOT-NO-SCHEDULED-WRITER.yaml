decision_needed: 三选一（都要用户裁决，代理不代做机器级变更）：(1) 在 mbp 给仓根 runtime/dashboard/agent-brief.json
  装一个排班写方（= 新增 launchd 条目 + 改 services.yaml 登记，属机器服务变更）；(2) 改读契约 —— AGENTS.md §1.8
  把 brief 路径显式声明按 state_root 解析（属治理文档契约变更，影响所有 agent 的选活入口）；(3) 让 scheduler-compile
  --check 比较 plist 内容而不只比 label（会让已存在的 plist 分叉立刻变红，须与双机分工裁决同时定）。另一条待决：注册表自述 mbp 只装了
  5 条、38 条登记面巡检从未在本机跑过 —— 全量装机会在这台机器上拉起 resident 执行器（决策面在 mini），装机范围属双机分工问题，不是同步问题。
