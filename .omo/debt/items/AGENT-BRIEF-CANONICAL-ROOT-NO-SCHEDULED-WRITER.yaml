description: >-
  **实测补充 (2026-11-23T21:35Z 订正版, 基线 origin/main `77bcf1838`)。**
  三份 agent-brief 的时效与判定实测（`os.stat` mtime / `generated_at` / `health` 字段）：


  | 面 | mtime (UTC) | age | `gates_total/pass` | `gates_failing` | 结论 |

  |---|---|---|---|---|---|

  | 仓根 `runtime/dashboard/agent-brief.json` | 2026-11-23T07:51:49Z | 13.7 h | 11 / 4 | `[RF0]` |
  无排班写方，今天被一次性写入过 |

  | profile 状态根 `~/.local/state/omostation/prod/…` | 2026-11-23T21:16:40Z | 17.5 min | 11 / 9 | `[A3, RF0]` |
  AGENTS.md §1.8 指定的入口，30 min 写方在跑 |

  | 安装根 `~/.local/opt/omostation/…` | 2026-11-23T21:31:35Z | 2.6 min | 11 / 5 | `[A2, A4, A5, A6, A7, A9]` |
  5 min 写方，`provenance` 为 `null` |


  **前一版表格（本条 04:30:44Z 的 `update_description`）写仓根「mtime 2026-11-09 19:36 / 陈旧 14 天」**：
  该读数在其写入时点为真，07:51:49Z 之后失效，故按上表订正；不改动历史条目。


  **本条核心命题仍成立且被加强**：95 条 `~/Library/LaunchAgents/*.plist` 全量扫描中引用仓根的有 6 条，
  但**没有任何一条以 `runtime/dashboard` 为写目标**；`materialize-agent-brief.py` 的默认目标按 `state_root()`
  解析（`:84`），写仓根需显式 `--target`（`:195-209`）⇒ 仓根那份是**一次性人工/agent 物化**，无排班 ⇒ 仍会再次冻结。
  今天那次写入的**发起方未定位**（81 个 cron 日志在该时段零命中，仓根路径又被 `.gitignore:414` 忽略而无 git 痕）。


  **新增事实（比时效更要紧）**：三根的门禁判定互不相同（4/9/5 通过，红门集合无包含关系）。
  修「读哪一根」只解决取数位置，不解决「那份数由哪份代码算出」——后者见
  `DEBT-DASHBOARD-STALE-CHECKOUT-FALSE-GREEN` 的发布链代码副本落后（1,070 / 291 commit）实测。


  **裁决仍属用户**（三选一：装排班写方 / 改读契约 / 降级 plist 为按需）。代理本轮只补实测与订正时效，
  未新增机器服务、未改读契约、未动任何门禁判定逻辑。
