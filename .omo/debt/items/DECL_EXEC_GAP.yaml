# 2026-09-19 进展 (本条保持 identified —— 张力未消除, 但信号已可行动):
# 原 maturity-align 只报裸 'score spread = 50', 读者需自行推断语义。现把该差距
# 显式命名为 `declaration_execution_gap` 并给出解释: 三个来源答的是不同问题
# (compass_radar=系统当前状态 / maturity_scorecard=能力成熟度 / bet_ledger=计划完成度),
# 工具前提是『计划是通往成熟的路径』, 故 ledger 显著高于系统状态时其含义是
# 『计划做完了却没转化为系统状态』而不是『某系统算错了』。差距>=30 时新增一条
# 可读告警, 明示这是『闭环未产生价值』的信号并指向本条。

# 2026-09-19 修正 (第二段): 消除度量自指 + 反向激励 ——
# 实测发现 alignment (健康分权重 0.1 的维度) = maturity-align 的 reconciliation_score =
# 100 - spread{compass, scorecard, ledger}。当计划全闭 (ledger=100) 时 spread 由
# (100 - compass) 决定, 于是 reconciliation **恒等于 compass_health** —— 健康分部分
# 由自己算出; 且 compass 固定 70 时 ledger 50->100 (把计划做完) 会让 alignment 从 80
# 掉到 70 —— **完成计划反而压低健康分**。
# 修正: reconciliation 只比**同口径** (compass_health vs maturity_scorecard, 两者都答
# 『我们现在多成熟』); 跨口径的 bet_ledger 完成度单列为 declaration_execution_gap,
# **报告但不加权进健康分**。信号未丢: 实测同一数据 reconciliation 50->84 的同时,
# declaration_execution_gap 仍为 50 且告警照常触发。

