id: OMO-DEBT-WORKTREE-MERGE-RELEASE-FORCE-DELETE-UNPUSHED-BRANCH
title: merge 成功路径释放 worktree 后用 git branch -D 强删分支：主仓侧未推送提交无任何 gate，本轮仅因 cwd 已失效才侥幸幸存
dimension: governance
subdimension: coordination
domain: workspace
scope: governance_kernel
severity: high
weight: 0.05
entropy_class: classification
lifecycle_state: closed
owner: governance-agent
affected_roots:
- bin/gac/gac-worktree.sh
- tests/test_gac_worktree_merge_cleanup.sh
- AGENTS.md
- .omo/debt/items
evidence_refs:
- bin/gac/gac-worktree.sh:670 `git worktree remove --force "$wt"` 成功后 :676 立即 `git
  branch -D "$branch" 2>&1 | tail -1 || true` —— 用 -D 强删；同族 PASW 子模块侧清理在 :292 用的是安全的
  `branch -d`
- '释放/合并前置只判未提交项: :185 `dirty="${dirty}root has changes; "`（主仓侧唯一条件），未推送提交的 gate 仅覆盖子模块
  :208-214 `--check-submodules` → `submodule commits on no remote branch`; merge 的
  dirty 拦截 :1221-1226 同样只看未提交项（:1223 `git diff --quiet || git diff --cached --quiet`），而
  :1221 注释本身写着「worktree 必须已 submit (push + 开 PR)」，:1222 又先 `cd "$wt"` 把脚本 cwd 落在即将被移除的
  worktree 内 ⇒ 「已提交但未推送」的主仓交付在 merge 成功路径上无拦住条件'
- '实测 2026-11-25 (BET-Y2Q4-T10-351 交付腿, session t10351): 分支 agent/governance-agent/t10351
  上 f948f5b83 已随 PR #5547 squash 为 main 的 e97f47955，a7d1b593b (批次21 债登记) 未推送; `gac-worktree.sh
  merge t10351` 合并成功后连打 `✅ worktree 释放: /Users/xiamingxing/ws-t10351` 紧跟 `fatal: Unable
  to read current working directory: No such file or directory`（位置正是 :676 的 git branch
  -D：脚本 cwd 随 worktree 一起消失），随后仍打 `✅ claim 已清: t10351`'
- '幸存读数: ls /Users/xiamingxing/ws-t10351 → No such file or directory；`git branch --list
  ''*t10351*''` 仍列出该分支；`git cat-file -t a7d1b593b` = commit ⇒ 未推送提交只因 -D 没跑成而侥幸留存，且该失败被
  `|| true` 吞掉。反向语义不实测（-D 按 git 定义无视未合并状态直接删，从主工作区调用即静默丢工，不销毁在制工作去验证）'
- tests/test_gac_worktree_merge_cleanup.sh 只在 :23 引用 SCRIPT 路径，对分支删除语义零断言（rg 'branch
  -[dD]|unpushed|Deleted branch' 在该文件 0 命中）
mitigation_refs: []
