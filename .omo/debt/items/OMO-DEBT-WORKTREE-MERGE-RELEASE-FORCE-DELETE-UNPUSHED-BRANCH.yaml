close_reason: 已修复合入：分支清理收口为单点 prune_local_branch，有未推送 commit 即保留
resolution_evidence: 'PR #5566 (merge edc0ef4c17ac30c639bb5fc2a7f3ede6e067b4aa): bin/gac/gac-worktree.sh
  新增 prune_local_branch()，merge 收尾与 release 两处共用（旧写法 `git log --oneline --not origin/main
  <branch>` 把两个 rev 都标 uninteresting ⇒ 恒空判据，且 release 路径的守卫因 CLI 派发被替换掉而空转 7 周）。判据改为
  `git rev-list --count <branch> --not --remotes`，非 0 即保留分支。回归 tests/test_gac_worktree_merge_cleanup.sh
  新增 E 段（分支带未推送 commit ⇒ 保留 + 打出保留原因 + claim 仍清）与 C 段两处接线契约；夹具用裸 origin，GAC_WORKTREE_LIB_ONLY=1
  走真实入口。实测 22 ✅ / 0 ❌；负控制：去掉守卫改回裸 -D ⇒ E 段 FAILED 并打出 `Deleted branch ...`。'
