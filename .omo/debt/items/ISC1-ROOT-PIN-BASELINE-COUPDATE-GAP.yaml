decision_needed: |
  三项待裁，本轮零改动（不动 workflow、不动基线数字、不加门禁判据）：
  (1) 要不要把 `tests/**` 加进 `.github/workflows/governance-check.yml` 的 push/pull_request `paths`？
      成本是 tests-only PR 也要跑整套 governance check（本轮实测 interface-check 单 job ≈4-6 分钟），
      收益是「bump 基线的 PR 也能被 CI 证明对错」。CI 接线面变更需 principal 授权，故不代做。
  (2) 要不要加一条联动门禁：diff 命中 `bin/**/*.py` 的 root-pin 字面链（按 `scan_checkout_pinned_sites`
      同款 AST 判据）而未同批改 `tests/unit/test_writeplane_root_pin.py` ⇒ 拦。
      难点是判据必须能识别「无需 bump」的情形（改链但未跨桶、或等量替换），否则按今晚形状会误拦大量正常 PR
      —— 这条与「审批清单与落盘字符串出自两个函数」「测试逐字断言生产端 command 字符串」同族。
  (3) 还是维持现状，把「改被扫面 ⇒ 同批 bump 基线」写成纪律条目（docs/pitfalls.md 正文由 owner 写，
      本条不代写），并在 AGENTS.md 的 GaC pointer 处留一句指针。
  另：今晚那记 bump 夹带在 #5507（债务主题）里落地，说明这类补账当前**没有归属要求**；
  若采 (1)/(2)，顺带决定「基线补账该挂在什么要求下」，否则仍会被夹带。
