decision_needed: |
  三项待裁，本轮只登记 + 给既有 4 条补到期日（到期日属复核产物的排期字段，状态字段一律未动）：
  (1) 让 `register` 直接落 `next_review_at`，取值与 `bin/gac/debt-review-scheduler.py:29 INTERVAL_DAYS[severity]`
      同源（medium=60）⇒ 两条道自动同口径。代价：改 broker 写面，影响此后所有新条目的默认值；且 60 天本身落在 7 天窗口之外（见 description 末段实测），同口径 ≠ 同可见；
      且 60 天这个宽度本身是 cron 道自定的，采它等于把 cron 口径升为权威 —— 需要 principal 认这一步。
  (2) 或让 `omo_debt_review_queue` 对空 `next_review_at` 走与 scheduler 相同的回退（`:81-83` 不再 continue）。
      这是**改判定口径**（两 lane 合一），同样需 principal 明确哪套是权威；agent 不代为统一。合一后面板上会从「unscheduled 显式」变成「窗口外静默」，可见性未必变好。
