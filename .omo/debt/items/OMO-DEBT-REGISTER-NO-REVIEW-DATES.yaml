      `lifecycle_state` 一并写成 `scheduled`（该词汇不在现网取值集内，正是 OMO-WRITEOWNER ⑥ 记的形状），
      等于「用状态字段换排期字段」，在当前状态下不可接受，除非与 (1) 或修 schedule 同批做。
  另附一条口径说明：本轮为那 4 条补的是 `2026-12-08`（复核后 14 天，与本会话其他批次一致），
  **比** cron 道回退的 `opened_at + 60d` 更紧。若采 (1)，这 4 条会被重算成 60 天口径，届时以裁决为准，
  本轮读数不作为基线锁死。
  本轮不动 broker、不动 review_queue、不动 scheduler、不改任何条目的 lifecycle_state/gate_level/severity/weight。
