  补一条今晚实测的口径细节（本会话先把自己 (1) 的修法假设证伪了一次）：
  给条目补上 `next_review_at` **不等于**让它进面板。内核 `omo_debt_review_queue.py` 的
  `REVIEW_WINDOW_DAYS = 7` / `ESCALATION_THRESHOLD_DAYS = 3`，`build_review_queue` 只输出
  `due_now`（已到期）/ `upcoming`（7 天内到期）/ `escalation_candidates` / `unscheduled` 四个列表。
