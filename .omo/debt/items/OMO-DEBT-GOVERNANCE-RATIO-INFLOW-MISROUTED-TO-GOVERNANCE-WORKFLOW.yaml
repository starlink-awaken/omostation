id: OMO-DEBT-GOVERNANCE-RATIO-INFLOW-MISROUTED-TO-GOVERNANCE-WORKFLOW
title: 代码面交付可走 governance-state-mutation 入口，ADR-0249 治理占比因此测的是入口选择而非治理工作量
dimension: governance
subdimension: tooling
domain: workspace
scope: governance_kernel
severity: high
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-team
affected_roots:
- bin/gac/check-governance-ratio.py
- .omo/_delivery/agent-workflows/events.jsonl
- .omo/_truth/registry/agent-workflows/workflows/governance-state-mutation.yaml
evidence_refs:
- 实测 2026-11-25 canonical `python3 bin/gac/check-governance-ratio.py` 原文：`window=30d
  total=150 governance=67 collab=0 flex=83 ratio=44.7% ratio 44.7% > ceiling 40%`
  rc=1（blocking）
- 命中规则单一：对 30d 窗口 150 条 `agent_workflow_start` 逐条跑 `_classify`，67 条 governance **100%
  由 `check-governance-ratio.py:133` 的 `agent_profile ∈ GOVERNANCE_PROFILES` 命中**，workflow_id
  全为 `governance-state-mutation`
- 按 claim 落点复算（同窗口 `agent_workflow_claim.paths`）：67 条里 16 条（占 gov 24%）落在 `bin/**`/`tests/**`/`projects/**`
  代码面，47 条落 `.omo` 治理写面，15 条含 docs —— 四分之一「治理开销」实为工具修复交付
- 与判定面自述口径冲突：`check-governance-ratio.py:68-70` 写明「bin/gac/ bin/ssot/ 是 tool-fix PR
  落点, 不算 governance」，`:88-95` 写明 ratio 度量「governance *effort*, not the actor's title」；但
  `FLEX_OVERRIDE_WORKFLOWS`(`:99`) 只按 workflow_id 白名单放行，`_classify` 里 profile 规则(`:133`)
  先于 locks 规则(`:137`) 短路，代码面交付无从降级
- 杠杆上限（不改判定面）：若这 16 条按交付类型改走 `project-code-change`/`project-doc-change`（需 `--bet`），gov
  67→51，ratio 44.7%→34.0%，同时低于 40% ceiling 与 35% WARN_THRESHOLD
- '现状后果：本会话 #5575 / #5577 两次交付的 `gac-local-gate` 都因这一项 FAIL 只能以 `--status blocked`
  收尾（waiver 需 `GITHUB_PR_NUMBER` + `.omo/_truth/governance-evidence/waiver-*.md`，属
  principal 权限），诚实收尾的固定成本随交付次数线性上升'
