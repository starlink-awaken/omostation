- at: '2026-11-24T11:22:20.686232+00:00'
  action: update_description
  note: "Updated description from '' to '【批次 18 · A/2】broker 写动词接受空/纯空白证据文本，rc=0 且无告警\n\
    \n§1 缺陷事实（沙箱实测，取证方式见 §5）\n`omo-debt desc` 对 `--description` 的三种空值全部返回 rc=0 并落库：\n\
    \  - `\"\"` → description 长度 0\n  - `\" \"`（单个空格）→ 长度 1\n  - `\"\\n\\n\"` → 长度\
    \ 2\n每一次都是「覆盖」：写前该字段有 5,850 B 真实内容，写后变成 0/1/2 字符，而 CLI 只打印条目 id，不打印任何 WARN，不返回非零码。\n\
    `register --title \"\"` 同样 rc=0 铸出条目文件：`title: ''`、22 键齐全、`lifecycle_state: identified`——空标题条目可以直接进台账与投影。\n\
    \n§2 一手事故（非沙箱，真实台账）\n2026-11-24 本机会话登记批次 17 条目时用 `--description \"$(cat /tmp/b17desc.txt)\"\
    ` 传正文。macOS 27 无 `/usr/bin/cat`，命令替换静默返回空串，broker 接受并把已写入的 6,353 字符 description\
    \ 覆盖成 0 长度，rc=0。靠写后立即读回才发现，再用 argv 列表方式重写到 6,614 字符并逐字节校验。该事故已写进该条目 history（measurement_provenance\
    \ 条目）。\n结论：这不是理论风险，是本批工具链真实踩到的载荷丢失路径；任何用 shell 命令替换传正文的 agent 编排都在同一条路径上。\n\n\
    §3 代码位置（origin/main 305afff3e）\n- `projects/omo/src/omo/omo_debt_cli.py:115-142`（desc\
    \ 写路径）：`payload[\"description\"] = description` 直接赋值，无 `strip()`、无非空判定、无长度下限。\n\
    - `omo_debt_cli.py:291` 的 `--description required=True` 只保证「参数出现」，不保证「值非空」——这是\
    \ argparse 语义，不是校验。\n- `omo_debt_cli.py:178-183` / `:449` register 的 `--title\
    \ required=True` 同理，空标题条目可铸出。\n- 无截断/上限护栏：`rg 'MAX_|truncate' projects/omo/src/omo/omo_debt*.py`\
    \ 零命中。\n- 无用例钉住非空：`projects/omo/tests` 下对 desc 空值行为的命中为零。\n\n§4 同包内已有正确先例（对照事实，不构成建议）\n\
    `projects/omo/src/omo/outcome_feedback.py:115-150` 对同类字段用 `_required_text(...)`（空即抛\
    \ `OutcomeFeedbackError`）与 `len(result_ref) > 500` 显式抛错，并对 note 只存 `note_digest`\
    \ 而非全文。即「写前校验非空 + 有界」在本包内已是既有约定；broker 的 desc/register 是这条约定上的缺口，不是全仓统一风格。\n\n\
    §5 取证方式与边界\n- 空值测试全部在临时沙箱（`/tmp/b18probe`，broker 指向 ledger 拷贝）执行，真实台账写前写后均 5,850\
    \ B，未被触碰。\n- 只测了 `desc` 与 `register` 两个动词；`schedule`/`reclassify`/`escalate`/`close`/`reopen`\
    \ 等其它写动词的空值行为未测，不做「全部写动词都接受空值」的全称声称。\n- 未测超长文本写入行为，只确证代码里没有长度上限。\n\n§6 后果链\ndescription\
    \ 是债务条目里唯一承载判据原文的字段：复审判据、待裁选项、实测数字都在正文里。审计面（`bin/ssot/_shared.py:171-198 check_evidence`）只看路径与\
    \ `resolution_evidence`，不读 description，所以空正文不会在任何门禁上发红——它只静默降低台账的可审性；rc=0 又让调用方不会重试或告警。\n\
    \n§7 待裁（属 CLI 契约变更，对所有 agent 的既有编排可见，不由 agent 选定）\n1. 加非空守卫：desc/register 的值 `strip()`\
    \ 后为空即 rc≠0 并说明被拒原因（与 `outcome_feedback._required_text` 同口径）。\n2. 默认拒绝 + 显式放开：清空需要\
    \ `--allow-empty` / `--clear` 一类显式旗标，保留程序化清空能力。\n3. 不拦但留痕：允许写入，但 rc=0 时打 WARN，并把「旧长度→新长度」写进\
    \ history，使下游可读、不破坏既有脚本行为。\n三条都改变当前 CLI 对空值的可见行为；选哪条（或都不选）由 principal 定。\n'."
