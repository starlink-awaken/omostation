description: >-
  三层事实 (2026-11-26 立案, 全部实测):
  (1) 结构病 (主): capability-registry-sync-daily cron (.omo/cron/registry.yaml:518)
  的命令链是 `cd "$HOME/Workspace" && 生成器 && git add && git commit` —— 设计即
  主仓 main 直提, 违反 AGENTS.md §0 worktree 政策。push 与远端并发推进冲突时
  non-ff 失败, 提交滞留本地 → main 分叉。2026-11-26 04:05 实测: 滞留 1 提交 +
  分叉 31 提交, 靠人工 (tag 存档 + soft reset) 恢复。不修则每个 cron 周期
  (每日 04:05) 都可能复发。
  (2) 次生病: cron 产物重置人工维护的 frontmatter 标记 (last-reviewed
  2026-11-03 → 2026-09-24), 人工审阅信息在「生成物 + sentinel」设计下不可持久。
  (3) 定性订正 (防误导): docs/INDEX-MCP.md 11-03 人工注释自称「生成器时间戳
  epoch-0 bug 手工修正」—— 实为对 ADR-0373 的误解。生成器
  bin/ssot/gen-capability-registry.py:600-603 注释自证 `generated_at: 1970`
  是有意的 sentinel 设计 (防 CI drift check 对生成时间戳恒红), 非 bug。
  本立案时差点被该注释带偏定性, 源码上下文核对后订正。
decision_needed: >-
  结构病修法需 owner 裁定: (a) cron 命令链改为「生成后走 worktree + 自动 PR」
  (先例 83c23e1aa / #4858); (b) 最小治标 —— 命令链加 push, 失败则自动 reset
  放弃本轮 (保平但不合 worktree 政策); (c) 生成器产物改为「不 commit 留工作区
  由会话顺车」。次生病的 last-reviewed 持久化方案随修法定。误导注释在下次
  cron 生成时自然消失, 无需单独处理。
