close_reason: >-
  取 (b) 正名：`CR-L0-SSOT-PATH-NORM` 的 `lifecycle` 由 `active` 降为 `draft`。
  依据是来源 ADR-0121 §1.2 —— 它把本条与 `CR-META-CI-SKIP-MATRIX` 并列标为「待加」，
  而登记面是派生、ADR 是依据，冲突时以 ADR 为准。`draft` 是 `gac-validate` 的
  `LIFECYCLE_ENUM` 里「已声明未激活」的合法值（不是条目初版写的 `pending` ——
  那个值不在 enum 里，照抄会当场被 gac-validate 拦下）。
  未取 (a) 补实现：`ssot-path-norm` 的实现面并未定义清楚（比对哪些声明、
  哪些 broker 写入路径、判据从哪来），凭空写一个 lint rule 只会造出第二把
  与 ADR 措辞不完全对齐的尺；而 `omo-state-projection-guard.py` 只覆盖
  projection 注册表这一个面，不足以承载本条的完整语义。
resolution_evidence: >-
  改前 `gac-validate --gate`：`lifecycle 分布: {active: 87, removed: 3}`，
  `0 error, 0 warning`。改后：`{active: 86, draft: 1, removed: 3}`，
  `0 error, 1 warning` —— 唯一警告是「CR-L0-SSOT-PATH-NORM: draft 超 136 天
  (>7 天 draft_to_active), 待 radar 验证激活」，即这条规则真实的腐烂时长，
  是本条要显形的东西而不是新缺陷。`governance-convergence-lint --rule registration`
  与 `--rule rules-count` 均 rc=0。
