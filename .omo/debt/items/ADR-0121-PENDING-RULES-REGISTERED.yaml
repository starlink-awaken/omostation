description: >-
  `ADR-0121`（frontmatter `status: active`）§1.2 给出两条「P71 Phase 4 待加」规则：

  > - `CR-L0-SSOT-PATH-NORM`（executor: `… --rule ssot-path-norm`）
  > - `CR-META-CI-SKIP-MATRIX`（executor: `… --rule ci-skip-matrix`）

  而第 38 行更早处也写着「P0 recovery 新增的 4 条规则中，**2 条待加**
  （`CR-L0-SSOT-PATH-NORM`、`CR-META-CI-SKIP-MATRIX`）」。

  **实测与 ADR 相反**：
  - `CR-L0-SSOT-PATH-NORM` **已注册**，`lifecycle: active` —— 与「待加」矛盾；
    描述里那句「实现: `bin/gac/governance-convergence-lint.py --rule ssot-path-norm`」
    指向的 `--rule` 名**不存在**（合法名只有 `registration` / `score` / `loop` /
    `rules-count` / `matrix`）。
  - `CR-META-CI-SKIP-MATRIX` **没注册**（与「待加」一致，无需处理）。

  **放大**：#5358 之前，该脚本对未知 `--rule` **静默空跑**并报 `ok:true` ——
  也就是说这条规则的「实现」指路指向一次空跑，而空跑还报绿。#5358 已让未知
  `--rule` 报错（`UNKNOWN_RULE`, exit 1），这条假指路现在会**响**。

  **这条规则不是孤例**：同一轮的 `CR-AGE-*-01`（5 条）也是「`required` 但无执行面」
  —— 见 `CR-AGE-RULES-NO-BASIS-NO-EXECUTION`；本条的 `source_ref`
  （`.omo/standards/ssot-path-norm.md`）也不存在 —— 见
  `GAC-BOOTSTRAP-10-SOURCE-REFS-DEAD`。
decision_needed: >-
  **已裁决（2026-11-15）：取 (b) 正名，本条结案。**

  - (a) **补实现** —— **未取**：`ssot-path-norm` 的判据面并未定义清楚
    （比对哪些 SSOT 声明、哪些 broker 写入路径、冲突时什么算违规），
    凭空写一个 lint rule 只会造出第二把与 ADR 措辞不完全对齐的尺。
    仓里已有的 `bin/gac/omo-state-projection-guard.py` 只覆盖 projection
    注册表这一个面，承载不了本条的完整语义。
  - (b) **正名** —— **已做**：`lifecycle: active` → `draft`。
    注意 `draft` 是 `gac-validate` 的 `LIFECYCLE_ENUM` 合法值，
    而条目初版写的 `pending` **不是**（照抄会被 gac-validate 拦下）。
  - `source_ref` 仍指向不存在的 `.omo/standards/ssot-path-norm.md` ——
    那是 `GAC-BOOTSTRAP-10-SOURCE-REFS-DEAD` 的处置面，**不在本条范围**，
    本条不动它（避免两条债各改一半）。
history:
- at: "2026-11-15T06:10:00+00:00"
  action: identify
  note: >-
    **发现经过**：核 #5355 余下 6 条死 source_ref 里的最后一条（`.omo/standards/
    ssot-path-norm.md`）时, 顺着规则描述里的「实现: … --rule ssot-path-norm」
    查那个 `--rule` —— 它不存在; 再往上翻, 发现 **ADR-0121 自己第 38 行就写着
    这两条是「待加」**, 而登记面把其中一条当 `active` 注册了。
    **判据**：一条规则的「实现」指路与它的**来源 ADR** 冲突时, ADR 里那些
    「待加 / 计划中 / P71 Phase 4」字样的权重高于登记面的 `lifecycle: active`
    —— 登记面是派生, ADR 是依据。**纪律**：把 `lifecycle: active` 当「已实现」
    之前, 先查它的**来源 ADR 有没有把它标成待加**; 两者的时间差就是腐烂窗口。
  actor: "governance-agent"
- at: "2026-11-15T10:20:00+00:00"
  action: resolve
  note: >-
    **取 (b) 正名**。两条被否的出路各有具体理由：(a) 补实现被否是因为
    **判据面没定义**（哪些声明、哪些 broker 路径、什么算违规都没写），
    写出来就是第二把尺；(c) 类的前置物化与本条无关。
    **判据**：`decision_needed` 里给的枚举值必须先过一遍**在案 schema** ——
    初版写 `pending`，而 `gac-validate` 的 `LIFECYCLE_ENUM` 是
    `{draft, active, deprecated, superseded, removed}`，照抄会当场红。
    **纪律**：给「降态」类建议时，值要从**校验器**里取，不要从措辞直觉里取。
  actor: "governance-agent"
