    3/17 漂移已巡检，均不覆盖本条的「绿侧不可信」。


    【决策菜单（均需 principal 取舍，我不代为决定）】

    ① 给 --fix / --fix --apply 加内容前置：改指针前先算两侧文件集合差与规模，超阈值（如 N 个实例级文件消失）拒绝 --apply 只输出建议。

    ② 新增判据：把 root 声明面（governance-checks.yaml 的 id 集合）与生成物（agent-redlines.md 词集）对 pin
    可见实例做双向核对，缺侧报警。

