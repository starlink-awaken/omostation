    pin 上的实例集合做核对。


    【去重】OMO-DEBT-SUBMODULE-DRIFT-VERDICT-FLIPS-ON-EXTERNAL-PUSH（同批登记）对象是判决在外部推送下翻转的稳定性，本条对象是判据缺内容核对因而可被移动指针自证绿；已
