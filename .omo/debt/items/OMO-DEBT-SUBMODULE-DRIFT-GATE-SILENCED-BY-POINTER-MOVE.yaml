    取到，git ls-remote --heads 命中 1）。

    - 引用侧（子串口径，按 origin/main 内容而非本地工作树读）：governance-checks.yaml 含其中 21 个 id 串；docs/generated/agent-redlines.md（生成物）含其中
    43 个；.omo/_truth/registry/redlines.yaml 含 0 个。

    - 同时必须记录反向事实，避免把本条读成「丢了代码」：root 声明的规则面未破——按 ^\s*-?\s*id:\s*(CR-...) 解析 origin/main
    的 governance-checks.yaml 得 90 个 id，这 90 个在当前 pin 上 0 个缺实例。即 68 个消失实例是超出 root 声明面的超集部分，其权威归属需
    owner 判定，而不是任何已声明规则的缺失。


    【生成物侧的次级观测（不作为结论，只登记疑点）】bin/mof/gen-agent-redlines.py:18 REGISTRY=.omo/_truth/registry/governance-checks.yaml、:70
    redlines_path=.omo/_truth/registry/redlines.yaml 是脚本里出现的两个读取路径，但生成物 docs/generated/agent-redlines.md
    的 CR-* 去重词集为 138，其中 100 个词既不在 governance-checks.yaml 词集（124）也不在 redlines.yaml
    词集（0）⇒ 该生成物的真实读数来源无法由脚本内这两个常量解释。本条不断言其成因（生成器另有来源、历史累积、或另有写入方），仅登记「生成物宣称的规则 id
