    - 改前的 pin a895e90dafe0：137 个 GAC-RULE-* 实例文件；当前 ecos origin/main 2518e4b41：91
    个；交集 69，仅旧 pin 有 68，仅 main 有 22。

    - 那 68 个文件对 root main 是否可达：逐个 git -C projects/ecos cat-file -e origin/main:<path>
