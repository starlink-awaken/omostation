  note: 'Updated description from '''' to ''【单位口径】本条所有数字标注测量方式：文件数=git ls-tree 条目数；id
    串命中=Python `in` 子串测试（非词边界），词数=`re.findall(r''CR-[A-Z0-9-]+'')` 去重集合大小。


    【现象】root main 的 projects/ecos gitlink 在提交 604e401a3（PR #5541，合入 2026-11-24T12:54:33Z）由
    a895e90dafe0 改为 2518e4b4154a，diff 为 1 file changed, 1 insertion(+), 1 deletion(-)（纯指针行）。改后
    bin/gac/check-submodule-pointer-drift.py 在本机输出 Total: 16 submodules | 16 aligned
    | 0 ahead | 0 unverifiable | 0 behind | 0 DIVERGED，即上一批登记时把 root main 与所有新建分支打入红线的阻塞信号直接消失。


    【机制】判据只做祖先比较：check-submodule-pointer-drift.py:112 is_ancestor() 调 git merge-base
    --is-ancestor；:146 命中判 behind，:155 命中判 ahead，:177 两向皆假判 DIVERGED；:222/:228 汇总
    DIVERGED（--strict 时含 behind）并决定 rc。整条链上没有任何一步比较两侧内容（无 ls-tree/diff 参与），也没有任何一步核对「root
    声明/文档引用的 CR id 是否在 pin 可见」。于是 gate 的成功条件（pin ∈ 子仓 main）恰好由它所监管的动作（把 pin 挪到 main
    tip）满足——改指针即自证绿。


    【一手测量：re-pin 的可见面代价】git -C projects/ecos ls-tree -r <ref> --name-only 过滤 /GAC-RULE-
