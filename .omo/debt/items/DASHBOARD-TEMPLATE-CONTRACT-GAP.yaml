description: >-
  织星驾驶舱的 template.html 以 `D.<field>` 形式声明了 9 个顶层字段，而发布器产出并被
  `/data.json` 服务的 payload 里这 9 个**全部缺席**。发布器自带的
  `_check_template_data_consistency()` 每次发布都打出同一句告警（"It does NOT block
  publication — it only warns"），即该缺口长期可见但无人处理。
decision_needed: >-
  [已裁定 2026-11-25, 见 BET-Y2Q4-T10-354 spec 裁定表] 6 个 refresh.py 时代产物
  (pending_publications / reconciliation_candidates / current_findings / value_loop /
  anomaly_events / library) 模板侧退役; live_sources 修兜底读 payload 现成的
  source_states (21 键); observed_at / refresh 已由 Wave 5 (#5548) 发布器补齐。
  原文 (存档): 要裁决的是——这 9 个字段里哪些应由发布器 payload 补上
  (observed_at / refresh 属发布器自身即可算出的事实), 哪些是 refresh.py 时代产物、
  应随模板一并退役。在裁定前不动模板也不动 payload。
