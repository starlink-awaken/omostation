  action: update_description
  note: |-
    Updated description from '' to '现象（2026-11-24 08:05:05Z 同一次 refresh 生成的两个发布面读数相反）：
    `.omo/debt/action-packet/current.yaml` 的 summary 是 `revalidate_now 0 / schedule_now 0 / escalate_now 0 / continue_mitigation 0 / watch_only 0`，
    `.omo/debt/action-packet/current.md` 五个小节逐节 "- none"；而同一时刻 `.omo/debt/dashboard/current.yaml` 发布
    `watchlist_item_ids` 共 **5** 条（ISC1-ROOT-PIN-BASELINE-COUPDATE-GAP / OMO-DEBT-REGISTER-NO-REVIEW-DATES /
    HEARTBEAT-READ-ROOT-AND-COLLECTOR-DRIFT / META-DOCTOR-RITUAL-PROPOSALS-NO-CONSUMER /
    DEBT-STALENESS-SIGNAL-SILENT-GREEN-WITHOUT-GIT）。在册非终态 **39** 条、其中 **38** 条挂着 `decision_needed`。
    一个照 packet 办事的 operator 今日会读出「债务侧无事可做」。

    机制（源码直读，非推断）：`projects/omo/src/omo/omo_debt_action_packet.py:32 build_action_packet(review_queue, now)`
    的五条车道**只**遍历 `review_queue["unscheduled"]`(`:44`)、`["due_now"]`(`:57`)、`["escalation_candidates"]`(`:35` 取 id 集)、
    `["upcoming"]`(`:109`)。而这四桶由 `projects/omo/src/omo/omo_debt_review_queue.py:89-92` 的两个分支决定 ——
    只有 `due_at <= now` 与 `due_at <= now + REVIEW_WINDOW_DAYS(=7)` 入桶，`:78-100` 没有第三分支，
    「已排期但在 7 天窗口外」的条目不进任何桶，也不进 summary 的四个 count。
    kernel 直调复现：`build_review_queue(106 条, now=2026-11-24T08:00:00Z, repo_root)` 给 `due_now 0 / upcoming 0 / escalation 0 / unscheduled 0`，
    而**同一返回值**的 `summary.by_severity` = high 7 + medium 30 + low 2 = 39，与内核 `TERMINAL_STATES = {closed, resolved}`
    下数出的非终态 39 条相等 ⇒ 四桶全空不是「无债可核」，是 **39/39 全体出窗**：`min(next_review_at) = 2026-12-06`（12 天后）。
    出窗成因是排期惯例：本轮批量复核补日一律写 +14 天，而窗口是 7 天。

    静默期长度（纯函数逐日复算，不落盘）：把 `now` 从 11-22 推到 11-30 ⇒
    **11-22 … 11-28 连续 7 天五车道全 0**，11-29 才出现第一条（watch_only 1），11-30 为 4。
    ⇒ 本条立案时（11-24）起 packet 还要全静默 5 天，且该静默期在每次批量补日后都会复发。

    覆盖面核查（为什么这不是既有测试钉住的语义）：`projects/omo/tests/test_omo_debt_action_packet.py` 只有 2 个用例
    （`test_build_action_packet_routes_entries_into_primary_lanes`、`test_build_action_packet_keeps_revalidate_above_escalate_for_stale_items`），
    两者都喂非空 queue；**没有任何用例覆盖「四桶全空而非终态条目非零」**，
    所以 all-none 既不是被钉住的契约，也没有任何检查会在它误导 operator 时报警。消费面确有契约：
    `.omo/_knowledge/usage/AGENT.md:268` 把 review-queue 声明为 "the operator-facing queue surface for due-now work,
    escalation candidates, upcoming work, and unscheduled debts"。

    反向前提先否证再立案（避免夸大）：
    ① 不是投影冻结 —— packet 与 dashboard 的 `generated_at` 都是 `2026-11-24T08:05:05Z`，作业活着；
    ② 不是 dashboard 也看不见 —— dashboard 的 `watchlist_item_ids` 由 metrics 按 `gate_level == watchlist` 算，与窗口无关，
        5 条照常发布；分裂点只在 packet 只吃窗口化的 queue；
    ③ 不是 cron 道也无从说话 —— `bin/gac/debt-review-scheduler.py --json`（只读，rc=0）给
        `total_items 106 / needs_reassessment 0 / overdue 0`。两道的「零」含义不同（kernel = 全体出窗，
        cron = 按 `INTERVAL_DAYS[severity]` 回推未到期），但都不表达「39 条在册」；
    ④ 本会话一次逐日扫描因写了非法日期 2026-11-31 抛 `ValueError`，那是仪器自身的错（11 月只有 30 天），
        不作为缺陷证据，重跑后读数见上。

    三个发布面同刻三角对照（都由 `omo_debt.py:429 refresh_outputs()` 一次调用生成，`generated_at` 同为 08:05:05Z）：
    `.omo/debt/action-packet/current.yaml` 五车道全 0；
    `.omo/debt/owner-routing/current.yaml` 给 `owner_count 0 / total_routed_items 0 / lane_counts 全 0`，
    且其 `source_action_packet_ref` 就写向 packet（`omo_debt.py:434 build_owner_routing_packet(action_packet)` 只吃 packet）
    ⇒ **派发面今日把 0 个条目路由给 0 个 owner**；
    而 `.omo/debt/reviews/current.md`（packet 的兄弟面，由 `write_review_pack(omo_dir, items, metrics, review_queue, now)` 生成）
    在 "## Watchlist" 下**逐名列出 5 条**，紧接的 "## Due Now"、"## Escalation Candidates"、"## Upcoming Window"、
    "## Unscheduled Debts" 四节都是 "- none" —— 同一份文档里「有 5 条要盯」与「到期/将到期/未排期全空」并列，
    这正是「已排期但在 7 天窗口外」这一类没有任何表示的直接形状。
    ⇒ 所以准确说法不是「operator 全瞎」：pack 面按 metrics（窗口无关）看得见 watchlist 5 条，
       packet 与 routing 两面按窗口化的 queue 全隐，**39 条在册里没有任何一条进入 packet/routing 的任何一个车道**。

    待裁（三选一，裁决前不动 kernel、不动 packet、不动任何条目的 `next_review_at`、不改 `REVIEW_WINDOW_DAYS` 常量）：
    ① 给 kernel 加第五桶（如 `scheduled_out_of_window`），packet 的 watch_only 顺带吃到 —— 代价：queue 契约与投影 schema
       扩字段，`omo_debt_render.py` / `omo_debt_io.py` / `omo_debt.py` / `omo_debt_action_packet.py` 四个下游消费点都要跟着改；
    ② 让 `build_action_packet` 直接读 `metrics.watchlist_item_ids`（`omo_debt.py:433` 同一函数里两者都已可得）——
       代价：packet 车道不再只由到期日语义决定，与 ① 「桶即契约」方向相反，两个发布面只是换一种方式各说各话；
    ③ 只改补日惯例（批量复核后把 `next_review_at` 落在 +7d 内，或把 `REVIEW_WINDOW_DAYS` 提到 14）——
       代价：动的是判据常量，`due_now`/`upcoming` 历史读数不可比，且不消除「全体同时出窗」这个结构性风险。'.
