  note: |-
    Updated description from '' to '机制缺口在两段，都在 production 侧，今天用同一组实跑把它们与「真红」分开。

    段一：心跳判据按「被指向的那棵树」相对读取，于是安装位的冻结副本被永久判 stale。
    `bin/gac/meta-doctor.py:38-50` 的 HEARTBEATS 表把三个运行时状态文件与 SLA 小时数钉在一起
    （system_health last_scan 48h、health generated_at 72h、governance-data 168h），
    读取路径在 `:158` 以 `checked_file` 相对解析，根取自 `--workspace`（`:545 reference_root = args.reference_root or ws_root`）。
    今天同一台机器两份树的实测对照：
    - canonical `/Users/xiamingxing/Workspace/.omo/state/runtime/` = `system_health.yaml` 11-24 12:17、
      `health.yaml` 12:31、`governance-data.json` 12:29（本地时区，即 0.0–0.3 h 前）；
    - 安装位 `/Users/xiamingxing/.local/opt/omostation/.omo/state/runtime/` 同三个文件 =
      **11-07 08:02 / 11-06 13:27 / 10-30 14:27**，meta-doctor 算出 age
      **412.7 h / 431.3 h / 598.3 h**，summary `stale_beats: 3`；
    - 而 `~/.local/state/omostation/prod/.omo/state/runtime/` **不存在** ⇒ 写方只写代码根那一份，
      安装位那份是 11 月初留下的静止拷贝，没有任何人在更新它。
    `bin/gac/gate-health-check.py:100 / :113` 把 `stale_beats` 计入 A2 与 A5 的非零项 ⇒
    只要门禁探针指向安装位，A2/A5 就恒红，与真实健康无关。
    形状上与「干净检出里 absent 按放行」是同一条判据的两侧：文件**缺席**被原谅，
    文件**存在但没人写**则判永久陈旧 —— 后者比前者更危险，因为它看起来像实测结果。

    段二：面板帧不是由仓内代码产出的，是发布面那份采集器副本。
    production 的采集作业是 `launchd:com.omostation.panorama-dashboard-refresh →
    /Users/xiamingxing/.local/share/zhixing-dashboard/panorama-collect.py`（该路径由 meta-doctor 自己的
    references 面列出，exists=true）。今天对它产出的 48 帧（约 10 分钟一帧）逐个解析门禁行：
    - A3：`FAIL × 38`（detail 均为 `Governance semantic gate: FAIL`）、`DEFERRED × 10`、**PASS × 0**；
    - RF0：`NOT_ADMITTED × 48`（detail 均为 `failed=binary,daemon_stopped,doctor,no_second_queue,workers_off`）。
    而在同一台机器上、用 `bin/gac/gate-health-check.py` 与 `collect_gates()` 各实跑一次（canonical 与安装位两轮）：
    A3 = `PASS / Governance semantic gate: PASS`，RF0 = `PASS / isolated read-only verifier complete:
    daemon stopped, workers off, version 3.80.0, doctor 23 passed/13 warnings`，
    A6 = `NOT_ADMITTED`（probes 3/6、R0 evidence 0/1，live=False）。
    ⇒ 面板上「A3 与 RF0  failing」既不是当前事实，也不是判据设计的结果，而是**采集器副本陈旧**的产物；
    `agent-brief` 据它给出的 next_action「Resolve failing gates: A3, RF0」因此把人往不存在的问题上引。
    顺带一条：`bin/panorama/panorama-collect.py:4886` 的 failing 口径本身是
    `verdict not in {PASS, SKIPPED, DEFERRED}` —— DEFERRED **被排除**，
    所以本会话一开始把 A3 的红猜成「负载延迟被计入失败」是错的，实测否证后才落到「陈旧副本」上；
    这条否证过程本身值得留档，因为它说明面板红不能靠读聚合器代码猜。

    两段的共同根：**production 侧到底以哪棵树为准**没有单一声明 ——
    心跳读「被指向的树」，采集器跑「发布目录里的拷贝」，而写方只认 canonical。
    今天所有 A2/A3/A5/RF0 的读数分歧都能在这一点上解释，且与既立的
    RESIDENT-PLANE-SPLIT-LAUNCHD-INERT（驱动平面分裂）、PANORAMA-GATE-DETAIL-UNRELIABLE
    （detail 字段在聚合面不可信）、ISC1-ROOT-PIN-BASELINE-COUPDATE-GAP（基线与被扫面不同批）
    都不重叠：那三条分别是「谁驱动 resident」「detail 可信度」「基线联动」，
    本条讲的是**心跳与采集的读取根与被测状态所在根不一致，且部署副本无固定校验**。
    '.
