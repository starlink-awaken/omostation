decision_needed: |
  待裁三问，本轮只登记，不改判据、不改部署面、不清安装位:
  (1) 心跳的**权威读取根**是哪一个: 继续 `--workspace` 相对 (现状, 于是任何非 canonical 的树都会读到静止拷贝或
      absent), 还是固定读 `state_root()`/canonical 一份 (与写方同源), 还是给安装位那份也接上写方?
      三者对 A2/A5 的语义不同: 现状 = 指向安装位即恒红; 固定根 = 探针与被测状态同源但失去 per-checkout 语义;
      双写 = 需要给 production 侧加写方 (属部署面, 需 principal 授权)。
  (2) `absent 放行 / frozen 判死` 这个不对称要不要收: 若给 `exists 但 mtime 早于某界限` 也按 absent 处理,
      就再看不见「写方死了」这一类真故障; 若都不放行, 每个 worktree claim 都会红。
      建议同批决定「冻结判定的比较基准是 mtime 还是文件内 last_scan/generated_at」——
      meta-doctor 现在读的是**文件内字段**(:158 checked_file + HEARTBEATS 的 field), 而我把两份树的
      文件 mtime 也一并列了实测, 两者今天给出的龄期一致, 但语义不同源, 后续若只统一其一会再次分叉。
  (3) 采集器副本: 面板帧由 `~/.local/share/zhixing-dashboard/panorama-collect.py` 产出, 而 A3/RF0 的实跑用
      仓内与安装位的代码 ⇒ 版本漂移直接变成门禁伪红。要不要把「发布副本 == 绑定提交」做成硬前置
      (panorama-collect.py:515-526 已有 collector 自证绑定的先例, 见 ZHIXING-PUBLISH-EFFECT-PROVENANCE),
      还是在 brief 面上显式标注「本帧 verdict 来自 <sha> 的副本」。后者是读数标注, 前者是部署校验, 取哪一个属主裁。
  另: 本条不改 `agent-brief` 的 next_action 文案, 也不动 gate-health-check 的 A2/A5 组成项。
