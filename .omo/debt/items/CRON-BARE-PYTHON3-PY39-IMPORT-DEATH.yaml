id: CRON-BARE-PYTHON3-PY39-IMPORT-DEATH
title: cron 作业声明裸 `python3` = Xcode 3.9.6, 189 个裸 `from datetime import UTC` 脚本中 7 条在册作业 import 即死; 根因 2026-10-22 已知, 但补的是比较器 (判两种写法等价), 执行层与登记面至今未修, 也没有门禁断言可执行性
dimension: governance
subdimension: consistency
domain: infrastructure
scope: workspace
severity: high
weight: 0.2
