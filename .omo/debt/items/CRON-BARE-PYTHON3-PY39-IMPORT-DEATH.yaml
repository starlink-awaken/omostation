decision_needed: '三问分开裁决, 有顺序依赖。(1) **计划任务的解释器口径三选一**: ① 登记面写各宿主都存在的绝对路径 — 依赖 `CRON-REGISTRY-NO-HOST-SCOPE` 先裁, 否则 mini 侧路径可能不存在, 把一个死因换成另一个; ② 要求所有 cron 可达脚本自带 3.9 兼容垫片 (把 189 处裸导入收敛到 14 处已有写法) — 纯代码、不依赖宿主, 但覆盖面大且对未来新脚本无自动约束; ③ 由 `scheduler-compile` 在生成/安装时按宿主解析并替换解释器 (把 `normalize_interpreter` 反向用作 codegen, 登记面保持中性) — 一处改动收全部, 需同时修 :71 的 launchd 硬编码。(2) **`normalize_interpreter` 的等价是否收窄**: 它现在同时承担「比较用等价」与「事实上的许可」两件事; 若保留比较用途, 需要另一个独立断言「声明的解释器能 import 目标脚本」, 否则任何解释器缺陷都会被折叠掉。(2026-11-10 决策(3) 落地后的实测口径: 可执行性断言已由 bin/gac/check-cron-interpreter-executability.py 独立承担, 收窄折叠不再等于放弃这条断言; 已装面解释器 token 共 6 种 (Workspace/.venv/bin/python3 ×19, /opt/homebrew/bin/python3 ×12, /opt/homebrew/bin/python3.13 ×10, projects/ecos/.venv/bin/python3 ×3, zhixing-dashboard/.venv ×1, local-ops/dev-venv/bin/python ×1), 折叠口径把带版本后缀的折得回、把不带 3 的 venv 路径折不回 ⇒ local-ops-test-all 一条永远不可比, 这正是 scheduler-compile 的 interpreter_fold shadow 段今天唯一报出的那条; 登记面 43 条 active crontab 作业里 14 条钉了绝对解释器路径 (按 cron_normalize.python_call_sites 的调用点口径), 这类作业的 reconciliation_note 常写「命令抄自实际 crontab 行」—— 该措辞不准, 已装行是安装器按宿主重写解释器的产物 (实测 resolve_python_command 把 /usr/bin/python3 换成 /opt/homebrew/bin/python3.13), 所以登记面声明的解释器与 cron 真正执行的解释器是两个对象, 逐字比对既不成立也谈不上漂移; 由此改判 B′, 见 history 2026-11-10 末条。)(3) **已裁并落地** (principal 2026-11-10 选「先 warn + 限期收敛」, 限期 2026-11-24): 门禁 bin/gac/check-cron-interpreter-executability.py, 判据/限期/实测读数见 history 2026-11-10 两条条目; warn 期恒 exit 0, 过期未收敛自动转阻断。(2) **已裁并落地** (principal 2026-11-10 先选「B 加一条独立漂移检查」, 我用实测证明其前提不成立后改判「B′ 改成查已装行本身」): 折叠比较保持不变, 门禁在登记面之外增加已装面判据 installed_interpreter_gaps, 判已装行里 cron 实际执行的解释器在不在、跑不跑得动目标脚本。**剩 (1) 待裁** —— 它是把任何解释器读数真正收敛的前提, 也是限期 2026-11-24 转阻断前必须有的答案。**裁决前不要动手**: 逐个脚本改 import 会把 189 处碎片化; 手写 crontab 会撞上 EINTR 与 pitfalls:301 的登记面/已装面分裂; 两者都会留下「--check 绿但仍在死」的第三条通路。'
