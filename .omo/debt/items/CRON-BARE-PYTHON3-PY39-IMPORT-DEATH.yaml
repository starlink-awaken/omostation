id: CRON-BARE-PYTHON3-PY39-IMPORT-DEATH
title: cron 作业声明裸 `python3` = Xcode 3.9.6, 189 个裸 `from datetime import UTC` 脚本中 7 条在册作业 import 即死; 根因 2026-10-22
  已知, 但补的是比较器 (判两种写法等价), 执行层与登记面至今未修, 也没有门禁断言可执行性
dimension: governance
subdimension: consistency
domain: infrastructure
scope: workspace
severity: high
weight: 0.2
entropy_class: medium
lifecycle_state: in_progress
owner: governance-team
affected_roots:
- crontab(已装面)
- .omo/cron/registry.yaml
- bin/scheduler-compile.py
- bin/lib/cron_normalize.py
evidence_refs:
- '已装面与登记面都用裸 `python3`: `crontab -l` 60 条非注释行里 16 条声明裸 `python3`, 只有 1 条钉到 `python3.13`; `.omo/cron/registry.yaml:468`
  (debt-review) 同形。cron 风格最小 PATH 实测: `env -i PATH=/usr/bin:/bin /bin/sh -c ''command -v python3; python3 --version''`
  → `/usr/bin/python3` + `Python 3.9.6`'
- '解释器实跑差分 (2026-11-09, cron 同款 env PATH=/usr/bin:/bin, 逐条 `<py> <script> --help`): 3.9 下 rc=1 且 stderr 含 `cannot
  import name ''UTC''` 的作业 7 条 —— scene-signal-poll / kems-freshness / execution-environment-steward / ops-signal-drift
  / scene-registry / debt-review / scene-calibration; 同一批在 `/opt/homebrew/bin/python3.13` 下全部 rc=0。对照组 zhixing-panel-sync
  / workspace-wip-guard / log-rotate 在 3.9 下也 rc=0 ⇒ 不是普遍假阳, 判据确实是 UTC 导入'
- '各 log 的**最后一行**即该 ImportError, 且 mtime 距实测仅 0.2–6.9 小时 (scene-signal-poll 0.2h, 计划 `*/15 9-18 * * 1-5`): 抛错次数
  scene-signal-poll 1142 / kems-freshness 48 / execution-environment-steward 45 / ops-signal-drift 41 / scene-registry
  41 / debt-review 38 / scene-calibration 6 (周一起 06:00, 今天就是周一) ⇒ 失效状态是**当下**, 不是历史残留'
- '逐 log 末次 traceback 的抛错文件: `bin/ssot/scene-signal-poller.py` / `projects/ecos/src/ecos/ssot/tools/mof-kems-bridge.py`
  / `bin/gac/gate-evidence-receipt.py` (被 execution-environment-steward 导入) / `bin/ops/cli.py` / `bin/ssot/scene-v3-registry.py`
  / `bin/gac/debt-review-scheduler.py` / `bin/ssot/calibration-engine.py` ⇒ 因果落在作业自己的模块顶层, 不是子进程'
- '暴露面计量 (`git grep -l "from datetime import.*UTC" origin/main -- bin projects/omo/src projects/ecos/src`): 238
  个文件使用该导入, 其中 `bin/_archive/` 35 个; 带 try/except 兼容垫片 14 个, **裸导入 189 个**'
- '补救手段在仓内已存在但只逐脚本打过: `bin/ssot/scene-history.py:35-39` 与 `bin/gac/zhixing-panel-sync.py:37-39` 的垫片注释直写「cron 下 python3
  可能是 3.9 (<3.11 无 datetime.UTC)」⇒ 同一修法在 14 个文件生效, 从未铺到 189 个, 也没有一致性断言'
- '根因记录于 2026-10-22, 但补的是**检测层**: `bin/lib/cron_normalize.py:30-48` 的 `normalize_interpreter` docstring :33-35 明写「cron
  环境里裸 `python3` 解析到 Xcode 的 3.9, 缺 `datetime.UTC`, 2026-10-22 有 4 条 cron 因此连续失败数周」, 结论是「两者语义相同, 不该算 drift」⇒ `scheduler-compile
  --check` 结构上不可能指出登记面声明了致命解释器; 而「语义相同」这个前提对 189 个裸导入文件不成立'
- '同一缺陷被硬编进另一平面 codegen: `bin/scheduler-compile.py:71` `"ProgramArguments": ["/usr/bin/python3", j["command"]]`
  —— launchd 平面直接把 3.9.6 写死 (并把整条 shell 串当单参数)。`compile_crontab` (:59) 则原样透传 registry 的 `python3`'
- '无门禁断言 cron 命令可执行性, 且此前无任何记录: `git grep -l "cannot import name" origin/main -- .omo/debt/items docs/pitfalls.md`
  rc=1 / 0 files; 正对照 (同一 git grep 换 `datetime` 限 `bin/gac`) rc=0 / 121 files ⇒ 仪器工作正常, 零命中是真阴性'
- '收敛另受一条已知缺陷阻塞, 不是改文件就能生效: `docs/pitfalls.md:301` 本机 `crontab(1)` 写入持续 EINTR (2026-11-07 实测, `crontab -l` 正常) ⇒
  `install-cron-plane.py --install/--remove` 全失败, 而 `scheduler-compile --check` 因 `normalize_installed_line` 折叠仍报
  ok ⇒ 登记面改了也收敛不了已装面'
- '交叉项 (不重叠但同平面): `CRON-INSTALLERS-OUTSIDE-SSOT` 讲登记面外的 3 个安装器; `CRON-REGISTRY-NO-HOST-SCOPE` 讲哪台宿主跑哪条 —— 本项是该裁决的直接输入
  (解释器可用性就是宿主差异); `RESIDENT-PLANE-SPLIT-LAUNCHD-INERT` 讲 launchd 平面 inert, 与 :71 的硬编码相关'
- '失效不限于 cron (2026-11-09 本会话内另两处现场): ① 交互式 `/usr/bin/python3 bin/gac/debt-review-scheduler.py --json` → ImportError,
  同一条命令 python3.13 下 rc=0; ② `/usr/bin/python3 <含长行非 ASCII 的 .py>` → Apple 3.9.6 的 PEP263 分块假错 `Non-UTF-8 code starting
  with ''\xe7''` (短行正常, 单行 ~5KB 中文即触发; 3.13 同文件无错) ⇒ 本仓 python 工具链的事实基线已高于宿主 `/usr/bin/python3` 提供的 3.9.6, 不只 cron
  受影响'
- '取证局限 (如实): 对 debt-review 做过真实子命令实跑 (python3.13 下 rc=0 / stderr 0 行 / 合法 JSON), 其余 6 条只证**导入阶段**在 3.13 下可加载, 未实跑其真实子命令;
  3.9 侧的 rc=1 是模块顶层失败, 与子命令无关'
- '跨宿主解释器读数 (2026-11-09, ssh mini 实测): mini `/usr/bin/python3` = Python 3.9.6, `/opt/homebrew/bin` 下**只有** python3.15
  (无 3.13/3.14), 已装 crontab 36 行用裸 `python3`; mbp 同为裸 `python3`=3.9.6 但有 3.13/3.14/3.15. ⇒ 决策(1)① 「写各宿主都存在的绝对路径」今天只剩
  `/opt/homebrew/bin/python3.15` 一条候选, 而它的成立没有任何契约保证 (mini 侧一次 homebrew 升级即改变), ②③ 不依赖该假设.'
- '第 8 条死作业 = `zhixing-dashboard-panorama-cache-5min`: 登记面 `.omo/cron/registry.yaml:1019-1021` 与已装 crontab 第 39
  行 (`*/5 * * * * cd /Users/xiamingxing/.local/share/zhixing-dashboard && python3 panorama_cache.py >> /tmp/panorama_cron.log
  2>&1`) 命令串一致 ⇒ **不属于** `CRON-INSTALLERS-OUTSIDE-SSOT` 那类登记面外安装器. `*/5` = 288 次/日, 是全部死作业里频率最高的一条. 抛错链: 入口 `/Users/xiamingxing/.local/share/zhixing-dashboard/panorama_cache.py:18-20`
  (**仓外**, 全文 `grep datetime` 0 命中) 用 importlib 加载 `/Users/xiamingxing/Workspace/bin/panorama/panorama-collect.py:32`
  裸导入 (`from datetime import UTC, datetime, timedelta`), 实际使用点 :729 `datetime.now(UTC)`. 日志 `/tmp/panorama_cron.log`
  (不在 `runtime/cron/` 面下) 356360 B / 4720 行 / 472 次 UTC ImportError / mtime 距实测 0.0 h / 末行即该 ImportError. ⇒ 本项失效面同时覆盖仓外入口
  (registry :1031 与 :641 自述部署目录不受版本控制、面板曾被他 agent 覆盖 2 次) 与 /tmp 日志面.'
- '静态分类与实跑的口径差分 (2026-11-09, 对 16 条 cron 入口脚本逐个扫 `from datetime import ... UTC`): BARE 6 / 已带垫片 3 / 无 UTC 导入 6 /
  入口文件未找到 1 (= 16). 实测死法为 7 (仓内) + 1 (上述 panorama) = 8. 差额由**传递加载**解释两处: `bin/gac/execution-environment-steward.py:39-40`
  加载 `bin/gac/gate-evidence-receipt.py:21`、`panorama_cache.py:18-20` 加载 `bin/panorama/panorama-collect.py:32` ——
  二者入口文件自身都不含裸导入. ⇒ 以「数登记面 command 指向的文件」为口径的补计或门禁必然低报; 本项的 8 条以**解释器实跑差分 + 日志末行 ImportError** 为准, 不以静态扫描为准. 对决策(1)②
  的直接影响: 收敛单元是导入闭包, 不是入口清单, 且闭包可跨出版本控制目录.'
