decision_needed: >-
  三问分开裁决, 有顺序依赖。(1) **计划任务的解释器口径三选一**: ① 登记面写各宿主都存在的绝对路径 — 依赖 `CRON-REGISTRY-NO-HOST-SCOPE` 先裁, 否则 mini 侧路径可能不存在, 把一个死因换成另一个; ② 要求所有 cron 可达脚本自带 3.9 兼容垫片 (把 189 处裸导入收敛到 14 处已有写法) — 纯代码、不依赖宿主, 但覆盖面大且对未来新脚本无自动约束; ③ 由 `scheduler-compile` 在生成/安装时按宿主解析并替换解释器 (把 `normalize_interpreter` 反向用作 codegen, 登记面保持中性) — 一处改动收全部, 需同时修 :71 的 launchd 硬编码。(2) **`normalize_interpreter` 的等价是否收窄**: 它现在同时承担「比较用等价」与「事实上的许可」两件事; 若保留比较用途, 需要另一个独立断言「声明的解释器能 import 目标脚本」, 否则任何解释器缺陷都会被折叠掉。(3) **新增可执行性门禁的起法**: 7 条现在就是死的, fail-closed 会让本地门禁立刻红并阻塞无关交付 —— 先 warn 限期收敛, 还是先把 7 条修绿再翻门禁。**裁决前不要动手**: 逐个脚本改 import 会把 189 处碎片化; 手写 crontab 会撞上 EINTR 与 pitfalls:301 的登记面/已装面分裂; 两者都会留下「--check 绿但仍在死」的第三条通路。
history:
- at: '2026-11-09T03:26:00+00:00'
  action: identify
  note: >-
    立案依据是一次性差分实测: cron 同款 PATH 下 7 条作业 `--help` 即 rc=1 (ImportError: cannot import name 'UTC'), 换 python3.13 全部 rc=0; traceback 末态与 mtime (0.2–6.9h) 证明失效在当下; 抛错文件逐条归属到作业自己的模块。同时立案的扫描面缺陷 (`DEBT-REVIEW-SCAN-POPULATION-ALL-TERMINAL`) 是本条的下游后果之一 —— debt-review 既跑不起来, 跑起来也只会扫 25 条终态。根因自 2026-10-22 已写在 `cron_normalize.normalize_interpreter` docstring 里, 当时的处置是让比较器无视解释器差异, 执行层因此无人负责; 本次不改动 crontab / registry / 脚本导入, 只登记事实并请求解释器口径裁决。
  actor: governance-agent
