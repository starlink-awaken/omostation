id: OMO-DEBT-WORKFLOW-CLOSEOUT-OK-FIELD-TAUTOLOGY
title: closeout 的 ok 字段是 status 恒等式：非 ok 收尾已落盘放锁仍 rc=1，脚本无法区分被拒与已应用
dimension: governance
subdimension: tooling
domain: workspace
scope: governance_kernel
severity: medium
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-team
affected_roots:
- "projects/omo/src/omo/workflow/lifecycle.py"
- "projects/omo/src/omo/cli.py"
- ".omo/_delivery/agent-workflows/runs"
evidence_refs:
- "实测：closeout --status blocked 已落盘并 released_locks=5，进程仍 rc=1，与「被门禁拒绝」不可区分"
- "projects/omo/src/omo/workflow/lifecycle.py:1715 与 :1739：\"ok\": status == \"ok\"（恒等式，不含 applied/verify 信息）"
- "projects/omo/src/omo/workflow/lifecycle.py:1716：\"error\": verify_report.get(\"reason\") or \"\" ⇒ ok=False 时常配空串"
- "projects/omo/src/omo/cli.py:516（close 无条件 return 0）对照 cli.py:535（closeout return 0 if report[\"ok\"]）"
- "run 记录 .omo/_delivery/agent-workflows/runs/20261124T115722Z-governance-state-mutation-ff161d99.yaml：status=blocked、closed_at 已写、5 把锁已释放，事件字段仍复刻同一恒等式（lifecycle.py:1750-1752）"
mitigation_refs: []
