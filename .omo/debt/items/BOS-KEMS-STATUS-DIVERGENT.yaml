id: "BOS-KEMS-STATUS-DIVERGENT"
title: "kems 的 4 条 BOS URI 在 bos-services.yaml 标 active、在 services.yaml 标 enabled=false/manual —— 两个登记面互相矛盾, bos-uri-verify 因此恒报不可达"
