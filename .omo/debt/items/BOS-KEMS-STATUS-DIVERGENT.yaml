id: "BOS-KEMS-STATUS-DIVERGENT"
title: "bos-uri-verify 会去探手动能力 (scheduler=manual) 的 HTTP 端点 —— kems 4 条恒报不可达 (订正: 不是两面矛盾, 是探针缺手动能力概念)"
