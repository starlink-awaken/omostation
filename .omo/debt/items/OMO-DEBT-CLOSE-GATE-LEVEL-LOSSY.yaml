  action: update_description
  note: |-
    Updated description from '' to '债务闭环 broker 在 close 时覆写 `gate_level` 且 reopen 不恢复，使条目静默失去闸级并携带过期 `closed_at`；`close` 的 history note 是硬编码固定串，真正的结案理由落在 broker 从不写的字段里。

    实测三处（`projects/omo/src/omo/omo_debt_cli.py`，447 行）：
    ① `:74-76` `close_debt_item` 无条件写 `lifecycle_state="closed"`、`gate_level="none"`、`closed_at=_now_iso()`，原 `gate_level` 不留任何快照；
    ② `:429-431` `reopen` 只写 `lifecycle_state="identified"`，既不恢复 `gate_level`，也不清 `closed_at` ⇒ close→reopen 环路后条目「状态是待办、闸级是 none、还带着上一次的 closed_at」，且 `check-debt-closure-discipline.py` 的 `TERMINAL` 判据会把过期 `closed_at` 当合法结案时间读；
    ③ `:80-86` `append_history(payload, "close", "Closed debt item.", ...)` 是固定串，全文对 `close_reason` / `resolution_evidence` 零命中 ⇒ 这两个字段只能 broker 外手写。

    活体实例：`e41d012b8`（#5478）把 `PANORAMA-A9-SOURCES-STALE-12D` 的 `gate_level` 由 `watchlist` 覆写为 `none`，其 `history` close 条目原文即 `Closed debt item.`，而结案理由写在 broker 之外的 `close_reason`/`resolution_evidence`。broker 现有 17 个子命令（register/list/schedule/refresh/dispatch/approve/campaign/report/report-history/report-diff/report-trend/reclassify/escalate/revalidate/close/desc/reopen）中没有任何一个能写 evidence 类字段——本条自己的 `evidence_refs` 与 `decision_needed` 同样是 broker 外手写，即该缺口的再次复现。

    为什么是缺陷而非风格问题：`gate_level` 是债务面「这条是否进门禁」的权威字段，被一个语义为「关闭」的写方静默降级为 `none`，且恢复路径不存在 ⇒ 任何 reopen 都会留下不可见的去闸状态；修复前无人能从条目本身判断原闸级是什么。
    '.
