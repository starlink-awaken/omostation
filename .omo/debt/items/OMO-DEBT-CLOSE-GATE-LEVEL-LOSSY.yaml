  实测三处（`projects/omo/src/omo/omo_debt_cli.py`，447 行）：
  ① `:74-76` `close_debt_item` 无条件写 `lifecycle_state="closed"`、`gate_level="none"`、`closed_at=_now_iso()`，原 `gate_level` 不留任何快照；
