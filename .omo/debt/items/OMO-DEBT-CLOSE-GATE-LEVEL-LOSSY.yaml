decision_needed: |-
  broker 是治理面的写方, 改它等于改所有债务闭环的行为, 因此三项待裁, 本轮不代做:
  (1) 采 (a) 快照字段 `gate_level_before_close` + reopen 恢复并清 `closed_at` /
      (b) close 不再碰 `gate_level` (终态条目本就不该被闸级扫描计入) /
      (c) 维持现状, 只在文档写明「reopen 需人工回填 gate_level」 —— 三选一;
  (2) 若采 (a): 新字段是否进债务 schema 与 lint (涉及 DEBT-SCHEMA-THREE-WAY-DESYNC 的三处权威面同步);
  (3) 历史上已被 close 打掉 gate_level 的条目 (至少 PANORAMA-A9-SOURCES-STALE-12D 一条) 是否回填前值
      —— 回填要读 git 历史, 属数据修复而非判准变更。
  **本条自身就是「broker 写不到 evidence/decision 字段」的又一次现场复现**: register 只接受
  id/title/dimension/subdimension/severity/owner/x1/x2/x3, description 走 desc, 其余字段
  (上面这段与 evidence_refs) 全部由 broker 外手写 —— 与 PANORAMA-A9-SOURCES-STALE-12D
  history 2026-11-09 那条结构性记录一致, 至今未修。
description: |
