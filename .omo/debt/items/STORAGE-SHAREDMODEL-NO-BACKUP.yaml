  action: identify
  note: >-
    BET-Y2Q4-T10-242 模型域并轨后 SHAREDMODEL 达 ~847G used,
    是全机唯一零备份的大体量资产 (Lex 冷备只覆盖 workspace 226M
    + 模型归档 7.4G; MBP HDD 副本同)。叠加 disk8 硬件嫌疑
    (见 HW-DISK8-4TB-FLAKY), 风险敞口最大的一项。
  actor: "engineering-agent"
- at: '2026-10-12T00:20:00+00:00'
  action: mitigate
  note: >-
    部分缓解, 未关闭。稀有发布者权重 (232.4 GiB) 已有 Lex 副本, 2026-10-12 08:06 手动跑通整链
    (sync-rare 16 目录 / verify 抽样 15 不一致 0); 公开源权重 (约 545G) 可由 36 条重建清单重下,
    不做数据备份。剩余缺口: 周同步排程装上后从未运行过 (launchd 直启 /bin/bash 缺『可移动卷』TCC 授权,
    runs = 0), 已改为经终端 App 启动器并加心跳补跑, 但需用户人工安装并由 launchd 真实触发成功一次后
    才算持续机制; Lex 与 4.1T 盘之外没有第三份稀有权重。
  actor: "governance-agent"
