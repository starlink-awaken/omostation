    风险叠加：承载这份全机唯一零备份大体量资产的盘，今日在 studio 守护日志里出现 `2026-11-07 06:00:00 REMOUNT SKIP: … 设备(物理层不可见)`，且重启（boot 07:02:07）后 `07:03:01→07:27:00` 每 3 分钟 `Volume on disk6s2 failed to mount` 连续 9 次（详见 HW-DISK8-4TB-FLAKY 同日 review-measure 第二轮）。⇒ 备份决策的前置条件不再是「等观察期结论」，而是这块盘已被观测到一次「关机 stall + 25 分钟拒绝挂载」；SMART 经 USB 桥不可读，不能指望盘自报健康。decision_needed 文本未动，重定由 owner 办。
