    (1) **敞口没有变小，也没有变大**：`df -k /Volumes/SHAREDMODEL` Used = **889,756,920 KB**（≈848.5 GiB；2026-11-07 为 889,756,916 KB，两天净增 4 KB），容量 2,000,290,968 KB、45% 已用。⇒ decision_needed 里 ~847G 的量级前提继续成立。
    (2) **备份读不到健康这件事没变**：载体仍是 studio-01 `/dev/disk4` = `DK5A1-4T Media`，`diskutil info disk4` 本轮再测 `Protocol: USB`、`SMART Status: Not Supported` ⇒ 经 USB 桥后 SMART 仍不可读，"先拿到盘的SMART 再决定备份策略"这类前置依赖在本机无解，得走别的证据（文件系统级校验或换桥）。
    (3) **观察窗内的实际风险敞口（对上一轮 11-07 那 25 分钟拒绝挂载的补数）**：11-07 07:27 之后到 11-09 09:49 共 ≈50.8 小时，`disk-keepalive.log` 无新异常（只有 11-08/11-09 各一条 MOVESPEED 写被拒 NOTE，属 TCC 而非盘故障）、ALERT 计数停在 9 未升级、USB 重新枚举 0 次。⇒ 这两天没有新的整卷不可用事件；但一次已发生的 25 分钟挂载拒绝 + 848.5 GiB 单副本，已足够让「等观察期满再决定备份」这个前置条件失效（上一轮已记），本轮只是确认风险没有在窗口内继续放大。
