  ① 单点定义 —— 把「一条 evidence ref 算不算有效」收敛为一个函数（放 kernel 侧还是 bin/ssot/_shared.py 由 principal
  定），verify 与 metrics 两个消费者共用；后果：76 条终态与 34 条非终态的判定同时移动。


  ② 只放开形态 —— 两处判定都接受 path:行号 (注解) 写法（取基路径 stat）；实测终态 RED FLAG 1 → 0，非终态 stale 30 →
  29，debt_health 仍 0.0，即该修法对非终态面几乎无效。


  ③ 只改 mitigation_refs —— 把「空 mitigation 即证据陈旧」摘出判据（stale 30 → 26），同时须裁定该字段是否必填（牵动
  broker register 默认注入 mitigation_refs: [] 与 §2 实测「唯一调用用例不区分该分支」是否补回归）。


  ④ 立书写规范 —— 规定 evidence_refs 只允许纯路径、注解写进 description/history，并对 §5 那 8 条 decorative
  条目批量补写（波及他人条目既有字段，需逐条授权，agent 不代改）。


