- at: '2026-11-25T12:55:11.152755+00:00'
  action: update_description
  note: 'Updated description from '''' to ''【单位口径】行号在 origin/main@0ada7d4ef 的 bin/ssot/sync-submodules-push.sh
    上复核；「失败/缺失/无上游」计数取脚本末行 `统计:` 读数；pin 对象存在性用 `git cat-file -t`；时间为 UTC。


    【现象】隔离 worktree 里 `git push` 被 pre-push 的 submodule-sync 拦成 blocking：统计行给出 `失败=1`，唯一失败项是
    `❌ projects/knowledge/gbrain: 无法读取当前分支`，而同一份输出里另有 15 个子模块被正常判为「未初始化, 跳过」或「detached
    HEAD, 跳过」。也就是说，本 PR 的 gitlink 一个都没动（`git status --short` 指针变更数 = 0），push 却被子模块检出状态堵死。


    【根因】脚本用「`.git` 是否存在」当作「子模块是否初始化」的代理指标（:31）。而 worktree 快速 claim / 守卫在途 init 会留下第三种形态：`.git`
    文件在、gitdir 里零 refs、HEAD 指向 `refs/heads/.invalid`、pin 对象根本没取到。这种形态穿过 :31，落到 :38
    的 `rev-parse --abbrev-ref HEAD` 失败分支，被记成 failed（:40）并在末段 exit nonzero。对照 :45-49：detached
    HEAD（比它更强的状态）走 `missing++` 跳过，并且 :47 自己写明「reachability 由 submodule-reachability-gate
    兜底」——未初始化瞬态反而拿到了比 detached 更严的判决。


    【判据】某条子模块判定应当读「pin 对象 + HEAD 可读性」，而不是读 `.git` 存在性；本钩子的语义是「本地领先远程的未推 commit」，对没有对象库、没有
    refs 的检出这个问题本身不成立，既无 commit 可推也无 upstream 可比。


    【处置】绕行方案已实测可用：从 canonical 子模块对象库 `git --git-dir=<wt gitdir> fetch <canonical>
    <pin>` 后 `checkout FETCH_HEAD`（不改根 gitlink、不联网），钩子随即走正常分支放行；2026-11-25 在 ws-ssotfix/gbrain
    与 ws-debt22/omo 两处分别复现并绕过。修法待定，方向是 :31 的判据换成「HEAD 不可读 / 零 refs / pin 缺失 ⇒ 与未初始化同类，计入
    missing 并跳过」，同时保留 reachability gate 兜底，避免把真实的未推 commit 也一并放过。''.'
