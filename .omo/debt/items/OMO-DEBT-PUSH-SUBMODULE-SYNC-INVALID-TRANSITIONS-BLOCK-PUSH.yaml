id: OMO-DEBT-PUSH-SUBMODULE-SYNC-INVALID-TRANSITIONS-BLOCK-PUSH
title: pre-push submodule-sync 把 .invalid 未初始化瞬态判成 blocking 失败，worktree 交付被自己的钩子堵死
dimension: governance
subdimension: tooling
domain: workspace
scope: governance_kernel
severity: medium
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-team
affected_roots:
- bin/ssot/sync-submodules-push.sh
- .githooks/pre-push
- bin/gac/hook-runner.sh
- bin/ssot/submodule-reachability-gate.py
- bin/gac/gac-worktree.sh
evidence_refs:
- '实测 2026-11-25 ws-ssotfix `git push`: `[hook-runner] ❌ [submodule-sync] failed (89ms)`，统计行
  `待push=0 失败=1 无上游=0 缺失=15 (dry-run=0, verification-only)`，唯一失败项 `❌ projects/knowledge/gbrain:
  无法读取当前分支`，整条 push 被 exit nonzero 拦下'
- '肇事检出实况（ws-ssotfix，2026-11-25）：`projects/knowledge/gbrain/.git` 是 97B gitdir 指针
  → `.git/worktrees/ws-ssotfix/modules/projects/knowledge/gbrain`，其 HEAD 内容 `ref:
  refs/heads/.invalid`，`for-each-ref` 零 refs，pin `d347eb3bdefac993dbd0f9e646cbb608a18d7bb7`
  经 `git cat-file -t` 报 `could not get object info`'
- 分类判据错位：`bin/ssot/sync-submodules-push.sh:31` 只用「`.git` 存在与否」判未初始化；带 `.git` 而 HEAD
  不可读的 `.invalid` 瞬态穿过该分支，落到 `:38` 的 `rev-parse --abbrev-ref HEAD` 失败即 `failed++`（`:40`
  打印 `无法读取当前分支`）
- 对照同一脚本 `:45-49`：detached HEAD 被计入 `missing`（跳过），且 `:47` 自己写明「reachability 由 submodule-reachability-gate
  兜底」—— 即 `.invalid` 这种更弱的状态反而拿到了比 detached 更严的判决
- '形态来源已登记在别处：AGENTS.md §worktree「release 自触发守卫的在途 init（`.invalid` 瞬态）」；2026-11-25
  在 ws-debt22 的 `projects/omo` 上二次复现，`git submodule update --init --depth 1 projects/omo`
  报 `fatal: Unable to find current revision in submodule path ''projects/omo''`'
- 绕行成本：须经「从 canonical 对象库 fetch pin + checkout FETCH_HEAD」把检出补成可读（不动根 gitlink）后钩子才放行；快速
  claim（SKIP_SUBMODULE_INIT / init 超时）每次都可能再撞
