id: "GATE-SURFACE-POLICY-VS-DEFAULT-DIVERGENCE"
title: "gac-local-gate 的门禁面随 projects/ecos 是否初始化而变：strict 87 vs 84，差集 19 条（CI 独有 12 / 默认独有 7），而退回是静默的"
