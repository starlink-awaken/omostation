    `gac-local-gate.py` 的 gate 定义里 —— 即**只在子模块没初始化的机器上被跑到**。
    措辞已改为「不出现在 CI 的 gac-local-gate 里」+ 单独点名那一个例外。
    **判据**：说「某判据在 CI 里不跑」之前，**要查全部 CI 路径**（workflow 不止
