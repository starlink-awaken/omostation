    所以它不是「CI 完全不跑」；**其余 5 条**（`bdsk-shadow-sandbox` /
    `error-knowledge-check` / `submodule-ancestry-gate` / `sweep-index-check` /
    `test-coverage-check`）在 `.github/workflows/`、`Makefile`、
