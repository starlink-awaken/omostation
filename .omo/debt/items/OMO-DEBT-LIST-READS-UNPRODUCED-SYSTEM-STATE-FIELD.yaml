id: OMO-DEBT-LIST-READS-UNPRODUCED-SYSTEM-STATE-FIELD
title: omo-debt list 读 system.yaml::debt_weight_items，该字段无生产方且同步面被拒写 ⇒ 恒报 0 total，与
  113 条 items 现实相反
dimension: governance
subdimension: gate
domain: workspace
scope: governance_kernel
severity: medium
weight: 0.05
entropy_class: classification
lifecycle_state: identified
owner: governance-agent
affected_roots:
- projects/omo/src/omo/omo_debt_cli.py
- projects/omo/tests/test_omo_cli_modules.py
- projects/knowledge/kairon/tests/scripts/test_sync_system_state.py
- projects/runtime/src/runtime/state_schema.py
evidence_refs:
- '读路径单一: projects/omo/src/omo/omo_debt_cli.py:25-49 `cmd_debt_list(omo_dir)` 只读 `omo_dir/state/system.yaml`，:38
  `items = system.get("debt_weight_items", {})`，:45-49 用 `len(items)` 打 "N total:
  A open / B resolved" —— 缺键即空字典，不告警不降级'
- '现场读数: canonical @6e7a7e2ad `python3 -m omo.omo_debt list --omo-dir .omo` → 「0 total:
  0 open / 0 resolved」，同一时刻 `.omo/debt/items/*.yaml` = 113 个文件；worktree @aa58486cb
  同读 0'
- '不是工件缺失: state_root `/Users/xiamingxing/.local/state/omostation/prod/.omo/state/system.yaml`（638
  字节，mtime 2026-10-28） 里 `debt_weight_items` 长度同样是 0；code_root 那份 1.9k 亦然 ⇒ 字段真为空，非未物化'
- '无生产方: 全仓 `rg -n -F debt_weight_items` 只命中 4 处 —— 读者 omo_debt_cli.py:38/41、字段声明
  projects/runtime/src/runtime/state_schema.py:19、两处测试；没有任何脚本/作业写它'
- '写入面按设计封死: projects/knowledge/kairon/tests/scripts/test_sync_system_state.py:184-195
  `test_debt_weight_items_cannot_be_modified` 断言对该字段的 FieldDiff 必抛 PermissionError（docstring
  「debt_weight_items 字段必须被拒绝」）⇒ 唯一可能填它的同步路径主动拒绝，字段恒空'
- '测试按构造就绿: projects/omo/tests/test_omo_cli_modules.py:753-762 `test_cmd_debt_list`
  在 tmp_path 自建 state/system.yaml 并塞入 debt_weight_items 字典再断言输出 —— 用例自己造数据，生产端从不产，绿不证明
  CLI 可用（AGENTS §7「接线 ≠ 非空转」「测试逐字断言生产端」同族）'
- '假阴性后果: 以 `omo-debt list` 回读「当前有多少债」会得到 0；真实是非终态 31 —— 本轮实测顺序为 CLI 0 → 数文件 113 →
  按 lifecycle_state 分布 closed 40 / resolved 42 / identified 27 / in_progress 4 ⇒ 非终态
  31'
- '权威读数面已存在且自洽: `.omo/debt/review-queue/current.yaml`（generated_at 2026-11-25T05:35:04Z）
  `summary.open_count=31` / `by_severity {high:7, medium:21, low:3}` / `by_owner {governance-team:26,
  xiamingxing:5}` 与逐文件统计完全一致 ⇒ 缺陷不是缺数据，而是 CLI 的 list verb 接在死字段上（正确口径另有权威面）'
- '消费面边界（不夸大）: `rg --no-ignore -nF "omo-debt list"` 全仓 0 命中 ⇒ 无门禁/看板接它，影响限于人与 agent
  手工回读，故 severity=medium；修法是让 cmd_debt_list 改读 review-queue/dashboard 或直接扫 `.omo/debt/items/*.yaml`
  的 lifecycle_state，属 projects/omo 内核改动需另开 PR，本条不代为实施'
mitigation_refs: []
