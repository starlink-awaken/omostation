decision_needed: "**已裁 (2026-11-09)**: 采**结构性修法** —— registry 加 `hosts` 字段 (缺省=全部机器), 并在 `compile_crontab` / `check_drift` 两处按本机过滤 (`_host_scoped()`, 主机名取自 `CRON_HOST` env 或 `socket.gethostname()`)。`diff_installation` 经 `compile_crontab` 自动跟随。`known_drift` 兜底清单**未采用** —— 它是全局清单, 会在 mini 上把「该装却没装」一起放过, 等于削弱 gate。**不要**靠把条目标 proposed 来绕 (那会让真正该装的机器也装不上)。"
history:
- at: '2026-11-09T10:20:00+00:00'
  action: identify
  note: >-
    实例: `work-agent-respire-mbp-watchdog`（`*/5 * * * * /bin/bash
    $HOME/Project/work-agent/scripts/respire_mbp_supervisor_watchdog.sh`）的
    reconciliation_note 明写: 「MBP 的 crontab 写入已损坏 (Interrupted system call,
    装不进任何新条目), 而兜底用的 gui 域 LaunchAgent 只在图形会话存在时才有 ⇒ MBP
    重启后若没有图形登录, 其 Respire supervisor 无人拉起。mini 从不睡眠 (pmset sleep=0)
    ⇒ **由 mini 侧**每 5 分钟 SSH 检查并按需拉起」。

    即: 该条目是 **mini 专用** (watchdog 跑在 mini, SSH 到 mbp), 但 registry 是
    **跨机并集**且没有机器维度字段 (87 条 job 的字段集里没有 hosts/machines/node
    之类)。后果: mini 上 --check 绿, **mbp 上 drift=1** (登记了但没装)。

    不对称: `known_orphans` 兜住了「装了但没登记」, 但**没有**对称机制兜
    「登记了但这台机不该装」。check_drift 的 ok 是机器相对的, registry 不是。

    注: 该条目的登记发生在 MBP crontab 损坏期间, 当时**装不进去**是环境问题;
    现在写入恢复了, 但条目依然不该出现在 mbp 的 drift 里。
  actor: "governance-agent"
- at: '2026-11-09T03:50:00+00:00'
  action: mitigate
  note: >-
    落地结构性修法 (PR #5146): `bin/scheduler-compile.py` 新增 `_current_host()`
    (`CRON_HOST` env 覆盖, 缺省 `socket.gethostname()`) 与 `_host_scoped()`;
    `compile_crontab` 与 `check_drift` 同口径过滤, `diff_installation` 经
    `compile_crontab` 自动跟随。`.omo/cron/registry.yaml` 给
    `work-agent-respire-mbp-watchdog` 加 `hosts: [mini]`。

    **实测 (mbp)**: `_host_scoped` 87→86 条, watchdog 从编译产物消失,
    `check_drift` 由 `{ok: False, drift: 1}` 变为 `{ok: True, drift: 0, orphan: 0}`;
    `gate-health-check.py` 的 A4 Scheduler 由**本机六项里唯一常红**转为 ok。
    **反面对照 (CRON_HOST=mini)**: 87 条全保留, 产物含 watchdog; 本机没装它
    ⇒ drift=1 —— 说明过滤不是「永远放过」, 该装的机器仍然被检查。

    未采用 `known_drift` 兜底清单: 它是**全局**清单, 会在 mini 上把「该装却没装」
    一起放过, 等于削弱 gate; `hosts` 字段是精确到机器的。

    牙齿验过 (变异对照): 摘掉 `compile_crontab` 的 `_host_scoped` ⇒
    `test_host_scope_excludes_other_hosts_jobs` 与
    `test_host_scope_keeps_unscoped_and_matching_jobs` 当场红 (2 failed / 13 passed),
    恢复后 15 passed。`test_compile_crontab_does_not_double_log_redirect` 的期望集
    同步改为 `_host_scoped(jobs)` —— 契约不变 (该编译的每条都编译), 只是不再要求
    别机条目出现。
  actor: "governance-agent"
