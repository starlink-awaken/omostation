evidence_refs:
- ".omo/cron/registry.yaml (87 条 job，字段只有 name/schedule/command/planes/reality/status/owner/sfop_slot/reconciliation_note/label/ssot_conflict/note)"
- "bin/scheduler-compile.py check_drift (拿**本机** installed 面比**全局** registry)"
- "registry 条目 work-agent-respire-mbp-watchdog (reality=installed, status=active, owner=work-agent)"
mitigation_refs: []
opened_at: "2026-11-09"
