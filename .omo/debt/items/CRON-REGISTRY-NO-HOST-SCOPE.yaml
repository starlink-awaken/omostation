id: "CRON-REGISTRY-NO-HOST-SCOPE"
title: "cron registry 没有机器维度作用域 —— 单机专用条目在别的机器上算 drift"
dimension: "governance"
subdimension: "consistency"
domain: "system"
scope: "host"
severity: "medium"
weight: 0.15
