- at: '2026-09-25T12:00:00+00:00'
  action: identify
  note: >-
    2026-09-25 前后两起实证：① `gh pr checks`（GraphQL）在网络抖动时直接
    i/o timeout，而同等 REST（gh api commits/check-runs、gh run list）可用，
    排查一度卡住；② 更早一次 `gh pr list --state open` 抖动返回空，被脚本
    当成“无 OPEN PR”继续执行，误删了一个 OPEN PR 的 worktree（后恢复，未丢
    工作）。规则：外部查询失败/空 = UNKNOWN，直接中止流程，绝不能当否定结论用。
  actor: governance-agent
