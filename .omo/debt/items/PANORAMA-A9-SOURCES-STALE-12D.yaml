  last_success `2026-10-28T08:18:27Z` = **2,300,969 s（639.2 h）**；`panorama_base` `STALE_UNAVAILABLE`
  last_success `2026-10-28T07:27:34.594591Z` = **2,304,021 s（640.0 h）**。
  **二者都不在 A9 的 14 元 `required_sources` 内**（`:1511-1515`），故既不拦也不放行 A9；
  若被纳入，年龄界 21600s 会直接判它们不合格（实测超界 **106 倍**）。
  本轮反向排除的两个例子：`gantt` 在 22:04:28Z 帧还是 `DEFERRED`（`last_success_at: None`）、
