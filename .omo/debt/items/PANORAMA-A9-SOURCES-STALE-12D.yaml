  note: "decision_needed ① 的答案：**进程通路失败**, 不是「本己无数据源」。 实测链（2026-11-10T04:2xZ, 复算命令见下）:\n\
    \  `strategy_sources.py:536` `_collect_runs` 走\n  `reader.discover(\"state\",\
    \ \".omo/_delivery/agent-workflows/runs\", \"*.yaml\", required=True)`\n  —— 而\
    \ `~/.local/state/omostation/prod/.omo/_delivery/agent-workflows`\n  是一条**符号链接**指向\
    \ `/Users/xiamingxing/Workspace/.omo/_delivery/agent-workflows`\n  （state 面的镜像桥,\
    \ 与 AGENTS.md 记录的 delivery anchor symlink 桥同族）。\n  `discover()` 第 418 行 `(root/relative).resolve()`\
    \ 跟着链跑出 state 根,\n  第 419 行 `is_relative_to(root)` 判 false ⇒ 报 `outside_allowlisted_root`。\n\
    \  即便放行, 实际读取用的 `os.open(..., dir_fd=...)` 对**每个组件**都带\n  `O_NOFOLLOW`（第 108-115\
    \ 行）, 符号链接目录会直接 ELOOP —— 即该 reader\n  的结构性设计就是「不可穿过软链」, 与状态面的镜像桥拓扑不兼容。\n同文件第 572\
    \ 行读 `.omo/_knowledge/retros` 用的是 **workspace** 根（真目录, 可读）—— 同一文件里两种口径并存, 536\
    \ 用 `state` 是笔误/历史遗留。 复算:\n  python3 -c \"import repo_root;from pathlib import\
    \ Path;r=Path(repo_root.state_root()).resolve();p=(r/'.omo/_delivery/agent-workflows/runs').resolve();print(r,p,p.is_relative_to(r))\"\
    \n  → /Users/xiamingxing/.local/state/omostation/prod /Users/xiamingxing/Workspace/.omo/_delivery/agent-workflows\
    \ False\n  ls -ld ~/.local/state/omostation/prod/.omo/_delivery/agent-workflows\
    \  → lrwxrwxr-x（指向 Workspace）\n  ls /Users/xiamingxing/Workspace/.omo/_delivery/agent-workflows/runs\
    \ | wc -l → 422（数据在, 且当天在写）\n**修法两条, 均需 owner 定调**（本条不擅改）:\n  ① 采集侧: 536/540 改用\
    \ `workspace` 根（与 572 行口径一致, 真目录可读）\n     —— 改动最小, 但要确认 runs 的权威面是检出还是 state 根;\n\
    \  ② 读取侧: 让 reader 支持「根内软链指向另一许可根」——需重审\n     `discover`/`read` 的 no-follow 穿越面,\
    \ 属安全边界改动。\n另: `probe_strategy` 还依赖 PYTHONPATH 上有 `repo_root`（`refresh.py --probe\
    \ strategy` 子进程不自带）——生产由 launchd `com.omostation.zhixing-dashboard-refresh` 的\
