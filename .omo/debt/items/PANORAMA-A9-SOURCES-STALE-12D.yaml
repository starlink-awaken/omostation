  即 CANONICAL_BASE lane 读的是一个自 10-28 起没人写的仓根 runtime 面（与
  `AGENT-BRIEF-CANONICAL-ROOT-NO-SCHEDULED-WRITER` 同族，那条只覆盖 `agent-brief.json`，本条是 `data.json`）；
  ③ state 根对应文件 `~/.local/state/omostation/prod/runtime/dashboard/data.json` **不存在**
  （同目录 `agent-brief.json` 存在且 21:46:40Z 新鲜）⇒ 「把 CANONICAL_BASE 改指 state 根」目前无源可指。
  候选：(1) 给仓根 `runtime/dashboard/data.json` 配排班写方（部署面写，需 principal 授权）；
  (2) 先在 state 根造 `data.json` 写方再把 lane 改指过去；(3) 判其结构性不可得并在 `source_health` 语义里降级
