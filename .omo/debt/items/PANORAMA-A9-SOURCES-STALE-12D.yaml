  632s（前两次）/ 1930s（`scheduler`，第三次）对年龄界 21600s 余量 34×/11×。
  那两帧 PARTIAL 的原因是 `cockpit_sources` 不完整 + `portfolio=PARTIAL`，与「源陈旧」不同链路。

  **本条已被结案，本轮不 reopen。** `e41d012b8` (#5478) 由 governance-agent 于
  2026-11-23T13:47:14.840677Z 走 broker `omo-debt close` 置 `lifecycle_state: closed`。
  该结论与本普查一致（前提确已消解），故 `lifecycle_state`/`gate_level`/`closed_at`/
  `close_reason`/`resolution_evidence` 五项本轮一律不动；待裁的只剩下面三组。

  **(R1') 结案记录本身是否追认（三条实测缺陷，都不是「前提是否成立」）**
  (a) 结案的 `history` note 是硬编码固定串 `Closed debt item.`（`projects/omo/src/omo/omo_debt_cli.py:80-86`），
      真正的结案理由落在 `close_reason` / `resolution_evidence` 两个字段里，而 **broker 从不写这两字段**
      （`omo_debt_cli.py` 全文 447 行对 `close_reason`/`resolution_evidence` 零命中）⇒ 它们是 broker
      之外手写进账的，正是本条 history 反复记载的「闭环证据靠手写」结构性缺口的现场复现。
  (b) `close` 顺带把 `gate_level` 由 `watchlist` 覆写为 `none`（`:74-75`），而 `reopen`（`:430-431`）只恢复
      `lifecycle_state`、既不恢复 `gate_level` 也不清 `closed_at` ⇒ close→reopen 会**静默去闸并留下过期
      `closed_at`**。已另立 OMO-DEBT-CLOSE-GATE-LEVEL-LOSSY 跟踪，是否修 / 怎么修由 principal 裁。
  (c) 同一文件里 `description` 称 last_success `2026-11-23T05:57`（写于 06:16Z），`close_reason` 称
      `2026-11-23T12:09Z`（写于 13:47Z）—— 两个读数都对，但没人回头同步 description。
  (d) 附带项（未变）：`evidence_refs` 第 1 项 `~/.local/share/zhixing-dashboard/current.json` 实测不是可信
      verdict 面（每轮刷新先进入 11/11 门 `UNKNOWN` 占位态、`live: false`），第 2 项 `revisions/` 是容量 49
      的滑动窗口（~4 h）⇒ 本条的历史断言在数小时内不可复算。是否把 evidence 收敛为「只指
      `revisions/*/data.json` 并要求复核当场取帧」由用户定（本轮不自行改 evidence）。

  判据可复算（A9 准入逻辑独立重跑；11-24 00:28:57Z 帧实测输出 `bad_sources = []` ↔ 发布值 `A9 PASS`）：

  ```
  python3 - <<'PY'
