  ③ 修采集并给 PARTIAL 加年龄界）**已无对象**：两次取样（各 49 帧，窗口 18:00:15Z–22:12:31Z 与
  19:28:51Z–23:27:57Z）都是 `47 PASS / 2 PARTIAL / 0 FAIL`；`strategy`/`documents` 的
  `last_success` 年龄 ≤ 0.12 h，`oldest source success age` 峰值 632s 对年龄界 21600s 余量 34 倍。
  原问③的 PARTIAL 侧：那两帧 PARTIAL 的原因是 `cockpit_sources` 不完整 + `portfolio=PARTIAL`，
  与「源陈旧」不同链路，不属本条。

  现在待裁的是残余三项（本轮均不代做）：

  **(R1) 本条是否收口。** 选项：`closed`（命题「required sources 长期无成功观测」不成立，全过程由 history 承载）／
  保留 `identified` 到下一轮复核（若认为「恢复」不足以证明采集链路已修）。
  **附带项（同属 R1，需一并裁）**：`evidence_refs` 第 1 项 `~/.local/share/zhixing-dashboard/current.json`
  实测不是可信 verdict 面（每轮刷新先进入 11/11 门 `UNKNOWN` 占位态、`live: false`），
  第 2 项 `revisions/` 是容量 49 的滑动窗口（~4 h）⇒ 本条的历史断言在数小时内不可复算。
  是否把 evidence 收敛为「只指 `revisions/*/data.json` 并要求复核当场取帧」由用户定（本轮不自行改 evidence）。

  判据可复算（A9 准入逻辑独立重跑，23:27:56Z 帧实测输出 `bad_sources = []` ↔ 发布值 `A9 PASS`）：

  ```
  python3 - <<'PY'
  import json,glob,os,datetime
  p=max(glob.glob(os.path.expanduser('~/.local/share/zhixing-dashboard/revisions/*/data.json')),key=os.path.getmtime)
  d=json.load(open(p)); gen=d['generated_at']; now=datetime.datetime.fromisoformat(gen.replace('Z','+00:00'))
  req={"catalog","strategy","strategy-projection","environment_evidence","portfolio","workflow","resident",
       "scheduler","references","orca","multica","ruflo","documents","compute"}   # = panorama-collect.py:1511-1515
  ss=d['source_states']
  def age(s):
      v=s.get('last_success_at')
      return None if not v else (now-datetime.datetime.fromisoformat(str(v).replace('Z','+00:00'))).total_seconds()
  bad=[]
  for n in sorted(req):
      s=ss.get(n) or {}; st=s.get('status'); a=age(s)
      ok = st=='OK' or st=='DEFERRED' or (a is not None and a<=21600 and st in ('STALE_UNAVAILABLE','FAIL'))
      print('%-22s %-18s age_s=%s accepted=%s' % (n,st,'None' if a is None else round(a),ok))
      if not ok: bad.append(n)
  print('recomputed bad_sources', bad)
  print('published A9', [(g['verdict'],g['detail'][:90]) for g in d['gates'] if g.get('id')=='A9'])
  PY
  ```

  **(R2) 同帧仍红的两个观测是否另立案**（与本条立案前提无关，是否转为独立债务由用户定；本轮不自行新建，避免与
