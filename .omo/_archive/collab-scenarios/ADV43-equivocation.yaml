description: >
  [对抗·red-team wave8] 左右互搏: 同一角色对两听众说不同话 (equivocation),
  管线尚无 equivocation_detected → 预期 FAIL
setup:
  blackboard: []
  roles: [broker, alice, bob]
inject:
  - {type: write_conflict, role: broker, target: msg_to_alice, value: "yes"}
  - {type: write_conflict, role: broker, target: msg_to_bob, value: "no"}
expected:
  behavior: equivocation_detected
  silent_loss: 0
verdict:
  - criterion: equivocation_detected
    check: events_contain
    args: {kind: equivocation_detected}
  - criterion: no_silent_loss
    check: silent_loss_eq
    args: {expected: 0}
