input_schema:
  type: object
  required: [task_ref]
  properties:
    task_ref: {type: string, pattern: "^(evidence|vault|ref)://"}
    scope: {type: string, description: "工程任务范围"}
output_schema:
  type: object
  required: [status, result_ref]
  properties:
    status: {type: string, enum: [succeeded, failed, degraded, needs_human]}
    result_ref: {type: string, pattern: "^(evidence|vault)://"}
    metrics: {type: object, description: "verified_delivery_lead_time 实测值"}
reflection_contract:
  enabled: true
  trigger: on_completion
  questions:
    - "交付是否完全满足 input_contract 的验收标准?"
    - "CI 是否全绿, 有无跳过的测试?"
    - "下次交付可以优化什么 (lead time, 质量, 自动化)?"
  feedforward: true
checkpoints:
  - name: pre_merge
    require: human_approval
    timeout_hours: 48
    escalation: "notify:owner"
  - name: low_confidence
    require: human_review
    condition: "output.metrics.confidence < 0.8"
    timeout_hours: 24

# T7-01 Phase A: decision_outcome 采集管线(2026-08-22 就绪)
collection_pipeline:
  status: ready
  loop:
    - "omo external-resources consume-engineering-delivery --workflow-run-id <id> --stdin   # 机器记录供给侧"
    - "omo external-resources engineering-delivery-review-queue --workflow-run-id <id>      # 候选队列(只读)"
    - "omo external-resources submit-engineering-delivery-review --workflow-run-id <id> --delivery-id <id> --decision <adopted|reviewed|rejected> --principal-ref operator://<reviewer> --evidence-ref <ref>  # 人类裁决(HMAC 凭证)"
    - "omo external-resources engineering-delivery-shadow-observer --as-of <ts>            # 7 日窗口 qualified 计数"
  qualified_outcome_log: ".omo/_knowledge/workflow-mesh/engineering-delivery-decision-outcomes.jsonl"
  signing_key_env: COCKPIT_ENGINEERING_REVIEW_SIGNING_KEY
  value_indicator_policy: "本场景产出永不计入价值指标 (BET-Y1Q2-T7-01 non_goals)"

