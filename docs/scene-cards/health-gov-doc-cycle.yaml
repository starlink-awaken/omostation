notes:
- '实现: projects/domain-cartridges/health-gov/domain/health_gov/ (doc_pipeline/test_doc_pipeline)，零模型调用，纯本地确定性计算；PDF 经 `uv run --with reportlab` 拉取，缺失时显式抛错不伪造'
- 'assisted 校准证据 (2026-09-15, synthetic-seed): 36 例合成（18 有效 + 18 登记/版式缺陷：涉密/坏文号/缺主送/缺版记/短标题/缺正文），F1≥0.6；熔断类（无署名/退回无意见/退回后不可发出/非法跃迁）在 test_negatives 覆盖，不计入 F1 分子分母'
- '3 例 e2e 演练: 局发通知（拟办贯彻落实/王局长同意署名/PDF 导出）+ 跨部门函（加急 3 天/研提回复意见/赵副局长批阅）+ 会议纪要（3 事项→1 办结署名→督办单 1 overdue 置顶）'
- '批阅分流 (T7-07): 同意→approved 可 dispatch；退回→returned 不可 dispatch/导出；转办→registered 可重新拟办'
- 'GB/T 9704-2012 要素子集: 发文机关标志/发文字号（机关代字〔YYYY〕N号）/标题/主送机关/正文/全字成文日期/印章占位/版记（印发机关+日期）；缺任一要素阻止导出并高亮条款'
- '涉密硬约束 (non_goals): secret/topsecret 来文在登记环节直接拒绝，不进入任何后续环节；外发网关复用 BET-Y1Q4-T4-06，不在本包重建'
- '样本性质声明: assisted 的 30-sample 门槛本版以 synthetic-seed 满足；真实场景 30-sample 待 follow-up bet 补齐后摘掉本标注'
