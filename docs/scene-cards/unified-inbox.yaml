- iris:apple_mail
- iris:netease_mailmaster
- iris:seeyon_oa
opportunity_window: 卫健委借调 + 国转中心日常多渠道消息处理窗口
external_resource_policy: proposal_only
downstream_refs:
- scene: document-review
  handoff: evidence://scene/unified-inbox/output:needs-review
  trigger: on_triage_flagged_review
- scene: engineering-delivery
  handoff: evidence://scene/unified-inbox/output:needs-execution
  trigger: on_triage_flagged_execute
