title: Health Visit Scene Card (就诊结果记录)
status: draft
type: scene-card
owner: product-architecture
last-reviewed: 2026-08-26
related:
- ./health-visit-prep.yaml
---
schema: scene-card/v2
bet: BET-Y1Q4-T8-04
falsifier: "若 30 天内无 health 类任务触发，则场景无实际价值"
scene_id: health-visit
journey_id: health-medical-workflow
goal: 就诊结束后记录诊断/处方/医嘱, 形成就诊结构化档案
trigger: 人工触发 (就诊完成后录入或口述转写)
input_contract: 就诊结果描述 (诊断/处方/医嘱/复查要求, 文本口述均可)
result_contract: 就诊档案 (diagnosis/prescription/followup_required) + records_received 布尔判定
outcome_metric: health_visit_capture_completeness
consumer: xiamingxing
approver: business-governance
owner: xiamingxing
failure_cost: 处方/复查要求遗失导致用药或复诊中断
data_classification: confidential
data_scope: local-health-ledger-only
operator: health-visit-dispatch-under-human-review
required_capabilities:
- llm:local-classify
- storage:local-health-ledger
notes:
- 'P1 契约先行: 实现属 P2; 医嘱中的复查时间节点为 health-archive 提取追踪的输入'
- '风险边界: L0 记录动作; 涉及向医院/医生发送任何信息属 L2 (send_email:doctor)'
