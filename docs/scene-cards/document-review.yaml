goal: 将公文草稿生成、格式检查、敏感项检查和依据核验放进同一条可审计、可退回的决策旅程
trigger: 公文起草/审查需求进入确认队列 (来源: 卫健委借调 / 国转中心 / 日常公文)
input_contract: 具备主题、时间、接收对象、核心内容四要素的公文任务引用 (evidence:// 或 vault://redacted/)
result_contract: 包含草稿、格式检查、敏感项审查、依据核验、人工退回记录的 Workflow Mesh 证据
outcome_metric: review_cycle_hours
consumer: document-owner-and-reviewer
approver: business-governance
owner: xiamingxing
failure_cost: 公文格式/敏感项/依据错误外发，造成返工、合规风险或决策延误
data_classification: internal
data_scope: redacted-document-references-and-governed-review-evidence
operator: document-review-agent-under-human-review
permission_ref: permission://scene/document-review
