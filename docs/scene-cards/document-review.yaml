      enum:
      - format_check
      - sensitive_check
      - basis_verify
      - full_review
output_schema:
  type: object
  required:
  - status
  - review_result_ref
  properties:
    status:
      type: string
      enum:
      - succeeded
      - failed
      - needs_revision
      - needs_human
    review_result_ref:
      type: string
      pattern: ^(evidence|vault)://
    issues_found:
      type: array
      description: 格式/敏感/依据问题列表
reflection_contract:
