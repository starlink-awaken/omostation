  - iris:netease_mailmaster  # 网易邮箱大师 3 账号公文
  - iris:seeyon_oa           # 致远 OA 待办公文 (CDP 9222)
  - kairon.sophia            # 方法编译 (公文规范: 国资委13号令)
  - gbrain.evals             # 评测 (公文质量)
channel_binding:
  knowledge_source:
    - iris:apple_mail
    - iris:netease_mailmaster
    - iris:seeyon_oa
rollback_plan: evidence://scene/document-review/rollback
sample_refs:
  - vault://redacted/document-review/sample-1
  - vault://redacted/document-review/sample-2
  - vault://redacted/document-review/sample-3
notes:
