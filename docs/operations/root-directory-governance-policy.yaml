---
last-reviewed: 2026-10-11
---

version: 1
scope: workspace-root

# Root directories that are ignored by Git but are legitimate runtime,
# cache, generated, or local-machine surfaces. Any other ignored root
# directory is treated as an unregistered shadow surface.
allowed_ignored_dirs:
  - .artifacts
  - .codebase-memory
  - .claude
  # AI CLI 工具的工作目录 (与 .claude / .crush / .qoder 同性质)。
  # .claude-flow 放 harness-active-policy.json 与 policy/, 属本机策略面。
  - .claude-flow
  - .commandcode
  - .crush
  - .deepeval
  - .idea
  # .kilo 是 Kilo CLI 的工作树根 (61MB, 含 node_modules + worktrees)。
  - .kilo
  # LADS 是 agora 的缓存面 (agora_cache/), 与 .omc 同性质。
  - LADS
  - .omc
  - .openclaude
  - .pytest_cache
  - .qoder
  - .ruff_cache
  - .serena
  - .subtrees
  - .venv
  - .worktrees
  # zvec_grep MCP server 的本地缓存与 daemon 日志 (Claude Code 的 mcp server,
  # 配置在 ~/.claude.json 的 "zvec_grep" 条目下)。是活跃服务: 日志实时写入
  # (healthz 轮询约 5.2 次/秒), 不能删。与 .codebase-memory / .serena / .claude
  # 同性质 —— 外部工具产物但在本仓根下运行, 故显式注册, 否则被判
  # "ignored-unregistered" 目录卫生违规。2026-10-06 纳入。
  - .zvec-grep
  # 2026-10-11 补登: 2e3e270d1 已将下列数据/产物目录加入 .gitignore (防误入库),
  # 但未同步本政策 → 被判 ignored-unregistered 目录卫生违规。同日补齐。
  - _archive
  - .benchmarks
  - apps
  - external
  - logs
  - agent-runtime
  - artifacts
  - archive-*
  - config
  - data
  - kos
  - locks
  - runtime
  - scratch
  - spaces

# Local client/tool surfaces are intentionally ignored, but must remain
# explicitly named with an owner and lifecycle. A new ignored root must not
# be hidden by adding a broad wildcard here.
local_surfaces:
  .claude:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: Claude session and client-local metadata
  .crush:
    owner: workspace-tooling
    class: client-cache
    lifecycle: disposable
    reason: Crush client cache and local state
  .idea:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: IntelliJ project metadata
  .omc:
    owner: governance-team
    class: runtime-state
    lifecycle: disposable
    reason: OMC session/runtime state excluded from the root repository
  .qoder:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: Qoder client metadata
  .deepeval:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: DeepEval client cache and local state
  .codebuddy:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: Codebuddy editor metadata and local lock files
  .openclaude:
    owner: workspace-tooling
    class: client-metadata
    lifecycle: local
    reason: OpenClaude client metadata and local state
  ecos:
    owner: ecos-team
    class: compatibility-checkout
    lifecycle: transient
    reason: Legacy local checkout surface; canonical code lives in projects/ecos
  _archive:
    owner: workspace-tooling
    class: archive
    lifecycle: local
    reason: Root-level archive of retired data (gitignored by 2e3e270d1 to prevent accidental commits)
  .benchmarks:
    owner: workspace-tooling
    class: benchmark-output
    lifecycle: local
    reason: Local benchmark run outputs (pytest-benchmark and similar tooling artifacts)
  apps:
    owner: workspace-tooling
    class: local-app-surface
    lifecycle: local
    reason: Local app data/checkouts not meant for the main repo (gitignored by 2e3e270d1)
  external:
    owner: workspace-tooling
    class: external-surface
    lifecycle: local
    reason: External/third-party data surfaces kept out of git (gitignored by 2e3e270d1)
  logs:
    owner: workspace-tooling
    class: runtime-logs
    lifecycle: local
    reason: Root-level runtime log output (gitignored by 2e3e270d1; canonical logs live in runtime/logs)

rules:
  untracked_non_ignored: fail
  ignored_not_registered: fail
  tracked_missing_governance_entry: warn
