  - projects/omo/uv.lock
  - projects/agora/pyproject.toml
  - projects/agora/uv.lock
  - .omo/_knowledge/retros/BET-Y1Q2-T1-06.md
  pasw_required: true
  depends_on:
  - BET-Y1Q2-T1-05
  risk_level: L2
  human_gate: false
  circuit_breaker: >-
    超 3 天或核心受支持的公共路由需要真实业务副作用、DDL、新项目、硬依赖环、或无法
    物理拦截时，停止并保持 BET 未完成；绝不声称 schema/decorator-only 完成。推迟的
    极端边界是诚实债务，不是阻断器
  retro: required
