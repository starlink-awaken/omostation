  - collect 严格绑定 BET/spec/packet/assignment/admission/dispatch/receipt/diff/claims；越权、 篡改、缺 receipt 时无 EvidenceRecorded/WorkflowVerified。
  - 独立 verifier 重放声明命令；只有 accept 写 WorkflowVerified；executor 自验、同一 receipt 篡改和 input ack 均拒绝。
