  - 新建 scheduler、task database、Workflow Mesh 状态机、Ledger DDL、Cockpit UI 或第二 adapter
  - 准入 Claude/OpenCode/Grok/MiMo/AGY/Kilo，做自动模型选择、账号切换、fallback 或额度调度
  - 多租户、跨主机、恶意同机隔离、exactly-once、自动 merge/promotion 或业务外部副作用
