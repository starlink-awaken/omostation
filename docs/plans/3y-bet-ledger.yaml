  - projects/omo/src/omo/resident/monitor.py 实现 register_with_daemon(alert handler safe) + publish_monitor(增量读 observability→critical/degraded→alert
    事件→统一事件流→deliver)
  - daemon.py _register_default_handlers 增补 monitor/heartbeat 模块 + run_daemon per-role publish hook (tick_once 后 publish)
  - 'resident-routes.yaml 新增 alert→alert / system.alive→heartbeat 两条规则 (safe: true)'
