  - dispatch 必须在人工批准后才产生 request/admission/StepDispatched；结果只称 `transport_accepted`。
  - 一次真实 supervised Codex R1 非 marker 变更在同一 Orca terminal 经用户手点确认；未点击时 稳定保持 awaiting_human_action，点击后产生有效 model output、实际
