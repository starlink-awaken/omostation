    Action.Succeeded 与 Human Outcome 完整关联时才成为系统价值候选，旧事件或未知来源显式归为 unknown
  - >-
    Human Outcome 支持 accept/edit/reject/defer/ignore，并可记录显式 review_duration_seconds 与
    estimated_time_saved_seconds；未提供时保持 null/unknown，不得推测或默认成 0
