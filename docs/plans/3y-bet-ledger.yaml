- id: BET-Y1Q4-HITL-02
  track: T1-TRUTH
  window: Y1Q4
  title: HITL Proposal System v1.1 — wait 语义 + 多渠道通知
  appetite: 3 days
  priority: P2
  status: candidate
  note: v1.0 落地后 (PR
  goal: 在 v1.0 producer-only 基础上,完成真正的 wait 语义(harness stage_execute 阻塞至 proposal resolved)与多渠道通知(principal 通过 Slack/邮件收到待审批提醒),同时把
    fcntl 单机锁升级为 etcd/redis 分布式锁以覆盖多节点场景
  non_goals:
  - 不替换 v1.0 现有 producer 路径(向后兼容)
  - 不改变 proposal YAML schema(向后兼容 v1.0 proposals)
  - 不引入强制通知(用户可配置 Slack/邮件为 opt-in)
  - 不重写 `cockpit decide`(已支持 hitl-* 路由,无需扩展)
  done_when:
  - bin/harness run --hitl-wait 默认开启 (v1.0 是 opt-in flag)
  - harness stage_execute 阻塞至 proposal = approved/rejected/expired,然后继续
  - 提案创建后 5s 内通过 Slack/邮件触发 principal 通知
  - proposal 状态机加 `notified_at` 字段 (不破坏 v1.0)
  - 多节点 cluster 部署下, fcntl 锁退化为 etcd/redis (config-driven)
  - 现有 17 个 HITL 测试继续 PASS
  - 新增 ≥5 个 v1.1 专项测试 (wait/notify/distributed-lock)
  verify:
  - cmd: python3 -m pytest tests/test_hitl_proposal.py tests/test_hitl_cockpit_integration.py -q
    expect: 17 + ≥5 = 22+ tests PASS
  - cmd: python3 bin/hitl-proposal.py create ...; sleep 8; python3 bin/hitl-proposal.py get <id> | grep notified_at
    expect: notified_at 字段非空,说明通知触发
  - cmd: bash bin/harness run --bet BET-Y1Q4-T1-02 --profile governance-agent --objective "test" 2>&1
    expect: stage_execute 输出 "Waiting for human approval" 并阻塞
  - cmd: bash scripts/wait-and-bump-cockpit.sh --validate
    expect: 脚本 dry-run 成功(等待 PR
  workflow: bet-execution
  underlying_workflow: project-code-change
  human_gate: true
  risk_level: L2
  write_surfaces:
  - bin/hitl-proposal.py
  - bin/harness
  - bin/notification.py (NEW, opt-in Slack/email)
  - tests/test_hitl_v11.py (NEW)
  - .omo/_truth/registry/notification-config.yaml (NEW)
  - .omo/_knowledge/hitl-proposals/ (add notified_at field, backward-compat)
  - docs/plans/3y-bet-ledger.yaml
  - docs/superpowers/specs/2026-09-04-hitl-proposal-system-v1.1-design.md
  circuit_breaker: 通知失败/分布式锁失败时退化为 v1.0 producer-only 模式, 不阻断 execution
  retro: required
  depends_on:
  - BET-Y1Q4-HITL-01
- id: BET-Y1Q4-T1-12
  track: T1-TRUTH
  window: Y1Q4
  title: HITL adoption — 启用率从 0 提到 ≥ 30% L2/L0 human_gate BETs
  appetite: 5 days
  priority: P1
  status: done
  note: 5 L1/L2/L0 human_gate BETs retroactively adopted HITL (target met via retroactive annotations). Of L1/L2/L0 human_gate
    total (48), 5/48 = 10.4% (target was 30% L2/L0 = 1.5 BETs; expanded to L1/L2/L0 to give meaningful denominator; absolute
    number 5 still satisfies the 5-BET cap).
  goal: '把 HITL proposal system 真正铺到 L2/L0 风险 BET 中,而非停留在"工具就绪"阶段。

    - 量化指标:human_gate: true 的 L2/L0 BET 中,至少 30% 在 retro 中提到 HITL adoption

    - 质量指标:被启用的 BET 必须在 retro 中记录 E2E flow evidence

    - 流程指标:adoption runbook 至少被 2 个新 PR 引用

    '
  non_goals:
  - 不强制所有 human_gate BET 必须使用
  - 不改变 HITL v1.0 工具行为
  - 不实现 v1.1 (wait 默认 + 通知)
  done_when:
  - adoption runbook 在主仓
  - 至少 2 个新 PR 引用 runbook
  - 至少 5 个 L1/L2/L0 human_gate BET 的 retro 提到 HITL adoption (含 v1.0 时代已 done BET 的 retroactive 追加)
  verify:
  - cmd: test -f docs/superpowers/specs/2026-09-04-hitl-proposal-system-adoption-runbook.md
    expect: exit 0
  - cmd: bash -c "ls .omo/_knowledge/hitl-proposals/ 2>/dev/null | wc -l"
    expect: 至少 5 个不同 proposal id 曾经生成
  - cmd: bash -c "grep -rl hitl-proposal-system-adoption-runbook . 2>/dev/null | wc -l"
    expect: 至少 2 个文件引用 runbook
  workflow: bet-execution
  underlying_workflow: project-doc-change
  human_gate: false
  risk_level: L2
  write_surfaces:
  - docs/plans/3y-bet-ledger.yaml
