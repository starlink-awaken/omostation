  appetite: 3 days
  priority: P0
  status: done
  goal: 消除"根仓记录 / 本地检出 / 子模块 main"三方漂移, 使工作树验证结论可信; 并解除因门禁先于存量上线造成的主干阻塞
  non_goals:
  - 子模块内部代码修改
  - 分支合并
  evidence:
    E5_gate_before_cleanup_blocks_trunk:
      观察: 门禁先于存量清理上线, 导致全仓任何提交都被拦
      实测: 702e5ee71 落地 CR-SUBMODULE-REWIND(ADR-0380) 后立刻检出 18 个子模块指针回退(aetherforge/agora/bus-foundation/c2g/cockpit/ cockpit-ui/ecos/family-hub/gbrain/kairon/l4-kernel/metaos/model-driven/
        observability/omo/omo-debt/runtime/scripts)
      后果: 该检查是仓库级前置门, 与本次变更无关的提交(如仅改 2 个 docs/bin 文件) 同样被拦; 主干进入「任何人提交不了」状态, 只能靠逃生口
      判断: 顺序反了。门禁应在存量清零后启用, 或先以 warning 上线、 给出清理期限后再转 fail
  done_when:
  - git status --short 无 M/m 子模块条目
  - 每个子模块本地 HEAD == 根仓 gitlink SHA
  - 18 个 rewind 存量清零, CR-SUBMODULE-REWIND 在干净状态下通过
  - CI 增加 submodule-pointer-drift 门禁, 漂移则失败
  - '新门禁上线规程: 存量未清零前只能以 warning 上线, 不得直接 fail'
  verify:
  - cmd: git status --short | grep -E '^ ?[Mm] projects/' | wc -l
    expect: '0'
  - cmd: python3 bin/submodule-gitlink-check.py
    expect: exit 0
  - cmd: git commit --allow-empty -m probe && git reset --soft HEAD~1
    expect: exit 0 (主干未被 rewind 门阻塞)
  workflow: bet-execution
  underlying_workflow: submodule-pointer-close
  write_surfaces:
