- id: BET-Y1Q1-T1-08
  track: T1-TRUTH
  window: Y1Q1
  title: 子模块指针快速更新机制 (bump-fast)
  appetite: 2 days
  priority: P1
  status: done
  done_at: 2026-08-15
  done_evidence: bump-fast 已实现 (ls-remote + cacheinfo + registry 同步), 计时测试 0.07s, 测试全绿
  goal: 用 git cacheinfo 操作替代全量 submodule update 来更新单个子模块指针，在不牺牲可达性校验的前提下把单次指针更新耗时从近百秒降到亚秒级，直接缩短 D2 分支占用锁的持有时间
  non_goals:
  - 批量指针更新的自动触发（属 BET-Y1Q2-T1-20）
  - 修改 PASW 机制本身
  - 改变子模块的实际内容/代码
  done_when:
  - bin/gac/gac-worktree.sh bump-fast <submodule-path> [--sha <sha>|--latest-main] 落地，默认 --latest-main 取该子模块远端 main 分支当前 tip
  - 写入 cacheinfo 前必须完成可达性校验（ls-remote 确认目标 SHA 在该子模块远端 main 可达），校验失败时 fail-closed 拒绝写入并给出明确错误信息
  - 操作不触碰目标子模块的工作树/.git/modules/<sub>/HEAD，对 PASW 覆盖的子模块（gbrain/cockpit/agora）同样适用且不需要额外 PASW 隔离
  - 若目标子模块在 docs/project-registry.yaml 中有对应 version 字段，bump-fast 运行时同步更新该字段，避免指针与 registry 版本号不一致（历史上出现过 omlxc registry 显示
    3.0.0a1 而 origin/main 已到 3.0.13 的真实案例）
  - 单次操作端到端耗时（不含 claim/commit 流程本身）< 2 秒，有可重跑的计时测试佐证
  - 仍然走标准 D2/D3 claim-before-commit 流程，不绕过治理；文档写清楚这是流程内的加速手段，不是绕过治理的捷径
  verify:
  - cmd: time bash bin/gac/gac-worktree.sh bump-fast projects/omlxc --latest-main
    expect: 完成耗时 < 2s（不含 claim 开销），退出码 0
  - cmd: 故意传入一个不在远端 main 上可达的 SHA 测试
    expect: fail-closed 拒绝，非 0 退出码，报错信息说明不可达
  - cmd: 校验 docs/project-registry.yaml 对应字段与新指针版本一致
    expect: 一致
  - cmd: uv run --with pyyaml python bin/plan/bet-ledger.py lint
    expect: 无新增 error
  workflow: bet-execution
  underlying_workflow: project-code-change
  write_surfaces:
  - bin/gac/gac-worktree.sh
  - bin/gac/**
  - docs/project-registry.yaml
  - docs/plans/3y-bet-ledger.yaml
  pasw_required: false
  depends_on:
  - BET-Y1Q1-T1-02
  risk_level: L2
  human_gate: false
  circuit_breaker: 超 appetite×1.5 未完成可达性校验这一核心安全项 → 停下汇报，不得先上线一个没有校验的 "裸快速通道"
  retro: required
