  track: T1-TRUTH
  window: Y1Q1
  title: 并发写冲突止血 — 共享主树禁写 + PASW 全覆盖
  appetite: 2 days
  priority: P0
  status: done
  goal: 阻止并发 agent 在共享 main worktree 上互相清理未入库产物, 并消除 claim 僵尸锁死锁
  done_at: 2026-08-07
  done_evidence: 'git-shim fail-closed (T1-04) 拦截 agent 危险操作; 锁心跳+僵尸锁检测+prune-locks (lifecycle.py); AGENTS.md 共享主树只读红线; 9
    个新测试全通过

    '
  non_goals:
  - 重构 gac-worktree
  - 改变 PASW 隔离子模块集
  - 修 lane 分类规则(属 T1-04)
  evidence:
    E1_shared_tree_writable:
      观察: 共享主树可写, agent 可直接 git clean / reset --hard
      实测: 一小时内 HEAD 四变 (847375f0 → 7d7ffdaa → 5dff6900 → 42f23676), 分支在 main / work/governance-phase9 / -dimension / -phase10
        间切换, 未入库文件被清理 4 次; git reset --hard 连暂存区一起摧毁
      永久损失: bin/ssot/journey-runner.py(601行) / scene-card-lifecycle.py / validate-scene-card-v2.py / docs/scene-cards/v2/(5文件)
        / Plans/v10-*.md(4份)
      缺口: ADR-0371 PASW 只隔离 gbrain/cockpit/agora 三个子模块的 gitlink, 未禁止 agent 在共享主树上直接工作
    E2_claim_not_atomic:
      观察: claim 失败路径非原子, 留下僵尸 path 锁
      实测: claim 先写 path_<path>.lock.yaml, 再删 run_*.update.lock 时崩溃, path 锁残留; 例 path_docs_plans_AGENT-BRIEF.md.lock.yaml (run
        d04c2601, created 04:44:13, 早于后续 run 的 04:46:52)
      后果: 下一个 agent claim 同路径被拒, 只能等 24h TTL; 且报错不区分「活锁」与「上次失败留下的僵尸锁」
      影响面: 多 agent 并行下的常见死锁源, 无自愈路径
    E4_escape_hatch_opt_in:
      观察: 逃生口机制完备但 opt-in, raw git 可完全绕过
      机制现状: bin/gac/swarm-git 是 wrapper, commit/push 前跑 escape-check, 校验 SWARM_ESCAPE_ID 是否在 swarm-coordination.yaml::escape_hatch_exemptions
        白名单内(当前 3 条), 通过则写台账 .omo/_delivery/swarm-escape/<ts>-<id>.json
      缺口: wrapper 非强制。直接 `git commit --no-verify` 即绕过 escape-check, 白名单不校验、台账不落盘、审计链断
      实测: 2026-08-06 提交 49d3ffed5 用 raw git commit --no-verify, escape_id `ledger-evidence-unrelated-to-submodule-rewind`
        不在白名单, .omo/_delivery/swarm-escape/ 无对应记录
      判断: 纪律若依赖「记得用 wrapper」则不是强制而是约定; 多 agent 下约定必然被破
    E6_commit_dropped_by_branch_rewrite:
      观察: D0(git add/commit) 不足以保住产物, 共享分支被 rewrite 时提交会脱离
      实测: 49d3ffed5 提交成功后, work/governance-phase12-fields 被并发 agent rebase/reset 重写, 该提交不再是 HEAD 的祖先; commit 对象仍可 git show,
        但工作树与分支历史里内容全部消失
      损失: T1-00/T1-04 的 evidence 段 + bet-ledger.py lint 增强 + YAML 引号修复
      判断: 在共享分支上, commit 只是「暂时安全」。真正的持久化下限是 tag 或独立分支(ref 不随分支重写而消失)
    E16_sandbox_can_create_but_not_delete:
      观察: agent sandbox 对 .git/ 有写权限但无删除权限, git 的锁协议因此必然残留
      实测: 'touch .git/_probe  → OK

        rm -f .git/_probe  → Operation not permitted

        git 的锁协议是「建 .lock → 干活 → unlink」, 第三步永远失败,

        一次 git status 在 17 个子模块留 17 个僵尸 index.lock,

        此后该仓库任何 git 写操作直接失败

        '
      误判过程: 2026-08-06 全天把由此产生的异常判断为「并发 agent 在删我的文件」, 据此写了 E1 的部分结论并设计了 D0 三段式。D0 本身仍成立(E6 独立支持), 但 E1 里「文件被清理 4 次」中至少 2
        次实为本因, 归因错误
      规避: 只读操作加 GIT_OPTIONAL_LOCKS=0; 写操作一律交人类终端执行
      判断: '工具自身的能力边界会伪装成环境问题。

        agent 报告「环境有并发干扰」时, 先验证自己的工具链在该环境下的完整性,

        再归因外部。这是 D1(声明 vs 事实)在「自我能力」维度上的投影, 原 D1 未覆盖

        '
    E17_ci_inline_script_blind_spot:
      观察: CI 配置文件里的内联脚本, YAML 合法不代表脚本能跑, 常规校验查不出
      实测: ".github/workflows/agora-ci.yml 在 main 与 phase13 两侧都有 deploy-smoke job,\n唯一差异是 Smoke assertions 里的内联 Python 写法:\n\
        \  main(b02d67899 20:45 starlink-awaken)  单行 python3 -c '...'      → 实测 PASS\n  phase13(47e48755d 20:57 xiamingxing)\
        \   多行缩进 python3 -c \"...\"  → IndentationError\n两个版本都是合法 YAML, yamllint 全过; 只有真把那段 Python 喂给解释器才暴露\n"
      成因: phase13 在原版落地 12 分钟后做纯格式美化, 把可跑的改成跑不了的, 无人执行验证
      影响面: 本仓 .github/workflows/ 下所有 run 块里的内联 python/node 都在此盲区内
      判断: '语法检查验的是「能不能解析」, 不是「能不能跑」。

        同类还有 bash -n 查不出全角字符紧跟变量名(本轮实测命中 3 次)。

        凡「解析得过、执行才炸」的构造, 必须有一条真正执行它的验证路径

        '
  done_when:
  - 所有 agent 必须在 gac-worktree claim 出的隔离树内工作, 共享 main 树只读
  - git clean / reset --hard / stash -u 在 hook 层要求 SWARM_ESCAPE_ID
  - AGENTS.md 记录"共享主树只读"红线
  - claim 写锁改为原子(先写临时文件再 rename), 或失败时回滚已写的 path 锁
  - 锁文件记录 last_heartbeat, 提供 stale-lock 检测与一键清理命令
  - claim 被拒时的报错区分「活锁(持有者在跑)」与「僵尸锁(上次失败残留)」
  - raw git commit/push --no-verify 被 hook 层拦截, 强制走 bin/gac/swarm-git
  - 共享分支 rewrite 前须检查是否会丢弃他人提交; 或禁止在共享分支上 rebase/reset
  - 'D0 铁律升级: 交付物 commit 后须打 tag 或推独立分支, 仅 commit 不算持久化'
  verify:
  - cmd: make worktree-guard
    expect: exit 0
  - cmd: grep -c '共享主树只读\|shared-main-readonly' AGENTS.md
    expect: '>= 1'
  - cmd: uv run --with pyyaml python bin/agent-workflow.py status --locks
    expect: 能列出 stale 锁并给出清理命令
  - cmd: ls .omo/_delivery/agent-workflows/locks/run_*.update.lock 2>/dev/null | wc -l
    expect: 0  (无残留 update 锁)
  - cmd: SWARM_ESCAPE_ID=bogus git commit --no-verify --allow-empty -m probe
    expect: 非 0 (raw git 逃生被拦)
  workflow: bet-execution
  underlying_workflow: governance-state-mutation
  write_surfaces:
  - AGENTS.md
  - bin/gac/**
  - .githooks/**
  - projects/omo/src/omo/workflow/lifecycle.py
  pasw_required: false
  depends_on: []
