    --approve-for-me --ephemeral --ignore-user-config --json； 共享/linked workspace 在启动前拒绝
  - secret/proxy/SSH/AWS/GitHub 环境不传入子进程；超时执行 process-group TERM→KILL→wait；非零、 malformed/empty JSONL、marker 不匹配、cleanup 或
    receipt 失败均非成功
