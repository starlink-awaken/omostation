- id: BET-Y1Q4-HITL-01
  track: T1-TRUTH
  window: Y1Q4
  title: HITL Proposal System — harness 层人类审批提案生成与 Cockpit 集成
  appetite: 2 days
  priority: P1
  status: candidate
  done_at: 2026-09-04 14:30:00+00:00
  note: Delivered in PR
  goal: Build a standalone HITL proposal system that auto-generates approval proposals when a BET has human_gate=true, stores
    them as atomic YAML files, and integrates with cockpit decide commands for human approval. The agent-workflow execute
    stage waits for approval before proceeding; expired proposals auto-downgrade to direct execution (circuit breaker).
  non_goals:
  - 不替换现有 agent-workflow 的 claim/verify 流程
  - 不改变现有 BET 状态机
  - 不实现自动审批 (必须人工)
  - 不引入数据库依赖 (file-based storage only)
