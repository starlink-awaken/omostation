  - bin/hitl-proposal.py 支持 create/list/get/approve/reject/expire/check 七个子命令
  - Proposal YAML 原子写入 (.omo/_knowledge/hitl-proposals/<id>.yaml)
  - bin/harness stage_execute 在 human_gate=true 时自动创建 proposal
  - cockpit decide list 显示 pending HITL proposals
  - cockpit decide approve/reject 更新 HITL proposal 状态
  - 24h TTL 过期自动降级为 direct execution
  - 8 单元测试全部通过
  verify:
  - cmd: python3 bin/hitl-proposal.py --help
    expect: exit 0
  - cmd: python3 -m pytest tests/test_hitl_proposal.py -q
    expect: exit 0, 8/8 PASS
  - cmd: make gac-local-gate
    expect: 全绿
  workflow: bet-execution
  underlying_workflow: project-code-change
  human_gate: true
  risk_level: L2
