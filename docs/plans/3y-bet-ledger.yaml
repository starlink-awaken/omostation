  window: Y1Q3
  title: resident monitor/heartbeat 空转治理 (角色私有 tick 接线)
  appetite: 0.5 day
  priority: P1
  status: done
  done_at: '2026-08-26'
  started_at: '2026-08-26'
  goal: '消除 monitor/heartbeat 角色每 2min 纯空转: 三缺口叠加(daemon 未注册 alert/heartbeat handler + resident-routes.yaml 无 system.health/governance:gate_failed/alert/heartbeat/system.alive
    规则 + 统一事件流无 monitor/heartbeat 事件类型, observability 平面 456 条 258 critical 从未进事件流)。本次把 monitor/heartbeat 升级为角色私有 tick(publish→路由→处理):
    新建 omo.resident.heartbeat(register_with_daemon 注册 heartbeat handler safe + publish_heartbeat 调 status.snapshot 生成 system.alive→追加统一事件流→路由→沉淀
    .omo/state/resident-heartbeat.jsonl 活性台账) + omo.resident.monitor(注册 alert handler safe + publish_monitor 增量读 observability
    severity∈{critical,degraded}→生成 alert 事件→追加统一事件流→路由→调 alert-connectors deliver 外发复用 T10-14 alert.py) + daemon _register_default_handlers
    增补两模块 + run_daemon per-role publish hook(tick_once 后 publish, 本 tick 消费上一 tick 发布, 2min 节律) + resident-routes.yaml 新增
    alert→alert/system.alive→heartbeat 两规则 + cron 移除 CRON_ALERT(--dry-run) 告警外发统一 monitor 承担 + 真实外发挂账 ALERT_WECOM_WEBHOOK(T10-14
    第 5 条, 先接线不配 URL)。'
