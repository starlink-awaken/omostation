    moves the retained source to durable recovery.
  - The 1.0.0 Workspace runtime purge is recorded honestly; CLI DB online backup, native seed, surviving payload, settings,
    and manifest are durable before the purged open inode is released.
  - Documents consumer audit remains green and a stable full-tree L4 audit no longer fails from ZCode directory mutation.
