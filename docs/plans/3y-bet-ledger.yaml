  - projects/omo/src/omo/sovereignty/enforcement.py
  - projects/omo/src/omo/omo_ledger.py
  - projects/omo/tests/test_sovereignty_policy_enforcement.py
  - projects/omo/tests/integration/test_w2_03_capability_enforcement.py
  - projects/agora/src/agora/mcp/policy_enforcement.py
  - projects/agora/src/agora/middleware/middleware.py
  - projects/agora/src/agora/server/tools_bos/registration.py
  - projects/agora/src/agora/server/tools_bos/routing.py
  - projects/agora/src/agora/mcp/resolver/api.py
  - projects/agora/src/agora/mcp_proxy/manager.py
  - projects/agora/src/agora/mcp/mcp_stdio_bridge.py
  - projects/agora/tests/test_pep_integration.py
