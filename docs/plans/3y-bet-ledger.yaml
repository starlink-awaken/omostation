meta:
  schema_version: bet-portfolio/v2
  horizon: 2026H2-2029
  total_bets: 311
  windows:
  - Y1Q1
  - Y1Q2
  - Y1Q3
  - Y1Q4
  - Y2Q1
  - Y2Q2
  - Y2Q3
  - Y2Q4
  - Y3H1
  - Y3H2
  status_enum:
  - candidate
  - pending
  - in_progress
  - review
  - done
  - blocked
  - failed
disciplines:
  D0_committed_or_undelivered:
    rule: 任何交付物在 git add 之前不算交付
    check: git ls-files --error-unmatch <每个 deliverable>
    origin: '2026-08-06 实测两次事故 — journey-runner.py / scene-card v2 / v10 plans 从未 tracked, 工作树在 20 分钟内被并发 agent 清理两次 (847375f0
      -> 7d7ffdaa -> 5dff6900), 无 blob 可恢复

      '
    severity: red
  D1_no_proxy_metric:
    rule: 采集不到的指标显示"未接入", 禁止用代理量顶替
    origin: X3 交付指标用文件 mtime 冒充业务交付
    severity: red
  D2_surface_accounting:
    rule: 每个 bet closeout 必须报告净增减行数/文件数/规则数
    check: python3 bin/plan/bet-ledger.py surface
    severity: red
  D3_claim_before_write:
    rule: 先 claim 后写; 未 claim 的写面视为越权
    check: python3 bin/plan/bet-ledger.py claim-check <bet-id>
    severity: red
  D4_workflow_mandatory:
    rule: 走 ADR-0203 需求迭代 workflow, 先 start 再改文件
    check: uv run --with pyyaml python bin/agent-workflow.py start <workflow> --profile <p> --objective <bet-id>
    severity: red
  D6_metric_not_harmfully_optimizable:
    rule: 任何指标在设立前必须回答「最便宜的达标路径是什么」, 若那条路径有害则指标不成立
    check: 设指标时人工反问; 已知有害路径写进 non_goals
    origin: "2026-08-06 复盘发现自设的三个减法指标全部可被有害优化 —— ① 「代码 ≤69万行」不分 src/test, 删测试(占33%)是最便宜路径; ② 表面积扫文件系统, 建/删 PASW worktree(占旧基线33%)就能大幅波动;\
      \ ③ 「GaC ≤80 条」不分 advisory/required, 删最无害的 105 条 advisory 最容易,\n   而真正有成本的 26 条 required 反而留下。\n三者与本项目最初批评的 X3 mtime\
      \ 指标是同一个病 —— 用代理量冒充真实量。\n"
    corollary: 每个数量目标都要配一个「保护量」, 例如 src 可减但 test 不得降
    severity: red
  D5_retro_before_done:
    rule: 无 retro 不得置 done
    check: python3 bin/plan/bet-ledger.py retro-due
    severity: gray
tracks:
  T1-TRUTH:
    title: 真相与止血
    scope: 指标口径 / 子模块指针 / 目标 SSOT / 项目归并判定 / 年度门
    primary_write_surfaces:
    - .omo/state/**
    - .omo/goals/**
    - bin/mof/**
    - docs/**
    pasw_required: false
    default_workflow: governance-state-mutation
    agent_profile_hint: governance-agent
  T2-PERCEPT:
    title: 感知面
    scope: 信号源注册 / iris 轮询 / 去重幂等 / 健康可见降级
    primary_write_surfaces:
    - .omo/_truth/registry/signal-sources.yaml
    - projects/knowledge/kairon/packages/iris/**
    - projects/agora/**
    pasw_required: true
    default_workflow: external-adapter-sync
    agent_profile_hint: adapter-agent
  T3-COGNI:
    title: 认知面 / 心智模型
    scope: MOS agent_belief 三表 / SceneWatcher 有状态化 / 自主性阶梯 / 跨场景学习
    primary_write_surfaces:
    - projects/knowledge/kairon/packages/mos/**
    - projects/omo/src/omo/scenewatcher.py
    - projects/omo/src/omo/model_router.py
    pasw_required: false
    default_workflow: project-code-change
    agent_profile_hint: engineering-agent
  T4-OUTCOME:
    title: 结果面
    scope: AdjudicationRecorded 事件 / 裁决存储 / calibration 回填 / 评测集
    primary_write_surfaces:
    - projects/omo/src/omo/omo_event.py
    - .omo/_delivery/outcomes/**
    - projects/cockpit/src/cockpit/web/**
    pasw_required: true
    default_workflow: project-code-change
    agent_profile_hint: engineering-agent
  T5-ORCH:
    title: 编排硬化
    scope: durable timer / 回退语义 / fork-join / Mesh 状态机落地
    primary_write_surfaces:
    - projects/ecos/**
    - projects/omo/src/omo/workflow/**
    - bin/ssot/journey-runner.py
    pasw_required: false
    default_workflow: project-code-change
    agent_profile_hint: engineering-agent
  T6-SUBTRACT:
    title: 减法 / 表面积压缩
    scope: GaC 规则 / ADR 分层 / 脚本清理 / 合成场景归档 / 项目归并
    primary_write_surfaces:
    - '**'
    pasw_required: true
    default_workflow: governance-state-mutation
    agent_profile_hint: governance-agent
  T6-EVOLUTION:
    title: 演化 / 自治能力进化
    scope: 技能结晶 / 影子沙箱 / 责任归因 / 动态算力 / god-module 拆分收尾
    primary_write_surfaces:
    - bin/**
    - projects/**
    - .agents/skills/**
    pasw_required: true
    default_workflow: bet-execution
    agent_profile_hint: governance-agent
  T7-SCENE:
    title: 场景
    scope: scene-card schema / 五档生命周期 / 三锚点场景迭代
    primary_write_surfaces:
    - docs/scene-cards/**
    - bin/ssot/scene-card-*.py
    pasw_required: false
    default_workflow: project-doc-change
    agent_profile_hint: docs-agent
  T8-SURFACE:
    title: 人机界面
    scope: /inbox /outcomes /signals /journeys 面板
    primary_write_surfaces:
    - projects/cockpit-ui/**
    - projects/cockpit/src/cockpit/web/**
    pasw_required: true
    default_workflow: project-code-change
    agent_profile_hint: engineering-agent
  T9-OBSERV:
    title: 可观测性收官
    scope: 统一事件面常态化 / 告警到人 / Langfuse trace / RED 指标 / cockpit 聚合
    primary_write_surfaces:
    - bin/ssot/observability-events.py
    - bin/ssot/log-rotate.py
    - bin/gac/alert-router.py
    - projects/agora/src/agora/**
    - projects/cockpit/src/cockpit/web/**
    pasw_required: false
    default_workflow: governance-state-mutation
    agent_profile_hint: governance-agent
  T10-MATURITY:
    title: 成熟度收官 (scorecard 0-10, target 9.0)
    scope: 'maturity-scorecard 口径对齐 / 治理 bet 绑定 / resident promote + 事件源管线 / gaC 机制自进化 (G10 三方口径: scorecard/health/台账)'
    primary_write_surfaces:
    - bin/gac/maturity-scorecard.py
    - bin/plan/bet-ledger.py
    - bin/plan/chain_bind.py
    - bin/gac/check-*
    - bin/ssot/install-resident-cron.sh
    - docs/plans/3y-bet-ledger.yaml
    - projects/omo/src/omo/resident/**
    pasw_required: false
    default_workflow: governance-audit
    agent_profile_hint: governance-agent
concurrency:
  max_parallel_bets: 4
  exclusive_tracks:
  - T6-SUBTRACT
  conflict_pairs:
  - - T3-COGNI
    - T4-OUTCOME
  - - T3-COGNI
    - T5-ORCH
  - - T4-OUTCOME
    - T8-SURFACE
  pasw_isolated_subs:
  - projects/knowledge/gbrain
  - projects/cockpit
  - projects/agora
  claim_protocol:
  - bash bin/gac/gac-worktree.sh claim <session>
  - uv run --with pyyaml python bin/agent-workflow.py start <workflow> --profile <profile> --objective <bet-id>
  - uv run --with pyyaml python bin/agent-workflow.py claim <run-id> --path <each write surface>
  release_protocol:
  - 'git add <所有 deliverable>   # D0 铁律, 先于 verify'
  - uv run --with pyyaml python bin/agent-workflow.py verify <run-id> --from-diff --execute
  - make agent-workflow-closeout RUN_ID=<run-id>
  - bash bin/gac/gac-worktree.sh submit <session>
retro:
  bet_level:
    when: 每个 bet 置 done 前 (D5 强制)
    path: .omo/_knowledge/retros/<bet-id>.md
    questions:
    - Q1 实际耗时 vs appetite? 超出比例?
    - Q2 done_when 是否全部通过? 哪条没过, 为什么?
    - Q3 过程中发现的与 plan 不符的事实 (打假)?
    - Q4 净增减: 代码行 / 文件 / GaC 规则 / ADR / 脚本? (D2)
    - Q5 下一个认领本 track 的 agent 需要知道什么?
  weekly:
    when: 每周五
    owner: 各 track owner agent
    output: .omo/_knowledge/retros/weekly/<YYYY-Www>.md
    must_answer:
    - 本周哪条建议真的省了时间? 哪条是噪音?
    - 表面积本周净增减?
    - 有无 bet 超 appetite 1.5x 未触发熔断?
  quarter_gate:
    when: 每季度末
    owner: human
    output: .omo/_knowledge/retros/gates/<window>.md
    action: 决定下季度 bet 是否启动 / 场景升降档 / 关停
  annual_gate:
    when: Y1 2027-07 / Y2 2027-12 / Y3 2029-06
    owner: human
    check: 愿景证伪条件
    action: 继续 / 收窄 / 关停
gates:
  Y1Q1:
    question: 过去一周系统看到了多少条来自真实工作的信号?
    pass: weekly_external_signals > 0
    on_fail: Q2 只启动 T6 减法轨, 其余全部推迟
  Y1Q2:
    question: 这个月我接受了系统几条建议? 改了什么?
    pass: monthly_accepted >= 4 AND edit_diff_recorded == true
    on_fail: 场景全部降回 shadow, 补 T4 结果面
  Y1Q3:
    question: 归并后行数是否 < 50 万? MOS 是否唯一读写路径?
    pass: knowledge_loc < 500000 AND mos_sole_path_weeks >= 8
    on_fail: 回滚归并, Y2 重试
  Y1Q4:
    question: 表面积是否达标?
    pass: code_loc <= 1100000 AND adr_active <= 120 AND gac_rules <= 80
    on_fail: Y2 不启动扩展, 继续做 Y1
  Y2Q4:
    question: 修订率是否较 Y1 基线下降 >= 20%?
    pass: edit_rate_drop >= 0.20 AND weekly_accepted >= 5
    on_fail: 愿景证伪 — 转纯知识管理工具或关停
  Y3H2:
    question: 三年终局三条是否同时成立?
    pass: weekly_accepted >= 5 AND acceptance_rate >= 0.40 AND edit_rate_drop >= 0.40 AND surface <= 0.70
    on_fail: 收窄至单场景维持
