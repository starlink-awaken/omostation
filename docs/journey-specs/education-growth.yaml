schema: journey-spec/v1
journey_id: education-growth
description: "教育追踪 → 进度评估 → 辅导建议 → 成长记录"
states:
  - name: school_notices_received
    scene: child-education
    next: [progress_tracked]
  - name: progress_tracked
    scene: child-education
    next: [assessed, needs_attention]
  - name: assessed
    scene: child-education
    next: [growth_recorded]
  - name: needs_attention
    scene: child-education
    next: [growth_recorded]
    checkpoint:
      require: human_review
      condition: "progress.status == declining"
      timeout_hours: 48
  - name: growth_recorded
    scene: knowledge-curation
    next: []
transitions:
  - from: school_notices_received
    to: progress_tracked
    condition: "notices.count > 0"
  - from: progress_tracked
    to: assessed
    condition: "progress.status == on_track"
  - from: progress_tracked
    to: needs_attention
    condition: "progress.status == declining"
  - from: assessed
    to: growth_recorded
    condition: "always"
  - from: needs_attention
    to: growth_recorded
    condition: "review.completed == true"
