schema: journey-spec/v1
journey_id: health-improvement
description: "健康追踪 → 趋势分析 → 异常预警 → 改善建议"
states:
  - name: data_collected
    scene: health-tracking
    next: [trend_analyzed]
  - name: trend_analyzed
    scene: health-tracking
    next: [anomaly_checked, stable]
  - name: anomaly_checked
    scene: health-tracking
    next: [alert_sent, knowledge_captured]
    checkpoint:
      require: human_review
      condition: "anomaly.severity == high"
      timeout_hours: 24
  - name: alert_sent
    scene: health-tracking
    next: [knowledge_captured]
  - name: stable
    scene: health-tracking
    next: []
  - name: knowledge_captured
    scene: knowledge-curation
    next: []
transitions:
  - from: data_collected
    to: trend_analyzed
    condition: "metrics.count > 0"
  - from: trend_analyzed
    to: anomaly_checked
    condition: "trend.anomaly_detected == true"
  - from: trend_analyzed
    to: stable
    condition: "trend.anomaly_detected == false"
  - from: anomaly_checked
    to: alert_sent
    condition: "anomaly.severity != high"
  - from: anomaly_checked
    to: knowledge_captured
    condition: "anomaly.resolved == true"
