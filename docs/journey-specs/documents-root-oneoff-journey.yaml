schema: journey-spec/v1
status: active
journey_id: documents-root-oneoff-journey
description: "根一次性运行时隔离 完整流程"
owner: governance-team
created: 2026-08-30
tags: [documents, quarantine]

states:
  - name: detected
    scene: documents-root-oneoff
    description: "检测到需要处理的 documents 任务"
    next: [preflight]

  - name: preflight
    scene: documents-root-oneoff
    description: "预检查：审计 + 消费者收据 + 哈希计算"
    next: [executing, failed]
    checkpoint:
      require: consumer_receipt_ok
      timeout_hours: 2

  - name: executing
    scene: documents-root-oneoff
    description: "执行 quarantine 操作"
    next: [verified, rollback]
    checkpoint:
      require: hash_verified
      timeout_hours: 4

  - name: verified
    scene: documents-root-oneoff
    description: "验证完成，证据已记录"
    next: [value_recorded]

  - name: value_recorded
    scene: documents-root-oneoff
    description: "价值已记录，反馈到进化引擎"
    next: [complete]

  - name: failed
    scene: documents-root-oneoff
    description: "执行失败"
    next: [complete]

  - name: rollback
    scene: documents-root-oneoff
    description: "已回滚到初始状态"
    next: [complete]

  - name: complete
    scene: documents-root-oneoff
    description: "旅程完成"
    next: []
