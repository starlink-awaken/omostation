schema: journey-spec/v1
journey_id: admin-notification-workflow
title: 行政通知处理全流程 (9步闭环)
status: draft
version: 3
created: 2026-08-09
owner: xiamingxing
note: >
  2026-08-25 schema 修复: 嵌套 transitions(states[].transitions) 改规范形
  (顶层 transitions + states[].next)。修复前 runner 读不到顶层 transitions,
  任何状态 next 为空 → 恒误判 Terminal, --live 实测卡死在 received。
  referenced scenes (admin-inbox etc.) 仍不在 docs/scene-cards, dispatch 走 fallback。
description: >
  上级通知 → 分类 → 转发 → 收集 → 汇总 → 审阅 → 迭代 → 提交.
  由 mail-daemon 触发, risk_engine 安全检查, 人审批后执行行动.

trigger:
  type: mail_classified_as_task
  source: mail_daemon

states:
  - name: received
    scene: admin-inbox
    next: [classified]
  - name: classified
    scene: admin-classify
    next: [forwarding, compiling]
  - name: forwarding
    scene: admin-forward
    next: [collecting]
  - name: collecting
    scene: admin-collect
    next: [compiling]
  - name: compiling
    scene: admin-compile
    next: [reviewing]
  - name: reviewing
    scene: admin-review
    next: [submitted]
  - name: submitted
    scene: admin-submit
    next: []

transitions:
  - from: received
    to: classified
    condition: "has_task == true"
  - from: classified
    to: forwarding
    condition: "requires_forwarding == true"
  - from: classified
    to: compiling
    condition: "requires_forwarding == false"
  - from: forwarding
    to: collecting
    condition: "email_drafts_created == true"
  - from: collecting
    to: compiling
    condition: "status == succeeded"
  - from: compiling
    to: reviewing
    condition: "report_compiled == true"
  - from: reviewing
    to: submitted
    condition: "status == succeeded"
