agent_workflows:
- id: project-doc-change
  description: Keep documentation changes executable, SSOT-safe, and verifiable.
  channels:
  - agent_workflow
- id: project-code-change
  description: Route code changes through project-local verification and workspace
    governance gates.
  channels:
  - agent_workflow
- id: pyright-sweep
  description: Route cross-package pyright and ruff debt cleanup through a bounded,
    test-backed convergence loop.
  channels:
  - agent_workflow
- id: governance-state-mutation
  description: Force state-plane changes through OMO/C2G broker paths instead of ad-hoc
    file writes.
  channels:
  - agent_workflow
- id: c2g-spec-ingress
  description: Convert BMAD/OpenSpec/Pitch inputs into governed OMO planned tasks.
  channels:
  - agent_workflow
- id: mof-model-change
  description: Route M1/M2/M3 model edits through schema validation, state bridge
    audit, drift checks, and MOF version evidence.
  channels:
  - agent_workflow
- id: mof-state-bridge-audit
  description: Read-only audit of MOF schema health, M1/M2 coverage, and OMO task
    bridge alignment.
  channels:
  - agent_workflow
- id: external-adapter-sync
  description: Keep BMAD, OpenSpec, beads, gstack, and Superpowers wired as optional
    inputs or discipline layers without making them SSOT authorities.
  channels:
  - agent_workflow
- id: submodule-pointer-close
  description: Close project submodule work without dangling root pointers or unreachable
    SHAs.
  channels:
  - agent_workflow
- id: handoff-resume
  description: Persist enough workflow state that another agent or a compressed session
    can continue.
  channels:
  - agent_workflow
- id: observer-audit
  description: Read-only oversight for workflow runs, locks, ledger events, and handoff
    evidence.
  channels:
  - agent_workflow
- id: state-sync
  description: Refresh high-churn runtime projections through the OMO state-sync broker
    instead of ad-hoc agent writes.
  channels:
  - agent_workflow
- id: governance-audit
  description: Execute systemic governance health scan, write-ownership check, brief
    generation, and SSOT alignment.
  channels:
  - agent_workflow
- id: agent-onboarding
  description: Register a new AI agent in the workspace, including profile registration,
    MCP connection setup, BOS URI discovery, and first workflow lifecycle run.
  channels:
  - agent_workflow
notes:
- BOS status=unimplemented/deprecated are excluded from agora routing by default (see
  projects/agora/src/agora/mcp/resolver/bos_registry.py).
- Use cockpit bos list --all to inspect non-routable YAML rows.
- 'Minimum external-agent tool belt: see docs/operations/external-agent-attach-card.md'
