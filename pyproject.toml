[project]
name = "runtime"
version = "0.1.0"
description = "eCOS Runtime Layer — L1 service registry, health monitoring, and protocol management"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.11.2",
    "croniter>=6.2.2",
    "fastapi>=0.128.8",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pytest>=8.4.2",
    "pyyaml",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
    # LLM Gateway — provided by aetherforge-gateway
    # import: from llm_gateway.detection import detect_backends
    "aetherforge-gateway",
]

[project.scripts]
runtime = "runtime.cli:main"
ecos-matrix-scheduler = "runtime.scheduler:main"
ecos-bus-consumer = "runtime.bus_consumer:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aetherforge-gateway = { path = "../aetherforge/packages/gateway" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--tb=short"]
