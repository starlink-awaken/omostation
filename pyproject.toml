[project]
name = "runtime"
version = "0.1.0"
description = "eCOS Runtime Layer — L1 service registry, health monitoring, and protocol management"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
runtime = "runtime.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
