[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecos"
version = "0.8.0"
description = "eCOS — 认知层：SSB 签名链、涌现度量、认知监控"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dashboard = []  # Dashboard/MOF BOS features use HTTP/MCP or fallback instead of direct agora import

[project.scripts]
# SSB — 签名链操作 (通过 cockpit ssb 调用)
# 入口已收敛: ecoss-ssb → cockpit ssb

# Dashboard / Scheduler
ecos-dashboard = "ecos.cli.dashboard:main"
ecos-scheduler = "ecos.cli.scheduler:main"
ecos-watchdog = "ecos.cli.watchdog:main"

# Workflow engine (通过 cockpit workflow 调用)
# 入口已收敛: ecos-workflow → cockpit workflow

# MCP Server (含 workflow MCP tools) — 由 Agora gateway 管理
ecos-mcp = "ecos.mcp_server:main"

# MOF 元模型工具链 (通过 cockpit mof 调用)
# 入口已收敛: mof → cockpit mof

# 稳定 ruff 配置 — 默认规则集 (E/F/W), 不收紧已有代码
[tool.ruff.lint]
ignore = ["E501", "E402"]
per-file-ignores = {"tests/*" = ["N806"]}

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.hatch.build.targets.wheel]
packages = ["src/ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
