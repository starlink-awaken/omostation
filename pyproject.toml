[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecos"
version = "0.8.0"
description = "eCOS — 认知层：SSB 签名链、涌现度量、认知监控"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dashboard = []  # Dashboard/MOF BOS features use HTTP/MCP or fallback instead of direct agora import

[project.scripts]
# SSB — 签名链操作
ecos-ssb = "ecos.l0.ssb.ssb_client:main"
ecos-ssb-init = "ecos.l0.ssb.ssb_init:main"
ecos-ssb-dump = "ecos.l0.ssb.ssb_dump:cli_main"

# Dashboard / Scheduler
ecos-dashboard = "ecos.cli.dashboard:main"
ecos-scheduler = "ecos.cli.scheduler:main"
ecos-watchdog = "ecos.cli.watchdog:main"

# MOF 元模型工具链
mof = "ecos.ssot.tools.mof:main"
mof-validate = "ecos.ssot.tools.mof-validate:main"
mof-audit = "ecos.ssot.tools.mof-audit:main"

# 新增 MOF 子工具
mof-workflow = "ecos.ssot.tools.mof-workflow:main"
mof-entity = "ecos.ssot.tools.mof-entity:main"
mof-model = "ecos.ssot.tools.mof-model:main"
mof-verify = "ecos.ssot.tools.mof-verify:main"
mof-trail = "ecos.ssot.tools.mof-trail:main"
mof-bos = "ecos.ssot.tools.mof-bos:main"
mof-enforce = "ecos.ssot.tools.mof-enforce:main"
mof-sla = "ecos.ssot.tools.mof-sla:main"
mof-bootstrap = "ecos.ssot.tools.mof-bootstrap:main"
mof-capability = "ecos.ssot.tools.mof-capability:main"
mof-bos-watch = "ecos.ssot.tools.mof-bos-watch:main"
mof-register-tasks = "ecos.ssot.tools.mof-register-tasks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
