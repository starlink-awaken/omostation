[project]
name = "omostation-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[project.scripts]
# Note: bin/ssot scripts are invoked directly via python3 bin/ssot/<script>.py
# due to hyphenated filenames not being valid Python module identifiers.
# These entries serve as documentation of CLI entry points.

# 根仓 ruff 配置 — 全局统一 lint select (2026-08-17 收敛)
# 统一标准: select=[E,F,W,I,N,UP,S,PLE,RUF100], ignore=安全豁免集
# 与 cockpit/aetherforge/metaos/l4-kernel/model-driven 5 项目一致 (已验证全过)
# [project] 最小表: 消 uv "No requires-python" warning (CI test_agent_workflow
# doctor 断言被该 warning 击穿, #1640/#1633/#1647 三轮实证)。不定义 dependencies,
# 各子模块各自 pyproject 不受影响。
[dependency-groups]
# 2026-10-10: 根仓 tests/ 的真实运行依赖(此前靠手工 uv pip install, 环境重建即崩——
# pytest 基线 6 个 collection error 的根因)。与 [project] 刻意零依赖的决策正交:
# dependency-groups 只影响 uv sync --group test 的开发环境, 不进发布依赖。
test = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "rich",
    "pydantic",
    "httpx",
    "fastapi",
    "fastmcp",
]

[tool.ruff]
exclude = ["bin/_archive", "projects", "tools"]
target-version = "py313"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF100", "B006"]
ignore = ["S101", "S603", "S607", "S108", "S110", "S112", "S310", "S314", "S608", "S602", "S103", "S105", "S605", "S324", "S104", "E402", "E501", "SIM115", "N813", "UP047", "F401", "F841", "N806", "W291", "W292", "E741", "RUF100", "S311", "N999", "UP022", "E722", "S102"]
[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
