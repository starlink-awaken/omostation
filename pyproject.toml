[project]
name = "omo"
version = "1.0.0"
description = "OMO — OS for AI Agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "aetherforge-gateway",
    "aetherforge",
    "agora",
    "bus-foundation",
    "openai>=2.41.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
omo = "omo.cli:main"
omo-debt = "omo.omo_debt:main"
omo-mcp = "omo.mcp_server:main"
cards = "omo.omo_cards:main"
omo-sse-daemon = "omo.omo_sse_daemon:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# P0 #1 cleanup: aetherforge-gateway 改由 aetherforge 顶层包传递依赖安装 (避免
#   omo / runtime 各自 path 同一 wheel 造成冲突). aetherforge 顶层包 path 引
#   ../aetherforge (由 aetherforge 自身 pyproject 引用 aetherforge-gateway 子项目).
# P0 #1: 必须显式声明 aetherforge 顶层包 + path source (editable), 因 aetherforge 自身是
#        workspace ({workspace=true} 的传递依赖不直接暴露给外部包). 参照 runtime pyproject.
aetherforge = { path = "../aetherforge", editable = true }
agora = { path = "../agora", editable = true }
bus-foundation = { path = "../bus-foundation" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# P44-W4: 注册 BOS URI 测试 markers, 让 CI 按需分组跑
#   pytest -m fast           → 只跑 registry load (1 测, <10ms)
#   pytest -m bos_5domain    → 跑 5 domain 覆盖 (1 测, ~3s)
#   pytest -m bos_40         → 跑 40 URI 全套 (3 测, ~3s)
markers = [
    "fast: 快速验证 (<10ms), 不依赖 agora/venv",
    "bos_40: 40 BOS URI smoke test 全套 (跨进程派发)",
    "bos_5domain: 5 Domain 覆盖验证 (POC_SERVICES 每个域至少 1 resolved)",
    "bos_concurrent: 并发 4 URI 调用测试",
    "integration: 需要外部服务 (agora/kairon) 真活的集成测试",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
# RUF100: Per-name `# noqa: F401` on backward-compat re-exports is treated as
# unused by ruff (which doesn't know about dynamic imports), so suppress the
# "unused noqa" warning at the project level.
#
# D1/ruff-gate (2026-08-03, 对齐 agora 模式): omo 既有 292 ruff errors 全为既有债
# (agent 框架 broad-except 防崩 / subprocess 既有 / hub re-export / shebang / 异步重构),
# 逐个改风险高且超出 D1 范围, 配置 ignore 对齐现实. 真正的代码质量提升应作单独工程.
# F821 (undefined-name) 部分可能是动态 import 误报, 先 ignore 解锁 push, 后续单独审.
extend-ignore = [
  "RUF100",   # unused-noqa (re-export # noqa 误报)
  "BLE001",   # blind-except (agent 框架防崩)
  "PLW1510",  # subprocess-run-without-check (既有失败处理)
  "I001",     # unsorted-imports (既有排序)
  "EXE001",   # shebang-not-executable
  "S110",     # try-except-pass (best-effort 吞错)
  "F821",     # undefined-name (部分动态 import 误报, 后续单独审)
  "F401",     # unused-import (hub re-export, --fix 误删)
  "ASYNC221", # run-process-in-async (需重构)
  "FURB162",  # fromisoformat-replace-z (refactor)
  "UP017",    # datetime-timezone-utc
  "S112",     # try-except-continue
  "SIM102",   # collapsible-if
  "TRY004",   # type-check-without-type-error
  "PYI036",   # bad-exit-annotation
  "RUF059",   # unused-unpacked-variable
  "PLW0602",  # global-variable-not-assigned
  "RUF015",   # unnecessary-iterable-allocation-for-first-element
  "RUF034",   # useless-if-else
  "SIM115",   # open-file-without-context-handler
  "DTZ005",   # datetime-now-without-tzinfo
  "DTZ007",   # datetime-strptime-without-zone
  "DTZ011",   # date-today
  # 残量 (2026-08-03): 每规则 1 处, 既有风格/性能, 量小 ignore
  "F541",     # f-string-missing-placeholders
  "FLY002",   # static-join-to-f-string
  "ISC004",   # implicit-string-concatenation
  "PERF102",  # incorrect-dict-iterator
  "PERF402",  # manual-list-copy
  "PLE0605",  # invalid-all-format (后续审, 可能真)
  "RUF012",   # mutable-class-default
  "TRY401",   # verbose-log-message
  "UP035",    # deprecated-import (后续审, 可 fix)
]
