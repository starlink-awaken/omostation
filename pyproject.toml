[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockpit"
version = "0.5.0"
description = "Cockpit — 统一研究驾驶舱 (CLI + Web UI) — 工作区入口与研究对象管理"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "夏铭星"}]
keywords = ["research", "workspace", "knowledge-management", "cli", "cockpit", "ui"]

dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0.3",
    # BET-Y1Q4-T8-03: GB/T 9704-2012 DOCX + 16:9 PPTX rendering
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "httpx>=0.28.0",
    "fastapi[standard]>=0.128.8",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.49.0",
    "agora>=3.0.0",
    "omo",
    "omo",  # ADR-0412: omo-debt 引擎内包 omo._vendored
    "l4-kernel",
    "model-driven",
    "metaos",
    "ecos",
    "bus-foundation",
    "kairon-observability",
    "kos",
    "psutil",
]

[project.optional-dependencies]
web = []  # Web UI lives in web/ (TypeScript), no Python deps needed
tui = [
    "textual>=0.80.0",
    "watchfiles>=0.20.0",
]  # 极客 TUI 终端交互控制台 (cockpit tui)


[project.scripts]
cockpit = "cockpit.cli:main"
agent-runtime = "cockpit.agent_runtime_cli:main"
cockpit-mcp = "cockpit.agent_runtime_mcp_server:main"  # Workspace/Cowork MCP stdio server
cockpit-documents-mcp = "cockpit.documents_read_mcp_server:main"  # Bounded remote Documents read surface
cockpit-dashboard = "cockpit.dashboard_server:main"  # Web dashboard
cockpit-compass = "cockpit.commands.compass:main"

[project.urls]
Homepage = "https://github.com/starlink-awaken/omostation"
Repository = "https://github.com/starlink-awaken/cockpit"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[tool.pytest.ini_options]
testpaths = ["src/cockpit/tests", "tests"]
pythonpath = ["src", "../runtime/src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF100"]
ignore = ["S101", "S603", "S607", "S108", "S110", "S314", "S608", "E402", "E501", "SIM115", "N813", "UP047", "F401"]  # F401: cli.py re-export (tests monkeypatch via cli.xxx), 跟 CI workflow --ignore F401 一致

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
# 仅声明未被直接依赖项目默认依赖树覆盖的 workspace 包：
# - model-driven 通过 omo/l4-kernel 解析
# - ecos / bus-foundation 通过 agora 解析
# - metaos 仅在 agora[admission] 中，需本项目的 source 覆盖
# 注: runtime 不是可构建包 (其 pyproject 仅 ruff 配置), 不作为 uv 依赖;
#     cockpit 对 runtime 的 import 通过 pytest pythonpath ../runtime/src (源码 namespace)
#     和 adapters/runtime.py 的优雅降级支撑。
agora = { path = "../agora", editable = true }
omo = { path = "../omo", editable = true }
l4-kernel = { path = "../l4-kernel", editable = true }
metaos = { path = "../metaos", editable = true }
kairon-observability = { path = "../knowledge/kairon/packages/kairon-observability", editable = true }
kos = { path = "../knowledge/kairon/packages/kos", editable = true }

[dependency-groups]
dev = [
    "fastmcp>=4.0.0b1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "rich>=14.3.4",
    "textual>=0.80.0",
]

[tool.pyright]
# Workspace deps resolve via editable installs at runtime, but pyright can't
# follow the .pth indirection; point it at the source trees so
# try/except-imported re-exports (omo/l4/model-driven/runtime/...) resolve
# instead of degrading to 177 "unknown import symbol" diagnostics.
extraPaths = [
  "../agora/src",
  "../omo/src",
  "../omo/src",
  "../l4-kernel/src",
  "../metaos/src",
  "../runtime/src",
  "../ecos/src",
  "../bus-foundation/src",
  "../model-driven/src",
  "../knowledge/kairon/packages/kairon-observability/src",
  "../knowledge/kairon/packages/kos/src",
]
