[project]
name = "runtime"
version = "1.0.0"
description = "eCOS Runtime Layer — L1 service registry, health monitoring, and protocol management"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "croniter>=6.2.2",
    "fastapi>=0.128.8",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
    # LLM Gateway + 路径常量 (P0 #1 runtime cleanup)
    # - aetherforge 顶层包提供 _paths 路径常量 (被 llm_gateway.pricing 引用)
    #   必须显式声明顶层包, 因 aetherforge 自身是 workspace, 传递依赖不直接暴露
    # - aetherforge-gateway 提供 llm_gateway (MCP + LLM provider 抽象)
    "aetherforge-gateway",
    "agora",
    "bus-foundation",
    "omo",
    "aetherforge",
]

[project.scripts]
runtime = "runtime.cli:main"
ecos-matrix-scheduler = "runtime.scheduler:main"
ecos-bus-consumer = "runtime.bus_consumer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]

[tool.uv.sources]
# P0 #1: aetherforge 顶层包 path 引用 (editable), 让 llm_gateway.pricing 的
#         `from aetherforge._paths` 解析成功. 不直接引 aetherforge-gateway
#         (由 aetherforge 顶层 dependencies 传递安装), 避免与 omo / model-driven
#         自身的 aetherforge-gateway path 冲突.
aetherforge = { path = "../aetherforge", editable = true }
agora = { path = "../agora", editable = true }
bus-foundation = { path = "../bus-foundation" }
omo = { path = "../omo", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--tb=short"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",  # starlette 1.3.1 TestClient 要求 (testclient.py: import httpx2)
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
